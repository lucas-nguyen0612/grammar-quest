* for a minute, please."},{"front":"lên xe / xuống xe = ?","back":"**get on** / **get off**: I got on the train. This is where I get off."},{"front":"break down (xe, máy) = ?","back":"hỏng: His car **broke down** on the way."},{"front":"fill in / hand in = ?","back":"điền vào (đơn) / nộp (= submit): Essays must be **handed in** by Friday."},{"front":"bring up · look after · let down = ?","back":"nuôi nấng (= raise) · chăm sóc · làm thất vọng: He **let** me **down**."}]},{"id":"07c","title":"Cụm động từ thông dụng (nhóm 2)","minutes":25,"goal":"Nhớ nghĩa và dùng được: turn on/off, turn up/down (âm lượng), put on, take off, try on · put off, set off, pick up, see off, turn up/show up · look up, run out of, turn down, take after, put up with.","pretest":[{"type":"mcq","q":"'Don't forget to **turn off** all the lights.' — turn off nghĩa là gì?","options":["tắt","mở","rẽ"],"answer":0,"explain":"turn off = tắt (đèn, máy móc…). Ngược lại là turn on.","src":"tr. 181"},{"type":"mcq","q":"'I'll **put off** my visit to Scotland till the weather is warmer.' — put off nghĩa là gì?","options":["hoãn lại","mặc vào","đặt xuống"],"answer":0,"explain":"put off = hoãn lại (= postpone, delay).","src":"tr. 178"}],"hook":{"icon":"📱","text":"Một buổi sáng của bạn bằng cụm động từ: **turn off** báo thức, **put on** áo, **set off** đi làm, chiều ra sân bay **see off** một người bạn… Nhóm hôm nay gắn với việc bạn làm hằng ngày. Mẹo: khi làm việc gì, nói thầm cụm động từ của việc đó — tay làm, miệng nói, nhớ lâu hơn."},"diagram":{"type":"table","title":"Cặp đối nghĩa nên học cùng","head":["Cụm","Nghĩa","Đối lại"],"rows":[["turn on","bật, mở (đèn, TV)","turn off: tắt"],["turn up","vặn to (âm lượng)","turn down: vặn nhỏ"],["put on","mặc, đội, mang vào","take off: cởi ra"],["pick up","đón (bằng xe)","see off: tiễn"],["turn up / show up","đến (= arrive)","—"],["turn down (lời mời)","từ chối (= refuse)","—"]]},"chunks":[{"title":"Bật, tắt, mặc, cởi","icon":"💡","rule":"**turn on / turn off** = bật / tắt; **turn up / turn down** = vặn to / vặn nhỏ; **put on / take off** = mặc vào / cởi ra; **try on** = mặc thử.","explain":"on gợi 'bật, gắn vào', off gợi 'tắt, rời ra' — nên các cụm này đi thành cặp trái nghĩa. put on còn nghĩa bật thiết bị (put on the kettle — bật ấm điện); take off còn nghĩa máy bay **cất cánh**. Với đại từ, nhớ quy tắc bài 07a: try **it** on, put **it** on.","examples":[{"en":"Don't forget to **turn off** all the lights when you go to bed.","vi":"Đừng quên tắt hết đèn khi đi ngủ."},{"en":"I **turned on** the television and watched the World News.","vi":"Tôi bật ti vi và xem tin thế giới."},{"en":"Could you **turn** that music **down** a little?","vi":"Bạn vặn nhỏ nhạc một chút được không?"},{"en":"He **took off** his coat when he entered the house and **put** it **on** again when he went out.","vi":"Anh ấy cởi áo khoác khi vào nhà và mặc lại khi ra ngoài."},{"en":"The plane **took off** into the night sky.","vi":"Máy bay cất cánh vào bầu trời đêm."},{"en":"I like this dress. Could I **try** it **on**?","vi":"Tôi thích cái đầm này. Tôi mặc thử được không?"}],"mistake":{"wrong":"Could I try on it?","right":"Could I try it on?","why":"try on tách rời được; đại từ it đứng giữa."},"tip":"**on** = bật / mặc vào · **off** = tắt / cởi ra.","src":"tr. 178, 180–181","check":{"type":"mcq","q":"It's cold outside. ___ your coat.","options":["Put on","Take off","Turn on"],"answer":0,"explain":"Trời lạnh → mặc áo vào = put on. take off là cởi; turn on dùng cho đèn, máy.","src":"tự soạn"}},{"title":"Giờ giấc, đi lại, đưa đón","icon":"🚗","rule":"**put off** = hoãn (postpone); **set off** = khởi hành; **pick up** = đón (bằng xe); **see off** = tiễn; **turn up / show up** = đến (arrive).","explain":"put off và set off chỉ khác một chữ nhưng nghĩa khác hẳn: put off là dời kế hoạch sang sau, set off là lên đường. pick up và see off là cặp đưa đón: đón ai thì pick **ai** up, ra ga/sân bay tiễn ai thì see **ai** off. turn up và show up dùng khi nói ai đó (có/không) đến — thân mật hơn arrive.","examples":[{"en":"I'll **put off** my visit to Scotland till the weather is warmer.","vi":"Tôi sẽ hoãn chuyến đi Scotland đến khi trời ấm hơn."},{"en":"I wanted to **set off** early to avoid the traffic jam.","vi":"Tôi muốn khởi hành sớm để tránh kẹt xe."},{"en":"I could **pick** you **up** at the end of the road.","vi":"Tôi có thể đón bạn ở cuối đường."},{"en":"My best friend Judy came to the airport to **see** me **off**.","vi":"Bạn thân Judy ra sân bay tiễn tôi."},{"en":"We arranged to meet at the station but she didn't **turn up**.","vi":"Chúng tôi hẹn gặp ở nhà ga nhưng cô ấy không đến."}],"mistake":{"wrong":"We put off early to avoid the traffic.","right":"We set off early to avoid the traffic.","why":"put off = hoãn; lên đường, khởi hành là set off."},"tip":"Đón = pick **up** (nhặt lên xe) · tiễn = see **off** (nhìn theo người đi).","src":"tr. 177–179, 181"},{"title":"Tra, hết, từ chối, giống, chịu đựng","icon":"🧠","rule":"**look up** = tra (từ điển); **run out of** = hết, cạn; **turn down** = từ chối (refuse); **take after** = giống (resemble); **put up with** = chịu đựng.","explain":"look up a word = tra một từ; với đại từ: look **it** up. run out **of** + thứ bị hết: run out of milk. turn down = từ chối lời mời, đề nghị: turned **it** down. take after dùng khi con cái giống cha mẹ. put up with là cụm ba thành phần nên không tách: put up with **him**.","examples":[{"en":"If you don't know what the word means, **look** it **up** in a dictionary.","vi":"Nếu không biết nghĩa từ này, hãy tra từ điển."},{"en":"I **ran out of** milk. Put some lemon in your tea instead.","vi":"Tôi hết sữa rồi. Bỏ ít chanh vào trà thay sữa nhé."},{"en":"He was offered £500 for the picture but he **turned** it **down**.","vi":"Có người trả 500 bảng mua bức tranh nhưng anh ấy từ chối."},{"en":"Daisy's really pretty. She **takes after** her mother.","vi":"Daisy thật xinh. Cô ấy giống mẹ."},{"en":"I'm surprised that she's **put up with** him for so long.","vi":"Tôi ngạc nhiên là cô ấy chịu đựng anh ta lâu đến thế."}],"mistake":{"wrong":"We ran out milk.","right":"We ran out of milk.","why":"Nói thứ gì bị hết → run out **of** + danh từ."},"tip":"turn **up** = đến · turn **down** = từ chối — nhưng với âm lượng thì up = to, down = nhỏ. Nhìn tân ngữ để đoán nghĩa.","src":"tr. 177–178, 180–181","check":{"type":"mcq","q":"Tom looks just like his father. He ___ his father.","options":["takes after","looks after","puts up with"],"answer":0,"explain":"Giống ai (về ngoại hình, tính cách) = take after (= resemble).","src":"tự soạn"}}],"practice":[{"type":"mcq","q":"Trái nghĩa với turn on là gì?","options":["turn off","turn up","turn into"],"answer":0,"explain":"turn on = bật, turn off = tắt.","src":"tr. 181"},{"type":"classify","q":"Nối mỗi cụm với nghĩa đúng:","buckets":["Hoãn","Khởi hành","Đến","Từ chối (lời mời)"],"items":[{"text":"put off","bucket":0},{"text":"set off","bucket":1},{"text":"turn up","bucket":2},{"text":"show up","bucket":2},{"text":"turn down","bucket":3}],"explain":"put off = hoãn; set off = khởi hành; turn up, show up = đến (= arrive); turn down = từ chối (= refuse).","src":"tr. 178–181"},{"type":"mcq","q":"Could you turn the TV ___ a little? I'm trying to sleep.","options":["down","up","on"],"answer":0,"explain":"Muốn ngủ → vặn nhỏ = turn down. turn up là vặn to, turn on là bật.","src":"tự soạn"},{"type":"fill","q":"I like these jeans. Can I ___ these jeans in the fitting room? (mặc thử)","answer":["try on"],"explain":"try on = mặc thử. Tân ngữ là danh từ (these jeans) nên đứng sau on được; nếu là đại từ thì phải nói try them on.","src":"tự soạn"},{"type":"fill","q":"We ___ at 5 a.m. to avoid the traffic. (khởi hành, quá khứ)","answer":["set off","set out"],"explain":"set off / set out = khởi hành. set có quá khứ giống nguyên mẫu: set.","src":"tr. 179"},{"type":"fill","q":"Oh no, we've ___ coffee. Can you buy some? (hết)","answer":["run out of"],"explain":"run out of + thứ bị hết. have + run (quá khứ phân từ của run là run).","src":"tự soạn"},{"type":"fill","q":"Lan ___ her mother — they have the same eyes and smile. (giống)","answer":["takes after"],"explain":"take after = giống (= resemble); chủ ngữ Lan số ít, hiện tại đơn → takes after.","src":"tự soạn"},{"type":"fix","wrong":"I don't know this word. I'll look up it.","answer":["I don't know this word. I'll look it up."],"explain":"look up tách rời được; đại từ it phải đứng giữa: look it up.","src":"tr. 177"},{"type":"fix","wrong":"We'll set off the meeting until next week.","answer":["We'll put off the meeting until next week.","We'll put the meeting off until next week."],"explain":"Hoãn cuộc họp = put off. set off là khởi hành.","src":"tự soạn"},{"type":"fix","wrong":"I can't put up him any more.","answer":["I can't put up with him any more.","I can't put up with him anymore."],"explain":"Chịu đựng = put up **with**, cụm ba thành phần, tân ngữ đứng sau with.","src":"tr. 178"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["My","friends","came","to","the","airport","to","see","me","off."],"explain":"see off = tiễn; đại từ me chen giữa: see me off.","src":"tr. 179"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["He","offered","me","a","job","but","I","turned","it","down."],"explain":"turn down = từ chối; đại từ it chen giữa: turned it down.","src":"tr. 180"}],"flashcards":[{"front":"turn on / turn off = ?","back":"bật / tắt (đèn, máy): **Turn off** the lights."},{"front":"turn up / turn down (nhạc, TV) = ?","back":"vặn to / vặn nhỏ: **Turn** that music **down**."},{"front":"put on / take off / try on = ?","back":"mặc vào / cởi ra (máy bay: cất cánh) / mặc thử: Could I **try it on**?"},{"front":"put off hay set off: hoãn cuộc họp?","back":"**put off** (= postpone). set off = khởi hành."},{"front":"pick up / see off = ?","back":"đón (bằng xe) / tiễn: I'll **pick you up**. Judy came to **see me off**."},{"front":"turn up / show up (người) = ?","back":"đến (= arrive): She didn't **turn up**."},{"front":"look up · run out of · turn down = ?","back":"tra (look it up) · hết (ran out of milk) · từ chối (= refuse)"},{"front":"take after · put up with = ?","back":"giống (= resemble) · chịu đựng: She **takes after** her mother."}]}],"quiz":{"pass":0.8,"questions":[{"type":"mcq","q":"(the old magazines) Chọn câu đúng:","options":["Throw them away.","Throw away them."],"answer":0,"explain":"Tân ngữ là đại từ (them) phải đứng giữa động từ và tiểu từ.","src":"tr. 170"},{"type":"mcq","q":"Cụm nào là cụm ba thành phần, không tách rời?","options":["put up with","turn off","pick up"],"answer":0,"explain":"put up with = put + up + with. turn off, pick up chỉ có hai thành phần.","src":"tr. 171, 178"},{"type":"mcq","q":"Cụm động từ thân mật cùng nghĩa với arrive là:","options":["turn up","turn on","turn down"],"answer":0,"explain":"turn up = đến (= arrive), dùng trong văn nói; arrive trịnh trọng hơn.","src":"tr. 169–170"},{"type":"mcq","q":"'The lights **went off** last night.' — went off ở đây nghĩa là gì?","options":["tắt","nổ","chua"],"answer":0,"explain":"go off có nhiều nghĩa; với đèn là tắt (với bom là nổ, với sữa là chua).","src":"tr. 169"},{"type":"classify","q":"Xếp theo cách đặt tân ngữ (theo ví dụ trong sách):","buckets":["Tách rời được","Không tách rời"],"items":[{"text":"try on","bucket":0},{"text":"let down","bucket":0},{"text":"turn down","bucket":0},{"text":"look after","bucket":1},{"text":"keep up with","bucket":1},{"text":"put up with","bucket":1}],"explain":"Sách: try it on, let me down, turned it down (tách được); looks after her sister, keep up with you, put up with him (không tách).","src":"tr. 170–180"},{"type":"mcq","q":"Từ nào thay được put off trong câu 'We put off the meeting'?","options":["postponed","cancelled","started"],"answer":0,"explain":"put off = postpone (hoãn). cancel là hủy hẳn — tương ứng với call off.","src":"tr. 172, 178"},{"type":"mcq","q":"I'm really ___ seeing my family again.","options":["looking forward to","looking for","looking after"],"answer":0,"explain":"Mong chờ = look forward to (+ V-ing). look for là tìm, look after là chăm sóc.","src":"tr. 176"},{"type":"fill","q":"The football match was ___ because of the rain. (hủy, bị động)","answer":["called off"],"explain":"call off = hủy (= cancel); bị động: was called off.","src":"tự soạn"},{"type":"fill","q":"Slow down! I can't ___ you. (theo kịp)","answer":["keep up with","catch up with"],"explain":"keep up with / catch up with = theo kịp, bắt kịp — cụm ba thành phần, tân ngữ đứng sau with.","src":"tr. 171–172, 176"},{"type":"fill","q":"He ___ smoking last year. (bỏ, từ bỏ — quá khứ)","answer":["gave up"],"explain":"give up = bỏ (= stop); quá khứ của give là gave.","src":"tự soạn"},{"type":"fill","q":"It's hot in here. Why don't you ___ your jacket? (cởi ra)","answer":["take off"],"explain":"Cởi áo = take off; mặc vào là put on.","src":"tự soạn"},{"type":"fill","q":"Who looks ___ your kids when you're at work? (chăm sóc)","answer":["after"],"explain":"look after = chăm sóc. look for là tìm.","src":"tự soạn"},{"type":"fix","wrong":"The music is too loud. Can you turn down it?","answer":["The music is too loud. Can you turn it down?"],"explain":"Đại từ it phải đứng giữa: turn it down.","src":"tự soạn"},{"type":"fix","wrong":"I'll pick up you at the station at 7.","answer":["I'll pick you up at the station at 7."],"explain":"pick up tách rời được; đại từ you đứng giữa: pick you up.","src":"tr. 177"},{"type":"fix","wrong":"We have run out milk.","answer":["We have run out of milk."],"explain":"Có thứ bị hết → run out **of** + danh từ.","src":"tr. 178"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["My","car","broke","down","on","the","way","home."],"explain":"break down = (xe) hỏng; nội động nên không cần tân ngữ.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["She","was","brought","up","by","her","grandmother."],"explain":"Bị động của bring up: was brought up by + người nuôi.","src":"tr. 172"}]}},{"id":"08-gioi-tu","title":"Giới từ","en":"Prepositions","icon":"📍","pages":"186–213","summary":"Giới từ (preposition) là từ nhỏ đứng trước danh từ, đại từ hoặc V-ing để nói **ở đâu, khi nào, đi đâu, bằng cách nào**. Tiếng Việt cũng có 'ở, trong, trên, vào', nhưng tiếng Anh chia nhỏ hơn: cùng chữ 'ở' có thể là at, on hoặc in. Chủ đề này dạy bạn chọn at/on/in cho nơi chốn và thời gian, các giới từ chuyển động, phương tiện, cụm cố định, và những giới từ 'dính' sau tính từ, danh từ, động từ (good at, reason for, depend on).","mindmap":{"label":"Giới từ","children":[{"label":"📍 Nơi chốn","children":[{"label":"at điểm / on mặt / in trong"},{"label":"under, next to, between…"}]},{"label":"⏰ Thời gian","children":[{"label":"at 5pm / on Monday / in May"},{"label":"for, since, by, until, during"}]},{"label":"🚶 Chuyển động & khác","children":[{"label":"into, across, along, through"},{"label":"by bus / on foot / with a key"},{"label":"on holiday, in the rain"}]},{"label":"🧲 Đi sau từ khác","children":[{"label":"Tính từ: good at, afraid of"},{"label":"Danh từ: reason for"},{"label":"Động từ: depend on"}]}]},"lessons":[{"id":"08a","title":"Giới từ chỉ nơi chốn: at, on, in và các bạn","minutes":25,"goal":"Chọn đúng at / on / in khi nói một vật hay một người ở đâu, và dùng được các giới từ vị trí thông dụng: under, over, next to, in front of, behind, opposite, between, among.","pretest":[{"type":"mcq","q":"She lives ___ Paris.","options":["at","on","in"],"answer":2,"explain":"Thành phố, quốc gia → **in**: in Paris, in Vietnam.","src":"tr. 188"},{"type":"mcq","q":"There is a picture ___ the wall.","options":["at","on","in"],"answer":1,"explain":"Bức tranh nằm trên **bề mặt** tường → **on** the wall.","src":"tr. 189"}],"hook":{"icon":"🗺️","text":"Hãy nghĩ tới Google Maps. Khi bạn **ghim một điểm** (bến xe, nhà bạn), đó là **at**. Khi bạn nhìn một **mặt phẳng** (mặt bàn, bức tường, trang giấy), đó là **on**. Khi một thứ bị **bao quanh** (trong phòng, trong hộp, trong thành phố), đó là **in**. Tiếng Việt chỉ cần nói 'ở', còn tiếng Anh bắt bạn chọn một trong ba hình ảnh này."},"diagram":{"type":"flow","title":"Chọn at, on hay in cho nơi chốn?","start":{"q":"Bạn hình dung nơi đó thế nào?","branches":[{"label":"Một điểm, điểm hẹn, nơi làm/học","to":{"result":"at: at home, at the station, at work","icon":"📌"}},{"label":"Một bề mặt","to":{"result":"on: on the table, on the wall","icon":"🟫"}},{"label":"Một không gian bao quanh","to":{"result":"in: in the room, in Hanoi, in Japan","icon":"📦"}}]}},"chunks":[{"title":"at = tại một điểm","icon":"📌","rule":"Dùng **at** khi xem nơi đó như **một điểm**: điểm hẹn, bến/ga, nhà ai đó, nơi làm việc, học tập, hoặc một sự kiện.","explain":"at không nói nơi đó to hay nhỏ, mà nói bạn **coi nó là một chấm** trên đường đi. Vì vậy cùng một thành phố: tàu dừng **at Frankfurt** (một điểm dừng), nhưng cô ấy sống **in Frankfurt** (bên trong thành phố). Các cụm hay gặp: at home, at work, at school, at the station, at the airport, at the door, at the corner, at the doctor's (phòng khám), at Sally's (nhà Sally), at a party, at a meeting, at a concert.","formula":"at + điểm / nơi làm, học / nhà ai / sự kiện","examples":[{"en":"I'm **at home** now.","vi":"Giờ tôi đang ở nhà."},{"en":"Let's meet **at the station**.","vi":"Mình gặp nhau ở nhà ga nhé."},{"en":"She is **at work** until 6.","vi":"Cô ấy ở chỗ làm đến 6 giờ."},{"en":"We met **at a party**.","vi":"Chúng tôi gặp nhau ở một bữa tiệc."},{"en":"I'm in home now.","ok":false,"note":"home đi với at"}],"mistake":{"wrong":"I'm in home.","right":"I'm at home.","why":"Dịch 'ở trong nhà' sang in, nhưng cụm cố định là **at home**."},"tip":"at = cái ghim trên bản đồ. Hỏi: 'Mình đang nói tới một điểm hẹn / điểm dừng phải không?' → at.","src":"tr. 186–188","check":{"type":"mcq","q":"Tối qua tôi đi dự tiệc: I was ___ a party last night.","options":["at","on","in"],"answer":0,"explain":"Có mặt tại một **sự kiện** (party, meeting, concert) → **at**.","src":"tr. 188"}},{"title":"in = bên trong","icon":"📦","rule":"Dùng **in** khi vật hay người **được bao quanh**: trong phòng, trong hộp, trong thành phố, quốc gia, trong sách báo, trong xe hơi/taxi.","explain":"in là hình ảnh cái hộp: có tường bao quanh. Các cụm hay gặp: in the kitchen, in the garden, in a box, in my pocket, in Hanoi, in Vietnam, in a queue (trong hàng), in the newspaper, in a photo, in a car, in a taxi. Không có mạo từ: **in bed / in hospital / in prison / in church** khi người đó ở đó đúng mục đích của nơi đó (nằm ngủ, nằm viện...). Tin tức 'trên báo' tiếng Anh nói **in** the newspaper, không phải on.","formula":"in + phòng, hộp, túi / làng, thành phố, nước / car, taxi","examples":[{"en":"Mum is **in the kitchen**.","vi":"Mẹ đang ở trong bếp."},{"en":"My cousin lives **in Japan**.","vi":"Anh họ tôi sống ở Nhật."},{"en":"I read about it **in the newspaper**.","vi":"Tôi đọc tin đó trên báo."},{"en":"He is **in hospital** with a broken leg.","vi":"Anh ấy đang nằm viện vì gãy chân."},{"en":"I read it on the newspaper.","ok":false,"note":"báo → in"}],"mistake":{"wrong":"She lives at Vietnam.","right":"She lives in Vietnam.","why":"Quốc gia, thành phố mình sống bên trong → **in**."},"tip":"Có 'tường bao quanh' (phòng, thành phố, biên giới quốc gia, thành xe hơi) → in.","src":"tr. 187–189"},{"title":"on = trên bề mặt","icon":"🟫","rule":"Dùng **on** khi vật nằm **trên một bề mặt** (bàn, tường, màn hình, trang giấy), với **số tầng**, và với **xe buýt, tàu, máy bay, xe máy, xe đạp**.","explain":"on là hình ảnh tiếp xúc với mặt phẳng: on the table, on the wall, on the screen, on page 10, on the map. Tầng nhà: on the fifth floor. Bên trái/phải: on the left, on the right. Phương tiện: tiếng Việt nói 'trên xe buýt' và 'trong xe hơi' cũng giống tiếng Anh: **on** a bus/train/plane/motorbike/bicycle, nhưng **in** a car/taxi.","formula":"on + bề mặt / tầng / bus, train, plane, bike","diagram":{"type":"table","title":"Phương tiện: in hay on?","head":["in","on"],"rows":[["in a car","on a bus / a train"],["in a taxi","on a plane / a ship"],["","on a motorbike / a bicycle"]]},"examples":[{"en":"Your phone is **on the table**.","vi":"Điện thoại của bạn ở trên bàn."},{"en":"Our office is **on the fifth floor**.","vi":"Văn phòng chúng tôi ở tầng năm."},{"en":"I'm **on the bus** now.","vi":"Tôi đang ở trên xe buýt."},{"en":"She's **in a taxi**.","vi":"Cô ấy đang ở trong taxi."},{"en":"Our office is in the fifth floor.","ok":false,"note":"tầng → on"}],"mistake":{"wrong":"The meeting room is in the third floor.","right":"The meeting room is on the third floor.","why":"Số tầng luôn đi với **on**."},"tip":"Xe nhỏ ngồi lọt thỏm (car, taxi) → in. Xe to bước lên được, hoặc xe mình ngồi lên trên (bus, train, bike) → on.","src":"tr. 189–190"},{"title":"Dưới, trên, cạnh, giữa…","icon":"🧭","rule":"Các giới từ vị trí khác: **under** (dưới), **over/above** (trên), **next to/beside** (bên cạnh), **in front of** (trước), **behind** (sau), **opposite** (đối diện), **between** (giữa 2 hay nhiều vật riêng rẽ), **among** (giữa một nhóm, đám đông).","explain":"over = ngay phía trên, không chạm; above = cao hơn, không nhất thiết ngay trên. under = ngay dưới; below = thấp hơn. **between** dùng khi bạn kể ra từng vật riêng: between Nam and Lan; **among** dùng khi các vật là một đám: among the children. Cẩn thận: **beside** = bên cạnh, còn **besides** (có s) = ngoài ra.","diagram":{"type":"table","title":"Giới từ vị trí thông dụng","head":["Giới từ","Nghĩa","Ví dụ"],"rows":[["under","ngay dưới","under the table"],["over / above","ngay trên / cao hơn","a lamp over the bed"],["next to / beside","bên cạnh","sit next to me"],["in front of / behind","phía trước / phía sau","behind the door"],["opposite","đối diện","opposite the bank"],["between / among","giữa (riêng rẽ / nhóm)","between A and B"]]},"examples":[{"en":"The cat is **under** the table.","vi":"Con mèo ở dưới gầm bàn."},{"en":"Come and sit **next to** me.","vi":"Lại đây ngồi cạnh tôi."},{"en":"The bank is **opposite** the supermarket.","vi":"Ngân hàng ở đối diện siêu thị."},{"en":"The café is **between** the school and the park.","vi":"Quán cà phê nằm giữa trường học và công viên."},{"en":"She was standing **among** a crowd of children.","vi":"Cô ấy đứng giữa một đám trẻ con."}],"mistake":{"wrong":"I sat among Nam and Lan.","right":"I sat between Nam and Lan.","why":"Hai người được kể riêng ra → **between**."},"tip":"between A **and** B: thấy chữ 'and' nối từng vật → between. Một đám không kể tên → among.","src":"tr. 190–191, 197","check":{"type":"mcq","q":"The shoes are ___ the bed. (ở dưới gầm giường)","options":["under","over","behind"],"answer":0,"explain":"Ngay dưới gầm → **under**. over là ngay phía trên.","src":"tự soạn"}}],"practice":[{"type":"mcq","q":"I'll wait for you ___ the bus stop.","options":["at","on","in"],"answer":0,"explain":"Bến xe buýt là **một điểm hẹn** → at. Không dùng in vì không có không gian bao quanh.","src":"tự soạn"},{"type":"classify","q":"Xếp mỗi cụm vào đúng giới từ:","buckets":["at","on","in"],"items":[{"text":"home","bucket":0},{"text":"work","bucket":0},{"text":"the wall","bucket":1},{"text":"the third floor","bucket":1},{"text":"Japan","bucket":2},{"text":"the kitchen","bucket":2}],"explain":"at home, at work (điểm, nơi làm). on the wall (bề mặt), on the third floor (tầng). in Japan (quốc gia), in the kitchen (bên trong phòng).","src":"tr. 186–189"},{"type":"mcq","q":"Anna đang ngồi trong taxi: Anna is ___ a taxi.","options":["in","on","at"],"answer":0,"explain":"car và taxi đi với **in**. on dùng cho bus, train, plane, bike.","src":"tr. 189–190"},{"type":"mcq","q":"I usually read the news ___ the train to work.","options":["on","at","to"],"answer":0,"explain":"Tàu hỏa (train), xe buýt, máy bay → **on**.","src":"tr. 190"},{"type":"fill","q":"Our office is ___ the fifth floor.","answer":["on"],"explain":"Số tầng → **on** the fifth floor.","src":"tr. 189"},{"type":"fill","q":"My grandfather is ill. He is ___ hospital.","answer":["in"],"explain":"**in hospital** (không mạo từ) = đang nằm viện.","src":"tr. 189"},{"type":"mcq","q":"Chi is sitting ___ Nam and Lan.","options":["between","among","beside"],"answer":0,"explain":"Hai người kể riêng (Nam **and** Lan) → **between**. among dùng cho một nhóm/đám đông; beside chỉ đi với một người/vật.","src":"tr. 191"},{"type":"fill","q":"The dog is sleeping ___ the table. (ở ngay dưới gầm bàn)","answer":["under","underneath","beneath"],"explain":"Ngay dưới → **under**.","src":"tr. 190"},{"type":"fix","wrong":"I read it on the newspaper.","answer":["I read it in the newspaper."],"explain":"Tin trên báo, sách, ảnh → **in** the newspaper.","src":"tr. 188"},{"type":"fix","wrong":"She lives at Vietnam.","answer":["She lives in Vietnam."],"explain":"Sống ở một quốc gia → **in**. at chỉ dùng khi xem nơi đó là một điểm dừng.","src":"tr. 188"},{"type":"order","q":"Sắp xếp thành câu đúng (Ngân hàng ở đối diện siêu thị):","words":["The","bank","is","opposite","the","supermarket."],"explain":"opposite + nơi chốn = đối diện. Không cần thêm to hay of.","src":"tr. 191"}],"flashcards":[{"front":"Ở nhà / ở chỗ làm: at, on hay in?","back":"**at** home, **at** work, **at** school"},{"front":"Sống ở một thành phố, quốc gia: giới từ nào?","back":"**in**: in Hanoi, in Vietnam"},{"front":"Ở tầng 5: giới từ nào?","back":"**on** the fifth floor"},{"front":"Trong xe hơi / trên xe buýt?","back":"**in** a car, **in** a taxi / **on** a bus, **on** a train"},{"front":"between hay among?","back":"**between** A and B (kể riêng) / **among** a crowd (một nhóm)"}]},{"id":"08b","title":"Giới từ chỉ thời gian","minutes":25,"goal":"Chọn đúng at / on / in với giờ, ngày, tháng, năm; biết khi nào không dùng giới từ; phân biệt for / since / by / until / during và in time / on time.","pretest":[{"type":"mcq","q":"See you ___ Monday!","options":["at","on","in"],"answer":1,"explain":"Ngày trong tuần → **on** Monday.","src":"tr. 192"},{"type":"mcq","q":"I was born ___ 1998.","options":["at","on","in"],"answer":2,"explain":"Năm → **in** 1998.","src":"tr. 192"}],"hook":{"icon":"📅","text":"Lại là ba hình ảnh của bài trước, chuyển sang thời gian. **at** là một **điểm** trên mặt đồng hồ (at 7 o'clock). **on** là **một ô ngày** trên tờ lịch (on Monday). **in** là **cả trang lịch** dài: tháng, năm, mùa (in May, in 2025). Từ điểm → ô → trang: càng dài càng dùng in."},"diagram":{"type":"flow","title":"Chọn giới từ cho thời gian","start":{"q":"Có next / last / this / every / tomorrow…?","branches":[{"label":"Có","to":{"result":"Không giới từ: next Friday, tomorrow","icon":"🚫"}},{"label":"Không","to":{"q":"Thời gian dài cỡ nào?","branches":[{"label":"Giờ, lúc","to":{"result":"at 7 o'clock, at night, at noon","icon":"🕖"}},{"label":"Một ngày","to":{"result":"on Monday, on 15 April","icon":"📆"}},{"label":"Tháng, năm, mùa, buổi","to":{"result":"in May, in 2025, in the morning","icon":"🗓️"}}]}}]}},"chunks":[{"title":"at giờ, on ngày, in tháng/năm","icon":"🕖","rule":"**at** + giờ, lúc (at 5 o'clock, at night); **on** + ngày (on Monday, on 15 April, on my birthday); **in** + tháng, năm, mùa, thập niên, thế kỷ và các buổi (in May, in 2020, in winter, in the morning).","explain":"Tiếng Việt nói 'vào' cho tất cả: vào 5 giờ, vào thứ Hai, vào tháng Năm. Tiếng Anh tách ra ba chữ theo độ dài. Vài cụm cần nhớ riêng: **at** night, **at** the weekend (Anh; người Mỹ nói on the weekend), **at** Christmas (cả kỳ nghỉ) nhưng **on** Christmas Day (một ngày). Buổi trong ngày nói chung là **in** the morning, nhưng buổi của một ngày cụ thể là **on** Sunday morning.","formula":"at + giờ · on + ngày · in + tháng / năm / mùa / buổi","examples":[{"en":"The film starts **at 8 o'clock**.","vi":"Phim bắt đầu lúc 8 giờ."},{"en":"My birthday is **on 15 April**.","vi":"Sinh nhật tôi vào ngày 15 tháng 4."},{"en":"We go to the beach **in summer**.","vi":"Chúng tôi đi biển vào mùa hè."},{"en":"I drink coffee **in the morning**, but **on Sunday morning** I sleep late.","vi":"Tôi uống cà phê vào buổi sáng, nhưng sáng Chủ nhật thì tôi ngủ muộn."},{"en":"I work in Monday.","ok":false,"note":"ngày → on"}],"mistake":{"wrong":"I was born on 1998.","right":"I was born in 1998.","why":"Năm là khoảng dài → **in**. on chỉ dùng cho một ngày."},"tip":"Điểm (at) → Ô ngày (on) → Trang lịch (in). Càng dài càng 'in'.","src":"tr. 191–193","check":{"type":"mcq","q":"We have a party ___ Christmas Day.","options":["at","on","in"],"answer":1,"explain":"Christmas **Day** là một ngày cụ thể → **on**. Còn cả kỳ nghỉ thì at Christmas.","src":"tr. 192"}},{"title":"Khi nào KHÔNG dùng giới từ","icon":"🚫","rule":"**Không** dùng at / on / in trước **next, last, this, every, all, each, some, today, tomorrow, yesterday**.","explain":"Những từ này đã tự chỉ thời gian rồi, nên giới từ bị bỏ. Người Việt hay dịch 'vào tuần sau' thành 'in next week' — sai. Chỉ cần nói **next week**.","formula":"next / last / this / every + thời gian (không giới từ)","examples":[{"en":"I'll see you **next Friday**.","vi":"Hẹn gặp bạn thứ Sáu tuần sau."},{"en":"Are you free **tomorrow morning**?","vi":"Sáng mai bạn rảnh không?"},{"en":"She goes to the gym **every day**.","vi":"Cô ấy đi tập gym mỗi ngày."},{"en":"See you on next Monday.","ok":false,"note":"bỏ on"}],"mistake":{"wrong":"I met him in last week.","right":"I met him last week.","why":"Có **last** thì không dùng giới từ."},"tip":"Thấy next / last / this / every → xoá giới từ.","src":"tr. 193"},{"title":"in + khoảng thời gian; in time và on time","icon":"⏳","rule":"**in + khoảng thời gian** = mất bao lâu để làm xong, hoặc bao lâu nữa (in five minutes, in two weeks). **on time** = đúng giờ; **in time** = kịp lúc.","explain":"I did the crossword **in five minutes** = tôi giải xong ô chữ trong 5 phút. I'll be back **in two weeks** = hai tuần nữa tôi sẽ về. Cặp dễ nhầm: tàu chạy **on time** = đúng giờ đã định, không sớm không muộn; tôi đến **in time** = vừa kịp, trước khi quá muộn.","examples":[{"en":"I'll be back **in two weeks**.","vi":"Hai tuần nữa tôi sẽ quay lại."},{"en":"She finished the test **in 20 minutes**.","vi":"Cô ấy làm xong bài kiểm tra trong 20 phút."},{"en":"The train left **on time**.","vi":"Tàu khởi hành đúng giờ."},{"en":"We got to the station just **in time** to catch the train.","vi":"Chúng tôi đến ga vừa kịp để bắt tàu."}],"tip":"**on** time = đúng **o**n the dot (đúng phóc). **in** time = kịp, chưa trễ.","src":"tr. 193"},{"title":"for, since, by, until, during","icon":"⏱️","rule":"**for** + một khoảng (for two hours); **since** + mốc bắt đầu (since 2015); **by** = không muộn hơn (by Friday); **until** = kéo dài đến (until 6); **during** = trong suốt một việc/khoảng (during the film).","explain":"for và since đều trả lời 'bao lâu rồi', nhưng for đi với **độ dài** (ten years, three days), since đi với **điểm bắt đầu** (2015, Monday, 8 o'clock). by và until đều dịch là 'trước/đến', nhưng **by** là **hạn chót** (làm xong lúc nào đó trước mốc), còn **until** là việc **kéo dài liên tục** đến mốc rồi dừng.","diagram":{"type":"table","title":"Năm giới từ thời gian dễ nhầm","head":["Giới từ","Đi với","Ví dụ"],"rows":[["for","độ dài thời gian","for ten years"],["since","mốc bắt đầu","since 2015"],["by","hạn chót, không muộn hơn","by Thursday"],["until","kéo dài đến mốc","wait until 6"],["during","trong suốt một việc","during the film"]]},"examples":[{"en":"I have lived here **for ten years**.","vi":"Tôi đã sống ở đây được mười năm."},{"en":"I have lived here **since 2015**.","vi":"Tôi đã sống ở đây từ năm 2015."},{"en":"I have to finish this report **by Thursday**.","vi":"Tôi phải làm xong báo cáo này trước thứ Năm."},{"en":"We waited **until** 6 o'clock.","vi":"Chúng tôi đã đợi đến 6 giờ."},{"en":"My phone rang **during** the meeting.","vi":"Điện thoại tôi đổ chuông trong lúc họp."}],"mistake":{"wrong":"I have worked here since three years.","right":"I have worked here for three years.","why":"three years là **độ dài** → for. since chỉ đi với mốc."},"tip":"Hỏi: 'bao lâu?' → for. 'từ khi nào?' → since. 'hạn chót?' → by. 'đến lúc nào thì thôi?' → until.","src":"tr. 193–194","check":{"type":"mcq","q":"I've known her ___ 2010.","options":["for","since","during"],"answer":1,"explain":"2010 là **mốc bắt đầu** → since.","src":"tr. 194"}}],"practice":[{"type":"classify","q":"Xếp mỗi cụm thời gian vào đúng giới từ:","buckets":["at","on","in"],"items":[{"text":"7 o'clock","bucket":0},{"text":"night","bucket":0},{"text":"Tuesday","bucket":1},{"text":"my birthday","bucket":1},{"text":"July","bucket":2},{"text":"1999","bucket":2},{"text":"the morning","bucket":2}],"explain":"Giờ và night → at. Ngày (Tuesday, my birthday) → on. Tháng, năm, buổi trong ngày → in.","src":"tr. 191–193"},{"type":"mcq","q":"The shop closes ___ midnight.","options":["at","on","in"],"answer":0,"explain":"midnight là một **thời điểm** → at.","src":"tr. 191"},{"type":"fill","q":"My parents got married ___ 1990.","answer":["in"],"explain":"Năm → **in** 1990.","src":"tự soạn"},{"type":"fill","q":"The class starts ___ 9 o'clock.","answer":["at"],"explain":"Giờ cụ thể → **at**.","src":"tự soạn"},{"type":"mcq","q":"I'll call you ___ next week.","options":["on","in","at","Ø (không dùng giới từ)"],"answer":3,"shuffle":false,"explain":"Có **next** thì bỏ giới từ: I'll call you next week.","src":"tr. 193"},{"type":"fill","q":"She has worked here ___ ten years.","answer":["for"],"explain":"ten years là **độ dài** → for. since đi với mốc (since 2015).","src":"tr. 194"},{"type":"mcq","q":"You must send the report ___ Friday. (hạn chót: không muộn hơn thứ Sáu)","options":["by","until","since"],"answer":0,"explain":"Hạn chót → **by**. until dùng khi một việc kéo dài liên tục đến mốc (wait until Friday).","src":"tr. 194"},{"type":"mcq","q":"The train left at exactly 8:00, as planned. It left ___.","options":["on time","in time","at time"],"answer":0,"explain":"Đúng giờ đã định → **on time**. in time = kịp lúc, at time không tồn tại.","src":"tr. 193"},{"type":"fix","wrong":"I was born on 1998.","answer":["I was born in 1998."],"explain":"Năm → **in**.","src":"tr. 192"},{"type":"fix","wrong":"See you on next Monday.","answer":["See you next Monday."],"explain":"Có **next** → bỏ giới từ.","src":"tr. 193"},{"type":"order","q":"Sắp xếp thành câu đúng (Hai tuần nữa tôi sẽ quay lại):","words":["I","will","be","back","in","two","weeks."],"explain":"in + khoảng thời gian = bao lâu nữa.","src":"tr. 193"}],"flashcards":[{"front":"at / on / in + giờ, ngày, tháng?","back":"**at** 7 o'clock · **on** Monday · **in** May / in 2025"},{"front":"'vào tuần sau' nói thế nào?","back":"**next week** (không có in/on/at)"},{"front":"for hay since + 2015?","back":"**since** 2015 (mốc) · for ten years (độ dài)"},{"front":"by Friday khác until Friday thế nào?","back":"**by** = hạn chót, không muộn hơn · **until** = kéo dài đến tận"},{"front":"on time hay in time = kịp lúc?","back":"**in time** = kịp · on time = đúng giờ"}]},{"id":"08c","title":"Giới từ chuyển động, phương tiện và cụm cố định","minutes":25,"goal":"Dùng đúng giới từ chỉ hướng đi (into, out of, across, along, through), nói cách đi (by bus, on foot, with a key), mục đích và cách thức (to + V, by + V-ing), và các cụm cố định on holiday, in the rain, at the age of.","pretest":[{"type":"mcq","q":"He walked ___ the room and sat down. (đi vào trong phòng)","options":["into","out of","across"],"answer":0,"explain":"Đi từ ngoài **vào trong** → into.","src":"tr. 195"},{"type":"mcq","q":"I go to work ___ bus.","options":["by","on","with"],"answer":0,"explain":"Đi bằng phương tiện (không có a/the) → **by** bus.","src":"tr. 196"}],"hook":{"icon":"🚶","text":"at / on / in cho bạn biết một vật **đang đứng yên** ở đâu. Nhưng khi nó **di chuyển**, bạn cần mũi tên: đi **vào** (into), đi **ra** (out of), **băng qua** (across), **dọc theo** (along), **xuyên qua** (through). Rồi còn hỏi: đi **bằng gì**? làm **để làm gì**? làm **bằng cách nào**? Mỗi câu hỏi có giới từ riêng."},"diagram":{"type":"mindmap","title":"Giới từ ngoài nơi chốn và thời gian","root":{"label":"Giới từ khác","children":[{"label":"Chuyển động","icon":"➡️","children":[{"label":"into / out of"},{"label":"across / along / through"}]},{"label":"Phương tiện","icon":"🚌","children":[{"label":"by bus, by train"},{"label":"on foot"},{"label":"with a key"}]},{"label":"Mục đích, cách thức","icon":"🎯","children":[{"label":"to post a letter"},{"label":"by giving up smoking"}]},{"label":"Cụm cố định","icon":"📌","children":[{"label":"on holiday, on the phone"},{"label":"in the rain, in cash"},{"label":"at the age of 16"}]}]}},"chunks":[{"title":"Giới từ chuyển động","icon":"➡️","rule":"Khi có **đi, chạy, bước, bơi…**, dùng giới từ chỉ hướng: **to** (đến), **into** (vào trong), **out of** (ra khỏi), **across** (băng qua), **along** (dọc theo), **through** (xuyên qua), **up/down** (lên/xuống), **towards** (về phía), **round** (quanh).","explain":"Tiếng Việt chỉ thêm 'vào, ra, qua' sau động từ; tiếng Anh dùng giới từ ngay sau động từ chuyển động. Phân biệt: **across** = đi ngang từ bờ này sang bờ kia (across the road), **along** = đi theo chiều dài (along the river), **through** = đi xuyên bên trong một thứ có hai đầu (through the window, through the forest).","formula":"động từ chuyển động + into / out of / across / along / through + nơi","diagram":{"type":"table","title":"Mũi tên chuyển động","head":["Giới từ","Nghĩa","Ví dụ"],"rows":[["into","vào trong","walk into the room"],["out of","ra khỏi","get out of the car"],["across","băng qua (bờ này → bờ kia)","swim across the river"],["along","dọc theo","walk along the beach"],["through","xuyên qua","through the window"],["towards / round","về phía / vòng quanh","round the sun"]]},"examples":[{"en":"She ran **into** the house.","vi":"Cô ấy chạy vào trong nhà."},{"en":"He got **out of** the car.","vi":"Anh ấy bước ra khỏi xe."},{"en":"We walked **along** the beach.","vi":"Chúng tôi đi dạo dọc bờ biển."},{"en":"The thief got in **through** the window.","vi":"Tên trộm vào nhà qua cửa sổ."},{"en":"The earth moves **round** the sun.","vi":"Trái đất quay quanh mặt trời."}],"tip":"across = đường kẻ ngang qua sông. along = đường chạy dọc theo sông. through = chui qua đường hầm.","src":"tr. 194–196","check":{"type":"mcq","q":"Be careful when you walk ___ the road. (băng sang bên kia đường)","options":["across","along","into"],"answer":0,"explain":"Từ bên này sang bên kia → **across**.","src":"tự soạn"}},{"title":"by bus, on foot, with a key","icon":"🚌","rule":"Đi bằng phương tiện: **by + phương tiện** không mạo từ (by bus, by train, by car); đi bộ: **on foot**; làm bằng dụng cụ: **with** + dụng cụ (with a knife).","explain":"Tiếng Việt dùng một chữ 'bằng' cho cả 'đi bằng xe buýt' lẫn 'cắt bằng dao'. Tiếng Anh tách ra: phương tiện đi lại → **by**, dụng cụ cầm trong tay → **with**. Riêng đi bộ là ngoại lệ: **on foot**, không phải by foot. by còn chỉ người làm ra việc trong câu bị động: arrested **by** the police (bị cảnh sát bắt).","diagram":{"type":"flow","title":"'bằng…' dịch là gì?","start":{"q":"Bằng cái gì?","branches":[{"label":"Phương tiện đi lại","to":{"result":"by bus / by train / by car","icon":"🚌"}},{"label":"Đi bộ","to":{"result":"on foot","icon":"🚶"}},{"label":"Dụng cụ cầm tay","to":{"result":"with a knife / with a key","icon":"🔑"}}]}},"examples":[{"en":"I go to work **by bus**.","vi":"Tôi đi làm bằng xe buýt."},{"en":"She goes to school **on foot**.","vi":"Cô bé đi bộ đến trường."},{"en":"He opened the door **with a key**.","vi":"Anh ấy mở cửa bằng chìa khoá."},{"en":"I go to school by foot.","ok":false,"note":"đi bộ → on foot"}],"mistake":{"wrong":"I go to work by the bus.","right":"I go to work by bus.","why":"Sau **by** + phương tiện không dùng a/the."},"tip":"Đi lại → by. Cầm tay → with. Đi bộ → on foot (chân chạm đất).","src":"tr. 196–197"},{"title":"Để làm gì? Bằng cách nào?","icon":"🎯","rule":"Mục đích: **to + V** (để làm gì) hoặc **for + danh từ** (for a rest). Cách thức: **by + V-ing** (bằng cách…), **without + V-ing** (mà không…). Sau giới từ, động từ luôn ở dạng **V-ing**.","explain":"Người Việt hay nói 'I went out for buy milk' vì dịch 'để' thành for. Quy tắc: 'để + **động từ**' → **to** + V (to buy); 'để + **danh từ**' → **for** + N (for a rest). Còn khi giới từ (by, without, for, about...) đứng trước một động từ, động từ đó phải thêm **-ing**: by giving, without knocking.","formula":"to + V nguyên mẫu (mục đích)\nfor + danh từ\nby / without + V-ing","examples":[{"en":"I went out **to post** a letter.","vi":"Tôi ra ngoài để gửi một lá thư."},{"en":"We stopped **for a rest**.","vi":"Chúng tôi dừng lại để nghỉ."},{"en":"She saved money **by giving up** cigarettes.","vi":"Cô ấy tiết kiệm tiền bằng cách bỏ thuốc lá."},{"en":"He came in **without knocking**.","vi":"Anh ta đi vào mà không gõ cửa."},{"en":"He came in without knock.","ok":false,"note":"sau giới từ → V-ing"}],"mistake":{"wrong":"I went to the shop for buy some milk.","right":"I went to the shop to buy some milk.","why":"'để + động từ' → **to** + V. for chỉ đi với danh từ hoặc V-ing."},"tip":"Giới từ + động từ → động từ đeo đuôi -ing.","src":"tr. 186, 196–197"},{"title":"Cụm cố định với on, in, at","icon":"📌","rule":"Một số cụm phải học thuộc: **on** holiday / on business / on the phone / on TV / on the radio / on purpose / on fire; **in** the rain / in the sun / in the dark / in cash / in pencil / in my opinion; **at** the age of / at a speed of.","explain":"Những cụm này không theo hình ảnh điểm–mặt–hộp, nên đừng cố suy luận; học cả cụm như học một từ mới. Ví dụ tiếng Việt nói 'đi nghỉ' nhưng tiếng Anh là **on** holiday; 'dưới mưa' nhưng tiếng Anh là **in** the rain; 'cố ý' là **on** purpose.","examples":[{"en":"We're **on holiday** in Da Nang.","vi":"Chúng tôi đang đi nghỉ ở Đà Nẵng."},{"en":"She is **on the phone**.","vi":"Cô ấy đang nghe điện thoại."},{"en":"Don't walk **in the rain**.","vi":"Đừng đi bộ dưới mưa."},{"en":"Can I pay **in cash**?","vi":"Tôi trả bằng tiền mặt được không?"},{"en":"He left school **at the age of** 16.","vi":"Anh ấy thôi học năm 16 tuổi."}],"mistake":{"wrong":"She broke the cup in purpose.","right":"She broke the cup on purpose.","why":"'cố ý' là cụm cố định **on purpose**."},"tip":"Nhóm 'on' = đang trong một hoạt động: on holiday, on business, on the phone, on TV. Nhóm 'in' = bị thời tiết/ánh sáng bao quanh: in the rain, in the sun, in the dark.","src":"tr. 197–198"}],"practice":[{"type":"mcq","q":"It started to rain, so we ran ___ the café. (chạy vào trong quán)","options":["into","out of","along"],"answer":0,"explain":"Từ ngoài **vào trong** → into. out of là ra khỏi.","src":"tự soạn"},{"type":"mcq","q":"We walked ___ the river and watched the boats. (đi dọc bờ sông)","options":["along","across","into"],"answer":0,"explain":"Đi theo chiều dài con sông → **along**. across là băng sang bờ bên kia.","src":"tự soạn"},{"type":"classify","q":"Mỗi cụm đi với on, in hay at?","buckets":["on","in","at"],"items":[{"text":"___ holiday","bucket":0},{"text":"___ the phone","bucket":0},{"text":"___ purpose","bucket":0},{"text":"___ the rain","bucket":1},{"text":"___ cash","bucket":1},{"text":"___ the age of 20","bucket":2}],"explain":"on holiday, on the phone, on purpose; in the rain, in cash; at the age of.","src":"tr. 197–198"},{"type":"fill","q":"I usually go to work ___ train.","answer":["by"],"explain":"Phương tiện không có a/the → **by** train.","src":"tr. 196"},{"type":"fill","q":"He doesn't have a bike, so he goes to school ___ foot.","answer":["on"],"explain":"Đi bộ là cụm riêng: **on foot**.","src":"tr. 196"},{"type":"mcq","q":"She cut the bread ___ a knife.","options":["with","by","on"],"answer":0,"explain":"Dụng cụ cầm tay → **with**. by dùng cho phương tiện đi lại.","src":"tr. 196"},{"type":"mcq","q":"I went to the shop ___ buy some milk.","options":["to","for","by"],"answer":0,"explain":"'để + động từ' → **to** + V. for đi với danh từ (for some milk).","src":"tr. 196"},{"type":"fill","q":"You can turn on the light ___ pressing this button.","answer":["by"],"explain":"Bằng cách làm gì → **by** + V-ing.","src":"tr. 197"},{"type":"fix","wrong":"He came in without knock.","answer":["He came in without knocking."],"explain":"Sau giới từ **without** → V-ing: knocking.","src":"tr. 197"},{"type":"fix","wrong":"We are in holiday in Da Nang.","answer":["We are on holiday in Da Nang.","We're on holiday in Da Nang."],"explain":"Cụm cố định: **on holiday**.","src":"tr. 197"},{"type":"order","q":"Sắp xếp thành câu đúng (Tên trộm vào nhà qua cửa sổ):","words":["The","thief","got","in","through","the","window."],"explain":"through = xuyên qua một lối có hai đầu như cửa sổ.","src":"tr. 195"}],"flashcards":[{"front":"across hay along the river?","back":"**across** = băng sang bờ kia · **along** = đi dọc theo"},{"front":"Đi bộ / đi xe buýt?","back":"**on foot** / **by bus** (không a/the)"},{"front":"'bằng dao' dùng giới từ nào?","back":"**with** a knife (dụng cụ cầm tay)"},{"front":"Giới từ + động từ → dạng gì?","back":"**V-ing**: by giving up, without knocking"},{"front":"đi nghỉ / dưới mưa / cố ý?","back":"**on** holiday · **in** the rain · **on** purpose"}]},{"id":"08d","title":"Giới từ đi sau tính từ, danh từ, động từ","minutes":25,"goal":"Nhớ và dùng đúng các cụm thông dụng: tính từ + giới từ (good at, afraid of, interested in), danh từ + giới từ (reason for, increase in) và động từ + giới từ (depend on, wait for, arrive at/in).","pretest":[{"type":"mcq","q":"She is very good ___ English.","options":["at","in","about"],"answer":0,"explain":"Giỏi môn gì → **good at**.","src":"tr. 199"},{"type":"mcq","q":"It depends ___ the weather.","options":["on","of","from"],"answer":0,"explain":"Cụm cố định: **depend on**.","src":"tr. 202"}],"hook":{"icon":"🧲","text":"Có những từ luôn kéo theo một giới từ như **nam châm**: interested **in**, afraid **of**, depend **on**. Không có quy luật nào để đoán, và nhiều khi khác hẳn tiếng Việt ('phụ thuộc **vào**' nhưng depend **on**). Cách học duy nhất: học **cả cụm** như một từ, mỗi ngày vài cụm."},"diagram":{"type":"table","title":"Tính từ + giới từ hay gặp","head":["Giới từ","Tính từ đi kèm"],"rows":[["of","afraid, proud, tired, full, sure"],["at","good, bad, surprised"],["in","interested, successful, rich"],["for","famous, ready, late, sorry"],["to","similar, kind (to sb), rude"],["with","busy, pleased, bored, angry (with sb)"],["about","worried, excited, sad"],["from","different, far, safe"]]},"chunks":[{"title":"Tính từ + giới từ","icon":"😀","rule":"Nhiều tính từ có **giới từ cố định** theo sau: afraid **of**, good **at**, interested **in**, famous **for**, similar **to**, busy **with**, worried **about**, different **from**.","explain":"Tiếng Việt nói 'sợ chó', 'thích âm nhạc' không cần giới từ, nên người Việt hay quên hoặc đoán bừa giới từ. Hãy học cả cụm. Sau giới từ có thể là danh từ, đại từ hoặc **V-ing**: I'm not very good at **cooking**.","formula":"be + tính từ + giới từ + danh từ / V-ing","examples":[{"en":"I'm **afraid of** dogs.","vi":"Tôi sợ chó."},{"en":"He's **interested in** music.","vi":"Anh ấy thích âm nhạc."},{"en":"I'm not very **good at** cooking.","vi":"Tôi nấu ăn không giỏi lắm."},{"en":"Hoi An is **famous for** its old town.","vi":"Hội An nổi tiếng với phố cổ."},{"en":"I'm interested about music.","ok":false,"note":"interested in"}],"mistake":{"wrong":"She is worried for her exam.","right":"She is worried about her exam.","why":"Lo lắng về điều gì → **worried about**."},"tip":"Học theo nhóm giới từ ở bảng trên, mỗi ngày một hàng.","src":"tr. 186, 198–200","check":{"type":"mcq","q":"My brother is different ___ me.","options":["from","with","of"],"answer":0,"explain":"Cụm cố định: **different from**.","src":"tr. 200"}},{"title":"Cùng tính từ, khác giới từ, khác nghĩa","icon":"🔀","rule":"Đổi giới từ là đổi nghĩa: **good at** (giỏi) / **good for** (tốt cho); **tired of** (chán) / **tired from** (mệt vì); **kind to sb** (tử tế với ai) / **It's kind of sb** (ai đó thật tốt bụng).","explain":"Đây là chỗ dễ sai nhất, vì tiếng Việt dùng những từ khác hẳn nhau ('giỏi' và 'tốt cho'), còn tiếng Anh chỉ đổi một giới từ nhỏ. Thêm một cặp: angry **with** + người, angry **about** + sự việc.","diagram":{"type":"table","title":"Cặp đổi nghĩa","head":["Cụm","Nghĩa"],"rows":[["good at","giỏi về (good at maths)"],["good for","tốt cho (good for your health)"],["tired of","chán (tired of waiting)"],["tired from","mệt vì (tired from work)"],["kind to sb","tử tế với ai"],["It's kind of you","bạn thật tốt bụng"]]},"examples":[{"en":"Vegetables are **good for** you.","vi":"Rau tốt cho sức khoẻ của bạn."},{"en":"She's **good at** maths.","vi":"Cô ấy giỏi toán."},{"en":"I'm **tired of** eating noodles.","vi":"Tôi chán ăn mì lắm rồi."},{"en":"It's very **kind of** you to help me.","vi":"Bạn thật tốt bụng khi giúp tôi."},{"en":"She is always **kind to** animals.","vi":"Cô ấy luôn đối xử tử tế với động vật."}],"mistake":{"wrong":"It's very kind for you.","right":"It's very kind of you.","why":"Khen ai tốt bụng → **It's kind of** + người."},"tip":"good **at** = 'giỏi **ở** môn gì'. good **for** = 'tốt **cho** ai'.","src":"tr. 199–200"},{"title":"Danh từ + giới từ","icon":"📝","rule":"Một số danh từ đi với giới từ cố định: reason **for**, need **for**, cause **of**, example **of**, answer **to**, solution **to**, invitation **to**, increase **in**, difference **between**, relationship **with**.","explain":"Lưu ý cặp **increase in** và **increase of**: 'in' đi với **thứ** tăng lên (an increase in the price — giá tăng), 'of' đi với **mức** tăng (an increase of 10% — tăng 10%). Tiếng Việt nói 'câu trả lời **của** câu hỏi', nhưng tiếng Anh là answer **to** the question.","formula":"danh từ + giới từ cố định + danh từ","examples":[{"en":"What's the **reason for** the delay?","vi":"Lý do của sự chậm trễ là gì?"},{"en":"I don't know the **answer to** this question.","vi":"Tôi không biết câu trả lời cho câu hỏi này."},{"en":"There has been an **increase in** the price of rice.","vi":"Giá gạo đã tăng lên."},{"en":"What's the **difference between** these two phones?","vi":"Hai chiếc điện thoại này khác nhau ở điểm nào?"},{"en":"the answer of the question","ok":false,"note":"answer to"}],"mistake":{"wrong":"Thank you for your invitation for the party.","right":"Thank you for your invitation to the party.","why":"Lời mời đến đâu → **invitation to**."},"tip":"answer, reply, solution, invitation, key: đều 'dẫn tới' một thứ → **to**.","src":"tr. 200–201"},{"title":"Động từ + giới từ","icon":"🏃","rule":"Học thuộc các cặp động từ + giới từ: depend **on**, belong **to**, wait **for**, look **at/for/after**, apply **for**, succeed **in**, believe **in**, apologize **to** sb **for** sth; **arrive at** + ga, sân bay, nhà ai / **arrive in** + thành phố, nước.","explain":"Tiếng Việt: 'phụ thuộc **vào**', 'chờ' (không giới từ), 'đến Hà Nội' — dịch thẳng ra dễ thành depend in, wait sb, arrive to. Không có 'arrive to': đến một **điểm** (ga, sân bay, nhà) → **arrive at**; đến **thành phố, quốc gia** → **arrive in**. Sau giới từ là V-ing: She succeeded **in passing** the exam.","formula":"động từ + giới từ cố định + danh từ / V-ing","examples":[{"en":"It **depends on** the weather.","vi":"Điều đó phụ thuộc vào thời tiết."},{"en":"I'm **waiting for** the bus.","vi":"Tôi đang đợi xe buýt."},{"en":"This bag **belongs to** me.","vi":"Cái túi này là của tôi."},{"en":"We **arrived at** the airport at 6 and **arrived in** London at 10.","vi":"Chúng tôi đến sân bay lúc 6 giờ và đến London lúc 10 giờ."},{"en":"We arrived to Hanoi late.","ok":false,"note":"arrive in + thành phố"}],"mistake":{"wrong":"It depends of the weather.","right":"It depends on the weather.","why":"Cụm cố định: **depend on** (= rely on)."},"tip":"arrive at / arrive in giống at / in nơi chốn ở bài 08a: điểm → at, thành phố/nước → in.","src":"tr. 201–203","check":{"type":"mcq","q":"Who does this phone belong ___?","options":["to","for","of"],"answer":0,"explain":"Cụm cố định: **belong to** sb (là của ai).","src":"tr. 201"}}],"practice":[{"type":"mcq","q":"My little sister is afraid ___ the dark.","options":["of","from","with"],"answer":0,"explain":"Sợ cái gì → **afraid of**.","src":"tr. 198"},{"type":"classify","q":"Mỗi tính từ đi với giới từ nào?","buckets":["in","at","of"],"items":[{"text":"interested","bucket":0},{"text":"successful","bucket":0},{"text":"good","bucket":1},{"text":"surprised","bucket":1},{"text":"proud","bucket":2},{"text":"full","bucket":2}],"explain":"interested in, successful in; good at, surprised at; proud of, full of.","src":"tr. 198–200"},{"type":"fill","q":"Hue is famous ___ its old palaces.","answer":["for"],"explain":"Nổi tiếng về điều gì → **famous for**.","src":"tr. 199"},{"type":"fill","q":"Your bag is very similar ___ mine.","answer":["to"],"explain":"Giống với → **similar to**.","src":"tr. 199"},{"type":"mcq","q":"Eating vegetables is good ___ your health.","options":["for","at","to"],"answer":0,"explain":"Tốt cho ai/cái gì → **good for**. good at = giỏi về.","src":"tr. 200"},{"type":"mcq","q":"Thank you for the flowers. It's very kind ___ you.","options":["of","to","for"],"answer":0,"explain":"Khen ai tốt bụng: **It's kind of** + người. kind to sb = đối xử tử tế với ai.","src":"tr. 200"},{"type":"fill","q":"Our plane arrived ___ London at 10 p.m.","answer":["in"],"explain":"Đến một thành phố → **arrive in**. arrive at dùng cho ga, sân bay, nhà ai.","src":"tr. 203"},{"type":"fill","q":"There has been a big increase ___ the price of petrol. (giá xăng tăng)","answer":["in"],"explain":"Thứ tăng lên (giá) → **increase in**. increase of đi với mức tăng (of 10%).","src":"tr. 201"},{"type":"fix","wrong":"It depends of the weather.","answer":["It depends on the weather."],"explain":"**depend on**, không phải depend of.","src":"tr. 202"},{"type":"fix","wrong":"I'm interested in learn English.","answer":["I'm interested in learning English.","I am interested in learning English."],"explain":"Sau giới từ **in** → V-ing: learning.","src":"tr. 186, 200"},{"type":"fill","q":"He apologized ___ me for being late.","answer":["to"],"explain":"Xin lỗi ai → **apologize to** sb **for** sth.","src":"tr. 201"},{"type":"order","q":"Sắp xếp thành câu đúng (Cô ấy đang đợi xe buýt):","words":["She","is","waiting","for","the","bus."],"explain":"Đợi ai/cái gì → **wait for**. Không nói wait the bus.","src":"tr. 202"}],"flashcards":[{"front":"afraid / interested / good + giới từ?","back":"afraid **of** · interested **in** · good **at**"},{"front":"good at khác good for?","back":"good **at** = giỏi về · good **for** = tốt cho"},{"front":"'câu trả lời cho câu hỏi' = answer ___ the question?","back":"answer **to** the question"},{"front":"depend ___ / wait ___ / belong ___?","back":"depend **on** · wait **for** · belong **to**"},{"front":"arrive at hay arrive in + London?","back":"arrive **in** London (thành phố) · arrive **at** the airport (điểm)"},{"front":"increase in hay increase of + the price?","back":"an increase **in** the price · an increase **of** 10%"}]}],"quiz":{"pass":0.8,"questions":[{"type":"mcq","q":"There is a big clock ___ the wall.","options":["on","in","at"],"answer":0,"explain":"Treo trên bề mặt tường → **on**.","src":"tr. 189"},{"type":"mcq","q":"Dad isn't here. He's ___ work.","options":["at","in","on"],"answer":0,"explain":"Nơi làm việc → **at work** (cụm cố định).","src":"tr. 187"},{"type":"fill","q":"My grandparents live ___ a small village near Hue.","answer":["in"],"explain":"Làng, thị trấn, thành phố → **in**.","src":"tr. 188"},{"type":"mcq","q":"The post office is ___ the bank and the pharmacy.","options":["between","among","through"],"answer":0,"explain":"Ở giữa hai nơi được kể riêng (A **and** B) → **between**. among dùng cho một nhóm/đám đông; through là xuyên qua (chuyển động).","src":"tr. 191"},{"type":"fix","wrong":"My flat is in the second floor.","answer":["My flat is on the second floor."],"explain":"Số tầng → **on**.","src":"tr. 189"},{"type":"classify","q":"Xếp mỗi cụm thời gian vào đúng giới từ:","buckets":["at","on","in"],"items":[{"text":"midnight","bucket":0},{"text":"lunchtime","bucket":0},{"text":"Friday evening","bucket":1},{"text":"New Year's Day","bucket":1},{"text":"December","bucket":2},{"text":"the 1990s","bucket":2}],"explain":"Thời điểm → at. Một ngày cụ thể, kể cả buổi của ngày đó (Friday evening) → on. Tháng, thập niên → in.","src":"tr. 191–193"},{"type":"fill","q":"Let's meet ___ 6:30 in front of the cinema.","answer":["at"],"explain":"Giờ cụ thể → **at**.","src":"tr. 191"},{"type":"mcq","q":"She has been ill ___ Monday.","options":["since","for","during"],"answer":0,"explain":"Monday là **mốc bắt đầu** → since. for đi với độ dài (for three days).","src":"tr. 194"},{"type":"fix","wrong":"We will visit Japan in next summer.","answer":["We will visit Japan next summer.","We'll visit Japan next summer."],"explain":"Có **next** → không dùng giới từ.","src":"tr. 193"},{"type":"mcq","q":"Please send me the file ___ 5 p.m. tomorrow. I need it before the meeting.","options":["by","until","for"],"answer":0,"explain":"Hạn chót, không muộn hơn → **by**. until dùng khi việc kéo dài liên tục đến mốc.","src":"tr. 194"},{"type":"mcq","q":"I fell asleep ___ the film.","options":["during","for","since"],"answer":0,"explain":"Trong lúc một việc đang diễn ra → **during** + sự việc. for đi với độ dài, since với mốc.","src":"tr. 193"},{"type":"mcq","q":"The boy jumped ___ the swimming pool. (nhảy vào trong hồ)","options":["into","out of","along"],"answer":0,"explain":"Chuyển động từ ngoài vào trong → **into**.","src":"tr. 195"},{"type":"fill","q":"I came here ___ train, not by car.","answer":["by"],"explain":"Phương tiện không mạo từ → **by** train.","src":"tr. 196"},{"type":"fix","wrong":"She broke the cup in purpose.","answer":["She broke the cup on purpose."],"explain":"Cố ý → cụm cố định **on purpose**.","src":"tr. 197"},{"type":"order","q":"Sắp xếp thành câu đúng (Cô ấy tiết kiệm tiền bằng cách bỏ thuốc lá):","words":["She","saved","money","by","giving","up","cigarettes."],"explain":"Bằng cách làm gì → **by + V-ing**.","src":"tr. 186"},{"type":"fill","q":"I'm tired ___ eating instant noodles every day. (chán)","answer":["of"],"explain":"Chán điều gì → **tired of**. tired from = mệt vì.","src":"tr. 200"},{"type":"mcq","q":"What's the reason ___ your decision?","options":["for","of","about"],"answer":0,"explain":"Lý do cho điều gì → **reason for**.","src":"tr. 200"},{"type":"fix","wrong":"We arrived to the airport late.","answer":["We arrived at the airport late."],"explain":"Đến một điểm như sân bay, nhà ga → **arrive at**. Không có arrive to.","src":"tr. 203"},{"type":"mcq","q":"Chọn câu đúng:","options":["She is good at speaking English.","She is good in speak English.","She is good at speak English."],"answer":0,"explain":"Giỏi về → **good at**, và sau giới từ là **V-ing**: speaking.","src":"tr. 186, 199"}]}},{"id":"09-lien-tu","title":"Liên từ","en":"Conjunctions","icon":"🪢","pages":"214–220","summary":"Liên từ (conjunction) là từ nối các từ, cụm từ, mệnh đề hoặc câu: and, but, or, so, because, although... Chủ đề này dạy bạn hai loại liên từ, chọn đúng từ nối theo ý nghĩa (thêm vào, trái ngược, lựa chọn, kết quả, thời gian, lý do, điều kiện, tương phản, mục đích) và tránh lỗi kiểu 'Vì… nên…', 'Mặc dù… nhưng…' của người Việt.","mindmap":{"label":"Liên từ","children":[{"label":"Kết hợp (ngang hàng)","icon":"🚃","children":[{"label":"AND: thêm vào"},{"label":"BUT: trái ngược"},{"label":"OR: lựa chọn"},{"label":"SO: kết quả"},{"label":"Trạng từ liên kết: However, Therefore…"}]},{"label":"Phụ thuộc (mở mệnh đề phụ)","icon":"🧩","children":[{"label":"WHEN: thời gian"},{"label":"BECAUSE: lý do"},{"label":"IF: điều kiện"},{"label":"THOUGH: tương phản"},{"label":"IN ORDER THAT: mục đích"},{"label":"SO/SUCH… THAT: kết quả"},{"label":"THAT: tuyên bố, ý kiến"}]}]},"lessons":[{"id":"09a","title":"Liên từ kết hợp và trạng từ liên kết","minutes":25,"goal":"Nối hai ý ngang hàng bằng and, but, or, so và các cặp both…and, either…or, neither…nor, not only…but also; biết dùng However, Therefore, Besides, Otherwise để mở câu thứ hai.","pretest":[{"type":"mcq","q":"He's intelligent ___ lazy. (Anh ta thông minh nhưng lười.)","options":["but","so","or"],"answer":0,"explain":"Thông minh và lười là hai ý **trái ngược** → **but**.","src":"tr. 214"},{"type":"mcq","q":"It was raining, ___ we stayed at home.","options":["so","but","or"],"answer":0,"explain":"Ở nhà là **kết quả** của trời mưa → **so** (nên).","src":"tự soạn"},{"type":"mcq","q":"Hurry up, ___ you'll be late.","options":["or","and","so"],"answer":0,"explain":"**or** ở đây nghĩa là 'nếu không thì': nhanh lên, nếu không sẽ trễ.","src":"tr. 215"}],"hook":{"icon":"🚂","text":"Hãy hình dung mỗi ý là một **toa tàu**. Liên từ là **khớp nối** giữa các toa. Tiếng Việt cũng có khớp nối: **và, nhưng, hoặc, nên**. Tiếng Anh có đúng bốn nhóm như vậy: **and, but, or, so**. Bài này dạy bạn chọn đúng khớp nối theo ý nghĩa, và dùng thêm những 'khớp nối dài' như **However, Therefore** để mở một câu mới."},"diagram":{"type":"flow","title":"Chọn từ nối cho hai ý ngang hàng","start":{"q":"Ý thứ hai so với ý thứ nhất là gì?","branches":[{"label":"Thêm vào","to":{"result":"AND: and, both…and, as well as, Besides","icon":"➕"}},{"label":"Trái ngược","to":{"result":"BUT: but, yet, However, Nevertheless","icon":"↔️"}},{"label":"Lựa chọn","to":{"result":"OR: or, either…or, neither…nor, Otherwise","icon":"🔀"}},{"label":"Kết quả","to":{"result":"SO: so, Therefore, As a result","icon":"➡️"}}]}},"chunks":[{"title":"Nhóm AND: thêm vào","icon":"➕","rule":"Dùng **and, both…and, not only…but also, as well as** để **thêm** một ý cùng loại vào ý trước.","explain":"Liên từ kết hợp (coordinating conjunction) nối những thứ **cùng chức năng**: danh từ với danh từ, tính từ với tính từ, mệnh đề với mệnh đề. **both…and** giống 'cả… lẫn…' trong tiếng Việt; **not only…but also** là 'không những… mà còn…'. Các cặp này đi đôi cố định, không được đổi vế sau.","formula":"A and B\nboth A and B\nnot only A but also B\nA as well as B","examples":[{"en":"Arlene Black has a yacht **and** a helicopter.","vi":"Arlene Black có một chiếc du thuyền và một chiếc trực thăng."},{"en":"**Both** she **and** her sister now live in New Orleans.","vi":"Hiện giờ cả cô ấy và chị cô ấy đều sống ở New Orleans."},{"en":"She is a talented musician **as well as** being a professional photographer.","vi":"Cô ấy là một nhạc sĩ có tài và cũng là một nhiếp ảnh gia chuyên nghiệp."},{"en":"She speaks both English or French.","ok":false,"note":"both phải đi với and"}],"mistake":{"wrong":"She is not only smart and also kind.","right":"She is not only smart but also kind.","why":"not only luôn đi cặp với **but also**, không phải and also."},"tip":"Cặp đôi không đổi: **both–and, either–or, neither–nor, not only–but also**.","src":"tr. 214","check":{"type":"fill","q":"She is not only smart ___ also kind.","answer":["but"],"explain":"not only… **but** also… = không những… mà còn…","src":"tr. 214"}},{"title":"Nhóm BUT: trái ngược","icon":"↔️","rule":"Dùng **but, yet** để nối hai ý **trái ngược** nhau trong cùng một câu.","explain":"**but** = nhưng. **yet** = 'thế mà, vậy mà', nhấn mạnh kết quả bất ngờ. Hãy tự hỏi: ý sau có đi **ngược** với điều người nghe chờ đợi sau ý trước không? Nếu có thì dùng but/yet.","formula":"Mệnh đề 1, but/yet mệnh đề 2","examples":[{"en":"He's intelligent **but** lazy.","vi":"Anh ta thông minh nhưng lười biếng."},{"en":"She worked hard, **yet** she failed.","vi":"Cô ấy học hành chăm chỉ, thế mà lại thi trượt."},{"en":"This phone is cheap **but** very good.","vi":"Cái điện thoại này rẻ nhưng rất tốt."}],"tip":"Rẻ **nhưng** tốt, chăm **mà** trượt → but / yet.","src":"tr. 214","check":{"type":"mcq","q":"She worked hard, ___ she failed.","options":["yet","so","or"],"answer":0,"explain":"Chăm chỉ mà vẫn trượt là điều trái ngược, bất ngờ → **yet**. so sẽ thành 'chăm chỉ nên trượt', vô lý.","src":"tr. 214"}},{"title":"Nhóm OR: lựa chọn","icon":"🔀","rule":"Dùng **or, either…or** để đưa ra **lựa chọn**; **neither…nor** = 'không… cũng không'; **or else** = 'nếu không thì'.","explain":"**either A or B** = hoặc A hoặc B. **neither A nor B** = cả A lẫn B đều không. **nor** cũng dùng một mình để thêm một ý phủ định. **or else** cảnh báo điều sẽ xảy ra nếu không làm theo.","formula":"A or B\neither A or B\nneither A nor B\nLàm X or else Y (nếu không thì Y)","examples":[{"en":"Which color do you want: red, yellow, blue **or** grey?","vi":"Bạn muốn màu nào: đỏ, vàng, xanh hay xám?"},{"en":"When will you get the results? – **Either** tomorrow **or** the day after.","vi":"Khi nào bạn có kết quả? – Hoặc ngày mai hoặc ngày kia."},{"en":"It was not my fault, **nor** his.","vi":"Đó không phải lỗi của tôi, cũng chẳng phải lỗi của anh ấy."},{"en":"Hurry up **or else** you'll be late.","vi":"Nhanh lên, nếu không bạn sẽ bị trễ."},{"en":"Neither Tom or Mary came.","ok":false,"note":"neither phải đi với nor"}],"mistake":{"wrong":"Neither Tom or Mary came.","right":"Neither Tom nor Mary came.","why":"neither đi cặp với **nor**, either đi cặp với **or**."},"tip":"Có chữ **n** thì đi với chữ **n**: **n**either – **n**or.","src":"tr. 215"},{"title":"Nhóm SO và trạng từ liên kết","icon":"🔗","rule":"**so** nối một **kết quả** trong cùng câu; các trạng từ liên kết như **Therefore, However, Besides, Otherwise** nối hai câu độc lập và thường đứng **đầu câu thứ hai**.","explain":"Sách xếp mỗi trạng từ liên kết (conjunctive adverb) vào một trong bốn nhóm: Besides/Moreover/Furthermore/In addition (thêm vào), However/Nevertheless/On the other hand (trái ngược), Otherwise/Or else (lựa chọn), Therefore/Consequently/As a result (kết quả). Trong các ví dụ của sách, chúng đứng sau dấu chấm, mở đầu câu sau, rồi có dấu phẩy.","diagram":{"type":"table","title":"Liên từ và trạng từ liên kết cùng nhóm","head":["Nghĩa","Trong 1 câu","Mở câu mới"],"rows":[["Thêm vào","and","Besides, Moreover, In addition"],["Trái ngược","but, yet","However, Nevertheless, On the other hand"],["Lựa chọn","or, or else","Otherwise, Or else"],["Kết quả","so","Therefore, Consequently, As a result"]]},"formula":"Câu 1, so câu 2.\nCâu 1. Therefore, câu 2.","examples":[{"en":"There weren't enough beds, **so** we had to sleep on the floor.","vi":"Không đủ giường nên chúng tôi phải ngủ dưới sàn."},{"en":"More women are working. **As a result**, the birth rate is falling.","vi":"Ngày càng nhiều phụ nữ đi làm. Kết quả là tỉ lệ sinh đang giảm."},{"en":"I don't want to go shopping. **Besides**, I haven't got any money.","vi":"Tôi không thích đi mua sắm. Hơn nữa, tôi cũng không có tiền."},{"en":"We thought that Emma should accept the offer. **Nevertheless**, she turned it down.","vi":"Chúng tôi nghĩ Emma nên nhận lời đề nghị. Tuy vậy, cô ấy đã từ chối."}],"mistake":{"wrong":"I was very tired. However, I went to bed early.","right":"I was very tired. Therefore, I went to bed early.","why":"Đi ngủ sớm là **kết quả** của mệt, không trái ngược → dùng nhóm SO (Therefore), không dùng However."},"tip":"Chọn trạng từ liên kết y như chọn and/but/or/so: hỏi **quan hệ nghĩa** trước, rồi lấy từ cùng nhóm.","src":"tr. 214–215"}],"practice":[{"type":"mcq","q":"Which do you want, tea ___ coffee?","options":["or","and","so"],"answer":0,"explain":"Câu hỏi 'Which' đòi **chọn một** → **or**. and sẽ thành lấy cả hai.","src":"tự soạn"},{"type":"mcq","q":"The food was delicious ___ very expensive.","options":["but","or","so"],"answer":0,"explain":"Ngon (tốt) mà rất đắt (không tốt) là trái ngược → **but**. so sẽ thành 'ngon nên đắt', or là lựa chọn, đều sai nghĩa.","src":"tự soạn"},{"type":"classify","q":"Xếp mỗi từ nối vào đúng nhóm nghĩa:","buckets":["Thêm vào","Trái ngược","Lựa chọn","Kết quả"],"items":[{"text":"moreover","bucket":0},{"text":"as well as","bucket":0},{"text":"nevertheless","bucket":1},{"text":"yet","bucket":1},{"text":"otherwise","bucket":2},{"text":"either…or","bucket":2},{"text":"therefore","bucket":3},{"text":"consequently","bucket":3}],"explain":"AND: moreover, as well as. BUT: nevertheless, yet. OR: otherwise, either…or. SO: therefore, consequently.","src":"tr. 214–215"},{"type":"fill","q":"She can speak both English ___ Chinese.","answer":["and"],"explain":"both luôn đi cặp với **and**.","src":"tự soạn"},{"type":"fill","q":"You can pay ___ by cash or by card.","answer":["either"],"hint":"hoặc… hoặc…","explain":"**either** … or … = hoặc… hoặc…","src":"tự soạn"},{"type":"fill","q":"Neither my brother ___ my sister likes fish.","answer":["nor"],"explain":"neither đi cặp với **nor**: cả anh tôi lẫn chị tôi đều không thích cá.","src":"tự soạn"},{"type":"fill","q":"My phone was broken, ___ I bought a new one.","answer":["so"],"hint":"chỉ kết quả","explain":"Mua điện thoại mới là **kết quả** của việc điện thoại hỏng → **so**.","src":"tự soạn"},{"type":"mcq","q":"I don't like this job. ___, the pay is very low.","options":["Besides","Therefore","Otherwise"],"answer":0,"explain":"Lương thấp là **thêm** một lý do nữa để không thích việc → **Besides** (hơn nữa). Therefore sẽ thành 'không thích việc nên lương thấp', vô lý.","src":"tự soạn"},{"type":"mcq","q":"Take an umbrella. ___, you'll get wet.","options":["Otherwise","However","Moreover"],"answer":0,"explain":"**Otherwise** = nếu không thì: mang ô đi, nếu không sẽ ướt. However là trái ngược, Moreover là thêm vào, đều sai nghĩa.","src":"tự soạn"},{"type":"fix","wrong":"She is not only beautiful and also kind.","answer":["She is not only beautiful but also kind."],"explain":"not only đi cặp với **but also**.","src":"tự soạn"},{"type":"fix","wrong":"He studied very hard. However, he passed the exam easily.","answer":["He studied very hard. Therefore, he passed the exam easily.","He studied very hard. Therefore he passed the exam easily.","He studied very hard. As a result, he passed the exam easily.","He studied very hard. As a result he passed the exam easily.","He studied very hard. Consequently, he passed the exam easily.","He studied very hard. Consequently he passed the exam easily."],"explain":"Đỗ dễ dàng là **kết quả** của học chăm → dùng Therefore / As a result / Consequently. However chỉ sự trái ngược.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["It","was","raining,","so","we","stayed","at","home."],"explain":"Nguyên nhân trước, **so** + kết quả sau: Trời mưa nên chúng tôi ở nhà.","src":"tự soạn"}],"flashcards":[{"front":"4 nhóm liên từ kết hợp và nghĩa của chúng?","back":"**AND** thêm vào · **BUT** trái ngược · **OR** lựa chọn · **SO** kết quả"},{"front":"both / either / neither / not only đi cặp với từ nào?","back":"both–**and**, either–**or**, neither–**nor**, not only–**but also**"},{"front":"However, Nevertheless thuộc nhóm nghĩa nào?","back":"Nhóm **BUT** (trái ngược), mở câu mới: I was tired. **However**, I kept working."},{"front":"Therefore, As a result, Consequently thuộc nhóm nào?","back":"Nhóm **SO** (kết quả): More women are working. **As a result**, the birth rate is falling."},{"front":"Otherwise nghĩa là gì?","back":"**Nếu không thì**: Take an umbrella. **Otherwise**, you'll get wet."}]},{"id":"09b","title":"Liên từ phụ thuộc","minutes":25,"goal":"Dùng liên từ phụ thuộc để mở mệnh đề phụ chỉ thời gian, lý do, điều kiện, tương phản, mục đích, kết quả (so/such…that) và that; tránh lỗi 'Vì… nên…', 'Mặc dù… nhưng…'.","pretest":[{"type":"mcq","q":"___ it was raining, we went out.","options":["Although","Because","So"],"answer":0,"explain":"Mưa mà vẫn đi ra ngoài là tương phản → **Although** (mặc dù).","src":"tự soạn"},{"type":"mcq","q":"It was ___ a boring film that I fell asleep.","options":["such","so","very"],"answer":0,"explain":"Trước **a + tính từ + danh từ** dùng **such**.","src":"tr. 217"},{"type":"mcq","q":"I'll call you ___ I get home.","options":["as soon as","so","but"],"answer":0,"explain":"**as soon as** = ngay khi, chỉ thời gian.","src":"tr. 215"}],"hook":{"icon":"🧩","text":"Liên từ kết hợp nối hai toa **ngang hàng**. Liên từ phụ thuộc thì khác: nó gắn một **toa phụ** vào câu chính. Toa phụ không tự chạy được: 'Because I was tired.' nghe chưa trọn ý, giống 'Vì tôi mệt.' trong tiếng Việt. Từ đứng đầu toa phụ (because, when, if, although…) cho biết toa đó trả lời câu hỏi gì: **khi nào, tại sao, nếu sao, dù sao, để làm gì**."},"diagram":{"type":"flow","title":"Mệnh đề phụ trả lời câu hỏi nào?","start":{"q":"Mệnh đề phụ nói về gì?","branches":[{"label":"Thời gian / lý do","to":{"q":"Khi nào hay tại sao?","branches":[{"label":"Khi nào?","to":{"result":"WHEN: when, while, as soon as, until","icon":"⏰"}},{"label":"Tại sao?","to":{"result":"BECAUSE: because, as, since","icon":"❓"}}]}},{"label":"Điều kiện / tương phản","to":{"q":"'Nếu…' hay 'Dù…'?","branches":[{"label":"Nếu…","to":{"result":"IF: if, unless, in case","icon":"🔑"}},{"label":"Dù…","to":{"result":"THOUGH: although, even though, whereas","icon":"⚖️"}}]}},{"label":"Mục đích / mức độ","to":{"q":"'Để…' hay 'Đến nỗi…'?","branches":[{"label":"Để…","to":{"result":"so that, in order that","icon":"🎯"}},{"label":"Đến nỗi…","to":{"result":"so/such … that","icon":"💥"}}]}}]}},"chunks":[{"title":"Thời gian và lý do: WHEN, BECAUSE","icon":"⏰","rule":"Mệnh đề chỉ **thời gian** mở đầu bằng **when, while, as soon as, after, before, until, since**; mệnh đề chỉ **lý do** mở đầu bằng **because, as, since**.","explain":"Liên từ phụ thuộc (subordinating conjunction) + chủ ngữ + động từ = một mệnh đề phụ. Mệnh đề phụ có thể đứng trước (thêm dấu phẩy) hoặc sau mệnh đề chính. Lưu ý ngoài sách: tiếng Việt nói 'Vì… nên…', nhưng tiếng Anh chỉ dùng **một** từ nối: because HOẶC so, không dùng cả hai.","formula":"Liên từ + S + V, mệnh đề chính.\nMệnh đề chính + liên từ + S + V.","examples":[{"en":"I'll phone you **as soon as** I get home from work.","vi":"Tôi sẽ gọi cho bạn ngay khi đi làm về."},{"en":"**When** he saw me, he waved.","vi":"Khi thấy tôi, anh ấy vẫy tay."},{"en":"**Because** I liked him, I tried to help him.","vi":"Vì quý anh ấy, tôi đã cố giúp anh ấy."},{"en":"Because it rained, so we stayed at home.","ok":false,"note":"đã có because thì bỏ so"}],"mistake":{"wrong":"Because it rained, so we stayed at home.","right":"Because it rained, we stayed at home.","why":"'Vì… nên…' là cách nói tiếng Việt; tiếng Anh chỉ giữ **because** hoặc chỉ giữ **so**."},"tip":"Vì… nên… → chọn **một**: 'Because A, B.' hoặc 'A, so B.'","src":"tr. 215–216","check":{"type":"mcq","q":"___ I was cooking, the phone rang.","options":["While","Because","So"],"answer":0,"explain":"**While** = trong khi (thời gian): đang nấu ăn thì điện thoại reo.","src":"tự soạn"}},{"title":"Điều kiện và tương phản: IF, THOUGH","icon":"⚖️","rule":"**if, unless, in case, provided (that)** nêu **điều kiện**; **although, though, even though, while, whereas** nêu ý **tương phản** ('mặc dù', 'trong khi đó').","explain":"Lưu ý ngoài sách: **unless** ≈ if… not (trừ khi); **in case** = phòng khi. **while/whereas** đặt hai người/vật đối lập cạnh nhau. Sách còn cho **whatever, whoever, whether… or not** dùng như liên từ tương phản, nghĩa 'cho dù…'. Giống lỗi Vì… nên…: tiếng Việt nói 'Mặc dù… nhưng…', tiếng Anh **không** thêm but sau although.","formula":"If/Unless + S + V, mệnh đề chính.\nAlthough + S + V, mệnh đề chính (không có but).","examples":[{"en":"**If** you need help, just let me know.","vi":"Nếu bạn cần giúp đỡ, cứ cho tôi biết."},{"en":"You can go out to play **provided that** you finish your homework first.","vi":"Con có thể đi chơi với điều kiện là phải làm xong bài tập về nhà trước đã."},{"en":"**Although** I don't agree with him, I think he's honest.","vi":"Dù không đồng tình với anh ấy, tôi vẫn nghĩ anh ấy thật lòng."},{"en":"I like the mountains, **whereas** my wife prefers the seaside.","vi":"Tôi thích miền núi, trong khi vợ tôi lại thích miền biển hơn."},{"en":"Keep calm **whatever** happens.","vi":"Hãy bình tĩnh cho dù chuyện gì xảy ra đi nữa."},{"en":"Although it was cold, but we went swimming.","ok":false,"note":"đã có although thì bỏ but"}],"mistake":{"wrong":"Although it was cold, but we went swimming.","right":"Although it was cold, we went swimming.","why":"Tiếng Anh chỉ dùng **although** hoặc **but**, không dùng cả hai như 'Mặc dù… nhưng…'."},"tip":"Mặc dù… nhưng… → 'Although A, B.' hoặc 'A, but B.'","src":"tr. 216"},{"title":"Mục đích và kết quả: so that, so/such…that","icon":"🎯","rule":"**so that / in order that** + mệnh đề = 'để'; **so + tính từ/trạng từ + that** và **such + (a/an) + tính từ + danh từ + that** = 'quá… đến nỗi'.","explain":"**for fear that** = 'vì sợ rằng'. Với so/such…that, nhìn từ đứng **ngay sau** chỗ trống: chỉ có tính từ/trạng từ (angry, fast) → **so**; có danh từ đi kèm (a boring speech) → **such**.","formula":"… so that / in order that + S + V\nso + adj/adv + that + S + V\nsuch + (a/an) + adj + N + that + S + V","diagram":{"type":"flow","title":"so hay such?","start":{"q":"Sau chỗ trống có danh từ không?","branches":[{"label":"Không: chỉ tính từ/trạng từ","to":{"result":"so angry that…","icon":"🔹"}},{"label":"Có: (a/an) + tính từ + danh từ","to":{"result":"such a boring speech that…","icon":"🔸"}}]}},"examples":[{"en":"Send the letter express, **so that** they'll get it before Tuesday.","vi":"Hãy gửi thư hỏa tốc để họ nhận được trước thứ Ba."},{"en":"We spoke in whispers **for fear that** we might wake the baby.","vi":"Chúng tôi nói thì thầm vì sợ làm em bé thức giấc."},{"en":"Emma was **so** angry **that** she couldn't speak.","vi":"Emma tức giận đến nỗi không nói được."},{"en":"It was **such** a boring speech **that** I fell asleep.","vi":"Bài diễn văn chán đến nỗi tôi ngủ gật."},{"en":"It was so a boring speech that I fell asleep.","ok":false,"note":"có danh từ → such"}],"mistake":{"wrong":"She is such kind that everyone loves her.","right":"She is so kind that everyone loves her.","why":"Sau chỗ trống chỉ có tính từ **kind**, không có danh từ → dùng **so**."},"tip":"**such** đi với **danh từ** (such a day), **so** đi với **tính từ** (so hot).","src":"tr. 216–217","check":{"type":"fill","q":"The coffee was ___ hot that I couldn't drink it.","answer":["so"],"explain":"Sau chỗ trống chỉ có tính từ hot → **so**.","src":"tự soạn"}},{"title":"THAT và những từ hai nghĩa","icon":"💬","rule":"**that** mở đầu mệnh đề nêu **lời tuyên bố, ý kiến, sự kiện** (I think that…); **since, as** vừa chỉ thời gian vừa chỉ lý do, **while** vừa chỉ thời gian vừa chỉ tương phản.","explain":"Mệnh đề that đóng vai như một danh từ (mệnh đề danh từ), thường đứng sau think, understand, know hoặc sau 'It's possible…'. Với since, as, while, sách xếp mỗi từ vào hai nhóm, nên bạn phải đọc cả câu để biết nghĩa nào.","formula":"S + think/understand/know + that + S + V\nIt's possible that + S + V","examples":[{"en":"I understood **that** he was innocent.","vi":"Tôi hiểu rằng anh ấy vô tội."},{"en":"It's possible **that** he hasn't received the letter.","vi":"Có thể là anh ấy chưa nhận được thư."},{"en":"**Since** I liked him, I tried to help him.","vi":"Vì quý anh ấy, tôi đã cố giúp anh ấy. (since = vì)"},{"en":"I like the mountains, **while** my wife prefers the seaside.","vi":"Tôi thích miền núi, còn vợ tôi thích miền biển hơn. (while = trong khi đó)"}],"tip":"Gặp **since / as / while** → hỏi: câu này nói về **thời gian** hay **lý do / đối lập**?","src":"tr. 215–217"}],"practice":[{"type":"classify","q":"Xếp mỗi liên từ vào đúng nhóm nghĩa:","buckets":["Thời gian","Lý do","Điều kiện","Tương phản"],"items":[{"text":"as soon as","bucket":0},{"text":"until","bucket":0},{"text":"because","bucket":1},{"text":"unless","bucket":2},{"text":"provided that","bucket":2},{"text":"in case","bucket":2},{"text":"although","bucket":3},{"text":"whereas","bucket":3}],"explain":"WHEN: as soon as, until. BECAUSE: because. IF: unless, provided that, in case. THOUGH: although, whereas.","src":"tr. 215–216"},{"type":"mcq","q":"I'll wait here ___ you come back.","options":["until","because","although"],"answer":0,"explain":"**until** = cho đến khi: đợi ở đây cho đến khi bạn quay lại. because và although sai nghĩa.","src":"tự soạn"},{"type":"mcq","q":"Since it's late, let's go home. → since ở đây nghĩa là:","options":["vì","từ khi","mặc dù"],"answer":0,"explain":"'Muộn rồi' là **lý do** để về nhà → since
