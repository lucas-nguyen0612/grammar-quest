<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ngữ pháp Chương 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --surface-2: #f1eee7;
  --text: #1f2328;
  --muted: #5d636b;
  --border: #e2ddd2;
  --accent: #3b5bdb;
  --accent-soft: #e7ecff;
  --ok: #2f9e44;
  --ok-soft: #e6f6ea;
  --bad: #d6336c;
  --bad-soft: #fde8ef;
  --warn: #e8890c;
  --warn-soft: #fff3e0;
  --c1: #3b5bdb; --c2: #0c8599; --c3: #2f9e44; --c4: #e8590c; --c5: #ae3ec9; --c6: #c2255c;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171c; --surface: #1d2027; --surface-2: #252932; --text: #e8eaed; --muted: #a1a7b0;
    --border: #333844; --accent: #7b93ff; --accent-soft: #263056; --ok: #51cf66; --ok-soft: #1f3a27;
    --bad: #ff6b9b; --bad-soft: #43202d; --warn: #ffa94d; --warn-soft: #3d2c16;
    --c1: #7b93ff; --c2: #3bc9db; --c3: #69db7c; --c4: #ff922b; --c5: #da77f2; --c6: #f06595;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171c; --surface: #1d2027; --surface-2: #252932; --text: #e8eaed; --muted: #a1a7b0;
  --border: #333844; --accent: #7b93ff; --accent-soft: #263056; --ok: #51cf66; --ok-soft: #1f3a27;
  --bad: #ff6b9b; --bad-soft: #43202d; --warn: #ffa94d; --warn-soft: #3d2c16;
  --c1: #7b93ff; --c2: #3bc9db; --c3: #69db7c; --c4: #ff922b; --c5: #da77f2; --c6: #f06595;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
.en { font-family: "Source Serif 4", Georgia, serif; }

.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
}
.topbar .brand { font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.iconbtn { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; }

main { max-width: 860px; margin: 0 auto; padding: 20px 16px 80px; }
.crumbs { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.crumbs a { color: var(--muted); }
h1 { font-size: 28px; line-height: 1.25; margin: 4px 0 8px; }
h2 { font-size: 21px; margin: 28px 0 10px; }
h3 { font-size: 18px; margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px; margin: 14px 0;
}
.hero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.hero .big-icon { font-size: 52px; line-height: 1; }
.pill { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); margin: 2px 4px 2px 0; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.topic-card { display: block; color: var(--text); transition: transform .15s ease, box-shadow .15s ease; margin: 0; }
.topic-card:hover { transform: translateY(-2px); }
.topic-card .ico { font-size: 30px; }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.bar > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .8s ease; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 12px;
  padding: 10px 18px; background: var(--accent); color: #fff; font-weight: 600;
  transition: transform .1s ease, filter .15s ease;
}
:root[data-theme="dark"] .btn, :root:not([data-theme="light"]) .btn { color: #fff; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.97); }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn.ok { background: var(--ok); }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.lesson-list a { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; color: var(--text); border: 1px solid var(--border); background: var(--surface); margin: 8px 0; }
.lesson-list a:hover { border-color: var(--accent); }
.lesson-list .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-weight: 700; flex: none; }
.lesson-list .num.done { background: var(--ok); color: #fff; }

/* stepper */
.stepper { display: flex; gap: 6px; margin: 12px 0 18px; }
.stepper i { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); transition: background .3s; }
.stepper i.on { background: var(--accent); }
.stepper i.past { background: var(--ok); }
.step-title { display: flex; align-items: center; gap: 10px; }
.step-title .ico { font-size: 30px; }
.step-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }

/* chunk */
.chunk .rule {
  font-size: 18px; font-weight: 600; padding: 12px 14px; border-left: 4px solid var(--accent);
  background: var(--accent-soft); border-radius: 0 10px 10px 0; margin: 10px 0;
}
.formula {
  font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 15px; background: var(--surface-2);
  padding: 10px 14px; border-radius: 10px; margin: 10px 0; overflow-x: auto; white-space: pre-wrap;
}
.ex { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px dashed var(--border); }
.ex:last-child { border-bottom: 0; }
.ex .mark { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; margin-top: 2px; }
.ex .mark.y { background: var(--ok); }
.ex .mark.n { background: var(--bad); }
.ex .en { font-size: 17px; }
.ex.wrong .en { text-decoration: line-through; text-decoration-color: var(--bad); }
.ex .vi { color: var(--muted); font-size: 14px; }
.ex .note { font-size: 13px; color: var(--accent); }
.tip, .mistake, .hook { border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
.tip { background: var(--warn-soft); }
.mistake { background: var(--bad-soft); }
.hook { background: var(--accent-soft); font-size: 17px; }
.src { font-size: 12px; color: var(--muted); }
strong { color: var(--accent); }
del { color: var(--bad); }

/* questions */
.q { padding: 14px 0; border-bottom: 1px solid var(--border); }
.q:last-child { border-bottom: 0; }
.q .qtext { font-size: 17px; margin-bottom: 10px; }
.q .qnum { display: inline-grid; place-items: center; min-width: 26px; height: 26px; border-radius: 8px; background: var(--surface-2); font-size: 13px; font-weight: 700; margin-right: 8px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface); transition: border-color .15s, background .15s; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s; }
.opt[disabled] { cursor: default; }
input.blank, textarea.fixbox {
  font: inherit; color: var(--text); background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 8px; padding: 4px 10px;
}
input.blank { width: 9em; margin: 0 4px; }
textarea.fixbox { width: 100%; min-height: 54px; padding: 8px 12px; resize: vertical; }
input.blank:focus, textarea.fixbox:focus { outline: 2px solid var(--accent); border-color: transparent; }
input.blank.correct, textarea.fixbox.correct { border-color: var(--ok); background: var(--ok-soft); }
input.blank.wrong, textarea.fixbox.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s; }
.fixsrc { font-size: 16px; padding: 8px 12px; background: var(--bad-soft); border-radius: 8px; margin-bottom: 8px; }
.check-row { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.feedback { margin-top: 10px; padding: 10px 14px; border-radius: 10px; font-size: 15px; animation: pop .3s ease; }
.feedback.good { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback .ans { font-weight: 600; }
.classify-item { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0; }
.classify-item .it { min-width: 9em; font-size: 16px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-size: 14px; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button.sel { background: var(--accent); color: #fff; }
.seg.correct { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok-soft); }
.seg.wrong { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; padding: 6px; border-radius: 10px; }
.chips.target { border: 1.5px dashed var(--border); margin-bottom: 8px; }
.chip { padding: 6px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); animation: pop .2s ease; }
.chip.used { visibility: hidden; }
.score { font-size: 40px; font-weight: 800; }

/* diagrams */
.diagram { margin: 14px 0; }
.diagram .dtitle { font-weight: 700; margin-bottom: 6px; }
.diagram .scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
.diagram svg { display: block; }
.diagram .hint { font-size: 12px; color: var(--muted); }
svg .node rect { stroke-width: 1.5; }
svg .node text { fill: var(--text); font-size: 13px; font-family: inherit; }
svg .node.root text { font-weight: 700; font-size: 15px; }
svg .node.result rect { fill: var(--ok-soft); stroke: var(--ok); }
svg .node.ask rect { fill: var(--surface); stroke: var(--accent); stroke-dasharray: 0; }
svg .link { fill: none; stroke-width: 2; }
svg .elabel { font-size: 12px; font-weight: 700; fill: var(--muted); }
svg .elabel-bg { fill: var(--bg); }
.anim svg .link { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1s ease forwards; }
.anim svg .node, .anim svg .elabel-g { opacity: 0; animation: fadein .45s ease forwards; }
table.cmp { width: 100%; border-collapse: collapse; font-size: 15px; }
table.cmp th, table.cmp td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
table.cmp th { background: var(--surface-2); }
table.cmp tr { animation: fadein .4s ease both; }
.table-wrap { overflow-x: auto; }

/* flashcards */
.flash { perspective: 1000px; height: 190px; margin: 10px 0; cursor: pointer; }
.flash .inner { position: relative; width: 100%; height: 100%; transition: transform .55s; transform-style: preserve-3d; }
.flash.flipped .inner { transform: rotateY(180deg); }
.flash .face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--radius);
  display: grid; place-items: center; text-align: center; padding: 18px; font-size: 19px; border: 1px solid var(--border); box-shadow: var(--shadow);
}
.flash .front { background: var(--surface); }
.flash .back { background: var(--accent-soft); transform: rotateY(180deg); font-size: 17px; }
.mini-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.mini-cards .flash { height: 150px; margin: 0; }
.mini-cards .flash .face { font-size: 16px; }

.ring { width: 84px; height: 84px; }
.ring circle { fill: none; stroke-width: 9; }
.ring .bg { stroke: var(--surface-2); }
.ring .fg { stroke: var(--ok); stroke-linecap: round; transition: stroke-dashoffset 1s ease; transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring text { font-size: 20px; font-weight: 800; fill: var(--text); }

.reveal { opacity: 0; transform: translateY(14px); transition: opacity .5s ease, transform .5s ease; }
.reveal.in { opacity: 1; transform: none; }
.confetti { position: fixed; top: -20px; z-index: 99; pointer-events: none; font-size: 22px; animation: fall 1.8s ease-in forwards; }

@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .2; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .reveal { opacity: 1; transform: none; }
  .anim svg .link { stroke-dashoffset: 0; } .anim svg .node, .anim svg .elabel-g { opacity: 1; }
}
@media (max-width: 560px) {
  h1 { font-size: 24px; }
  .card { padding: 14px; }
  .flash { height: 210px; }
}
em { font-style: italic; color: inherit; }

</style>
</head>

<script id="course-data" type="application/json">{"slug":"mlh-chuong-1-tu-loai","title":"Chương 1 · Từ loại","short_title":"Ngữ pháp Chương 1","icon":"📘","subtitle":"11 chủ đề · 39 bài, mỗi bài 25 phút. Học mỗi ngày một bài, ôn theo lịch.","source":"Giải thích ngữ pháp tiếng Anh, Mai Lan Hương & Hà Thanh Uyên (tr. 5–253)","mindmap":{"label":"Từ loại","children":[{"label":"Gọi tên","icon":"🏷️","children":[{"label":"📦 Danh từ"},{"label":"👤 Đại từ"},{"label":"🎯 Mạo từ"},{"label":"🔢 Lượng từ"}]},{"label":"Miêu tả","icon":"🎨","children":[{"label":"🌈 Tính từ"},{"label":"⚡ Trạng từ"},{"label":"⚖️ So sánh"}]},{"label":"Hành động","icon":"🏃","children":[{"label":"🔧 Động từ"},{"label":"🧩 Cụm động từ"}]},{"label":"Nối kết","icon":"🔗","children":[{"label":"📍 Giới từ"},{"label":"🪢 Liên từ"}]}]},"topics":[{"id":"01-danh-tu","title":"Danh từ","en":"Nouns","icon":"📦","pages":"5–35","summary":"Danh từ là tên gọi của người, con vật, đồ vật, nơi chốn, ý tưởng. Chủ đề này dạy bạn 4 việc: nhận ra danh từ đếm được hay không đếm được, biến danh từ thành số nhiều, chọn động từ số ít hay số nhiều cho đúng chủ ngữ, và nói 'của ai' bằng 's hoặc of.","mindmap":{"label":"Danh từ","children":[{"label":"Phân loại","icon":"🏷️","children":[{"label":"Chung / riêng: city / Hanoi"},{"label":"Đếm được: apple, pen"},{"label":"Không đếm được: water, furniture"}]},{"label":"Số nhiều","icon":"➕","children":[{"label":"+s / +es: cats, boxes"},{"label":"-y → -ies, -f → -ves"},{"label":"Bất quy tắc: men, children"}]},{"label":"Chủ ngữ – động từ","icon":"🤝","children":[{"label":"Số ít → is / has / V-s"},{"label":"Số nhiều → are / have / V"},{"label":"Hai danh từ: chia theo cái nào?"}]},{"label":"Sở hữu cách","icon":"🔑","children":[{"label":"Người: Mary's dog"},{"label":"Vật: the top of the page"}]}]},"lessons":[{"id":"01a","title":"Các loại danh từ; đếm được hay không đếm được?","minutes":25,"goal":"Nhận ra danh từ chung/riêng, phân biệt danh từ đếm được và không đếm được, và biết từ nào (a/an, many, much, some) đi được với loại nào.","pretest":[{"type":"mcq","q":"Đoán thử: câu nào đúng?","options":["We've just bought some new furniture.","We've just bought a new furniture.","We've just bought new furnitures."],"answer":0,"explain":"**furniture** (đồ đạc) là danh từ không đếm được: không đi với **a**, không thêm **-s**. Dùng **some**.","src":"tr. 6"},{"type":"classify","q":"Đoán thử: từ nào đếm được từng cái?","buckets":["Đếm được","Không đếm được"],"items":[{"text":"apple","bucket":0},{"text":"water","bucket":1},{"text":"pen","bucket":0},{"text":"information","bucket":1}],"explain":"Táo, bút: đếm được từng cái. Nước, thông tin: không tách ra từng cái để đếm được.","src":"tr. 6"}],"hook":{"icon":"🧺","text":"Hãy nghĩ tới **quả táo** và **nước**. Táo bạn đếm được: một quả, hai quả. Nước thì không: bạn không nói 'hai nước', mà phải đong bằng **cốc, chai**. Tiếng Anh chia danh từ đúng theo cách đó, và cách chia này quyết định bạn được dùng **a/an**, **-s**, **many** hay **much**."},"diagram":{"type":"flow","title":"Danh từ này đi với từ nào?","start":{"q":"Đếm được từng cái không?","branches":[{"label":"Có","to":{"q":"Một cái hay nhiều cái?","branches":[{"label":"Một","to":{"result":"a/an + N: a pen","icon":"🍎"}},{"label":"Nhiều","to":{"result":"many / few + N-s: many pens","icon":"🍏"}}]}},{"label":"Không","to":{"q":"Muốn đếm nó?","branches":[{"label":"Không","to":{"result":"some / much + N: some water","icon":"💧"}},{"label":"Có","to":{"result":"Đơn vị: two bottles of water","icon":"🍶"}}]}}]}},"chunks":[{"title":"Danh từ là gì? Chung và riêng","icon":"🏷️","rule":"Danh từ là tên của người, vật, nơi chốn, ý tưởng. **Danh từ riêng** (tên riêng) luôn **viết hoa** chữ cái đầu.","explain":"Danh từ (noun) trả lời câu hỏi 'cái gì? ai?'. Danh từ chung (common noun) gọi chung cả loại: city, river, teacher. Danh từ riêng (proper noun) là tên của một người/nơi cụ thể: Hanoi, Mary. Trong danh từ chung có nhóm **danh từ tập hợp** (collective noun) chỉ cả một nhóm: family, team, police. Ngoài ra có danh từ cụ thể (sờ, thấy được: car, rain) và trừu tượng (ý tưởng, cảm giác: freedom, beauty).","diagram":{"type":"mindmap","title":"Các cách chia danh từ","root":{"label":"Danh từ","children":[{"label":"Chung: city, teacher"},{"label":"Riêng: Hanoi, Mary"},{"label":"Tập hợp: family, team"},{"label":"Cụ thể: car, rain"},{"label":"Trừu tượng: freedom, beauty"}]}},"examples":[{"en":"**Mary** lives in **Hanoi**.","vi":"Mary sống ở Hà Nội."},{"en":"My **family** is small.","vi":"Gia đình tôi nhỏ."},{"en":"I live in hanoi.","ok":false,"note":"tên thành phố phải viết hoa: Hanoi"}],"tip":"Tên riêng = chữ hoa. Hỏi: 'Đây là tên của một người/nơi duy nhất?' → viết hoa.","src":"tr. 5–6"},{"title":"Danh từ đếm được","icon":"🍎","rule":"Danh từ **đếm được** có số ít và số nhiều: số ít đi với **a/an**, số nhiều đi với **some, any, many, few**.","explain":"Tiếng Việt nói 'tôi có xe' là đủ. Tiếng Anh thì không để danh từ đếm được số ít đứng một mình: phải có **a/an** (hoặc my, the…) đứng trước. Khi nhiều hơn một, danh từ thêm **-s**.","formula":"a/an + N số ít\nsome / many / few + N số nhiều","examples":[{"en":"I have **a** pen.","vi":"Tôi có một cây bút."},{"en":"She has **three** horses.","vi":"Cô ấy có ba con ngựa."},{"en":"He has **a few** ideas.","vi":"Anh ấy có vài ý tưởng."},{"en":"I have car.","ok":false,"note":"thiếu a: a car"}],"mistake":{"wrong":"I have car.","right":"I have a car.","why":"car đếm được, số ít thì phải có a/an đứng trước."},"tip":"Đếm được → hỏi được 'How many?' (bao nhiêu cái?).","src":"tr. 6","check":{"type":"mcq","q":"Câu nào đúng?","options":["I need a pen.","I need pen."],"answer":0,"explain":"pen đếm được, số ít → cần **a**.","src":"tự soạn"}},{"title":"Danh từ không đếm được","icon":"💧","rule":"Danh từ **không đếm được** không có **-s**, không đi với **a/an**; dùng **some, any, much, a lot of, a little**. Muốn đếm thì thêm **đơn vị**: a piece of, a bottle of.","explain":"Đó là chất lỏng, vật liệu, ý niệm chung: water, money, furniture (đồ đạc), information (thông tin), advice (lời khuyên). Trong tiếng Việt 'thông tin' đếm được ('ba thông tin'), nhưng tiếng Anh thì không: phải nói **three pieces of information**. Đơn vị (piece, bottle, glass) mới là thứ thêm -s.","formula":"some / much / a little + N\na piece of / a bottle of / a glass of + N","examples":[{"en":"We've just bought **some** new **furniture**.","vi":"Chúng tôi vừa mua ít đồ đạc mới."},{"en":"**three bottles of** wine","vi":"ba chai rượu vang"},{"en":"an interesting **piece of information**","vi":"một thông tin thú vị"},{"en":"We've just bought a new furniture.","ok":false,"note":"furniture không đi với a"}],"mistake":{"wrong":"She gave me many informations.","right":"She gave me a lot of information.","why":"information không đếm được: không thêm -s, không dùng many."},"tip":"Không đếm được → hỏi 'How much?' (bao nhiêu lượng?). Muốn đếm → đếm cái **vỏ**: chai, cốc, mẩu.","src":"tr. 6–7","check":{"type":"mcq","q":"Chọn câu đúng:","options":["I need some information.","I need an information.","I need informations."],"answer":0,"explain":"information không đếm được → không a/an, không -s; dùng **some**.","src":"tự soạn"}},{"title":"Một từ, hai cách dùng","icon":"🔄","rule":"Nhiều danh từ **không đếm được** trở thành **đếm được** khi chỉ **một vật cụ thể** hay **một ly, một tách** — và nghĩa thay đổi.","explain":"paper (giấy) không đếm được, nhưng **a paper** là một tờ báo. coffee, tea (cà phê, trà nói chung) không đếm được, nhưng gọi đồ uống thì nói **three teas** (ba tách trà). hair là cả mái tóc; **hairs** là từng sợi tóc. Tên riêng cũng có thể đếm: **three Davids** (ba bạn tên David).","examples":[{"en":"**Three teas** and **a coffee**, please.","vi":"Cho ba tách trà và một cà phê."},{"en":"I bought **a paper** this morning.","vi":"Sáng nay tôi mua một tờ báo."},{"en":"He has **a few grey hairs**.","vi":"Anh ấy có vài sợi tóc bạc."},{"en":"How many **sugars** do you want?","vi":"Bạn muốn mấy viên/thìa đường?"}],"tip":"Nghĩa 'một cái cụ thể / một ly' → đếm được. Nghĩa 'chất liệu, nói chung' → không đếm được.","src":"tr. 7"}],"practice":[{"type":"classify","q":"Xếp mỗi danh từ vào đúng nhóm:","buckets":["Danh từ chung","Danh từ riêng"],"items":[{"text":"city","bucket":0},{"text":"Hanoi","bucket":1},{"text":"river","bucket":0},{"text":"the Rhine","bucket":1},{"text":"Mary","bucket":1},{"text":"teacher","bucket":0}],"explain":"Danh từ riêng là tên của một người/nơi cụ thể và viết hoa: Hanoi, the Rhine, Mary.","src":"tr. 5"},{"type":"classify","q":"Xếp mỗi danh từ vào đúng nhóm:","buckets":["Đếm được","Không đếm được"],"items":[{"text":"chair","bucket":0},{"text":"furniture","bucket":1},{"text":"idea","bucket":0},{"text":"water","bucket":1},{"text":"information","bucket":1},{"text":"horse","bucket":0},{"text":"money","bucket":1},{"text":"pen","bucket":0}],"explain":"chair, idea, horse, pen đếm được từng cái. furniture, water, information, money là khối/chung → không đếm được.","src":"tr. 6"},{"type":"mcq","q":"I'd like ___ information about the course.","options":["some","an","many"],"answer":0,"explain":"information không đếm được → không dùng **an**, không dùng **many**; dùng **some**.","src":"tự soạn"},{"type":"mcq","q":"Chọn câu đúng:","options":["She has a dog.","She has dog.","She has a dogs."],"answer":0,"explain":"dog đếm được, số ít → cần **a**. 'a dogs' sai vì a chỉ đi với số ít.","src":"tự soạn"},{"type":"fill","q":"Can I have two ___ of water, please? (bottle)","answer":["bottles"],"hint":"đơn vị mới thêm -s","explain":"water không đếm được; ta đếm cái chai: **two bottles of** water.","src":"tr. 7"},{"type":"fill","q":"I don't have ___ money. (much hay many?)","answer":["much"],"explain":"money không đếm được → **much**. many chỉ đi với danh từ số nhiều đếm được.","src":"tự soạn"},{"type":"mcq","q":"Câu nào nói về **một tờ báo**?","options":["I bought a paper.","I need some paper to write on."],"answer":0,"explain":"**a paper** (đếm được) = một tờ báo. **some paper** (không đếm được) = giấy để viết.","src":"tr. 7"},{"type":"mcq","q":"Ở quán cà phê: \"___ and a coffee, please.\"","options":["Three teas","Three tea","Three piece of tea"],"answer":0,"explain":"Gọi đồ uống thì tea đếm được (= tách trà) → **three teas**.","src":"tr. 7"},{"type":"fix","wrong":"I need an advice.","answer":["I need some advice.","I need advice.","I need a piece of advice."],"explain":"advice (lời khuyên) không đếm được → bỏ **an**, dùng some hoặc a piece of.","src":"tự soạn"},{"type":"fix","wrong":"I have car.","answer":["I have a car."],"explain":"car đếm được số ít → phải có **a**.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Can","I","have","a","glass","of","water?"],"explain":"water không đếm được → đếm bằng **a glass of**.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["How","much","money","do","you","have?"],"explain":"money không đếm được → **How much**.","src":"tự soạn"}],"flashcards":[{"front":"a/an đi với loại danh từ nào?","back":"Danh từ **đếm được số ít**: a pen, an idea"},{"front":"furniture, information, money: đếm được không?","back":"**Không**. Không -s, không a/an: some furniture"},{"front":"Muốn đếm danh từ không đếm được thì làm sao?","back":"Thêm **đơn vị**: two bottles of water, a piece of information"},{"front":"a paper nghĩa là gì?","back":"**một tờ báo** (paper không đếm được = giấy)"},{"front":"much hay many + money?","back":"**much** money (không đếm được)"}]},{"id":"01b","title":"Số nhiều của danh từ","minutes":25,"goal":"Viết đúng số nhiều của danh từ: thêm -s/-es, đổi -y/-f/-o, nhớ các từ bất quy tắc và số nhiều của danh từ ghép.","pretest":[{"type":"mcq","q":"Đoán thử: số nhiều của **child**?","options":["children","childs","childes"],"answer":0,"explain":"child là từ bất quy tắc: **children**.","src":"tr. 11"},{"type":"mcq","q":"Đoán thử: số nhiều của **tomato**?","options":["tomatoes","tomatos","tomatis"],"answer":0,"explain":"Phụ âm + o → thêm **-es**: tomatoes.","src":"tr. 11"}],"hook":{"icon":"🧩","text":"Tiếng Việt chỉ cần thêm 'các, những': 'những con mèo'. Tiếng Anh thì **đổi chính cái từ**: cat → cats, box → boxes, baby → babies, man → men. Tin vui: chỉ cần nhìn **chữ cuối** của từ là biết phải đổi thế nào. Hãy học cách 'đọc đuôi' này."},"diagram":{"type":"flow","title":"Thêm gì để thành số nhiều?","start":{"q":"Từ bất quy tắc? (man, child…)","branches":[{"label":"Có","to":{"result":"Học thuộc: men, children","icon":"📒"}},{"label":"Không","to":{"q":"Tận cùng s, sh, ch, x, z?","branches":[{"label":"Có","to":{"result":"+es: buses, boxes","icon":"📦"}},{"label":"Không","to":{"q":"Phụ âm + y?","branches":[{"label":"Có","to":{"result":"y → ies: babies","icon":"👶"}},{"label":"Không","to":{"q":"Tận cùng f / fe?","branches":[{"label":"Có","to":{"result":"Thường → ves: knives (roofs: +s)","icon":"🔪"}},{"label":"Không","to":{"q":"Phụ âm + o?","branches":[{"label":"Có","to":{"result":"Thường +es: tomatoes (photos: +s)","icon":"🍅"}},{"label":"Không","to":{"result":"+s: cats, days, radios","icon":"🐱"}}]}}]}}]}}]}}]}},"chunks":[{"title":"Thêm -s, thêm -es, đổi -y","icon":"➕","rule":"Hầu hết danh từ thêm **-s**; tận cùng **s, sh, ch, x, z** thêm **-es**; **phụ âm + y** đổi thành **-ies**.","explain":"Thêm -es vì sau s, sh, ch, x, z không đọc nổi thêm một âm s nữa, phải chen âm /ɪz/ vào. Với -y: nếu trước y là nguyên âm (a, e, i, o, u) thì chỉ thêm -s (days, keys, boys); trước y là phụ âm thì đổi y → ies (baby → babies).","formula":"N + s: face → faces\ns/sh/ch/x/z + es: watch → watches\nphụ âm + y → ies: fly → flies","diagram":{"type":"table","title":"Đọc đuôi -s / -es","head":["Âm cuối của từ","Đọc","Ví dụ"],"rows":[["s, z, sh, ch, ge (âm xuýt)","/ɪz/","buses, watches, bridges"],["p, f, t, k, th (vô thanh)","/s/","cups, cats, books"],["nguyên âm, các âm còn lại","/z/","toys, trees, dreams"]]},"examples":[{"en":"two **buses**, three **boxes**","vi":"hai xe buýt, ba cái hộp"},{"en":"The **babies** are sleeping.","vi":"Mấy em bé đang ngủ."},{"en":"I lost my **keys**.","vi":"Tôi làm mất chìa khoá rồi."},{"en":"two boxs","ok":false,"note":"x → thêm -es: boxes"}],"mistake":{"wrong":"two babys","right":"two babies","why":"b là phụ âm + y → đổi y thành ies."},"tip":"Nguyên âm + y giữ y (days); phụ âm + y đổi ies (babies).","src":"tr. 9–10, 14","check":{"type":"fill","q":"I bought two ___ yesterday. (watch)","answer":["watches"],"explain":"Tận cùng **ch** → thêm -es: watches.","src":"tự soạn"}},{"title":"Đuôi -f/-fe và -o","icon":"🔪","rule":"12 từ tận cùng **-f/-fe** đổi thành **-ves** (knife → knives); **phụ âm + o** thường thêm **-es** (tomato → tomatoes).","explain":"Nhóm -ves gồm: calf, half, knife, leaf, life, loaf, self, sheaf, shelf, thief, wife, wolf. Các từ -f khác chỉ thêm -s: roofs, beliefs, cliffs. Với -o: tomatoes, potatoes, heroes, echoes; nhưng nguyên âm + o, từ vay mượn và từ viết tắt chỉ thêm -s: radios, zoos, pianos, photos.","examples":[{"en":"Put the **knives** on the **shelves**.","vi":"Để mấy con dao lên kệ."},{"en":"I bought some **potatoes** and **tomatoes**.","vi":"Tôi mua ít khoai tây và cà chua."},{"en":"She took a lot of **photos**.","vi":"Cô ấy chụp rất nhiều ảnh."},{"en":"The roofs are red.","vi":"Những mái nhà màu đỏ."},{"en":"two photoes","ok":false,"note":"photo là từ viết tắt (photograph) → photos"}],"mistake":{"wrong":"two knifes","right":"two knives","why":"knife nằm trong nhóm -fe → -ves."},"tip":"Câu nhớ nhóm -ves: 'vợ (wife) cầm dao (knife) cắt nửa (half) ổ bánh (loaf), kẻ trộm (thief) giấu lá (leaf) trên kệ (shelf)'.","src":"tr. 10–11"},{"title":"Bất quy tắc, không đổi, luôn số nhiều","icon":"📒","rule":"Một số từ **đổi hẳn hình dạng** (man → men), một số **giữ nguyên** (sheep → sheep), một số **luôn ở số nhiều** (jeans, glasses).","explain":"Những từ này không theo quy tắc nào, phải học thuộc. May là chúng ít và rất hay gặp. Từ luôn số nhiều thường là đồ có **hai phần** (hai ống quần, hai mắt kính, hai lưỡi kéo) nên luôn đi với động từ số nhiều: **are**.","diagram":{"type":"table","title":"Số nhiều bất quy tắc","head":["Loại","Ví dụ"],"rows":[["Đổi hình dạng (người)","man → men, woman → women, child → children, person → people"],["Đổi hình dạng (khác)","foot → feet, tooth → teeth, mouse → mice, goose → geese"],["Giữ nguyên","sheep, deer, fish, aircraft"],["Luôn số nhiều","jeans, trousers, glasses, scissors, clothes"]]},"examples":[{"en":"My **feet** hurt.","vi":"Chân tôi đau."},{"en":"There are ten **sheep** in the field.","vi":"Có mười con cừu trên cánh đồng."},{"en":"Where **are** my **glasses**?","vi":"Kính của tôi đâu rồi?"},{"en":"I have two childs.","ok":false,"note":"child → children"}],"mistake":{"wrong":"Your jeans is too tight.","right":"Your jeans are too tight.","why":"jeans luôn số nhiều → are."},"tip":"Đồ có 'hai nửa' (quần, kính, kéo) → luôn số nhiều.","src":"tr. 11–12","check":{"type":"fill","q":"Two ___ are talking. (woman)","answer":["women"],"explain":"woman → **women** (bất quy tắc).","src":"tự soạn"}},{"title":"Danh từ ghép và số nhiều của nó","icon":"🔗","rule":"Danh từ ghép (hai từ thành một danh từ) thường đổi số nhiều ở **từ cuối** (bookshelves); kiểu **danh từ + giới từ/trạng từ** thì đổi **từ đầu** (passers-by, mothers-in-law).","explain":"Danh từ ghép (compound noun) có khi viết liền (bookstore), có gạch nối (daughter-in-law), có khi viết rời (washing machine), và nghĩa thường khác hai từ riêng: **a greenhouse** là nhà kính, **a green house** là ngôi nhà màu xanh. Từ 'chính' của cụm được thêm số nhiều: bookshelf là một cái kệ → bookshelves; passer-by là một người (passer) đi qua → passers-by.","examples":[{"en":"two **bookshelves**, three **washing machines**","vi":"hai cái kệ sách, ba cái máy giặt"},{"en":"Many **passers-by** stopped to look.","vi":"Nhiều người qua đường dừng lại xem."},{"en":"Both of my sisters are **women doctors**.","vi":"Cả hai chị tôi đều là bác sĩ nữ."},{"en":"a **greenhouse** ≠ a **green house**","vi":"nhà kính ≠ ngôi nhà màu xanh"}],"mistake":{"wrong":"two passer-bys","right":"two passers-by","why":"Người đi qua là 'passer' → đổi từ đầu."},"tip":"Hỏi: 'cái/người chính trong cụm là từ nào?' → thêm số nhiều vào từ đó. man/woman + nghề → đổi cả hai: men drivers.","src":"tr. 8–9, 13–14"}],"practice":[{"type":"mcq","q":"Số nhiều của **box**?","options":["boxes","boxs","boxies"],"answer":0,"explain":"Tận cùng **x** → thêm -es: boxes.","src":"tr. 10"},{"type":"classify","q":"Từ nào thêm **-s**, từ nào thêm **-es**?","buckets":["+s","+es"],"items":[{"text":"cat","bucket":0},{"text":"bus","bucket":1},{"text":"day","bucket":0},{"text":"dish","bucket":1},{"text":"key","bucket":0},{"text":"watch","bucket":1},{"text":"photo","bucket":0},{"text":"tomato","bucket":1}],"explain":"bus, dish, watch tận cùng s/sh/ch → -es; tomato là phụ âm + o → -es. day, key là nguyên âm + y → -s; photo là từ viết tắt → -s.","src":"tr. 9–11"},{"type":"mcq","q":"Đuôi **-es** trong **watches** đọc là gì?","options":["/ɪz/","/s/","/z/"],"answer":0,"explain":"watch tận cùng âm /tʃ/ (âm xuýt) → đọc /ɪz/.","src":"tr. 14"},{"type":"fill","q":"Two ___ are crying. (baby)","answer":["babies"],"explain":"Phụ âm b + y → đổi y thành **ies**.","src":"tự soạn"},{"type":"fill","q":"Cut the bread with these ___. (knife)","answer":["knives"],"explain":"knife thuộc nhóm -fe → **-ves**.","src":"tự soạn"},{"type":"fill","q":"There are five ___ in the field. (sheep)","answer":["sheep"],"explain":"sheep giữ nguyên ở số nhiều.","src":"tr. 11"},{"type":"mcq","q":"Số nhiều của **roof**?","options":["roofs","rooves","roofes"],"answer":0,"explain":"roof không nằm trong nhóm 12 từ -ves → chỉ thêm -s.","src":"tr. 11"},{"type":"mcq","q":"Số nhiều của **passer-by** (người qua đường)?","options":["passers-by","passer-bys","passers-bys"],"answer":0,"explain":"Danh từ + trạng từ → đổi từ đầu: **passers-by**.","src":"tr. 13"},{"type":"mcq","q":"Chọn câu đúng:","options":["Your jeans are too tight.","Your jeans is too tight.","Your jean is too tight."],"answer":0,"explain":"jeans luôn ở số nhiều → **are**.","src":"tr. 12"},{"type":"fix","wrong":"I have two childs.","answer":["I have two children."],"explain":"child là bất quy tắc → **children**.","src":"tự soạn"},{"type":"fix","wrong":"We bought two new bookshelfs.","answer":["We bought two new bookshelves."],"explain":"Danh từ ghép → đổi từ cuối; shelf thuộc nhóm -ves → **bookshelves**.","src":"tr. 13"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["The","children","brushed","their","teeth."],"explain":"child → children, tooth → teeth.","src":"tự soạn"}],"flashcards":[{"front":"Danh từ tận cùng s, sh, ch, x, z: số nhiều thêm gì?","back":"**-es**: buses, dishes, watches, boxes"},{"front":"baby → ? / day → ?","back":"**babies** (phụ âm + y) / **days** (nguyên âm + y)"},{"front":"knife, leaf, wife → số nhiều?","back":"**knives, leaves, wives** (nhưng roof → roofs)"},{"front":"tomato → ? / photo → ?","back":"**tomatoes** / **photos**"},{"front":"Số nhiều của man, child, tooth, mouse?","back":"**men, children, teeth, mice**"},{"front":"Số nhiều của passer-by?","back":"**passers-by** (đổi từ đầu)"}]},{"id":"01c","title":"Chức năng của danh từ; chủ ngữ – động từ hòa hợp","minutes":25,"goal":"Biết danh từ đứng ở đâu trong câu, và chọn đúng động từ số ít (is/has/V-s) hay số nhiều (are/have/V) theo chủ ngữ, kể cả khi chủ ngữ có hai danh từ.","pretest":[{"type":"mcq","q":"Đoán thử: My parents ___ teachers.","options":["are","is"],"answer":0,"explain":"parents là số nhiều → **are**.","src":"tự soạn"},{"type":"mcq","q":"Đoán thử: The news ___ good.","options":["is","are"],"answer":0,"explain":"news trông như số nhiều (có -s) nhưng nghĩa là số ít → **is**.","src":"tr. 18"}],"hook":{"icon":"🤝","text":"Tiếng Việt nói 'tôi **là**', 'họ **là**', động từ không bao giờ đổi. Tiếng Anh thì động từ phải **bắt tay** với chủ ngữ: một người → **is / has / likes**; nhiều người → **are / have / like**. Khó nhất là khi chủ ngữ 'đội lốt': trông số nhiều mà nghĩa số ít, hoặc có tới hai danh từ. Bài này dạy bạn nhìn ra chủ ngữ thật."},"diagram":{"type":"flow","title":"Động từ số ít hay số nhiều?","start":{"q":"Chủ ngữ có 2 danh từ nối nhau?","branches":[{"label":"Không","to":{"q":"Danh từ đó nghĩa là một hay nhiều?","branches":[{"label":"Một / không đếm được","to":{"result":"is / has / V-s","icon":"1️⃣"}},{"label":"Nhiều","to":{"result":"are / have / V","icon":"👥"}}]}},{"label":"Có","to":{"q":"Nối bằng từ gì?","branches":[{"label":"and (2 người/vật)","to":{"result":"Số nhiều: are","icon":"➕"}},{"label":"with, as well as, of","to":{"result":"Theo danh từ ĐẦU","icon":"⬅️"}},{"label":"or, nor, but also","to":{"result":"Theo danh từ GẦN động từ","icon":"➡️"}}]}}]}},"chunks":[{"title":"Danh từ đứng ở đâu trong câu?","icon":"📍","rule":"Danh từ có thể làm **chủ ngữ** (ai/cái gì làm), **tân ngữ** (ai/cái gì bị tác động), đứng **sau giới từ**, hoặc đứng **sau be** để nói chủ ngữ là gì.","explain":"Chủ ngữ (subject) là người/vật làm hành động, thường đứng đầu câu. Tân ngữ (object) là người/vật nhận hành động, đứng sau động từ; có tân ngữ trực tiếp (vật được đưa) và gián tiếp (người nhận). Bổ ngữ (complement) đứng sau be, become, seem… để nói chủ ngữ là gì. Đồng vị ngữ (appositive) là danh từ đứng ngay sau danh từ khác để giải thích nó.","diagram":{"type":"mindmap","title":"7 chức năng của danh từ","root":{"label":"Danh từ làm…","children":[{"label":"Chủ ngữ: The teacher told…"},{"label":"Tân ngữ trực tiếp: …pizzas"},{"label":"Tân ngữ gián tiếp: …the children"},{"label":"Sau giới từ: to John"},{"label":"Bổ ngữ chủ ngữ: is a friend"},{"label":"Bổ ngữ tân ngữ: elected him president"},{"label":"Đồng vị ngữ: my friend, Sammy"}]}},"examples":[{"en":"**The teacher** told **the class** to sit down.","vi":"Cô giáo bảo cả lớp ngồi xuống."},{"en":"He bought **the children** **pizzas**.","vi":"Anh ấy mua pizza cho bọn trẻ."},{"en":"Ellisa is **a good friend**.","vi":"Ellisa là một người bạn tốt."},{"en":"My best friend, **Sammy**, lives in Cleveland.","vi":"Bạn thân của tôi, Sammy, sống ở Cleveland."}],"tip":"Muốn chia động từ đúng, trước hết phải tìm ra **chủ ngữ**: hỏi 'Ai/cái gì làm việc này?'","src":"tr. 15–16"},{"title":"Một hay nhiều: is hay are?","icon":"⚖️","rule":"Chủ ngữ **số ít** hoặc **không đếm được** → **is / has / V-s**; chủ ngữ **số nhiều** hoặc **A and B** (hai người/vật) → **are / have / V**.","explain":"Đây là phần 'bắt tay'. Với động từ thường ở hiện tại, chủ ngữ số ít thì động từ thêm -s (looks), số nhiều thì giữ nguyên (look). **Each / Every + N** luôn số ít. **people, police** luôn số nhiều. Với **There is / There are**, động từ chia theo danh từ đứng sau.","formula":"N số ít / không đếm được → is, has, V-s\nN số nhiều, A and B → are, have, V\nThere is + N số ít · There are + N số nhiều","examples":[{"en":"**Water is** essential for life.","vi":"Nước rất cần cho sự sống."},{"en":"**These coats look** nice.","vi":"Mấy cái áo khoác này trông đẹp."},{"en":"**Every user has** a password.","vi":"Mỗi người dùng đều có một mật khẩu."},{"en":"**There are** two people waiting outside.","vi":"Có hai người đang đợi bên ngoài."},{"en":"The police is looking for him.","ok":false,"note":"police luôn số nhiều: are"}],"mistake":{"wrong":"The police is looking for the thief.","right":"The police are looking for the thief.","why":"police (cảnh sát) luôn đi với động từ số nhiều."},"tip":"Each, every → 'từng cái một' → số ít.","src":"tr. 16, 19–20, 23–24","check":{"type":"mcq","q":"Every student ___ a laptop.","options":["has","have"],"answer":0,"explain":"**Every + N số ít** → động từ số ít: has.","src":"tự soạn"}},{"title":"Trông số nhiều, nghĩa số ít","icon":"🎭","rule":"**news**, môn học (**mathematics, physics**), **tiền / khoảng cách / thời gian**, **One of + N số nhiều**, **The number of** → động từ **số ít**. Nhưng **A number of** → **số nhiều**.","explain":"Đừng nhìn chữ -s mà vội chọn are. Hãy hỏi: 'chủ ngữ thật là một thứ hay nhiều thứ?' 'Twenty miles' là **một quãng đường**. 'One of my friends' là **một người**. 'The number of students' là **một con số**. Còn 'A number of students' nghĩa là 'nhiều học sinh' → số nhiều.","diagram":{"type":"table","title":"Bẫy số ít / số nhiều","head":["Chủ ngữ","Động từ"],"rows":[["The news, Mathematics","is"],["Twenty miles, Ten dollars (số tiền)","is"],["One of my friends","is"],["The number of students","is"],["A number of students","are"]]},"examples":[{"en":"**Twenty miles is** too far to walk.","vi":"Hai mươi dặm là quá xa để đi bộ."},{"en":"**One of my friends is** getting married.","vi":"Một người bạn của tôi sắp cưới."},{"en":"**The number of** students in the class **is** forty.","vi":"Số học sinh trong lớp là bốn mươi."},{"en":"**A number of** students **are** waiting.","vi":"Nhiều học sinh đang đợi."}],"mistake":{"wrong":"One of my friends are getting married.","right":"One of my friends is getting married.","why":"Chủ ngữ thật là 'one' (một người)."},"tip":"THE number = một con số → is. A number = nhiều → are.","src":"tr. 17–18, 22"},{"title":"Chủ ngữ có hai danh từ","icon":"↔️","rule":"**N₁ with / as well as / of + N₂** → chia theo **danh từ đầu**. **N₁ or / either…or / neither…nor / not only…but also + N₂** → chia theo **danh từ gần động từ**. **Some / all / most of + N** → chia theo **danh từ sau of**.","explain":"Với with, as well as, along with, together with và giới từ (of, in…), phần sau chỉ là 'đi kèm', chủ ngữ thật là danh từ đầu. Với or, nor, but also, động từ nhìn sang danh từ **đứng sát nó**. Với some of, all of, most of…, nhìn danh từ sau of: số nhiều → are, không đếm được → is.","examples":[{"en":"The CEO, **as well as** the board members, **has** decided.","vi":"Giám đốc, cùng với các thành viên hội đồng, đã quyết định."},{"en":"**The effects** of stress **are** very serious.","vi":"Tác hại của căng thẳng rất nghiêm trọng."},{"en":"Neither my mother nor **my friends know** the answer.","vi":"Cả mẹ tôi lẫn bạn bè tôi đều không biết câu trả lời."},{"en":"Either he or **I am** wrong.","vi":"Hoặc anh ấy sai, hoặc tôi sai."},{"en":"Some of **the information was** wrong.","vi":"Một phần thông tin bị sai."}],"mistake":{"wrong":"The CEO, as well as the board members, have decided.","right":"The CEO, as well as the board members, has decided.","why":"as well as → chia theo danh từ đầu (The CEO)."},"tip":"with / of → nhìn **trái**. or / nor → nhìn **phải** (sát động từ).","src":"tr. 21–23","check":{"type":"mcq","q":"My grandparents or my uncle ___ coming tonight.","options":["is","are"],"answer":0,"explain":"**or** → chia theo danh từ gần động từ: my uncle → is.","src":"tr. 21"}}],"practice":[{"type":"mcq","q":"Trong câu \"The teacher told the class to sit down.\", danh từ nào làm **chủ ngữ**?","options":["The teacher","the class","down"],"answer":0,"explain":"The teacher là người làm hành động 'told' → chủ ngữ. the class là tân ngữ.","src":"tr. 15"},{"type":"classify","q":"Chủ ngữ nào đi với **is**, chủ ngữ nào đi với **are**?","buckets":["is","are"],"items":[{"text":"Water","bucket":0},{"text":"My parents","bucket":1},{"text":"The news","bucket":0},{"text":"The police","bucket":1},{"text":"Mathematics","bucket":0},{"text":"Tom and Mary","bucket":1},{"text":"Every student","bucket":0},{"text":"These coats","bucket":1}],"explain":"Không đếm được, news, môn học, every + N → is. Số nhiều, police, A and B → are.","src":"tr. 16–20"},{"type":"fill","q":"Each of us ___ a job to do. (has/have)","answer":["has"],"explain":"**Each of + N/đại từ số nhiều** → động từ số ít: has.","src":"tr. 16"},{"type":"fill","q":"The news ___ very good today. (is/are)","answer":["is"],"explain":"news có -s nhưng nghĩa số ít → **is**.","src":"tr. 18"},{"type":"mcq","q":"One of my friends ___ getting married.","options":["is","are"],"answer":0,"explain":"Chủ ngữ thật là **one** (một người) → is. 'are' sai vì nhìn nhầm vào friends.","src":"tr. 17"},{"type":"mcq","q":"The number of students in the class ___ forty.","options":["is","are"],"answer":0,"explain":"**The number of** = con số → số ít.","src":"tr. 22"},{"type":"mcq","q":"The CEO, as well as the board members, ___ decided to stop the project.","options":["has","have"],"answer":0,"explain":"**as well as** → chia theo danh từ đầu (The CEO, số ít) → has.","src":"tr. 21"},{"type":"mcq","q":"Neither my mother nor my friends ___ the answer.","options":["know","knows"],"answer":0,"explain":"**neither…nor** → chia theo danh từ gần động từ (my friends, số nhiều) → know.","src":"tr. 21"},{"type":"fill","q":"Some of the information ___ wrong. (is/are)","answer":["is"],"explain":"**Some of** → nhìn danh từ sau of: information không đếm được → is.","src":"tr. 23"},{"type":"fix","wrong":"The police is looking for the thief.","answer":["The police are looking for the thief."],"explain":"police luôn đi với động từ số nhiều → **are**.","src":"tr. 20"},{"type":"fix","wrong":"Twenty miles are too far to walk.","answer":["Twenty miles is too far to walk."],"explain":"Khoảng cách được xem là một quãng → động từ số ít: **is**.","src":"tr. 18"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Either","he","or","I","am","wrong."],"explain":"either…or → chia theo danh từ/đại từ gần động từ: I → **am**.","src":"tr. 22"}],"flashcards":[{"front":"news, mathematics + is hay are?","back":"**is**: The news is good."},{"front":"The number of … / A number of … + is hay are?","back":"The number of → **is**; A number of → **are**"},{"front":"N₁ as well as / with / of + N₂: chia theo danh từ nào?","back":"Danh từ **đầu**: The CEO, as well as the members, has…"},{"front":"N₁ or / neither…nor + N₂: chia theo danh từ nào?","back":"Danh từ **gần động từ**: Either he or I am wrong."},{"front":"The police + is hay are?","back":"**are**: The police are looking for him."}]},{"id":"01d","title":"Sở hữu cách: 's hay of?","minutes":25,"goal":"Viết đúng 's và ' (father's, parents'), biết khi nào dùng 's và khi nào dùng of, và hiểu các cách nói như at the doctor's, a friend of my sister's.","pretest":[{"type":"mcq","q":"Đoán thử: 'tên của cô gái' nói thế nào?","options":["the girl's name","the girl name's","the name girl"],"answer":0,"explain":"Người sở hữu + **'s** + vật: the girl's name.","src":"tr. 25"},{"type":"mcq","q":"Đoán thử: 'phía trên của trang giấy'?","options":["the top of the page","the page's top"],"answer":0,"explain":"Với vật và các từ top, end, beginning… dùng **of**.","src":"tr. 27"}],"hook":{"icon":"🔑","text":"Tiếng Việt nói 'xe **của** bố tôi': vật trước, người sau. Tiếng Anh có hai cách: **my father's car** (người trước, gắn **'s**, rồi tới vật) và **the name of the street** (vật trước, **of**, rồi tới chủ). Mẹo: **người và con vật** thích **'s**; **đồ vật** thích **of**."},"diagram":{"type":"flow","title":"Dùng 's hay of?","start":{"q":"Chủ sở hữu là người hoặc con vật?","branches":[{"label":"Có","to":{"result":"N's: Mary's dog, the horse's tail","icon":"🧑"}},{"label":"Không","to":{"q":"Là nước/thành phố, thời gian, tiền, tổ chức?","branches":[{"label":"Có","to":{"result":"'s được: today's paper","icon":"🗓️"}},{"label":"Không","to":{"result":"of: the name of the street","icon":"🏠"}}]}}]}},"chunks":[{"title":"Viết 's hay chỉ '?","icon":"✍️","rule":"Thêm **'s** vào danh từ số ít và số nhiều **không** tận cùng -s; số nhiều **tận cùng -s** chỉ thêm **'**. Khi dùng 's thì **bỏ a/an/the** trước vật bị sở hữu.","explain":"my father's car (một người bố), the children's room (children không có -s), nhưng my parents' house (parents đã có -s, chỉ thêm dấu '). Danh từ ghép: thêm 's vào từ cuối: my brother-in-law's guitar. **Joe and Ann's children** là con chung của hai người; **Joe's and Ann's children** là con riêng của từng người.","formula":"N số ít + 's: my father's car\nN số nhiều không -s + 's: the children's room\nN số nhiều có -s + ': my parents' house","diagram":{"type":"flow","title":"'s hay '?","start":{"q":"Số nhiều tận cùng -s?","branches":[{"label":"Có","to":{"result":"chỉ thêm ': parents', girls'","icon":"✏️"}},{"label":"Không","to":{"result":"thêm 's: father's, children's","icon":"🖊️"}}]}},"examples":[{"en":"**Mary's** dog is very cute.","vi":"Con chó của Mary rất dễ thương."},{"en":"We stayed at my **parents'** house.","vi":"Chúng tôi ở nhà bố mẹ tôi."},{"en":"This is the **children's** room.","vi":"Đây là phòng của bọn trẻ."},{"en":"my brother's-in-law guitar","ok":false,"note":"'s gắn vào từ cuối: my brother-in-law's guitar"},{"en":"the politician's a daughter","ok":false,"note":"bỏ a: the politician's daughter"}],"mistake":{"wrong":"my parent's house (nói về cả bố và mẹ)","right":"my parents' house","why":"parents số nhiều đã có -s → chỉ thêm '."},"tip":"Viết danh từ (số ít hay số nhiều) cho đúng trước, rồi mới gắn đuôi: chưa có s → 's; đã có s → '.","src":"tr. 24–25","check":{"type":"fill","q":"This is the ___ room. (children)","answer":["children's"],"explain":"children không tận cùng -s → thêm **'s**.","src":"tr. 24"}},{"title":"Người dùng 's, vật dùng of","icon":"🏠","rule":"**'s** chủ yếu dùng cho **người và con vật**; với **đồ vật, ý tưởng** dùng **the … of …**, nhất là với **top, end, beginning, front, back, middle, side**.","explain":"Với tên người, 's là bắt buộc: **John's house**, không nói 'the house of John'. Với vật thì ngược lại: **the name of the street**, không nói 'the street's name'. Đôi khi có thể ghép hai danh từ: the car keys, the church roof.","formula":"người/con vật + 's + N\nthe + N + of + the + vật","examples":[{"en":"**John's** house is near the sea.","vi":"Nhà của John gần biển."},{"en":"the **horse's** tail","vi":"cái đuôi của con ngựa"},{"en":"the name **of** the street","vi":"tên của con đường"},{"en":"the top **of** the page","vi":"đầu trang"},{"en":"the page's top","ok":false,"note":"vật + top → the top of the page"}],"mistake":{"wrong":"the house of John","right":"John's house","why":"Chủ sở hữu là tên người → dùng 's."},"tip":"Người/con vật → 's. Đồ vật → of.","src":"tr. 25–27"},{"title":"Vật nhưng vẫn dùng 's","icon":"🗓️","rule":"**'s** còn dùng với **quốc gia, thành phố**, **tổ chức**, **thời gian** (today's paper, a week's holiday) và **tiền** (a pound's worth).","explain":"Đây là những ngoại lệ hay gặp. Với thời gian số nhiều tận cùng -s thì vẫn chỉ thêm ': **ten minutes' break**, **two years' time**. Với tổ chức (the government, the company) dùng of cũng được.","examples":[{"en":"Did you read **today's** paper?","vi":"Bạn đọc báo hôm nay chưa?"},{"en":"I need **a week's** holiday.","vi":"Tôi cần một tuần nghỉ phép."},{"en":"We had **ten minutes'** break.","vi":"Chúng tôi nghỉ mười phút."},{"en":"**Italy's** largest city","vi":"thành phố lớn nhất của Ý"},{"en":"the **government's** decision","vi":"quyết định của chính phủ"}],"tip":"Nhớ nhóm ngoại lệ: Nơi chốn – Thời gian – Tiền – Tổ chức.","src":"tr. 25–26","check":{"type":"mcq","q":"Chọn cách nói đúng:","options":["today's paper","the paper of today"],"answer":0,"explain":"Thời gian là nhóm dùng **'s**: today's paper.","src":"tr. 26"}},{"title":"Bỏ danh từ sau 's; a friend of my sister's","icon":"✂️","rule":"Có thể **bỏ danh từ sau 's** khi đó là nhà, cửa hàng, phòng khám… hoặc khi danh từ vừa nói tới. **a/an + N + of + người's** = 'một trong số…' (sở hữu kép).","explain":"**at the doctor's** = ở phòng khám của bác sĩ; **at Bill's** = ở nhà (hoặc quán) của Bill. 'This isn't my book. It's **my brother's**.' = sách của anh tôi (không lặp lại book). Vì không nói được 'my sister's a friend', ta dùng sở hữu kép: **a friend of my sister's** = một người bạn của chị tôi.","examples":[{"en":"He is going to **the doctor's**.","vi":"Anh ấy đang đi khám bác sĩ."},{"en":"We had lunch **at Bill's**.","vi":"Chúng tôi ăn trưa ở nhà Bill."},{"en":"This isn't my book. It's **my brother's**.","vi":"Đây không phải sách của tôi. Nó là của anh tôi."},{"en":"She is **a friend of my sister's**.","vi":"Cô ấy là một người bạn của chị tôi."}],"tip":"a/an + vật + of + người's → 'một trong những … của người đó'.","src":"tr. 26–28"}],"practice":[{"type":"mcq","q":"'Chiếc xe của bố tôi' là:","options":["my father's car","my fathers' car","my father car"],"answer":0,"explain":"Một người bố (số ít) → **father's**. fathers' là của nhiều ông bố.","src":"tr. 24"},{"type":"classify","q":"Danh từ nào thêm **'s**, danh từ nào chỉ thêm **'**?","buckets":["Thêm 's","Chỉ thêm '"],"items":[{"text":"father","bucket":0},{"text":"parents","bucket":1},{"text":"children","bucket":0},{"text":"the Smiths","bucket":1},{"text":"women","bucket":0},{"text":"girls","bucket":1}],"explain":"Không tận cùng -s (father, children, women) → 's. Số nhiều tận cùng -s (parents, the Smiths, girls) → '.","src":"tr. 24"},{"type":"fill","q":"We stayed at my ___ house. (parents)","answer":["parents'"],"explain":"parents tận cùng -s → chỉ thêm **'**: parents'.","src":"tr. 24"},{"type":"fill","q":"I love my ___ cooking. (mother)","answer":["mother's"],"explain":"mother số ít → thêm **'s**.","src":"tự soạn"},{"type":"mcq","q":"Chọn cách nói đúng:","options":["the name of the street","the street's name"],"answer":0,"explain":"Chủ sở hữu là vật (con đường) → dùng **of**.","src":"tr. 25"},{"type":"mcq","q":"Chọn cách nói đúng:","options":["the beginning of the month","the month's beginning"],"answer":0,"explain":"Với beginning, end, top, middle… dùng **the … of …**.","src":"tr. 27"},{"type":"mcq","q":"Chọn cách nói đúng:","options":["a week's holiday","a holiday of week"],"answer":0,"explain":"Khoảng thời gian thuộc nhóm dùng **'s**: a week's holiday.","src":"tr. 26"},{"type":"mcq","q":"\"Joe and Ann's children\" nghĩa là:","options":["con chung của Joe và Ann","con của Joe và con của Ann (hai nhóm riêng)"],"answer":0,"shuffle":false,"explain":"'s chỉ gắn vào tên cuối → sở hữu **chung**. Muốn nói con riêng: Joe's and Ann's children.","src":"tr. 25"},{"type":"fix","wrong":"This is my brother's-in-law guitar.","answer":["This is my brother-in-law's guitar."],"explain":"Danh từ ghép → gắn **'s** vào từ cuối: brother-in-law's.","src":"tr. 25"},{"type":"fix","wrong":"I met the politician's a daughter.","answer":["I met the politician's daughter."],"explain":"Dùng 's thì **bỏ a/an/the** trước vật bị sở hữu.","src":"tr. 25"},{"type":"fix","wrong":"The house of John is very big.","answer":["John's house is very big."],"explain":"Chủ sở hữu là tên người → bắt buộc dùng **'s**: John's house.","src":"tr. 26"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["This","isn't","my","book.","It's","my","brother's."],"explain":"Bỏ danh từ sau 's khi đã nói tới: my brother's (book).","src":"tr. 27"}],"flashcards":[{"front":"Sở hữu của parents (bố mẹ)?","back":"**parents'** (đã có -s → chỉ thêm '): my parents' house"},{"front":"Sở hữu của children?","back":"**children's** (không có -s → thêm 's): the children's room"},{"front":"'s hay of: tên của con đường?","back":"**the name of the street** (vật → of)"},{"front":"Nhóm vật vẫn dùng 's?","back":"Nơi chốn, thời gian, tiền, tổ chức: **today's paper, a week's holiday**"},{"front":"Joe and Ann's children vs Joe's and Ann's children?","back":"**chung** (con của cả hai) vs **riêng** (con của từng người)"},{"front":"at the doctor's nghĩa là?","back":"ở **phòng khám** bác sĩ (bỏ danh từ sau 's)"}]}],"quiz":{"pass":0.8,"questions":[{"type":"classify","q":"Xếp mỗi danh từ vào đúng nhóm:","buckets":["Đếm được","Không đếm được"],"items":[{"text":"furniture","bucket":1},{"text":"horse","bucket":0},{"text":"advice","bucket":1},{"text":"idea","bucket":0},{"text":"water","bucket":1},{"text":"car","bucket":0}],"explain":"horse, idea, car đếm được. furniture, advice, water không đếm được.","src":"tr. 6"},{"type":"mcq","q":"Chọn câu đúng:","options":["There is a lot of furniture in the room.","There are a lot of furnitures in the room.","There is a furniture in the room."],"answer":0,"explain":"furniture không đếm được: không -s, không a; động từ số ít **is**.","src":"tr. 6"},{"type":"fill","q":"Could you buy two ___ of milk? (bottle)","answer":["bottles"],"explain":"milk không đếm được; đếm bằng đơn vị: **two bottles of** milk.","src":"tr. 7"},{"type":"mcq","q":"\"How many ___ do you want?\" (hỏi số viên/thìa đường)","options":["sugars","sugar"],"answer":0,"explain":"Khi chỉ từng viên/thìa, sugar đếm được → **How many sugars**.","src":"tr. 7"},{"type":"fill","q":"The ___ are playing in the garden. (child)","answer":["children"],"explain":"child → **children** (bất quy tắc).","src":"tự soạn"},{"type":"fill","q":"I need two ___ for the salad. (tomato)","answer":["tomatoes"],"explain":"Phụ âm + o → **-es**: tomatoes.","src":"tr. 11"},{"type":"mcq","q":"Dãy nào viết đúng cả ba số nhiều?","options":["keys, babies, leaves","keies, babys, leafs","keys, babies, leafs"],"answer":0,"explain":"key: nguyên âm + y → keys; baby: phụ âm + y → babies; leaf thuộc nhóm -ves → leaves.","src":"tr. 10"},{"type":"fix","wrong":"I saw three mouses in the kitchen.","answer":["I saw three mice in the kitchen."],"explain":"mouse là bất quy tắc → **mice**.","src":"tr. 11"},{"type":"mcq","q":"Mathematics ___ my favourite subject.","options":["is","are"],"answer":0,"explain":"Tên môn học tận cùng -s nhưng nghĩa số ít → **is**.","src":"tr. 18"},{"type":"fill","q":"There ___ two people waiting outside. (is/are)","answer":["are"],"explain":"There + be chia theo danh từ đứng sau: two people (số nhiều) → **are**.","src":"tr. 23–24"},{"type":"mcq","q":"Not only the students but also their teacher ___ invited.","options":["is","are"],"answer":0,"explain":"**not only…but also** → chia theo danh từ gần động từ: their teacher (số ít) → is.","src":"tr. 22"},{"type":"mcq","q":"The effects of stress ___ very serious.","options":["are","is"],"answer":0,"explain":"**N₁ + of + N₂** → chia theo danh từ đầu: The effects (số nhiều) → are. Đừng nhìn stress.","src":"tr. 23"},{"type":"fix","wrong":"A number of students is absent today.","answer":["A number of students are absent today."],"explain":"**A number of** = nhiều → động từ số nhiều: are. (The number of → is.)","src":"tr. 22"},{"type":"fill","q":"We had ten ___ break. (minute, dùng sở hữu cách)","answer":["minutes'"],"explain":"Thời gian dùng sở hữu cách; minutes đã có -s → chỉ thêm **'**: ten minutes' break.","src":"tr. 26"},{"type":"mcq","q":"\"We had lunch at Bill's.\" nghĩa là:","options":["Chúng tôi ăn trưa ở nhà (quán) của Bill.","Chúng tôi ăn bữa trưa của Bill."],"answer":0,"explain":"Bỏ danh từ sau 's khi đó là nhà, cửa hàng…: at Bill's = ở nhà/quán của Bill.","src":"tr. 26"},{"type":"fix","wrong":"The street's name is very long.","answer":["The name of the street is very long.","The street name is very long."],"explain":"Chủ sở hữu là vật → dùng **of**: the name of the street.","src":"tr. 25"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["My","parents'","house","is","near","the","sea."],"explain":"parents số nhiều có -s → **parents'**.","src":"tự soạn"}]}},{"id":"02-dai-tu","title":"Đại từ","en":"Pronouns","icon":"👤","pages":"36–64","summary":"Đại từ (pronoun) là từ thay cho danh từ để khỏi lặp lại. Tiếng Việt nói 'tôi' ở đâu cũng là 'tôi', còn tiếng Anh đổi dạng theo vị trí: I / me / my / mine / myself. Chủ đề này dạy bạn chọn đúng dạng đại từ, dùng it, this/that, who/what/which, và chia động từ đúng sau each, both, everyone, nobody…","mindmap":{"label":"Đại từ","children":[{"label":"Người & sở hữu","icon":"🙋","children":[{"label":"Nhân xưng: I / me, he / him"},{"label":"it: vật, thời tiết, chủ ngữ giả"},{"label":"Sở hữu: mine, yours, hers"},{"label":"Phản thân: myself, himself"}]},{"label":"Chỉ & hỏi","icon":"👉","children":[{"label":"Chỉ định: this / that"},{"label":"Nghi vấn: who, whose, what, which"},{"label":"Quan hệ: who, which, that, whose"}]},{"label":"Số lượng & qua lại","icon":"🔢","children":[{"label":"Phân bổ: all, each, both, neither"},{"label":"Bất định: someone, nothing"},{"label":"Hỗ tương: each other"}]}]},"lessons":[{"id":"02a","title":"Đại từ nhân xưng và cách dùng it","minutes":25,"goal":"Chọn đúng dạng chủ ngữ (I, he, she…) hay tân ngữ (me, him, her…), và biết dùng it cho vật, cho việc vừa nói, cho thời tiết, thời gian, khoảng cách.","pretest":[{"type":"mcq","q":"Lan called ___ yesterday. (tôi)","options":["me","I","my"],"answer":0,"explain":"Sau động từ **called** là chỗ của tân ngữ, nên dùng **me**, không dùng I.","src":"tự soạn"},{"type":"mcq","q":"___ is raining outside.","options":["It","He","This"],"answer":0,"explain":"Nói về thời tiết, tiếng Anh dùng **it** làm chủ ngữ giả: It is raining.","src":"tr. 38"}],"hook":{"icon":"🎭","text":"Trong tiếng Việt, 'tôi' đứng đầu câu hay cuối câu vẫn là 'tôi': **Tôi** gọi Lan, Lan gọi **tôi**. Tiếng Anh thì đại từ 'đổi áo' theo chỗ đứng: **I** call Lan, Lan calls **me**. Đứng trước động từ mặc áo chủ ngữ, đứng sau động từ hay giới từ mặc áo tân ngữ. Bài này dạy bạn nhìn chỗ đứng để chọn áo."},"diagram":{"type":"table","title":"Đại từ nhân xưng","head":["Ngôi","Chủ ngữ","Tân ngữ","Nghĩa"],"rows":[["1 số ít","I","me","tôi"],["2 (ít / nhiều)","you","you","bạn / các bạn"],["3 số ít (nam)","he","him","anh ấy, ông ấy"],["3 số ít (nữ)","she","her","cô ấy, bà ấy"],["3 số ít (vật)","it","it","nó"],["1 số nhiều","we","us","chúng tôi, chúng ta"],["3 số nhiều","they","them","họ, chúng nó"]]},"chunks":[{"title":"Chủ ngữ hay tân ngữ?","icon":"🎯","rule":"Đứng **trước động từ** (làm chủ ngữ) → **I, he, she, we, they**; đứng **sau động từ hoặc giới từ** (làm tân ngữ) → **me, him, her, us, them**.","explain":"Tân ngữ (object) là người/vật chịu tác động của động từ, hoặc đứng sau giới từ như for, with, to. Tiếng Việt không đổi dạng nên ta hay nói 'He gave the book to she'. Chỉ **you** và **it** là giữ nguyên ở cả hai chỗ.","formula":"I / he / she / we / they + động từ\nđộng từ / giới từ + me / him / her / us / them","diagram":{"type":"flow","title":"Chọn he hay him?","start":{"q":"Đại từ đứng ở đâu?","branches":[{"label":"Trước động từ","to":{"result":"Chủ ngữ: I, he, she, we, they","icon":"🙋"}},{"label":"Sau động từ / giới từ","to":{"result":"Tân ngữ: me, him, her, us, them","icon":"🎯"}}]}},"examples":[{"en":"**She** loves **him**.","vi":"Cô ấy yêu anh ấy."},{"en":"My boss gave **me** a new laptop.","vi":"Sếp tặng tôi một cái laptop mới."},{"en":"This cake is for **us**.","vi":"Cái bánh này là cho chúng tôi."},{"en":"Him loves her.","ok":false,"note":"đứng trước động từ phải là He"}],"mistake":{"wrong":"He gave the book to she.","right":"He gave the book to her.","why":"Sau giới từ to phải dùng dạng tân ngữ her."},"tip":"Trả lời ngắn kiểu thân mật dùng tân ngữ: 'Who said that? ~ **Her.**' Muốn trang trọng hơn thì nói 'She did.'","src":"tr. 36–37","check":{"type":"mcq","q":"Can you help ___? (chúng tôi)","options":["us","we","our"],"answer":0,"explain":"Sau động từ **help** là tân ngữ → **us**.","src":"tự soạn"}},{"title":"it thay cho vật, cho việc vừa nói","icon":"📦","rule":"**it** thay cho đồ vật, con vật, em bé chưa rõ trai gái, và cho **cả một việc / ý** vừa nhắc tới.","explain":"Tiếng Việt hay bỏ trống hoặc nói 'nó, cái đó'. Tiếng Anh cần một chủ ngữ hay tân ngữ rõ ràng, và **it** làm việc đó. Khi hỏi 'ai đấy?' mà chưa biết là ai, cũng dùng it; biết rồi thì chuyển sang he/she.","examples":[{"en":"Where's my phone? ~ **It**'s on the table.","vi":"Điện thoại tôi đâu? ~ Nó ở trên bàn."},{"en":"He smokes in bed, though I don't like **it**.","vi":"Anh ấy hút thuốc trên giường, dù tôi không thích (việc đó)."},{"en":"Who was **it** on the phone? ~ **It** was Vicky. **She** wants to see you.","vi":"Ai gọi điện thế? ~ Vicky đấy. Cô ấy muốn gặp bạn."}],"tip":"Chưa biết là ai → it. Biết rồi → he / she.","src":"tr. 37–38"},{"title":"it làm chủ ngữ giả","icon":"🌦️","rule":"Nói về **thời tiết, thời gian, ngày tháng, nhiệt độ, khoảng cách**, hoặc khi chủ ngữ thật là cụm **to-V / V-ing / mệnh đề** dài → đặt **It** lên đầu câu.","explain":"Tiếng Việt nói 'Đang mưa', 'Mười giờ rồi' mà không cần chủ ngữ. Câu tiếng Anh thì luôn phải có chủ ngữ, nên dùng **it** làm chủ ngữ giả. Với chủ ngữ dài như 'to meet you', người ta đưa nó ra cuối câu và để It đứng đầu thay chỗ.","formula":"It + is + thời tiết / giờ / ngày / khoảng cách\nIt + is + tính từ + to-V / that + mệnh đề","examples":[{"en":"**It**'s ten o'clock.","vi":"Mười giờ rồi."},{"en":"**It**'s six miles to the nearest hospital.","vi":"Từ đây tới bệnh viện gần nhất là sáu dặm."},{"en":"**It**'s nice to meet you.","vi":"Rất vui được gặp bạn."},{"en":"Is raining.","ok":false,"note":"thiếu chủ ngữ It"}],"mistake":{"wrong":"Is very hot today.","right":"It is very hot today.","why":"Câu tiếng Anh không được thiếu chủ ngữ; thời tiết dùng It."},"tip":"Thêm hai kiểu dùng it nữa để nhận ra khi đọc: tân ngữ giả 'I find **it** strange that she doesn't want to travel.' và nhấn mạnh '**It** was Jim who lent us the money.'","src":"tr. 38–39","check":{"type":"mcq","q":"___ is 5 km from my house to the office.","options":["It","This","He"],"answer":0,"explain":"Nói khoảng cách dùng chủ ngữ giả **It**.","src":"tự soạn"}}],"practice":[{"type":"mcq","q":"Where is my bag? — ___ is under the desk.","options":["It","He","Him"],"answer":0,"explain":"Cái túi là đồ vật → **it**. Him là dạng tân ngữ, không đứng trước động từ.","src":"tự soạn"},{"type":"mcq","q":"(Điện thoại reo, bạn chưa biết ai gọi) Who was ___ on the phone?","options":["it","he","she"],"answer":0,"explain":"Khi hỏi để xác định người đó là ai, dùng **it**. Biết rồi mới chuyển sang he/she.","src":"tr. 38"},{"type":"mcq","q":"'He smokes in bed, though I don't like **it**.' — it ở đây chỉ gì?","options":["việc anh ấy hút thuốc trên giường","cái giường","anh ấy"],"answer":0,"explain":"**it** thay cho cả việc vừa nói (hút thuốc trên giường). Nếu chỉ anh ấy thì phải là him.","src":"tr. 38"},{"type":"fill","q":"Lan is my best friend. I like ___ very much. (cô ấy)","answer":["her"],"explain":"Sau động từ like là tân ngữ → **her**, không dùng she.","src":"tự soạn"},{"type":"fill","q":"My brother and ___ go to work by bus. (tôi)","answer":["I"],"explain":"'My brother and I' đứng trước động từ go, làm chủ ngữ → **I**, không dùng me.","src":"tự soạn"},{"type":"fill","q":"___ is 30 degrees today.","answer":["It"],"hint":"nhiệt độ","explain":"Nhiệt độ dùng chủ ngữ giả **It**.","src":"tự soạn"},{"type":"fix","wrong":"My boss called I yesterday.","answer":["My boss called me yesterday."],"explain":"Đứng sau động từ called là tân ngữ → **me**.","src":"tự soạn"},{"type":"fix","wrong":"Him is my brother.","answer":["He is my brother.","He's my brother."],"explain":"Đứng trước động từ is là chủ ngữ → **He**.","src":"tự soạn"},{"type":"fix","wrong":"Is raining now.","answer":["It is raining now.","It's raining now."],"explain":"Câu nói về thời tiết vẫn cần chủ ngữ giả **It**.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng (Rất vui được gặp bạn):","words":["It","is","nice","to","meet","you."],"explain":"Chủ ngữ thật là 'to meet you', đưa ra cuối câu; **It** đứng đầu thay chỗ.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng (Cô ấy tặng họ một cái bánh):","words":["She","gave","them","a","cake."],"explain":"**She** làm chủ ngữ; **them** đứng sau động từ gave nên dùng dạng tân ngữ.","src":"tự soạn"}],"flashcards":[{"front":"Dạng tân ngữ của I, he, she, we, they?","back":"**me, him, her, us, them**: Lan called **me**."},{"front":"Hai đại từ nhân xưng nào giữ nguyên dạng khi làm tân ngữ?","back":"**you** và **it**: I saw **it** and **it** saw me."},{"front":"Đứng sau giới từ (for, to, with) dùng dạng nào?","back":"Dạng **tân ngữ**: This is for **us**."},{"front":"'Mười giờ rồi' / 'Trời mưa' nói thế nào?","back":"Dùng chủ ngữ giả **It**: It's ten o'clock. It's raining."},{"front":"Hỏi 'Ai gọi điện thế?' khi chưa biết là ai?","back":"Who was **it** on the phone? ~ It was Vicky. **She**…"}]},{"id":"02b","title":"Đại từ sở hữu và đại từ phản thân","minutes":25,"goal":"Phân biệt my / mine / myself; dùng đúng a friend of mine; biết khi nào dùng myself (phản thân, nhấn mạnh, by myself) và khi nào chỉ dùng me.","pretest":[{"type":"mcq","q":"This bag isn't mine. ___ is red.","options":["Mine","My","Me"],"answer":0,"explain":"Không có danh từ theo sau → dùng đại từ sở hữu **Mine** (= my bag).","src":"tự soạn"},{"type":"mcq","q":"Anh ấy tự làm đứt tay mình: He cut ___.","options":["himself","him","his"],"answer":0,"explain":"Người bị đứt tay chính là người cắt → đại từ phản thân **himself**.","src":"tự soạn"}],"hook":{"icon":"🪞","text":"Tiếng Việt chỉ cần 'của tôi' và 'chính tôi'. Tiếng Anh có ba anh em: **my** (của tôi, luôn có danh từ đi kèm: my bag), **mine** (của tôi, đứng một mình: it's mine) và **myself** (chính tôi, như soi gương: hành động quay lại người làm). Hỏi đúng hai câu là chọn được: có danh từ đi sau không? và có phải 'tự mình / chính mình' không?"},"diagram":{"type":"flow","title":"Chọn my, mine hay myself?","start":{"q":"Có danh từ đi ngay sau không?","branches":[{"label":"Có","to":{"result":"my / your / his / her + danh từ: my bag","icon":"👜"}},{"label":"Không","to":{"q":"Nghĩa là 'của tôi' hay 'chính tôi'?","branches":[{"label":"của tôi","to":{"result":"mine / yours / hers / ours / theirs","icon":"🏷️"}},{"label":"chính tôi, tự tôi","to":{"result":"myself / yourself / himself…","icon":"🪞"}}]}}]}},"chunks":[{"title":"mine, yours, hers đứng một mình","icon":"🏷️","rule":"Đại từ sở hữu **mine, yours, his, hers, ours, theirs** đứng một mình, thay cho **my/your… + danh từ**, và **không có a/an/the** đứng trước.","explain":"my, your, her… (tính từ sở hữu) luôn cần danh từ đi sau: my coat. Khi không muốn lặp lại danh từ, đổi sang mine, yours, hers… Lưu ý **it** không có dạng đại từ sở hữu; **its** chỉ dùng kèm danh từ.","diagram":{"type":"table","title":"Từ nhân xưng tới sở hữu","head":["Nhân xưng","+ danh từ","Đứng một mình"],"rows":[["I","my","mine"],["you","your","yours"],["he","his","his"],["she","her","hers"],["it","its","(không có)"],["we","our","ours"],["they","their","theirs"]]},"examples":[{"en":"Can I borrow your keys? I can't find **mine**.","vi":"Cho tôi mượn chìa khoá của bạn nhé? Tôi không tìm thấy (chìa) của tôi."},{"en":"That coat is **mine**.","vi":"Cái áo khoác đó là của tôi."},{"en":"**Ours** is the third house on the left.","vi":"Nhà chúng tôi là căn thứ ba bên trái."},{"en":"That coat is the mine.","ok":false,"note":"không đặt the trước mine"}],"mistake":{"wrong":"This is mine book.","right":"This is my book.","why":"Có danh từ book đi sau thì dùng my, không dùng mine."},"src":"tr. 39–40","check":{"type":"mcq","q":"Is this pen ___?","options":["yours","your","the yours"],"answer":0,"explain":"Không có danh từ sau → **yours**; không thêm the.","src":"tự soạn"}},{"title":"a friend of mine","icon":"🤝","rule":"Muốn nói 'một người bạn của tôi' (một trong số các bạn), dùng **a/some + danh từ + of + mine/yours/hers…** hoặc **of + tên's**.","explain":"Đây gọi là sở hữu kép (double possessive). Người Việt hay dịch thẳng 'của tôi' thành 'of me', nhưng sau of ở cấu trúc này phải là đại từ **sở hữu**.","formula":"a + danh từ + of + mine / yours / his / hers / ours / theirs\na + danh từ + of + tên's","examples":[{"en":"Tom is a friend **of mine**.","vi":"Tom là một người bạn của tôi."},{"en":"I've got some magazines **of yours**.","vi":"Tôi đang giữ vài cuốn tạp chí của bạn."},{"en":"He's a brother **of Maria's**.","vi":"Anh ấy là một người anh của Maria."},{"en":"Tom is a friend of me.","ok":false,"note":"phải là of mine"}],"mistake":{"wrong":"She is a friend of me.","right":"She is a friend of mine.","why":"Sau of trong sở hữu kép dùng đại từ sở hữu mine."},"tip":"a friend of mine = one of my friends.","src":"tr. 40"},{"title":"myself: hành động quay về chính mình","icon":"🪞","rule":"Khi **chủ ngữ và tân ngữ là cùng một người/vật**, tân ngữ dùng đại từ phản thân **myself, yourself, himself, herself, itself, ourselves, yourselves, themselves**.","explain":"Tiếng Việt thêm 'tự, mình': anh ta tự bắn mình. Tiếng Anh đổi tân ngữ thành -self/-selves. Nếu dùng him thì là người khác. **Nhưng** sau giới từ chỉ vị trí (with, behind, near…) thường dùng đại từ nhân xưng: with him, behind me.","formula":"S + động từ + -self (S và tân ngữ là một)","examples":[{"en":"The gunman shot **himself**.","vi":"Tay súng tự bắn mình."},{"en":"The gunman shot **him**.","vi":"Tay súng bắn ông ấy (một người khác)."},{"en":"I'm annoyed with **myself**.","vi":"Tôi bực chính mình."},{"en":"I saw a lorry behind **me**.","vi":"Tôi thấy một chiếc xe tải phía sau tôi."},{"en":"Mike didn't have any money with himself.","ok":false,"note":"sau giới từ chỉ vị trí dùng him"}],"tip":"Số nhiều đổi -self thành **-selves**: ourselves, yourselves, themselves.","src":"tr. 40–41","check":{"type":"mcq","q":"She took an umbrella with ___.","options":["her","herself","hers"],"answer":0,"explain":"**with** ở đây chỉ vị trí (mang theo bên mình) → dùng đại từ nhân xưng **her**.","src":"tr. 41"}},{"title":"myself để nhấn mạnh; by myself","icon":"💪","rule":"-self còn dùng để **nhấn mạnh** 'chính người đó', đứng ngay sau từ được nhấn mạnh hoặc cuối câu; **by + -self** = 'một mình' hoặc 'không ai giúp'.","explain":"Ở cách dùng này, bỏ -self đi câu vẫn đủ nghĩa; -self chỉ thêm ý 'chính…, tự…'.","examples":[{"en":"The manageress **herself** welcomed us.","vi":"Chính bà quản lý ra đón chúng tôi."},{"en":"I saw him do it **myself**.","vi":"Chính tôi đã thấy anh ta làm việc đó."},{"en":"He's lived **by himself** since his wife died.","vi":"Ông ấy sống một mình từ khi vợ mất."}],"mistake":{"wrong":"He lives by him.","right":"He lives by himself.","why":"'Một mình' là by + đại từ phản thân."},"src":"tr. 41–42"}],"practice":[{"type":"classify","q":"Từ nào cần danh từ đi sau, từ nào đứng một mình?","buckets":["+ danh từ (my bag)","Đứng một mình (mine)"],"items":[{"text":"my","bucket":0},{"text":"mine","bucket":1},{"text":"their","bucket":0},{"text":"theirs","bucket":1},{"text":"our","bucket":0},{"text":"ours","bucket":1},{"text":"your","bucket":0},{"text":"yours","bucket":1}],"explain":"my, your, our, their luôn có danh từ theo sau; mine, yours, ours, theirs đứng một mình.","src":"tr. 39"},{"type":"mcq","q":"This isn't my umbrella. ___ is blue.","options":["Mine","My","Myself"],"answer":0,"explain":"Không có danh từ đi sau → **Mine** (= my umbrella). My cần danh từ.","src":"tự soạn"},{"type":"mcq","q":"I saw a car behind ___.","options":["me","myself","mine"],"answer":0,"explain":"Sau giới từ chỉ vị trí **behind** dùng đại từ nhân xưng **me**, không dùng myself.","src":"tr. 41"},{"type":"fill","q":"That coat is ___. (của cô ấy)","answer":["hers"],"explain":"Đứng một mình → **hers**. Không viết her's, không thêm the.","src":"tự soạn"},{"type":"fill","q":"Be careful with that knife! Don't cut ___. (bạn, một người)","answer":["yourself"],"explain":"Người cắt và người bị đứt là một → **yourself** (số ít).","src":"tự soạn"},{"type":"fill","q":"Tom is a friend of ___. (tôi)","answer":["mine"],"explain":"Sở hữu kép: a friend of **mine**, không dùng of me.","src":"tr. 40"},{"type":"fill","q":"My grandmother lives by ___. (bà, một mình)","answer":["herself"],"explain":"by + đại từ phản thân = một mình → by **herself**.","src":"tự soạn"},{"type":"fix","wrong":"That bag is the mine.","answer":["That bag is mine."],"explain":"Không đặt the trước đại từ sở hữu.","src":"tr. 40"},{"type":"fix","wrong":"She is a friend of me.","answer":["She is a friend of mine.","She's a friend of mine.","She is my friend.","She's my friend."],"explain":"Sau of trong sở hữu kép phải là đại từ sở hữu **mine**.","src":"tr. 40"},{"type":"fix","wrong":"This is mine phone.","answer":["This is my phone."],"explain":"Có danh từ phone đi sau → dùng **my**.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng (Chính bà quản lý ra đón chúng tôi):","words":["The","manager","herself","welcomed","us"],"answer":["The manager herself welcomed us","The manager welcomed us herself"],"explain":"**herself** nhấn mạnh, đứng ngay sau từ được nhấn mạnh (the manager) hoặc ở cuối câu.","src":"tr. 41–42"}],"flashcards":[{"front":"my hay mine: '___ book' và 'The book is ___'?","back":"**my** book (có danh từ) / The book is **mine** (đứng một mình)."},{"front":"Có nói 'the mine' được không?","back":"Không. That coat is **mine**."},{"front":"'Một người bạn của tôi' nói thế nào?","back":"a friend **of mine** (không phải of me)."},{"front":"Khi nào dùng myself làm tân ngữ?","back":"Khi chủ ngữ và tân ngữ là một: The gunman shot **himself**."},{"front":"'Mang theo tiền bên mình': with him hay with himself?","back":"**with him**: sau giới từ chỉ vị trí dùng đại từ nhân xưng."},{"front":"by myself nghĩa là gì?","back":"Một mình / không ai giúp: He lives **by himself**."}]},{"id":"02c","title":"Đại từ chỉ định, nghi vấn, quan hệ","minutes":25,"goal":"Dùng đúng this/that (gần–xa, sắp tới–vừa qua), chọn đúng who / whose / what / which khi hỏi, và nối câu bằng who / which / that / whose mà không lặp đại từ.","pretest":[{"type":"mcq","q":"___ is your name?","options":["What","Which","Who"],"answer":0,"explain":"Hỏi thông tin chung (tên là gì) → **What**.","src":"tự soạn"},{"type":"mcq","q":"The girl ___ sits next to me is Mai.","options":["who","which","whose"],"answer":0,"explain":"Thay cho người (the girl) và làm chủ ngữ của sits → **who**.","src":"tự soạn"}],"hook":{"icon":"🧭","text":"Ba nhóm đại từ này giống ba việc bạn làm mỗi ngày: **chỉ** (cái này, cái kia: this, that), **hỏi** (ai, của ai, cái gì, cái nào: who, whose, what, which) và **nối** hai câu thành một (người mà, cái mà: who, which, that). Nhiều từ trông giống nhau nhưng công việc khác nhau, nên hãy nhìn câu đang làm gì: chỉ, hỏi hay nối."},"diagram":{"type":"flow","title":"Hỏi bằng từ nào?","start":{"q":"Bạn hỏi về điều gì?","branches":[{"label":"Người","to":{"q":"Chọn trong nhóm đã biết?","branches":[{"label":"Có","to":{"result":"Which (of you)…?","icon":"👆"}},{"label":"Không","to":{"result":"Who…? (whom: trang trọng)","icon":"🙋"}}]}},{"label":"Của ai","to":{"result":"Whose…?","icon":"🏷️"}},{"label":"Vật, việc","to":{"q":"Chọn trong nhóm đã biết?","branches":[{"label":"Có","to":{"result":"Which…?","icon":"👆"}},{"label":"Không","to":{"result":"What…?","icon":"❓"}}]}}]}},"chunks":[{"title":"this / these và that / those","icon":"👉","rule":"**this/these**: vật ở gần, giới thiệu người, việc **đang hoặc sắp** xảy ra; **that/those**: vật ở xa, nhận ra ai
