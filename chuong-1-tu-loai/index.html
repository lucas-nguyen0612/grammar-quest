đó, việc **vừa xong hoặc đã qua**.","explain":"Tiếng Việt cũng có 'này / kia', nhưng tiếng Anh còn dùng theo thời gian: sắp kể → this, vừa nghe xong → that. Trên điện thoại: tự giới thiệu bằng **this**, hỏi người kia bằng **this** hoặc **that**.","examples":[{"en":"**This** is my sister, Lan.","vi":"Đây là em gái tôi, Lan."},{"en":"Listen to **this**. You'll love it.","vi":"Nghe cái này nhé. Bạn sẽ thích lắm."},{"en":"**That** was nice. Thank you!","vi":"(Bữa ăn) vừa rồi ngon quá. Cảm ơn bạn!"},{"en":"Hello, **this** is Lan. Is **that** Ruth?","vi":"A lô, Lan đây. Có phải Ruth đấy không?"}],"tip":"Sắp nói → this. Vừa xong → that. Muốn chỉ người: '**Those who** couldn't walk were carried.' (Những người không đi được…).","src":"tr. 42–44","check":{"type":"mcq","q":"(Vừa xem phim xong) ___ was a great film!","options":["That","This","These"],"answer":0,"explain":"Việc vừa kết thúc → **That**.","src":"tr. 43"}},{"title":"who, whom, whose","icon":"🙋","rule":"**Who** hỏi về người (chủ ngữ hoặc tân ngữ); **whom** là tân ngữ, trang trọng; **Whose** hỏi 'của ai'.","explain":"Câu hỏi bằng who mà có giới từ thì giới từ **đặt cuối câu**: Who did you go with? Kiểu đặt giới từ lên đầu chỉ dùng với **whom** và mang tính trang trọng: With whom did you go?","examples":[{"en":"**Who** broke the window?","vi":"Ai làm vỡ cửa sổ?"},{"en":"**Who** did you go **with**?","vi":"Bạn đi với ai?"},{"en":"With **whom** did you go?","vi":"Bạn đã đi cùng với ai? (trang trọng)"},{"en":"**Whose** is that dog?","vi":"Con chó đó là của ai?"},{"en":"With who did you go?","ok":false,"note":"với who, giới từ đặt cuối câu"}],"src":"tr. 44–45"},{"title":"what hay which?","icon":"❓","rule":"**What** hỏi sự vật, sự việc khi lựa chọn **rộng, không giới hạn**; **Which** hỏi để chọn trong **một số đã biết** (cả người lẫn vật).","explain":"What còn có vài mẫu câu rất hay dùng: What does he do? (làm nghề gì), What is she like? (tính cách thế nào), What does he look like? (trông thế nào), What … for? (để làm gì), What about + V-ing? (gợi ý).","examples":[{"en":"**What** would you like to drink?","vi":"Bạn muốn uống gì? (không giới hạn)"},{"en":"There's tea, coffee and juice. **Which** will you have?","vi":"Có trà, cà phê và nước ép. Bạn dùng loại nào?"},{"en":"**What** does your father **do**?","vi":"Bố bạn làm nghề gì?"},{"en":"**What** is your new boss **like**?","vi":"Sếp mới của bạn là người thế nào?"}],"tip":"Có sẵn danh sách để chọn → Which. Không có → What.","src":"tr. 45–47"},{"title":"Đại từ quan hệ: nối hai câu","icon":"🔗","rule":"**who** (người), **which** (vật, con vật, sự việc), **that** (cả người và vật), **whose** (của người/vật đó) thay cho danh từ đứng trước và **không lặp lại** he/she/it/them.","explain":"Tiếng Việt nói 'cô gái mà chúng tôi gặp cô ấy' nghe vẫn được, nên người Việt hay giữ lại her. Trong tiếng Anh, who/which/that đã thay cho danh từ rồi, thêm her là thừa. Phần này học kỹ hơn ở chủ đề Mệnh đề quan hệ.","formula":"danh từ chỉ người + who / that + …\ndanh từ chỉ vật + which / that + …\ndanh từ + whose + danh từ + …","examples":[{"en":"The woman **who** lives next door is a nurse.","vi":"Người phụ nữ sống cạnh nhà là y tá."},{"en":"I lost the book **which** you gave me.","vi":"Tôi làm mất cuốn sách bạn tặng."},{"en":"I met a girl **whose** hair came down to her waist.","vi":"Tôi gặp một cô gái có mái tóc dài tới eo."},{"en":"The girl who we met her is Lan.","ok":false,"note":"thừa her"}],"mistake":{"wrong":"People who they smile are happy.","right":"People who smile are happy.","why":"who đã thay cho people, không thêm they."},"src":"tr. 47–48"}],"practice":[{"type":"mcq","q":"(Bạn đang cầm điện thoại trong tay) ___ is my new phone.","options":["This","That","These"],"answer":0,"explain":"Vật ở gần, số ít → **This**. These dùng cho số nhiều.","src":"tự soạn"},{"type":"mcq","q":"(Bạn gọi điện) Hello, ___ is Nam speaking.","options":["this","that","it"],"answer":0,"explain":"Trên điện thoại tự giới thiệu mình bằng **this**.","src":"tr. 43"},{"type":"mcq","q":"There's tea, coffee and juice. ___ will you have?","options":["Which","Who","Whose"],"answer":0,"explain":"Chọn trong ba thứ đã nêu → **Which**. Who hỏi người, Whose hỏi của ai.","src":"tr. 47"},{"type":"fill","q":"___ is that car? — It's my boss's.","answer":["Whose"],"explain":"Câu trả lời 'của sếp tôi' → hỏi sở hữu bằng **Whose**.","src":"tự soạn"},{"type":"fill","q":"___ does your mother do? — She's a doctor.","answer":["What"],"explain":"What does … do? = làm nghề gì.","src":"tr. 45"},{"type":"fill","q":"I have a friend ___ father is a pilot.","answer":["whose"],"explain":"'bố của người bạn đó' → **whose** + danh từ.","src":"tự soạn"},{"type":"fill","q":"The phone ___ I bought last week is broken.","answer":["which","that"],"explain":"Thay cho vật (the phone) → **which** hoặc **that**.","src":"tự soạn"},{"type":"fix","wrong":"With who did you go?","answer":["Who did you go with?","With whom did you go?"],"explain":"Với who, giới từ đặt cuối câu; nếu muốn giới từ đứng đầu thì phải dùng whom (trang trọng).","src":"tr. 44–45"},{"type":"fix","wrong":"The girl who we met her yesterday is Lan.","answer":["The girl who we met yesterday is Lan.","The girl whom we met yesterday is Lan.","The girl that we met yesterday is Lan.","The girl we met yesterday is Lan."],"explain":"who đã thay cho the girl; thêm her là lặp lại, sai.","src":"tr. 47"},{"type":"order","q":"Sắp xếp thành câu hỏi (Sếp mới của bạn là người thế nào?):","words":["What","is","your","new","boss","like?"],"explain":"What + be + … + like? hỏi tính cách, tính chất.","src":"tr. 46"}],"flashcards":[{"front":"this hay that cho việc vừa xong?","back":"**that**: That was nice. (sắp tới → this: Listen to this.)"},{"front":"Tự giới thiệu trên điện thoại?","back":"**This** is Lan. Is that Ruth?"},{"front":"who + giới từ: giới từ đặt ở đâu?","back":"Cuối câu: Who did you go **with**? (trang trọng: With whom…?)"},{"front":"which hay what khi chọn trong vài thứ đã nêu?","back":"**Which**: Tea or coffee? Which will you have?"},{"front":"Hỏi nghề nghiệp bằng what?","back":"**What does** he **do**? ~ He's a doctor."},{"front":"Sai ở đâu: 'the girl who we met her'?","back":"Thừa **her**: the girl who we met."}]},{"id":"02d","title":"Đại từ phân bổ, bất định, hỗ tương","minutes":25,"goal":"Chia động từ đúng sau each, both, all, everyone, nobody…; dùng some-/any-/no- đúng loại câu; dùng each other và biết không nói 'meet each other'.","pretest":[{"type":"mcq","q":"Everybody ___ here.","options":["is","are"],"answer":0,"explain":"**Everybody** nghĩa là 'mọi người' nhưng đi với động từ **số ít**: is.","src":"tr. 57"},{"type":"mcq","q":"Both of us ___ tired.","options":["are","is"],"answer":0,"explain":"**Both** = cả hai → động từ số nhiều: are.","src":"tr. 51"}],"hook":{"icon":"⚖️","text":"Tiếng Việt không chia động từ, nên 'mọi người **đều** thích cô ấy' hay 'mỗi người **có** một cái' chẳng cần nghĩ. Tiếng Anh thì phải hỏi: từ này tính là **một** hay **nhiều**? Bất ngờ là everybody (mọi người) và each (mỗi) lại tính là một. Bài này cho bạn một cái cân để quyết định số ít hay số nhiều."},"diagram":{"type":"flow","title":"Động từ số ít hay số nhiều?","start":{"q":"Chủ ngữ bắt đầu bằng từ nào?","branches":[{"label":"each / either / neither (of)","to":{"result":"Số ít: Each of them has…","icon":"1️⃣"}},{"label":"both (of)","to":{"result":"Số nhiều: Both of us are…","icon":"2️⃣"}},{"label":"all / most / some of + N","to":{"result":"Theo danh từ sau of","icon":"🔍"}},{"label":"every- / some- / any- / no- + one, body, thing","to":{"result":"Số ít: Everybody likes…","icon":"1️⃣"}}]}},"chunks":[{"title":"all, most, both","icon":"👥","rule":"**all** (tất cả, từ 3 trở lên), **most** (phần lớn), **both** (cả hai) + **of us/you/them** → động từ **số nhiều**; trước đại từ **không được bỏ of**.","explain":"Trước danh từ có the/my… thì of bỏ được với all và both (all (of) the students, both (of) my parents), còn trước us/you/them thì bắt buộc có of. all/most of + danh từ thì động từ chia theo danh từ đó. Không đặt **the** trước both.","formula":"All / Most / Both + of + us / you / them + động từ số nhiều\nAll / Both (of) + the / my… + danh từ","diagram":{"type":"table","title":"Nghĩa và động từ đi kèm","head":["Từ","Nghĩa","+ of us / you / them"],"rows":[["all","tất cả (từ 3 trở lên)","số nhiều"],["most","phần lớn","số nhiều"],["both","cả hai","số nhiều"],["each","mỗi (từ 2 trở lên)","số ít"],["either","một trong hai","số ít"],["neither","không cái nào trong hai","số ít"]]},"examples":[{"en":"**All of us** were late.","vi":"Tất cả chúng tôi đều đến muộn."},{"en":"**Both** (of) my parents **are** teachers.","vi":"Cả bố lẫn mẹ tôi đều là giáo viên."},{"en":"She invited **us both**.","vi":"Cô ấy mời cả hai chúng tôi."},{"en":"All us went home.","ok":false,"note":"thiếu of trước us"},{"en":"The both children are asleep.","ok":false,"note":"không đặt the trước both"}],"tip":"all không mang nghĩa 'mọi người': nói Everybody enjoyed the party, không nói All enjoyed the party.","src":"tr. 48–52"},{"title":"each, either, neither","icon":"☝️","rule":"**each of / either of / neither of** + danh từ hoặc đại từ **số nhiều** → động từ thường ở **số ít**.","explain":"each nhìn từng người một, either là 'một trong hai', neither là 'không cái nào trong hai'. Vì nghĩ tới từng cái một nên động từ là số ít. Riêng either/neither of, trong văn nói thân mật đôi khi dùng số nhiều, nhưng số ít luôn an toàn. Khi each đứng sau chủ ngữ (The students each have…) thì động từ lại số nhiều.","formula":"Each / Either / Neither + of + the… + danh từ số nhiều + động từ số ít","examples":[{"en":"**Each of** the students **has** a laptop.","vi":"Mỗi học sinh đều có một chiếc laptop."},{"en":"He gave us £5 **each**.","vi":"Ông ấy cho mỗi chúng tôi 5 bảng."},{"en":"**Neither of** my sisters **is** married.","vi":"Không chị nào trong hai chị gái tôi đã lập gia đình."},{"en":"Each of the students have a laptop.","ok":false,"note":"each of → has"}],"src":"tr. 50–53","check":{"type":"mcq","q":"Each of my friends ___ a car.","options":["has","have"],"answer":0,"explain":"**Each of** + danh từ số nhiều nhưng động từ số ít → has.","src":"tr. 50"}},{"title":"someone, anything, nobody, everyone","icon":"🔍","rule":"**some-** dùng trong câu khẳng định và lời mời; **any-** trong câu phủ định, câu hỏi, sau if; **no-** đã mang nghĩa phủ định nên **không thêm not**; tất cả đi với động từ **số ít**.","explain":"Tiếng Việt nói 'tôi không nói gì cả' có hai chữ phủ định vẫn đúng, nhưng tiếng Anh chỉ cần một: I said **nothing** hoặc I didn't say **anything**. Khi nhắc lại someone, everyone… người ta thường dùng they/their vì không biết là nam hay nữ; còn something/nothing thì dùng it.","formula":"some- / every- / no- / any- + one, body, thing + động từ số ít","examples":[{"en":"**Someone** left **their** phone on the desk.","vi":"Ai đó để quên điện thoại trên bàn."},{"en":"I didn't see **anybody** in the room.","vi":"Tôi không thấy ai trong phòng."},{"en":"**Everybody likes** her.","vi":"Mọi người đều thích cô ấy."},{"en":"I'm making coffee. Would you like **some**?","vi":"Tôi đang pha cà phê. Bạn uống một ít không?"},{"en":"I didn't say nothing.","ok":false,"note":"hai lần phủ định"}],"mistake":{"wrong":"I didn't say nothing.","right":"I said nothing. / I didn't say anything.","why":"nothing đã là phủ định, không dùng thêm didn't."},"src":"tr. 53–57","check":{"type":"mcq","q":"Nobody ___ at home yesterday.","options":["was","were","wasn't"],"answer":0,"explain":"**Nobody** đi với động từ số ít và không thêm not → was.","src":"tr. 56–57"}},{"title":"each other: nhau, lẫn nhau","icon":"🔁","rule":"**each other / one another** = 'nhau', đứng sau động từ hoặc giới từ; **không dùng** sau **meet, marry, similar**.","explain":"Tiếng Việt nói 'họ gặp nhau', 'họ cưới nhau', nhưng trong tiếng Anh meet và marry đã tự có nghĩa 'nhau', nên chỉ nói They met / They married. Có thể dùng sở hữu: each other's.","examples":[{"en":"Lan and Mai often help **each other**.","vi":"Lan và Mai thường giúp đỡ nhau."},{"en":"We have **each other's** phone numbers.","vi":"Chúng tôi có số điện thoại của nhau."},{"en":"They **married** in 1998.","vi":"Họ cưới nhau năm 1998."},{"en":"They married each other in 1998.","ok":false,"note":"marry không cần each other"}],"tip":"gặp nhau = meet, cưới nhau = marry, giống nhau = similar: không thêm each other.","src":"tr. 58"}],"practice":[{"type":"classify","q":"Chủ ngữ nào đi với động từ số ít, chủ ngữ nào số nhiều?","buckets":["+ động từ số ít","+ động từ số nhiều"],"items":[{"text":"Each of them","bucket":0},{"text":"Both of them","bucket":1},{"text":"Everyone","bucket":0},{"text":"Nobody","bucket":0},{"text":"All of us","bucket":1},{"text":"Most of us","bucket":1}],"explain":"each of, everyone, nobody → số ít; both of, all of us, most of us → số nhiều.","src":"tr. 48–57"},{"type":"mcq","q":"Both of my parents ___ teachers.","options":["are","is"],"answer":0,"explain":"**Both** = cả hai → số nhiều.","src":"tự soạn"},{"type":"mcq","q":"I'm making coffee. Would you like ___?","options":["some","any"],"answer":0,"explain":"Lời mời, chờ câu trả lời 'có' → **some**, dù là câu hỏi.","src":"tr. 53–54"},{"type":"mcq","q":"Someone left ___ phone on the desk.","options":["their","its","our"],"answer":0,"explain":"Không biết là nam hay nữ nên dùng **their**. its chỉ dùng cho vật, không cho người.","src":"tr. 57"},{"type":"fill","q":"___ of us were late. (Tất cả)","answer":["All"],"explain":"All of us + động từ số nhiều.","src":"tự soạn"},{"type":"fill","q":"I didn't see ___ in the room. (ai cả)","answer":["anybody","anyone"],"explain":"Câu phủ định (didn't) → **anybody / anyone**.","src":"tr. 56"},{"type":"fill","q":"Lan and Mai often help ___ with homework. (nhau)","answer":["each other","one another"],"explain":"'nhau' = **each other** hoặc **one another**.","src":"tr. 58"},{"type":"fix","wrong":"All us went to the party.","answer":["All of us went to the party.","We all went to the party."],"explain":"Trước đại từ us phải có of: All **of** us.","src":"tr. 49"},{"type":"fix","wrong":"Each of the students have a laptop.","answer":["Each of the students has a laptop."],"explain":"Each of + danh từ số nhiều → động từ số ít **has**.","src":"tr. 50"},{"type":"fix","wrong":"I didn't say nothing.","answer":["I said nothing.","I didn't say anything."],"explain":"Chỉ một lần phủ định: nothing **hoặc** didn't … anything.","src":"tr. 57"},{"type":"fix","wrong":"They met each other in 2019.","answer":["They met in 2019."],"explain":"meet đã có nghĩa 'gặp nhau', không thêm each other.","src":"tr. 58"},{"type":"order","q":"Sắp xếp thành câu đúng (Cả hai chúng tôi đều làm việc ở Hà Nội):","words":["We","both","work","in","Hanoi."],"explain":"**both** đứng trước động từ thường (work).","src":"tr. 51–52"}],"flashcards":[{"front":"Each of the students ___ (have) a laptop?","back":"**has**: each of → động từ số ít."},{"front":"Everybody ___ (like) her?","back":"**likes**: everybody là số ít."},{"front":"All us hay All of us?","back":"**All of us**: trước đại từ không bỏ of."},{"front":"Sửa: I didn't say nothing.","back":"I said **nothing**. / I didn't say **anything**."},{"front":"'Họ cưới nhau' nói thế nào?","back":"They **married**. (không thêm each other)"},{"front":"Someone left ___ bag (đại từ nào)?","back":"**their**: Someone left their bag."}]}],"quiz":{"pass":0.8,"questions":[{"type":"mcq","q":"Did you see the snake? — Yes, I saw ___ and it saw me, too.","options":["it","him","them"],"answer":0,"explain":"Con rắn là con vật, không rõ giới tính → **it** (dạng tân ngữ giống dạng chủ ngữ).","src":"tr. 37"},{"type":"fill","q":"Please give ___ the key. (anh ấy)","answer":["him"],"explain":"Sau động từ give là tân ngữ → **him**.","src":"tự soạn"},{"type":"mcq","q":"___ is Monday today.","options":["It","This","There"],"answer":0,"explain":"Nói ngày tháng dùng chủ ngữ giả **It**.","src":"tự soạn"},{"type":"fix","wrong":"Is difficult to learn English.","answer":["It is difficult to learn English.","It's difficult to learn English."],"explain":"Chủ ngữ thật (to learn English) ở cuối câu, đầu câu cần chủ ngữ giả **It**.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng (Tôi thấy lạ là cô ấy không bao giờ gọi điện):","words":["I","find","it","strange","that","she","never","calls."],"explain":"**it** là tân ngữ giả, thay cho mệnh đề 'that she never calls' đứng sau.","src":"tr. 38"},{"type":"mcq","q":"'**Ours** is the house on the left.' — Ours = ?","options":["Our house","Us","Ourselves"],"answer":0,"explain":"Đại từ sở hữu **ours** thay cho our + danh từ (our house).","src":"tr. 40"},{"type":"fix","wrong":"Is this book your?","answer":["Is this book yours?"],"explain":"Không có danh từ theo sau → đại từ sở hữu **yours**.","src":"tự soạn"},{"type":"fill","q":"We enjoyed ___ at the party. (chúng tôi, tự)","answer":["ourselves"],"explain":"Chủ ngữ we và tân ngữ là một → **ourselves**.","src":"tự soạn"},{"type":"mcq","q":"Mike didn't have any money with ___.","options":["him","himself","his"],"answer":0,"explain":"Sau giới từ chỉ vị trí (with = mang theo bên mình) dùng đại từ nhân xưng **him**.","src":"tr. 41"},{"type":"mcq","q":"(Bạn vừa nghe xong một câu chuyện) ___ was really funny!","options":["That","This","Those"],"answer":0,"explain":"Việc vừa kết thúc → **That**. Those là số nhiều.","src":"tr. 43"},{"type":"fill","q":"___ did you meet at the party? — I met Nam and his wife.","answer":["Who","Whom"],"explain":"Hỏi về người làm tân ngữ: **Who** (thường dùng) hoặc **Whom** (trang trọng).","src":"tr. 44–45"},{"type":"mcq","q":"The man ___ car was stolen called the police.","options":["whose","who","which"],"answer":0,"explain":"'xe **của** người đàn ông' → **whose** + danh từ.","src":"tr. 48"},{"type":"fix","wrong":"People who they smile are happy.","answer":["People who smile are happy.","People that smile are happy."],"explain":"who đã thay cho people; không lặp thêm they.","src":"tr. 47"},{"type":"mcq","q":"Both of ___ are from Hue.","options":["us","we","our"],"answer":0,"explain":"Sau of dùng dạng tân ngữ → **us**.","src":"tr. 51"},{"type":"mcq","q":"Each of my colleagues ___ a different idea.","options":["has","have"],"answer":0,"explain":"**Each of** → động từ số ít.","src":"tr. 50"},{"type":"fill","q":"Nobody ___ at the meeting yesterday. (be)","answer":["was"],"explain":"**Nobody** đi với động từ số ít, và không thêm not (không viết wasn't).","src":"tr. 56–57"},{"type":"classify","q":"Từ nào thường dùng như some, từ nào như any?","buckets":["Câu khẳng định, lời mời (some-)","Câu phủ định, câu hỏi (any-)"],"items":[{"text":"somebody","bucket":0},{"text":"anything","bucket":1},{"text":"something","bucket":0},{"text":"anyone","bucket":1},{"text":"someone","bucket":0},{"text":"anywhere","bucket":1}],"explain":"some- dùng như some, any- dùng như any.","src":"tr. 56"},{"type":"fix","wrong":"They married each other in 2020.","answer":["They married in 2020.","They got married in 2020."],"explain":"marry đã có nghĩa 'cưới nhau', không thêm each other.","src":"tr. 58"}]}},{"id":"03-tinh-tu","title":"Tính từ","en":"Adjectives","icon":"🌈","pages":"65–88","summary":"Tính từ (adjective) cho biết người, vật, sự việc **thế nào** hoặc **của ai, cái nào, bao nhiêu**. Chủ đề này dạy bạn các nhóm tính từ hay gặp (this/that, each/every, a few/few…), cách tạo tính từ ghép, chọn -ing hay -ed, đặt tính từ đúng chỗ, xếp nhiều tính từ theo đúng trật tự, và dùng the + tính từ để nói về một nhóm người.","mindmap":{"label":"Tính từ","children":[{"label":"Các loại","icon":"🗂️","children":[{"label":"Mô tả: tall, red"},{"label":"Giới hạn: my, this, each, few, which"}]},{"label":"Cấu tạo","icon":"🧩","children":[{"label":"Tính từ ghép: well-known"},{"label":"-ing / -ed: boring / bored"},{"label":"Danh từ làm tính từ: shoe shop"}]},{"label":"Vị trí","icon":"📍","children":[{"label":"Trước danh từ: a new car"},{"label":"Sau hệ từ: You look tired"},{"label":"Sau danh từ: something new"}]},{"label":"Trật tự","icon":"🔢","children":[{"label":"Ý kiến trước miêu tả"},{"label":"a nice big red car"}]},{"label":"the + tính từ","icon":"👥","children":[{"label":"the poor, the rich (số nhiều)"},{"label":"the French, the English"}]}]},"lessons":[{"id":"03a","title":"Các loại tính từ: chỉ định, phân bổ, số lượng, nghi vấn","minutes":25,"goal":"Nhận ra tính từ mô tả và tính từ giới hạn; dùng đúng this/that/these/those, other/another/the other, each/every/both/either/neither và a few/few, a little/little.","pretest":[{"type":"mcq","q":"Đôi giày ở ngay cạnh bạn. Chọn từ đúng: ___ shoes are mine.","options":["These","This","That"],"answer":0,"explain":"Ở **gần** + danh từ **số nhiều** (shoes) → **these**. This/that chỉ đi với số ít.","src":"tr. 66"},{"type":"mcq","q":"Con người có hai tay. ___ hand has five fingers.","options":["Each","Every"],"answer":0,"explain":"Chỉ có **hai** cái thì dùng **each**, không dùng every (each hand, không every hand).","src":"tr. 68"},{"type":"mcq","q":"He has ___ friends, so he feels lonely.","options":["few","a few"],"answer":0,"explain":"**few** (không có a) = rất ít, không đủ → nên mới thấy cô đơn. **a few** = có một vài, mang nghĩa tích cực.","src":"tr. 71"}],"hook":{"icon":"🏷️","text":"Hãy nghĩ tới một **cái nhãn dán** lên món hàng. Có nhãn tả món hàng **thế nào** (đỏ, to, mới) và có nhãn cho biết **của ai, cái nào, bao nhiêu** (của tôi, cái này, mỗi cái, vài cái). Tiếng Anh cũng có hai kiểu 'nhãn' như vậy, và cả hai đều dán **trước** danh từ."},"diagram":{"type":"mindmap","title":"Hai nhóm tính từ","root":{"label":"Tính từ","children":[{"label":"Mô tả (thế nào?)","icon":"🎨","children":[{"label":"tall, red, new, noisy"}]},{"label":"Giới hạn","icon":"📏","children":[{"label":"Sở hữu: my, your, their"},{"label":"Chỉ định: this, that, another"},{"label":"Phân bổ: each, every, both"},{"label":"Số lượng: many, a few, no"},{"label":"Nghi vấn: which, what, whose"}]}]}},"chunks":[{"title":"Tính từ mô tả và tính từ giới hạn","icon":"🗂️","rule":"Tính từ **mô tả** cho biết người/vật **thế nào** (tall, red); tính từ **giới hạn** cho biết **của ai, cái nào, bao nhiêu** (my, this, each, many, which) và đứng **trước danh từ**.","explain":"Tính từ mô tả chiếm phần lớn tính từ tiếng Anh. Tính từ giới hạn (limiting adjectives, còn gọi là từ hạn định) gồm 5 nhóm: sở hữu, chỉ định, phân bổ, số lượng, nghi vấn. Tiếng Việt nói 'xe **của tôi**', 'cái áo **này**' — từ chỉ sở hữu, chỉ định đứng **sau**. Tiếng Anh đưa chúng lên **trước**: my car, this shirt.\nVới nhóm nghi vấn: **which** khi chọn trong vài thứ cho sẵn, **what** khi không giới hạn lựa chọn.","formula":"tính từ giới hạn + (tính từ mô tả) + danh từ\nmy + new + phone","examples":[{"en":"**My** sister is very **tall**.","vi":"Chị tôi rất cao."},{"en":"**Which** size do you want: small, medium or large?","vi":"Bạn muốn cỡ nào: nhỏ, vừa hay lớn?"},{"en":"**What** sport do you play?","vi":"Bạn chơi môn thể thao gì?"},{"en":"the car of me","ok":false,"note":"dịch từng chữ 'xe của tôi' → phải là my car"}],"mistake":{"wrong":"This is the phone of me.","right":"This is my phone.","why":"Tính từ sở hữu (my, your, his…) đứng trước danh từ, không dịch 'của tôi' thành 'of me'."},"tip":"Hỏi 'thế nào?' → mô tả. Hỏi 'của ai? cái nào? bao nhiêu?' → giới hạn.","src":"tr. 65, 72–73","check":{"type":"classify","q":"Xếp mỗi từ vào đúng nhóm:","buckets":["Mô tả","Giới hạn"],"items":[{"text":"tall","bucket":0},{"text":"my","bucket":1},{"text":"beautiful","bucket":0},{"text":"every","bucket":1},{"text":"red","bucket":0},{"text":"which","bucket":1}],"explain":"tall, beautiful, red tả **thế nào**; my (của ai), every (mỗi), which (cái nào) là tính từ **giới hạn**.","src":"tr. 65"}},{"title":"this/that/these/those và other/another/the other","icon":"👉","rule":"**this/these** = ở gần (hoặc hiện tại), **that/those** = ở xa (hoặc quá khứ); **this/that** + số ít, **these/those** + số nhiều.","explain":"Đây là nhóm tính từ **chỉ định**. Với thời gian: this week = tuần này, that day = hôm đó (đã qua).\nCùng nhóm còn có:\n• **another** + danh từ số ít = thêm một cái nữa / một cái khác: another cup.\n• **other** + số ít hoặc số nhiều = khác: other people.\n• **the other** + số ít = cái còn lại trong **hai** cái; + số nhiều = những cái còn lại.","formula":"this/that + N số ít\nthese/those + N số nhiều\nanother + N số ít · the other + N (cái còn lại)","diagram":{"type":"flow","title":"Chọn this, that, these hay those?","start":{"q":"Ở gần (hoặc bây giờ)?","branches":[{"label":"Gần","to":{"q":"Danh từ số ít?","branches":[{"label":"Số ít","to":{"result":"this book","icon":"👇"}},{"label":"Số nhiều","to":{"result":"these books","icon":"👇"}}]}},{"label":"Xa","to":{"q":"Danh từ số ít?","branches":[{"label":"Số ít","to":{"result":"that book","icon":"👉"}},{"label":"Số nhiều","to":{"result":"those books","icon":"👉"}}]}}]}},"examples":[{"en":"**These** apples are sweet, but **those** apples over there are sour.","vi":"Mấy quả táo này ngọt, nhưng mấy quả đằng kia thì chua."},{"en":"I'm busy **this** week.","vi":"Tuần này tôi bận."},{"en":"Can I have **another** cup of coffee?","vi":"Cho tôi thêm một tách cà phê nữa được không?"},{"en":"This shoe is fine, but **the other** shoe is broken.","vi":"Chiếc giày này ổn, nhưng chiếc còn lại bị hỏng."},{"en":"This books are new.","ok":false,"note":"books số nhiều → these"}],"mistake":{"wrong":"Can I have other cup of tea?","right":"Can I have another cup of tea?","why":"Danh từ đếm được số ít (cup) cần **another**, không dùng other trơ trọi."},"tip":"th**is**/th**at** — một; th**ese**/th**ose** — nhiều (có chữ **s** như số nhiều).","src":"tr. 66–67"},{"title":"each, every, both, either, neither","icon":"🧮","rule":"**each/every/either/neither** + danh từ **số ít**; **both** + danh từ **số nhiều**. Có **hai** thứ thì dùng **each** (không every); nói **tần suất** thì dùng **every**.","explain":"Đây là nhóm **phân bổ**. each và every thường thay nhau được (động từ chia số ít), nhưng each nhìn **từng cái một**, every nhìn **cả nhóm**.\n• both = cả hai, either = một trong hai, neither = không cái nào trong hai — cả ba chỉ dùng khi có **hai** người/vật.\n• Tần suất: every ten minutes (cứ 10 phút một lần), không nói each ten minutes.","formula":"each / every / either / neither + N số ít + V số ít\nboth + N số nhiều + V số nhiều","diagram":{"type":"table","title":"Nhóm phân bổ","head":["Từ","Đi với","Nghĩa","Ví dụ"],"rows":[["each","N số ít","mỗi (từng cái)","each hand"],["every","N số ít","mọi, mỗi (cả nhóm)","every student, every day"],["both","N số nhiều","cả hai","both hands"],["either","N số ít","một trong hai","either side"],["neither","N số ít","không cái nào (trong 2)","neither answer"]]},"examples":[{"en":"**Each** hand has five fingers.","vi":"Mỗi bàn tay có năm ngón."},{"en":"There is a bus **every** ten minutes.","vi":"Cứ mười phút có một chuyến xe buýt."},{"en":"**Both** answers are correct.","vi":"Cả hai câu trả lời đều đúng."},{"en":"**Neither** answer is correct.","vi":"Không câu trả lời nào (trong hai câu) đúng."},{"en":"Every students has a laptop.","ok":false,"note":"every + số ít: every student"}],"mistake":{"wrong":"Each students has a book.","right":"Each student has a book.","why":"Tiếng Việt 'mỗi học sinh' không đổi dạng danh từ; tiếng Anh each/every phải đi với danh từ **số ít**."},"tip":"**Both** có hai → danh từ có **s**. Còn lại (each, every, either, neither) → một → không s.","src":"tr. 67–68","check":{"type":"mcq","q":"I visit my grandparents ___ Sunday.","options":["every","both","either"],"answer":0,"explain":"Nói **tần suất** (chủ nhật nào cũng đi) → **every**. both/either chỉ dùng khi nói về hai thứ.","src":"tự soạn"}},{"title":"Số lượng: a few / few, a little / little","icon":"🤏","rule":"**a few / a little** = có một ít (đủ dùng, tích cực); **few / little** = rất ít (không đủ, tiêu cực). **few** + danh từ đếm được số nhiều, **little** + danh từ không đếm được.","explain":"Chữ **a** nhỏ xíu nhưng đổi hẳn nghĩa: có 'a' = 'có một chút, vẫn ổn'; không 'a' = 'gần như không có'. Muốn nhấn mạnh 'rất ít' thì nói **very few / very little**.\nNhóm số lượng còn có many (+ số nhiều), much (+ không đếm được), a lot of, some, any, no… — bạn sẽ học kỹ ở chủ đề Lượng từ.","formula":"a few / few + N đếm được số nhiều\na little / little + N không đếm được","examples":[{"en":"He speaks **a little** English, so we can talk to him.","vi":"Anh ấy nói được chút tiếng Anh, nên mình nói chuyện với anh ấy được."},{"en":"He speaks **little** English, so it is hard to talk to him.","vi":"Anh ấy hầu như không nói được tiếng Anh, nên khó nói chuyện."},{"en":"I have **a few** friends here, so I'm not lonely.","vi":"Tôi có vài người bạn ở đây nên không cô đơn."},{"en":"I have a little friends.","ok":false,"note":"friends đếm được → a few"}],"mistake":{"wrong":"I have a few money.","right":"I have a little money.","why":"money không đếm được → dùng **a little**, không dùng a few."},"tip":"Có **a** = có **ạ** (lễ phép, tích cực). Không a = gần như **không** có.","src":"tr. 70–72"}],"practice":[{"type":"mcq","q":"Look at ___ photo in my hand.","options":["this","these","those"],"answer":0,"explain":"Ở **gần** (trong tay) + **số ít** (photo) → this. these/those dùng cho số nhiều.","src":"tự soạn"},{"type":"mcq","q":"I'm still hungry. Can I have ___ sandwich?","options":["another","other","the other"],"answer":0,"explain":"Thêm **một cái nữa** + danh từ số ít → **another**. other không đứng trơ trước danh từ số ít; the other là cái còn lại trong hai cái.","src":"tự soạn"},{"type":"classify","q":"Từ nào đi với danh từ số ít, từ nào đi với danh từ số nhiều?","buckets":["+ N số ít","+ N số nhiều"],"items":[{"text":"each","bucket":0},{"text":"both","bucket":1},{"text":"neither","bucket":0},{"text":"these","bucket":1},{"text":"every","bucket":0},{"text":"those","bucket":1},{"text":"that","bucket":0}],"explain":"each, every, either, neither, this, that + số ít; both, these, those + số nhiều.","src":"tr. 66–68"},{"type":"mcq","q":"There are two bags. This bag is mine. ___ bag is Lan's.","options":["The other","Another","Other"],"answer":0,"explain":"Có **hai** cái, nói cái **còn lại** → **the other**. another = thêm một cái (còn nhiều cái khác).","src":"tự soạn"},{"type":"mcq","q":"The bus comes ___ fifteen minutes.","options":["every","each","both"],"answer":0,"explain":"Tần suất (cứ 15 phút một lần) → **every**. Không nói each fifteen minutes.","src":"tr. 68"},{"type":"fill","q":"She has two children. ___ child has a phone. (each / every)","answer":["Each"],"hint":"Chỉ có hai đứa trẻ.","explain":"Chỉ có **hai** → **each**; every không dùng cho hai người/vật.","src":"tự soạn"},{"type":"fill","q":"I have ___ money, so I can buy you a coffee. (little / a little)","answer":["a little"],"explain":"Đủ tiền mời cà phê → nghĩa tích cực → **a little**. little = gần như không có tiền.","src":"tự soạn"},{"type":"fill","q":"Very ___ people came to the party, so it was boring. (few / a few)","answer":["few"],"explain":"Ít người, buổi tiệc chán → nghĩa tiêu cực → **few**. Sách dùng **very few** để nhấn mạnh, không có 'very a few'.","src":"tr. 71"},{"type":"fix","wrong":"This shoes are very comfortable.","answer":["These shoes are very comfortable.","Those shoes are very comfortable."],"explain":"shoes là số nhiều → **these** (hoặc those), không dùng this.","src":"tự soạn"},{"type":"fix","wrong":"Each students has a laptop.","answer":["Each student has a laptop.","Every student has a laptop."],"explain":"each/every + danh từ **số ít**: student, và động từ số ít has.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu hỏi đúng:","words":["Which","colour","do","you","like:","red","or","blue?"],"explain":"Chọn trong số lựa chọn có sẵn (red or blue) → **which**; which đứng ngay trước danh từ colour.","src":"tự soạn"}],"flashcards":[{"front":"this/these khác that/those thế nào?","back":"**this/these** = gần (this book, these books); **that/those** = xa (that car, those cars)"},{"front":"another, other, the other + danh từ gì?","back":"**another** + số ít (another cup); **other** + số ít/nhiều (other people); **the other** = cái còn lại (the other shoe)"},{"front":"each hay every: có hai thứ? nói tần suất?","back":"Hai thứ → **each** hand; tần suất → **every** ten minutes"},{"front":"both / either / neither + danh từ số ít hay số nhiều?","back":"**both** + số nhiều (both answers); **either/neither** + số ít (neither answer)"},{"front":"a few khác few thế nào?","back":"**a few** = có vài (tích cực): a few friends. **few** = rất ít (tiêu cực): few friends, so he is lonely"}]},{"id":"03b","title":"Tính từ ghép; phân từ và danh từ dùng như tính từ","minutes":25,"goal":"Nhận ra tính từ ghép; chọn đúng -ing hay -ed (boring/bored); dùng danh từ làm tính từ ở dạng số ít (shoe shop, a five-week tour).","pretest":[{"type":"mcq","q":"The film was very long and I was ___.","options":["bored","boring"],"answer":0,"explain":"**Tôi cảm thấy** chán → **bored**. I was boring = tôi là người nhàm chán.","src":"tr. 74–75"},{"type":"mcq","q":"'Cửa hàng giày' tiếng Anh là:","options":["a shoe shop","a shoes shop","a shop shoe"],"answer":0,"explain":"Danh từ làm tính từ đứng **trước** và ở dạng **số ít**: shoe shop.","src":"tr. 75"}],"hook":{"icon":"🎬","text":"Một bộ phim dở làm bạn buồn ngủ. Bộ phim là **thủ phạm** gây chán → bộ phim **boring**. Bạn là **nạn nhân** cảm thấy chán → bạn **bored**. Chỉ cần hỏi 'ai gây ra, ai chịu?' là không bao giờ nhầm -ing và -ed."},"diagram":{"type":"flow","title":"-ing hay -ed?","start":{"q":"Tính từ tả cái gì?","branches":[{"label":"Cái gây ra cảm xúc","to":{"result":"-ing: The film is boring.","icon":"🎬"}},{"label":"Người cảm thấy","to":{"result":"-ed: I am bored.","icon":"😴"}}]}},"chunks":[{"title":"Tính từ ghép","icon":"🧩","rule":"Tính từ **ghép** là 2 từ trở lên ghép lại, dùng như **một** tính từ; thường có **gạch nối** (well-known) hoặc viết liền (seasick).","explain":"Tính từ đơn chỉ có một từ (good, sad). Tính từ ghép gộp nhiều từ thành một khối để tả gọn: thay vì 'một nhà văn được biết đến nhiều' → a **well-known** writer. Sách nêu 7 cách ghép (xem bảng). Bạn không cần thuộc tên 7 kiểu — chỉ cần nhận ra khối có gạch nối là **một** tính từ.","diagram":{"type":"table","title":"7 cách tạo tính từ ghép","head":["Cấu tạo","Ví dụ"],"rows":[["danh từ + tính từ","seasick, blood-red"],["tính từ + danh từ","long-distance, second-rate"],["danh từ + phân từ","man-made, time-consuming"],["tính từ + phân từ","ready-made, easygoing"],["trạng từ + phân từ","well-known, hard-working"],["tính từ + tính từ","white-hot"],["tính từ + danh từ + -ed","long-sighted, good-humored"]]},"examples":[{"en":"He is a **hard-working** student.","vi":"Cậu ấy là một học sinh chăm chỉ."},{"en":"Plastic is a **man-made** material.","vi":"Nhựa là vật liệu nhân tạo."},{"en":"This job is very **time-consuming**.","vi":"Công việc này rất tốn thời gian."},{"en":"My mother is **easygoing**.","vi":"Mẹ tôi rất dễ tính."}],"tip":"Gạch nối = sợi dây buộc nhiều từ thành **một** tính từ.","src":"tr. 73–74"},{"title":"-ing hay -ed?","icon":"🎭","rule":"Tính từ **-ing** tả cái **gây ra** cảm xúc; tính từ **-ed** tả **người cảm thấy** cảm xúc đó.","explain":"Hiện tại phân từ (-ing) và quá khứ phân từ (-ed hoặc cột 3 động từ bất quy tắc) đều dùng được như tính từ, trước danh từ hoặc sau be/look/feel. **-ing** mang nghĩa chủ động (nó làm người khác chán, thích, mệt…); **-ed** mang nghĩa bị động (người bị tác động nên thấy chán, thích, mệt…). Tiếng Việt chỉ có một chữ 'chán', nên người Việt hay nói nhầm 'I am boring'.\nLưu ý: vài cụm như **a fallen leaf** (chiếc lá đã rụng) dùng V3 nhưng nghĩa chủ động.","formula":"Vật/việc gây cảm xúc + is + V-ing\nNgười + feels/is + V-ed","examples":[{"en":"My job is **boring**. I am **bored**.","vi":"Công việc của tôi chán. Tôi thấy chán."},{"en":"The news was **surprising**. We were all **surprised**.","vi":"Tin đó thật bất ngờ. Ai cũng ngạc nhiên."},{"en":"I'm **interested** in English.","vi":"Tôi thích (quan tâm tới) tiếng Anh."},{"en":"I'm very interesting in English.","ok":false,"note":"người cảm thấy → interested"}],"mistake":{"wrong":"The trip was long. I was very tiring.","right":"The trip was long. I was very tired.","why":"**Tôi cảm thấy** mệt → tired. 'I was tiring' = tôi làm người khác mệt."},"tip":"Hỏi: **ai gây ra** → -ing; **ai chịu** → -ed.","src":"tr. 74–75","check":{"type":"mcq","q":"The football match was very ___.","options":["exciting","excited"],"answer":0,"explain":"Trận đấu là cái **gây ra** sự phấn khích → **exciting**. excited dùng cho người: The fans were excited.","src":"tự soạn"}},{"title":"Danh từ dùng như tính từ","icon":"👟","rule":"Danh từ đứng **trước** danh từ khác để bổ nghĩa thì luôn ở **số ít**; nếu có **con số** thì nối bằng **gạch nối** và **không thêm -s**.","explain":"Tiếng Việt nói 'cửa hàng **giày**', 'súp **rau**' — từ bổ nghĩa đứng sau. Tiếng Anh đảo lại: **shoe** shop, **vegetable** soup, và từ đứng trước không thêm -s dù ý là nhiều đôi giày.\nCó con số: 'chuyến đi kéo dài 5 tuần' → a **five-week** tour; 'con trai 5 tuổi' → a **five-year-old** son. Cả khối số + danh từ là một tính từ nên không có -s, kể cả khi danh từ chính là số nhiều: two **ten-page** reports.","formula":"N (số ít) + N: a shoe shop\nsố-N (số ít, gạch nối) + N: a ten-page report","examples":[{"en":"There is a **shoe** shop near my house.","vi":"Gần nhà tôi có một cửa hàng giày."},{"en":"We went on a **five-week** tour.","vi":"Chúng tôi đi một chuyến du lịch năm tuần."},{"en":"She wrote two **ten-page** reports.","vi":"Cô ấy viết hai bản báo cáo dài mười trang."},{"en":"I have a **five-year-old** son.","vi":"Tôi có một cậu con trai năm tuổi."},{"en":"a five-weeks tour","ok":false,"note":"không thêm -s: five-week"}],"mistake":{"wrong":"My son is a five-years-old boy.","right":"My son is a five-year-old boy.","why":"Khối có gạch nối là tính từ → year không thêm -s. (Nhưng nói 'He is five **years** old' thì có -s.)"},"tip":"Có **gạch nối** thì **cấm s**.","src":"tr. 75–76"}],"practice":[{"type":"mcq","q":"The lesson was really ___. I learned a lot.","options":["interesting","interested"],"answer":0,"explain":"Bài học là cái **gây ra** hứng thú → **interesting**. interested dùng cho người cảm thấy thích.","src":"tự soạn"},{"type":"mcq","q":"She was ___ when she heard the news.","options":["surprised","surprising"],"answer":0,"explain":"Cô ấy là **người cảm thấy** ngạc nhiên → **surprised**.","src":"tự soạn"},{"type":"classify","q":"Mỗi từ mô tả cái gì?","buckets":["Cái gây ra cảm xúc","Người cảm thấy"],"items":[{"text":"boring","bucket":0},{"text":"bored","bucket":1},{"text":"exciting","bucket":0},{"text":"excited","bucket":1},{"text":"tiring","bucket":0},{"text":"tired","bucket":1}],"explain":"-ing tả cái gây ra cảm xúc; -ed tả người cảm thấy.","src":"tr. 74–75"},{"type":"mcq","q":"'Trạm xe buýt' tiếng Anh là:","options":["a bus stop","a buses stop","a stop bus"],"answer":0,"explain":"Danh từ bổ nghĩa (bus) đứng **trước** và ở **số ít**: a bus stop.","src":"tự soạn"},{"type":"mcq","q":"Từ nào là tính từ ghép?","options":["well-known","beautiful","happy"],"answer":0,"explain":"**well-known** ghép từ well + known (trạng từ + phân từ). beautiful, happy là tính từ đơn.","src":"tr. 73–74"},{"type":"fill","q":"I'm very ___ in music. (interest)","answer":["interested"],"explain":"Tôi là **người cảm thấy** thích → interest**ed**.","src":"tự soạn"},{"type":"fill","q":"A trip that lasts three days is a ___ trip.","answer":["three-day","3-day"],"hint":"số-danh từ, có gạch nối","explain":"Số + danh từ làm tính từ → gạch nối, **không -s**: a three-day trip.","src":"tr. 75"},{"type":"fill","q":"My daughter is six years old. I have a ___ daughter.","answer":["six-year-old","6-year-old"],"explain":"Đứng trước danh từ thì thành khối tính từ có gạch nối, year không có -s: a six-year-old daughter.","src":"tr. 76"},{"type":"fix","wrong":"The movie was so long that I felt boring.","answer":["The movie was so long that I felt bored."],"explain":"**Tôi cảm thấy** chán → bored. 'I felt boring' sai nghĩa.","src":"tự soạn"},{"type":"fix","wrong":"She wrote two ten-pages reports.","answer":["She wrote two ten-page reports."],"explain":"Khối số + danh từ có gạch nối là tính từ → page không thêm -s, dù reports là số nhiều.","src":"tr. 75"},{"type":"fix","wrong":"There is a new shoes shop near my office.","answer":["There is a new shoe shop near my office."],"explain":"Danh từ làm tính từ luôn ở số ít: shoe shop, không shoes shop.","src":"tr. 75"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["It","was","a","very","tiring","day."],"explain":"Ngày hôm đó là cái **gây ra** mệt mỏi → tiring; tính từ đứng trước danh từ day.","src":"tự soạn"}],"flashcards":[{"front":"boring hay bored: 'Tôi thấy chán'?","back":"I am **bored** (-ed = người cảm thấy). The film is **boring** (-ing = cái gây ra)."},{"front":"'Cửa hàng giày' — shoe shop hay shoes shop?","back":"**shoe shop** — danh từ làm tính từ luôn số ít."},{"front":"'Chuyến đi 5 tuần' viết thế nào?","back":"a **five-week** tour (gạch nối, không -s)"},{"front":"'Con trai 5 tuổi' đặt trước danh từ?","back":"a **five-year-old** son (nhưng: He is five **years** old)"},{"front":"Tính từ ghép là gì? Ví dụ?","back":"2+ từ dùng như **một** tính từ, thường có gạch nối: **well-known, man-made, hard-working**"}]},{"id":"03c","title":"Vị trí và trật tự tính từ","minutes":25,"goal":"Đặt tính từ đúng chỗ (trước danh từ, sau hệ từ, sau something/đo lường/tân ngữ), tránh các tính từ 'kén chỗ' (asleep, afraid, main) và xếp nhiều tính từ đúng trật tự.","pretest":[{"type":"mcq","q":"Chọn cụm đúng:","options":["a big red ball","a red big ball"],"answer":0,"explain":"Kích thước (big) đứng trước màu sắc (red).","src":"tr. 78"},{"type":"mcq","q":"Chọn câu đúng:","options":["I want to tell you something important.","I want to tell you important something."],"answer":0,"explain":"Tính từ đứng **sau** something, anything, nothing…","src":"tr. 77"},{"type":"mcq","q":"Chọn câu đúng:","options":["Look at the sleeping baby.","Look at the asleep baby."],"answer":0,"explain":"asleep chỉ đứng sau hệ từ (The baby is asleep). Trước danh từ phải đổi thành **sleeping**.","src":"tr. 76"}],"hook":{"icon":"🚂","text":"Tiếng Việt nói 'ngôi nhà **gỗ cũ đẹp**' — tính từ xếp hàng **sau** danh từ. Tiếng Anh đảo cả đoàn tàu lên **trước**: a **beautiful old wooden** house. Bài này dạy bạn toa nào đứng trước, toa nào đứng sau, và vài chỗ tính từ phải đứng sau danh từ."},"diagram":{"type":"flow","title":"Đặt tính từ ở đâu?","start":{"q":"Tính từ đi với gì?","branches":[{"label":"Danh từ thường","to":{"result":"Trước danh từ: a new car","icon":"🚗"}},{"label":"Hệ từ be, look, feel…","to":{"result":"Sau hệ từ: You look tired.","icon":"😪"}},{"label":"something, anyone…","to":{"result":"Sau: something new","icon":"🎁"}},{"label":"Số + đơn vị đo","to":{"result":"Sau: two meters long","icon":"📏"}}]}},"chunks":[{"title":"Trước danh từ hoặc sau hệ từ","icon":"📍","rule":"Tính từ đứng **trước danh từ** (a **new** phone) hoặc **sau hệ từ** be, seem, look, become, get, feel, sound, taste, smell, appear (The soup **tastes good**).","explain":"Tiếng Việt: 'điện thoại **mới**' — tính từ sau danh từ. Tiếng Anh: a **new** phone — tính từ trước danh từ (gọi là tính từ thuộc ngữ). Khi tính từ đứng sau động từ để tả chủ ngữ (vị ngữ), động từ đó là **hệ từ** (linking verb) — động từ nối chủ ngữ với tính từ: be, look (trông), feel (cảm thấy), taste (có vị), sound (nghe có vẻ)…","formula":"a/the/my + tính từ + danh từ\nchủ ngữ + hệ từ + tính từ","examples":[{"en":"She has a **new** phone.","vi":"Cô ấy có một chiếc điện thoại mới."},{"en":"You **look tired**.","vi":"Trông bạn có vẻ mệt."},{"en":"This soup **tastes good**.","vi":"Món súp này ngon."},{"en":"She has a phone new.","ok":false,"note":"dịch theo trật tự tiếng Việt"}],"mistake":{"wrong":"I bought a shirt white.","right":"I bought a white shirt.","why":"Tính từ đứng **trước** danh từ, ngược với tiếng Việt 'áo trắng'."},"tip":"Tiếng Anh: tính từ **đi trước dẫn đường** cho danh từ.","src":"tr. 73, 76"},{"title":"Tính từ 'kén chỗ'","icon":"🪑","rule":"Một số tính từ **chỉ đứng sau hệ từ** (asleep, afraid, alone, alive, awake, ill…); một số **chỉ đứng trước danh từ** (main, only, former, elder, indoor, outdoor…).","explain":"Phần lớn tính từ đứng được cả hai chỗ, nhưng có hai nhóm kén chỗ:\n• Chỉ sau hệ từ: các tính từ bắt đầu bằng **a-** (asleep, afraid, alike, awake, alone, alive, ashamed, aware…) và ill, well, glad, upset, unable, content, fine, exempt. Muốn đặt trước danh từ thì **đổi từ**: asleep → **sleeping**, afraid → **frightened**, ill → **sick**.\n• Chỉ trước danh từ: main, chief, only, former, elder, eldest, indoor, outdoor, upper, outer.","examples":[{"en":"The baby is **asleep**. → a **sleeping** baby","vi":"Em bé đang ngủ. → một em bé đang ngủ"},{"en":"The kids were **afraid**. → two **frightened** children","vi":"Bọn trẻ sợ. → hai đứa trẻ hoảng sợ"},{"en":"This is the **main** reason.","vi":"Đây là lý do chính."},{"en":"an asleep baby","ok":false,"note":"asleep không đứng trước danh từ"},{"en":"The reason is main.","ok":false,"note":"main chỉ đứng trước danh từ"}],"mistake":{"wrong":"There are many ill people in the hospital.","right":"There are many sick people in the hospital.","why":"ill thường chỉ đứng sau hệ từ (She looked ill); trước danh từ dùng **sick**."},"tip":"Chữ **a-** ở đầu (asleep, afraid, alone) → đứng **sau** hệ từ.","src":"tr. 76–77","check":{"type":"classify","q":"Xếp mỗi tính từ vào đúng chỗ của nó:","buckets":["Chỉ trước danh từ","Chỉ sau hệ từ"],"items":[{"text":"main","bucket":0},{"text":"asleep","bucket":1},{"text":"only","bucket":0},{"text":"afraid","bucket":1},{"text":"former","bucket":0},{"text":"alone","bucket":1}],"explain":"main, only, former chỉ đứng trước danh từ; asleep, afraid, alone (bắt đầu bằng a-) chỉ đứng sau hệ từ.","src":"tr. 76"}},{"title":"Tính từ đứng sau danh từ / tân ngữ","icon":"🔁","rule":"Tính từ đứng **sau** khi đi với **something/anyone/nothing…**, trong **cụm đo lường** (two meters long) và trong mẫu **động từ + tân ngữ + tính từ** (make me happy).","explain":"Ba trường hợp hay gặp:\n• Đại từ bất định: something **important**, anyone **interesting**, nothing **new**.\n• Đo lường: two meters **long**, six years **old**.\n• Động từ + tân ngữ (người/vật chịu tác động) + tính từ: make sb **angry**, paint the kitchen **yellow**, keep the room **clean**.\nSách còn nêu: hai tính từ nối bằng and/but (a writer both witty and wise) và một số tính từ -able/-ible (the only solution possible).","formula":"something / anyone / nothing + tính từ\nsố + đơn vị + tính từ\nđộng từ + tân ngữ + tính từ","examples":[{"en":"I have **something important** to tell you.","vi":"Tôi có chuyện quan trọng muốn nói với bạn."},{"en":"The table is two meters **long**.","vi":"Cái bàn dài hai mét."},{"en":"The students **made their teacher angry**.","vi":"Học sinh làm thầy giáo nổi giận."},{"en":"We should **keep our room clean**.","vi":"Chúng ta nên giữ phòng sạch sẽ."},{"en":"Is there new anything?","ok":false,"note":"→ anything new"}],"mistake":{"wrong":"I want to eat delicious something.","right":"I want to eat something delicious.","why":"Tính từ đứng **sau** something/anything/nothing."},"tip":"**Some-thing** đã 'chiếm chỗ' danh từ, nên tính từ phải xếp **sau**.","src":"tr. 77–78"},{"title":"Trật tự nhiều tính từ","icon":"🔢","rule":"Tính từ **ý kiến** (nice, beautiful) đứng **trước** tính từ **miêu tả** (big, old, red, wooden); các tính từ miêu tả thường theo thứ tự: kích thước → tuổi → hình dạng → màu → xuất xứ → chất liệu → mục đích.","explain":"Ý kiến là cảm nghĩ riêng của người nói, nên nói trước; thông tin khách quan (to nhỏ, màu, chất liệu…) nói sau. Bảng của sách có 12 nhóm (xem bảng). Sách nói rõ đây là trật tự **thường gặp**, không phải luôn luôn.\nLưu ý thêm (tr. 79):\n• Số thứ tự trước số đếm: **the first two** days (không the two first days).\n• Hai màu nối bằng **and**: a black **and** white dress.\n• Kích thước/chiều dài trước hình dáng/chiều rộng: a long narrow street.","diagram":{"type":"table","title":"Trật tự tính từ (tr. 78)","head":["#","Nhóm","Ví dụ"],"rows":[["1","Từ hạn định","a, the, my, this"],["2","Số đếm","one, two, ten"],["3","Ý kiến","nice, lovely, beautiful"],["4","Kích thước","big, small, tall"],["5","Phẩm chất","quiet, famous, modern"],["6","Tuổi","new, old, young"],["7","Hình dạng","round, oval"],["8","Màu sắc","red, black"],["9","Xuất xứ","Japanese, Chinese"],["10","Chất liệu","wooden, plastic, leather"],["11","Loại","electric (kettle)"],["12","Mục đích","riding (boots), bread (knife)"]]},"examples":[{"en":"She lives in a **nice new** house.","vi":"Cô ấy sống trong một ngôi nhà mới xinh xắn."},{"en":"There is a **beautiful large round wooden** table in the kitchen.","vi":"Trong bếp có một cái bàn gỗ tròn, to và đẹp."},{"en":"We spent **the first two** days in Hanoi.","vi":"Chúng tôi ở Hà Nội hai ngày đầu tiên."},{"en":"a red big ball","ok":false,"note":"kích thước trước màu: a big red ball"}],"mistake":{"wrong":"She has a wooden old house.","right":"She has an old wooden house.","why":"Tuổi (old) đứng trước chất liệu (wooden). Nhớ đổi a → an vì old bắt đầu bằng nguyên âm."},"tip":"Ý kiến trước, sự thật sau: **Đẹp → To → Cũ → Tròn → Đỏ → Nhật → Gỗ**.","src":"tr. 78–79","check":{"type":"mcq","q":"Chọn cụm đúng:","options":["a small black plastic bag","a black small plastic bag","a plastic small black bag"],"answer":0,"explain":"Kích thước (small) → màu (black) → chất liệu (plastic).","src":"tự soạn"}}],"practice":[{"type":"mcq","q":"Chọn câu đúng:","options":["I bought a new car.","I bought a car new."],"answer":0,"explain":"Tính từ đứng **trước** danh từ: a new car.","src":"tự soạn"},{"type":"classify","q":"Tính từ này đứng được ở đâu?","buckets":["Chỉ trước danh từ","Chỉ sau hệ từ"],"items":[{"text":"elder","bucket":0},{"text":"awake","bucket":1},{"text":"chief","bucket":0},{"text":"alive","bucket":1},{"text":"indoor","bucket":0},{"text":"ashamed","bucket":1}],"explain":"elder, chief, indoor chỉ đứng trước danh từ; awake, alive, ashamed (bắt đầu bằng a-) chỉ đứng sau hệ từ.","src":"tr. 76"},{"type":"mcq","q":"Chọn câu đúng:","options":["The two frightened children cried.","The two afraid children cried."],"answer":0,"explain":"afraid chỉ đứng sau hệ từ (The children were afraid). Trước danh từ dùng **frightened**.","src":"tr. 77"},{"type":"mcq","q":"Is there ___ in the newspaper today?","options":["anything interesting","interesting anything"],"answer":0,"explain":"Tính từ đứng **sau** anything/something/nothing.","src":"tr. 77"},{"type":"mcq","q":"She has ___ hair.","options":["long black","black long"],"answer":0,"explain":"Kích thước/chiều dài (long) đứng trước màu sắc (black).","src":"tự soạn"},{"type":"fix","wrong":"My grandmother lives in a wooden old house.","answer":["My grandmother lives in an old wooden house."],"explain":"Tuổi (old) trước chất liệu (wooden); và a → an trước old.","src":"tự soạn"},{"type":"fix","wrong":"I want to eat delicious something.","answer":["I want to eat something delicious."],"explain":"Tính từ đứng sau something.","src":"tr. 77"},{"type":"fix","wrong":"Don't wake the asleep baby.","answer":["Don't wake the sleeping baby.","Do not wake the sleeping baby."],"explain":"asleep không đứng trước danh từ → đổi thành sleeping.","src":"tr. 76"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["The","news","made","everyone","happy."],"explain":"Động từ + tân ngữ + tính từ: made everyone happy.","src":"tr. 77–78"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["She","bought","a","beautiful","small","Italian","bag."],"explain":"Ý kiến (beautiful) → kích thước (small) → xuất xứ (Italian).","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["We","spent","the","first","two","days","in","Hanoi."],"explain":"Số thứ tự (first) đứng trước số đếm (two): the first two days.","src":"tr. 79"}],"flashcards":[{"front":"something + tính từ: đặt tính từ ở đâu?","back":"**Sau**: something **important**, anything **new**"},{"front":"'một em bé đang ngủ' — asleep baby?","back":"Không. **a sleeping baby** (asleep chỉ đứng sau hệ từ: The baby is asleep)"},{"front":"Kể 5 hệ từ (linking verbs)","back":"be, look, feel, seem, become, get, sound, taste, smell, appear: You **look tired**."},{"front":"Tính từ ý kiến hay miêu tả đứng trước?","back":"**Ý kiến** trước: a **nice new** house, a **beautiful large round wooden** table"},{"front":"the two first days hay the first two days?","back":"**the first two days** — số thứ tự trước số đếm"}]},{"id":"03d","title":"Tính từ dùng như danh từ","minutes":25,"goal":"Dùng the + tính từ để nói về một nhóm người (the poor, the rich, the French) với động từ số nhiều, và biết khi nào phải thêm danh từ.","pretest":[{"type":"mcq","q":"The rich ___ more money than they need.","options":["have","has"],"answer":0,"explain":"**the rich** = những người giàu → nghĩa **số nhiều** → have.","src":"tr. 79–80"},{"type":"mcq","q":"'Người nghèo' (nói chung) tiếng Anh là:","options":["the poor","the poors","poor"],"answer":0,"explain":"the + tính từ, **không thêm -s**: the poor.","src":"tr. 79"}],"hook":{"icon":"👥","text":"Tiếng Việt nói '**người** giàu', '**người** nghèo' — luôn có chữ 'người'. Tiếng Anh có lối tắt: chỉ cần **the + tính từ** là thành cả một nhóm người: **the rich**, **the poor**. Giống như chữ 'the' đã tự mang theo chữ 'people'."},"diagram":{"type":"flow","title":"Nói về nhóm người thế nào?","start":{"q":"Bạn nói về ai?","branches":[{"label":"Cả nhóm, nói chung","to":{"result":"the + adj + V số nhiều: The poor need help.","icon":"👥"}},{"label":"Một nhóm cụ thể","to":{"result":"the + adj + people: the old people in my street","icon":"🏘️"}},{"label":"Một người","to":{"result":"a/an + adj + N: a poor man","icon":"🧍"}}]}},"chunks":[{"title":"the + tính từ = một nhóm người","icon":"👥","rule":"**the + tính từ** chỉ một nhóm người trong xã hội (the poor, the rich, the blind, the unemployed); nó mang nghĩa **số nhiều** nên đi với **động từ số nhiều**.","explain":"Thường dùng cho nhóm người theo thể lực hay hoàn cảnh: the blind (người mù), the poor (người nghèo), the unemployed (người thất nghiệp), the young (người trẻ). Tính từ **không thêm -s** (không có 'the poors'), nhưng động từ và đại từ theo sau là số nhiều (are, have, their).","formula":"the + tính từ + động từ số nhiều\nthe poor = poor people","examples":[{"en":"**The unemployed are** losing their hope.","vi":"Những người thất nghiệp đang mất dần hy vọng."},{"en":"**The rich** should help **the poor**.","vi":"Người giàu nên giúp người nghèo."},{"en":"The poors need help.","ok":false,"note":"tính từ không thêm -s"},{"en":"The blind needs help.","ok":false,"note":"nghĩa số nhiều → need"}],"mistake":{"wrong":"The young is always busy.","right":"The young are always busy.","why":"the young = những người trẻ → số nhiều → are."},"tip":"**the + tính từ** = **the + tính từ + people** → luôn số nhiều.","src":"tr. 79–80","check":{"type":"mcq","q":"The blind ___ special books.","options":["use","uses"],"answer":0,"explain":"the blind = những người mù → số nhiều → use.","src":"tự soạn"}},{"title":"Quốc tịch và khái niệm trừu tượng","icon":"🌍","rule":"Tính từ quốc tịch tận cùng **-sh / -ch** (English, French, Irish, Spanish, Dutch…) dùng sau **the** để chỉ cả dân tộc, cũng mang nghĩa **số nhiều**.","explain":"the French = người Pháp (nói chung), the English = người Anh. Giống the poor: không thêm -s, động từ số nhiều.\nNgoài nhóm người, the + tính từ đôi khi chỉ một **khái niệm trừu tượng**: the good (cái thiện), the beautiful (cái đẹp), the supernatural (điều siêu nhiên).","formula":"the + English / French / Irish / Spanish / Dutch… + V số nhiều","examples":[{"en":"**The French are** famous for their food.","vi":"Người Pháp nổi tiếng về ẩm thực."},{"en":"**The Irish are** very proud of their sense of humour.","vi":"Người Ireland rất tự hào về khiếu hài hước của họ."},{"en":"She loves **the beautiful** in art.","vi":"Cô ấy yêu cái đẹp trong nghệ thuật."},{"en":"The English drinks a lot of tea.","ok":false,"note":"the English = người Anh → drink"}],"tip":"Đuôi **-sh/-ch** + the = cả một dân tộc.","src":"tr. 80"},{"title":"Khi nào phải thêm danh từ?","icon":"⚠️","rule":"**the + tính từ** chỉ dùng cho nhóm người **nói chung**; nói một **nhóm cụ thể** hay **một người** thì phải **thêm danh từ** (the young **people** in my village, a poor **man**).","explain":"Một số giới hạn của the + tính từ:\n• Nhóm cụ thể → thêm danh từ: the old people in my street.\n• Không dùng sở hữu cách 's: **the problems of the poor** (không the poor's problems).\n• Vài cụm trang trọng cố định lại mang nghĩa số ít: the accused (bị cáo), the deceased (người đã khuất), the former / the latter (cái trước / cái sau).\n• Có thể bỏ the trong cặp với and/or: both rich and poor.","examples":[{"en":"**The young people** in my village are moving to the city.","vi":"Những người trẻ ở làng tôi đang chuyển lên thành phố."},{"en":"We should listen to **the problems of the poor**.","vi":"Chúng ta nên lắng nghe những vấn đề của người nghèo."},{"en":"**The accused was** released on bail.","vi":"Bị cáo đã được tại ngoại."},{"en":"The poor's problems are serious.","ok":false,"note":"không dùng 's → the problems of the poor"}],"mistake":{"wrong":"A poor came to my house.","right":"A poor man came to my house.","why":"the + tính từ chỉ nhóm người nói chung; nói **một người** thì phải có danh từ."},"tip":"Chung chung → the poor. Cụ thể hay một người → thêm **people / man / woman**.","src":"tr. 80–81"}],"practice":[{"type":"mcq","q":"'Người giàu' (nói chung) tiếng Anh là:","options":["the rich","the riches","rich"],"answer":0,"explain":"the + tính từ, không thêm -s. (riches là danh từ khác, nghĩa là 'của cải'.)","src":"tự soạn"},{"type":"mcq","q":"The unemployed ___ looking for jobs.","options":["are","is"],"answer":0,"explain":"the unemployed = những người thất nghiệp → số nhiều → are.","src":"tr. 80"},{"type":"classify","q":"Trường hợp nào dùng được 'the + tính từ', trường hợp nào phải thêm danh từ?","buckets":["the + tính từ","Phải thêm danh từ"],"items":[{"text":"người nghèo nói chung","bucket":0},{"text":"những người trẻ ở làng tôi","bucket":1},{"text":"người mù nói chung","bucket":0},{"text":"một người giàu","bucket":1},{"text":"người Pháp nói chung","bucket":0},{"text":"hai cụ già hàng xóm","bucket":1}],"explain":"the + tính từ chỉ dùng cho nhóm người **nói chung**. Nhóm cụ thể hoặc một người → thêm danh từ (people, man…).","src":"tr. 80"},{"type":"fill","q":"The young ___ always in a hurry. (be)","answer":["are"],"explain":"the young = những người trẻ → số nhiều → are.","src":"tự soạn"},{"type":"fill","q":"___ are proud of their sense of humour. (người Ireland)","answer":["The Irish"],"explain":"Quốc tịch tận cùng -sh: the Irish = người Ireland nói chung.","src":"tr. 80"},{"type":"fill","q":"We should listen to the problems of ___. (người nghèo)","answer":["the poor"],"explain":"the poor = người nghèo; không dùng 's mà dùng **of the poor**.","src":"tr. 81"},{"type":"fix","wrong":"The rich is getting richer.","answer":["The rich are getting richer."],"explain":"the rich mang nghĩa số nhiều → are.","src":"tự soạn"},{"type":"fix","wrong":"The poor's problems are serious.","answer":["The problems of the poor are serious."],"explain":"the + tính từ không dùng 's → the problems of the poor.","src":"tr. 81"},{"type":"fix","wrong":"The old in my street are very kind.","answer":["The old people in my street are very kind."],"explain":"Nhóm **cụ thể** (ở phố tôi) → phải thêm danh từ: the old people.","src":"tr. 80"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["The","French","are","famous","for","their","food."],"explain":"the French = người Pháp → động từ số nhiều are, đại từ their.","src":"tự soạn"}],"flashcards":[{"front":"the poor + is hay are?","back":"**are** — the + tính từ chỉ nhóm người, nghĩa số nhiều: The poor **are**…"},{"front":"'Người Pháp' nói chung?","back":"**the French** (+ động từ số nhiều): The French are…"},{"front":"the poor's problems đúng không?","back":"Không. **the problems of the poor**"},{"front":"'Những người già ở phố tôi' — the old in my street?","back":"Không. Nhóm cụ thể → **the old people** in my street"}]}],"quiz":{"pass":0.8,"questions":[{"type":"mcq","q":"I'll see you ___ weekend. (cuối tuần này)","options":["this","that","these"],"answer":0,"explain":"Thời gian hiện tại/sắp tới + số ít → **this** weekend. that weekend = cuối tuần hôm đó (đã qua).","src":"tr. 66"},{"type":"mcq","q":"There are two chairs. This chair is broken, so sit on ___ chair.","options":["the other","another","other"],"answer":0,"explain":"Có **hai** cái, cái **còn lại** → the other.","src":"tự soạn"},{"type":"fill","q":"The train leaves ___ thirty minutes. (each / every)","answer":["every"],"explain":"Tần suất → every.","src":"tr. 68"},{"type":"mcq","q":"We have ___ time before the film, so let's have a coffee.","options":["a little","little","a few"],"answer":0,"explain":"time không đếm được + nghĩa tích cực (đủ thời gian) → a little. a few chỉ đi với danh từ đếm được.","src":"tự soạn"},{"type":"mcq","q":"Lan and Minh both got it wrong. ___ answer is correct.","options":["Neither","Both","Either"],"answer":0,"explain":"Cả hai đều sai → không câu nào đúng → **Neither** + số ít. Both cần danh từ số nhiều.","src":"tự soạn"},{"type":"mcq","q":"Her speech was very ___. Everyone listened carefully.","options":["interesting","interested"],"answer":0,"explain":"Bài phát biểu **gây ra** hứng thú → interesting.","src":"tự soạn"},{"type":"fix","wrong":"I am very exciting about the trip.","answer":["I am very excited about the trip."],"explain":"Tôi là người **cảm thấy** háo hức → excited.","src":"tự soạn"},{"type":"fill","q":"A walk that takes ten minutes is a ___ walk.","answer":["ten-minute","10-minute"],"explain":"Số + danh từ làm tính từ: gạch nối, không -s → ten-minute.","src":"tr. 75"},{"type":"mcq","q":"Từ nào là tính từ ghép kiểu danh từ + phân từ?","options":["man-made","well-known","long-distance"],"answer":0,"explain":"man (danh từ) + made (phân từ). well-known = trạng từ + phân từ; long-distance = tính từ + danh từ.","src":"tr. 73–74"},{"type":"mcq","q":"Chọn cụm đúng:","options":["a beautiful round wooden table","a wooden beautiful round table","a round wooden beautiful table"],"answer":0,"explain":"Ý kiến (beautiful) → hình dạng (round) → chất liệu (wooden).","src":"tr. 78"},{"type":"fix","wrong":"I didn't buy new anything.","answer":["I didn't buy anything new.","I did not buy anything new."],"explain":"Tính từ đứng sau anything.","src":"tr. 77"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Please","keep","the","room","clean."],"explain":"Động từ + tân ngữ + tính từ: keep the room clean.","src":"tr. 78"},{"type":"mcq","q":"Câu nào SAI?","options":["She is an alone woman.","She lives alone.","The baby is awake."],"answer":0,"explain":"alone chỉ đứng sau động từ/hệ từ, không đứng trước danh từ. Hai câu còn lại đúng.","src":"tr. 76"},{"type":"fix","wrong":"She wore a black white dress.","answer":["She wore a black and white dress."],"explain":"Hai tính từ màu sắc nối bằng **and**: a black and white dress.","src":"tr. 79"},{"type":"mcq","q":"The young ___ always looking for something new.","options":["are","is"],"answer":0,"explain":"the young = những người trẻ → số nhiều → are.","src":"tự soạn"},{"type":"fix","wrong":"The Spanish is very friendly.","answer":["The Spanish are very friendly."],"explain":"the Spanish = người Tây Ban Nha nói chung → số nhiều → are.","src":"tr. 80"},{"type":"mcq","q":"Chọn câu đúng:","options":["The old people in my street are kind.","The old in my street are kind.","The olds in my street are kind."],"answer":0,"explain":"Nhóm **cụ thể** (ở phố tôi) → thêm danh từ people. the olds sai vì tính từ không thêm -s.","src":"tr. 80"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Life","is","hard","for","the","unemployed."],"explain":"the unemployed = người thất nghiệp; tính từ hard đứng sau hệ từ is.","src":"tự soạn"}]}},{"id":"04-trang-tu","title":"Trạng từ","en":"Adverbs","icon":"⚡","pages":"89–105","summary":"Trạng từ (adverb) cho biết hành động diễn ra **thế nào, khi nào, ở đâu, bao lâu một lần, đến mức nào**. Chủ đề này dạy bạn nhận ra các loại trạng từ, tạo trạng từ -ly đúng chính tả, đặt trạng từ đúng chỗ trong câu, và đọc hiểu câu đảo ngữ như Never have I… hay Here comes the bus.","mindmap":{"label":"Trạng từ","children":[{"label":"Các loại","icon":"🗂️","children":[{"label":"Cách thức: slowly, well"},{"label":"Thời gian, nơi chốn"},{"label":"Tần suất: always, often"},{"label":"Mức độ: very, enough"},{"label":"Nghi vấn, quan hệ: where, why"}]},{"label":"Chức năng","icon":"🎯","children":[{"label":"Bổ nghĩa động từ, tính từ"},{"label":"Trạng từ khác, cụm từ, cả câu"}]},{"label":"Vị trí","icon":"📍","children":[{"label":"Đầu câu: However, Last week"},{"label":"Giữa câu: She often cooks"},{"label":"Cuối câu: cách → nơi → tần → thời"}]},{"label":"Đảo ngữ","icon":"🔄","children":[{"label":"Đảo trợ ĐT: Never have I…"},{"label":"Đảo cả ĐT: Here comes the bus"}]}]},"lessons":[{"id":"04a","title":"Các loại trạng từ","minutes":25,"goal":"Gọi tên được các loại trạng từ theo câu hỏi chúng trả lời, tạo trạng từ -ly đúng chính tả, và không nhầm hard/hardly, late/lately, good/well.","pretest":[{"type":"mcq","q":"She sings ___.","options":["beautiful","beautifully"],"answer":1,"explain":"**beautifully** là trạng từ, bổ nghĩa cho động từ sings (hát thế nào?). beautiful là tính từ, chỉ đi với danh từ.","src":"tr. 89"},{"type":"mcq","q":"He is always busy. He works very ___.","options":["hard","hardly"],"answer":0,"explain":"**hard** vừa là tính từ vừa là trạng từ (= chăm chỉ). **hardly** lại có nghĩa khác hẳn: hầu như không.","src":"tr. 90"},{"type":"mcq","q":"Từ nào là **trạng từ**?","options":["friendly","quickly","lovely"],"answer":1,"explain":"friendly và lovely tận cùng -ly nhưng là **tính từ**. quickly = quick + ly là trạng từ.","src":"tr. 89–90"}],"hook":{"icon":"🎨","text":"Câu **I eat** (Tôi ăn) giống một bức ảnh đen trắng. Trạng từ tô màu cho nó: ăn **thế nào** (quickly), **khi nào** (yesterday), **ở đâu** (here), **bao lâu một lần** (often), **đến mức nào** (very). Trong tiếng Việt, 'nhanh' dùng y nguyên cho cả 'xe nhanh' lẫn 'chạy nhanh'. Tiếng Anh thì thường phải đổi: a **quick** car nhưng drive **quickly**."},"diagram":{"type":"mindmap","title":"Trạng từ trả lời câu hỏi gì?","root":{"label":"Trạng từ","children":[{"label":"How? → cách thức","icon":"🛠️","children":[{"label":"slowly, well, hard"}]},{"label":"When? → thời gian","icon":"⏰","children":[{"label":"yesterday, now, soon"}]},{"label":"Where? → nơi chốn","icon":"📍","children":[{"label":"here, outside, upstairs"}]},{"label":"How often? → tần suất","icon":"🔁","children":[{"label":"always, often, never"}]},{"label":"Đến mức nào? → mức độ","icon":"📶","children":[{"label":"very, quite, enough"}]},{"label":"Hỏi / nối câu","icon":"❓","children":[{"label":"where, when, why, how"}]}]}},"chunks":[{"title":"Trạng từ cách thức và đuôi -ly","icon":"🛠️","rule":"Trạng từ **cách thức** trả lời **How?** và thường = tính từ + **-ly**: slow → slowly.","explain":"Tiếng Việt nói 'xe chậm' và 'đi chậm' với cùng một chữ. Tiếng Anh tách ra: tính từ đi với danh từ (a slow car), trạng từ đi với động từ (drive slowly). Chính tả: tính từ tận cùng **-l** vẫn thêm -ly nên thành **-lly** (careful → carefully); tận cùng **-y** thì đổi y thành **i** (easy → easily). Bẫy: friendly, lonely, lovely, silly, ugly, likely, lively, cowardly tuy có -ly nhưng là **tính từ** và không tạo được trạng từ; muốn nói 'một cách thân thiện' thì dùng **in a friendly way**. Trạng từ cách thức thường đứng cuối câu.","formula":"tính từ + -ly → trạng từ (bad → badly)\n-l → -lly (careful → carefully)\n-y → -ily (easy → easily)\ntính từ -ly → in a … way","diagram":{"type":"flow","title":"Tạo trạng từ cách thức","start":{"q":"Tính từ đã tận cùng -ly? (friendly)","branches":[{"label":"Có","to":{"result":"in a friendly way","icon":"🙂"}},{"label":"Không","to":{"q":"Tận cùng -y? (easy)","branches":[{"label":"Có","to":{"result":"y → i + ly: easily","icon":"✏️"}},{"label":"Không","to":{"result":"+ ly: carefully, badly","icon":"➕"}}]}}]}},"examples":[{"en":"He drives **carefully**.","vi":"Anh ấy lái xe cẩn thận."},{"en":"She passed the test **easily**.","vi":"Cô ấy qua bài kiểm tra một cách dễ dàng."},{"en":"He smiled at me **in a friendly way**.","vi":"Anh ấy mỉm cười với tôi một cách thân thiện."},{"en":"He smiled at me friendlily.","ok":false,"note":"friendly là tính từ, không thêm -ly được"}],"mistake":{"wrong":"She sings beautiful.","right":"She sings beautifully.","why":"Bổ nghĩa cho động từ sings (hát thế nào?) phải dùng trạng từ."},"tip":"Hỏi 'làm **thế nào**?' sau động từ → cần trạng từ (-ly).","src":"tr. 89–90","check":{"type":"fill","q":"Please speak ___. The baby is sleeping. (quiet)","answer":["quietly"],"explain":"quiet + ly → **quietly**, bổ nghĩa cho động từ speak.","src":"tự soạn"}},{"title":"Trạng từ giống tính từ và cặp khác nghĩa","icon":"⚖️","rule":"Một số trạng từ **giống hệt tính từ** (hard, fast, late, early, long, high…); thêm -ly vào lại ra **từ khác nghĩa**: **hardly** = hầu như không, **lately** = gần đây.","explain":"hard, fast, early, long, late, deep, right, high, wrong, near, low, free, fine, straight vừa là tính từ vừa là trạng từ: a **fast** train (tàu nhanh) / The train was going **fast** (chạy nhanh). Không có 'fastly'. Cẩn thận với dạng -ly của chúng: nghĩa đã đổi hẳn (xem bảng). Riêng **good** có trạng từ là **well** (không có 'goodly'). Một số từ dùng được cả hai dạng: cheap(ly), quick(ly), slow(ly), direct(ly), fair(ly), tight(ly).","diagram":{"type":"table","title":"Không -ly và có -ly: khác nghĩa","head":["Trạng từ","Nghĩa","Dạng -ly","Nghĩa"],"rows":[["hard","chăm chỉ, mạnh","hardly","hầu như không"],["late","muộn","lately","gần đây"],["near","gần","nearly","gần như, suýt"],["high","cao","highly","rất (highly intelligent)"],["deep","sâu","deeply","rất, sâu sắc"],["free","miễn phí","freely","tự do, không giới hạn"]]},"examples":[{"en":"Ann works **hard**, while her brother **hardly** works.","vi":"Ann làm việc chăm chỉ, còn anh trai cô ấy hầu như chẳng làm gì."},{"en":"I **nearly** missed the bus.","vi":"Tôi suýt lỡ chuyến xe buýt."},{"en":"Have you been waiting **long**?","vi":"Bạn đợi lâu chưa?"},{"en":"He plays football very **well**.","vi":"Anh ấy đá bóng rất giỏi."},{"en":"He plays football very good.","ok":false,"note":"good là tính từ; trạng từ là well"}],"mistake":{"wrong":"I worked hardly yesterday.","right":"I worked hard yesterday.","why":"hardly = hầu như không. 'Chăm chỉ' là **hard**, không thêm -ly."},"tip":"hard-ly, near-ly, late-ly: thêm -ly là **đổi nghĩa**, không phải 'cho thành trạng từ'.","src":"tr. 90–91","check":{"type":"mcq","q":"I haven't seen him ___. Is he OK?","options":["late","lately"],"answer":1,"explain":"**lately** = gần đây (thường đi với thì hoàn thành). late = muộn, không hợp nghĩa.","src":"tr. 90"}},{"title":"Thời gian, nơi chốn, tần suất, mức độ","icon":"🧭","rule":"Gọi tên trạng từ bằng câu hỏi nó trả lời: **When?** thời gian, **Where?** nơi chốn, **How often?** tần suất, **đến mức nào?** mức độ.","explain":"Thời gian: yesterday, now, soon, already, last week. Nơi chốn: here, there, outside, upstairs. Tần suất: always, usually, often, sometimes, never; cụm every day, once a week. Mức độ: very, too, quite, rather, really, almost. Trạng từ mức độ đứng **trước** tính từ/trạng từ nó bổ nghĩa (very hot, quite slowly), riêng **enough** đứng **sau** (big enough). Tiếng Việt nói 'đủ lớn' (đủ đứng trước) nên người Việt hay viết sai 'enough big'.","formula":"very / too / quite + tính từ/trạng từ\ntính từ/trạng từ + enough","examples":[{"en":"I met her **yesterday**.","vi":"Tôi gặp cô ấy hôm qua."},{"en":"The children are playing **outside**.","vi":"Bọn trẻ đang chơi ngoài trời."},{"en":"She **often** drinks tea after lunch.","vi":"Cô ấy thường uống trà sau bữa trưa."},{"en":"This room is **big enough** for us.","vi":"Căn phòng này đủ rộng cho chúng ta."},{"en":"This room is enough big for us.","ok":false,"note":"enough đứng sau tính từ"}],"mistake":{"wrong":"He didn't run enough fast.","right":"He didn't run fast enough.","why":"enough là trạng từ mức độ duy nhất đứng **sau** từ nó bổ nghĩa."},"tip":"Enough đi **sau**: 'big enough' như 'lớn… đủ rồi'.","src":"tr. 91–94","check":{"type":"classify","q":"Xếp mỗi trạng từ vào đúng loại:","buckets":["Thời gian","Nơi chốn","Tần suất","Mức độ"],"items":[{"text":"yesterday","bucket":0},{"text":"upstairs","bucket":1},{"text":"usually","bucket":2},{"text":"very","bucket":3}],"explain":"yesterday trả lời When?, upstairs trả lời Where?, usually trả lời How often?, very cho biết mức độ.","src":"tr. 91–94"}},{"title":"Trạng từ nghi vấn và quan hệ","icon":"❓","rule":"**Where, when, why, how** đứng **đầu câu hỏi**; đứng **sau danh từ** chỉ thời gian, nơi chốn, lý do thì chúng nối thêm một mệnh đề: the day **when**…","explain":"Câu hỏi: Where do you live? How + be + người hỏi sức khỏe, tâm trạng (How are you?); How + be + vật nhờ mô tả, giống What … like? (How was the trip?); How + tính từ/trạng từ hỏi mức độ, kích thước, khoảng cách: how old, how long, how far, how often. **Why not…?** và **Why don't we/you…?** dùng để gợi ý. Khi nối câu (trạng từ quan hệ): the day **when** (ngày mà), the shop **where** (cửa hàng nơi mà), the reason **why** (lý do mà).","formula":"Where/When/Why/How + trợ ĐT + S + V?\nN thời gian + when / N nơi chốn + where / the reason + why","examples":[{"en":"**Where** do you live?","vi":"Bạn sống ở đâu?"},{"en":"**How** was your holiday?","vi":"Kỳ nghỉ của bạn thế nào?"},{"en":"**Why don't we** eat out tonight?","vi":"Tối nay mình đi ăn ngoài đi?"},{"en":"I remember the day **when** we first met.","vi":"Tôi nhớ ngày chúng ta gặp nhau lần đầu."},{"en":"This is the shop **where** I bought my phone.","vi":"Đây là cửa hàng nơi tôi mua điện thoại."}],"tip":"Đầu câu hỏi → nghi vấn. Ngay sau danh từ (day, shop, reason) → quan hệ.","src":"tr. 94–96","check":{"type":"mcq","q":"How ___ do you go to the gym? — Twice a week.","options":["often","long","far"],"answer":0,"explain":"Câu trả lời 'Twice a week' nói về tần suất → **How often**. How long hỏi thời gian kéo dài, How far hỏi khoảng cách.","src":"tr. 95"}}],"practice":[{"type":"mcq","q":"Từ nào là **trạng từ**?","options":["lovely","slowly","friendly","silly"],"answer":1,"explain":"lovely, friendly, silly tận cùng -ly nhưng là **tính từ**. slowly = slow + ly mới là trạng từ.","src":"tr. 89–90"},{"type":"classify","q":"Tính từ hay trạng từ?","buckets":["Tính từ","Trạng từ"],"items":[{"text":"careful","bucket":0},{"text":"carefully","bucket":1},{"text":"lonely","bucket":0},{"text":"easily","bucket":1},{"text":"ugly","bucket":0},{"text":"badly","bucket":1}],"explain":"lonely và ugly có -ly nhưng là tính từ (lonely = cô đơn, ugly = xấu). carefully, easily, badly là tính từ + -ly.","src":"tr. 89–90"},{"type":"mcq","q":"Ann never takes a break. She works ___.","options":["hard","hardly"],"answer":0,"explain":"Làm việc chăm chỉ → **hard**. hardly = hầu như không, ngược nghĩa.","src":"tr. 90"},{"type":"mcq","q":"I've been very busy ___.","options":["late","lately"],"answer":1,"explain":"**lately** = gần đây. late = muộn, không hợp nghĩa câu này.","src":"tr. 90"},{"type":"fill","q":"The test was easy. I passed it ___. (easy)","answer":["easily"],"hint":"-y → -ily","explain":"easy tận cùng -y → đổi y thành i + ly: **easily**.","src":"tr. 89"},{"type":"fill","q":"The road is wet. Drive ___! (careful)","answer":["carefully"],"hint":"-l → -lly","explain":"careful tận cùng -l, vẫn thêm -ly → **carefully** (hai chữ l).","src":"tr. 89"},{"type":"fill","q":"She is a good cook. She cooks very ___. (good)","answer":["well"],"explain":"Trạng từ của good là **well**. Không có 'goodly'.","src":"tr. 91"},{"type":"mcq","q":"How ___ is your son? — He's six.","options":["old","long","often"],"answer":0,"explain":"Hỏi tuổi → **How old**. How long hỏi độ dài/thời gian, How often hỏi tần suất.","src":"tr. 95"},{"type":"fix","wrong":"This bag is enough big for my laptop.","answer":["This bag is big enough for my laptop."],"explain":"**enough** đứng **sau** tính từ: big enough.","src":"tr. 94"},{"type":"fix","wrong":"He drives very careful.","answer":["He drives very carefully."],"explain":"Bổ nghĩa cho động từ drives (lái thế nào?) phải dùng trạng từ **carefully**.","src":"tự soạn"},{"type":"fix","wrong":"Don't act sillily.","answer":["Don't act in a silly way.","Do not act in a silly way."],"explain":"silly là tính từ tận cùng -ly, không tạo được trạng từ → dùng **in a silly way**.","src":"tr. 90"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","remember","the","day","when","we","met."],"explain":"**when** đứng ngay sau danh từ chỉ thời gian (the day) để nối thêm mệnh đề 'we met'.","src":"tr. 95"}],"flashcards":[{"front":"Trạng từ của **good**?","back":"**well**: She sings well. (không có goodly)"},{"front":"hard và hardly khác nhau thế nào?","back":"hard = chăm chỉ, mạnh; **hardly** = hầu như không. He hardly works."},{"front":"late và lately?","back":"late = muộn; **lately** = gần đây. I haven't seen him lately."},{"front":"friendly, silly thành trạng từ thế nào?","back":"Không thêm -ly được → **in a friendly way**, in a silly way."},{"front":"enough đứng trước hay sau tính từ?","back":"**Sau**: big enough, fast enough."},{"front":"easy, careful → trạng từ?","back":"easy → **easily** (y → i); careful → **carefully** (-lly)"}]},{"id":"04b","title":"Chức năng và vị trí của trạng từ","minutes":25,"goal":"Biết trạng từ bổ nghĩa cho những gì, đặt trạng từ đúng ở đầu, giữa hay cuối câu, và xếp đúng thứ tự khi nhiều trạng từ cùng đứng cuối câu.","pretest":[{"type":"mcq","q":"Chọn câu đúng:","options":["She drinks often coffee.","She often drinks coffee."],"answer":1,"explain":"Trạng từ tần suất đứng **trước động từ thường**: often drinks. Không chen giữa động từ và tân ngữ.","src":"tr. 96"},{"type":"mcq","q":"Chọn câu đúng:","options":["He speaks well English.","He speaks English well."],"answer":1,"explain":"Trạng từ không đứng giữa động từ (speaks) và tân ngữ (English).","src":"tr. 91"}],"hook":{"icon":"🪑","text":"Hãy coi câu như một dãy ghế với ba chỗ cho trạng từ: **đầu**, **giữa** và **cuối**. Mỗi loại trạng từ có ghế quen của nó. Có lúc tiếng Việt trùng tiếng Anh: 'Tôi **thường** uống trà' = I **often** drink tea. Nhưng với **be** thì khác: 'Cô ấy **luôn** đi muộn' = She **is always** late (always ngồi sau is)."},"diagram":{"type":"flow","title":"Trạng từ giữa câu (always, often…) đặt ở đâu?","start":{"q":"Câu có be hoặc trợ động từ?","branches":[{"label":"Không","to":{"result":"Trước ĐT thường: She often cooks.","icon":"👉"}},{"label":"Có","to":{"q":"Có từ 2 trợ động từ trở lên?","branches":[{"label":"Không","to":{"result":"Sau be/trợ ĐT: She is always late.","icon":"👈"}},{"label":"Có","to":{"result":"Sau trợ ĐT đầu: has probably been stolen","icon":"1️⃣"}}]}}]}},"chunks":[{"title":"Trạng từ bổ nghĩa cho những gì?","icon":"🎯","rule":"Trạng từ bổ nghĩa cho **động từ, tính từ, trạng từ khác, cụm từ** và cả **câu**.","explain":"Đây là điểm phân biệt với tính từ: tính từ đi với danh từ (a fast car), còn trạng từ đi với gần như mọi thứ khác. Trạng từ đứng đầu câu kèm dấu phẩy như **Luckily, …** (may mắn là) thì bổ nghĩa cho cả câu, nói lên cách người nói nhìn sự việc.","diagram":{"type":"mindmap","title":"5 chức năng của trạng từ","root":{"label":"Trạng từ bổ nghĩa cho","children":[{"label":"Động từ: drive fast"},{"label":"Tính từ: very hot"},{"label":"Trạng từ: quite slowly"},{"label":"Cụm từ: madly in love"},{"label":"Cả câu: Luckily, …"}]}},"examples":[{"en":"It's **very** hot today.","vi":"Hôm nay rất nóng."},{"en":"She speaks **quite** slowly.","vi":"Cô ấy nói khá chậm."},{"en":"They are **madly** in love.","vi":"Họ yêu nhau say đắm."},{"en":"**Luckily**, he passed the exam.","vi":"May mắn là anh ấy đã thi đỗ."}],"tip":"Từ được bổ nghĩa là **danh từ** → tính từ. Còn lại → trạng từ.","src":"tr. 96","check":{"
