type":"mcq","q":"Trong câu 'It is **really** cold today', really bổ nghĩa cho từ nào?","options":["is","cold","today"],"answer":1,"explain":"really (thật sự) cho biết lạnh đến mức nào → bổ nghĩa cho tính từ **cold**.","src":"tr. 96"}},{"title":"Vị trí giữa câu","icon":"↔️","rule":"Ở **giữa câu**, trạng từ đứng **trước động từ thường** nhưng **sau be / trợ động từ**.","explain":"Ghế giữa thuộc về trạng từ tần suất (always, often, never…), mức độ (almost, really, just…) và đôi khi cách thức. Có từ hai trợ động từ trở lên thì trạng từ thường đứng sau **trợ động từ đầu tiên** (has **probably** been stolen); riêng trạng từ cách thức đứng sau **tất cả** trợ động từ (has been **carefully** studied). **still** và **just** chỉ đứng ở ghế giữa. Hai lưu ý: muốn nhấn mạnh be/trợ động từ thì trạng từ lên trước nó (I **really am** sorry); và trạng từ **không chen** giữa động từ với tân ngữ.","formula":"S + trạng từ + động từ thường\nS + be / trợ ĐT + trạng từ + …\nS + trợ ĐT 1 + trạng từ + trợ ĐT 2 + V","examples":[{"en":"I **usually** get up at six.","vi":"Tôi thường dậy lúc sáu giờ."},{"en":"She is **always** late.","vi":"Cô ấy lúc nào cũng đến muộn."},{"en":"I am **still** waiting for him.","vi":"Tôi vẫn đang đợi anh ấy."},{"en":"My bike has **probably** been stolen.","vi":"Xe đạp của tôi chắc đã bị lấy cắp rồi."},{"en":"I like very much coffee.","ok":false,"note":"chen giữa động từ và tân ngữ"}],"mistake":{"wrong":"I like very much coffee.","right":"I like coffee very much.","why":"Trạng từ không đứng giữa động từ (like) và tân ngữ (coffee)."},"tip":"Động từ thường → trạng từ đứng **trước**. be / trợ động từ → trạng từ đứng **sau**.","src":"tr. 91, 93–97","check":{"type":"mcq","q":"Câu bình thường (không nhấn mạnh), chọn câu đúng:","options":["I never have been to Japan.","I have never been to Japan.","I have been never to Japan."],"answer":1,"explain":"have là trợ động từ → **never** đứng sau nó: have never been.","src":"tr. 96"}},{"title":"Vị trí đầu câu và cuối câu","icon":"🔚","rule":"**Cuối câu** là chỗ quen của trạng từ **cách thức, nơi chốn, thời gian**; **đầu câu** dành cho từ hỏi, từ nối (However, Then…) và trạng từ thời gian khi muốn nhấn mạnh.","explain":"Thời gian đứng đầu câu để nhấn mạnh hoặc chỉ sự trái ngược: **Last week** we had nothing to do. Với tần suất: usually, normally, often, sometimes, occasionally được lên đầu hoặc xuống cuối câu để nhấn mạnh; nhưng **always** và **never** thì không (ở vị trí bình thường). Cụm tần suất (every day, once a week) thường đứng đầu hoặc cuối câu.","examples":[{"en":"She did the job **quickly**.","vi":"Cô ấy làm việc đó rất nhanh."},{"en":"**Last week** we had nothing to do.","vi":"Tuần trước chúng tôi chẳng có việc gì làm."},{"en":"**Normally** I tip my hairdresser.","vi":"Bình thường tôi có cho thợ cắt tóc tiền boa."},{"en":"I go swimming **once a week**.","vi":"Tôi đi bơi mỗi tuần một lần."},{"en":"Always I tip my hairdresser.","ok":false,"note":"always không đứng đầu câu"}],"mistake":{"wrong":"I drink coffee always.","right":"I always drink coffee.","why":"always và never không đứng đầu hay cuối câu, chỉ ngồi ghế giữa."},"tip":"**Always** và **never**: không ngồi ghế đầu, không ngồi ghế cuối.","src":"tr. 91, 93, 96–97","check":{"type":"mcq","q":"Câu nào **sai**?","options":["Sometimes I cook dinner.","I cook dinner sometimes.","Always I cook dinner."],"answer":2,"explain":"sometimes được đứng đầu hoặc cuối câu; **always** thì không.","src":"tr. 93"}},{"title":"Nhiều trạng từ ở cuối câu","icon":"🚃","rule":"Nhiều trạng từ cùng đứng cuối câu: **cách thức → nơi chốn → tần suất → thời gian**.","explain":"Tiếng Việt cũng hay nói 'đi bộ chậm rãi quanh công viên sau bữa tối', khá giống tiếng Anh. Thêm một mẹo: trạng từ một chữ thường đứng trước cụm trạng từ dài (here at lunch-time). Ngoại lệ: bổ ngữ bắt buộc của động từ (như 'to Florida' sau traveled) đứng sát động từ.","diagram":{"type":"table","title":"Thứ tự cuối câu","head":["Cách thức","Nơi chốn","Tần suất","Thời gian"],"rows":[["slowly","round the park","—","after dinner"],["—","to Florida","twice","last year"],["hard","—","—","yesterday"]]},"examples":[{"en":"I worked **hard yesterday**.","vi":"Hôm qua tôi làm việc chăm chỉ."},{"en":"He walked **slowly round the park after dinner**.","vi":"Anh ấy đi bộ chậm rãi quanh công viên sau bữa tối."},{"en":"My parents traveled **to Florida twice last year**.","vi":"Năm ngoái bố mẹ tôi đi Florida hai lần."},{"en":"She came **here a few minutes ago**.","vi":"Cô ấy đến đây vài phút trước."},{"en":"I worked yesterday hard.","ok":false,"note":"cách thức phải đứng trước thời gian"}],"tip":"**C**ách → **N**ơi → **T**ần → **T**hời: 'Con Nai Thích Táo'.","src":"tr. 92, 98"}],"practice":[{"type":"mcq","q":"Trong câu '**Luckily**, nobody was hurt', Luckily bổ nghĩa cho:","options":["động từ hurt","danh từ nobody","cả câu"],"answer":2,"explain":"Luckily đứng đầu câu, có dấu phẩy, nói lên nhận xét của người nói về **cả sự việc**.","src":"tr. 96"},{"type":"classify","q":"Ở vị trí bình thường, trạng từ này hay đứng đâu?","buckets":["Giữa câu","Cuối câu"],"items":[{"text":"always","bucket":0},{"text":"never","bucket":0},{"text":"still","bucket":0},{"text":"carefully","bucket":1},{"text":"yesterday","bucket":1},{"text":"here","bucket":1}],"explain":"always, never, still ngồi ghế giữa. Cách thức (carefully), thời gian (yesterday), nơi chốn (here) thường ở cuối câu.","src":"tr. 91–93, 97"},{"type":"mcq","q":"Chọn câu đúng:","options":["We visit often our grandparents.","We often visit our grandparents.","Often visit we our grandparents."],"answer":1,"explain":"often đứng **trước động từ thường** visit, không chen giữa visit và tân ngữ.","src":"tr. 96–97"},{"type":"mcq","q":"Chọn câu đúng (trạng từ cách thức):","options":["The room has carefully been cleaned.","The room has been carefully cleaned."],"answer":1,"explain":"Trạng từ **cách thức** đứng sau **tất cả** trợ động từ: has been carefully cleaned.","src":"tr. 97"},{"type":"mcq","q":"Chọn câu có trật tự đúng:","options":["He walked after dinner slowly round the park.","He walked slowly round the park after dinner.","He walked round the park after dinner slowly."],"answer":1,"explain":"Cách thức (slowly) → nơi chốn (round the park) → thời gian (after dinner).","src":"tr. 98"},{"type":"fix","wrong":"She speaks very well English.","answer":["She speaks English very well."],"explain":"Không đặt trạng từ giữa động từ speaks và tân ngữ English → đưa very well ra cuối.","src":"tr. 91"},{"type":"fix","wrong":"I drink always tea in the morning.","answer":["I always drink tea in the morning."],"explain":"always đứng **trước động từ thường** drink.","src":"tr. 96"},{"type":"fix","wrong":"I worked yesterday hard.","answer":["I worked hard yesterday."],"explain":"Cách thức (hard) đứng trước thời gian (yesterday).","src":"tr. 98"},{"type":"fix","wrong":"Always I tip the waiter.","answer":["I always tip the waiter."],"explain":"always không đứng đầu câu; đặt nó trước động từ tip. Muốn đứng đầu thì dùng Normally/Usually.","src":"tr. 93"},{"type":"order","q":"Sắp xếp thành câu đúng (câu bình thường):","words":["She","is","never","late","for","work."],"explain":"never đứng **sau be** (is).","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["My","parents","traveled","to","Florida","twice","last","year."],"explain":"Nơi chốn (to Florida) → tần suất (twice) → thời gian (last year).","src":"tr. 98"}],"flashcards":[{"front":"Trạng từ tần suất + động từ thường: đứng đâu?","back":"**Trước** động từ: She often cooks."},{"front":"Trạng từ tần suất + be / trợ động từ: đứng đâu?","back":"**Sau** be/trợ ĐT: She is always late. I have never been there."},{"front":"Trạng từ có chen giữa động từ và tân ngữ không?","back":"**Không**: She speaks English well (không phải speaks well English)."},{"front":"Thứ tự nhiều trạng từ cuối câu?","back":"**Cách thức → nơi chốn → tần suất → thời gian**: walked slowly round the park after dinner."},{"front":"always / never có đứng đầu hay cuối câu không?","back":"Không. Normally I tip…, không phải Always I tip…"},{"front":"still và just đứng ở đâu?","back":"**Chỉ giữa câu**: I am still waiting. She has just left."}]},{"id":"04c","title":"Đảo động từ sau trạng từ","minutes":25,"goal":"Nhận ra và viết được câu đảo ngữ sau trạng từ phủ định/hạn định (Never, Rarely, Hardly … when, Only then, Not until) và câu đảo cả động từ sau Here, There, Down, Out.","pretest":[{"type":"mcq","q":"Chọn câu đúng:","options":["Never I have seen such a mess.","Never have I seen such a mess."],"answer":1,"explain":"Never đứng đầu câu → **đảo trợ động từ** have lên trước chủ ngữ I.","src":"tr. 98"},{"type":"mcq","q":"Chọn câu đúng:","options":["Here comes the bus!","Here the bus comes!"],"answer":0,"explain":"Here đứng đầu, chủ ngữ là danh từ (the bus) → động từ comes lên trước chủ ngữ.","src":"tr. 92"}],"hook":{"icon":"🔄","text":"Muốn nói thật mạnh trong tiếng Việt, ta đưa ý phủ định lên đầu: '**Chưa bao giờ** tôi thấy…'. Tiếng Anh cũng làm vậy, nhưng có thêm một cú **lật**: trợ động từ nhảy lên trước chủ ngữ, y như câu hỏi. I have never seen… → **Never have I** seen… Đây gọi là **đảo ngữ** (inversion): đổi chỗ động từ/trợ động từ với chủ ngữ."},"diagram":{"type":"flow","title":"Trạng từ đứng đầu câu → đảo kiểu gì?","start":{"q":"Trạng từ đầu câu là loại nào?","branches":[{"label":"Phủ định / Only / Not until","to":{"result":"Đảo trợ ĐT: Never have I seen…","icon":"🔁"}},{"label":"not far / not long","to":{"result":"Không đảo: Not long ago, I met her.","icon":"✋"}},{"label":"Nơi chốn / hướng (Here, Down…)","to":{"q":"Chủ ngữ là đại từ (it, he…)?","branches":[{"label":"Có","to":{"result":"Không đảo: Here it comes!","icon":"🙋"}},{"label":"Không","to":{"result":"Đảo cả ĐT: Here comes the bus!","icon":"🚌"}}]}}]}},"chunks":[{"title":"Đảo trợ động từ sau trạng từ phủ định","icon":"🚫","rule":"Trạng từ **phủ định** (Never, Rarely, Seldom, On no account…) đặt đầu câu để nhấn mạnh → **đảo trợ động từ** lên trước chủ ngữ, giống câu hỏi.","explain":"Các từ hay gặp: never, rarely, seldom, little, nowhere (else), at no time, in no way, under no circumstances, on no account. Nếu câu gốc không có trợ động từ thì mượn **do / does / did**, như khi đặt câu hỏi: My father never drinks… → **Never does** my father **drink**… (động từ trở về nguyên mẫu). Cũng đảo sau **So + tính từ/trạng từ** (So ridiculous did she look that…) và **Such + be + danh từ** (Such was the tale he told me).","formula":"Never / Rarely / Seldom + trợ ĐT + S + V\n(không có trợ ĐT → do / does / did + S + V nguyên mẫu)","examples":[{"en":"**Never does** my father drink coffee in the evening.","vi":"Bố tôi không bao giờ uống cà phê vào buổi tối."},{"en":"**Rarely have I** seen such a beautiful sunset.","vi":"Hiếm khi tôi được thấy hoàng hôn đẹp như vậy."},{"en":"**On no account must** this switch be touched.","vi":"Tuyệt đối không được chạm vào công tắc này."},{"en":"Never my father drinks coffee in the evening.","ok":false,"note":"thiếu đảo ngữ"}],"mistake":{"wrong":"Seldom I go to the cinema.","right":"Seldom do I go to the cinema.","why":"Seldom đầu câu → phải đảo; câu không có trợ ĐT nên mượn do."},"tip":"Biến phần sau thành **câu hỏi**: Do I go? → Seldom **do I go**.","src":"tr. 98–99","check":{"type":"fill","q":"She rarely eats meat. → Rarely ___ she eat meat.","answer":["does"],"explain":"Câu gốc thì hiện tại, chủ ngữ she, không có trợ ĐT → mượn **does**; eat trở về nguyên mẫu.","src":"tự soạn"}},{"title":"Hardly … when, No sooner … than, Only, Not until","icon":"⏱️","rule":"**Hardly/Scarcely … when**, **No sooner … than**, cụm **Only …** và **Not until …** ở đầu câu cũng kéo theo **đảo trợ động từ**.","explain":"Hardly … when và No sooner … than nghĩa là 'vừa mới … thì …'; trong ví dụ của sách, vế đầu dùng **had + V3**. Nhớ cặp: hardly đi với **when**, no sooner đi với **than**. Với **Only after / Only when / Only if** và **Not until / till**, phần đảo nằm ở **mệnh đề chính** (vế sau), không phải ngay sau Only when. Riêng cụm bắt đầu bằng **not far** và **not long** thì **không** đảo: Not long ago, I met her.","formula":"Hardly + had + S + V3 + when + S + V2\nNo sooner + had + S + V3 + than + S + V2\nOnly when / Not until + mệnh đề, + trợ ĐT + S + V","examples":[{"en":"**Hardly had she** sat down **when** the phone rang.","vi":"Cô ấy vừa mới ngồi xuống thì điện thoại reo."},{"en":"**No sooner had we** arrived **than** it started to rain.","vi":"Chúng tôi vừa đến nơi thì trời đổ mưa."},{"en":"**Only then did I** understand what she meant.","vi":"Chỉ đến lúc đó tôi mới hiểu ý cô ấy."},{"en":"Only when the last person had left **did she** sit down.","vi":"Chỉ khi người cuối cùng đã về, cô ấy mới ngồi xuống."},{"en":"Only when did the last person leave she sat down.","ok":false,"note":"đảo nhầm vế"}],"mistake":{"wrong":"Not until I got home I noticed the mistake.","right":"Not until I got home did I notice the mistake.","why":"Not until: đảo ở mệnh đề chính (vế sau) → did I notice."},"tip":"**Hardly – when**, **No sooner – than**. Only when / Not until: đảo ở **vế sau**.","src":"tr. 98–99","check":{"type":"mcq","q":"No sooner had he arrived ___ the meeting started.","options":["when","than","then"],"answer":1,"explain":"No sooner đi với **than** (sooner là dạng so sánh). Hardly mới đi với when.","src":"tr. 98–99"}},{"title":"Đảo cả động từ: Here comes the bus","icon":"🚌","rule":"Trạng từ **nơi chốn / phương hướng** (Here, There, Down, Out, Up, Off…) đầu câu → đưa **cả động từ** lên trước chủ ngữ, **không** mượn trợ động từ.","explain":"Kiểu đảo này hay gặp trong văn kể chuyện và lời nói hằng ngày: Here comes our bus! Down came the rain. Nhưng nếu chủ ngữ là **đại từ** (it, he, she, they) thì **không đảo**, đại từ đứng ngay sau here/there: Here **it comes**. Đừng mượn do/did ở đây: 'Out did go the lights' là sai.","formula":"Here / There / Down / Out + V + danh từ chủ ngữ\nHere / There + đại từ + V","examples":[{"en":"**Here comes** our bus!","vi":"Xe buýt của chúng ta tới kìa!"},{"en":"**Here it comes**!","vi":"Nó tới rồi kìa!"},{"en":"**Down came** the rain.","vi":"Mưa trút xuống."},{"en":"**Out went** the lights.","vi":"Đèn phụt tắt."},{"en":"Here comes it!","ok":false,"note":"chủ ngữ là đại từ thì không đảo"}],"mistake":{"wrong":"Here our bus comes!","right":"Here comes our bus!","why":"Chủ ngữ là danh từ (our bus) → động từ comes lên trước."},"tip":"Danh từ → đảo (Here comes **the bus**). Đại từ → giữ nguyên (Here **it** comes).","src":"tr. 92, 99","check":{"type":"mcq","q":"Chọn câu đúng:","options":["There goes he!","There he goes!"],"answer":1,"explain":"Chủ ngữ là đại từ **he** → không đảo: There he goes!","src":"tr. 92"}}],"practice":[{"type":"classify","q":"Câu nào đúng, câu nào sai?","buckets":["Đúng","Sai"],"items":[{"text":"Never have I seen him.","bucket":0},{"text":"Never I have seen him.","bucket":1},{"text":"Here comes the taxi.","bucket":0},{"text":"Here comes it.","bucket":1},{"text":"Here it comes.","bucket":0},{"text":"Seldom we eat out.","bucket":1}],"explain":"Sau Never/Seldom phải đảo trợ ĐT (Seldom do we eat out). Sau Here: danh từ thì đảo, đại từ thì không.","src":"tr. 92, 98"},{"type":"mcq","q":"Hardly had I closed the door ___ someone knocked.","options":["when","than","that"],"answer":0,"explain":"Hardly đi với **when**. than đi với No sooner.","src":"tr. 98"},{"type":"mcq","q":"Chọn câu đúng:","options":["Not long ago did I meet her.","Not long ago I met her."],"answer":1,"explain":"Sau cụm bắt đầu bằng **not long** (và not far) **không** đảo ngữ.","src":"tr. 99"},{"type":"fill","q":"Never ___ I been so tired as I am today. (have / has / had)","answer":["have"],"explain":"Câu gốc: I have never been so tired… (hiện tại hoàn thành, chủ ngữ I) → Never **have** I been…","src":"tự soạn"},{"type":"fill","q":"Not until I got home ___ I notice that my phone was missing. (do / does / did)","answer":["did"],"explain":"Chuyện quá khứ (got) và câu không có trợ ĐT → mượn **did**, đảo ở mệnh đề chính.","src":"tự soạn"},{"type":"fill","q":"No sooner had we sat down ___ the film started.","answer":["than"],"explain":"No sooner … **than**.","src":"tr. 99"},{"type":"mcq","q":"Chọn câu đúng:","options":["Only when he left I understood.","Only when he left did I understand.","Only when did he leave I understood."],"answer":1,"explain":"Only when: đảo ở **mệnh đề chính** (vế sau): did I understand. Không đảo ngay sau Only when.","src":"tr. 99"},{"type":"fix","wrong":"Rarely I have seen such a big dog.","answer":["Rarely have I seen such a big dog."],"explain":"Rarely đầu câu → đảo trợ ĐT have lên trước I.","src":"tự soạn"},{"type":"fix","wrong":"On no account you must open this door.","answer":["On no account must you open this door."],"explain":"On no account (tuyệt đối không) → đảo must lên trước you.","src":"tr. 98"},{"type":"fix","wrong":"Here comes he!","answer":["Here he comes!"],"explain":"Chủ ngữ là đại từ he → không đảo: Here he comes!","src":"tr. 92"},{"type":"fix","wrong":"Never my brother cleans his room.","answer":["Never does my brother clean his room."],"explain":"Không có trợ ĐT → mượn **does**, và cleans trở về nguyên mẫu **clean**.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Hardly","had","she","sat","down","when","the","phone","rang."],"explain":"Hardly + had + S + V3 + when + S + V2.","src":"tr. 98"}],"flashcards":[{"front":"Never / Rarely / Seldom đầu câu thì sao?","back":"**Đảo trợ ĐT** như câu hỏi: Never **have I** seen… / Seldom **do I** go…"},{"front":"Hardly … ? / No sooner … ?","back":"Hardly … **when**; No sooner … **than**. Hardly had she sat down when the phone rang."},{"front":"Only when / Not until: đảo ở đâu?","back":"Ở **mệnh đề chính** (vế sau): Not until I got home **did I** notice it."},{"front":"Here comes the bus — nếu chủ ngữ là it?","back":"Không đảo: **Here it comes.**"},{"front":"Not long ago / Not far … có đảo không?","back":"**Không**: Not long ago, I met her."}]}],"quiz":{"pass":0.8,"questions":[{"type":"mcq","q":"She dances ___.","options":["beautiful","beautifully","beautifuly"],"answer":1,"explain":"Bổ nghĩa cho động từ dances → trạng từ. beautiful tận cùng -l nên thành **beautifully** (hai chữ l).","src":"tr. 89"},{"type":"fill","q":"The children were playing ___ in the garden. (happy)","answer":["happily"],"explain":"happy tận cùng -y → **happily**.","src":"tr. 89"},{"type":"fill","q":"He is a fast runner. He runs very ___. (fast)","answer":["fast"],"explain":"fast vừa là tính từ vừa là trạng từ; không có 'fastly'.","src":"tr. 90"},{"type":"mcq","q":"I'm so tired. I ___ slept last night.","options":["hard","hardly"],"answer":1,"explain":"**hardly** = hầu như không: hầu như không ngủ được. hard không hợp nghĩa.","src":"tr. 90"},{"type":"mcq","q":"Câu nào đúng nghĩa 'Anh ấy cư xử một cách ngớ ngẩn'?","options":["He behaved sillily.","He behaved in a silly way.","He behaved silly."],"answer":1,"explain":"silly là tính từ tận cùng -ly, không tạo được trạng từ → **in a silly way**.","src":"tr. 90"},{"type":"classify","q":"Xếp mỗi trạng từ vào đúng loại:","buckets":["Thời gian","Nơi chốn","Tần suất","Mức độ"],"items":[{"text":"tomorrow","bucket":0},{"text":"outside","bucket":1},{"text":"sometimes","bucket":2},{"text":"rather","bucket":3},{"text":"soon","bucket":0},{"text":"never","bucket":2}],"explain":"tomorrow, soon: When?; outside: Where?; sometimes, never: How often?; rather: mức độ.","src":"tr. 91–94"},{"type":"fix","wrong":"Is the coffee enough hot?","answer":["Is the coffee hot enough?"],"explain":"**enough** đứng sau tính từ: hot enough.","src":"tr. 94"},{"type":"mcq","q":"This is the café ___ I first met my wife.","options":["when","where","why"],"answer":1,"explain":"Sau danh từ chỉ nơi chốn (the café) dùng **where**.","src":"tr. 95–96"},{"type":"mcq","q":"Câu bình thường (không nhấn mạnh), chọn câu đúng:","options":["We sometimes are late for work.","We are sometimes late for work.","We are late sometimes for work."],"answer":1,"explain":"Trạng từ tần suất đứng **sau be**: are sometimes late.","src":"tr. 96"},{"type":"mcq","q":"Chọn câu đúng:","options":["I have finished my report just.","I have just finished my report.","Just I have finished my report."],"answer":1,"explain":"**just** chỉ đứng giữa câu, sau trợ động từ have.","src":"tr. 91"},{"type":"fix","wrong":"He opened slowly the door.","answer":["He opened the door slowly.","He slowly opened the door."],"explain":"Trạng từ không chen giữa động từ opened và tân ngữ the door. Đưa slowly ra cuối câu (hoặc lên trước động từ).","src":"tr. 89, 97"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["She","sang","beautifully","at","the","party","last","night."],"explain":"Cách thức (beautifully) → nơi chốn (at the party) → thời gian (last night).","src":"tr. 98"},{"type":"mcq","q":"Chọn câu đúng:","options":["Always I check my email first.","I always check my email first.","I check always my email first."],"answer":1,"explain":"always không đứng đầu câu và không chen giữa động từ với tân ngữ → đứng trước động từ check.","src":"tr. 93, 96"},{"type":"fill","q":"We rarely go out these days. → Rarely ___ we go out these days. (do / does / did)","answer":["do"],"explain":"Hiện tại, chủ ngữ we, không có trợ ĐT → mượn **do**.","src":"tự soạn"},{"type":"mcq","q":"Only after the meeting ___ the truth.","options":["I learned","did I learn","I did learn"],"answer":1,"explain":"Cụm Only … đầu câu → đảo trợ ĐT: **did I learn**.","src":"tr. 98–99"},{"type":"fix","wrong":"Here comes she!","answer":["Here she comes!"],"explain":"Chủ ngữ là đại từ → không đảo: Here she comes!","src":"tr. 92"},{"type":"mcq","q":"Chọn câu đúng:","options":["Out went the lights.","Out did the lights go.","Out the lights did go."],"answer":0,"explain":"Trạng từ phương hướng (Out) đầu câu → đảo **cả động từ** went, không mượn did.","src":"tr. 99"}]}},{"id":"05-so-sanh","title":"So sánh","en":"Comparison of adjectives & adverbs","icon":"⚖️","pages":"106–121","summary":"So sánh giúp bạn nói 'bằng', 'hơn', 'nhất' về người, vật và hành động. Chủ đề này dạy bạn ba cấp so sánh (as … as, -er/more … than, the -est/the most), các dạng bất quy tắc phải thuộc, cách viết đúng đuôi -er/-est, và các mẫu 'càng… càng', 'càng ngày càng'.","mindmap":{"label":"So sánh","children":[{"label":"Bằng: as … as","icon":"🟰","children":[{"label":"not as/so … as = less … than"},{"label":"the same (+ N) as"},{"label":"twice as … as"}]},{"label":"Hơn: -er / more + than","icon":"📏","children":[{"label":"much / far / even + hơn"},{"label":"than me / than I am"}]},{"label":"Nhất: the -est / the most","icon":"🏆","children":[{"label":"Bất quy tắc: good → better → best"},{"label":"in the class / of the three"},{"label":"-ly → more; early → earlier"}]},{"label":"Dạng đặc biệt","icon":"🔁","children":[{"label":"Chính tả: bigger, happier, larger"},{"label":"Càng… càng: The more…, the more…"},{"label":"Ngày càng: colder and colder"},{"label":"Hành động: V-ing / to V"}]}]},"lessons":[{"id":"05a","title":"So sánh bằng và so sánh hơn","minutes":25,"goal":"Dùng đúng as … as, not as/so … as, -er hay more … than, biết nhấn mạnh 'hơn nhiều', nói 'gấp đôi', và chọn đại từ sau than.","pretest":[{"type":"mcq","q":"My phone is ___ yours.","options":["as cheap as","as cheap than","cheap as"],"answer":0,"explain":"So sánh bằng luôn là **as … as**: as cheap as.","src":"tr. 106"},{"type":"mcq","q":"Hanoi is ___ than Da Nang.","options":["bigger","more big","biggest"],"answer":0,"explain":"big là từ ngắn (1 âm tiết) → **bigger** than. biggest là so sánh nhất.","src":"tr. 107"},{"type":"mcq","q":"This bag is ___ than that one.","options":["expensiver","more expensive","most expensive"],"answer":1,"explain":"expensive dài (3 âm tiết) → **more** expensive than.","src":"tr. 107"}],"hook":{"icon":"⚖️","text":"Tiếng Việt so sánh rất dễ: chỉ thêm **bằng** hay **hơn** sau tính từ: 'cao bằng', 'cao hơn'. Tiếng Anh thì giống một cái cân: bằng nhau dùng **as … as**, hơn thì phải **đổi hình dạng** tính từ (taller) hoặc thêm **more** (more expensive), rồi thêm **than**. Bài này dạy bạn đặt đúng quả cân."},"diagram":{"type":"flow","title":"Bằng, hơn hay kém?","start":{"q":"A so với B thế nào?","branches":[{"label":"Ngang nhau","to":{"result":"as + adj + as: as tall as","icon":"🟰"}},{"label":"A hơn B","to":{"result":"adj-er / more + adj + than","icon":"⬆️"}},{"label":"A kém B","to":{"result":"not as/so … as hoặc less … than","icon":"⬇️"}}]}},"chunks":[{"title":"So sánh bằng: as … as","icon":"🟰","rule":"Hai thứ **ngang nhau**: **as + tính từ/trạng từ + as**. Phủ định: **not as/so … as**.","explain":"Tiếng Việt chỉ cần một chữ 'bằng'; tiếng Anh cần **hai** chữ as kẹp tính từ ở giữa. Câu phủ định có thể đổi as đầu thành so: not so hard as. **not as … as** cùng nghĩa với **less … than** (kém hơn), nhưng khi nói chuyện người ta hay dùng not as … as hơn. Muốn nói 'bằng tuổi, cùng chiều cao' thì dùng **the same + danh từ + as**: luôn là **as**, không dùng like hay with.","formula":"S + V + as + adj/adv + as + N/đại từ\nS + V + not as/so + adj/adv + as + ...\nS + V + the same (+ N) + as + ...","examples":[{"en":"My room is **as big as** yours.","vi":"Phòng tôi rộng bằng phòng bạn."},{"en":"She runs **as fast as** her brother.","vi":"Cô ấy chạy nhanh bằng anh trai."},{"en":"This test is **not so hard as** the last one.","vi":"Bài kiểm tra này không khó bằng bài trước."},{"en":"I am **the same age as** Lan.","vi":"Tôi bằng tuổi Lan."},{"en":"My phone is the same like yours.","ok":false,"note":"the same đi với as"}],"mistake":{"wrong":"He is as tall than me.","right":"He is as tall as me.","why":"as … as đi thành cặp; than chỉ dùng cho so sánh hơn."},"tip":"as … as như hai lát bánh mì kẹp tính từ ở giữa.","src":"tr. 106–107","check":{"type":"mcq","q":"My phone is the same ___ yours.","options":["as","like","with"],"answer":0,"explain":"Sách ghi rõ: **the same as**, không dùng the same like/with.","src":"tr. 106"}},{"title":"So sánh hơn: -er hay more?","icon":"📏","rule":"Từ **ngắn** thêm **-er**, từ **dài** đặt **more** phía trước; sau đó là **than**.","explain":"Từ ngắn = từ 1 âm tiết (tall, fast, cheap) và từ 2 âm tiết tận cùng **-er, -ow, -y, -le** (clever, narrow, happy, simple). Từ dài = các từ 2 âm tiết khác và từ 3 âm tiết trở lên (famous, careful, expensive, beautiful). Tiếng Việt thêm 'hơn' cho mọi từ, còn tiếng Anh phải xem độ dài của từ trước.","formula":"S + V + adj-er + than + ...\nS + V + more + adj/adv + than + ...","diagram":{"type":"flow","title":"Thêm -er hay dùng more?","start":{"q":"Tính từ có mấy âm tiết?","branches":[{"label":"1","to":{"result":"-er: tall → taller","icon":"✂️"}},{"label":"2","to":{"q":"Tận cùng -er, -ow, -y, -le?","branches":[{"label":"Có","to":{"result":"-er: happy → happier","icon":"✂️"}},{"label":"Không","to":{"result":"more: more famous","icon":"➕"}}]}},{"label":"3 trở lên","to":{"result":"more: more expensive","icon":"➕"}}]}},"examples":[{"en":"Tom is **taller than** his father.","vi":"Tom cao hơn bố cậu ấy."},{"en":"This phone is **more expensive than** that one.","vi":"Chiếc điện thoại này đắt hơn chiếc kia."},{"en":"She is **happier** now than last year.","vi":"Bây giờ cô ấy vui hơn năm ngoái."},{"en":"This hotel is more cheap than that one.","ok":false,"note":"cheap ngắn → cheaper"}],"mistake":{"wrong":"She is more taller than me.","right":"She is taller than me.","why":"Đã có -er thì không thêm more. Chỉ chọn một trong hai."},"tip":"Vỗ tay đếm âm tiết: ex-pen-sive = 3 cái → more.","src":"tr. 107","check":{"type":"fill","q":"English is ___ than Maths for me. (easy)","answer":["easier"],"explain":"easy: 2 âm tiết tận cùng -y → thêm -er, đổi y thành i: **easier**.","src":"tự soạn"}},{"title":"Hơn nhiều, gấp mấy lần","icon":"✖️","rule":"**Hơn nhiều**: đặt **much / far / a lot / even** trước dạng so sánh hơn. **Gấp đôi**: **twice as … as**.","explain":"much, far, very much, a lot, rather, even dùng để nhấn mạnh so sánh hơn: much bigger, far more expensive, even worse. Nói 'gấp … lần' thì đặt half, twice, three times … trước **as … as**. Với three/four/five times còn được dùng dạng so sánh hơn (three times bigger than), nhưng **twice** và **half** thì **không**: không nói twice more expensive than. Lưu ý ngoài sách: không đặt very một mình trước so sánh hơn (very taller ✗).","formula":"much/far/a lot/even + adj-er / more adj + than\nhalf/twice/three times + as + adj + as\nthree/four… times + adj-er + than","examples":[{"en":"My new flat is **much bigger than** the old one.","vi":"Căn hộ mới của tôi rộng hơn căn cũ nhiều."},{"en":"Today is **even hotter than** yesterday.","vi":"Hôm nay còn nóng hơn cả hôm qua."},{"en":"Petrol is **twice as expensive as** it was five years ago.","vi":"Xăng đắt gấp đôi so với năm năm trước."},{"en":"Their house is **three times bigger than** ours.","vi":"Nhà họ to gấp ba nhà chúng tôi."},{"en":"She is twice older than him.","ok":false,"note":"phải là twice as old as him"}],"mistake":{"wrong":"This bag is very cheaper than that one.","right":"This bag is much cheaper than that one.","why":"Trước so sánh hơn dùng much/far/a lot, không dùng very."},"tip":"twice và half luôn đi với as … as.","src":"tr. 107–108"},{"title":"Sau than/as: me hay I am?","icon":"👥","rule":"Sau **than/as**: lối nói thân mật dùng **đại từ tân ngữ** (than **me**); lối trang trọng dùng **đại từ chủ ngữ + động từ** (than **I am**).","explain":"Đại từ tân ngữ (object pronoun) là dạng đứng sau động từ: me, him, her, us, them. Nếu muốn dùng I, he, she… sau than/as thì thêm động từ hoặc trợ động từ phía sau: than she is, as well as I do. Cả hai cách đều đúng, chỉ khác mức trang trọng.","formula":"… than/as + me / him / her / us / them (thân mật)\n… than/as + I am / she is / he does (trang trọng)","examples":[{"en":"My sister is older **than me**.","vi":"Chị tôi lớn tuổi hơn tôi."},{"en":"My sister is older **than I am**.","vi":"Chị tôi lớn tuổi hơn tôi."},{"en":"He doesn't cook **as well as I do**.","vi":"Anh ấy nấu ăn không ngon bằng tôi."}],"tip":"than me = nói chuyện với bạn bè; than I am = viết trang trọng. Cả hai đều đúng.","src":"tr. 108–109","check":{"type":"mcq","q":"Lan sings better than ___.","options":["me","I do","Cả hai đều đúng"],"answer":2,"shuffle":false,"explain":"**than me** (thân mật) và **than I do** (trang trọng) đều đúng.","src":"tr. 108–109"}}],"practice":[{"type":"mcq","q":"Chọn câu đúng:","options":["Mai is as tall as her mother.","Mai is as tall than her mother.","Mai is tall as as her mother."],"answer":0,"explain":"So sánh bằng: **as** + tính từ + **as**. Không dùng than trong so sánh bằng.","src":"tự soạn"},{"type":"classify","q":"Xếp mỗi tính từ vào cách tạo so sánh hơn:","buckets":["Thêm -er","Dùng more"],"items":[{"text":"cheap","bucket":0},{"text":"expensive","bucket":1},{"text":"happy","bucket":0},{"text":"famous","bucket":1},{"text":"fast","bucket":0},{"text":"beautiful","bucket":1},{"text":"busy","bucket":0},{"text":"careful","bucket":1}],"explain":"1 âm tiết (cheap, fast) và 2 âm tiết tận cùng -y (happy, busy) → -er. famous, careful (2 âm tiết, không thuộc -er/-ow/-y/-le) và expensive, beautiful (3 âm tiết) → more.","src":"tr. 107"},{"type":"fill","q":"Hue is ___ than Hanoi. (small)","answer":["smaller"],"explain":"small 1 âm tiết → **smaller** than.","src":"tự soạn"},{"type":"fill","q":"This film is ___ than the book. (interesting)","answer":["more interesting"],"explain":"interesting dài → **more interesting**. Không nói interestinger.","src":"tự soạn"},{"type":"fill","q":"My car is not ___ fast as yours.","answer":["as","so"],"explain":"Phủ định của so sánh bằng: **not as … as** hoặc **not so … as**.","src":"tr. 106"},{"type":"mcq","q":"'This bag is less expensive than that one.' nghĩa giống câu nào?","options":["This bag is not as expensive as that one.","This bag is more expensive than that one.","This bag is as expensive as that one."],"answer":0,"explain":"**less … than = not as/so … as**: túi này kém đắt hơn, tức là không đắt bằng túi kia.","src":"tr. 107"},{"type":"mcq","q":"This laptop is ___ cheaper than that one.","options":["much","very","more"],"answer":0,"explain":"Nhấn mạnh so sánh hơn dùng **much/far/a lot**. very không đứng một mình trước cheaper; more cheaper là thừa vì đã có -er.","src":"tr. 108"},{"type":"mcq","q":"Rent here is ___ it was last year. (gấp đôi)","options":["twice as high as","twice higher than","twice more high than"],"answer":0,"explain":"twice luôn đi với **as … as**. Dạng 'times + so sánh hơn' không dùng với twice.","src":"tr. 107–108"},{"type":"fix","wrong":"My bike is the same colour like yours.","answer":["My bike is the same colour as yours."],"explain":"**the same … as**, không dùng like.","src":"tr. 106"},{"type":"fix","wrong":"Your phone is more cheaper than mine.","answer":["Your phone is cheaper than mine."],"explain":"cheap ngắn → cheaper. Đã có -er thì bỏ more.","src":"tự soạn"},{"type":"fix","wrong":"He is not as old than his wife.","answer":["He is not as old as his wife.","He is not so old as his wife."],"explain":"not as … **as**: chữ as thứ hai không đổi thành than.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng (Bài thi này dễ hơn bài trước nhiều):","words":["This","exam","is","much","easier","than","the","last","one."],"explain":"much đứng ngay trước dạng so sánh hơn: much easier than.","src":"tự soạn"}],"flashcards":[{"front":"Công thức so sánh bằng?","back":"**as + adj/adv + as**: as tall as. Phủ định: not as/so … as"},{"front":"Khi nào thêm -er, khi nào dùng more?","back":"Ngắn (1 âm tiết; 2 âm tiết đuôi -er/-ow/-y/-le) → **-er**; dài → **more**: cheaper, happier, more famous"},{"front":"the same … ? (bằng tuổi Lan)","back":"the same age **as** Lan (không dùng like/with)"},{"front":"'Đắt gấp đôi' nói thế nào?","back":"**twice as expensive as** (không nói twice more expensive than)"},{"front":"Nhấn mạnh 'hơn nhiều'?","back":"**much / far / a lot / even** + so sánh hơn: much bigger"},{"front":"older than ___ (tôi)?","back":"than **me** (thân mật) / than **I am** (trang trọng)"}]},{"id":"05b","title":"So sánh nhất và các điểm cần ghi nhớ","minutes":25,"goal":"Dùng đúng the -est / the most, thuộc các dạng bất quy tắc (good, bad, far, old…), biết trường hợp khó -er hay more, và chọn in hay of sau so sánh nhất.","pretest":[{"type":"mcq","q":"Everest is ___ mountain in the world.","options":["the highest","the higher","highest"],"answer":0,"explain":"So sánh nhất trước danh từ: **the** + adj-est.","src":"tr. 109"},{"type":"mcq","q":"This is the ___ day of my life.","options":["best","goodest","most good"],"answer":0,"explain":"good bất quy tắc: good → better → **best**.","src":"tr. 110"},{"type":"mcq","q":"She is the tallest girl ___ my class.","options":["in","of","than"],"answer":0,"explain":"class là một nhóm/nơi → **in** my class.","src":"tr. 112"}],"hook":{"icon":"🏆","text":"Trên bục trao giải chỉ có **một** người đứng cao nhất. Tiếng Việt chỉ thêm chữ 'nhất': 'cao nhất'. Tiếng Anh thì luôn có **the** (vì chỉ có một người) và đổi tính từ: **the tallest**, **the most famous**. Vài từ quen thuộc như good, bad còn đổi hẳn hình dạng: best, worst."},"diagram":{"type":"table","title":"Ba cấp so sánh","head":["Tính từ","Hơn","Nhất"],"rows":[["tall","taller","the tallest"],["happy","happier","the happiest"],["expensive","more expensive","the most expensive"],["good","better","the best"],["bad","worse","the worst"]]},"chunks":[{"title":"So sánh nhất: the -est / the most","icon":"🏆","rule":"So sánh nhất: từ **ngắn** → **the + adj-est**; từ **dài** → **the most + adj**.","explain":"Ngắn/dài chia giống bài trước (1 âm tiết, hoặc 2 âm tiết đuôi -er, -ow, -y, -le là ngắn). Có **the** phía trước vì 'nhất' chỉ có một. Muốn nói 'nhất, hơn hẳn' thì thêm **by far** hoặc **easily**: by far the best. Ngược với more/most là **less/least** (ít hơn/ít nhất): the least expensive = rẻ nhất.","formula":"S + V + the + adj-est (+ N)\nS + V + the most + adj (+ N)\nthe least + adj (ít … nhất)","examples":[{"en":"Lan is **the youngest** student in our class.","vi":"Lan là học sinh nhỏ tuổi nhất lớp tôi."},{"en":"This is **the most expensive** hotel in town.","vi":"Đây là khách sạn đắt nhất thị trấn."},{"en":"He is **by far the smartest** of the three.","vi":"Trong ba người, cậu ấy thông minh nhất, hơn hẳn."},{"en":"This is **the least expensive** phone in the shop.","vi":"Đây là chiếc điện thoại ít đắt nhất (rẻ nhất) cửa hàng."},{"en":"She is most beautiful girl in the school.","ok":false,"note":"thiếu the"}],"mistake":{"wrong":"It's the most cheapest phone.","right":"It's the cheapest phone.","why":"-est và most không đi cùng nhau."},"tip":"Nhất chỉ có một → luôn nhớ **the**.","src":"tr. 109, 111","check":{"type":"fill","q":"Monday is ___ day of the week for me. (busy)","answer":["the busiest"],"explain":"busy: 2 âm tiết đuôi -y → the busiest (y đổi thành i).","src":"tự soạn"}},{"title":"Bất quy tắc: good → better → best","icon":"🔀","rule":"Vài từ **không theo quy tắc**, phải học thuộc: **good/well → better → best**, **bad/badly → worse → worst**.","explain":"Học thêm: many/much → more → most; little → less → least; far → farther/further → farthest/furthest; old → older/elder → oldest/eldest. **farther** và **further** đều chỉ khoảng cách; riêng **further** còn nghĩa 'thêm nữa' (further information). **elder/eldest** dùng cho người trong cùng gia đình, đứng trước danh từ (my elder sister) và **không đi với than**: chỉ nói older than.","diagram":{"type":"table","title":"So sánh bất quy tắc","head":["Từ","Hơn","Nhất"],"rows":[["good / well","better","best"],["bad / badly","worse","worst"],["many / much","more","most"],["little","less","least"],["far","farther / further","farthest / furthest"],["old","older / elder","oldest / eldest"]]},"examples":[{"en":"Your English is **better** than mine.","vi":"Tiếng Anh của bạn giỏi hơn của tôi."},{"en":"That was **the worst** film of the year.","vi":"Đó là bộ phim tệ nhất năm."},{"en":"My **elder** sister lives in Da Nang.","vi":"Chị gái tôi sống ở Đà Nẵng."},{"en":"He is two years **older than** me.","vi":"Anh ấy lớn hơn tôi hai tuổi."},{"en":"He is two years elder than me.","ok":false,"note":"elder không đi với than"}],"mistake":{"wrong":"This cake is more good than that one.","right":"This cake is better than that one.","why":"good bất quy tắc: better, không phải more good hay gooder."},"tip":"Đọc to như đếm 1-2-3: good – better – best, bad – worse – worst.","src":"tr. 110","check":{"type":"mcq","q":"My brother is three years ___ me.","options":["older than","elder than","more old than"],"answer":0,"explain":"elder không dùng với than; old → **older than**.","src":"tr. 110"}},{"title":"Trường hợp khó: -er hay more?","icon":"🤔","rule":"Trạng từ đuôi **-ly** dùng **more/most** (more slowly), trừ **early → earlier → earliest**.","explain":"Trạng từ (adverb, từ bổ nghĩa cho động từ) như quickly, slowly, carefully → more quickly, the most carefully. Riêng early → earlier (không nói more early). Thêm vài điểm cần nhớ: một số tính từ 2 âm tiết dùng được **cả hai cách**: clever, common, cruel, gentle, narrow, pleasant, polite, quiet, simple, stupid (quieter hoặc more quiet). Từ 3 âm tiết như **unhappy, untidy** (thêm un- vào tính từ đuôi -y) vẫn thêm -er: unhappier.","formula":"adv-ly → more + adv-ly → the most + adv-ly\nearly → earlier → earliest","examples":[{"en":"Please drive **more slowly**.","vi":"Làm ơn lái chậm hơn."},{"en":"I got up **earlier** than usual.","vi":"Tôi dậy sớm hơn mọi khi."},{"en":"This street is **quieter** at night.","vi":"Con phố này yên tĩnh hơn vào ban đêm."},{"en":"She looks **unhappier** today.","vi":"Hôm nay cô ấy trông buồn hơn."},{"en":"She came more early than me.","ok":false,"note":"early → earlier"}],"mistake":{"wrong":"He speaks English quicklier than me.","right":"He speaks English more quickly than me.","why":"Trạng từ đuôi -ly dùng more, không thêm -er."},"tip":"-ly thì more, riêng early → earlier.","src":"tr. 111","check":{"type":"mcq","q":"Chọn câu đúng:","options":["She works more carefully than me.","She works carefullier than me."],"answer":0,"explain":"carefully là trạng từ đuôi -ly → **more carefully**.","src":"tr. 111"}},{"title":"in hay of sau so sánh nhất?","icon":"📍","rule":"Sau so sánh nhất: **in** + nơi chốn/nhóm (in the class, in Hanoi); **of** + khoảng thời gian hoặc số nhiều xác định (of the year, of the three).","explain":"Tiếng Việt chỉ nói 'nhất lớp', 'nhất năm'; tiếng Anh phải chọn giới từ. Tự hỏi: đó là một **nơi, tổ chức, nhóm người** (danh từ số ít: team, class, city, family) → in. Đó là **một khoảng thời gian** hoặc **một số người/vật cụ thể** (the three sisters, all the students) → of.","diagram":{"type":"flow","title":"Chọn in hay of?","start":{"q":"Sau so sánh nhất là gì?","branches":[{"label":"Nơi chốn, tổ chức, nhóm","to":{"result":"in: in the team, in Hanoi","icon":"📍"}},{"label":"Khoảng thời gian","to":{"result":"of: of the year","icon":"📅"}},{"label":"Số nhiều xác định","to":{"result":"of: of the three sisters","icon":"👭"}}]}},"examples":[{"en":"He is the best player **in** the team.","vi":"Anh ấy là cầu thủ giỏi nhất đội."},{"en":"It was the hottest day **of** the year.","vi":"Đó là ngày nóng nhất năm."},{"en":"Mai is the youngest **of** the three sisters.","vi":"Mai là người nhỏ nhất trong ba chị em."},{"en":"She is the tallest of her class.","ok":false,"note":"class là nhóm → in"}],"mistake":{"wrong":"This is the biggest city of Vietnam.","right":"This is the biggest city in Vietnam.","why":"Vietnam là nơi chốn → in."},"tip":"in = ở trong một nơi/nhóm; of = trong số những …","src":"tr. 112"}],"practice":[{"type":"mcq","q":"Which is ___ room in the house?","options":["the warmest","the warmer","warmest than"],"answer":0,"explain":"Nhiều phòng, chọn một phòng nhất → **the warmest**.","src":"tr. 112"},{"type":"classify","q":"Xếp mỗi tính từ vào cách tạo so sánh nhất:","buckets":["the -est","the most"],"items":[{"text":"big","bucket":0},{"text":"famous","bucket":1},{"text":"easy","bucket":0},{"text":"dangerous","bucket":1},{"text":"cold","bucket":0},{"text":"comfortable","bucket":1},{"text":"busy","bucket":0},{"text":"important","bucket":1}],"explain":"big, cold (1 âm tiết) và easy, busy (2 âm tiết đuôi -y) → the -est. famous, dangerous, comfortable, important là từ dài → the most.","src":"tr. 109"},{"type":"fill","q":"Tet is ___ holiday of the year for Vietnamese people. (important)","answer":["the most important"],"explain":"important dài → **the most important**.","src":"tự soạn"},{"type":"fill","q":"This is ___ pizza I've ever eaten. (good)","answer":["the best"],"explain":"good → better → **best**; so sánh nhất có the.","src":"tr. 110"},{"type":"fill","q":"My headache is ___ today than yesterday. (bad)","answer":["worse"],"explain":"Có than → so sánh hơn. bad → **worse** → worst.","src":"tr. 110"},{"type":"mcq","q":"Who is the oldest ___ your family?","options":["in","of","at"],"answer":0,"explain":"family là một nhóm người (số ít) → **in** your family.","src":"tr. 112"},{"type":"mcq","q":"Mai is the youngest ___ the four children.","options":["of","in","at"],"answer":0,"explain":"the four children là danh từ số nhiều chỉ số lượng xác định → **of**.","src":"tr. 112"},{"type":"mcq","q":"Could you speak ___? I can't hear you.","options":["more loudly","loudlier","more loud"],"answer":0,"explain":"loudly là trạng từ đuôi -ly → **more loudly**. loudlier sai; more loud là sai dạng (cần trạng từ).","src":"tr. 111"},{"type":"fix","wrong":"I got up more early than my brother.","answer":["I got up earlier than my brother."],"explain":"early là ngoại lệ: **earlier**, không nói more early.","src":"tr. 111"},{"type":"fix","wrong":"My sister is two years elder than me.","answer":["My sister is two years older than me.","My sister is two years older than I am."],"explain":"elder không đi với than → **older than**.","src":"tr. 110"},{"type":"fix","wrong":"This is the most cheapest hotel in the city.","answer":["This is the cheapest hotel in the city."],"explain":"cheap ngắn → the cheapest. Không dùng most cùng -est.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng (Cô ấy nấu ăn giỏi nhất nhà tôi):","words":["She","is","the","best","cook","in","our","family."],"explain":"the best + danh từ + **in** + nhóm (our family).","src":"tự soạn"}],"flashcards":[{"front":"So sánh nhất của từ ngắn / từ dài?","back":"**the + adj-est** (the tallest) / **the most + adj** (the most famous)"},{"front":"good / bad → hơn → nhất?","back":"good → **better** → **best**; bad → **worse** → **worst**"},{"front":"elder than hay older than?","back":"**older than**. elder chỉ đứng trước danh từ: my elder sister"},{"front":"early → so sánh hơn?","back":"**earlier**, earliest (không nói more early)"},{"front":"Trạng từ đuôi -ly so sánh thế nào?","back":"**more / most**: more slowly, the most carefully"},{"front":"the tallest ___ the class / ___ the three?","back":"**in** the class (nơi/nhóm) / **of** the three (số nhiều xác định)"}]},{"id":"05c","title":"Chính tả -er/-est, so sánh kép, so sánh hành động","minutes":25,"goal":"Viết đúng chính tả khi thêm -er/-est, dùng 'càng… càng' (the … the), 'càng ngày càng' (-er and -er, more and more), và so sánh hai hành động bằng V-ing hoặc to V.","pretest":[{"type":"mcq","q":"big → so sánh hơn?","options":["bigger","biger","more big"],"answer":0,"explain":"big: 1 nguyên âm + 1 phụ âm → gấp đôi g: **bigger**.","src":"tr. 113"},{"type":"mcq","q":"Càng ăn nhiều, bạn càng béo.","options":["The more you eat, the fatter you get.","More you eat, fatter you get.","The more you eat, fatter you get."],"answer":0,"explain":"Càng… càng: **The** + so sánh hơn …, **the** + so sánh hơn … Mỗi vế đều có the.","src":"tr. 113"},{"type":"mcq","q":"It's getting ___. (Trời càng ngày càng lạnh.)","options":["colder and colder","more and more cold","cold and cold"],"answer":0,"explain":"cold ngắn → **colder and colder**.","src":"tr. 114"}],"hook":{"icon":"📈","text":"Tiếng Việt có hai mẫu rất hay: '**càng** học **càng** giỏi' và 'trời **càng ngày càng** nóng'. Tiếng Anh cũng có đúng hai mẫu đó, chỉ cần dùng lại dạng so sánh hơn bạn đã học: **The more** you study, **the better** you get; It's getting **hotter and hotter**. Nhưng trước hết, phải viết đúng đuôi -er: big thành bigger, happy thành happier."},"diagram":{"type":"flow","title":"Thêm -er/-est thế nào?","start":{"q":"Từ tận cùng bằng gì?","branches":[{"label":"e","to":{"result":"thêm -r/-st: large → larger","icon":"✍️"}},{"label":"phụ âm + y (2 âm tiết)","to":{"result":"y → i: happy → happier","icon":"🔄"}},{"label":"1 nguyên âm + 1 phụ âm (≠ w)","to":{"result":"gấp đôi phụ âm: big → bigger","icon":"✌️"}},{"label":"Trường hợp khác","to":{"result":"thêm -er/-est: new → newer","icon":"➕"}}]}},"chunks":[{"title":"Chính tả khi thêm -er/-est","icon":"✍️","rule":"Tận cùng **e** → chỉ thêm **-r/-st**; phụ âm + **y** → đổi **y thành i**; từ 1 âm tiết tận cùng 1 nguyên âm + 1 phụ âm → **gấp đôi** phụ âm cuối.","explain":"Ba quy tắc này giữ đúng cách đọc của từ. Đổi y → i áp dụng cho tính từ 2 âm tiết như happy, busy, easy, heavy. Ngoại lệ: tận cùng **w** thì không gấp đôi: new → newer, slow → slower. Lưu ý ngoài sách: có hai nguyên âm trước phụ âm cuối (cheap, cool) thì cũng không gấp đôi: cheaper.","formula":"large → larger → largest\nhappy → happier → happiest\nbig → bigger → biggest\nnew → newer → newest","examples":[{"en":"Your bag is **larger** than mine.","vi":"Túi của bạn to hơn túi của tôi."},{"en":"Today is **hotter** than yesterday.","vi":"Hôm nay nóng hơn hôm qua."},{"en":"Monday is **the busiest** day of the week.","vi":"Thứ Hai là ngày bận nhất trong tuần."},{"en":"This box is heavyer than that one.","ok":false,"note":"heavy → heavier"}],"mistake":{"wrong":"She is thiner than her sister.","right":"She is thinner than her sister.","why":"thin: 1 nguyên âm + 1 phụ âm → gấp đôi n."},"tip":"big, hot, thin, fat, sad, wet → gấp đôi: bigger, hotter, thinner.","src":"tr. 113","check":{"type":"fill","q":"Your coffee is ___ than mine. (hot)","answer":["hotter"],"explain":"hot: 1 nguyên âm + 1 phụ âm → gấp đôi t: **hotter**.","src":"tự soạn"}},{"title":"Càng… càng: The …, the …","icon":"🔁","rule":"**Càng… càng…** = **The + so sánh hơn + S + V, the + so sánh hơn + S + V**.","explain":"Hai vế thay đổi cùng nhau, và **cả hai vế** đều bắt đầu bằng **the**. more có thể đi với danh từ: the more money. Có dạng rút gọn rất hay dùng: **The sooner the better** (càng sớm càng tốt), **The more the merrier** (càng đông càng vui).","formula":"The + adj-er / more adj + S + V, the + adj-er / more adj + S + V\nThe + so sánh hơn + the better","examples":[{"en":"**The older** I get, **the happier** I am.","vi":"Càng lớn tuổi, tôi càng thấy vui."},{"en":"**The more** I know him, **the less** I like him.","vi":"Càng biết anh ta, tôi càng ít thích anh ta."},{"en":"**The more** money you earn, **the more** you spend.","vi":"Càng kiếm nhiều tiền, bạn càng tiêu nhiều."},{"en":"**The sooner the better.**","vi":"Càng sớm càng tốt."},{"en":"More you study, better you get.","ok":false,"note":"thiếu the ở cả hai vế"}],"mistake":{"wrong":"The more I practise, more confident I feel.","right":"The more I practise, the more confident I feel.","why":"Vế thứ hai cũng phải có the."},"tip":"Hai vế, hai chữ the, như hai bậc thang cùng đi lên.","src":"tr. 113–114"},{"title":"Càng ngày càng: -er and -er","icon":"📈","rule":"**Càng ngày càng…** = **adj-er and adj-er** (từ ngắn) hoặc **more and more + adj** (từ dài); giảm dần dùng **less and less**.","explain":"Mẫu này hay đi với get / become: It's getting colder and colder. Từ ngắn thì lặp lại chính dạng -er; từ dài thì lặp more. Không trộn hai cách (more and more cold ✗, expensiver and expensiver ✗).","formula":"adj-er and adj-er: bigger and bigger\nmore and more + adj dài: more and more expensive\nless and less + adj: less and less interested","examples":[{"en":"The weather is getting **colder and colder**.","vi":"Trời càng ngày càng lạnh."},{"en":"Phones are becoming **more and more expensive**.","vi":"Điện thoại càng ngày càng đắt."},{"en":"He is **less and less interested** in football.","vi":"Anh ấy càng ngày càng ít quan tâm đến bóng đá."},{"en":"The city is getting more and more big.","ok":false,"note":"big ngắn → bigger and bigger"}],"mistake":{"wrong":"Life is getting expensiver and expensiver.","right":"Life is getting more and more expensive.","why":"expensive dài → more and more expensive."},"tip":"Ngắn: lặp -er. Dài: lặp more.","src":"tr. 114"},{"title":"So sánh hai hành động","icon":"🏃","rule":"So sánh hai **hành động**: dùng **V-ing** (danh động từ) hoặc **to + V** sau từ so sánh.","explain":"Danh động từ (gerund) là động từ thêm -ing để dùng như một danh từ: riding = việc cưỡi. Tiếng Việt nói 'đi bộ tốt hơn lái xe' với động từ để nguyên; tiếng Anh phải đổi động từ thành V-ing hoặc to V. Giữ hai vế cùng dạng: V-ing … than V-ing, to V … than to V.","formula":"V-ing + is + so sánh + V-ing\nIt is + adj-er + to V + than + to V","examples":[{"en":"**Riding** a horse is not as easy as **riding** a motorcycle.","vi":"Cưỡi ngựa không dễ như đi xe máy."},{"en":"It's cheaper **to buy** a new one than **to repair** the old one.","vi":"Mua cái mới rẻ hơn sửa cái cũ."},{"en":"**Walking** is healthier than **driving**.","vi":"Đi bộ tốt cho sức khỏe hơn lái xe."},{"en":"Walk is healthier than drive.","ok":false,"note":"hành động làm chủ ngữ → V-ing"}],"mistake":{"wrong":"Cook at home is cheaper than eating out.","right":"Cooking at home is cheaper than eating out.","why":"Hai hành động cùng dạng V-ing."},"tip":"Hai vế cân nhau: -ing với -ing, to với to.","src":"tr. 114–115"}],"practice":[{"type":"classify","q":"Khi thêm -er, mỗi từ thay đổi thế nào?","buckets":["Gấp đôi phụ âm","Đổi y → i","Chỉ thêm -r / -er"],"items":[{"text":"big","bucket":0},{"text":"hot","bucket":0},{"text":"thin","bucket":0},{"text":"easy","bucket":1},{"text":"busy","bucket":1},{"text":"nice","bucket":2},{"text":"new","bucket":2},{"text":"slow","bucket":2}],"explain":"bigger, hotter, thinner (gấp đôi); easier, busier (y → i); nicer (tận cùng e chỉ thêm -r), newer, slower (tận cùng w không gấp đôi).","src":"tr. 113"},{"type":"fill","q":"My bag is ___ than yours. (heavy)","answer":["heavier"],"explain":"heavy: phụ âm + y → **heavier**.","src":"tự soạn"},{"type":"fill","q":"This is ___ street in our town. (wide)","answer":["the widest"],"explain":"wide tận cùng e → chỉ thêm -st: **the widest**.","src":"tự soạn"},{"type":"mcq","q":"Rent in the city is getting ___.","options":["more and more expensive","expensiver and expensiver","more expensive and expensive"],"answer":0,"explain":"expensive dài → **more and more expensive**.","src":"tr. 114"},{"type":"fill","q":"Hanoi is getting ___ every year. (busy, càng ngày càng)","answer":["busier and busier"],"explain":"busy là từ ngắn (đuôi -y) → busier and busier.","src":"tr. 114"},{"type":"mcq","q":"___ you leave, ___ you will arrive.","options":["The earlier / the sooner","Earlier / sooner","The more early / the more soon"],"answer":0,"explain":"Càng… càng: mỗi vế có **the** + so sánh hơn. early → earlier, soon → sooner.","src":"tr. 113"},{"type":"fill","q":"The more you practise, ___ you get. (good)","answer":["the better"],"explain":"Vế hai cũng có the; good → **better**: the better.","src":"tr. 113–114"},{"type":"mcq","q":"___ English is harder than ___ it.","options":["Writing / speaking","Write / speak","Writes / speaks"],"answer":0,"explain":"So sánh hai hành động → dùng V-ing ở cả hai vế: **Writing** … than **speaking**.","src":"tr. 114"},{"type":"fix","wrong":"My room is biger than yours.","answer":["My room is bigger than yours."],"explain":"big: 1 nguyên âm + 1 phụ âm → gấp đôi g: bigger.","src":"tr. 113"},{"type":"fix","wrong":"The weather is getting more and more hot.","answer":["The weather is getting hotter and hotter."],"explain":"hot ngắn → **hotter and hotter** (nhớ gấp đôi t).","src":"tr. 114"},{"type":"fix","wrong":"More I read, the more I learn.","answer":["The more I read, the more I learn."],"explain":"Vế đầu cũng phải có the: **The** more I read, …","src":"tr. 113"},{"type":"order","q":"Sắp xếp thành câu đúng (Nấu ăn ở nhà rẻ hơn ăn ngoài):","words":["It's","cheaper","to","cook","at","home","than","to","eat","out."],"explain":"It's + so sánh hơn + **to V** … than **to V**.","src":"tr. 115"}],"flashcards":[{"front":"big, hot, thin → so sánh hơn?","back":"Gấp đôi phụ âm: **bigger, hotter, thinner** (nhưng new → newer)"},{"front":"happy, busy → so sánh hơn/nhất?","back":"y → i: **happier, the busiest**"},{"front":"Càng… càng… ?","back":"**The** + so sánh hơn …, **the** + so sánh hơn …: The older I get, the happier I am."},{"front":"Trời càng ngày càng lạnh?","back":"It's getting **colder and colder**. (từ dài: more and more expensive)"},{"front":"Càng sớm càng tốt?","back":"**The sooner the better.**"},{"front":"So sánh hai hành động?","back":"**V-ing** … than **V-ing** / **to V** … than **to V**: Walking is healthier than driving."}]}],"quiz":{"pass":0.8,"questions":[{"type":"mcq","q":"Our new office is ___ the old one.","options":["as big as","as big than","big as"],"answer":0,"explain":"So sánh bằng: **as + adj + as**.","src":"tr. 106"},{"type":"fill","q":"My job is ___ than yours. (stressful)","answer":["more stressful"],"explain":"stressful 2 âm tiết, không tận cùng -er/-ow/-y/-le → **more stressful**.","src":"tự soạn"},{"type":"fill","q":"Lan is ___ than her sister. (pretty)","answer":["prettier"],"explain":"pretty: 2 âm tiết, phụ âm + y → **prettier**.","src":"tr. 107, 113"},{"type":"mcq","q":"Xe mới nhanh gấp ba xe cũ: The new car is ___ the old one.","options":["three times as fast as","three times faster than","Cả hai đều đúng"],"answer":2,"shuffle":false,"explain":"Với three/four/five times, dùng được cả **as … as** lẫn **so sánh hơn + than**. Chỉ twice và half là không dùng dạng so sánh hơn.","src":"tr. 107–108"},{"type":"mcq","q":"Chọn câu SAI:","options":["She is twice older than me.","She is twice as old as me.","She is much older than me."],"answer":0,"explain":"twice phải đi với **as … as**: twice as old as. much older than là cách nhấn mạnh đúng.","src":"tr. 107–108"},{"type":"mcq","q":"Tom works harder than ___.","options":["I do","my","mine do"],"answer":0,"explain":"Sau than: đại từ chủ ngữ + trợ động từ (**I do**, trang trọng) hoặc đại từ tân ngữ (me). my là tính từ sở hữu, phải có danh từ theo sau.","src":"tr. 108–109"},{"type":"fill","q":"That was ___ meal I've ever had. (bad)","answer":["the worst"],"explain":"bad → worse → **worst**; so sánh nhất có the.","src":"tr. 110"},{"type":"mcq","q":"He is ___ player in the team.","options":["by far the best","by far the better","very the best"],"answer":0,"explain":"Nhấn mạnh so sánh nhất: **by far the best**. Cả đội nhiều người → so sánh nhất, không phải the better.","src":"tr. 109"},{"type":"mcq","q":"Ho Chi Minh City is the largest city ___ Vietnam.","options":["in","of","than"],"answer":0,"explain":"Vietnam là nơi chốn → **in**.","src":"tr. 112"},{"type":"mcq","q":"She is the smartest ___ all the students.","options":["of","in","at"],"answer":0,"explain":"all the students là danh từ số nhiều xác định → **of**.","src":"tr. 112"},{"type":"classify","q":"Từ nào dùng -er/-est, từ nào dùng more/most?","buckets":["-er / -est","more / most"],"items":[{"text":"early","bucket":0},{"text":"quickly","bucket":1},{"text":"thin","bucket":0},{"text":"careful","bucket":1},{"text":"happy","bucket":0},{"text":"useful","bucket":1}],"explain":"early là ngoại lệ (earlier); thin 1 âm tiết; happy đuôi -y. quickly là trạng từ -ly; careful, useful 2 âm tiết không thuộc nhóm -er/-ow/-y/-le → more/most.","src":"tr. 107, 111"},{"type":"fix","wrong":"She runs more fast than me.","answer":["She runs faster than me.","She runs faster than I do."],"explain":"fast 1 âm tiết → **faster**, không dùng more.","src":"tự soạn"},{"type":"fix","wrong":"Nam is three years elder than his wife.","answer":["Nam is three years older than his wife."],"explain":"elder không đi với than → **older than**.","src":"tr. 110"},{"type":"fix","wrong":"He drives carefullier than his father.","answer":["He drives more carefully than his father.","He drives more carefully than his father does."],"explain":"Trạng từ đuôi -ly → **more carefully**.","src":"tr. 111"},{"type":"fill","q":"The ___ you start, the sooner you finish. (early)","answer":["earlier"],"explain":"Càng… càng: the + so sánh hơn. early → **earlier**.","src":"tr. 111, 113"},{"type":"mcq","q":"Prices are getting ___.","options":["higher and higher","more and more high","high and high"],"answer":0,"explain":"high ngắn → **higher and higher**.","src":"tr. 114"},{"type":"fix","wrong":"Watch films at home is cheaper than going to the cinema.","answer":["Watching films at home is cheaper than going to the cinema."],"explain":"So sánh hai hành động → V-ing ở cả hai vế: **Watching** … than **going**.","src":"tr. 114"},{"type":"order","q":"Sắp xếp thành câu đúng (Càng đọc nhiều, bạn càng biết nhiều):","words":["The","more","you","read,","the","more","you","know."],"explain":"The + so sánh hơn + S + V, the + so sánh hơn + S + V.","src":"tr. 113"}]}},{"id":"06-dong-tu","title":"Động từ","en":"Verbs","icon":"🔧","pages":"122–168","summary":"Động từ là trái tim của câu: nói hành động hoặc trạng thái. Chủ đề này dạy bạn phân loại động từ, dùng các động từ tình thái (can, must, should…) để nói năng lực, bắt buộc, lời khuyên, mức độ chắc chắn, và chọn đúng dạng đi sau: to-V, V không to, V-ing hay phân từ.","mindmap":{"label":"Động từ","children":[{"label":"Phân loại","icon":"🎯","children":[{"label":"Ngoại / nội động từ"},{"label":"Quy tắc / bất quy tắc"},{"label":"Trợ động từ be, do, have"}]},{"label":"Tình thái (modal)","icon":"🔑","children":[{"label":"can, could, may, might"},{"label":"must, have to, should"},{"label":"will, would, shall"},{"label":"Chắc chắn & have + V3"},{"label":"need, dare, used to"}]},{"label":"Dạng đi sau","icon":"🚪","children":[{"label":"to-V: want to go"},{"label":"V không to: let me go"},{"label":"V-ing: enjoy cooking"},{"label":"-ing hay to-V?"}]},{"label":"Phân từ & hệ từ","icon":"🎬","children":[{"label":"boring / bored"},{"label":"Cụm phân từ"},{"label":"look, seem, become + tính từ"}]}]},"lessons":[{"id":"06a","title":"Phân loại động từ và trợ động từ","minutes":25,"goal":"Phân biệt ngoại động từ và nội động từ, đặt đúng hai tân ngữ, chia quá khứ của động từ quy tắc / bất quy tắc, và biết be, do, have làm trợ động từ để làm gì.","pretest":[{"type":"mcq","q":"Câu nào đúng?","options":["Let's invite Sally.","Let's invite."],"answer":0,"explain":"**invite** (mời) phải có người được mời đi sau: invite **Sally**.","src":"tr. 122"},{"type":"mcq","q":"Quá khứ của **teach** là gì?","options":["teached","taught","teaching"],"answer":1,"explain":"teach là động từ bất quy tắc: teach – **taught** – taught. Không thêm -ed.","src":"tr. 123"}],"hook":{"icon":"⚽","text":"Có động từ giống **cú sút**: phải có quả bóng (tân ngữ) thì mới thành câu, như *invite* ai đó, *buy* cái gì đó. Có động từ giống **ngồi xuống**: tự nó đã đủ nghĩa, như *sit down*, *sleep*. Tiếng Việt nói 'mình mời đi' vẫn tạm hiểu, nhưng tiếng Anh khắt khe hơn: động từ cần tân ngữ mà thiếu tân ngữ là sai ngữ pháp."},"diagram":{"type":"mindmap","title":"Động từ được chia nhóm theo 3 cách","root":{"label":"Động từ","children":[{"label":"Theo tân ngữ","icon":"🎯","children":[{"label":"Ngoại: invite Sally"},{"label":"Nội: sit down"}]},{"label":"Theo cách chia quá khứ","icon":"📋","children":[{"label":"Quy tắc: work → worked"},{"label":"Bất quy tắc: teach → taught"}]},{"label":"Theo vai trò","icon":"🧰","children":[{"label":"Trợ động từ: be, do, have"},{"label":"Tình thái: can, must…"},{"label":"Động từ thường: eat, go"}]}]}},"chunks":[{"title":"Ngoại động từ và nội động từ","icon":"🎯","rule":"**Ngoại động từ** (transitive verb) cần **tân ngữ** đi sau mới đủ nghĩa; **nội động từ** (intransitive verb) đứng một mình được.","explain":"Tân ngữ (object) là người hoặc vật chịu tác động của hành động, đứng sau động từ: invite **Sally**, buy **a car**. Thiếu nó, câu bị cụt. Nhiều động từ vừa là ngoại vừa là nội, có khi đổi nghĩa: *run* = chạy (nội), *run a business* = điều hành công việc kinh doanh (ngoại).","formula":"Ngoại: S + V + tân ngữ\nNội: S + V (+ trạng từ / cụm giới từ)","examples":[{"en":"Let's invite **Sally**.","vi":"Mình mời Sally đi."},{"en":"Let's invite.","ok":false,"note":"invite thiếu tân ngữ"},{"en":"Do sit down.","vi":"Ngồi xuống đi nào."},{"en":"They grow **flowers** in the garden.","vi":"Họ trồng hoa trong vườn. (ngoại)"},{"en":"Flowers grow in the garden.","vi":"Hoa mọc trong vườn. (nội)"}],"mistake":{"wrong":"Let's invite.","right":"Let's invite Sally.","why":"invite là ngoại động từ: phải nói mời **ai**."},"tip":"Sau động từ, hỏi 'ai? cái gì?'. Nếu câu bắt buộc phải trả lời câu đó → ngoại động từ.","src":"tr. 122","check":{"type":"mcq","q":"Trong câu 'They grow flowers in the garden', **grow** là:","options":["Ngoại động từ (có tân ngữ flowers)","Nội động từ (không có tân ngữ)"],"answer":0,"explain":"flowers là thứ được trồng → tân ngữ → grow ở đây là ngoại động từ. Còn 'Flowers grow…' thì grow là nội động từ.","src":"tr. 122","shuffle":false}},{"title":"Hai tân ngữ và tân ngữ của giới từ","icon":"📮","rule":"Một số ngoại động từ có **hai tân ngữ**: *sent **me** a postcard* = *sent a postcard **to** me*; nội động từ muốn có tân ngữ phải mượn **giới từ**.","explain":"Người nhận (tân ngữ gián tiếp: me, Celia) đứng ngay sau động từ, rồi mới đến vật (tân ngữ trực tiếp: a postcard). Nếu đưa người nhận ra sau vật thì phải thêm **to** hoặc **for** (sách ví dụ: send … **to** me, buy … **for** Celia). Nội động từ như walk, talk không nhận tân ngữ trực tiếp nên cần giới từ: walk **across** the fields, talk **about** your plan. Có động từ còn có bổ ngữ cho tân ngữ: I find her attitude **strange**, They elected him **president**.","formula":"V + người + vật (sent me a postcard)\nV + vật + to/for + người (sent a postcard to me)\nNội động từ + giới từ + N (talk about your plan)","examples":[{"en":"My friend has just sent **me** a postcard.","vi":"Bạn tôi vừa gửi cho tôi một tấm bưu thiếp."},{"en":"My friend has just sent a postcard **to me**.","vi":"Bạn tôi vừa gửi một tấm bưu thiếp cho tôi."},{"en":"He bought a diamond ring **for** Celia.","vi":"Anh ấy mua một chiếc nhẫn kim cương cho Celia."},{"en":"Let's talk **about** your plan.","vi":"Mình bàn về kế hoạch của bạn nhé."},{"en":"They elected him **president**.","vi":"Họ bầu ông ấy làm tổng thống."},{"en":"He sent a postcard me.","ok":false,"note":"người nhận đặt sau vật thì cần to"}],"mistake":{"wrong":"He sent a postcard me.","right":"He sent me a postcard. / He sent a postcard to me.","why":"Người nhận đứng trước vật; đặt người nhận sau vật thì phải có to."},"src":"tr. 122–123"},{"title":"Động từ quy tắc và bất quy tắc","icon":"📋","rule":"Động từ **quy tắc** thêm **-ed** ở quá khứ và quá khứ phân từ; động từ **bất quy tắc** phải **học thuộc bảng**.","explain":"Tiếng Việt thêm chữ 'đã' trước động từ; tiếng Anh đổi chính động từ. Mỗi động từ có 3 dạng: nguyên mẫu – quá khứ (V2) – quá khứ phân từ (V3, dùng sau have và trong câu bị động). Động từ quy tắc có V2 = V3, đều thêm -ed (có khi gấp đôi phụ âm cuối: beg → begged; y → ied: study → studied).","diagram":{"type":"table","title":"Ba dạng của động từ","head":["Nguyên mẫu","Quá khứ (V2)","Quá khứ phân từ (V3)"],"rows":[["work","worked","worked"],["beg","begged","begged"],["study","studied","studied"],["be","was / were","been"],["teach","taught","taught"],["see","saw","seen"],["give","gave","given"]]},"examples":[{"en":"I **worked** late yesterday.","vi":"Hôm qua tôi làm việc muộn."},{"en":"She **taught** us English.","vi":"Cô ấy đã dạy chúng tôi tiếng Anh."},{"en":"She teached us English.","ok":false,"note":"teach bất quy tắc → taught"},{"en":"I have **seen** that film.","vi":"Tôi đã xem bộ phim đó rồi."}],"mistake":{"wrong":"I seed him yesterday.","right":"I saw him yesterday.","why":"see là bất quy tắc: see – saw – seen."},"tip":"Gặp động từ mới, tra luôn cả 3 cột và đọc to theo nhịp: see – saw – seen.","src":"tr. 123"},{"title":"Trợ động từ be, do, have","icon":"🧰","rule":"**be** tạo thì tiếp diễn và câu bị động; **do** tạo câu hỏi, phủ định và câu nhấn mạnh; **have** tạo thì hoàn thành.","explain":"Trợ động từ (auxiliary verb) là động từ 'phụ' giúp động từ chính tạo thì hoặc câu hỏi. Tiếng Việt dùng 'đang', 'đã', 'có… không?'; tiếng Anh dùng be, do, have. Nhưng ba từ này cũng là động từ thường với nghĩa riêng: He **is** lazy (là), He **does** nothing (làm), He **has** no job (có).","diagram":{"type":"table","title":"Ba trợ động từ chính","head":["Trợ động từ","Dùng để tạo","Ví dụ"],"rows":[["be","tiếp diễn, bị động","She is working."],["do","câu hỏi, phủ định, nhấn mạnh","Do you like it?"],["have","thì hoàn thành","I have finished."]]},"examples":[{"en":"She **is** working.","vi":"Cô ấy đang làm việc."},{"en":"**Do** you like coffee?","vi":"Bạn có thích cà phê không?"},{"en":"She **does** like you.","vi":"Cô ấy thật sự thích bạn đấy. (nhấn mạnh)"},{"en":"I **have** finished my work.","vi":"Tôi đã làm xong việc rồi."},{"en":"He has no job.","vi":"Anh ấy không có việc làm. (has là động từ thường)"}],"tip":"be → 'đang'; have → 'đã… rồi'; do → mượn để hỏi, phủ định, nhấn mạnh.","src":"tr. 123–124","check":{"type":"mcq","q":"Trong câu 'He has no job', **has** là:","options":["Trợ động từ tạo thì hoàn thành","Động từ thường (nghĩa: có)"],"answer":1,"explain":"Không có động từ chính nào đi sau has; has ở đây nghĩa là 'có' → động từ thường.","src":"tr. 124","shuffle":false}}],"practice":[{"type":"classify","q":"Động từ in đậm là ngoại hay nội động từ?","buckets":["Ngoại (có tân ngữ)","Nội (không tân ngữ)"],"items":[{"text":"Let's **invite** Sally.","bucket":0},{"text":"Please **sit** down.","bucket":1},{"text":"We **lost** the match.","bucket":0},{"text":"Flowers **grow** in the garden.","bucket":1},{"text":"They **grow** flowers.","bucket":0},{"text":"He **ran** as fast as he could.","bucket":1}],"explain":"Có người/vật chịu hành động ngay sau động từ (Sally, the match, flowers) → ngoại. Không có (down là trạng từ, in the garden là cụm giới từ) → nội.","src":"tr. 122"},{"type":"mcq","q":"Câu nào đúng?","options":["My friend sent me a postcard.","My friend sent a postcard me.","My friend sent to me a postcard."],"answer":0,"explain":"Người nhận đứng ngay sau động từ: sent **me** a postcard. Nếu đặt người nhận sau vật thì phải là a postcard **to me**, không bỏ to và không đặt 'to me' trước vật.","src":"tr. 122–123"},{"type":"mcq","q":"Chọn câu đúng:","options":["Let's talk your plan.","Let's talk about your plan."],"answer":1,"explain":"talk là nội động từ, muốn có tân ngữ phải mượn giới từ: talk **about** your plan.","src":"tr. 123"},{"type":"fill","q":"Yesterday I ___ late at the office. (work)","answer":["worked"],"explain":"work là động từ quy tắc: thêm -ed → worked.","src":"tr. 123"},{"type":"fill","q":"Mr Lam ___ us English last year. (teach)","answer":["taught"],"explain":"teach bất quy tắc: teach – taught – taught. Không viết teached.","src":"tr. 123"},{"type":"fill","q":"Have you ever ___ a ghost? (see)","answer":["seen"],"explain":"Sau have dùng quá khứ phân từ (V3): see – saw – **seen**. 'saw' là V2, không dùng sau have.","src":"tr. 123"},{"type":"mcq","q":"Trong câu 'She does like you', **does** dùng để:","options":["Hỏi","Phủ định","Nhấn mạnh"],"answer":2,"explain":"Câu khẳng định có does + V nguyên mẫu → nhấn mạnh: 'cô ấy THẬT SỰ thích bạn'. Không có dấu hỏi, không có not.","src":"tr. 124"},{"type":"fix","wrong":"He bought a diamond ring to Celia.","answer":["He bought a diamond ring for Celia.","He bought Celia a diamond ring."],"explain":"Sách dùng **buy … for** (mua cho ai): a diamond ring **for** Celia; hoặc đặt người nhận lên trước: bought Celia a diamond ring.","src":"tr. 123"},{"type":"fix","wrong":"I seed her at the market yesterday.","answer":["I saw her at the market yesterday."],"explain":"see là bất quy tắc, quá khứ là **saw**, không thêm -ed.","src":"tr. 123"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["They","elected","him","president."],"explain":"Mẫu V + tân ngữ + bổ ngữ của tân ngữ: elected **him** (tân ngữ) **president** (bổ ngữ).","src":"tr. 123"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["She","bought","a","ring","for","her","mother."],"explain":"Vật (a ring) đứng trước, người nhận đặt sau với for: bought a ring **for** her mother.","src":"tự soạn"}],"flashcards":[{"front":"Ngoại động từ là gì?","back":"Động từ cần tân ngữ đi sau: invite **Sally**, buy **a car**."},{"front":"sent me a postcard = sent a postcard ___ me?","back":"**to**: sent a postcard to me (buy … **for** Celia)"},{"front":"3 dạng của teach?","back":"teach – **taught** – **taught**"},{"front":"be / do / have làm trợ động từ để làm gì?","back":"be: tiếp diễn, bị động · do: hỏi, phủ định, nhấn mạnh · have: hoàn thành"}]},{"id":"06b","title":"can, could, be able to, may, might","minutes":25,"goal":"Nắm đặc điểm chung của động từ tình thái và dùng đúng can, could, be able to, may, might để nói năng lực, xin phép và điều có thể xảy ra.","pretest":[{"type":"mcq","q":"Câu nào đúng?","options":["She cans swim.","She can swim.","She can to swim."],"answer":1,"explain":"can không thêm -s và theo sau là V không to: She can **swim**.","src":"tr. 124–125"},{"type":"mcq","q":"'Could I use your phone?' – Đồng ý thì trả lời thế nào?","options":["Yes, of course you can.","Yes, of course you could."],"answer":0,"explain":"Xin phép bằng could cho lịch sự, nhưng cho phép thì dùng **can**.","src":"tr. 126"},{"type":"mcq","q":"Có tiếng gõ cửa, bạn đoán nhưng không chắc lắm: 'It ___ be Tim.'","options":["might","must"],"answer":0,"explain":"Không chắc → might (có lẽ). must là gần như chắc chắn.","src":"tr. 127–128"}],"hook":{"icon":"🔑","text":"Động từ tình thái (modal verb) giống **chiếc chìa khóa gắn trước động từ**: thêm *can* là 'có thể / biết', thêm *may* là 'có lẽ'. Tiếng Việt cũng đặt 'có thể', 'được phép' trước động từ, nên bạn đã quen sẵn vị trí. Điểm khác: chìa khóa này **không bao giờ đổi hình dạng**: không -s, không to, không mượn do."},"diagram":{"type":"flow","title":"Chọn can / could / be able to / may / might","start":{"q":"Bạn muốn nói gì?","branches":[{"label":"Làm được (năng lực)","to":{"q":"Lúc nào?","branches":[{"label":"Hiện tại","to":{"result":"can: I can swim.","icon":"💪"}},{"label":"Tương lai","to":{"result":"will be able to","icon":"🔮"}},{"label":"Quá khứ, nói chung","to":{"result":"could: I could swim at 5.","icon":"🧒"}},{"label":"Quá khứ, một lần làm được","to":{"result":"was / were able to","icon":"🏁"}}]}},{"label":"Có lẽ (không chắc)","to":{"result":"may / might / could + V","icon":"🌦️"}},{"label":"Xin phép","to":{"result":"Can I…? / Could I…? / May I…?","icon":"🙋"}}]}},"chunks":[{"title":"Đặc điểm chung của động từ tình thái","icon":"🔑","rule":"Động từ tình thái **không thêm -s**, **không mượn do**, và theo sau là **V nguyên mẫu không to**.","explain":"Nhóm này gồm can, could, may, might, must, ought, had better, will, would, shall, should. Chúng chỉ có một dạng: không có 'to can', không có 'canning'. Khi cần những dạng đó (tương lai, sau to…), ta thay can bằng **be able to**, thay must bằng **have to**. Ngoại lệ: **ought** đi với to (ought to).","formula":"S + modal + V nguyên mẫu\nPhủ định: S + modal + not + V\nCâu hỏi: Modal + S + V?","examples":[{"en":"She **can** swim.","vi":"Cô ấy biết bơi."},{"en":"She cans swim.","ok":false,"note":"modal không thêm -s"},{"en":"**Can** you help me?","vi":"Bạn giúp tôi được không?"},{"en":"Do you can help me?","ok":false,"note":"modal không mượn do"},{"en":"I'd like **to be able to** drive.","vi":"Tôi muốn có thể lái xe. (không nói 'to can')"}],"mistake":{"wrong":"He can to speak English.","right":"He can speak English.","why":"Sau động từ tình thái là V nguyên mẫu không to."},"tip":"Modal như cái đinh 📌: đóng vào rồi thì động từ sau nó để trơn, không to, không -s, không -ing.","src":"tr. 124–125","check":{"type":"mcq","q":"Chọn câu đúng:","options":["Does she can drive?","Can she drive?"],"answer":1,"explain":"Modal tự đứng đầu câu hỏi, không mượn does: **Can** she drive?","src":"tr. 124"}},{"title":"can và could","icon":"💪","rule":"**can** = có thể / biết làm (hiện tại), xin và cho phép; **could** = quá khứ của can, xin phép **lịch sự hơn**, hoặc 'có lẽ'.","explain":"Khi ai đó hỏi 'Could I…?' (lịch sự), bạn đồng ý bằng **can**: 'Yes, of course you can.', không đáp 'you could'. could còn nói điều có thể đúng nhưng không chắc: It could be Tim (có thể là Tim). can't dùng khi chắc chắn điều gì không thể. Với động từ tri giác như see, hear, smell, ta dùng can thay cho thì tiếp diễn: I **can see** Susan coming.","formula":"can / could + V nguyên mẫu","examples":[{"en":"I **can** speak three languages.","vi":"Tôi nói được ba thứ tiếng."},{"en":"I **could** swim when I was five.","vi":"Tôi biết bơi từ lúc năm tuổi."},{"en":"**Could** I ask you something? – Yes, of course you **can**.","vi":"Tôi hỏi bạn một chút được không? – Được chứ."},{"en":"Someone's at the door. It **could** be Tim.","vi":"Có ai ở cửa. Có thể là Tim."},{"en":"I'm seeing Susan coming.","ok":false,"note":"nói: I can see Susan coming"}],"mistake":{"wrong":"Could I sit here? – Yes, you could.","right":"Could I sit here? – Yes, you can.","why":"could chỉ dùng để xin phép, không dùng để cho phép."},"tip":"Hỏi bằng could cho lịch sự, đáp bằng can cho gọn.","src":"tr. 125–127"},{"title":"be able to","icon":"🏁","rule":"Dùng **be able to** ở những chỗ can không dùng được (tương lai, sau have, sau to), và dùng **was/were able to** cho **một lần cụ thể đã làm được**.","explain":"could chỉ năng lực chung trong quá khứ (hồi nhỏ tôi biết bơi). Khi kể một việc cụ thể đã xoay xở làm được nhờ hoàn cảnh hay cố gắng (= managed to), sách yêu cầu dùng **was/were able to**, không dùng could. Hai modal cũng không đứng liền nhau, nên tương lai của can là **will be able to**.","formula":"will be able to + V (tương lai)\nhave/has been able to + V (hoàn thành)\nwas/were able to + V (một lần đã làm được)","examples":[{"en":"I **will be able to** speak English well next year.","vi":"Năm sau tôi sẽ nói tiếng Anh tốt."},{"en":"The plane **was able to** take off after the storm.","vi":"Máy bay đã cất cánh được sau cơn bão."},{"en":"We all **were able to** escape.","vi":"Tất cả chúng tôi đã thoát ra được."},{"en":"We all could escape.","ok":false,"note":"một lần cụ thể → were able to"},{"en":"I will can come.","ok":false,"note":"không có will can"}],"mistake":{"wrong":"I will can come tomorrow.","right":"I will be able to come tomorrow.","why":"can không có dạng tương lai; hai modal không đứng liền nhau."},"tip":"was able to = managed to = 'đã xoay xở được'.","src":"tr. 127"},{"title":"may và might","icon":"🌦️","rule":"**may / might + V** = có lẽ, có thể (đúng / xảy ra); **might** ít chắc hơn may. **May I…?** = xin phép trang trọng.","explain":"Ở nghĩa 'có lẽ', might **không** phải quá khứ của may, chỉ là ít chắc hơn (sách ví dụ: may ≈ 50%, might ≈ 30%). Việc có thể đang diễn ra: may/might + be + V-ing. may còn dùng để cho phép, may not để cấm, và chỉ **may** (không might) dùng trong lời chúc: May you both be very happy! Lưu ý: không dùng may trong câu hỏi trực tiếp về khả năng (nói 'Are you likely to go…?', không nói 'May you go…?').","formula":"may / might + V\nmay / might + be + V-ing","examples":[{"en":"Take an umbrella. It **may** rain.","vi":"Mang ô đi. Trời có thể mưa đấy."},{"en":"I **might** go to the party, but I'm not sure.","vi":"Có thể tôi sẽ đi dự tiệc, nhưng tôi không chắc."},{"en":"She **may be sleeping** now.","vi":"Có lẽ giờ này cô ấy đang ngủ."},{"en":"**May** I come in?","vi":"Tôi vào được không ạ?"},{"en":"**May** you both be very happy!","vi":"Chúc hai bạn thật hạnh phúc!"}],"mistake":{"wrong":"She may is sleeping now.","right":"She may be sleeping now.","why":"Sau may là V nguyên mẫu: may **be** + V-ing."},"tip":"may ☁️ (khá nhiều mây → ~50% mưa), might 🌤️ (ít mây hơn → ~30%).","src":"tr. 127–129","check":{"type":"mcq","q":"'I might be late' nghĩa là:","options":["Có lẽ tôi sẽ đến muộn (không chắc)","Tôi đã đến muộn (quá khứ)"],"answer":0,"explain":"might ở đây nói khả năng ở hiện tại/tương lai, không phải quá khứ của may.","src":"tr. 127–128","shuffle":false}}],"practice":[{"type":"mcq","q":"Chọn câu đúng:","options":["He can speaks English.","He can speak English.","He cans speak English."],"answer":1,"explain":"Modal không thêm -s, và động từ sau nó để nguyên mẫu: can **speak**.","src":"tr. 124"},{"type":"mcq","q":"Chọn câu đúng:","options":["Do you can swim?","Can you swim?"],"answer":1,"explain":"Modal không mượn do; đảo can lên đầu: **Can** you swim?","src":"tr. 124"},{"type":"classify","q":"Mỗi câu dùng nghĩa nào?","buckets":["Năng lực","Xin / cho phép","Có lẽ"],"items":[{"text":"I can play the guitar.","bucket":0},{"text":"Can I use your phone?","bucket":1},{"text":"It could be Tim.","bucket":2},{"text":"May I come in?","bucket":1},{"text":"It may rain later.","bucket":2},{"text":"I could read when I was four.","bucket":0}],"explain":"can/could + việc biết làm → năng lực; Can/May I…? → xin phép; could/may + đoán (be Tim, rain) → có lẽ.","src":"tr. 125–128"},{"type":"fill","q":"Next year I will ___ to drive. (khả năng ở tương lai)","answer":["be able"],"explain":"Tương lai của can là **will be able to**. Không nói 'will can'.","src":"tr. 127"},{"type":"mcq","q":"The fire spread quickly, but everyone ___ get out of the building.","options":["could","was able to"],"answer":1,"explain":"Một lần cụ thể đã xoay xở thoát ra được → **was able to** (= managed to). could chỉ dùng cho năng lực chung trong quá khứ.","src":"tr. 127"},{"type":"mcq","q":"'Could I borrow your pen?' – 'Yes, of course you ___.'","options":["can","could"],"answer":0,"explain":"Xin phép bằng could được, nhưng cho phép thì dùng **can**.","src":"tr. 126"},{"type":"mcq","q":"Câu chúc nào đúng?","options":["May you have a happy new year!","Might you have a happy new year!"],"answer":0,"explain":"Chỉ **may** dùng trong lời chúc, không dùng might.","src":"tr. 128"},{"t
