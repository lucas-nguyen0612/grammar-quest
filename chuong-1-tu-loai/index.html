ype":"mcq","q":"Bạn chỉ chắc khoảng 30% là mình sẽ đi: 'I ___ go to Da Lat this weekend.'","options":["might","will","can"],"answer":0,"explain":"Ít chắc chắn → **might**. will là khá chắc; can nói năng lực, không nói khả năng xảy ra.","src":"tr. 127–128"},{"type":"fix","wrong":"I will can visit you next week.","answer":["I will be able to visit you next week.","I'll be able to visit you next week."],"explain":"Không có 'will can'; tương lai của can là **will be able to**.","src":"tr. 127"},{"type":"fix","wrong":"She may is sleeping now.","answer":["She may be sleeping now.","She might be sleeping now."],"explain":"Sau may là V nguyên mẫu: may **be** sleeping (việc có thể đang diễn ra).","src":"tr. 128"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["She","may","be","working","at","home","today."],"explain":"may + be + V-ing = có lẽ đang làm gì.","src":"tr. 128","answer":[["Today","she","may","be","working","at","home."]]}],"flashcards":[{"front":"Sau động từ tình thái là gì?","back":"V nguyên mẫu **không to**: She can **swim**."},{"front":"Tương lai của can?","back":"**will be able to**: I'll be able to drive."},{"front":"Một lần cụ thể đã làm được: could hay was able to?","back":"**was/were able to**: We were able to escape."},{"front":"'Could I…?' đồng ý trả lời thế nào?","back":"Yes, of course you **can**."},{"front":"may hay might chắc hơn?","back":"**may** (~50%) chắc hơn might (~30%)"}]},{"id":"06c","title":"must, have to, should, had better, will, would, shall","minutes":25,"goal":"Nói đúng bắt buộc (must / have to), cấm (mustn't), không cần (don't have to), lời khuyên (should / ought to / had better), và lời nhờ, mời, đề nghị với will / would / shall.","pretest":[{"type":"mcq","q":"'You mustn't park here' nghĩa là:","options":["Bạn không được đỗ xe ở đây","Bạn không cần đỗ xe ở đây"],"answer":0,"explain":"mustn't = **cấm**. 'Không cần' là don't have to.","src":"tr. 129, 131","shuffle":false},{"type":"mcq","q":"'Hôm qua tôi phải đi nha sĩ' là:","options":["I must go to the dentist yesterday.","I had to go to the dentist yesterday."],"answer":1,"explain":"must không có dạng quá khứ; quá khứ dùng **had to**.","src":"tr. 130"}],"hook":{"icon":"🚦","text":"Hãy nghĩ tới **đèn giao thông**: đỏ = *mustn't* (cấm), vàng = *should* (nên), xanh = *don't have to* (không cần, tùy bạn). Tiếng Việt chỉ có 'phải', 'không được', 'nên'; tiếng Anh tách nhỏ hơn: *phải* vì chính tôi thấy cần (must) khác *phải* vì luật lệ (have to)."},"diagram":{"type":"flow","title":"Bắt buộc, cấm, không cần hay khuyên?","start":{"q":"Bạn muốn nói gì?","branches":[{"label":"Phải làm","to":{"q":"Ai đặt ra?","branches":[{"label":"Chính người nói","to":{"result":"must + V","icon":"💭"}},{"label":"Luật, hoàn cảnh","to":{"result":"have to + V","icon":"📜"}}]}},{"label":"Cấm làm","to":{"result":"mustn't + V","icon":"🚫"}},{"label":"Không cần làm","to":{"result":"don't have to + V","icon":"🤷"}},{"label":"Khuyên","to":{"q":"Chung chung hay tình huống cụ thể?","branches":[{"label":"Chung chung","to":{"result":"should / ought to + V","icon":"💡"}},{"label":"Cụ thể, ngay bây giờ","to":{"result":"had better + V","icon":"⏰"}}]}}]}},"chunks":[{"title":"must và have to","icon":"⚖️","rule":"**must** = phải (do **người nói** thấy cần); **have to** = phải (do **luật lệ, hoàn cảnh** bên ngoài). Quá khứ và tương lai dùng **had to / will have to**.","explain":"Cả hai đều là 'phải'. must mang cảm xúc, mong muốn của người nói; have to là quy định từ bên ngoài (nội quy, luật, lệnh của ai đó). must không có dạng quá khứ hay nguyên mẫu, nên ở quá khứ phải nói **had to**, tương lai **'ll have to**, sau modal khác **might have to**. have to là động từ thường: câu hỏi và phủ định mượn do (Do you have to…?). must còn dùng để suy luận chắc chắn: You must be hungry.","formula":"must + V\nhave / has to + V\nhad to + V (quá khứ) · will have to + V (tương lai)","examples":[{"en":"I really **must** stop smoking.","vi":"Tôi thật sự phải bỏ thuốc (tôi muốn thế)."},{"en":"I **have to** stop smoking. Doctor's orders.","vi":"Tôi phải bỏ thuốc. Bác sĩ bảo thế."},{"en":"Emma **had to** go to the dentist yesterday.","vi":"Hôm qua Emma phải đi nha sĩ."},{"en":"Emma must go to the dentist yesterday.","ok":false,"note":"quá khứ → had to"},{"en":"**Do** you **have to** wear a uniform?","vi":"Bạn có phải mặc đồng phục không?"}],"mistake":{"wrong":"Do you must work tomorrow?","right":"Do you have to work tomorrow?","why":"must không mượn do; muốn hỏi với do thì dùng have to."},"tip":"must = từ trong lòng 💭; have to = từ tờ nội quy 📜.","src":"tr. 129–131"},{"title":"mustn't và don't have to","icon":"🚫","rule":"**mustn't** = **cấm**, không được làm; **don't have to** = **không cần** làm (làm cũng được).","explain":"Đây là bẫy lớn với người Việt: 'không phải' nghe gần 'không được'. Nhưng mustn't là đèn đỏ, còn don't have to (= don't need to) là đèn xanh: tùy bạn.","formula":"mustn't + V → cấm\ndon't / doesn't have to + V → không cần","examples":[{"en":"You **mustn't** smoke in the hospital.","vi":"Bạn không được hút thuốc trong bệnh viện."},{"en":"You **don't have to** come early. The meeting starts at 10.","vi":"Bạn không cần đến sớm. 10 giờ mới họp."},{"en":"Tomorrow is Sunday, so I **don't have to** get up early.","vi":"Mai là Chủ nhật nên tôi không cần dậy sớm."},{"en":"Tomorrow is Sunday, so I mustn't get up early.","ok":false,"note":"thành nghĩa 'cấm dậy sớm'"}],"mistake":{"wrong":"It's Sunday, so I mustn't go to work.","right":"It's Sunday, so I don't have to go to work.","why":"Chủ nhật thì không cần đi làm, chứ không phải bị cấm đi làm."},"tip":"mustn't = 🚫 cấm; don't have to = 🤷 tùy bạn.","src":"tr. 129, 131","check":{"type":"mcq","q":"Bảo tàng có biển cấm chụp ảnh: 'You ___ take photos here.'","options":["mustn't","don't have to"],"answer":0,"explain":"Cấm → **mustn't**. don't have to nghĩa là không cần, ai thích thì cứ chụp.","src":"tr. 131"}},{"title":"should, ought to, had better","icon":"💡","rule":"Khuyên chung: **should / ought to + V**; khuyên cho **một tình huống cụ thể, ngay bây giờ**: **had better + V** (mạnh hơn).","explain":"should và ought to gần như giống nhau: nên làm, bổn phận nhẹ hơn must (bạn vẫn có lựa chọn). Nhớ ought luôn đi với **to**. had better có chữ had nhưng **không** nói về quá khứ: nó nói về bây giờ và mạnh hơn should. Phủ định: had better **not** + V. Lời khuyên chung cho mọi người thì dùng should, không dùng had better. should còn dùng để đoán điều mình mong đợi: Ann has been studying hard, so she should pass.","formula":"should / ought to + V\nhad better ('d better) + V\nhad better not + V","examples":[{"en":"You **should** eat more vegetables.","vi":"Bạn nên ăn nhiều rau hơn."},{"en":"You **ought to** see a doctor.","vi":"Bạn nên đi khám bác sĩ."},{"en":"It's going to rain. We'**d better** go home now.","vi":"Sắp mưa rồi. Tốt hơn là mình về nhà ngay."},{"en":"You'**d better not** be late again.","vi":"Tốt nhất là đừng đến muộn nữa đấy."},{"en":"I think all drivers had better wear seat belts.","ok":false,"note":"khuyên chung → should"}],"mistake":{"wrong":"You had better to go now.","right":"You had better go now.","why":"had better + V nguyên mẫu không to."},"tip":"had better = 'liệu mà làm ngay đi' ⏰; should = 'nên đấy' 🙂.","src":"tr. 134–137"},{"title":"will, would, shall: nhờ, mời, đề nghị","icon":"🤝","rule":"**Will / Would you…?** = nhờ (would lịch sự hơn); **Would you like…?** = mời; **Shall I…?** = đề nghị giúp; **Shall we…?** = rủ cùng làm.","explain":"Ngoài nghĩa tương lai, will / would / shall có những mẫu câu giao tiếp cố định. **Would you mind + V-ing…?** = phiền bạn… được không. **would like + to-V** là cách nói 'muốn' lịch sự hơn want. **would rather + V** (không to) = thích … hơn. shall chỉ dùng với I / we. would còn nói thói quen trong quá khứ: On winter evenings we would all sit around the fire.","formula":"Would you + V…?\nWould you like + N / to-V…?\nWould you mind + V-ing…?\nShall I / Shall we + V…?\nwould rather + V","examples":[{"en":"**Would** you open the window, please?","vi":"Bạn mở cửa sổ giúp mình được không?"},{"en":"**Would you like** a cup of tea?","vi":"Bạn uống một tách trà nhé?"},{"en":"**Would you mind** closing the door?","vi":"Phiền bạn đóng cửa giúp nhé?"},{"en":"**Shall I** carry your bag?","vi":"Để tôi xách túi giúp bạn nhé?"},{"en":"**Shall we** go out for dinner?","vi":"Mình đi ăn tối ở ngoài nhé?"},{"en":"I'**d rather** stay at home.","vi":"Tôi thích ở nhà hơn."}],"mistake":{"wrong":"Would you mind to close the door?","right":"Would you mind closing the door?","why":"Would you mind + **V-ing**."},"tip":"Shall I = tôi giúp nhé 🙋; Shall we = mình cùng nhé 👫.","src":"tr. 131–134"}],"practice":[{"type":"mcq","q":"'You don't have to pay' nghĩa là:","options":["Bạn không được trả tiền","Bạn không cần trả tiền"],"answer":1,"explain":"don't have to = **không cần**. 'Không được' là mustn't.","src":"tr. 131","shuffle":false},{"type":"classify","q":"Mỗi câu nói về điều gì?","buckets":["Cấm","Không cần","Lời khuyên"],"items":[{"text":"You mustn't touch that wire.","bucket":0},{"text":"You don't have to bring food; we have lots.","bucket":1},{"text":"You should drink more water.","bucket":2},{"text":"Visitors mustn't feed the animals.","bucket":0},{"text":"She doesn't have to work on Sundays.","bucket":1},{"text":"You ought to call your mum.","bucket":2}],"explain":"mustn't → cấm; don't/doesn't have to → không cần; should / ought to → lời khuyên.","src":"tr. 131, 134–136"},{"type":"mcq","q":"Chọn câu đúng:","options":["Do you must wear a uniform at work?","Do you have to wear a uniform at work?"],"answer":1,"explain":"must không đi với do. Hỏi bằng do thì dùng **have to**.","src":"tr. 130"},{"type":"fill","q":"Last night I ___ work late because my boss asked me. (phải, quá khứ)","answer":["had to"],"explain":"must không có quá khứ; 'đã phải' = **had to**.","src":"tr. 130"},{"type":"fill","q":"You ___ smoke in here. It's against the rules. (cấm)","answer":["mustn't","must not","can't","cannot"],"explain":"Cấm (trái nội quy) → **mustn't** (nói can't cũng được). Đừng dùng don't have to: đó là 'không cần'.","src":"tr. 129"},{"type":"mcq","q":"Câu nào đúng?","options":["You'd better go to bed now.","You'd better to go to bed now.","You'd better going to bed now."],"answer":0,"explain":"had better ('d better) + V nguyên mẫu không to: 'd better **go**.","src":"tr. 136"},{"type":"mcq","q":"Lời khuyên chung cho mọi người: 'I think everyone ___ learn to swim.'","options":["should","had better"],"answer":0,"explain":"Lời khuyên chung chung → **should**. had better chỉ dùng cho một tình huống cụ thể.","src":"tr. 137"},{"type":"fill","q":"I ___ get up early tomorrow. It's Sunday! (không cần)","answer":["don't have to","do not have to","won't have to","will not have to","don't need to","do not need to","won't need to","needn't","need not"],"explain":"Không cần → **don't have to**. Đừng dùng mustn't: thành 'cấm dậy sớm'.","src":"tr. 131"},{"type":"mcq","q":"Bạn muốn đề nghị giúp xách túi: '___ carry your bag?'","options":["Shall I","Shall we","Will I"],"answer":0,"explain":"Đề nghị tự mình giúp → **Shall I…?**. Shall we…? là rủ cùng làm.","src":"tr. 134"},{"type":"fix","wrong":"Would you mind to open the window?","answer":["Would you mind opening the window?"],"explain":"Would you mind + **V-ing**: opening.","src":"tr. 133"},{"type":"fix","wrong":"Emma must go to the dentist yesterday.","answer":["Emma had to go to the dentist yesterday."],"explain":"Có yesterday (quá khứ) → **had to**; must không có dạng quá khứ.","src":"tr. 130"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["We","had","better","leave","now."],"explain":"had better + V nguyên mẫu: had better **leave**.","src":"tr. 136"}],"flashcards":[{"front":"mustn't khác don't have to thế nào?","back":"mustn't = **cấm** · don't have to = **không cần**"},{"front":"Quá khứ của must (bắt buộc)?","back":"**had to**: I had to work late."},{"front":"must khác have to thế nào?","back":"must: người nói thấy cần · have to: luật, hoàn cảnh bên ngoài"},{"front":"had better + ?","back":"V nguyên mẫu không to; khuyên cho tình huống cụ thể: You'd better **go** now."},{"front":"Would you mind + ?","back":"**V-ing**: Would you mind **closing** the door?"},{"front":"Shall I…? và Shall we…?","back":"Shall I = đề nghị giúp · Shall we = rủ cùng làm"}]},{"id":"06d","title":"Chắc chắn đến đâu? Tình thái hoàn thành; need, dare, used to","minutes":25,"goal":"Dùng thang mức độ chắc chắn (must be, can't be, may be), đoán và tiếc chuyện đã qua với must / can't / may / should have + V3, và dùng đúng need, dare, used to, be used to.","pretest":[{"type":"mcq","q":"Đèn nhà anh ấy tắt, xe máy không có ở nhà. Bạn gần như chắc: 'He ___ be out.'","options":["must","may"],"answer":0,"explain":"Gần như chắc (khoảng 95%) → **must**. may chỉ là đoán, chưa tới 50%.","src":"tr. 138"},{"type":"mcq","q":"'I used to smoke' nghĩa là:","options":["Trước đây tôi hút thuốc (giờ thì không)","Tôi quen với việc hút thuốc"],"answer":0,"explain":"used to + V = thói quen cũ nay không còn. 'Quen với' là be used to + V-ing.","src":"tr. 140–141","shuffle":false},{"type":"mcq","q":"'You should have told me' nghĩa là:","options":["Lẽ ra bạn nên nói với tôi (nhưng bạn đã không nói)","Bạn nên nói với tôi ngay bây giờ"],"answer":0,"explain":"should have + V3 = lẽ ra nên làm nhưng đã không làm.","src":"tr. 138","shuffle":false}],"hook":{"icon":"🌡️","text":"Hãy tưởng tượng một **nhiệt kế đo độ chắc chắn**. Chắc 100%: *He is sick.* Chắc 95%: *He must be sick.* Chỉ đoán: *He may be sick.* Tiếng Việt dùng 'chắc chắn', 'chắc hẳn', 'có lẽ'; tiếng Anh dùng must, can't, may… và thêm **have + V3** khi đoán chuyện đã qua."},"diagram":{"type":"table","title":"Thang mức độ chắc chắn","head":["Mức","Khẳng định","Phủ định"],"rows":[["100%","He is sick.","Sam isn't hungry."],["99%","—","Sam can't / couldn't be hungry."],["95%","He must be sick.","Sam must not be hungry."],["dưới 50%","He may / might / could be sick.","Sam may not / might not be hungry."]]},"chunks":[{"title":"Thang mức độ chắc chắn","icon":"🌡️","rule":"Càng chắc càng dùng từ mạnh: **is** (100%) > **must be** (95%) > **may / might / could be** (dưới 50%). Phủ định: **isn't** > **can't be** > **must not be** > **may / might not be**.","explain":"Khi đã biết sự thật (100%) thì không cần động từ tình thái: He is sick. **must be** là suy luận có căn cứ: 'chắc hẳn'. **can't be** là 'không thể nào' (99% là không). may / might / could be chỉ là đoán. Thang này dùng tương tự cho quá khứ (xem mẩu sau).","examples":[{"en":"You've been walking all day. You **must be** tired.","vi":"Bạn đi bộ cả ngày rồi. Chắc hẳn bạn mệt lắm."},{"en":"She just ate a big lunch. She **can't be** hungry.","vi":"Cô ấy vừa ăn trưa no nê. Không thể nào cô ấy đói được."},{"en":"Where's Tom? – He **may be** at work.","vi":"Tom đâu rồi? – Có lẽ anh ấy đang ở chỗ làm."}],"tip":"Nhớ nhiệt kế: is 100 → must 95 → may / might / could dưới 50. Phủ định mạnh nhất (sau isn't) là can't.","src":"tr. 129, 138","check":{"type":"mcq","q":"Anh ấy vừa ngủ 12 tiếng. 'He ___ be sleepy.' (gần như chắc là không)","options":["can't","may"],"answer":0,"explain":"Gần như chắc là không → **can't be**. may be sleepy là 'có lẽ buồn ngủ', ngược nghĩa.","src":"tr. 138"}},{"title":"Đoán chuyện đã qua: modal + have + V3","icon":"⏪","rule":"Nói về **quá khứ**: **must have + V3** (chắc hẳn đã), **can't / couldn't have + V3** (không thể nào đã), **may / might / could have + V3** (có lẽ đã), **should have + V3** (lẽ ra nên, nhưng đã không).","explain":"Sau modal luôn là V nguyên mẫu, nên muốn lùi về quá khứ ta dùng **have + V3** (quá khứ phân từ). should have + V3 là lời tiếc hoặc trách: lẽ ra phải làm mà không làm; **shouldn't have + V3**: lẽ ra không nên mà đã làm (ought to have dùng tương tự). might / could have + V3 còn nói điều có thể đã xảy ra nhưng thực tế không xảy ra: He might have got lost.","diagram":{"type":"table","title":"Modal + have + V3","head":["Mẫu","Nghĩa","Ví dụ"],"rows":[["must have + V3","chắc hẳn đã","He must have forgotten."],["can't have + V3","không thể nào đã","She can't have seen me."],["may / might have + V3","có lẽ đã","They may have left."],["should have + V3","lẽ ra nên (mà không)","You should have told me."],["shouldn't have + V3","lẽ ra không nên (mà đã)","I shouldn't have eaten so much."]]},"examples":[{"en":"The ground is wet. It **must have rained** last night.","vi":"Mặt đất ướt. Chắc hẳn đêm qua trời mưa."},{"en":"She **can't have seen** me. She didn't say hello.","vi":"Cô ấy không thể nào đã thấy tôi. Cô ấy đâu có chào."},{"en":"I can't find my keys. I **may have left** them at work.","vi":"Tôi không tìm thấy chìa khóa. Có lẽ tôi để quên ở chỗ làm."},{"en":"You **should have told** me earlier.","vi":"Lẽ ra bạn nên nói với tôi sớm hơn."},{"en":"It must rained last night.","ok":false,"note":"thiếu have: must have rained"}],"mistake":{"wrong":"You should told me.","right":"You should have told me.","why":"Nói về quá khứ: modal + **have** + V3."},"tip":"Thêm **have + V3** = lùi cỗ máy thời gian về quá khứ ⏪.","src":"tr. 137–138"},{"title":"need và dare","icon":"🧗","rule":"**need** thường dùng như động từ thường: **need to + V**; dạng tình thái **needn't + V** (không to) = không cần. **needn't have + V3** = đã làm nhưng hóa ra không cần.","explain":"Câu khẳng định: I need **to** go. Trong câu phủ định hoặc câu hỏi, need có thể là tình thái (không to): You **needn't** wash it. Tiếng Anh Mỹ ít dùng dạng này, thường nói You don't need to wash it. **need + V-ing** mang nghĩa bị động: This room needs cleaning (= cần được dọn). **dare** (dám) cũng vậy: She didn't dare to tell him (động từ thường) / I daren't ask her (tình thái).","formula":"need to + V · don't need to + V · needn't + V\nneed + V-ing = cần được (bị động)\nneedn't have + V3","examples":[{"en":"I **need to** go now.","vi":"Giờ tôi cần đi rồi."},{"en":"You **needn't** wash it. It's clean.","vi":"Bạn không cần rửa đâu. Nó sạch rồi."},{"en":"This room **needs cleaning**.","vi":"Căn phòng này cần được dọn."},{"en":"I **needn't have** cooked so much. Nobody was hungry.","vi":"Lẽ ra tôi không cần nấu nhiều thế. Chẳng ai đói cả."},{"en":"She didn't **dare to** tell him.","vi":"Cô ấy không dám nói với anh ta."},{"en":"I need go now.","ok":false,"note":"câu khẳng định: need to go"}],"src":"tr. 139–140"},{"title":"used to, be used to, get used to","icon":"🕰️","rule":"**used to + V** = trước đây thường (giờ không còn); **be used to + V-ing / N** = **quen với**; **get used to + V-ing / N** = **dần quen với**.","explain":"Tiếng Việt nói 'trước đây tôi hay…'; tiếng Anh dùng used to + V. Nó chỉ có dạng quá khứ: thói quen hiện tại thì dùng thì hiện tại đơn. Câu hỏi / phủ định: Did you **use to**…? / I didn't **use to**… Không dùng used to khi nói rõ số lần hay khoảng thời gian: We visited Paris four times last year. Còn be / get used to là chuyện 'quen'; sau to là V-ing hoặc danh từ.","diagram":{"type":"table","title":"Ba cấu trúc dễ nhầm","head":["Cấu trúc","Theo sau","Nghĩa"],"rows":[["used to","V nguyên mẫu","trước đây thường"],["be used to","V-ing / N","đã quen với"],["get used to","V-ing / N","dần quen với"]]},"examples":[{"en":"I **used to** live in Hue.","vi":"Trước đây tôi sống ở Huế."},{"en":"**Did** you **use to** play football?","vi":"Hồi trước bạn có hay đá bóng không?"},{"en":"I'**m used to getting** up early.","vi":"Tôi quen dậy sớm rồi."},{"en":"She is **getting used to** the cold weather.","vi":"Cô ấy đang dần quen với thời tiết lạnh."},{"en":"We used to visit Paris four times last year.","ok":false,"note":"có số lần → visited"}],"mistake":{"wrong":"I'm used to get up early.","right":"I'm used to getting up early.","why":"be used to + **V-ing**."},"tip":"Có **be / get** đứng trước → V-ing. Không có be / get → used to + V.","src":"tr. 140–142"}],"practice":[{"type":"mcq","q":"Cô ấy có 3 ô tô và một biệt thự. 'She ___ be rich.' (gần như chắc)","options":["must","can't","might"],"answer":0,"explain":"Có căn cứ rõ → gần như chắc → **must**. can't là ngược nghĩa; might chỉ là đoán.","src":"tr. 138"},{"type":"mcq","q":"Tom was in Hanoi all day yesterday, so the man you saw in Da Nang yesterday ___ been Tom.","options":["can't have","must have","should have"],"answer":0,"explain":"Gần như chắc là KHÔNG phải Tom (về quá khứ) → **can't have** been.","src":"tr. 137"},{"type":"classify","q":"Mỗi câu nói gì?","buckets":["Chắc hẳn đã","Có lẽ đã","Lẽ ra nên (mà không)"],"items":[{"text":"He must have forgotten.","bucket":0},{"text":"She may have missed the bus.","bucket":1},{"text":"You should have called me.","bucket":2},{"text":"They must have left early.","bucket":0},{"text":"I might have left it at home.","bucket":1},{"text":"We should have booked a table.","bucket":2}],"explain":"must have = chắc hẳn đã; may / might have = có lẽ đã; should have = lẽ ra nên nhưng đã không.","src":"tr. 137–138"},{"type":"fill","q":"The floor is wet. Someone must have ___ water on it. (spill)","answer":["spilled","spilt"],"explain":"must have + **V3**: spill → spilled (hoặc spilt).","src":"tr. 137"},{"type":"fill","q":"You ___ have told me! Now it's too late. (lẽ ra nên)","answer":["should","ought to"],"explain":"Lẽ ra nên làm mà không làm → **should have** + V3 (hoặc ought to have).","src":"tr. 138"},{"type":"mcq","q":"Áo này sạch rồi: 'You ___ wash it.'","options":["needn't","mustn't"],"answer":0,"explain":"Không cần → **needn't**. mustn't là cấm, sai nghĩa.","src":"tr. 139"},{"type":"mcq","q":"This room needs ___.","options":["cleaning","clean","to clean"],"answer":0,"explain":"need + V-ing mang nghĩa bị động: needs **cleaning** = cần được dọn. 'needs to clean' sai vì căn phòng không tự dọn được.","src":"tr. 139"},{"type":"mcq","q":"Chọn câu đúng:","options":["I used to play football.","I used to playing football."],"answer":0,"explain":"used to (thói quen cũ) + **V nguyên mẫu**: used to play.","src":"tr. 140"},{"type":"fill","q":"I've lived here for five years, so I'm used to ___ in a big city. (live)","answer":["living"],"explain":"be used to + **V-ing** = quen với: used to living.","src":"tr. 141–142"},{"type":"fix","wrong":"I'm not used to get up so early.","answer":["I'm not used to getting up so early.","I am not used to getting up so early."],"explain":"be used to + V-ing: getting up.","src":"tr. 141–142"},{"type":"fix","wrong":"You should told me the truth.","answer":["You should have told me the truth.","You ought to have told me the truth."],"explain":"Lẽ ra nên (quá khứ) → should **have** + V3.","src":"tr. 138"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["It","must","have","rained","last","night."],"explain":"must + have + V3 = chắc hẳn đã.","src":"tr. 137","answer":[["Last","night","it","must","have","rained."]]}],"flashcards":[{"front":"Thang chắc chắn (khẳng định)?","back":"is 100% > **must** 95% > may / might / could dưới 50%"},{"front":"'Không thể nào' (99%) dùng gì?","back":"**can't / couldn't**: She can't be hungry."},{"front":"Chắc hẳn đã xảy ra?","back":"**must have + V3**: It must have rained."},{"front":"should have + V3 nghĩa là?","back":"Lẽ ra nên làm **nhưng đã không**: You should have told me."},{"front":"used to khác be used to thế nào?","back":"used to + V: trước đây thường · be used to + **V-ing**: quen với"},{"front":"This room needs ___ (clean)?","back":"**cleaning** (= needs to be cleaned)"}]},{"id":"06e","title":"to-V hay V nguyên mẫu không to","minutes":25,"goal":"Biết động từ, tính từ, cấu trúc nào đi với to-V (want to go, tell sb to go, happy to see) và nào đi với V không to (can go, let sb go, make sb go).","pretest":[{"type":"mcq","q":"Câu nào đúng?","options":["I decided to buy a new phone.","I decided buy a new phone.","I decided buying a new phone."],"answer":0,"explain":"decide + **to-V**: decided to buy.","src":"tr. 143"},{"type":"mcq","q":"Câu nào đúng?","options":["My mum made me to clean my room.","My mum made me clean my room."],"answer":1,"explain":"make + người + **V không to**: made me clean.","src":"tr. 146"}],"hook":{"icon":"🚪","text":"Tiếng Việt nói 'tôi muốn đi', 'mẹ bắt tôi dọn phòng': động từ thứ hai không cần thêm gì. Tiếng Anh có hai **cửa**: cửa **to** (want **to** go) và cửa **không to** (let me go). Đi cửa nào là do từ **đứng trước** quyết định. Bài này đưa bạn danh sách các 'người gác cửa'."},"diagram":{"type":"flow","title":"Thêm to hay không?","start":{"q":"Từ đứng ngay trước là gì?","branches":[{"label":"Modal: can, must, should…","to":{"result":"V không to: can go","icon":"✂️"}},{"label":"had better, would rather, why not","to":{"result":"V không to: Why not stay?","icon":"✂️"}},{"label":"let / make / see / hear + người","to":{"result":"V không to: let me go","icon":"✂️"}},{"label":"want, decide, hope, tell sb…","to":{"result":"to-V: want to go, tell me to go","icon":"➡️"}},{"label":"Tính từ: happy, kind, easy…","to":{"result":"to-V: happy to see you","icon":"➡️"}},{"label":"what / how / where","to":{"result":"to-V: how to cook","icon":"➡️"}}]}},"chunks":[{"title":"Động từ + to-V","icon":"➡️","rule":"Sau **want, decide, hope, plan, agree, promise, refuse, manage, afford, offer, fail, seem** dùng **to + V**.","explain":"Danh sách này phải học thuộc (thêm các cụm make up one's mind, make sure, take care). to-V cũng làm chủ ngữ được, nhưng tiếng Anh hiện đại thích đưa **It** lên đầu: It's dangerous to lean out of the window. to-V còn đứng sau be: His plan was to keep it secret.","formula":"S + V + to + V nguyên mẫu\nIt + is + tính từ + to-V","examples":[{"en":"I **hope to see** you soon.","vi":"Mong sớm gặp lại bạn."},{"en":"We **decided to stay** at home.","vi":"Chúng tôi quyết định ở nhà."},{"en":"He **refused to answer**.","vi":"Anh ấy từ chối trả lời."},{"en":"We can't **afford to buy** a car.","vi":"Chúng tôi không đủ tiền mua ô tô."},{"en":"**It's dangerous to lean** out of the window.","vi":"Nhoài người ra ngoài cửa sổ thì nguy hiểm."},{"en":"I want go home.","ok":false,"note":"want + to-V"}],"mistake":{"wrong":"I want go home.","right":"I want to go home.","why":"want phải đi với to-V."},"tip":"Muốn, mong, hứa, quyết, từ chối… đều hướng tới việc sắp làm → đi cửa **to**.","src":"tr. 142–144"},{"title":"Động từ + người + to-V; từ hỏi + to-V","icon":"👉","rule":"**tell, ask, advise, allow, want, invite, persuade, remind, warn, encourage** + **người** + **to-V**; sau **what / how / where / when / which / who** cũng dùng **to-V**.","explain":"Mẫu này nói 'bảo / nhờ / khuyên AI làm gì'. Người (tân ngữ) chen giữa động từ và to-V. Tiếng Việt nói 'mẹ bảo tôi đi', không có từ nối; tiếng Anh phải có to. Từ hỏi + to-V = 'nên làm gì / làm thế nào': I don't know what to say. Lưu ý: thường không dùng why + to-V.","formula":"V + người + to-V\nwhat / how / where + to-V","examples":[{"en":"He **advised me to visit** Westminster Abbey.","vi":"Anh ấy khuyên tôi đi thăm Tu viện Westminster."},{"en":"My boss **asked me to send** the report.","vi":"Sếp nhờ tôi gửi bản báo cáo."},{"en":"She **wants me to help** her.","vi":"Cô ấy muốn tôi giúp cô ấy."},{"en":"I don't know **what to say**.","vi":"Tôi không biết nói gì."},{"en":"Can you show me **how to use** this app?","vi":"Bạn chỉ tôi cách dùng ứng dụng này nhé?"},{"en":"She wants that I help her.","ok":false,"note":"want + người + to-V"}],"mistake":{"wrong":"My boss told me send the report.","right":"My boss told me to send the report.","why":"tell + người + **to-V**."},"src":"tr. 145","check":{"type":"fill","q":"The doctor advised him ___ smoking. (stop)","answer":["to stop"],"explain":"advise + người + **to-V**: advised him to stop.","src":"tr. 145"}},{"title":"Tính từ + to-V","icon":"😊","rule":"Sau tính từ chỉ cảm xúc, đánh giá (**pleased, happy, surprised, easy, impossible…**) dùng **to-V**; tính từ chỉ cách cư xử dùng **It's kind of you to…**; và **too / enough + to-V**.","explain":"I'm pleased to see you = tôi vui được gặp bạn. Khi việc là của người khác: tính từ + **for** + người + to-V (It's hard for me to wake up early). Tính từ khen / chê cách cư xử (kind, polite, stupid, careless) dùng **of**: It's kind of you to help. to-V còn đứng sau danh từ / đại từ bất định để nói mục đích (something to drink) và sau too / enough.","formula":"be + tính từ + to-V\nIt's + tính từ + for + người + to-V\nIt's + kind / stupid… + of + người + to-V\ntoo + tính từ + to-V · tính từ + enough + to-V","examples":[{"en":"I'm **pleased to see** you.","vi":"Tôi rất vui được gặp bạn."},{"en":"It's **kind of** you **to help** me.","vi":"Bạn thật tốt vì đã giúp tôi."},{"en":"It's hard **for me to wake** up early.","vi":"Dậy sớm thật khó với tôi."},{"en":"I'd like **something to drink**.","vi":"Tôi muốn uống chút gì đó."},{"en":"The box is **too heavy to carry**.","vi":"Cái hộp nặng quá, không mang nổi."},{"en":"He's old **enough to drive**.","vi":"Cậu ấy đủ tuổi lái xe."}],"mistake":{"wrong":"It's kind for you to help me.","right":"It's kind of you to help me.","why":"kind (tả cách cư xử) đi với **of**."},"src":"tr. 144–146"},{"title":"V nguyên mẫu không to","icon":"✂️","rule":"Dùng **V không to** sau **modal**, sau **let / make / see / hear / watch / feel + người**, và sau **had better, would rather, why not**.","explain":"make me clean = bắt tôi dọn; let me go = để tôi đi. Đây là chỗ người học hay thêm to thừa. Nhưng khi chuyển sang **bị động**, make / see / hear lại cần to: He was made **to** repeat the story. let không có bị động, thay bằng **be allowed to**: He was allowed to go home. help đi được cả hai: help me (to) carry.","formula":"let / make + người + V\nsee / hear / watch + người + V\nWhy not + V?","examples":[{"en":"Don't **let** the children **play** in the street.","vi":"Đừng để bọn trẻ chơi ngoài đường."},{"en":"They **made him repeat** the whole story.","vi":"Họ bắt anh ta kể lại toàn bộ câu chuyện."},{"en":"**Why not stay** for lunch?","vi":"Sao không ở lại ăn trưa?"},{"en":"He **was made to repeat** the story.","vi":"Anh ta bị bắt kể lại câu chuyện. (bị động → có to)"},{"en":"My mum made me to clean my room.","ok":false,"note":"make + người + V không to"}],"mistake":{"wrong":"He was let to go home.","right":"He was allowed to go home.","why":"let không dùng ở bị động; thay bằng be allowed to."},"tip":"**L**et và **M**ake 'cắt' chữ to ✂️ khi chủ động. Sang bị động (make) thì to quay lại.","src":"tr. 146–147"}],"practice":[{"type":"classify","q":"Theo sau là to-V hay V không to?","buckets":["+ to-V","+ V không to"],"items":[{"text":"decide","bucket":0},{"text":"can","bucket":1},{"text":"hope","bucket":0},{"text":"let (sb)","bucket":1},{"text":"promise","bucket":0},{"text":"make (sb)","bucket":1},{"text":"should","bucket":1},{"text":"tell (sb)","bucket":0}],"explain":"decide, hope, promise, tell sb → to-V. Modal (can, should) và let / make + người → V không to.","src":"tr. 143–147"},{"type":"mcq","q":"We can't afford ___ a new car.","options":["to buy","buy","buying"],"answer":0,"explain":"afford + **to-V**. (can't đứng trước afford chứ không trước buy.)","src":"tr. 143"},{"type":"mcq","q":"Don't let the dog ___ on the sofa.","options":["sleep","to sleep","sleeping"],"answer":0,"explain":"let + người/vật + **V không to**: let the dog sleep.","src":"tr. 146"},{"type":"fill","q":"My boss told me ___ the report by Friday. (finish)","answer":["to finish"],"explain":"tell + người + **to-V**: told me to finish.","src":"tr. 145"},{"type":"fill","q":"I don't know what ___. (say)","answer":["to say"],"explain":"Từ hỏi + to-V: what **to say** = nên nói gì.","src":"tr. 145"},{"type":"mcq","q":"It's very kind ___ you to help me.","options":["of","for"],"answer":0,"explain":"kind tả cách cư xử → **of** you. for dùng với tính từ như easy, hard: hard for me to…","src":"tr. 145"},{"type":"fill","q":"Why not ___ a taxi? (take)","answer":["take"],"explain":"Why not + **V không to**: Why not take a taxi?","src":"tr. 147"},{"type":"mcq","q":"Chọn câu đúng (bị động):","options":["He was made repeat the story.","He was made to repeat the story."],"answer":1,"explain":"Chủ động: made him repeat. Bị động thì to quay lại: was made **to** repeat.","src":"tr. 147"},{"type":"fix","wrong":"My parents made me to study every evening.","answer":["My parents made me study every evening."],"explain":"make + người + V không to: made me **study**.","src":"tr. 146"},{"type":"fix","wrong":"She wants that I help her.","answer":["She wants me to help her."],"explain":"want + người + to-V: wants **me to help** her.","src":"tr. 145"},{"type":"fix","wrong":"He was let to go home early.","answer":["He was allowed to go home early."],"explain":"let không có bị động → **was allowed to**.","src":"tr. 147"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Can","you","show","me","how","to","use","this","app?"],"explain":"how + to-V = cách làm: how **to use**.","src":"tr. 145"}],"flashcards":[{"front":"want / decide / hope + ?","back":"**to-V**: I decided **to stay**."},{"front":"tell / ask / advise + người + ?","back":"**to-V**: She told me **to wait**."},{"front":"let / make + người + ?","back":"**V không to**: They made him **repeat** it."},{"front":"It's kind ___ you to help.","back":"**of** (tính từ chỉ cách cư xử)"},{"front":"Bị động của 'They let him go'?","back":"**He was allowed to go.** (không nói was let)"}]},{"id":"06f","title":"Danh động từ V-ing; chọn -ing hay to-V","minutes":25,"goal":"Dùng V-ing sau enjoy, avoid, finish, mind… và sau mọi giới từ; phân biệt nghĩa của remember / forget / stop / try / regret + V-ing và + to-V.","pretest":[{"type":"mcq","q":"Câu nào đúng?","options":["I enjoy to cook.","I enjoy cooking."],"answer":1,"explain":"enjoy + **V-ing**: enjoy cooking.","src":"tr. 148"},{"type":"mcq","q":"'He stopped smoking' nghĩa là:","options":["Anh ấy bỏ thuốc","Anh ấy dừng lại để hút thuốc"],"answer":0,"explain":"stop + V-ing = thôi, bỏ việc đang làm. 'Dừng lại để hút' là stopped to smoke.","src":"tr. 152","shuffle":false}],"hook":{"icon":"🔄","text":"Thêm **-ing**, động từ 'hóa thân' thành danh từ: *swim* (bơi) → *swimming* (việc bơi). Tiếng Việt thêm chữ 'việc'; tiếng Anh thêm đuôi. Và có những động từ đổi nghĩa tùy bạn chọn -ing hay to: *stop smoking* (bỏ thuốc) khác hẳn *stop to smoke* (dừng lại để hút thuốc)."},"diagram":{"type":"flow","title":"Chọn V-ing hay to-V?","start":{"q":"Ngay trước là giới từ (in, on, of, to…)?","branches":[{"label":"Có","to":{"result":"V-ing: interested in learning","icon":"🔗"}},{"label":"Không","to":{"q":"Động từ đứng trước là gì?","branches":[{"label":"enjoy, avoid, finish, mind…","to":{"result":"V-ing: enjoy cooking","icon":"🏊"}},{"label":"want, decide, hope…","to":{"result":"to-V: decide to go","icon":"➡️"}},{"label":"remember, forget, stop","to":{"q":"Việc kia đã làm / đang làm chưa?","branches":[{"label":"Đã / đang làm","to":{"result":"V-ing: remember meeting her","icon":"⏪"}},{"label":"Chưa, sắp làm","to":{"result":"to-V: remember to lock the door","icon":"⏩"}}]}}]}}]}},"chunks":[{"title":"V-ing làm chủ ngữ và sau enjoy, avoid…","icon":"🏊","rule":"Danh động từ (gerund) **V-ing** dùng như danh từ: làm **chủ ngữ**, và đứng sau **enjoy, avoid, finish, mind, suggest, give up, keep, consider, can't stand, feel like, It's worth…**","explain":"Smoking = việc hút thuốc. Tiếng Việt nói 'hút thuốc có hại' được ngay; tiếng Anh phải biến động từ thành danh từ bằng -ing khi nó làm chủ ngữ. Danh sách động từ + V-ing cần học thuộc, giống danh sách + to-V ở bài trước.","formula":"V-ing + động từ (chủ ngữ)\nenjoy / avoid / finish / mind… + V-ing","examples":[{"en":"**Smoking** is bad for you.","vi":"Hút thuốc có hại cho bạn."},{"en":"I **enjoy cooking** for my family.","vi":"Tôi thích nấu ăn cho gia đình."},{"en":"Have you **finished doing** your homework?","vi":"Con làm bài tập xong chưa?"},{"en":"He **gave up smoking** last year.","vi":"Anh ấy bỏ thuốc từ năm ngoái."},{"en":"I **feel like going** out tonight.","vi":"Tối nay tôi muốn đi chơi."},{"en":"I enjoy to cook.","ok":false,"note":"enjoy + V-ing"}],"mistake":{"wrong":"I suggest to go by bus.","right":"I suggest going by bus.","why":"suggest + **V-ing**."},"src":"tr. 147–148"},{"title":"Sau giới từ luôn là V-ing","icon":"🔗","rule":"Sau **mọi giới từ** (in, on, of, at, about, for, from, to…) động từ phải ở dạng **V-ing**.","explain":"Giới từ chỉ đứng trước danh từ, nên động từ phải 'đội lốt danh từ' bằng -ing. Bẫy lớn: look forward **to** + V-ing, ở đây to là giới từ, không phải to của to-V. Sau after, before, when, while cũng dùng được V-ing: …when leaving your room. V-ing còn đứng sau need / deserve với nghĩa bị động: The plants need watering.","formula":"V + giới từ + V-ing (insist on paying)\nV + người + giới từ + V-ing (prevent sb from going)\ntính từ + giới từ + V-ing (interested in working)","examples":[{"en":"I'm **interested in learning** English.","vi":"Tôi thích học tiếng Anh."},{"en":"I **look forward to seeing** you.","vi":"Tôi mong được gặp bạn."},{"en":"She **insisted on paying** the bill.","vi":"Cô ấy nhất quyết đòi trả tiền."},{"en":"The rain **prevented** us **from going** out.","vi":"Cơn mưa khiến chúng tôi không ra ngoài được."},{"en":"Please turn off the light **when leaving** the room.","vi":"Vui lòng tắt đèn khi rời phòng."},{"en":"I look forward to see you.","ok":false,"note":"to là giới từ → seeing"}],"mistake":{"wrong":"I'm fond of dance.","right":"I'm fond of dancing.","why":"Sau giới từ of → **V-ing**."},"tip":"Thấy giới từ → bật đèn -ing 💡, kể cả look forward to và be used to.","src":"tr. 149–150","check":{"type":"fill","q":"Thank you for ___ me. (help)","answer":["helping"],"explain":"for là giới từ → **V-ing**: helping.","src":"tr. 149"}},{"title":"Đổi nghĩa: remember, forget, stop, try, regret","icon":"🔀","rule":"**remember / forget + to-V** = nhớ / quên việc **cần làm**; **+ V-ing** = nhớ / quên việc **đã làm**. **stop + V-ing** = thôi làm; **stop + to-V** = dừng lại **để** làm. **try + to-V** = cố gắng; **try + V-ing** = thử.","explain":"Hãy nhìn trình tự thời gian: to-V chỉ việc ở phía sau (chưa làm), V-ing chỉ việc đã hoặc đang làm. **regret + to-V** dùng để báo tin xấu (We regret to inform you…), **regret + V-ing** là hối tiếc việc đã làm. go on + V-ing = tiếp tục việc đang làm; go on + to-V = chuyển sang việc khác. mean + to-V = định làm; mean + V-ing = có nghĩa là.","diagram":{"type":"table","title":"Cùng động từ, khác nghĩa","head":["Động từ","+ to-V","+ V-ing"],"rows":[["remember / forget","nhớ / quên việc cần làm","nhớ / quên việc đã làm"],["stop","dừng lại để làm","thôi, ngừng làm"],["try","cố gắng","làm thử"],["regret","lấy làm tiếc phải báo","hối tiếc việc đã làm"],["go on","chuyển sang việc khác","tiếp tục việc đang làm"]]},"examples":[{"en":"Did you **remember to turn off** the gas?","vi":"Bạn có nhớ tắt ga không?"},{"en":"I **remember playing** there as a child.","vi":"Tôi nhớ hồi nhỏ từng chơi ở đó."},{"en":"He **stopped smoking** last year.","vi":"Anh ấy bỏ thuốc từ năm ngoái."},{"en":"We **stopped to buy** a newspaper.","vi":"Chúng tôi dừng lại để mua tờ báo."},{"en":"I **tried to open** the window, but it was stuck.","vi":"Tôi cố mở cửa sổ nhưng nó bị kẹt."},{"en":"**Try adding** some salt.","vi":"Thử thêm chút muối xem."}],"mistake":{"wrong":"Don't forget locking the door.","right":"Don't forget to lock the door.","why":"Việc chưa làm (sắp phải làm) → **to-V**."},"src":"tr. 151–153"},{"title":"Không đổi nghĩa, và có / không có tân ngữ","icon":"⚖️","rule":"**like, love, hate, prefer, begin, start, continue** + **V-ing** hay **to-V** đều được; **advise, allow, permit, recommend**: không có người → **V-ing**, có người → **người + to-V**.","explain":"I like swimming = I like to swim (người Anh có phân biệt nhẹ: like + V-ing là sở thích, like + to-V là lựa chọn / thói quen). Sau begin / start tránh hai -ing liền nhau: I'm beginning **to learn** karate. Nhóm advise / allow: They don't allow **smoking** here / They don't allow **us to smoke** here. Với động từ tri giác: see sb **do** = thấy trọn hành động; see sb **doing** = thấy lúc đang diễn ra.","formula":"like / love / hate / start + V-ing = + to-V\nallow / advise + V-ing\nallow / advise + người + to-V","examples":[{"en":"I **like swimming**. = I **like to swim**.","vi":"Tôi thích bơi."},{"en":"It **started raining**. = It **started to rain**.","vi":"Trời bắt đầu mưa."},{"en":"They don't **allow smoking** here.","vi":"Ở đây không cho phép hút thuốc."},{"en":"They don't **allow us to smoke** here.","vi":"Ở đây họ không cho chúng tôi hút thuốc."},{"en":"I **saw** them **cutting** the tree down.","vi":"Tôi thấy họ đang chặt cái cây."},{"en":"They don't allow us smoking here.","ok":false,"note":"có người → us to smoke"}],"mistake":{"wrong":"I'm beginning learning karate.","right":"I'm beginning to learn karate.","why":"Tránh hai dạng -ing liền nhau."},"src":"tr. 153–154"}],"practice":[{"type":"classify","q":"Động từ nào + V-ing, động từ nào + to-V?","buckets":["+ V-ing","+ to-V"],"items":[{"text":"enjoy","bucket":0},{"text":"decide","bucket":1},{"text":"avoid","bucket":0},{"text":"hope","bucket":1},{"text":"finish","bucket":0},{"text":"promise","bucket":1},{"text":"give up","bucket":0},{"text":"refuse","bucket":1}],"explain":"enjoy, avoid, finish, give up + V-ing; decide, hope, promise, refuse + to-V.","src":"tr. 143, 148"},{"type":"mcq","q":"Chọn câu đúng:","options":["Swimming is good for your health.","Swim is good for your health."],"answer":0,"explain":"Động từ làm chủ ngữ phải thành danh từ: **Swimming**.","src":"tr. 147"},{"type":"fill","q":"Would you mind ___ the window? (open)","answer":["opening"],"explain":"mind + **V-ing**: Would you mind opening…?","src":"tr. 148"},{"type":"fill","q":"She is good at ___ pictures. (draw)","answer":["drawing"],"explain":"at là giới từ → **V-ing**: good at drawing.","src":"tr. 149–150"},{"type":"mcq","q":"I look forward to ___ from you.","options":["hearing","hear"],"answer":0,"explain":"look forward to: to là giới từ → **hearing**.","src":"tr. 149"},{"type":"mcq","q":"'I remember locking the door' nghĩa là:","options":["Tôi nhớ là mình đã khóa cửa rồi","Tôi nhớ là phải khóa cửa (chưa khóa)"],"answer":0,"explain":"remember + V-ing = nhớ việc **đã làm**. Nhớ việc cần làm là remember to lock.","src":"tr. 151","shuffle":false},{"type":"fill","q":"Please remember ___ the lights before you go to bed. (turn off)","answer":["to turn off"],"explain":"Việc chưa làm, cần nhớ để làm → remember **to-V**.","src":"tr. 151"},{"type":"mcq","q":"Đang lái xe thấy mệt, chúng tôi dừng lại để nghỉ: 'We stopped ___ a rest.'","options":["to have","having"],"answer":0,"explain":"Dừng lại **để** làm việc khác → stop + **to-V**. stopped having a rest = thôi nghỉ, ngược nghĩa.","src":"tr. 152"},{"type":"mcq","q":"Câu nào SAI?","options":["It started to rain.","It started raining.","I'm starting learning French."],"answer":2,"explain":"start + V-ing hay to-V đều được, nhưng tránh hai -ing liền nhau: I'm starting **to learn** French.","src":"tr. 154"},{"type":"fix","wrong":"My doctor advised me stopping smoking.","answer":["My doctor advised me to stop smoking."],"explain":"advise có người (me) → người + **to-V**: advised me to stop.","src":"tr. 154"},{"type":"fix","wrong":"I'm not interested in learn French.","answer":["I'm not interested in learning French.","I am not interested in learning French."],"explain":"Sau giới từ in → **V-ing**: learning.","src":"tr. 150"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["He","gave","up","smoking","last","year."],"explain":"give up + V-ing: gave up **smoking**.","src":"tr. 148","answer":[["Last","year","he","gave","up","smoking."]]}],"flashcards":[{"front":"enjoy / avoid / finish / mind + ?","back":"**V-ing**: I enjoy **cooking**."},{"front":"Sau giới từ dùng dạng gì của động từ?","back":"**V-ing**: interested in **learning**, look forward to **seeing**"},{"front":"stop smoking khác stop to smoke?","back":"stop smoking = **bỏ** thuốc · stop to smoke = **dừng lại để** hút"},{"front":"remember to lock khác remember locking?","back":"to lock: nhớ **phải** khóa (chưa làm) · locking: nhớ **đã** khóa"},{"front":"try to do khác try doing?","back":"try to do = **cố gắng** · try doing = **thử**"}]},{"id":"06g","title":"Phân từ (-ing / -ed) và hệ từ","minutes":25,"goal":"Chọn đúng boring hay bored, dùng phân từ -ing / V3 để tả danh từ và rút gọn câu, và dùng hệ từ look, seem, sound, become… với tính từ.","pretest":[{"type":"mcq","q":"Phim dở quá: 'The film was ___.'","options":["boring","bored"],"answer":0,"explain":"Bộ phim **gây ra** sự chán → boring. bored là cảm giác của người xem.","src":"tr. 155"},{"type":"mcq","q":"Câu nào đúng?","options":["You look tired.","You look tiredly."],"answer":0,"explain":"look (trông có vẻ) là hệ từ → đi với **tính từ**: tired.","src":"tr. 159"}],"hook":{"icon":"🎬","text":"Một bộ phim **boring** khiến khán giả **bored**. Đuôi **-ing** là 'thủ phạm' gây ra cảm xúc, đuôi **-ed** là 'người chịu' cảm xúc. Tiếng Việt chỉ có một chữ 'chán' cho cả hai, nên người Việt rất hay nói nhầm *I'm boring* (tôi là người nhạt nhẽo!) khi muốn nói *I'm bored* (tôi thấy chán)."},"diagram":{"type":"flow","title":"Dùng V-ing hay V3 (-ed)?","start":{"q":"Từ đó tả cảm xúc hay hành động?","branches":[{"label":"Cảm xúc","to":{"q":"Gây ra hay cảm thấy?","branches":[{"label":"Gây ra cảm xúc","to":{"result":"V-ing: a boring film","icon":"🎬"}},{"label":"Cảm thấy cảm xúc","to":{"result":"V-ed: I'm bored","icon":"😴"}}]}},{"label":"Hành động","to":{"q":"Danh từ tự làm hay bị làm?","branches":[{"label":"Tự làm (chủ động)","to":{"result":"V-ing: falling leaves","icon":"🍂"}},{"label":"Bị làm (bị động)","to":{"result":"V3: stolen jewellery","icon":"💍"}}]}}]}},"chunks":[{"title":"boring hay bored?","icon":"😴","rule":"Phân từ **-ing** tả người / vật **gây ra** cảm xúc (boring, amusing); phân từ **-ed** tả người **cảm thấy** cảm xúc (bored, excited, disappointed).","explain":"Hiện tại phân từ (present participle, V-ing) và quá khứ phân từ (past participle, V3, thường là -ed) đều dùng được như tính từ. Hãy hỏi: ai làm cho ai có cảm xúc? Câu chuyện amusing làm người nghe amused. Nói 'I'm boring' nghĩa là 'tôi là người nhạt nhẽo', chắc bạn không muốn nói vậy.","formula":"người / vật gây ra + be + V-ing\nngười cảm thấy + be + V-ed","examples":[{"en":"It was an **amusing** story.","vi":"Đó là một câu chuyện thú vị."},{"en":"George has become very **boring**.","vi":"George trở nên rất nhạt nhẽo."},{"en":"The children were **excited** about the trip.","vi":"Bọn trẻ háo hức về chuyến đi."},{"en":"I was **disappointed** with the result.","vi":"Tôi thất vọng về kết quả."},{"en":"I'm very boring with this lesson.","ok":false,"note":"người cảm thấy chán → bored"}],"mistake":{"wrong":"I'm boring.","right":"I'm bored.","why":"Bạn **cảm thấy** chán → bored. I'm boring = tôi là người nhạt nhẽo."},"tip":"-ing = thủ phạm 🎬, -ed = nạn nhân 😴.","src":"tr. 155, 157","check":{"type":"mcq","q":"The news was ___. Everyone was very surprised.","options":["shocking","shocked"],"answer":0,"explain":"Tin tức **gây ra** cú sốc → shocking. Người nghe mới là shocked.","src":"tự soạn"}},{"title":"Phân từ nghĩa chủ động và bị động","icon":"🍂","rule":"**V-ing** mang nghĩa **chủ động** (danh từ tự làm: *falling leaves*); **V3** mang nghĩa **bị động** (danh từ bị làm: *stolen jewellery*). Hai dạng này cũng đứng **sau** danh từ để rút gọn câu.","explain":"falling leaves = lá đang rơi (lá tự rơi); stolen jewellery = đồ trang sức bị đánh cắp. Đứng sau danh từ: the girl **dancing** with your brother = the girl who is dancing…; the people **invited** to the party = the people who were invited… Lưu ý: không dùng V-ing thay cho một hành động đơn lẻ trong quá khứ (nói people **who saw** the accident). V-ing còn theo sau **spend / waste** (thời gian, tiền) và **be busy**: She's busy cooking.","formula":"V-ing + N (chủ động): the falling leaves\nV3 + N (bị động): the stolen jewellery\nN + V-ing… / N + V3…: the girl dancing…, the people invited…","examples":[{"en":"Look at the **falling** leaves.","vi":"Nhìn những chiếc lá đang rơi kìa."},{"en":"The police found the **stolen** jewellery.","vi":"Cảnh sát đã tìm thấy số trang sức bị đánh cắp."},{"en":"Who's the girl **dancing** with your brother?","vi":"Cô gái đang nhảy với anh trai bạn là ai thế?"},{"en":"Half of the people **invited** to the party didn't turn up.","vi":"Một nửa số người được mời dự tiệc đã không đến."},{"en":"He **spent** a lot of money **modernizing** the house.","vi":"Anh ấy tốn nhiều tiền để hiện đại hóa ngôi nhà."}],"mistake":{"wrong":"She's busy to cook dinner.","right":"She's busy cooking dinner.","why":"be busy + **V-ing**."},"src":"tr. 155, 157–158"},{"title":"Cụm phân từ: nối hai hành động","icon":"🔗","rule":"Hai hành động **cùng chủ ngữ** có thể rút gọn: thay một vế bằng cụm **V-ing** (chủ động) hoặc cụm **V3** (bị động).","explain":"Hai hành động liên tiếp → hành động xảy ra **trước** dùng V-ing: Mike opened the bottle and then poured… → **Opening** the bottle, Mike poured milk into his glass. Hành động sau là kết quả của hành động trước → V-ing cho hành động sau: She went out, **slamming** the door. Cụm V-ing còn thay mệnh đề chỉ lý do (Being the youngest child, …) hoặc thời gian (Walking along the street, …). Nghĩa bị động dùng V3: **Aroused** by the crash, he leapt to his feet.","formula":"V-ing …, S + V (cùng chủ ngữ)\nV3 …, S + V (nghĩa bị động)","examples":[{"en":"**Opening** the bottle, Mike poured milk into his glass.","vi":"Mở chai ra, Mike rót sữa vào ly."},{"en":"**Walking** along the street, I saw an accident.","vi":"Đang đi trên phố, tôi nhìn thấy một vụ tai nạn."},{"en":"She went out, **slamming** the door.","vi":"Cô ấy bỏ ra ngoài, đóng sầm cửa lại."},{"en":"**Aroused** by the crash, he leapt to his feet.","vi":"Bị tiếng va chạm đánh thức, anh ta bật dậy."},{"en":"Walking along the street, an accident happened.","ok":false,"note":"tai nạn không 'đi bộ': khác chủ ngữ"}],"tip":"Kiểm tra: chủ ngữ của vế chính có đúng là người làm hành động V-ing không? Không phải → câu sai.","src":"tr. 156–158"},{"title":"Hệ từ: look, seem, sound, become…","icon":"🪞","rule":"**Hệ từ** (linking verb) như **be, seem, look, sound, smell, taste, feel, become, get** nối chủ ngữ với **tính từ** (hoặc danh từ), không với trạng từ.","explain":"Hệ từ không tả hành động mà tả trạng thái: You look tired (trông bạn mệt): tired nói về 'bạn', nên là tính từ. Tiếng Việt 'trông mệt mỏi' không phân biệt tính từ / trạng từ nên người Việt dễ viết tiredly. Nhóm chỉ sự thay đổi hoặc không đổi: **become, get, grow, go, turn, stay, remain, keep** (The leaves are turning brown). Nhưng look, taste, feel, appear cũng có thể là động từ thường với nghĩa khác, khi đó đi với trạng từ: The boss looked at me **angrily** (nhìn: hành động).","diagram":{"type":"table","title":"Hệ từ hay động từ thường?","head":["Hệ từ + tính từ","Động từ thường + trạng từ"],"rows":[["You look unhappy. (trông)","He looked at me angrily. (nhìn)"],["This soup tastes good. (có vị)","She tasted the soup carefully. (nếm)"]]},"examples":[{"en":"Your argument **sounds right**.","vi":"Lập luận của bạn nghe có vẻ đúng."},{"en":"It's **getting colder**.","vi":"Trời đang lạnh dần."},{"en":"The leaves are **turning brown**.","vi":"Lá đang chuyển sang màu nâu."},{"en":"The boss looked at me **angrily**.","vi":"Ông chủ nhìn tôi một cách giận dữ."},{"en":"You look very unhappily.","ok":false,"note":"look (trông) + tính từ: unhappy"}],"mistake":{"wrong":"The food smells deliciously.","right":"The food smells delicious.","why":"smell (có mùi) là hệ từ → tính từ."},"src":"tr. 159"}],"practice":[{"type":"mcq","q":"I'm ___ in history. It's a really ___ subject.","options":["interested / interesting","interesting / interested","interested / interested"],"answer":0,"explain":"Tôi **cảm thấy** hứng thú → interested; môn học **gây ra** hứng thú → interesting.","src":"tự soạn"},{"type":"classify","q":"Câu nào đúng, câu nào sai?","buckets":["Đúng","Sai"],"items":[{"text":"I'm bored.","bucket":0},{"text":"I'm boring with this job.","bucket":1},{"text":"The trip was exciting.","bucket":0},{"text":"The children were excited.","bucket":0},{"text":"I was disappointing with the result.","bucket":1},{"text":"The news was shocked.","bucket":1}],"explain":"Người cảm thấy → -ed (bored, excited, disappointed). Vật gây ra cảm xúc → -ing (exciting, shocking).","src":"tr. 155, 157"},{"type":"fill","q":"We were very ___ when our team lost. (disappoint)","answer":["disappointed"],"explain":"Chúng tôi **cảm thấy** thất vọng → disappointed.","src":"tr. 157"},{"type":"fill","q":"That was an ___ story. We laughed a lot. (amuse)","answer":["amusing"],"explain":"Câu chuyện **gây ra** tiếng cười → amusing.","src":"tr. 155"},{"type":"mcq","q":"The police found the ___ car in a forest.","options":["stolen","stealing"],"answer":0,"explain":"Chiếc xe **bị** lấy cắp → nghĩa bị động → V3: stolen.","src":"tr. 157"},{"type":"mcq","q":"Who's the man ___ to your sister?","options":["talking","talked"],"answer":0,"explain":"Người đàn ông **đang** nói chuyện (tự làm) → V-ing: talking (= who is talking).","src":"tr. 157"},{"type":"mcq","q":"Half of the people ___ to the party didn't come.","options":["invited","inviting"],"answer":0,"explain":"Những người **được** mời → nghĩa bị động → V3: invited (= who were invited).","src":"tr. 158"},{"type":"mcq","q":"Chọn câu đúng:","options":["She is busy cooking dinner.","She is busy to cook dinner."],"answer":0,"explain":"be busy + **V-ing**.","src":"tr. 155"},{"type":"mcq","q":"Chọn câu đúng:","options":["This cake tastes delicious.","This cake tastes deliciously."],"answer":0,"explain":"taste (có vị) là hệ từ → tính từ: delicious.","src":"tr. 159"},{"type":"fix","wrong":"You look very tiredly today.","answer":["You look very tired today."],"explain":"look (trông) là hệ từ → tính từ: **tired**.","src":"tr. 159"},{"type":"fix","wrong":"I'm boring with this TV show.","answer":["I'm bored with this TV show.","I am bored with this TV show."],"explain":"Người **cảm thấy** chán → bored.","src":"tr. 155, 157"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Opening","the","bottle,","Mike","poured","some","milk."],"explain":"Hai hành động liên tiếp cùng chủ ngữ Mike: hành động trước (mở chai) thành cụm V-ing đặt đầu câu.","src":"tr. 156"}],"flashcards":[{"front":"boring khác bored thế nào?","back":"boring: **gây ra** sự chán (a boring film) · bored: **cảm thấy** chán (I'm bored)"},{"front":"falling leaves và stolen jewellery?","back":"V-ing: nghĩa **chủ động** · V3: nghĩa **bị động**"},{"front":"be busy / spend time + ?","back":"**V-ing**: She's busy **cooking**."},{"front":"look / seem / taste (hệ từ) + tính từ hay trạng từ?","back":"**Tính từ**: You look **tired**."},{"front":"Opening the bottle, Mike poured… = ?","back":"Mike opened the bottle **and then** poured… (cùng chủ ngữ)"}]}],"quiz":{"pass":0.8,"questions":[{"type":"mcq","q":"Câu nào SAI?","options":["Let's invite.","Please sit down.","We lost the match."],"answer":0,"explain":"invite là ngoại động từ, phải có tân ngữ (Let's invite Sally). sit là nội động từ; lost the match có tân ngữ.","src":"tr. 122"},{"type":"fill","q":"She ___ me a nice birthday card last week. (send)","answer":["sent"],"explain":"send bất quy tắc: send – **sent** – sent. Cấu trúc hai tân ngữ: sent **me** a card.","src":"tự soạn"},{"type":"mcq","q":"Trong câu 'Do you speak English?', **do** là:","options":["Trợ động từ (để tạo câu hỏi)","Động từ thường (nghĩa: làm)"],"answer":0,"explain":"Động từ chính là speak; do chỉ giúp tạo câu hỏi → trợ động từ.","src":"tr. 124","shuffle":false},{"type":"mcq","q":"After two hours, the firefighters ___ put out the fire.","options":["were able to","could to","can"],"answer":0,"explain":"Một lần cụ thể đã làm được trong quá khứ → **were able to**. could không đi với to; can là hiện tại.","src":"tr. 127"},{"type":"fix","wrong":"Do you can help me with this box?","answer":["Can you help me with this box?","Could you help me with this box?"],"explain":"Modal không mượn do: **Can** you help me…?","src":"tr. 124"},{"type":"mcq","q":"So với 'It may rain', câu 'It might rain' thì:","options":["Ít chắc hơn","Nói về quá khứ","Chắc chắn hơn"],"answer":0,"explain":"Ở nghĩa 'có lẽ', might **không** phải quá khứ của may; nó chỉ ít chắc hơn.","src":"tr. 128"},{"type":"mcq","q":"Hôm nay là ngày nghỉ: 'You ___ wear a uniform today.'","options":["don't have to","mustn't"],"answer":0,"explain":"Ngày nghỉ thì **không cần** mặc đồng phục → don't have to. mustn't là cấm, sai nghĩa.","src":"tr. 131"},{"type":"fill","q":"When I was a student, I ___ work at weekends to pay the rent. (phải)","answer":["had to"],"explain":"Quá khứ của 'phải' → **had to**; must không có quá khứ.","src":"tr. 130"},{"type":"mcq","q":"It's very cold. You ___ wear a coat, or you'll catch a cold.","options":["had better","had better to","must to"],"answer":0,"explain":"Lời khuyên cho tình huống cụ thể → **had better + V** (không to). must cũng không đi với to.","src":"tr. 136"},{"type":"mcq","q":"Lan didn't answer the phone. She ___ been asleep.","options":["may have","should have","may"],"answer":0,"explain":"Đoán chuyện đã qua, không chắc → **may have** + V3. should have = lẽ ra nên, sai nghĩa; 'may been' thiếu have.","src":"tr. 137"},{"type":"fix","wrong":"I use to play football when I was young.","answer":["I used to play football when I was young."],"explain":"Thói quen trong quá khứ → **used to** + V.","src":"tr. 140"},{"type":"mcq","q":"You ___ have bought milk. We already had two bottles.","options":["needn't","mustn't","can't"],"answer":0,"explain":"Đã mua nhưng hóa ra không cần → **needn't have** + V3.","src":"tr. 139"},{"type":"fill","q":"Can you tell me where ___ the tickets? (buy)","answer":["to buy"],"explain":"Từ hỏi + to-V: where **to buy** = mua ở đâu.","src":"tr. 145"},{"type":"mcq","q":"The teacher made us ___ the lesson again.","options":["read","to read","reading"],"answer":0,"explain":"make + người + **V không to**: made us read.","src":"tr. 146"},{"type":"mcq","q":"I'll never forget ___ the Great Wall for the first time.","options":["seeing","to see"],"answer":0,"explain":"Nhớ / quên một việc **đã làm** → forget + V-ing (thường trong I'll never forget…).","src":"tr. 151"},{"type":"fill","q":"He is thinking about ___ his job. (change)","answer":["changing"],"explain":"about là giới từ → **V-ing**: changing.","src":"tr. 149"},{"type":"classify","q":"Theo sau là V-ing hay to-V?","buckets":["V-ing","to-V"],"items":[{"text":"avoid","bucket":0},{"text":"manage","bucket":1},{"text":"insist on","bucket":0},{"text":"agree","bucket":1},{"text":"can't stand","bucket":0},{"text":"advise (sb)","bucket":1}],"explain":"avoid, insist on (giới từ), can't stand + V-ing; manage, agree, advise sb + to-V.","src":"tr. 143–145, 148–149"},{"type":"mcq","q":"Everyone was ___ by the ___ news.","options":["shocked / shocking","shocking / shocked"],"answer":0,"explain":"Mọi người **cảm thấy** sốc → shocked; tin tức **gây ra** sốc → shocking.","src":"tự soạn"},{"type":"fix","wrong":"The flowers smell beautifully.","answer":["The flowers smell beautiful."],"explain":"smell (có mùi) là hệ từ → tính từ: beautiful.","src":"tr. 159"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I'm","not","used","to","getting","up","early."],"explain":"be used to + V-ing = quen với: not used to **getting** up.","src":"tr. 141–142"}]}},{"id":"07-cum-dong-tu","title":"Cụm động từ","en":"Phrasal verbs","icon":"🧩","pages":"169–185","summary":"Cụm động từ là động từ ghép với một từ nhỏ như up, off, out, after… để tạo ra nghĩa mới: put off = hoãn, look after = chăm sóc. Chủ đề này dạy bạn đặt tân ngữ đúng chỗ (tear it up chứ không phải tear up it) và khoảng 30 cụm hay gặp nhất trong danh sách của sách.","mindmap":{"label":"Cụm động từ","children":[{"label":"Là gì?","icon":"🧩","children":[{"label":"V + tiểu từ: come in"},{"label":"Nghĩa mới: put off = hoãn"},{"label":"Nhiều nghĩa: go off"}]},{"label":"Ngoại / nội động","icon":"🎯","children":[{"label":"Cần tân ngữ: tear up the letter"},{"label":"Không cần: eat out"}]},{"label":"Vị trí tân ngữ","icon":"✂️","children":[{"label":"Tách rời: tear it up"},{"label":"Không tách: look after her"},{"label":"3 thành phần: look forward to"}]},{"label":"Cụm thông dụng 1","icon":"🗂️","children":[{"label":"Tiếp tục, dừng, hủy, đợi"},{"label":"Hằng ngày: get up, hand in"},{"label":"Con người: bring up, let down"}]},{"label":"Cụm thông dụng 2","icon":"💡","children":[{"label":"Bật/tắt, mặc/cởi"},{"label":"Đi lại: set off, pick up"},{"label":"look up, run out of, turn down"}]}]},"lessons":[{"id":"07a","title":"Cụm động từ là gì? Tân ngữ đặt ở đâu?","minutes":25,"goal":"Hiểu cụm động từ là gì, vì sao không đoán nghĩa bằng cách cộng từng từ, và đặt tân ngữ đúng chỗ: tear it up chứ không phải tear up it.","pretest":[{"type":"mcq","q":"'Could you **look after** the kids while I'm out?' — look after nghĩa là gì?","options":["nhìn phía sau","chăm sóc, trông nom","tìm kiếm"],"answer":1,"explain":"look after = chăm sóc. Nghĩa của cả cụm khác hẳn nghĩa của look (nhìn) và after (sau).","src":"tr. 169"},{"type":"mcq","q":"Chọn câu đúng:","options":["She read the letter and then tore up it.","She read the letter and then tore it up."],"answer":1,"explain":"Tân ngữ là đại từ (it) thì phải chen vào giữa: tore **it** up.","src":"tr. 170"}],"hook":{"icon":"🧩","text":"Tiếng Việt có 'nhìn ra' nghĩa là **nhận ra** — đâu phải nhìn ra ngoài cửa. Tiếng Anh cũng ghép động từ với một từ nhỏ như **up, off, out, after** để tạo ra nghĩa mới: put (đặt) + off = **put off** — hoãn lại. Hãy coi mỗi cụm như một miếng ghép mới: học cả miếng, đừng cộng nghĩa từng mảnh. Và nhớ thêm một việc: tân ngữ (người/vật chịu tác động) được đặt ở đâu trong miếng ghép đó."},"diagram":{"type":"flow","title":"Tân ngữ đặt ở đâu?","start":{"q":"Cụm này tách rời được không? (học theo từng cụm)","branches":[{"label":"Không (look after, 3 thành phần)","to":{"result":"V + tiểu từ + tân ngữ: look after her","icon":"🔒"}},{"label":"Có (tear up, throw away)","to":{"q":"Tân ngữ là gì?","branches":[{"label":"Đại từ: it, them, me…","to":{"result":"Bắt buộc ở giữa: tear it up","icon":"✂️"}},{"label":"Danh từ ngắn","to":{"result":"Trước hay sau đều được","icon":"↔️"}},{"label":"Cụm từ dài","to":{"result":"Thường đặt sau tiểu từ","icon":"➡️"}}]}}]}},"chunks":[{"title":"Cụm động từ là gì?","icon":"🧩","rule":"Cụm động từ = **động từ + trạng từ/giới từ** (đôi khi cả hai), tạo thành một động từ mới, thường có **nghĩa đặc biệt**.","explain":"Từ nhỏ đi sau (in, off, up, out, after…) gọi chung là tiểu từ. Một số cụm có nghĩa rõ ràng, đoán được: come in (vào), come back (quay lại), turn round (quay người lại). Nhưng **phần lớn** có nghĩa khác hẳn từng từ: put off không phải 'đặt ra' mà là 'hoãn lại'. Một cụm còn có thể có **nhiều nghĩa**: go off = (bom) nổ, (đèn) tắt, (sữa) chua.","formula":"động từ + tiểu từ: come in, put off\nđộng từ + tiểu từ + giới từ: look forward to","examples":[{"en":"Would you like to **come in** and have a drink?","vi":"Bạn có muốn vào trong uống chút gì không?"},{"en":"We had to **put off** the meeting till Tuesday.","vi":"Chúng tôi phải hoãn cuộc họp đến thứ Ba."},{"en":"Could you **look after** the kids while I'm out?","vi":"Bạn trông bọn trẻ giúp tôi lúc tôi ra ngoài được không?"},{"en":"The milk **went off** this morning.","vi":"Sáng nay sữa bị chua."}],"mistake":{"wrong":"put off = đặt ra (đoán từng từ)","right":"put off = hoãn lại: We put off the meeting.","why":"Phần lớn cụm động từ có nghĩa mới; phải học cả cụm."},"tip":"Gặp cụm lạ: tra **cả cụm** trong từ điển, đừng tra từng từ.","src":"tr. 169","check":{"type":"mcq","q":"'The bomb **went off**.' — went off ở đây nghĩa là gì?","options":["nổ","đi xa","rẻ đi"],"answer":0,"explain":"Với bom, go off = nổ. Cùng cụm này với đèn nghĩa là tắt, với sữa là chua — nghĩa tùy ngữ cảnh.","src":"tr. 169"}},{"title":"Ngoại động, nội động và văn nói","icon":"💬","rule":"Cụm động từ có thể **cần tân ngữ** (ngoại động) hoặc **không cần** (nội động); chúng hay dùng trong **văn nói, thân mật**.","explain":"Tân ngữ (object) là người/vật chịu tác động của động từ: the letter trong 'tore up the letter'. tear up cần tân ngữ (xé cái gì). eat out thì không (ăn ở ngoài là đủ nghĩa). Một số cụm dùng được cả hai kiểu: shut up (im đi) / shut the kids up (làm bọn trẻ im). Về văn phong: cụm động từ nghe tự nhiên, thân mật (turn up); từ một chữ cùng nghĩa nghe trịnh trọng hơn (arrive).","examples":[{"en":"She **tore up** the letter.","vi":"Cô ấy xé nát lá thư. (ngoại động)"},{"en":"Shall we **eat out** tonight?","vi":"Tối nay mình ăn tiệm nhé? (nội động)"},{"en":"What time are you planning to **turn up**?","vi":"Mấy giờ bạn định tới? (thân mật)"},{"en":"Please let me know when you plan to **arrive**.","vi":"Vui lòng cho tôi biết khi nào ông định đến. (trịnh trọng)"}],"tip":"Nói chuyện với bạn bè → cụm động từ (turn up). Thư trang trọng → một từ (arrive).","src":"tr. 169–170"},{"title":"Tách rời được: đại từ phải chen giữa","icon":"✂️","rule":"Với cụm **tách rời được**, tân ngữ danh từ đứng **trước hoặc sau** tiểu từ; tân ngữ **đại từ** (me, it, him, them…) **luôn đứng giữa**.","explain":"tear up the letter = tear the letter up — cả hai đều đúng. Nhưng thay the letter bằng it thì chỉ còn một cách: tear **it** up. Tiếng Việt nói 'xé nát nó' (nó đứng cuối) nên người Việt hay viết tear up it — sai.","formula":"V + tiểu từ + danh từ = V + danh từ + tiểu từ\nV + đại từ + tiểu từ (bắt buộc)","examples":[{"en":"I'll **throw away** these newspapers. = I'll **throw** these newspapers **away**.","vi":"Tôi sẽ vứt những tờ báo này."},{"en":"She read the letter and then **tore it up**.","vi":"Cô ấy đọc thư rồi xé nát."},{"en":"She read the letter and then tore up it.","ok":false,"note":"đại từ it phải đứng giữa"},{"en":"Do you want these newspapers or shall I **throw them away**?","vi":"Bạn có cần mấy tờ báo này không, không thì tôi vứt nhé?"}],"mistake":{"wrong":"Shall I throw away them?","right":"Shall I throw them away?","why":"Tân ngữ là đại từ → luôn đứng giữa động từ và tiểu từ."},"tip":"Đại từ nhỏ như nhân bánh — kẹp vào giữa: throw **them** away.","src":"tr. 170","check":{"type":"mcq","q":"(these old shoes) Chọn câu đúng:","options":["Throw them away.","Throw away them."],"answer":0,"explain":"them là đại từ nên đứng giữa throw và away.","src":"tr. 170"}},{"title":"Không tách rời và cụm ba thành phần","icon":"🔒","rule":"Cụm **không tách rời**: tân ngữ luôn đứng **sau tiểu từ**. Cụm **ba thành phần** (look forward to, keep up with) thường không tách rời được.","explain":"Nói 'looks after her younger sister', không nói 'looks her younger sister after'. Sách không cho quy tắc chung để biết cụm nào tách được, nên hãy học vị trí tân ngữ cùng với nghĩa của từng cụm. Thêm một điều: tân ngữ là **cụm từ dài** thường đặt sau tiểu từ cho dễ nghe: tore up all the letters he had sent her.","formula":"V + tiểu từ (+ giới từ) + tân ngữ\nlook after her · look forward to Christmas","examples":[{"en":"Sally **looks after** her younger sister while her mother's at work.","vi":"Sally chăm em gái khi mẹ đi làm."},{"en":"Sally looks her younger sister after.","ok":false,"note":"look after không tách rời"},{"en":"I **came across** an old photo in my drawer.","vi":"Tôi tình cờ tìm thấy một tấm ảnh cũ trong ngăn kéo."},{"en":"You're walking too fast. I can't **keep up with** you.","vi":"Bạn đi nhanh quá. Tôi theo không kịp."},{"en":"Children **look forward to** Christmas.","vi":"Trẻ em mong chờ Giáng sinh."}],"mistake":{"wrong":"I came an old photo across.","right":"I came across an old photo.","why":"come across không tách rời: tân ngữ đứng sau across."},"tip":"Ba thành phần = ba toa tàu nối liền, không chen gì vào giữa.","src":"tr. 170–171"}],"practice":[{"type":"mcq","q":"Cụm nào có nghĩa **rõ ràng**, đoán được từ từng từ?","options":["come back","put off","look after"],"answer":0,"explain":"come back = quay lại, đúng nghĩa come + back. put off (hoãn) và look after (chăm sóc) có nghĩa đặc biệt.","src":"tr. 169"},{"type":"classify","q":"Cụm nào cần tân ngữ, cụm nào không?","buckets":["Cần tân ngữ (ngoại động)","Không cần (nội động)"],"items":[{"text":"tear up (the letter)","bucket":0},{"text":"eat out","bucket":1},{"text":"throw away (the papers)","bucket":0},{"text":"come in","bucket":1},{"text":"look after (the kids)","bucket":0}],"explain":"tear up, throw away, look after phải có người/vật đi kèm; eat out, come in tự đủ nghĩa.","src":"tr. 169–170"},{"type":"classify","q":"Xếp theo cách đặt tân ngữ (theo ví dụ trong sách):","buckets":["Tách rời được","Không tách rời"],"items":[{"text":"tear up","bucket":0},{"text":"throw away","bucket":0},{"text":"look after","bucket":1},{"text":"come across","bucket":1},{"text":"look forward to","bucket":1},{"text":"keep up with","bucket":1}],"explain":"Sách: tear the letter up, throw them away (tách được); looks after her sister, came across an old photo (không tách); cụm ba thành phần không tách.","src":"tr. 170–171"},{"type":"mcq","q":"Chọn đáp án đúng:","options":["I'll throw away these newspapers.","I'll throw these newspapers away.","Cả hai câu đều đúng."],"answer":2,"shuffle":false,"explain":"throw away tách rời được, tân ngữ là danh từ nên đứng trước hay sau away đều đúng.","src":"tr. 170"},{"type":"mcq","q":"Chọn câu đúng:","options":["Could you look after him?","Could you look him after?"],"answer":0,"explain":"look after không tách rời: tân ngữ (kể cả him) đứng sau after.","src":"tự soạn"},{"type":"fill","q":"It's raining, so we had to ___ the picnic till next Sunday. (hoãn lại)","answer":["put off"],"explain":"put off = hoãn lại. Nghĩa này không đoán được từ put + off.","src":"tự soạn"},{"type":"fill","q":"I don't need these old letters. I'll tear ___. (đại từ + tiểu từ)","answer":["them up"],"hint":"Đại từ chen giữa","explain":"Tân ngữ là đại từ (them) phải đứng giữa: tear **them** up, không phải tear up them.","src":"tự soạn"},{"type":"fix","wrong":"I like this dress. Can I try on it?","answer":["I like this dress. Can I try it on?"],"explain":"try on tách rời được; tân ngữ là đại từ it nên phải đứng giữa: try it on.","src":"tr. 180"},{"type":"fix","wrong":"I came an old photo across in my drawer.","answer":["I came across an old photo in my drawer."],"explain":"come across không tách rời: tân ngữ an old photo đứng sau across.","src":"tr. 170"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I'm","looking","forward","to","the","holiday."],"explain":"look forward to là cụm ba thành phần, đi liền nhau, tân ngữ đứng sau to.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Shall","I","throw","them","away?"],"explain":"Đại từ them chen giữa throw và away.","src":"tr. 170"}],"flashcards":[{"front":"Cụm động từ (phrasal verb) là gì?","back":"Động từ + trạng từ/giới từ (đôi khi cả hai), thường có nghĩa mới: **put off** = hoãn"},{"front":"tear up the letter → thay the letter bằng it?","back":"tear **it** up (không phải tear up it)"},{"front":"Cụm tách rời được + tân ngữ là danh từ: đặt ở đâu?","back":"Trước hoặc sau tiểu từ: throw the papers away = throw away the papers"},{"front":"look after her hay look her after?","back":"**look after her** — look after không tách rời"},{"front":"Cụm ba thành phần (look forward to) có tách được không?","back":"Không. I'm looking forward to the trip."},{"front":"turn up và arrive khác nhau thế nào?","back":"Cùng nghĩa 'đến'; **turn up** thân mật (văn nói), **arrive** trịnh trọng"}]},{"id":"07b","title":"Cụm động từ thông dụng (nhóm 1)","minutes":25,"goal":"Nhớ nghĩa và dùng được 15 cụm hay gặp: carry on, go on, give up, call off, hold on · get up, get on, get off, break down, fill in, hand in · bring up, grow up, look after, look for, let down.","pretest":[{"type":"mcq","q":"'They had to **call off** the match.' — call off nghĩa là gì?","options":["gọi tên","hủy bỏ","tiếp tục"],"answer":1,"explain":"call off = hủy bỏ (= cancel).","src":"tr. 172"},{"type":"mcq","q":"'He **gave up** alcohol over three years ago.' — gave up nghĩa là gì?","options":["bỏ, từ bỏ","tặng cho","mua thêm"],"answer":0,"explain":"give up = bỏ, từ bỏ (= stop).","src":"tr. 175"}],"hook":{"icon":"🗂️","text":"Danh sách trong sách có khoảng **120 cụm** — học hết một lần thì quên hết. Bí quyết: chia thành từng **ngăn kéo** theo chủ đề, mỗi ngăn khoảng 5 cụm, và nhớ mỗi cụm cùng **một từ đồng nghĩa** mà sách ghi kèm: carry on = continue, call off = cancel… Hôm nay bạn mở 3 ngăn kéo."},"diagram":{"type":"mindmap","title":"3 ngăn kéo hôm nay","root":{"label":"Nhóm 1","children":[{"label":"Tiếp tục / dừng","icon":"▶️","children":[{"label":"carry on, go on = continue"},{"label":"give up = stop"},{"label":"call off = cancel"},{"label":"hold on = wait"}]},{"label":"Hằng ngày","icon":"🏠","children":[{"label":"get up · get on / get off"},{"label":"break down (máy hỏng)"},{"label":"fill in · hand in = submit"}]},{"label":"Con người","icon":"👪","children":[{"label":"bring up = raise · grow up"},{"label":"look after · look for"},{"label":"let down (làm thất vọng)"}]}]}},"chunks":[{"title":"Tiếp tục, dừng, hủy, đợi","icon":"▶️","rule":"**carry on / go on** = tiếp tục (continue); **give up** = bỏ (stop); **call off** = hủy (cancel); **hold on** = đợi (wait).","explain":"Sách ghi kèm một từ đồng nghĩa trong ngoặc cho các cụm này — hãy học theo cặp: cụm động từ (nói hằng ngày) ↔ một từ (trịnh trọng hơn). Sau carry on có thể là động từ -ing: carried on **working** (tiếp tục làm việc).","formula":"carry on = go on = continue\ngive up = stop · call off = cancel · hold on = wait","examples":[{"en":"Everybody **carried on** working as usual.","vi":"Mọi người vẫn tiếp tục làm việc như thường lệ."},{"en":"He **gave up** alcohol over three years ago.","vi":"Ông ấy đã bỏ rượu hơn ba năm trước."},{"en":"They had to **call off** the match as the ground was too wet to play on.","vi":"Họ phải hủy trận đấu vì mặt sân quá ướt."},{"en":"Just **hold on** for a minute, please.","vi":"Vui lòng đợi một lát."}],"mistake":{"wrong":"They had to call up the match.","right":"They had to call off the match.","why":"call up = gọi điện; hủy là call **off**."},"tip":"**off** gợi 'tắt, rời ra' → call off: tắt luôn kế hoạch = hủy.","src":"tr. 172, 175–176","check":{"type":"fill","q":"Just ___ a minute, please. I'll get him. (đợi)","answer":["hold on"],"explain":"hold on = đợi (= wait), hay dùng khi nghe điện thoại.","src":"tr. 176"}},{"title":"Đời sống hằng ngày","icon":"🏠","rule":"**get up** = thức dậy; **get on / get off** = lên / xuống (xe, tàu); **break down** = (máy, xe) hỏng; **fill in** = điền (vào đơn); **hand in** = nộp (submit).","explain":"Tiếng Việt nói 'lên xe', 'xuống xe' — tiếng Anh dùng **on** (lên) và **off** (xuống, rời): get on the train, get off the bus. break down dùng cho máy móc, xe cộ bị hỏng. fill in và hand in là cặp quen thuộc ở trường, nơi làm việc: điền đơn rồi nộp. Sách cho ví dụ 'fill your name in the form' — tức fill in tách rời được, nên với đại từ: fill **it** in.","examples":[{"en":"What time do you **get up**?","vi":"Mấy giờ bạn thức dậy?"},{"en":"I **got on** the train at Glasgow.","vi":"Tôi lên tàu ở Glasgow."},{"en":"This is where I **get off** – I'll call you!","vi":"Tôi xuống ở đây – tôi sẽ gọi cho bạn nhé!"},{"en":"His car **broke down** on the way to the airport.","vi":"Xe anh ấy bị hỏng trên đường ra sân bay."},{"en":"Please **fill** your name, address, and telephone number **in** the form.","vi":"Hãy điền tên, địa chỉ và số điện thoại của bạn vào mẫu đơn."},{"en":"All essays must be **handed in** by Friday.","vi":"Tất cả bài luận phải được nộp trước thứ Sáu."}],"mistake":{"wrong":"Here's the form. Please fill in it.","right":"Here's the form. Please fill it in.","why":"fill in tách rời được → đại từ it đứng giữa (bài 07a)."},"tip":"Lên xe = get **on**, xuống xe = get **off** — on/off như bật/tắt.","src":"tr. 171, 174–175"},{"title":"Con người với nhau","icon":"👪","rule":"**bring up** = nuôi nấng (raise); **grow up** = lớn lên; **look after** = chăm sóc (take care of); **look for** = tìm (search for); **let down** = làm thất vọng.","explain":"bring up cần tân ngữ (nuôi **ai**), grow up thì không (tự mình lớn lên). bring up hay gặp ở bị động: he was brought up by his grandmother (anh ấy **được** bà nuôi). Cẩn thận họ look: look **after** (chăm sóc) ≠ look **for** (tìm). let down tách rời được: let **me** down.","examples":[{"en":"After his parents died, he was **brought up** by his grandmother.","vi":"Sau khi cha mẹ mất, anh ấy được bà nuôi dưỡng."},{"en":"The kids have all **grown up** now.","vi":"Giờ bọn trẻ đều đã lớn cả rồi."},{"en":"Will you **look after** my parrot when I'm away?","vi":"Khi tôi đi vắng, bạn trông con vẹt giúp tôi nhé?"},{"en":"What are you **looking for**?","vi":"Bạn đang tìm gì vậy?"},{"en":"Joey promised he'd phone today, but he **let** me **down** again.","vi":"Joey hứa hôm nay sẽ gọi, nhưng anh ấy lại làm tôi thất vọng."}],"mistake":{"wrong":"He let down me again.","right":"He let me down again.","why":"let down tách rời được; đại từ me đứng giữa."},"tip":"look **after** = đứng sau che chở → chăm sóc; look **for** = nhìn để tìm.","src":"tr. 172, 175–176","check":{"type":"mcq","q":"I can't find my keys. I'm ___ them.","options":["looking for","looking after"],"answer":0,"explain":"Tìm chìa khóa → look for. look after là chăm sóc.","src":"tự soạn"}}],"practice":[{"type":"mcq","q":"carry on cùng nghĩa với từ nào?","options":["continue","cancel","carry"],"answer":0,"explain":"carry on = continue (tiếp tục). Không phải 'mang' như carry.","src":"tr. 172"},{"type":"classify","q":"Nối mỗi cụm với từ đồng nghĩa (theo sách):","buckets":["continue","stop","cancel","wait"],"items":[{"text":"carry on","bucket":0},{"text":"go on","bucket":0},{"text":"give up","bucket":1},{"text":"call off","bucket":2},{"text":"hold on","bucket":3}],"explain":"carry on, go on = continue; give up = stop; call off = cancel; hold on = wait.","src":"tr. 172, 175–176"},{"type":"mcq","q":"The bus stopped in front of my house and I ___ .","options":["got off","called off","handed in"],"answer":0,"explain":"Xuống xe buýt = get off. call off (hủy) và hand in (nộp) cần tân ngữ và sai nghĩa.","src":"tự soạn"},{"type":"fill","q":"My car ___ on the way to work, so I was late. (bị hỏng, quá khứ)","answer":["broke down"],"explain":"break down = (xe, máy) hỏng; quá khứ của break là broke.","src":"tự soạn"},{"type":"fill","q":"Please ___ your homework by Friday. (nộp)","answer":["hand in"],"explain":"hand in = nộp (= submit).","src":"tự soạn"},{"type":"fill","q":"I was ___ by my grandparents in a small village. (nuôi nấng)","answer":["brought up"],"explain":"Bị động: was brought up = được nuôi nấng. bring → brought.","src":"tự soạn"},{"type":"fill","q":"They had to ___ the party because of the storm. (hủy)","answer":["call off"],"explain":"call off = hủy (= cancel). Đừng nhầm với call up (gọi điện).","src":"tự soạn"},{"type":"fix","wrong":"Here's the form. Please fill in it.","answer":["Here's the form. Please fill it in."],"explain":"fill in tách rời được; tân ngữ là đại từ it phải đứng giữa.","src":"tự soạn"},{"type":"fix","wrong":"My sister looks for my baby when I'm at work.","answer":["My sister looks after my baby when I'm at work."],"explain":"Trông em bé = look after (chăm sóc). look for là tìm kiếm.","src":"tự soạn"},{"type":"fix","wrong":"I promised to help him, but I let down him.","answer":["I promised to help him, but I let him down."],"explain":"let down tách rời được; đại từ him chen giữa: let him down.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Everybody","carried","on","working","as","usual."],"explain":"carry on + V-ing = tiếp tục làm gì.","src":"tr. 172"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["He","was","brought","up","by","his","grandmother."],"explain":"Bị động của bring up: was brought up by + người nuôi.","src":"tr. 172"}],"flashcards":[{"front":"carry on / go on = ?","back":"tiếp tục (= continue): Everybody **carried on** working."},{"front":"give up = ?","back":"bỏ, từ bỏ (= stop): He **gave up** alcohol."},{"front":"call off = ?","back":"hủy bỏ (= cancel): They **called off** the match."},{"front":"hold on = ?","back":"đợi (= wait): **Hold on*
