        n.kids.forEach(function (k, i) { place(k, y, x + n.w + HG, depth + 1, depth === 0 ? PALETTE[i % PALETTE.length] : color); y += k.sh + GAP; });
        var f = n.kids[0], l = n.kids[n.kids.length - 1];
        n.y = (f.y + f.h / 2 + l.y + l.h / 2) / 2 - n.h / 2;
      } else n.y = top + (n.sh - n.h) / 2;
      maxX = Math.max(maxX, n.x + n.w);
    }
    place(root, 6, 6, 0, '--c1');
    var links = [], nodes = [];
    (function walk(n) {
      nodes.push(svgNode(n, n.color, n.depth === 0 ? 'root' : 'map', n.depth * 180));
      n.kids.forEach(function (k) {
        var x1 = n.x + n.w, y1 = n.y + n.h / 2, x2 = k.x, y2 = k.y + k.h / 2, mx = (x1 + x2) / 2;
        links.push('<path class="link" style="stroke:var(' + k.color + ');animation-delay:' + (n.depth * 180 + 80) + 'ms" d="M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2 + '"/>');
        walk(k);
      });
    })(root);
    var W = maxX + 6, H = root.sh + 12;
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" style="max-width:none">' + links.join('') + nodes.join('') + '</svg>';
  }
  function renderFlow(d) {
    var root = toTree(d.start, 'flow');
    var NW = 176;
    measure(root, 22, NW);
    var GAP = 18, maxDepth = 0, rowH = [];
    function sw(n, depth) {
      maxDepth = Math.max(maxDepth, depth); rowH[depth] = Math.max(rowH[depth] || 0, n.h);
      var s = n.kids.reduce(function (a, k) { return a + sw(k, depth + 1); }, 0) + GAP * Math.max(0, n.kids.length - 1);
      // leave room for the label on the edge coming into this node
      var lw = n.edge ? n.edge.length * 7 + 20 : 0;
      n.sw = Math.max(NW, s, lw); return n.sw;
    }
    sw(root, 0);
    var VG = 54, rowY = [6];
    for (var i = 1; i <= maxDepth; i++) rowY[i] = rowY[i - 1] + rowH[i - 1] + VG;
    function place(n, left, depth) {
      n.depth = depth; n.y = rowY[depth];
      if (n.kids.length) {
        var sum = n.kids.reduce(function (a, k) { return a + k.sw; }, 0) + GAP * (n.kids.length - 1);
        var x = left + (n.sw - sum) / 2;
        n.kids.forEach(function (k) { place(k, x, depth + 1); x += k.sw + GAP; });
        var f = n.kids[0], l = n.kids[n.kids.length - 1];
        n.x = (f.x + l.x + l.w) / 2 - n.w / 2;
      } else n.x = left + (n.sw - n.w) / 2;
    }
    place(root, 6, 0);
    var links = [], nodes = [], labels = [];
    (function walk(n) {
      nodes.push(svgNode(n, '--c1', n.role, n.depth * 260));
      n.kids.forEach(function (k) {
        var x1 = n.x + n.w / 2, y1 = n.y + n.h, x2 = k.x + k.w / 2, y2 = k.y, my = (y1 + y2) / 2;
        var dl = n.depth * 260 + 120;
        links.push('<path class="link" style="stroke:var(--muted);animation-delay:' + dl + 'ms" d="M' + x1 + ',' + y1 + ' C' + x1 + ',' + my + ' ' + x2 + ',' + my + ' ' + x2 + ',' + y2 + '"/>');
        if (k.edge) {
          var lx = x2, ly = y2 - 12, lw = k.edge.length * 7 + 12;
          labels.push('<g class="elabel-g" style="animation-delay:' + (dl + 200) + 'ms"><rect class="elabel-bg" x="' + (lx - lw / 2) + '" y="' + (ly - 13) + '" width="' + lw + '" height="18" rx="9"/><text class="elabel" x="' + lx + '" y="' + ly + '" text-anchor="middle">' + esc(k.edge) + '</text></g>');
        }
        walk(k);
      });
    })(root);
    var W = root.sw + 12, H = rowY[maxDepth] + rowH[maxDepth] + 8;
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" style="max-width:none">' + links.join('') + labels.join('') + nodes.join('') + '</svg>';
  }
  function renderTable(d) {
    var h = '<div class="table-wrap"><table class="cmp"><thead><tr>' + d.head.map(function (c) { return '<th>' + fmt(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
    h += d.rows.map(function (r, i) { return '<tr style="animation-delay:' + i * 90 + 'ms">' + r.map(function (c) { return '<td>' + fmt(c) + '</td>'; }).join('') + '</tr>'; }).join('');
    return h + '</tbody></table></div>';
  }
  function diagram(d) {
    if (!d) return null;
    var box = el('div', { class: 'diagram reveal' });
    if (d.title) box.appendChild(el('div', { class: 'dtitle', text: (d.type === 'flow' ? '🧭 ' : d.type === 'table' ? '📋 ' : '🧠 ') + d.title }));
    var inner;
    if (d.type === 'table') inner = el('div', { html: renderTable(d) });
    else {
      inner = el('div', { class: 'scroller', html: d.type === 'flow' ? renderFlow(d) : renderMindmap(d) });
    }
    box.appendChild(inner);
    if (d.type !== 'table') box.appendChild(el('div', { class: 'hint', text: d.type === 'flow' ? 'Đi từ ô trên cùng, trả lời từng câu hỏi để tới kết luận.' : 'Kéo ngang nếu sơ đồ rộng hơn màn hình.' }));
    // start animations when visible
    var started = false;
    function start() { if (started) return; started = true; box.classList.add('anim'); }
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { start(); io.disconnect(); } }, { threshold: 0.2 });
      io.observe(box);
    } else start();
    return box;
  }

  // ---------- questions ----------
  // onResult(correct:boolean) is called once, on first check.
  function question(q, num, onResult) {
    var wrap = el('div', { class: 'q' });
    var answered = false;
    function finish(ok, answerText) {
      if (answered) return; answered = true;
      var fb = el('div', { class: 'feedback ' + (ok ? 'good' : 'bad') });
      fb.appendChild(el('div', { html: (ok ? '✅ <b>Chính xác!</b>' : '❌ <b>Chưa đúng.</b>') + (!ok && answerText ? ' Đáp án: <span class="ans">' + fmt(answerText) + '</span>' : '') }));
      if (q.explain) fb.appendChild(rich('div', q.explain));
      var st = srcTag(q.src); if (st) fb.appendChild(st);
      wrap.appendChild(fb);
      if (onResult) onResult(ok);
    }
    var head = el('div', { class: 'qtext' }, [num != null ? el('span', { class: 'qnum', text: String(num) }) : null]);
    wrap.appendChild(head);

    if (q.type === 'mcq') {
      head.appendChild(rich('span', q.q));
      var opts = el('div', { class: 'opts' });
      var order = q.shuffle === false ? q.options.map(function (_, i) { return i; }) : shuffle(q.options.map(function (_, i) { return i; }));
      var btns = [];
      order.forEach(function (i) {
        var b = el('button', { class: 'opt', html: fmt(q.options[i]), onclick: function () {
          btns.forEach(function (x) { x.disabled = true; });
          var ok = i === q.answer;
          b.classList.add(ok ? 'correct' : 'wrong');
          if (!ok) btns.forEach(function (x) { if (+x.dataset.i === q.answer) x.classList.add('correct'); });
          finish(ok, null);
        } });
        b.dataset.i = i; btns.push(b); opts.appendChild(b);
      });
      wrap.appendChild(opts);
    } else if (q.type === 'fill') {
      var parts = String(q.q).split('___');
      var input = el('input', { class: 'blank', type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'Điền từ' });
      head.appendChild(rich('span', parts[0]));
      head.appendChild(input);
      head.appendChild(rich('span', parts.slice(1).join('___')));
      if (q.hint) wrap.appendChild(el('div', { class: 'small muted', text: '💡 ' + q.hint }));
      var cb = el('button', { class: 'btn ghost', text: 'Kiểm tra' });
      function chk() {
        if (answered || !input.value.trim()) return;
        var ok = q.answer.some(function (a) { return norm(a) === norm(input.value); });
        input.classList.add(ok ? 'correct' : 'wrong'); input.disabled = true; cb.disabled = true;
        finish(ok, q.answer[0]);
      }
      cb.addEventListener('click', chk);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') chk(); });
      wrap.appendChild(el('div', { class: 'check-row' }, [cb]));
    } else if (q.type === 'fix') {
      head.appendChild(rich('span', q.q || 'Câu sau có lỗi. Hãy sửa lại cho đúng:'));
      wrap.appendChild(el('div', { class: 'fixsrc en', text: '✗ ' + q.wrong }));
      var ta = el('textarea', { class: 'fixbox en', spellcheck: 'false', autocapitalize: 'off' });
      ta.value = q.wrong;
      var fbtn = el('button', { class: 'btn ghost', text: 'Kiểm tra' });
      fbtn.addEventListener('click', function () {
        if (answered) return;
        var ok = q.answer.some(function (a) { return norm(a) === norm(ta.value); });
        ta.classList.add(ok ? 'correct' : 'wrong'); ta.disabled = true; fbtn.disabled = true;
        finish(ok, q.answer[0]);
      });
      wrap.appendChild(ta);
      wrap.appendChild(el('div', { class: 'check-row' }, [fbtn]));
    } else if (q.type === 'classify') {
      head.appendChild(rich('span', q.q));
      var segs = [];
      shuffle(q.items.map(function (_, i) { return i; })).forEach(function (i) {
        var it = q.items[i], seg = el('div', { class: 'seg' }), sel = { v: -1 };
        q.buckets.forEach(function (b, bi) {

      t.lessons.forEach(function (l) { if (!learned.length || S.done[l.id]) (l.practice || []).forEach(function (q) { pool.push(q); }); });
    });
    v.appendChild(el('p', { class: 'muted', text: learned.length >= 2 ? 'Câu hỏi lấy ngẫu nhiên từ các bài bạn đã học, trộn lẫn nhiều chủ đề. Việc khó ở đây là nhận ra câu hỏi đang kiểm tra quy tắc nào.' : 'Bạn chưa học đủ 2 chủ đề nên câu hỏi được lấy từ toàn chương. Bài trộn hiệu quả nhất sau khi đã học vài chủ đề.' }));
    var qs = shuffle(pool).slice(0, 15);
    var res = el('div');
    v.appendChild(quizBlock(qs, function (got, tot) {
      var pct = Math.round(got * 100 / tot);
      S.mix = Math.max(S.mix || 0, pct); save();
      if (pct >= 80) confetti();
      res.appendChild(el('div', { class: 'card', style: 'text-align:center' }, [el('div', { class: 'score', text: pct + '%' }), el('button', { class: 'btn', text: '🔀 Trộn bộ mới', onclick: function () { render(); scrollTo(0, 0); } })]));
    }));
    v.appendChild(res);
    return v;
  }

  function viewCards() {
    var v = el('div');
    v.appendChild(crumbs([['Trang chính', '#/'], ['Flashcard']]));
    v.appendChild(el('h1', { text: '🃏 Flashcard' }));
    v.appendChild(el('div', { class: 'row' }, [el('button', { class: 'btn ghost', text: '⬇️ Tải về cho Anki', onclick: downloadAnki }), el('span', { class: 'small muted', text: allCards().length + ' thẻ trong cả chương' })]));
    var due = shuffle(dueCards());
    if (!due.length) {
      v.appendChild(el('div', { class: 'card' }, [el('p', { text: Object.keys(S.done).length ? '✅ Không còn thẻ nào đến hạn hôm nay. Quay lại vào ngày mai nhé!' : 'Học xong một bài thì thẻ của bài đó sẽ xuất hiện ở đây.' })]));
      return v;
    }
    var i = 0, holder = el('div');
    var info = el('p', { class: 'muted small' });
    v.appendChild(info); v.appendChild(holder);
    function show() {
      holder.innerHTML = '';
      if (i >= due.length) { confetti(); holder.appendChild(el('div', { class: 'card', html: '<p>🎉 Xong ' + due.length + ' thẻ hôm nay!</p>' })); info.textContent = ''; return; }
      var c = due[i];
      info.textContent = 'Thẻ ' + (i + 1) + '/' + due.length + ' · ' + lessonTopic[c.lesson].title + ' · bấm thẻ để lật';
      var f = flashcard(c);
      holder.appendChild(f);
      function grade(ok) {
        var st = S.cards[c.id] || { box: 0 };
        st.box = ok ? Math.min(st.box + 1, REVIEW_DAYS.length) : 0;
        st.due = addDays(today(), ok ? REVIEW_DAYS[st.box - 1] : 1);
        S.cards[c.id] = st; save(); i++; show();
      }
      holder.appendChild(el('div', { class: 'row', style: 'justify-content:center' }, [
        el('button', { class: 'btn ghost', text: '😕 Chưa nhớ', onclick: function () { grade(false); } }),
        el('button', { class: 'btn ok', text: '😄 Nhớ rồi', onclick: function () { grade(true); } })
      ]));
    }
    show();
    return v;
  }

  function render() {
    var h = location.hash.replace(/^#\/?/, '').split('/');
    var view;
    if (h[0] === 't' && topicById[h[1]]) view = viewTopic(topicById[h[1]]);
    else if (h[0] === 'l' && lessonById[h[1]]) view = viewLesson(lessonById[h[1]], h[2]);
    else if (h[0] === 'q' && topicById[h[1]] && topicById[h[1]].quiz) view = viewQuiz(topicById[h[1]]);
    else if (h[0] === 'mix') view = viewMix();
    else if (h[0] === 'cards') view = viewCards();
    else view = viewHome();
    app.innerHTML = '';
    app.appendChild(view);
    observeReveal(app);
  }
  window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });
  document.getElementById('theme-btn').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    var next = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('egc:theme', next); } catch (e) {}
  });
  render();
})();

</script>
</body>
</html>
