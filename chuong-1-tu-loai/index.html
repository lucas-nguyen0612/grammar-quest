 = **vì** (nhóm BECAUSE).","src":"tự soạn"},{"type":"mcq","q":"You won't pass the exam ___ you study harder.","options":["unless","if","because"],"answer":0,"explain":"**unless** = trừ khi (if… not): bạn sẽ không đỗ trừ khi học chăm hơn. Dùng if hay because thì thành 'nếu/vì học chăm hơn nên không đỗ', vô lý.","src":"tự soạn"},{"type":"fill","q":"___ it was raining, we played football.","answer":["Although","Though","Even though"],"hint":"mặc dù","explain":"Mưa mà vẫn đá bóng là tương phản → **Although / Though / Even though**.","src":"tự soạn"},{"type":"fill","q":"Take a map ___ you get lost.","answer":["in case"],"hint":"phòng khi (2 từ)","explain":"**in case** = phòng khi: mang bản đồ phòng khi bị lạc.","src":"tự soạn"},{"type":"fill","q":"It was ___ a hot day that we stayed indoors.","answer":["such"],"explain":"Sau chỗ trống có **a hot day** (danh từ) → **such**.","src":"tự soạn"},{"type":"mcq","q":"Speak slowly ___ everyone can understand you.","options":["so that","although","unless"],"answer":0,"explain":"**so that** = để: nói chậm để ai cũng hiểu. although (mặc dù), unless (trừ khi) sai nghĩa.","src":"tự soạn"},{"type":"fix","wrong":"Although the food was cheap, but it was delicious.","answer":["Although the food was cheap, it was delicious.","Though the food was cheap, it was delicious.","Even though the food was cheap, it was delicious.","The food was cheap, but it was delicious."],"explain":"Không dùng cả although lẫn but. Giữ một từ: bỏ **but** (hoặc bỏ although).","src":"tự soạn"},{"type":"fix","wrong":"Because I missed the bus, so I was late for work.","answer":["Because I missed the bus, I was late for work.","I missed the bus, so I was late for work."],"explain":"Không dùng cả because lẫn so. Bỏ **so** (hoặc bỏ because).","src":"tự soạn"},{"type":"fix","wrong":"It was so a beautiful day that we went to the beach.","answer":["It was such a beautiful day that we went to the beach."],"explain":"Có danh từ **a beautiful day** → dùng **such**, không dùng so.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","think","that","he","is","honest."],"explain":"S + think + **that** + S + V: Tôi nghĩ rằng anh ấy trung thực.","src":"tự soạn"}],"flashcards":[{"front":"'Vì… nên…' nói sao trong tiếng Anh?","back":"Chỉ dùng **một** từ: **Because** I was tired, I went to bed. / I was tired, **so** I went to bed."},{"front":"'Mặc dù… nhưng…' nói sao trong tiếng Anh?","back":"**Although** it was cold, we went swimming. (không thêm but)"},{"front":"so hay such: ___ a boring speech that…?","back":"**such** (có danh từ): such a boring speech that I fell asleep"},{"front":"so hay such: ___ angry that…?","back":"**so** (chỉ tính từ): Emma was so angry that she couldn't speak."},{"front":"unless và in case nghĩa là gì?","back":"**unless** = trừ khi (if… not); **in case** = phòng khi"},{"front":"since và as có mấy nghĩa?","back":"Hai: **thời gian** (khi, từ khi) và **lý do** (vì)"}]}],"quiz":{"pass":0.8,"questions":[{"type":"mcq","q":"She is poor, ___ she is happy.","options":["but","so","or"],"answer":0,"explain":"Nghèo mà vẫn hạnh phúc là trái ngược → **but**.","src":"tự soạn"},{"type":"mcq","q":"He's a doctor as ___ as a writer.","options":["well","both","so"],"answer":0,"explain":"**as well as** = cũng như, nhóm AND.","src":"tự soạn"},{"type":"fill","q":"We can go ___ by bus or by train.","answer":["either"],"explain":"**either** … or … = hoặc… hoặc…","src":"tự soạn"},{"type":"fill","q":"___ Tom nor Jerry was at home.","answer":["Neither"],"explain":"**Neither** … nor … = cả hai đều không.","src":"tự soạn"},{"type":"mcq","q":"I was hungry. ___, I made a sandwich.","options":["Therefore","However","Otherwise"],"answer":0,"explain":"Làm bánh mì là **kết quả** của đói → **Therefore**. However là trái ngược, Otherwise là 'nếu không thì'.","src":"tự soạn"},{"type":"mcq","q":"He's lazy. ___, he's very clever.","options":["On the other hand","As a result","Otherwise"],"answer":0,"explain":"Lười và rất thông minh là hai mặt trái ngược → **On the other hand** (nhóm BUT).","src":"tự soạn"},{"type":"classify","q":"Xếp mỗi từ vào đúng loại liên từ:","buckets":["Kết hợp (ngang hàng)","Phụ thuộc (mở mệnh đề phụ)"],"items":[{"text":"and","bucket":0},{"text":"or","bucket":0},{"text":"so (nên)","bucket":0},{"text":"because","bucket":1},{"text":"although","bucket":1},{"text":"when","bucket":1},{"text":"so that (để)","bucket":1}],"explain":"and, or, so thuộc liên từ kết hợp. because, although, when, so that mở đầu mệnh đề phụ nên là liên từ phụ thuộc. Chú ý **so** (nên) khác **so that** (để).","src":"tr. 214–217"},{"type":"mcq","q":"___ I got home, I took a shower.","options":["As soon as","Although","Unless"],"answer":0,"explain":"**As soon as** = ngay khi: về đến nhà là đi tắm luôn.","src":"tự soạn"},{"type":"mcq","q":"Mary is tall, ___ her sister is short.","options":["whereas","because","so that"],"answer":0,"explain":"Đặt hai người đối lập cạnh nhau → **whereas** (trong khi đó).","src":"tự soạn"},{"type":"fill","q":"I'm not opening the door, ___ you are.","answer":["whoever"],"hint":"cho dù là ai","explain":"**whoever** = cho dù là ai đi nữa.","src":"tr. 216"},{"type":"mcq","q":"We left early ___ we wouldn't miss the train.","options":["so that","although","unless"],"answer":0,"explain":"**so that** = để: đi sớm để không lỡ tàu.","src":"tự soạn"},{"type":"fill","q":"She was ___ tired that she fell asleep at once.","answer":["so"],"explain":"Sau chỗ trống chỉ có tính từ tired → **so**.","src":"tự soạn"},{"type":"fix","wrong":"It was such hot that we went swimming.","answer":["It was so hot that we went swimming."],"explain":"hot là tính từ, không có danh từ đi kèm → **so**.","src":"tự soạn"},{"type":"fix","wrong":"Although he is rich, but he isn't happy.","answer":["Although he is rich, he isn't happy.","Though he is rich, he isn't happy.","Even though he is rich, he isn't happy.","He is rich, but he isn't happy.","Although he is rich, he is not happy.","He is rich, but he is not happy."],"explain":"Không dùng cả although lẫn but. Giữ một trong hai.","src":"tự soạn"},{"type":"mcq","q":"I think ___ she is right.","options":["that","what","so that"],"answer":0,"explain":"**that** mở đầu mệnh đề nêu ý kiến: Tôi nghĩ rằng cô ấy đúng.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Because","it","was","late,","we","took","a","taxi."],"explain":"Because + lý do, mệnh đề chính (không thêm so).","src":"tự soạn"}]}},{"id":"10-mao-tu","title":"Mạo từ","en":"Articles","icon":"🎯","pages":"221–239","summary":"Mạo từ (article) là từ nhỏ đứng trước danh từ: a/an, the, hoặc không có gì. Tiếng Việt không có mạo từ nên đây là chỗ người Việt sai nhiều nhất. Chủ đề này dạy bạn một câu hỏi duy nhất: người nghe đã biết đó là cái nào chưa? Từ đó chọn a/an, the hay bỏ trống, rồi học các trường hợp đặc biệt như tên địa danh, go to school, at home.","mindmap":{"label":"Mạo từ","children":[{"label":"a / an","icon":"1️⃣","children":[{"label":"a theo âm phụ âm: a university"},{"label":"an theo âm nguyên âm: an hour"},{"label":"Nhắc lần đầu, chưa xác định"},{"label":"Nghề nghiệp: is a lawyer"},{"label":"Không với số nhiều, không đếm được"}]},{"label":"the","icon":"👉","children":[{"label":"Đã nhắc / người nghe biết"},{"label":"Duy nhất: the sun, the world"},{"label":"So sánh nhất, first, only"},{"label":"Cụ thể: the music in this film"},{"label":"the + tính từ: the poor"}]},{"label":"Không mạo từ (Ø)","icon":"⭕","children":[{"label":"Nói chung: Books, Life"},{"label":"Thể thao, bữa ăn"},{"label":"go to school, at home"},{"label":"on Monday, watch television"}]},{"label":"Địa danh","icon":"🗺️","children":[{"label":"Ø: Vietnam, Hanoi, Everest"},{"label":"the: sông, biển, the United States"}]}]},"lessons":[{"id":"10a","title":"Mạo từ không xác định a/an","minutes":25,"goal":"Chọn đúng a hay an theo âm đầu, biết khi nào phải có a/an (nhắc lần đầu, nghề nghiệp) và khi nào không được dùng (số nhiều, không đếm được, bữa ăn, trước my/your).","pretest":[{"type":"mcq","q":"We waited for ___ hour.","options":["a","an"],"answer":1,"explain":"**hour** có chữ h câm, đọc bắt đầu bằng âm nguyên âm /aʊ/ nên dùng **an**.","src":"tr. 221"},{"type":"mcq","q":"Chọn câu đúng:","options":["My father is teacher.","My father is a teacher."],"answer":1,"explain":"Nói nghề nghiệp phải có **a/an**: is **a** teacher. Tiếng Việt nói 'bố tôi là giáo viên' không cần 'một', tiếng Anh thì cần.","src":"tr. 222"},{"type":"mcq","q":"Chọn câu đúng:","options":["I have breakfast at seven.","I have a breakfast at seven."],"answer":0,"explain":"Tên bữa ăn (breakfast, lunch, dinner) thường không có a/an: **have breakfast**.","src":"tr. 223"}],"hook":{"icon":"🎯","text":"Tiếng Việt nói 'Tôi có xe', 'Bố tôi là bác sĩ' mà chẳng cần thêm chữ nào. Tiếng Anh thì khác: một danh từ đếm được số ít **không bao giờ đứng trơ trọi**, nó cần một 'người dẫn đường' phía trước. **a/an** là người dẫn đường nói rằng: 'một cái nào đó, bạn chưa biết là cái nào'. Bài này dạy bạn khi nào gọi người dẫn đường này, và chọn **a** hay **an**."},"diagram":{"type":"flow","title":"Có dùng a/an được không?","start":{"q":"Danh từ đếm được, số ít?","branches":[{"label":"Không","to":{"result":"Không dùng a/an: cars, water","icon":"🚫"}},{"label":"Có","to":{"q":"Người nghe đã biết là cái nào?","branches":[{"label":"Biết rồi","to":{"result":"Dùng the (bài 10b)","icon":"👉"}},{"label":"Chưa","to":{"q":"Âm đầu khi đọc là nguyên âm?","branches":[{"label":"Có","to":{"result":"an: an apple, an hour","icon":"🍎"}},{"label":"Không","to":{"result":"a: a car, a university","icon":"🚗"}}]}}]}}]}},"chunks":[{"title":"a hay an? Nghe âm, đừng nhìn chữ","icon":"👂","rule":"Dùng **an** trước **âm** nguyên âm, **a** trước **âm** phụ âm — xét theo cách **đọc**, không theo chữ cái đầu.","explain":"Nguyên âm là các âm a, e, i, o, u. Nhưng điều quyết định là âm bạn **nghe**: university đọc là /juː/ (giống 'du') nên là **a** university; hour có h câm, đọc là /aʊ/ nên là **an** hour. Chữ viết tắt cũng đọc theo tên chữ cái: MP đọc 'em-pi' → **an** MP; UFO đọc 'diu-ép-âu' → **a** UFO.","formula":"an + âm nguyên âm: an apple, an hour, an MP\na + âm phụ âm: a book, a university, a one-way street","diagram":{"type":"table","title":"Cặp dễ nhầm","head":["a (âm phụ âm)","an (âm nguyên âm)"],"rows":[["a house","an hour (h câm)"],["a university /juː/","an umbrella"],["a European /jʊə/","an honest man (h câm)"],["a UFO /juː/","an MP /em/"]]},"examples":[{"en":"I ate **an** apple.","vi":"Tôi đã ăn một quả táo."},{"en":"She studies at **a** university.","vi":"Cô ấy học ở một trường đại học."},{"en":"We waited for **an** hour.","vi":"Chúng tôi đã đợi một tiếng."},{"en":"He is a honest man.","ok":false,"note":"h câm → an honest man"}],"mistake":{"wrong":"She is an university student.","right":"She is a university student.","why":"university đọc /juː/ — âm phụ âm, nên dùng a dù chữ đầu là u."},"tip":"Đọc to lên: tai nghe thấy âm 'a, e, i, o, u' ở đầu → an. Mắt nhìn chữ dễ bị lừa, tai thì không.","src":"tr. 221, 223","check":{"type":"mcq","q":"I need ___ umbrella. It's raining.","options":["a","an"],"answer":1,"explain":"umbrella đọc bắt đầu bằng âm /ʌ/ (nguyên âm) → **an** umbrella. Khác với university (âm /juː/) → a.","src":"tr. 223"}},{"title":"a/an = một cái chưa xác định","icon":"❓","rule":"Dùng **a/an** trước danh từ **đếm được số ít** khi nhắc **lần đầu**, người nghe **chưa biết** là cái nào.","explain":"Tiếng Việt có thể nói 'Tôi thấy cậu bé ngoài đường', nhưng tiếng Anh bắt buộc có từ đứng trước danh từ đếm được số ít. a/an còn dùng khi nói về **một cái bất kỳ** trong một loại: An owl can see in the dark = con cú nào cũng thấy được trong bóng tối. Muốn nói về **tất cả** thì người ta hay dùng số nhiều không mạo từ: Owls can see in the dark.","formula":"a/an + danh từ đếm được số ít","examples":[{"en":"I saw **a** boy in the street.","vi":"Tôi thấy một cậu bé ngoài đường."},{"en":"She lives in **a** nice small house.","vi":"Cô ấy sống trong một ngôi nhà nhỏ xinh."},{"en":"**A** car must be insured.","vi":"Ô tô (bất kỳ chiếc nào) phải được bảo hiểm."},{"en":"I have car.","ok":false,"note":"danh từ đếm được số ít đứng trơ trọi → I have a car."}],"mistake":{"wrong":"I bought new phone yesterday.","right":"I bought a new phone yesterday.","why":"phone đếm được, số ít, nhắc lần đầu → cần a. Tính từ new đứng giữa không làm mất a."},"tip":"Thấy danh từ đếm được số ít đứng một mình → câu đang thiếu một từ phía trước (a/an, the, my…).","src":"tr. 221–222","check":{"type":"mcq","q":"Chọn câu đúng:","options":["There is bank near my house.","There is a bank near my house."],"answer":1,"explain":"bank đếm được, số ít, người nghe chưa biết ngân hàng nào → **a** bank.","src":"tự soạn"}},{"title":"a/an với nghề nghiệp, phân loại, số đo","icon":"👩‍⚕️","rule":"Dùng **a/an** trước **nghề nghiệp** và khi xếp người/vật vào một loại sau **be, become, remain** hoặc **as**.","explain":"Tiếng Việt: 'Bố của Ruth là luật sư' — không cần 'một'. Tiếng Anh: is **a** lawyer. Các động từ như be, become, remain gọi là hệ từ (linking verb): chúng nối chủ ngữ với phần mô tả chủ ngữ. as nghĩa là 'làm, với vai trò'. Ngoài ra a/an nằm sẵn trong nhiều cụm số lượng: a lot of, a few, a little, a dozen, a hundred, half a kilo; và trong 'mỗi': sixty kilometers **an** hour, four times **a** day.","formula":"S + be + a/an + nghề nghiệp\nas + a/an + danh từ\nsố lần + a + day/week","examples":[{"en":"Ruth's father is **a** lawyer.","vi":"Bố của Ruth là luật sư."},{"en":"Don't use your plate as **an** ashtray.","vi":"Đừng dùng đĩa làm gạt tàn."},{"en":"I drink coffee three times **a** day.","vi":"Tôi uống cà phê ba lần một ngày."},{"en":"My sister is nurse.","ok":false,"note":"nghề nghiệp cần a → is a nurse"}],"mistake":{"wrong":"I am engineer.","right":"I am an engineer.","why":"Nói nghề nghiệp phải có a/an; engineer bắt đầu bằng âm nguyên âm → an."},"tip":"'là' + nghề → thêm a/an: is a teacher, is an engineer.","src":"tr. 222–223","check":{"type":"fill","q":"He works as ___ waiter in a café. (a/an)","answer":["a"],"explain":"Sau **as** để nói vai trò/công việc → a/an; waiter bắt đầu bằng âm phụ âm /w/ → **a**.","src":"tr. 222"}},{"title":"Khi KHÔNG dùng a/an","icon":"🚫","rule":"**Không** dùng a/an trước danh từ **số nhiều**, danh từ **không đếm được**, tên **bữa ăn** (trừ khi có tính từ) và trước **my, your, his…**","explain":"a/an nghĩa là 'một', nên không đi với nhiều cái (architects) hay thứ không đếm được (weather, water). Bữa ăn: **have breakfast**, nhưng có tính từ thì được: **a good breakfast**. Không nói 'a my friend' — nói **a friend of mine**. Lưu ý: một số danh từ không đếm được vẫn đi với a/an khi mang nghĩa 'một phần, một loại' hoặc nói về cảm xúc, hoạt động trí óc: a coffee (một ly cà phê), a good sleep, a knowledge of English.","formula":"a friend of mine / yours / his / hers / ours / theirs","examples":[{"en":"Both my parents are architects.","vi":"Cả bố lẫn mẹ tôi đều là kiến trúc sư."},{"en":"What terrible weather!","vi":"Thời tiết tệ quá!"},{"en":"He's **a friend of mine**.","vi":"Anh ấy là một người bạn của tôi."},{"en":"He gave us **a** good breakfast.","vi":"Anh ấy đãi chúng tôi một bữa sáng ngon."},{"en":"She is a my friend.","ok":false,"note":"a không đứng trước my → a friend of mine"}],"mistake":{"wrong":"What a terrible weather!","right":"What terrible weather!","why":"weather không đếm được nên không có a, kể cả trong câu cảm thán."},"tip":"a/an = 'MỘT cái'. Không đếm được 'một' (nước, thời tiết) hoặc đã là nhiều cái → bỏ a/an.","src":"tr. 223"}],"practice":[{"type":"mcq","q":"I had ___ egg for breakfast.","options":["a","an"],"answer":1,"explain":"egg bắt đầu bằng âm nguyên âm /e/ → **an** egg.","src":"tự soạn"},{"type":"classify","q":"Từ nào đi với a, từ nào đi với an?","buckets":["a","an"],"items":[{"text":"hour","bucket":1},{"text":"university","bucket":0},{"text":"umbrella","bucket":1},{"text":"house","bucket":0},{"text":"honest man","bucket":1},{"text":"European","bucket":0}],"explain":"Xét **âm** đầu: hour, honest có h câm → an; umbrella âm /ʌ/ → an. university /juː/, European /jʊə/ là âm phụ âm → a; house có h đọc rõ → a.","src":"tr. 221, 223"},{"type":"mcq","q":"Chọn câu đúng:","options":["My mother is a doctor.","My mother is doctor.","My mother is an doctor."],"answer":0,"explain":"Nghề nghiệp cần a/an; doctor bắt đầu bằng âm phụ âm /d/ → **a** doctor.","src":"tự soạn"},{"type":"mcq","q":"Chọn câu đúng:","options":["What a terrible weather!","What terrible weather!"],"answer":1,"explain":"weather không đếm được → không có a. Câu đúng: What terrible weather!","src":"tr. 223"},{"type":"mcq","q":"We usually have ___ dinner at seven.","options":["a","an","(không dùng gì)"],"answer":2,"shuffle":false,"explain":"Tên bữa ăn không có a/an: have dinner. Chỉ dùng a khi có tính từ: a nice dinner.","src":"tr. 223"},{"type":"fill","q":"I bought ___ orange and two bananas. (a/an)","answer":["an"],"explain":"orange bắt đầu bằng âm nguyên âm /ɒ/ → **an** orange.","src":"tự soạn"},{"type":"fill","q":"The car was going at sixty kilometers ___ hour. (a/an)","answer":["an"],"explain":"'mỗi giờ' = **an** hour (h câm → an).","src":"tr. 223"},{"type":"fix","wrong":"I am a engineer.","answer":["I am an engineer.","I'm an engineer."],"explain":"engineer bắt đầu bằng âm nguyên âm /e/ → **an** engineer.","src":"tự soạn"},{"type":"fix","wrong":"My brother wants to be pilot.","answer":["My brother wants to be a pilot."],"explain":"Nói nghề nghiệp phải có a/an: be **a** pilot.","src":"tự soạn"},{"type":"fix","wrong":"Tom is a my friend.","answer":["Tom is a friend of mine.","Tom is my friend."],"explain":"a không đứng cạnh my. Nói **a friend of mine** (một người bạn của tôi) hoặc bỏ a: my friend.","src":"tr. 223"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","have","an","uncle","who","is","a","lawyer."],"explain":"uncle bắt đầu bằng âm nguyên âm → an uncle; lawyer là nghề nghiệp → a lawyer.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","take","this","medicine","three","times","a","day."],"explain":"three times **a** day = ba lần mỗi ngày; a ở đây nghĩa là 'mỗi'.","src":"tr. 223"}],"flashcards":[{"front":"a hay an trước university?","back":"**a** university — đọc /juː/, âm phụ âm."},{"front":"a hay an trước hour?","back":"**an** hour — h câm, âm đầu là nguyên âm."},{"front":"'Tôi là kỹ sư' tiếng Anh?","back":"I'm **an** engineer. (nghề nghiệp phải có a/an)"},{"front":"'Một người bạn của tôi' nói thế nào?","back":"**a friend of mine** (KHÔNG: a my friend)"},{"front":"have ___ breakfast: có a không?","back":"Không: have breakfast. Có tính từ thì có: a good breakfast."}]},{"id":"10b","title":"Mạo từ xác định the","minutes":25,"goal":"Dùng the khi người nghe biết bạn nói về cái nào (đã nhắc, duy nhất, có cụm xác định, so sánh nhất), phân biệt nói chung với nói cụ thể, và dùng the + tính từ để chỉ một nhóm người.","pretest":[{"type":"mcq","q":"I bought a shirt and a hat. ___ shirt is blue.","options":["A","The"],"answer":1,"explain":"shirt đã được nhắc ở câu trước, người nghe biết là cái áo nào → **The** shirt.","src":"tự soạn"},{"type":"mcq","q":"___ sun rises in the east.","options":["A","The","(không dùng gì)"],"answer":1,"shuffle":false,"explain":"Mặt trời chỉ có một → **the** sun.","src":"tr. 225"}],"hook":{"icon":"👉","text":"Hãy tưởng tượng **the** là ngón tay chỉ: 'cái đó đó, bạn biết rồi mà'. Tiếng Việt làm việc này bằng 'cái… ấy', 'cái… đó': 'Tôi mua một cái áo. **Cái áo đó** màu xanh.' Câu đầu là **a** shirt (bạn chưa biết), câu sau là **the** shirt (giờ bạn biết rồi). Cả chủ đề mạo từ quy về một câu hỏi: **người nghe đã biết là cái nào chưa?**"},"diagram":{"type":"flow","title":"a/an, the hay không mạo từ?","start":{"q":"Người nghe biết rõ là cái nào?","branches":[{"label":"Biết (đã nhắc, duy nhất…)","to":{"result":"the: the car / the cars / the water","icon":"👉"}},{"label":"Chưa / nói chung","to":{"q":"Đếm được, số ít?","branches":[{"label":"Có","to":{"q":"Âm đầu là nguyên âm?","branches":[{"label":"Có","to":{"result":"an: an apple, an hour","icon":"🍎"}},{"label":"Không","to":{"result":"a: a car, a university","icon":"🚗"}}]}},{"label":"Không","to":{"result":"Không mạo từ: Cars…, Water…","icon":"⭕"}}]}}]}},"chunks":[{"title":"the = người nghe biết cái nào","icon":"👉","rule":"Dùng **the** khi người nghe **biết** bạn nói về người/vật nào: đã **nhắc trước đó**, rõ từ **tình huống**, hoặc có **cụm từ theo sau** chỉ rõ.","explain":"the đi được với mọi loại danh từ: the boy, the boys, the food. Lần đầu nhắc dùng a, lần sau dùng the: A man and a woman were arrested, but **the** woman was later released. Tình huống cũng làm rõ: trên bàn chỉ có một lọ muối → Could you pass **the** salt? Cụm theo sau cũng chỉ rõ: **the** house on the corner (ngôi nhà ở góc phố), **the** school Terry went to.","formula":"Lần 1: a/an + N → Lần 2: the + N\nthe + N + cụm từ/mệnh đề chỉ rõ","examples":[{"en":"I ordered a pizza and a salad. **The** pizza was nice but **the** salad was awful.","vi":"Tôi gọi một cái pizza và một đĩa salad. Pizza thì ngon nhưng salad thì dở tệ."},{"en":"Could you pass **the** salt?","vi":"Bạn đưa giùm tôi lọ muối được không?"},{"en":"Is there **a** post office near here?","vi":"Gần đây có bưu điện nào không?"},{"en":"Who lives in **the** house on the corner?","vi":"Ai sống trong ngôi nhà ở góc phố vậy?"},{"en":"I saw a dog. A dog was very big.","ok":false,"note":"lần nhắc thứ hai → The dog was very big."}],"mistake":{"wrong":"I watched a film last night. A film was boring.","right":"I watched a film last night. The film was boring.","why":"Phim đã được nhắc ở câu trước, người nghe biết là phim nào → the."},"tip":"Hỏi: 'Người nghe có chỉ tay được vào đúng cái đó không?' Được → the.","src":"tr. 223–224","check":{"type":"mcq","q":"A man and a woman were arrested, but ___ woman was later released.","options":["a","the"],"answer":1,"explain":"Người phụ nữ đã được nhắc ở vế trước → **the** woman.","src":"tr. 224"}},{"title":"the với cái duy nhất và so sánh nhất","icon":"☀️","rule":"Dùng **the** cho thứ **duy nhất** (the sun, the world, the government) và trước **so sánh nhất**, **first, last, next, same, only**.","explain":"Chỉ có một mặt trời, một thế giới, một chính phủ, một cổng chính trong tòa nhà → ai cũng biết là cái nào → the. Tương tự, 'người lớn tuổi nhất', 'ngày đầu tiên', 'con đường duy nhất' chỉ có một → the. the cũng dùng với môi trường quanh ta: the sea, the countryside, the weather, the rain; với tên báo (The Times), tàu (the Titanic), ban nhạc (the Beatles).","formula":"the + sun / moon / world / sky / police\nthe + so sánh nhất / first / last / only / same + N","examples":[{"en":"**The** earth goes round **the** sun.","vi":"Trái đất quay quanh mặt trời."},{"en":"I'm **the** oldest in my family.","vi":"Tôi là người lớn tuổi nhất trong nhà."},{"en":"It's **the** only way to the station.","vi":"Đó là con đường duy nhất tới nhà ga."},{"en":"We went to the same school.","vi":"Chúng tôi học cùng một trường."},{"en":"She is best student in my class.","ok":false,"note":"so sánh nhất cần the → the best student"}],"mistake":{"wrong":"This is first time I've been here.","right":"This is the first time I've been here.","why":"first (thứ nhất) chỉ có một → the first time."},"tip":"'nhất', 'đầu tiên', 'cuối cùng', 'duy nhất', 'cùng' → luôn kéo theo the.","src":"tr. 225–226","check":{"type":"fill","q":"Mount Everest is ___ highest mountain in the world. (a/an/the)","answer":["the"],"explain":"highest là so sánh nhất → **the** highest.","src":"tr. 226"}},{"title":"Nói chung hay nói cụ thể?","icon":"🔍","rule":"Danh từ số nhiều/không đếm được: **không the** = nói **chung**; **có the** = những cái **cụ thể**.","explain":"music = âm nhạc nói chung; **the** music = nhạc trong bộ phim này. Children need love = trẻ em nói chung; **the** children = mấy đứa trẻ cụ thể. Ngoại lệ: **the + danh từ số ít** dùng để nói về **cả một loài vật**, một loại máy móc/phát minh hay nhạc cụ: The tiger…, The telephone was invented…, play the piano. a/an chỉ nói về **một con bất kỳ**, không dùng để nói về cả loài: KHÔNG nói 'A tiger is in danger of becoming extinct' (tuyệt chủng là chuyện của cả loài).","formula":"Chung: Ø + N số nhiều / không đếm được\nCụ thể: the + N\nCả loài / phát minh / nhạc cụ: the + N số ít","examples":[{"en":"I often listen to music.","vi":"Tôi hay nghe nhạc."},{"en":"I like **the** music in this film.","vi":"Tôi thích nhạc trong bộ phim này."},{"en":"**The** tiger is in danger of becoming extinct.","vi":"Loài hổ đang có nguy cơ tuyệt chủng."},{"en":"She plays **the** piano.","vi":"Cô ấy chơi đàn piano."},{"en":"A tiger is in danger of becoming extinct.","ok":false,"note":"cả loài → The tiger… / Tigers are…"}],"mistake":{"wrong":"The children need love.","right":"Children need love.","why":"Nói về trẻ em nói chung → không the. Chỉ dùng the khi nói về mấy đứa trẻ cụ thể."},"tip":"Hỏi: 'cái nào?' Trả lời được (nhạc trong phim, sách trên bàn) → the. Không trả lời được vì đang nói chung → bỏ the.","src":"tr. 227–228","check":{"type":"mcq","q":"Chọn câu nói về trẻ em nói chung:","options":["Children need love.","The children need love."],"answer":0,"explain":"Nói chung về tất cả trẻ em → số nhiều không the. **The** children chỉ một nhóm trẻ cụ thể.","src":"tr. 227"}},{"title":"the + tính từ, quốc tịch, gia đình","icon":"👥","rule":"**the + tính từ** chỉ một **nhóm người** (the poor, the young); **the + quốc tịch** chỉ **cả dân tộc** (the French); **the + họ số nhiều** chỉ **cả gia đình** (the Johnsons).","explain":"the poor = những người nghèo, the rich = người giàu, the homeless = người vô gia cư, the blind = người mù. Lưu ý ngoài sách: nhóm này là số nhiều nên động từ chia số nhiều (The rich are…), và tính từ không thêm -s. the cũng thường đứng trước danh từ có **of** theo sau: the University of London, the music of Mozart.","formula":"the + tính từ = nhóm người\nthe + quốc tịch = cả dân tộc\nthe + họ + s = cả gia đình","examples":[{"en":"We should help **the** poor.","vi":"Chúng ta nên giúp đỡ người nghèo."},{"en":"**The** French love good food.","vi":"Người Pháp mê đồ ăn ngon."},{"en":"**The** Johnsons are coming to dinner.","vi":"Gia đình Johnson sẽ đến ăn tối."},{"en":"We should help poor.","ok":false,"note":"thiếu the → help the poor (hoặc poor people)"}],"mistake":{"wrong":"The rich should help poor.","right":"The rich should help the poor.","why":"Tính từ poor muốn chỉ nhóm người phải có the đứng trước."},"tip":"the + tính từ = 'những người …': the old = những người già.","src":"tr. 226, 228"}],"practice":[{"type":"mcq","q":"Look at ___ moon! It's so bright tonight.","options":["a","the","(không dùng gì)"],"answer":1,"shuffle":false,"explain":"Mặt trăng chỉ có một → **the** moon.","src":"tr. 225"},{"type":"mcq","q":"My grandmother is ___ oldest person in our village.","options":["an","the","(không dùng gì)"],"answer":1,"shuffle":false,"explain":"oldest là so sánh nhất → **the** oldest. 'an' sai vì so sánh nhất chỉ có một người, đã xác định.","src":"tr. 226"},{"type":"classify","q":"Cụm nào cần the?","buckets":["Cần the","Không the (nói chung)"],"items":[{"text":"___ sun","bucket":0},{"text":"___ best day of my life","bucket":0},{"text":"I love ___ music. (nói chung)","bucket":1},{"text":"help ___ poor (người nghèo)","bucket":0},{"text":"___ Children need love. (nói chung)","bucket":1},{"text":"read ___ Times (tờ báo)","bucket":0}],"explain":"sun duy nhất; best là so sánh nhất; the poor = nhóm người; tên báo có the. music và children ở đây nói chung → không the.","src":"tr. 225–228"},{"type":"mcq","q":"Chọn câu đúng:","options":["Tigers are in danger of becoming extinct.","A tiger is in danger of becoming extinct."],"answer":0,"explain":"Tuyệt chủng là chuyện của cả loài. a/an chỉ nói về một con bất kỳ, không dùng cho cả loài. Đúng: Tigers are… (hoặc The tiger is…).","src":"tr. 227–228"},{"type":"fill","q":"There's a cat and a dog in the garden. ___ cat is black. (a/the)","answer":["the"],"explain":"cat đã được nhắc ở câu trước → **The** cat.","src":"tự soạn"},{"type":"fill","q":"This is ___ first time I have flown on a plane. (a/the)","answer":["the"],"explain":"first (lần đầu tiên) chỉ có một → **the** first time.","src":"tr. 226"},{"type":"fill","q":"I like this film, especially ___ music in it. (the/Ø — gõ the hoặc Ø)","answer":["the"],"explain":"Nhạc **trong phim này** là nhạc cụ thể → **the** music.","src":"tr. 227"},{"type":"fix","wrong":"I watched a film yesterday. A film was really boring.","answer":["I watched a film yesterday. The film was really boring."],"explain":"Lần nhắc thứ hai, người nghe đã biết phim nào → **The** film.","src":"tự soạn"},{"type":"fix","wrong":"The rich should help poor.","answer":["The rich should help the poor."],"explain":"the + tính từ = nhóm người: **the poor** = những người nghèo.","src":"tr. 228"},{"type":"fix","wrong":"She is best singer in our school.","answer":["She is the best singer in our school."],"explain":"best là so sánh nhất → **the** best.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["The","Johnsons","live","in","the","house","on","the","corner."],"explain":"The Johnsons = cả gia đình Johnson; the house on the corner = ngôi nhà được chỉ rõ bằng cụm 'on the corner'.","src":"tr. 224, 226"}],"flashcards":[{"front":"Nhắc lần hai cùng một vật: a hay the?","back":"**the**: I bought a shirt. The shirt is blue."},{"front":"Vật duy nhất (sun, moon, world) dùng gì?","back":"**the**: the sun, the world, the government"},{"front":"Trước so sánh nhất / first / only / same?","back":"**the**: the best, the first day, the only way"},{"front":"music hay the music?","back":"music = âm nhạc nói chung; **the** music in this film = nhạc cụ thể"},{"front":"'Người nghèo' (cả nhóm) nói thế nào?","back":"**the poor** (the + tính từ)"},{"front":"Nói về cả loài hổ sắp tuyệt chủng?","back":"**The tiger** is… / **Tigers** are… (KHÔNG: A tiger is…)"}]},{"id":"10c","title":"Không dùng mạo từ; mạo từ với địa danh","minutes":25,"goal":"Biết các trường hợp không dùng mạo từ (nói chung, thể thao, bữa ăn, go to school, at home, on Monday), và quyết định tên địa danh có the hay không.","pretest":[{"type":"mcq","q":"Do you play ___ volleyball?","options":["the","(không dùng gì)"],"answer":1,"shuffle":false,"explain":"Tên môn thể thao không có the: play volleyball.","src":"tr. 229"},{"type":"mcq","q":"Chọn câu đúng:","options":["I live in the Vietnam.","I live in Vietnam."],"answer":1,"explain":"Tên quốc gia thường không có the: Vietnam, France, Japan.","src":"tr. 229"},{"type":"mcq","q":"Chọn câu đúng:","options":["He went to bed early.","He went to the bed early."],"answer":0,"explain":"go to bed (đi ngủ) là cụm cố định, không có the.","src":"tr. 232"}],"hook":{"icon":"🏫","text":"Tiếng Việt chẳng bao giờ có mạo từ, nên 'không mạo từ' nghe có vẻ dễ. Cái khó là biết **lúc nào được bỏ**. Hãy nhớ: bỏ mạo từ khi bạn nói về **khái niệm chung** hoặc **mục đích chính** của một nơi. 'Con tôi **đi học**' là go to **school**; còn 'tôi **đến trường** họp phụ huynh' là go to **the** school, vì bạn chỉ đến tòa nhà. Phần sau bài là tên địa danh: Vietnam không có the, nhưng the Mekong thì có."},"diagram":{"type":"mindmap","title":"Khi nào KHÔNG dùng mạo từ?","root":{"label":"Không mạo từ (Ø)","children":[{"label":"Nói chung","icon":"🌍","children":[{"label":"Books, Water, Life, Love"}]},{"label":"Thể thao, bữa ăn","icon":"⚽","children":[{"label":"play football, have lunch"}]},{"label":"Đa số tên riêng","icon":"🗺️","children":[{"label":"Vietnam, Hanoi, Everest"}]},{"label":"Mục đích chính","icon":"🏫","children":[{"label":"go to school, in prison"}]},{"label":"Cụm cố định","icon":"🏠","children":[{"label":"at home, in bed, at work"}]},{"label":"Thời gian, TV","icon":"📅","children":[{"label":"on Monday, watch television"}]}]}},"chunks":[{"title":"Nói chung, thể thao, bữa ăn → không the","icon":"🌍","rule":"**Không** dùng the khi nói **chung** về danh từ số nhiều, không đếm được, **trừu tượng** (life, love, nature), và trước **môn thể thao**, **bữa ăn**.","explain":"Tiếng Việt nói 'Cuộc sống thật đẹp' có chữ 'cuộc', nên người Việt hay viết 'The life is beautiful' — sai. Danh từ trừu tượng (life, happiness, freedom, nature, society) mang nghĩa chung thì không the; chỉ dùng the khi nó được chỉ rõ: **the** life of Beethoven (cuộc đời của Beethoven). Thể thao: play volleyball, do judo. Bữa ăn: have lunch; nhưng a delicious lunch (có tính từ) và **The** breakfast they gave us was perfect (bữa sáng cụ thể).","formula":"Ø + life / love / nature / happiness (nói chung)\nplay + môn thể thao\nhave + breakfast / lunch / dinner","examples":[{"en":"**Life** is complicated.","vi":"Cuộc sống thật phức tạp."},{"en":"She wrote a book about **the** life of Beethoven.","vi":"Cô ấy viết một cuốn sách về cuộc đời của Beethoven."},{"en":"We play volleyball every Sunday.","vi":"Chúng tôi chơi bóng chuyền mỗi Chủ nhật."},{"en":"What did you have for lunch?","vi":"Bạn đã ăn gì vào bữa trưa?"},{"en":"The life is beautiful.","ok":false,"note":"nói chung → Life is beautiful."}],"mistake":{"wrong":"I love the nature.","right":"I love nature.","why":"nature (thiên nhiên) nói chung là danh từ trừu tượng → không the."},"tip":"Có 'of …' hoặc cụm chỉ rõ phía sau → thêm the (the life of Beethoven). Không có → bỏ the.","src":"tr. 228–229","check":{"type":"mcq","q":"Chọn câu đúng:","options":["Books are the quietest of friends.","The books are the quietest of friends."],"answer":0,"explain":"Nói về sách nói chung → Books, không the.","src":"tr. 228"}},{"title":"Tên địa danh: có the hay không?","icon":"🗺️","rule":"Đa số tên riêng (**nước, thành phố, núi, hồ, đường, công viên, sân bay**) **không** the; **sông, biển, đại dương, sa mạc, dãy núi, quần đảo**, tên có **of**, **Republic/Kingdom/States** hoặc số nhiều thì **có the**.","explain":"Mẹo: tên chỉ gồm tên riêng (Japan, Hanoi, Kennedy Airport, Oxford University) → không the. Tên có danh từ chung kiểu 'Republic, Kingdom, States', có 'of', hoặc ở số nhiều → the: the United States, the University of London, the Philippines. Với miền: **the** north of France nhưng northern France (không the). Ngoài ra: khách sạn, rạp, bảo tàng thường có the (the Science Museum); công ty, hãng bay thì không (Sony, Vietnam Airlines).","diagram":{"type":"table","title":"Địa danh: Ø hay the?","head":["Không the","Có the"],"rows":[["Vietnam, France (nước)","the United States, the Philippines"],["Hanoi, Texas (thành phố, bang)","the Pacific (đại dương), biển"],["Everest, Lake Michigan","the Mekong, the Alps (sông, dãy núi)"],["Hyde Park, Times Square","the Sahara (sa mạc)"],["Kennedy Airport, Oxford University","the University of London"],["Mars, Sony, Vietnam Airlines","the Middle East, the north of France"]]},"examples":[{"en":"I'd love to visit Japan and **the** Philippines.","vi":"Tôi rất muốn đến Nhật Bản và Philippines."},{"en":"**The** Mekong is a very long river.","vi":"Sông Mê Kông là một con sông rất dài."},{"en":"He studied at **the** University of London.","vi":"Anh ấy học ở Đại học London."},{"en":"They climbed the Everest.","ok":false,"note":"tên núi đơn lẻ không có the → climbed Everest"}],"mistake":{"wrong":"I went to the Japan last year.","right":"I went to Japan last year.","why":"Tên quốc gia thường không có the (trừ tên có States, Kingdom, Republic hoặc số nhiều)."},"tip":"Chỉ toàn tên riêng → Ø. Có 'of', có số nhiều, hoặc là sông / biển / đại dương / dãy núi → the.","src":"tr. 229–231","check":{"type":"mcq","q":"Chọn cặp đúng:","options":["Hanoi — the Red River","the Hanoi — Red River","the Hanoi — the Red River"],"answer":0,"explain":"Thành phố không có the (Hanoi); sông có the (the Red River).","src":"tr. 229–230"}},{"title":"go to school hay go to the school?","icon":"🏫","rule":"Với **school, hospital, church, prison, university…**: đến vì **mục đích chính** → **không the**; nói đến **tòa nhà** hoặc đến vì việc khác → **the**.","explain":"Học sinh đi học: go to **school**. Bệnh nhân nhập viện: taken to **hospital**. Tù nhân: sent to **prison**. Nhưng phụ huynh đến trường gặp cô giáo: went to **the** school; khách đến xem nhà thờ: went to **the** church. Tương tự, các cụm cố định với **bed, home, work, sea, town** không có the: go to bed, in bed, at home, go home, at work, go to work, in town. Lưu ý: tiếng Anh Mỹ luôn nói **the** hospital.","diagram":{"type":"flow","title":"school, hospital, prison: có the không?","start":{"q":"Đến để làm việc chính của nơi đó?","branches":[{"label":"Đúng (học, chữa bệnh, ở tù)","to":{"result":"Ø: go to school, sent to prison","icon":"🎒"}},{"label":"Không (đi thăm, họp, xem)","to":{"result":"the: went to the school to see…","icon":"🏢"}}]}},"examples":[{"en":"My son goes to school by bus.","vi":"Con trai tôi đi học bằng xe buýt."},{"en":"I went to **the** school to talk to his teacher.","vi":"Tôi đến trường để nói chuyện với cô giáo của cháu."},{"en":"She's at home, but he's still at work.","vi":"Cô ấy ở nhà, còn anh ấy vẫn đang ở chỗ làm."},{"en":"I sat down on **the** bed.","vi":"Tôi ngồi xuống cái giường."},{"en":"I usually go to the bed at 11.","ok":false,"note":"đi ngủ → go to bed"}],"mistake":{"wrong":"I'm tired. I'm going to the home.","right":"I'm tired. I'm going home.","why":"go home là cụm cố định: không the, cũng không to."},"tip":"Dùng nơi đó đúng 'vai' của mình (học sinh, bệnh nhân, tù nhân) → bỏ the. Chỉ là khách ghé qua → the.","src":"tr. 231–232","check":{"type":"mcq","q":"Mrs Lan went to ___ prison to visit her son.","options":["the","(không dùng gì)"],"answer":0,"shuffle":false,"explain":"Bà Lan đến nhà tù để **thăm** con, không phải để ở tù → nói về tòa nhà → **the** prison.","src":"tr. 231"}},{"title":"Thời gian, TV và sở hữu cách","icon":"📅","rule":"**Không** mạo từ với **thứ, tháng** (on Monday, in May), với **watch television**, và trước **tên người + 's** (Tim's house).","explain":"on Thursday, in September: không mạo từ. Mùa: in spring hoặc in the spring đều được. Có tính từ hoặc cụm chỉ rõ thì có mạo từ: on **a** wet Monday evening, in **the** summer that year. watch television (xem TV giải trí) không the, nhưng turn off **the** television (cái máy). Ngược lại, thường nói listen to **the** radio, go to **the** cinema. Sở hữu cách: Tim's house, KHÔNG 'the Tim's house'; nhưng the boss's wife được vì the đi với boss.","examples":[{"en":"See you on Monday.","vi":"Hẹn gặp bạn vào thứ Hai."},{"en":"I usually watch television in the evening.","vi":"Tôi thường xem tivi vào buổi tối."},{"en":"Can you turn off **the** television?","vi":"Bạn tắt cái tivi giùm được không?"},{"en":"I often listen to **the** radio in the car.","vi":"Tôi hay nghe radio trên xe."},{"en":"This is the Tim's house.","ok":false,"note":"tên người + 's không có the → Tim's house"}],"mistake":{"wrong":"My birthday is in the May.","right":"My birthday is in May.","why":"Tên tháng không có mạo từ."},"tip":"Lịch (thứ, tháng) → trống. TV để xem → trống; TV là cái máy → the.","src":"tr. 232–233"}],"practice":[{"type":"mcq","q":"She plays ___ tennis every weekend.","options":["the","a","(không dùng gì)"],"answer":2,"shuffle":false,"explain":"Môn thể thao không có mạo từ: play tennis.","src":"tr. 229"},{"type":"mcq","q":"Chọn câu đúng:","options":["Love is more important than money.","The love is more important than the money."],"answer":0,"explain":"love, money ở đây nói chung → không the.","src":"tr. 228–229"},{"type":"classify","q":"Tên nào có the, tên nào không?","buckets":["Có the","Không the"],"items":[{"text":"Pacific Ocean","bucket":0},{"text":"Japan","bucket":1},{"text":"Philippines","bucket":0},{"text":"Everest","bucket":1},{"text":"Thames (sông)","bucket":0},{"text":"Hyde Park","bucket":1},{"text":"White House","bucket":0},{"text":"Lake Michigan","bucket":1}],"explain":"Có the: đại dương, sông, tên số nhiều (Philippines), công trình nổi tiếng bắt đầu bằng tính từ (the White House). Không the: quốc gia, núi, công viên, hồ.","src":"tr. 229–231"},{"type":"mcq","q":"The thief was sent to ___ prison for two years.","options":["the","(không dùng gì)"],"answer":1,"shuffle":false,"explain":"Tên trộm vào tù **với tư cách tù nhân** (mục đích chính của nhà tù) → không the: sent to prison.","src":"tr. 231"},{"type":"fill","q":"I'm very tired, so I'm going to ___ now. (bed)","answer":["bed"],"explain":"go to bed (đi ngủ) là cụm cố định, không the.","src":"tr. 232"},{"type":"fill","q":"Last summer we sailed across ___ . (Atlantic — có the không?)","answer":["the Atlantic","the Atlantic Ocean"],"explain":"Đại dương có the: **the Atlantic**.","src":"tr. 230"},{"type":"fill","q":"My cousin lives in ___ . (Canada — có the không?)","answer":["Canada"],"explain":"Tên quốc gia thường không có the: **Canada**.","src":"tr. 229"},{"type":"fix","wrong":"I usually have the lunch at 12.","answer":["I usually have lunch at 12.","I usually have lunch at twelve."],"explain":"Bữa ăn không có the: have lunch.","src":"tr. 229"},{"type":"fix","wrong":"We climbed the Mount Fuji last year.","answer":["We climbed Mount Fuji last year."],"explain":"Tên một ngọn núi không có the: Mount Fuji, Everest.","src":"tr. 229"},{"type":"fix","wrong":"This is the Lan's bike.","answer":["This is Lan's bike."],"explain":"Tên người + 's không có the đứng trước.","src":"tr. 233"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["She","went","to","the","church","to","see","the","windows."],"explain":"Cô ấy đến nhà thờ để **xem cửa kính** (như một du khách), không phải để cầu nguyện → **the** church.","src":"tr. 231"}],"flashcards":[{"front":"play ___ football: có the không?","back":"Không: **play football** (môn thể thao)."},{"front":"Life is… hay The life is…?","back":"**Life** is beautiful (nói chung). Nhưng: the life of Beethoven."},{"front":"go to school hay go to the school?","back":"go to school = **đi học**; go to the school = đến **tòa nhà** trường vì việc khác."},{"front":"Tên nước: Vietnam hay the Vietnam?","back":"**Vietnam**. Nhưng: the United States, the Philippines."},{"front":"Sông, biển, đại dương có the không?","back":"Có: **the** Mekong, **the** Pacific."},{"front":"watch television hay watch the television?","back":"**watch television**; nhưng turn off **the** television (cái máy)."}]}],"quiz":{"pass":0.8,"questions":[{"type":"mcq","q":"She is ___ honest woman.","options":["a","an","the"],"answer":1,"shuffle":false,"explain":"honest có h câm, đọc bắt đầu bằng âm nguyên âm → **an** honest woman.","src":"tr. 221"},{"type":"mcq","q":"I need to buy ___ new umbrella.","options":["a","an"],"answer":0,"explain":"Xét âm của từ **ngay sau** mạo từ: new bắt đầu bằng /n/ → **a** new umbrella (dù umbrella đi một mình là an umbrella).","src":"tự soạn"},{"type":"fix","wrong":"My uncle is taxi driver.","answer":["My uncle is a taxi driver."],"explain":"Nghề nghiệp cần a/an: is **a** taxi driver.","src":"tr. 222"},{"type":"fix","wrong":"She is a my neighbour.","answer":["She is a neighbour of mine.","She is my neighbour.","She is a neighbor of mine.","She is my neighbor."],"explain":"a không đứng cạnh my: nói **a neighbour of mine** hoặc **my neighbour**.","src":"tr. 223"},{"type":"mcq","q":"There's a cup and a glass on the table. ___ cup is mine.","options":["A","The","(không dùng gì)"],"answer":1,"shuffle":false,"explain":"cup đã được nhắc ở câu trước → **The** cup.","src":"tự soạn"},{"type":"mcq","q":"I saw ___ accident this morning. ___ driver was badly hurt.","options":["an / The","a / The","the / A"],"answer":0,"shuffle":false,"explain":"Lần đầu nhắc tai nạn, accident bắt đầu bằng âm nguyên âm → **an** accident. Người lái xe là người của chính vụ tai nạn đó, người nghe hiểu là ai → **The** driver.","src":"tự soạn"},{"type":"fill","q":"Ho Chi Minh City is ___ biggest city in Vietnam. (a/the)","answer":["the"],"explain":"biggest là so sánh nhất → **the** biggest.","src":"tr. 226"},{"type":"mcq","q":"Chọn câu đúng:","options":["The poor need our help.","Poor need our help.","The poors need our help."],"answer":0,"explain":"the + tính từ = nhóm người: **the poor**. Tính từ không thêm -s.","src":"tr. 228"},{"type":"classify","q":"Chỗ trống cần gì?","buckets":["a/an","the","Không mạo từ"],"items":[{"text":"Look at ___ sky!","bucket":1},{"text":"play ___ football","bucket":2},{"text":"France is ___ European country.","bucket":0},{"text":"go fishing on ___ Mekong","bucket":1},{"text":"have ___ breakfast at seven","bucket":2},{"text":"I left ___ hour ago.","bucket":0}],"explain":"sky duy nhất → the; sông → the Mekong. European âm /j/ → a; hour h câm → an. Thể thao và bữa ăn → không mạo từ.","src":"tr. 221–230"},{"type":"mcq","q":"Chọn câu nói về sách nói chung:","options":["Books are good friends.","The books are good friends."],"answer":0,"explain":"Nói chung về sách → số nhiều không the. The books chỉ những cuốn sách cụ thể.","src":"tr. 228"},{"type":"fill","q":"He stole a car, so now he is in ___ . (prison)","answer":["prison","jail"],"explain":"Anh ta ở tù với tư cách tù nhân → không the: in prison.","src":"tr. 231"},{"type":"fill","q":"Next year I want to visit ___ . (Netherlands — có the không?)","answer":["the Netherlands"],"explain":"Tên nước ở dạng số nhiều có the: **the Netherlands**.","src":"tr. 230"},{"type":"fix","wrong":"I go to the work by bus.","answer":["I go to work by bus."],"explain":"go to work là cụm cố định, không the.","src":"tr. 232"},{"type":"fix","wrong":"The happiness is more important than money.","answer":["Happiness is more important than money."],"explain":"happiness là danh từ trừu tượng, nói chung → không the.","src":"tr. 229"},{"type":"fix","wrong":"We stayed at a hotel in the Paris.","answer":["We stayed at a hotel in Paris."],"explain":"Tên thành phố không có the.","src":"tr. 229"},{"type":"mcq","q":"Chọn câu đúng:","options":["We have a test on Friday.","We have a test on the Friday."],"answer":0,"explain":"Thứ trong tuần không có mạo từ: on Friday.","src":"tr. 232"},{"type":"mcq","q":"It's late. Please turn off ___ television and go to bed.","options":["the","a","(không dùng gì)"],"answer":0,"shuffle":false,"explain":"Tắt **cái máy** tivi → **the** television. (Xem tivi giải trí mới là watch television, không the.)","src":"tr. 233"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","met","a","friend","of","mine","at","the","station."],"answer":["At the station I met a friend of mine.","I met a friend of mine at the station."],"explain":"a friend of mine (không: a my friend); the station = nhà ga mà cả hai đều biết.","src":"tr. 223, 224"}]}},{"id":"11-luong-tu","title":"Lượng từ","en":"Quantifiers","icon":"🔢","pages":"240–253","summary":"Lượng từ (quantifier) là những từ đứng trước danh từ để nói 'bao nhiêu': some, any, much, many, a lot of, few, a little, all, most, every, each... Chọn đúng lượng từ phụ thuộc vào 3 câu hỏi: danh từ đếm được hay không, câu khẳng định hay phủ định/câu hỏi, và bạn muốn nói 'ít quá' hay 'có một ít'. Chủ đề gồm 2 bài.","mindmap":{"label":"Lượng từ","children":[{"label":"some / any","icon":"🤏","children":[{"label":"some: khẳng định, lời mời"},{"label":"any: phủ định, câu hỏi"},{"label":"any = bất cứ: any bus"}]},{"label":"Nhiều","icon":"📈","children":[{"label":"many + N đếm được số nhiều"},{"label":"much + N không đếm được"},{"label":"a lot of / lots of: cả hai"},{"label":"so / as / too + much / many"}]},{"label":"Ít","icon":"📉","children":[{"label":"few / a few + N đếm được"},{"label":"little / a little + N không đếm được"}]},{"label":"Tất cả / phần lớn","icon":"🧩","children":[{"label":"all / most / some / no + N"},{"label":"all of / most of / none of + the/my/them"}]},{"label":"Mỗi","icon":"☝️","children":[{"label":"every: cả nhóm (= all)"},{"label":"each: từng cái một"}]}]},"lessons":[{"id":"11a","title":"some / any; much / many / a lot of","minutes":25,"goal":"Chọn đúng some hay any theo loại câu, và chọn đúng much, many hay a lot of theo loại danh từ và loại câu.","pretest":[{"type":"mcq","q":"I don't have ___ money.","options":["some","any"],"answer":1,"explain":"Câu phủ định (don't) → dùng **any**.","src":"tự soạn"},{"type":"mcq","q":"How ___ students are there in your class?","options":["much","many"],"answer":1,"explain":"**students** đếm được, số nhiều → **many**.","src":"tự soạn"},{"type":"mcq","q":"Would you like ___ coffee?","options":["some","any"],"answer":0,"explain":"Đây là **lời mời** → dùng **some**, dù là câu hỏi.","src":"tr. 240"}],"hook":{"icon":"🛒","text":"Bạn đi chợ. Tiếng Việt chỉ cần 'một ít', 'nhiều', 'có... không?'. Tiếng Anh thì phải hỏi thêm hai câu: **cái này đếm được không?** (táo đếm được, đường thì không) và **mình đang khẳng định, phủ định hay hỏi?** Trả lời xong hai câu đó là chọn được từ đúng."},"diagram":{"type":"flow","title":"Chọn much, many hay a lot of?","start":{"q":"Đứng sau so / as / too?","branches":[{"label":"Có","to":{"result":"Bắt buộc much / many: too many, so much","icon":"⚠️"}},{"label":"Không","to":{"q":"Câu khẳng định?","branches":[{"label":"Có","to":{"result":"a lot of / lots of (cả 2 loại N)","icon":"👍"}},{"label":"Phủ định / câu hỏi","to":{"q":"Danh từ đếm được?","branches":[{"label":"Có","to":{"result":"many + N số nhiều: many friends","icon":"🍎"}},{"label":"Không","to":{"result":"much + N không đếm được: much money","icon":"💧"}}]}}]}}]}},"chunks":[{"title":"some và any: một ít / ... nào","icon":"🤏","rule":"**some** dùng trong câu **khẳng định**; **any** dùng trong câu **phủ định** và **câu hỏi**. Cả hai đi với danh từ đếm được số nhiều hoặc danh từ không đếm được.","explain":"some và any đều chỉ một số lượng không rõ là bao nhiêu, khi không cần nói con số chính xác. Tiếng Việt dùng 'một ít', 'nào' tuỳ câu mà không đổi từ gốc; tiếng Anh thì đổi hẳn từ: có → some, không/hỏi → any.","formula":"S + V + some + N số nhiều / N không đếm được\nS + don't/didn't + V + any + N\nDo/Are... + any + N?","examples":[{"en":"I bought **some** apples.","vi":"Tôi đã mua vài quả táo."},{"en":"There isn't **any** milk in the fridge.","vi":"Trong tủ lạnh không có chút sữa nào."},{"en":"Are there **any** eggs?","vi":"Có quả trứng nào không?"},{"en":"I don't have some time.","ok":false,"note":"câu phủ định → any"}],"mistake":{"wrong":"We didn't see some birds.","right":"We didn't see any birds.","why":"Câu phủ định (didn't) dùng any, không dùng some."},"tip":"Có **not** hoặc dấu **?** → nghĩ ngay tới **any**.","src":"tr. 240","check":{"type":"mcq","q":"There aren't ___ chairs in the room.","options":["some","any"],"answer":1,"explain":"aren't = phủ định → **any**.","src":"tự soạn"}},{"title":"Khi some vào câu hỏi, khi any vào câu khẳng định","icon":"🔄","rule":"Dùng **some** trong câu hỏi khi đó là **lời mời, lời yêu cầu, lời đề nghị** (hoặc mong câu trả lời 'Yes'). Dùng **any** nghĩa là **'bất cứ'** được cả trong câu khẳng định, và sau never, without...","explain":"Mời ai uống cà phê thì bạn mong họ nói 'có', nên tiếng Anh vẫn giữ some. Còn any khi mang nghĩa 'bất cứ cái nào cũng được' thì đi được với cả danh từ đếm được số ít: any bus = bất cứ chuyến xe buýt nào.","formula":"Would you like / Can I have + some + N?\nany + N = bất cứ N nào","examples":[{"en":"Would you like **some** more coffee?","vi":"Bạn uống thêm chút cà phê nhé?"},{"en":"Can I have **some** sugar, please?","vi":"Cho tôi xin ít đường nhé?"},{"en":"You can catch **any** bus.","vi":"Bạn có thể bắt bất cứ chuyến xe buýt nào."},{"en":"He never does **any** work.","vi":"Anh ta chẳng bao giờ làm việc gì cả."}],"mistake":{"wrong":"Would you like any tea?","right":"Would you like some tea?","why":"Lời mời → dùng some, dù câu có dấu hỏi."},"tip":"Mời, xin, đề nghị → **some**. 'Bất cứ' → **any**.","src":"tr. 240–241","check":{"type":"mcq","q":"Come and see me ___ time you like.","options":["some","any"],"answer":1,"explain":"Nghĩa là 'bất cứ lúc nào bạn muốn' → **any**, dù câu khẳng định.","src":"tr. 241"}},{"title":"many, much, a lot of","icon":"📈","rule":"**many** + danh từ **đếm được số nhiều**; **much** + danh từ **không đếm được**; **a lot of / lots of** dùng được với **cả hai**.","explain":"Tiếng Việt chỉ có một chữ 'nhiều'. Tiếng Anh tách theo loại danh từ (bạn đã học ở bài danh từ: đếm được thì có số nhiều -s, không đếm được thì không). Thói quen chung: many/much hay dùng trong câu **phủ định và câu hỏi**, còn câu **khẳng định** thường dùng a lot of / lots of.","formula":"many + N số nhiều (friends, books)\nmuch + N không đếm được (money, time)\na lot of / lots of / plenty of + cả hai","diagram":{"type":"table","title":"Cụm chỉ 'nhiều'","head":["N đếm được số nhiều","N không đếm được"],"rows":[["many","much"],["a large number of","a large amount of"],["a great number of","a great deal of"],["plenty of / a lot of / lots of","plenty of / a lot of / lots of"]]},"examples":[{"en":"We didn't spend **much** money on presents.","vi":"Chúng tôi không tiêu nhiều tiền cho quà."},{"en":"But we spent **a lot of** money on the party.","vi":"Nhưng chúng tôi tiêu nhiều tiền cho bữa tiệc."},{"en":"How **many** brothers do you have?","vi":"Bạn có mấy anh em trai?"},{"en":"**A large number of** students have part-time jobs.","vi":"Rất nhiều sinh viên có việc làm thêm."},{"en":"I don't have many money.","ok":false,"note":"money không đếm được → much"}],"mistake":{"wrong":"She has much friends.","right":"She has a lot of friends.","why":"friends đếm được → không dùng much; câu khẳng định nên dùng a lot of."},"tip":"Hỏi 'How many?' (mấy cái?) với thứ đếm được, 'How much?' (bao nhiêu?) với thứ phải đong.","src":"tr. 241–243","check":{"type":"mcq","q":"How ___ water do you drink a day?","options":["many","much"],"answer":1,"explain":"**water** không đếm được → **much**.","src":"tự soạn"}},{"title":"Sau so / as / too: chỉ much, many","icon":"⚠️","rule":"Sau **so, as, too** phải dùng **much / many**, không dùng a lot of, lots of, plenty of.","explain":"Đây là chỗ a lot of 'bị cấm'. Nói 'quá nhiều' (too), 'nhiều đến nỗi' (so) hay 'nhiều bằng' (as... as) thì chỉ có much hoặc many. Vẫn chọn much/many theo loại danh từ như bình thường.","formula":"so / as / too + much + N không đếm được\nso / as / too + many + N số nhiều","examples":[{"en":"There is **so much** traffic today.","vi":"Hôm nay xe cộ đông quá."},{"en":"You made **too many** mistakes.","vi":"Bạn mắc quá nhiều lỗi."},{"en":"I have **as many** friends as him.","vi":"Tôi có nhiều bạn bằng anh ấy."},{"en":"There is so a lot of traffic.","ok":false,"note":"sau so không dùng a lot of"}],"mistake":{"wrong":"You made too lots of mistakes.","right":"You made too many mistakes.","why":"Sau too chỉ dùng much/many."},"tip":"**so – as – too** là 'ba người gác cổng': chỉ cho **much / many** đi qua.","src":"tr. 243"}],"practice":[{"type":"classify","q":"Chỗ trống cần some hay any?","buckets":["some","any"],"items":[{"text":"I bought ___ bread.","bucket":0},{"text":"There isn't ___ milk.","bucket":1},{"text":"Can I have ___ sugar, please?","bucket":0},{"text":"I didn't buy ___ bread.","bucket":1},{"text":"Would you like ___ cake?","bucket":0},{"text":"He never does ___ work.","bucket":1}],"explain":"Khẳng định, lời mời, lời xin → **some**. Phủ định (isn't, didn't, never) → **any**.","src":"tự soạn"},{"type":"classify","q":"Danh từ này đi với many hay much?","buckets":["many","much"],"items":[{"text":"books","bucket":0},{"text":"money","bucket":1},{"text":"students","bucket":0},{"text":"time","bucket":1},{"text":"eggs","bucket":0},{"text":"homework","bucket":1}],"explain":"Đếm được số nhiều (books, students, eggs) → **many**. Không đếm được (money, time, homework) → **much**.","src":"tr. 242"},{"type":"mcq","q":"How ___ money do you have?","options":["many","much","a lot of"],"answer":1,"explain":"**money** không đếm được → **much**. Câu hỏi 'How ...?' không dùng a lot of.","src":"tự soạn"},{"type":"mcq","q":"She has ___ friends in Hanoi.","options":["much","a lot of","a large amount of"],"answer":1,"explain":"Câu khẳng định, friends đếm được → **a lot of**. much và a large amount of chỉ đi với danh từ không đếm được.","src":"tự soạn"},{"type":"mcq","q":"You can catch ___ bus. They all go to the city centre.","options":["any","many","much"],"answer":0,"explain":"Nghĩa 'bất cứ xe buýt nào' → **any**, đi được với danh từ số ít. many/much không đi với bus số ít.","src":"tr. 241"},{"type":"fill","q":"There is too ___ traffic today. (much / many)","answer":["much"],"hint":"traffic đếm được không?","explain":"Sau **too** chỉ dùng much/many; **traffic** không đếm được → **much**.","src":"tr. 243"},{"type":"fill","q":"Would you like ___ more tea? (some / any)","answer":["some"],"explain":"Lời mời → **some**, dù là câu hỏi.","src":"tr. 240"},{"type":"fill","q":"I don't have ___ time today. (much / many)","answer":["much"],"explain":"Câu phủ định, **time** không đếm được → **much**.","src":"tự soạn"},{"type":"fix","wrong":"I don't have some money.","answer":["I don't have any money.","I don't have much money."],"explain":"Câu phủ định → **any**, không dùng some.","src":"tự soạn"},{"type":"fix","wrong":"There were so a lot of people at the party.","answer":["There were so many people at the party."],"explain":"Sau **so** không dùng a lot of; **people** đếm được số nhiều → **so many**.","src":"tr. 243"},{"type":"fix","wrong":"He made too much mistakes.","answer":["He made too many mistakes."],"explain":"**mistakes** đếm được số nhiều → **many**, không phải much.","src":"tr. 243"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["How","many","eggs","do","we","need?"],"explain":"eggs đếm được → **How many** + N số nhiều + do + S + V?","src":"tự soạn"}],"flashcards":[{"front":"some hay any trong câu phủ định / câu hỏi?","back":"**any**: There isn't any milk. / Are there any eggs?"},{"front":"Lời mời 'Bạn uống chút cà phê nhé?' dùng some hay any?","back":"**some**: Would you like some coffee?"},{"front":"any còn có nghĩa gì trong câu khẳng định?","back":"**bất cứ**: You can catch any bus."},{"front":"many hay much + money?","back":"**much** (money không đếm được): How much money...?"},{"front":"Từ nào chỉ 'nhiều' dùng được cho cả N đếm được và không đếm được?","back":"**a lot of / lots of / plenty of**: a lot of friends, a lot of time"},{"front":"Sau so / as / too dùng a lot of được không?","back":"Không, chỉ **much / many**: too many mistakes, so much traffic"}]},{"id":"11b","title":"few / little; all / most / none (of); every / each","minutes":25,"goal":"Phân biệt few với a few, little với a little; biết khi nào cần 'of' sau all/most/some/none; dùng every, each với danh từ số ít.","pretest":[{"type":"mcq","q":"He spoke ___ English, so it was difficult to talk to him.","options":["little","a little"],"answer":0,"explain":"Khó nói chuyện → ít đến mức không đủ → **little** (nghĩa phủ định).","src":"tr. 244"},{"type":"mcq","q":"Every ___ has a number.","options":["room","rooms"],"answer":0,"explain":"**every** + danh từ **số ít**.","src":"tr. 246"},{"type":"mcq","q":"Chọn câu đúng:","options":["Most of people like music.","Most people like music."],"answer":1,"explain":"Không có the/my... trước danh từ → không dùng of: **Most people**.","src":"tr. 245"}],"hook":{"icon":"🥛","text":"Ly sữa còn một chút. Người bi quan nói: 'Còn **ít** quá!' (little). Người lạc quan nói: 'Vẫn còn **một ít**!' (a little). Cùng một lượng sữa, nhưng chữ **a** đổi cả thái độ của câu. Bài này dạy bạn những chữ nhỏ mà đổi nghĩa lớn như vậy."},"diagram":{"type":"flow","title":"Chọn few, a few, little hay a little?","start":{"q":"Danh từ đếm được số nhiều?","branches":[{"label":"Có","to":{"q":"Ý bạn muốn nói?","branches":[{"label":"Ít quá, không đủ","to":{"result":"few: few friends","icon":"😟"}},{"label":"Có một vài","to":{"result":"a few: a few friends","icon":"🙂"}}]}},{"label":"Không đếm được","to":{"q":"Ý bạn muốn nói?","branches":[{"label":"Ít quá, không đủ","to":{"result":"little: little time","icon":"😟"}},{"label":"Có một ít","to":{"result":"a little: a little salt","icon":"🙂"}}]}}]}},"chunks":[{"title":"few / a few, little / a little","icon":"🥛","rule":"**few / a few** + danh từ **đếm được số nhiều**; **little / a little** + danh từ **không đếm được**. Không có a → **ít quá** (phủ định); có **a** → **có một ít** (khẳng định).","explain":"few = not many, little = not much: ít hơn mong muốn. a few, a little gần nghĩa với some: một lượng nhỏ nhưng vẫn có. Lưu ý: **only a few / only a little** lại mang nghĩa phủ định (= not many / not much).","formula":"few / a few + N số nhiều\nlittle / a little + N không đếm được","examples":[{"en":"**Few** customers have come into the shop. It has been quiet.","vi":"Ít khách vào cửa hàng. Cửa hàng vắng."},{"en":"**A few** customers have come into the shop. It has been fairly busy.","vi":"Có vài khách vào cửa hàng. Cửa hàng khá bận."},{"en":"He spoke **a little** English, so we were able to communicate with him.","vi":"Anh ấy nói được chút tiếng Anh nên chúng tôi nói chuyện được."},{"en":"I have a few money.","ok":false,"note":"money không đếm được → a little"}],"mistake":{"wrong":"I have a little friends here.","right":"I have a few friends here.","why":"friends đếm được → few / a few, không dùng little."},"tip":"Có **a** = có 'của ăn của để' (tích cực). Mất **a** = 'thiếu' (tiêu cực).","src":"tr. 243–244","check":{"type":"mcq","q":"Don't worry. We still have ___ time before the train leaves.","options":["little","a little","a few"],"answer":1,"explain":"'Đừng lo, vẫn còn' → nghĩa khẳng định; time không đếm được → **a little**.","src":"tự soạn"}},{"title":"all / most / some / no + danh từ","icon":"🧩","rule":"**all, most, some, no** đứng **thẳng trước** danh từ số nhiều hoặc không đếm được, **không cần of**, khi nói chung chung.","explain":"Khi nói 'phần lớn người Thuỵ Sĩ', 'tất cả trẻ con' (nói chung, không chỉ nhóm cụ thể nào), danh từ không có the/my... đứng trước, nên không dùng of. Người Việt hay dịch 'phần lớn **của** mọi người' rồi thêm of, đó là lỗi.","formula":"all / most / some / no (+ tính từ) + N số nhiều / N không đếm được","examples":[{"en":"**All** children are fond of candy.","vi":"Trẻ con đều thích kẹo."},{"en":"**Most** cheese is made from cow's milk.","vi":"Phần lớn pho mát làm từ sữa bò."},{"en":"There are **no** rooms available.","vi":"Không còn phòng trống nào."},{"en":"Most of Swiss people understand French.","ok":false,"note":"nói chung → Most Swiss people"}],"mistake":{"wrong":"Most of people here are friendly.","right":"Most people here are friendly.","why":"people không có the/my đứng trước → bỏ of."},"tip":"Không có **the / my / this** phía sau → **không có of**.","src":"tr. 244–245"},{"title":"all of / most of / some of / none of","icon":"🎯","rule":"Dùng **all of, most of, some of, none of** trước **từ hạn định** (the, my, this, these...) hoặc **đại từ** (them, us, it).","explain":"Từ hạn định (determiner) là những từ như a, the, my, his, this đứng trước danh từ để xác định nó. Khi nói về một nhóm cụ thể (bạn **của tôi**, **những** người đó) thì cần of. Sau all và half có thể bỏ of nếu sau đó là the/my...; nhưng trước đại từ (them, it) thì **phải giữ of**.","formula":"all / most / some / none + of + the / my / these... + N\nall / most / some / none + of + them / us / it","examples":[{"en":"**Most of** her friends live in Hanoi.","vi":"Phần lớn bạn bè của cô ấy sống ở Hà Nội."},{"en":"**Some of** those people are very friendly.","vi":"Vài người trong số đó rất thân thiện."},{"en":"**None of** them belong to me.","vi":"Không cái nào trong số đó là của tôi."},{"en":"**All (of)** my friends came.","vi":"Tất cả bạn tôi đều đến."},{"en":"I know all them.","ok":false,"note":"trước đại từ phải giữ of: all of them"}],"mistake":{"wrong":"Half it is mine.","right":"Half of it is mine.","why":"Trước đại từ (it, them) không được bỏ of."},"tip":"**the / my / this** → of tuỳ chọn sau all, half. **them / it / us** → of bắt buộc.","src":"tr. 245","check":{"type":"mcq","q":"Chọn câu đúng:","options":["All them came.","All of them came.","All of they came."],"answer":1,"explain":"Trước đại từ phải có **of**, và sau of dùng đại từ tân ngữ **them**.","src":"tr. 245"}},{"title":"every và each","icon":"☝️","rule":"**every** và **each** + danh từ **đếm được số ít** (động từ số ít). **every** nhìn cả nhóm (= all); **each** nhìn từng cái riêng, và dùng được cho nhóm **hai**.","explain":"Cả hai đều dịch là 'mỗi', và nhiều khi dùng thay nhau được (each/every time I see you). Khác ở cách nhìn: every day = tất cả các ngày; each person in turn = từng người một. Nhóm chỉ có hai thứ (hai bên đường, hai tay) thì dùng each. each còn đứng một mình hoặc đi với of: each of the students, each of them.","formula":"every / each + N số ít + V số ít\neach of + the / my... + N số nhiều / each of them","diagram":{"type":"table","title":"every hay each?","head":["","every","each"],"rows":[["Cách nhìn","cả nhóm (= all)","từng cái riêng"],["Số lượng","3 trở lên, thường nhiều","2 trở lên, thường nhóm nhỏ"],["Đi với of?","không: every of ✗","có: each of them"]]},"examples":[{"en":"I go to work **every** day.","vi":"Ngày nào tôi cũng đi làm."},{"en":"There are shops on **each** side of the street.","vi":"Hai bên đường đều có cửa hàng."},{"en":"**Each of** the students has a book.","vi":"Mỗi học sinh đều có một cuốn sách."},{"en":"Every rooms has a number.","ok":false,"note":"every + N số ít: room"}],"mistake":{"wrong":"Every people likes music.","right":"Every person likes music.","why":"every + danh từ số ít; people là số nhiều."},"tip":"Hai thứ (hai bên, hai tay) → **each**. 'Ngày nào cũng' → **every** day.","src":"tr. 246–247","check":{"type":"mcq","q":"She wore a ring on ___ hand.","options":["each","every"],"answer":0,"explain":"Người chỉ có **hai** tay → nhóm hai → **each**.","src":"tự soạn"}}],"practice":[{"type":"classify","q":"Danh từ này đi với (a) few hay (a) little?","buckets":["few / a few","little / a little"],"items":[{"text":"friends","bucket":0},{"text":"time","bucket":1},{"text":"people","bucket":0},{"text":"money","bucket":1},{"text":"books","bucket":0},{"text":"salt","bucket":1}],"explain":"Đếm được số nhiều → **few / a few**. Không đếm được → **little / a little**.","src":"tr. 243"},{"type":"mcq","q":"I have ___ friends here, so I'm not lonely.","options":["few","a few","a little"],"answer":1,"explain":"'Không cô đơn' → có một vài bạn (khẳng định) → **a few**. few = ít quá (sẽ cô đơn); a little không đi với friends.","src":"tự soạn"},{"type":"mcq","q":"The film was boring, so ___ people came to see it.","options":["few","a few","a little"],"answer":0,"explain":"Phim chán → ít người đến, ít hơn mong đợi → **few** (phủ định).","src":"tự soạn"},{"type":"mcq","q":"___ children like candy.","options":["All","All of","Every"],"answer":0,"explain":"Nói chung, không có the/my → **All children**. Every phải đi với số ít (every child).","src":"tr. 245"},{"type":"mcq","q":"___ my friends live in Hanoi.","options":["Most","Most of","Every"],"answer":1,"explain":"Có **my** phía sau → cần of: **Most of** my friends. Every không đi với my friends.","src":"tr. 245"},{"type":"mcq","q":"There are two doors, one on ___ side of the room.","options":["each","every"],"answer":0,"explain":"Chỉ có **hai** bên → **each** (every dùng cho 3 trở lên).","src":"tr. 247"},{"type":"fill","q":"Every student ___ a laptop. (have)","answer":["has"],"explain":"every + danh từ số ít → động từ số ít: **has**.","src":"tr. 246"},{"type":"fill","q":"I invited ten people, but none ___ them came.","answer":["of"],"explain":"Trước đại từ **them** phải có **of**: none of them.","src":"tr. 245"},{"type":"fix","wrong":"Every rooms has a number.","answer":["Every room has a number.","Each room has a number."],"explain":"every + danh từ **số ít**: room.","src":"tr. 246"},{"type":"fix","wrong":"Most of people here are friendly.","answer":["Most people here are friendly.","Most of the people here are friendly."],"explain":"Không có the/my → bỏ of: **Most people**. Hoặc thêm the để nói về nhóm cụ thể: Most of the people.","src":"tr. 245"},{"type":"fix","wrong":"I have a few money left.","answer":["I have a little money left.","I have little money left."],"explain":"**money** không đếm được → **a little**, không dùng a few.","src":"tr. 243"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Each","of","the","students","has","a","book."],"explain":"**Each of** + the + N số nhiều, nhưng động từ vẫn số ít (**has**) vì chủ ngữ là each.","src":"tr. 247"}],"flashcards":[{"front":"few khác a few thế nào?","back":"**few** = ít quá (not many); **a few** = có một vài (some). Few people came. / A few people came."},{"front":"little hay few + time?","back":"**little / a little** (time không đếm được): a little time"},{"front":"Most people hay Most of people?","back":"**Most people** (không có the/my thì không dùng of). Có the/my: Most of the people."},{"front":"Bỏ of được không: all of them?","back":"Không. Trước đại từ phải giữ of: **all of them**. Trước the/my thì bỏ được: all (of) my friends."},{"front":"every / each + danh từ số ít hay số nhiều?","back":"**Số ít**: every room, each student (+ động từ số ít)"},{"front":"Nhóm hai thứ (hai bên đường) dùng every hay each?","back":"**each**: each side of the street"}]}],"quiz":{"pass":0.8,"questions":[{"type":"mcq","q":"We didn't spend ___ money on presents.","options":["much","many","a few"],"answer":0,"explain":"Câu phủ định, **money** không đếm được → **much**. many và a few chỉ đi với danh từ đếm được.","src":"tr. 242"},{"type":"mcq","q":"Can I have ___ sugar, please?","options":["some","any","many"],"answer":0,"explain":"Lời xin → **some** dù là câu hỏi. many không đi với sugar (không đếm được).","src":"tr. 240"},{"type":"classify","q":"Danh từ này đi với many hay much?","buckets":["many","much"],"items":[{"text":"information","bucket":1},{"text":"mistakes","bucket":0},{"text":"traffic","bucket":1},{"text":"friends","bucket":0},{"text":"coffee","bucket":1},{"text":"people","bucket":0}],"explain":"Đếm được số nhiều (mistakes, friends, people) → **many**; không đếm được (information, traffic, coffee) → **much**.","src":"tr. 242"},{"type":"fill","q":"He never does ___ work at home. (some / any)","answer":["any"],"explain":"Sau **never** (nghĩa phủ định) → **any**.","src":"tr. 241"},{"type":"fill","q":"She has so ___ friends that she never feels lonely. (much / many)","answer":["many"],"explain":"Sau **so** chỉ dùng much/many; **friends** đếm được → **many**.","src":"tr. 243"},{"type":"mcq","q":"A ___ of students have part-time jobs.","options":["large number","large amount","great deal"],"answer":0,"explain":"**students** đếm được → **a large number of**. a large amount of / a great deal of dùng cho danh từ không đếm được.","src":"tr. 242"},{"type":"fix","wrong":"There isn't some water in the bottle.","answer":["There isn't any water in the bottle.","There isn't much water in the bottle."],"explain":"Câu phủ định → **any**.","src":"tự soạn"},{"type":"fix","wrong":"She drank too lots of coffee.","answer":["She drank too much coffee."],"explain":"Sau **too** không dùng lots of; coffee không đếm được → **too much**.","src":"tr. 243"},{"type":"mcq","q":"'Few customers came into the shop today.' Cửa hàng hôm nay thế nào?","options":["Vắng, rất ít khách","Khá đông, có vài khách"],"answer":0,"explain":"**few** (không có a) = ít hơn mong đợi → cửa hàng vắng. 'A few customers' mới là có vài khách.","src":"tr. 243–244"},{"type":"fill","q":"Add ___ salt to the soup, but not too much. (a little / a few)","answer":["a little"],"explain":"**salt** không đếm được, nghĩa 'một ít' → **a little**.","src":"tr. 244"},{"type":"fix","wrong":"I have a little friends in this city.","answer":["I have a few friends in this city.","I have few friends in this city."],"explain":"**friends** đếm được → **a few**.","src":"tr. 243"},{"type":"mcq","q":"___ of them belong to me.","options":["None","No","Every"],"answer":0,"explain":"Trước **of + đại từ** dùng **none**. no phải đứng thẳng trước danh từ (no rooms); every không đi với of.","src":"tr. 245"},{"type":"mcq","q":"Chọn câu SAI:","options":["All my friends came.","All of my friends came.","All them came.","All of them came."],"answer":2,"shuffle":false,"explain":"Trước the/my, of sau all là tuỳ chọn; trước đại từ (them) phải giữ of → 'All them came' sai.","src":"tr. 245"},{"type":"fix","wrong":"Each of the student has a book.","answer":["Each of the students has a book."],"explain":"Sau **each of the** danh từ ở số nhiều (students); động từ vẫn số ít (has).","src":"tr. 247"},{"type":"mcq","q":"I go to the gym ___ day.","options":["every","most","many"],"answer":0,"explain":"**every** + danh từ số ít (day). most và many cần danh từ số nhiều (most days, many days).","src":"tr. 246"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Most","of","my","friends","speak","English."],"explain":"Có **my** → dùng **Most of** + my + N số nhiều.","src":"tự soạn"}]}}],"order":1}</script>
<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('course-data').textContent);
  var app = document.getElementById('app');
  var REVIEW_DAYS = [1, 3, 7, 14, 30];

  // ---------- storage (per viewer, optional) ----------
  var KEY = 'egc:' + D.slug;
  var S = { done: {}, quiz: {}, cards: {}, mix: 0 };
  try { var raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  try { var th = localStorage.getItem('egc:theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}

  // ---------- indexes ----------
  var lessonById = {}, topicById = {}, lessonTopic = {};
  D.topics.forEach(function (t) {
    topicById[t.id] = t;
    t.lessons.forEach(function (l) { lessonById[l.id] = l; lessonTopic[l.id] = t; });
  });

  // ---------- helpers ----------
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') n.className = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k === 'text') n.textContent = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    });
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  // safe mini-markup: **bold**, *italic*, ~~strike~~
  function fmt(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, '$1<em>$2</em>')
      .replace(/~~(.+?)~~/g, '<del>$1</del>').replace(/\n/g, '<br>');
  }
  function rich(tag, s, cls) { return el(tag, { class: cls, html: fmt(s) }); }
  function srcTag(src) {
    if (!src) return null;
    var self = /tự soạn/i.test(src);
    return el('span', { class: 'src', text: (self ? '✍️ ' : '📖 ') + src });
  }
  function norm(s) {
    return String(s).toLowerCase().replace(/[’‘`]/g, "'").replace(/[“”]/g, '"')
      .replace(/\s+/g, ' ').replace(/\s*([,.!?;:])\s*/g, '$1 ').replace(/[.!?\s]+$/, '').trim();
  }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function today() { return new Date().toISOString().slice(0, 10); }
  function addDays(iso, n) { var d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
  function fmtDate(iso) { var p = iso.split('-'); return p[2] + '/' + p[1]; }
  function go(h) { location.hash = h; }
  function confetti() {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var sy = ['🎉', '⭐', '✨', '🎊', '💯'];
    for (var i = 0; i < 36; i++) {
      var s = el('span', { class: 'confetti', text: sy[i % sy.length] });
      s.style.left = Math.random() * 100 + 'vw';
      s.style.animationDelay = Math.random() * 0.5 + 's';
      document.body.appendChild(s);
      setTimeout(function (n) { return function () { n.remove(); }; }(s), 2600);
    }
  }
  function ring(pct) {
    var r = 36, c = 2 * Math.PI * r;
    var svg = '<svg class="ring" viewBox="0 0 84 84"><circle class="bg" cx="42" cy="42" r="' + r + '"/>' +
      '<circle class="fg" cx="42" cy="42" r="' + r + '" stroke-dasharray="' + c + '" stroke-dashoffset="' + c + '"/>' +
      '<text x="42" y="49" text-anchor="middle">' + Math.round(pct) + '%</text></svg>';
    var w = el('div', { html: svg });
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      var fg = w.querySelector('.fg'); if (fg) fg.style.strokeDashoffset = c * (1 - pct / 100);
    }); });
    return w.firstChild;
  }
  function observeReveal(root) {
    var items = root.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) { items.forEach(function (n) { n.classList.add('in'); }); return; }
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    items.forEach(function (n) { io.observe(n); });
  }
  function topicProgress(t) {
    var n = t.lessons.filter(function (l) { return S.done[l.id]; }).length;
    return { done: n, total: t.lessons.length };
  }

  // ---------- diagrams ----------
  function wrapText(s, max) {
    var words = String(s).split(/\s+/), lines = [], cur = '';
    words.forEach(function (w) {
      if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; }
      else cur = (cur + ' ' + w).trim();
    });
    if (cur) lines.push(cur);
    return lines;
  }
  function toTree(n, kind, edge) {
    // mindmap: {label, icon?, children[]}; flow: {q, branches[{label,to}]} | {result, icon?}
    var label, kids = [], role;
    if (kind === 'flow') {
      if (n.result != null) { label = n.result; role = 'result'; }
      else { label = n.q; role = 'ask'; kids = (n.branches || []).map(function (b) { return toTree(b.to, kind, b.label); }); }
    } else {
      label = n.label; role = 'map';
      kids = (n.children || []).map(function (c) { return toTree(c, kind); });
    }
    if (n.icon) label = n.icon + ' ' + label;
    return { label: label, kids: kids, role: role, edge: edge };
  }
  var PALETTE = ['--c1', '--c2', '--c3', '--c4', '--c5', '--c6'];
  function measure(node, maxChars, fixedW) {
    node.lines = wrapText(node.label, maxChars);
    var longest = node.lines.reduce(function (m, l) { return Math.max(m, l.length); }, 0);
    node.w = fixedW || Math.min(260, Math.max(70, longest * 7.4 + 26));
    node.h = node.lines.length * 18 + 16;
    node.kids.forEach(function (k) { measure(k, maxChars, fixedW); });
  }
  function svgNode(n, color, cls, delay) {
    var t = n.lines.map(function (l, i) {
      return '<tspan x="' + (n.x + n.w / 2) + '" y="' + (n.y + 21 + i * 18) + '">' + esc(l) + '</tspan>';
    }).join('');
    var style = cls === 'map' || cls === 'root' ? ' style="fill:color-mix(in srgb, var(' + color + ') 14%, var(--surface));stroke:var(' + color + ')"' : '';
    return '<g class="node ' + cls + '" style="animation-delay:' + delay + 'ms"><rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="10"' + style + '/>' +
      '<text text-anchor="middle">' + t + '</text></g>';
  }
  function renderMindmap(d) {
    var root = toTree(d.root, 'map');
    measure(root, 24);
    var GAP = 12, HG = 46;
    function sh(n) { var s = n.kids.reduce(function (a, k) { return a + sh(k); }, 0) + GAP * Math.max(0, n.kids.length - 1); n.sh = Math.max(n.h, s); return n.sh; }
    sh(root);
    var maxX = 0;
    function place(n, top, x, depth, color) {
      n.x = x; n.depth = depth; n.color = color;
      if (n.kids.length) {
        var sum = n.kids.reduce(function (a, k) { return a + k.sh; }, 0) + GAP * (n.kids.length - 1);
        var y = top + (n.sh - sum) / 2;
