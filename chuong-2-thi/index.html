oked everything.","bucket":1}],"explain":"**no sooner … than**, **hardly … when**: đừng trộn cặp. *By the time* + quá khứ (*came*) → việc xong trước dùng *had cooked*, không phải *have cooked*.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng: (Khi tôi về đến nhà thì mẹ đang nấu cơm tối.)","words":["My","mother","was","cooking","dinner","when","I","got","home."],"explain":"Quá khứ đi với quá khứ: việc **đang diễn ra** *was cooking* + việc xen vào *got home*.","src":"tự soạn"},{"type":"mcq","q":"I'll make dinner after I ___ a shower.","options":["take","will take","took"],"answer":0,"explain":"Mệnh đề chính *I'll make* ở tương lai → sau *after* dùng hiện tại đơn **take**, không dùng will. *took* là quá khứ, sai thời gian.","src":"tự soạn"},{"type":"mcq","q":"We won't leave until everyone ___ ready.","options":["is","will be","was"],"answer":0,"explain":"Mệnh đề chính *won't leave* ở tương lai → sau *until* dùng hiện tại đơn **is**. *will be* là lỗi thêm will vào mệnh đề thời gian.","src":"tự soạn"},{"type":"mcq","q":"Before you ___ the test, read all the questions carefully.","options":["start","will start","started"],"answer":0,"explain":"Câu mệnh lệnh (*read*) nói về việc sắp làm → sau *before* dùng hiện tại đơn **start**. *will start* sai vì mệnh đề thời gian không dùng will.","src":"tự soạn"},{"type":"mcq","q":"By the time we ___ at the hotel, it will be dark.","options":["arrive","will arrive","arrived"],"answer":0,"explain":"Mệnh đề chính *it will be dark* ở tương lai → sau *by the time* dùng hiện tại đơn **arrive**. Chữ 'sẽ' đã nằm ở *will be*, không thêm *will* vào mệnh đề thời gian.","src":"tự soạn"},{"type":"mcq","q":"Since I left Venezuela six years ago, I ___ to visit friends and family several times.","options":["have returned","returned","return"],"answer":0,"explain":"*Since I left* chỉ **mốc** đã qua; các lần về thăm tính **tới nay** → hiện tại hoàn thành **have returned**. *returned, return* không đi với since kiểu này.","src":"tr. 314"},{"type":"mcq","q":"I've felt much better since I ___ eating fast food.","options":["stopped","stop","had stopped"],"answer":0,"explain":"Mệnh đề chính *I've felt* ở hiện tại hoàn thành; việc bỏ đồ ăn nhanh là **mốc** đã qua → quá khứ đơn **stopped**. *had stopped* là quá khứ hoàn thành, không đi với *I've felt*.","src":"tự soạn"},{"type":"mcq","q":"It's a year since my best friend ___ abroad.","options":["moved","moves","had moved"],"answer":0,"explain":"*It's* (= It is) … since: nhìn từ bây giờ, việc ra nước ngoài là **mốc** đã qua → quá khứ đơn **moved**. *had moved* chỉ đi với *It was …*; *moves* là hiện tại, sai thời gian.","src":"tự soạn"},{"type":"mcq","q":"Chọn câu đúng:","options":["I'll send you the photos once I get home.","I'll send you the photos once I will get home.","I'll send you the photos once I got home."],"answer":0,"explain":"Mệnh đề chính *I'll send* ở tương lai → sau *once* dùng hiện tại đơn **get**, không dùng will. *got* là quá khứ, sai thời gian.","src":"tự soạn"},{"type":"fill","q":"The village ___ (have) no electricity until a new generator is installed.","answer":["will have","'ll have","is going to have"],"explain":"Mệnh đề thời gian *until … is installed* đã ở hiện tại, nhưng ý cả câu là tương lai → **mệnh đề chính** mới mang 'sẽ': **will have**. Chữ will nằm ở mệnh đề chính, không nằm sau until.","src":"tr. 312"},{"type":"fill","q":"When Minh met his old teacher last year, it was twenty years since they ___ (see) each other.","answer":["had seen","'d seen","saw"],"explain":"*It was … since*: nhìn từ một lúc trong quá khứ (năm ngoái) → sau since hay dùng **quá khứ hoàn thành** *had seen*, như sách: *It was … since her father had died*. Sách cũng cho phép quá khứ đơn sau *It is/was … since*, nên *saw* cũng được tính đúng (tr. 310).","src":"tự soạn"},{"type":"fill","q":"I'll be waiting at the gate when your plane ___ (land).","answer":["lands"],"explain":"Mệnh đề chính *I'll be waiting* ở tương lai → sau *when* dùng hiện tại đơn **lands** (chủ ngữ số ít → -s), không dùng *will land*.","src":"tự soạn"},{"type":"fill","q":"Our dog ___ (be) very quiet since my grandfather died.","answer":["has been","'s been"],"explain":"*since my grandfather died* là mốc đã qua; con chó im lặng **từ đó tới nay** → hiện tại hoàn thành **has been**. *is* (hiện tại đơn) là lỗi dịch 'nó im lặng từ khi…'.","src":"tự soạn"},{"type":"fix","wrong":"We will start the meeting as soon as the manager will arrive.","answer":["We will start the meeting as soon as the manager arrives.","We will start the meeting as soon as the manager has arrived."],"explain":"Không dùng will trong mệnh đề sau *as soon as* → **arrives** (hoặc *has arrived*). Chữ 'sẽ' đã nằm ở *We will start*.","src":"tự soạn"},{"type":"fix","wrong":"I live in this flat since I started my new job.","answer":["I have lived in this flat since I started my new job.","I've lived in this flat since I started my new job.","I have been living in this flat since I started my new job.","I've been living in this flat since I started my new job."],"explain":"Với *since*, mệnh đề chính nói khoảng thời gian **tới nay** → hiện tại hoàn thành **have lived** (hoặc *have been living*), không dùng hiện tại đơn *live*.","src":"tự soạn"},{"type":"classify","q":"Ý tương lai sau đây khi vào mệnh đề thời gian (sau when, until, while…) thì đổi thành thì nào?","buckets":["Hiện tại đơn","Hiện tại tiếp diễn","Hiện tại hoàn thành"],"items":[{"text":"will open","bucket":0},{"text":"will call","bucket":0},{"text":"will be sleeping","bucket":1},{"text":"will be working","bucket":1},{"text":"will have finished","bucket":2},{"text":"will have paid","bucket":2}],"explain":"Bỏ *will*, giữ 'dáng' của thì: *will open* → **opens**; *will be sleeping* → **is/are sleeping**; *will have finished* → **has/have finished**.","src":"tr. 310"},{"type":"order","q":"Sắp xếp thành câu đúng: (Đã mấy tuần rồi tôi không gọi điện cho bà.)","words":["It's","weeks","since","I","last","called","my","grandma."],"explain":"*It's* … since … **last** + quá khứ đơn: *last called* (lần cuối gọi điện là một mốc đã qua).","src":"tự soạn"}]]}}],"order":2}</script>
<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('course-data').textContent);
  var app = document.getElementById('app');
  var REVIEW_DAYS = [1, 3, 7, 14, 30];

  // ---------- storage (per viewer, optional) ----------
  var KEY = 'egc:' + D.slug;
  var S = { done: {}, quiz: {}, cards: {}, mix: 0 };
  try { var raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  try { var th = localStorage.getItem('egc:theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}

  // ---------- indexes ----------
  var lessonById = {}, topicById = {}, lessonTopic = {};
  D.topics.forEach(function (t) {
    topicById[t.id] = t;
    t.lessons.forEach(function (l) { lessonById[l.id] = l; lessonTopic[l.id] = t; });
  });

  // ---------- helpers ----------
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') n.className = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k === 'text') n.textContent = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    });
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  // safe mini-markup: **bold**, *italic*, ~~strike~~
  function fmt(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, '$1<em>$2</em>')
      .replace(/~~(.+?)~~/g, '<del>$1</del>').replace(/\n/g, '<br>');
  }
  function rich(tag, s, cls) { return el(tag, { class: cls, html: fmt(s) }); }
  function srcTag(src) {
    if (!src) return null;
    var self = /tự soạn/i.test(src);
    return el('span', { class: 'src', text: (self ? '✍️ ' : '📖 ') + src });
  }
  // Commas are ignored: a beginner who writes the right words without "However," punctuation
  // should not be marked wrong.
  function norm(s) {
    return String(s).toLowerCase().replace(/[’‘`]/g, "'").replace(/[“”]/g, '"').replace(/,/g, ' ')
      .replace(/\s+/g, ' ').replace(/\s*([,.!?;:])\s*/g, '$1 ').replace(/[.!?\s]+$/, '').trim();
  }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function today() { return new Date().toISOString().slice(0, 10); }
  function addDays(iso, n) { var d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
  function fmtDate(iso) { var p = iso.split('-'); return p[2] + '/' + p[1]; }
  function go(h) { location.hash = h; }
  function confetti() {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var sy = ['🎉', '⭐', '✨', '🎊', '💯'];
    for (var i = 0; i < 36; i++) {
      var s = el('span', { class: 'confetti', text: sy[i % sy.length] });
      s.style.left = Math.random() * 100 + 'vw';
      s.style.animationDelay = Math.random() * 0.5 + 's';
      document.body.appendChild(s);
      setTimeout(function (n) { return function () { n.remove(); }; }(s), 2600);
    }
  }
  function ring(pct) {
    var r = 36, c = 2 * Math.PI * r;
    var svg = '<svg class="ring" viewBox="0 0 84 84"><circle class="bg" cx="42" cy="42" r="' + r + '"/>' +
      '<circle class="fg" cx="42" cy="42" r="' + r + '" stroke-dasharray="' + c + '" stroke-dashoffset="' + c + '"/>' +
      '<text x="42" y="49" text-anchor="middle">' + Math.round(pct) + '%</text></svg>';
    var w = el('div', { html: svg });
    requestAnimationFrame(function () { requestAnimationFrame(function () {

  // ---------- diagrams ----------

      if (q.explain) fb.appendChild(rich('div', q.explain));
      var st = srcTag(q.src); if (st) fb.appendChild(st);

    }
    var head = el('div', { class: 'qtext' }, [num != null ? el('span', { class: 'qnum', text: String(num) }) : null]);
    wrap.appendChild(head);

    if (q.type === 'mcq') {
      head.appendChild(rich('span', q.q));

          btns.forEach(function (x) { x.disabled = true; });

        bar
      ]);
      setTimeout(function () { bar.firstChild.style.width = (p.total ? p.done * 100 / p.total : 0) + '%'; }, 150);
      grid.appendChild(card);
    });
    v.appendChild(grid);
    v.appendChild(el('h2', { text: '🎯 Luyện tập tổng hợp' }));
    v.appendChild(el('div', { class: 'grid' }, [
      el('a', { class: 'card topic-card reveal', href: '#/mix' }, [el('div', { class: 'ico', text: '🔀' }), el('h3', { text: 'Bài trộn' }), el('div', { class: 'small muted', text: 'Câu hỏi trộn từ nhiều chủ đề đã học. Luyện khả năng nhận ra phải dùng quy tắc nào.' })]),
      el('a', { class: 'card topic-card reveal', href: '#/cards' }, [el('div', { class: 'ico', text: '🃏' }), el('h3', { text: 'Flashcard' }), el('div', { class: 'small muted', text: 'Ôn thẻ theo lịch cách quãng. Có thể tải về Anki.' })])
    ]));
    return v;
  }

  function viewTopic(t) {
    var v = el('div');
    v.appendChild(crumbs([['Trang chính', '#/'], [t.title]]));
    var p = topicProgress(t);
    v.appendChild(el('div', { class: 'card hero reveal' }, [
      el('div', { class: 'big-icon', text: t.icon || '📘' }),
      el('div', { style: 'flex:1;min-width:220px' }, [
        el('h1', { text: t.title }), el('div', { class: 'muted en', text: t.en || '' }),
        t.summary ? rich('p', t.summary) : null,
        el('div', {}, [t.pages ? el('span', { class: 'pill', text: '📖 tr. ' + t.pages }) : null, el('span', { class: 'pill accent', text: p.done + '/' + p.total + ' bài' })])
      ])
    ]));
    if (t.mindmap) { v.appendChild(el('h2', { text: '🧠 Toàn cảnh chủ đề' })); v.appendChild(diagram({ type: 'mindmap', root: t.mindmap })); }
    v.appendChild(el('h2', { text: '📝 Bài học' }));
    var list = el('div', { class: 'lesson-list' });
    t.lessons.forEach(function (l, i) {
      list.appendChild(el('a', { href: '#/l/' + l.id, class: 'reveal' }, [
        el('span', { class: 'num' + (S.done[l.id] ? ' done' : ''), text: S.done[l.id] ? '✓' : String(i + 1) }),
        el('span', { style: 'flex:1' }, [el('div', { text: l.title }), el('div', { class: 'small muted', text: '⏱ ' + (l.minutes || 25) + ' phút · ' + l.chunks.length + ' mẩu kiến thức' })])
      ]));
    });
    v.appendChild(list);
    var sets = quizSets(t);
    if (sets.length) {
      var qbox = el('div', { class: 'card reveal' }, [
        el('h3', { text: '🏁 Bài nghiệm thu' }),
        el('p', { class: 'muted', text: sets.length + ' đề, mỗi đề cần đúng từ ' + Math.round((t.quiz.pass || 0.8) * 100) + '% để đạt. Nên làm sau khi học xong các bài; làm đủ các đề để nhớ lâu.' })
      ]);
      sets.forEach(function (qs, i) {
        var qz = S.quiz[quizKey(t, i)];
        qbox.appendChild(el('div', { class: 'row', style: 'margin:8px 0' }, [
          el('b', { text: 'Đề ' + (i + 1) }),
          el('span', { class: 'small muted', text: qs.length + ' câu' }),
          qz ? el('span', { class: 'pill ' + (qz.passed ? 'ok' : 'warn'), text: 'Cao nhất: ' + qz.best + '%' }) : null,
          el('a', { class: 'btn' + (qz ? ' ghost' : ''), href: '#/q/' + t.id + '/' + (i + 1), text: qz ? 'Làm lại' : 'Bắt đầu' })
        ]));
      });
      v.appendChild(qbox);
    }
    return v;
  }

  function lessonSteps(l) {
    var steps = [];
    if (l.pretest && l.pretest.length) steps.push({ key: 'warmup', icon: '🤔', title: 'Khởi động: đoán thử' });
    steps.push({ key: 'picture', icon: '🔭', title: 'Bức tranh lớn' });
    l.chunks.forEach(function (c, i) { steps.push({ key: 'c' + (i + 1), icon: c.icon || '🧩', title: 'Mẩu ' + (i + 1) + ': ' + c.title, chunk: c }); });
    steps.push({ key: 'recall', icon: '🧠', title: 'Nhớ lại không nhìn bài' });
    steps.push({ key: 'practice', icon: '✍️', title: 'Luyện tập' });
    if (l.flashcards && l.flashcards.length) steps.push({ key: 'cards', icon: '🃏', title: 'Thẻ ghi nhớ' });
    return steps;
  }
  function viewLesson(l, stepKey) {
    var t = lessonTopic[l.id];
    var steps = lessonSteps(l);
    var idx = Math.max(0, steps.findIndex(function (s) { return s.key === stepKey; }));
    var s = steps[idx];
    var v = el('div');
    v.appendChild(crumbs([['Trang chính', '#/'], [t.title, '#/t/' + t.id], [l.title]]));
    var st = el('div', { class: 'stepper' });
    steps.forEach(function (_, i) { st.appendChild(el('i', { class: i < idx ? 'past' : i === idx ? 'on' : '' })); });
    v.appendChild(st);
    var card = el('div', { class: 'card' });
    card.appendChild(el('div', { class: 'step-title' }, [el('span', { class: 'ico', text: s.icon }), el('h2', { style: 'margin:0', text: s.title })]));
    var nextBtn = el('a', { class: 'btn', href: idx < steps.length - 1 ? '#/l/' + l.id + '/' + steps[idx + 1].key : '#/t/' + t.id, text: idx < steps.length - 1 ? 'Tiếp tục →' : 'Về chủ đề' });

    if (s.key === 'warmup') {
      card.appendChild(el('p', { class: 'muted', text: 'Chưa học gì cả, cứ đoán. Đoán sai rồi được sửa sẽ giúp bạn nhớ lâu hơn là đọc ngay đáp án.' }));
      if (l.goal) card.appendChild(rich('div', '🎯 **Mục tiêu:** ' + l.goal, 'hook'));
      card.appendChild(quizBlock(l.pretest));
    } else if (s.key === 'picture') {
      if (l.goal && !(l.pretest && l.pretest.length)) card.appendChild(rich('div', '🎯 **Mục tiêu:** ' + l.goal, 'hook'));
      if (l.hook) card.appendChild(rich('div', (l.hook.icon ? l.hook.icon + ' ' : '💡 ') + l.hook.text, 'hook'));
      if (l.diagram) card.appendChild(diagram(l.diagram));
      card.appendChild(el('p', { class: 'muted small', text: 'Bài này có ' + l.chunks.length + ' mẩu: ' + l.chunks.map(function (c) { return c.title; }).join(' · ') }));
    } else if (s.chunk) {
      var c = s.chunk;
      card.classList.add('chunk');
      card.appendChild(rich('div', c.rule, 'rule reveal'));
      if (c.explain) card.appendChild(rich('p', c.explain, 'reveal'));
      if (c.formula) card.appendChild(el('div', { class: 'formula reveal', html: fmt(c.formula) }));
      if (c.diagram) card.appendChild(diagram(c.diagram));
      if (c.examples && c.examples.length) {
        var exs = el('div', { class: 'reveal' });
        c.examples.forEach(function (e) {
          var ok = e.ok !== false;
          exs.appendChild(el('div', { class: 'ex' + (ok ? '' : ' wrong') }, [
            el('span', { class: 'mark ' + (ok ? 'y' : 'n'), text: ok ? '✓' : '✗' }),
            el('div', {}, [rich('div', e.en, 'en'), e.vi ? rich('div', e.vi, 'vi') : null, e.note ? rich('div', '↳ ' + e.note, 'note') : null])
          ]));
        });
        card.appendChild(exs);
      }
      if (c.mistake) card.appendChild(el('div', { class: 'mistake reveal', html: '⚠️ <b>Lỗi hay gặp:</b> <del class="en">' + esc(c.mistake.wrong) + '</del> → <span class="en"><b>' + esc(c.mistake.right) + '</b></span>' + (c.mistake.why ? '<br>' + fmt(c.mistake.why) : '') }));
      if (c.tip) card.appendChild(rich('div', '💡 **Mẹo nhớ:** ' + c.tip, 'tip reveal'));
      var sc = srcTag(c.src); if (sc) card.appendChild(sc);
      if (c.check) {
        card.appendChild(el('h3', { style: 'margin-top:18px', text: '⚡ Kiểm tra nhanh' }));
        card.appendChild(quizBlock([c.check]));
      }
    } else if (s.key === 'recall') {
      card.appendChild(el('p', { class: 'muted', text: 'Đừng kéo lên xem lại. Với mỗi mẩu, tự nói to (hoặc viết ra giấy) quy tắc và một ví dụ của riêng bạn, rồi bấm để so sánh.' }));
      l.chunks.forEach(function (c, i) {
        var ans = rich('div', c.rule, 'rule');
        ans.style.display = 'none';
        var b = el('button', { class: 'btn ghost', text: '👀 Xem quy tắc' });
        b.addEventListener('click', function () { ans.style.display = ''; ans.style.animation = 'pop .3s ease'; b.remove(); });
        card.appendChild(el('div', { class: 'q' }, [el('div', { class: 'qtext' }, [el('span', { class: 'qnum', text: String(i + 1) }), document.createTextNode(c.title + ': quy tắc là gì?')]), b, ans]));
      });
    } else if (s.key === 'practice') {
      card.appendChild(el('p', { class: 'muted', text: 'Câu hỏi tăng dần độ khó: nhận diện → điền → sửa lỗi → tự xây câu. Mỗi câu chỉ được trả lời một lần.' }));
      var res = el('div');
      card.appendChild(quizBlock(l.practice, function (got, tot) {
        var pct = Math.round(got * 100 / tot);
        var first = !S.done[l.id];
        if (!S.done[l.id]) S.done[l.id] = today();
        // practising again during a due review counts as that review
        rv = reviewsDue().filter(function (r) { return r.id === l.id; });
        if (!first && rv.length) { S.reviewed = S.reviewed || {}; S.reviewed[rv[0].key] = today(); }
        save();
        if (pct >= 80) confetti();
        res.appendChild(el('div', { class: 'card', style: 'text-align:center' }, [
          el('div', { class: 'score', text: pct + '%' }),
          el('p', { text: pct >= 80 ? '🎉 Tuyệt! Bài học đã được đánh dấu hoàn thành.' : '👍 Đã đánh dấu hoàn thành. Hãy xem lại các câu sai, và làm lại bài này vào ngày ôn tập.' }),
          el('p', { class: 'small muted', text: 'Lịch ôn bài này: ' + REVIEW_DAYS.map(function (n) { return fmtDate(addDays(S.done[l.id], n)); }).join(' → ') })
        ]));
      }));
      card.appendChild(res);
      var rv;
    } else if (s.key === 'cards') {
      card.appendChild(el('p', { class: 'muted', text: 'Bấm vào thẻ để lật. Các thẻ này sẽ quay lại trong mục Flashcard theo lịch ôn.' }));
      var mc = el('div', { class: 'mini-cards' });
      l.flashcards.forEach(function (c) { mc.appendChild(flashcard(c)); });
      card.appendChild(mc);
    }
    v.appendChild(card);
    var prev = idx > 0 ? el('a', { class: 'btn ghost', href: '#/l/' + l.id + '/' + steps[idx - 1].key, text: '← Quay lại' }) : el('span');
    v.appendChild(el('div', { class: 'step-nav' }, [prev, nextBtn]));
    return v;
  }

  function quizSets(t) {
    if (!t.quiz) return [];
    var s = t.quiz.sets || [t.quiz.questions || []];
    return s.filter(function (qs) { return qs && qs.length; });
  }
  function quizKey(t, i) { return i ? t.id + '#' + (i + 1) : t.id; }
  function viewQuiz(t, n) {
    var sets = quizSets(t);
    var i = Math.min(Math.max((parseInt(n, 10) || 1) - 1, 0), sets.length - 1);
    var v = el('div');
    v.appendChild(crumbs([['Trang chính', '#/'], [t.title, '#/t/' + t.id], ['Nghiệm thu' + (sets.length > 1 ? ' · Đề ' + (i + 1) : '')]]));
    v.appendChild(el('h1', { text: '🏁 Nghiệm thu: ' + t.title + (sets.length > 1 ? ' · Đề ' + (i + 1) : '') }));
    var pass = t.quiz.pass || 0.8;
    v.appendChild(el('p', { class: 'muted', text: sets[i].length + ' câu, cần đúng từ ' + Math.round(pass * 100) + '% để đạt. Câu hỏi được xáo trộn mỗi lần làm.' }));
    var res = el('div');
    v.appendChild(quizBlock(shuffle(sets[i]), function (got, tot) {
      var pct = Math.round(got * 100 / tot), ok = pct >= pass * 100;
      var key = quizKey(t, i);
      var prevQ = S.quiz[key] || { best: 0 };
      S.quiz[key] = { best: Math.max(prevQ.best, pct), passed: prevQ.passed || ok, at: today() };
      save();
      if (ok) confetti();
      var next = i + 1 < sets.length ? el('a', { class: 'btn ok', href: '#/q/' + t.id + '/' + (i + 2), text: 'Sang Đề ' + (i + 2) + ' →' }) : null;
      res.appendChild(el('div', { class: 'card', style: 'text-align:center' }, [
        el('div', { class: 'score', text: pct + '%' }),
        el('div', { class: 'small muted', text: 'Đúng ' + got + '/' + tot + ' câu' }),
        el('p', { text: ok ? '🏅 Đạt! Bạn đã qua đề này.' : '📌 Chưa đạt. Xem lại các câu sai và bài học tương ứng rồi làm lại nhé.' }),
        el('div', { class: 'row', style: 'justify-content:center' }, [el('a', { class: 'btn ghost', href: '#/t/' + t.id, text: 'Về chủ đề' }), el('button', { class: 'btn', text: 'Làm lại', onclick: function () { render(); scrollTo(0, 0); } }), next])
      ]));
      res.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }));
    v.appendChild(res);
    return v;
  }

  function viewMix() {
    var v = el('div');
    v.appendChild(crumbs([['Trang chính', '#/'], ['Bài trộn']]));
    v.appendChild(el('h1', { text: '🔀 Bài trộn' }));
    var learned = D.topics.filter(function (t) { return topicProgress(t).done > 0; });
    var pool = [];
    (learned.length >= 2 ? learned : D.topics).forEach(function (t) {
      t.lessons.forEach(function (l) { if (!learned.length || S.done[l.id]) (l.practice || []).forEach(function (q) { pool.push(q); }); });
    });
    v.appendChild(el('p', { class: 'muted', text: learned.length >= 2 ? 'Câu hỏi lấy ngẫu nhiên từ các bài bạn đã học, trộn lẫn nhiều chủ đề. Việc khó ở đây là nhận ra câu hỏi đang kiểm tra quy tắc nào.' : 'Bạn chưa học đủ 2 chủ đề nên câu hỏi được lấy từ toàn chương. Bài trộn hiệu quả nhất sau khi đã học vài chủ đề.' }));
    var qs = shuffle(pool).slice(0, 15);
    var res = el('div');
    v.appendChild(quizBlock(qs, function (got, tot) {
      var pct = Math.round(got * 100 / tot);
      S.mix = Math.max(S.mix || 0, pct); save();
      if (pct >= 80) confetti();
      res.appendChild(el('div', { class: 'card', style: 'text-align:center' }, [el('div', { class: 'score', text: pct + '%' }), el('button', { class: 'btn', text: '🔀 Trộn bộ mới', onclick: function () { render(); scrollTo(0, 0); } })]));
    }));
    v.appendChild(res);
    return v;
  }

  function viewCards() {
    var v = el('div');
    v.appendChild(crumbs([['Trang chính', '#/'], ['Flashcard']]));
    v.appendChild(el('h1', { text: '🃏 Flashcard' }));
    v.appendChild(el('div', { class: 'row' }, [el('button', { class: 'btn ghost', text: '⬇️ Tải về cho Anki', onclick: downloadAnki }), el('span', { class: 'small muted', text: allCards().length + ' thẻ trong cả chương' })]));
    var due = shuffle(dueCards());
    if (!due.length) {
      v.appendChild(el('div', { class: 'card' }, [el('p', { text: Object.keys(S.done).length ? '✅ Không còn thẻ nào đến hạn hôm nay. Quay lại vào ngày mai nhé!' : 'Học xong một bài thì thẻ của bài đó sẽ xuất hiện ở đây.' })]));
      return v;
    }
    var i = 0, holder = el('div');
    var info = el('p', { class: 'muted small' });
    v.appendChild(info); v.appendChild(holder);
    function show() {
      holder.innerHTML = '';
      if (i >= due.length) { confetti(); holder.appendChild(el('div', { class: 'card', html: '<p>🎉 Xong ' + due.length + ' thẻ hôm nay!</p>' })); info.textContent = ''; return; }
      var c = due[i];
      info.textContent = 'Thẻ ' + (i + 1) + '/' + due.length + ' · ' + lessonTopic[c.lesson].title + ' · bấm thẻ để lật';
      var f = flashcard(c);
      holder.appendChild(f);
      function grade(ok) {
        var st = S.cards[c.id] || { box: 0 };
        st.box = ok ? Math.min(st.box + 1, REVIEW_DAYS.length) : 0;
        st.due = addDays(today(), ok ? REVIEW_DAYS[st.box - 1] : 1);
        S.cards[c.id] = st; save(); i++; show();
      }
      holder.appendChild(el('div', { class: 'row', style: 'justify-content:center' }, [
        el('button', { class: 'btn ghost', text: '😕 Chưa nhớ', onclick: function () { grade(false); } }),
        el('button', { class: 'btn ok', text: '😄 Nhớ rồi', onclick: function () { grade(true); } })
      ]));
    }
    show();
    return v;
  }

  function render() {
    var h = location.hash.replace(/^#\/?/, '').split('/');
    var view;
    if (h[0] === 't' && topicById[h[1]]) view = viewTopic(topicById[h[1]]);
    else if (h[0] === 'l' && lessonById[h[1]]) view = viewLesson(lessonById[h[1]], h[2]);
    else if (h[0] === 'q' && topicById[h[1]] && quizSets(topicById[h[1]]).length) view = viewQuiz(topicById[h[1]], h[2]);
    else if (h[0] === 'mix') view = viewMix();
    else if (h[0] === 'cards') view = viewCards();
    else view = viewHome();
    app.innerHTML = '';
    app.appendChild(view);
    observeReveal(app);
  }
  window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });
  document.getElementById('theme-btn').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    var next = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('egc:theme', next); } catch (e) {}
  });
  render();
})();

</script>
</body>
</html>
