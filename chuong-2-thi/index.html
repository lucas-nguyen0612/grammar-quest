tted**.","src":"tự soạn"},{"type":"fix","wrong":"We are wining the match!","answer":["We are winning the match!","We're winning the match!"],"explain":"win: 1 âm tiết, 1 nguyên âm (i) + 1 phụ âm (n) → gấp đôi n: **winning**. (*wining* là từ khác, từ wine.)","src":"tự soạn"},{"type":"fix","wrong":"The police think he commited the crime.","answer":["The police think he committed the crime."],"explain":"commit nhấn âm cuối (com-**MIT**), tận cùng 1 nguyên âm + 1 phụ âm → gấp đôi t: **committed**.","src":"tự soạn"},{"type":"fill","q":"The teacher ___ the question twice. (repeat, quá khứ)","answer":["repeated"],"hint":"repeat đọc nhấn âm cuối: re-PEAT","explain":"repeat tuy nhấn âm cuối nhưng trước t có **2 nguyên âm** (e, a) → không gấp đôi, thêm thẳng: **repeated**.","src":"tự soạn"},{"type":"mcq","q":"explain nhấn âm cuối (ex-**PLAIN**). Vì sao viết **explained**, không gấp đôi n?","options":["Vì trước n có 2 nguyên âm (a, i)","Vì chữ n không bao giờ được gấp đôi","Vì explain có 2 âm tiết"],"answer":0,"explain":"Gấp đôi chỉ khi tận cùng **1 nguyên âm + 1 phụ âm**. explain tận cùng **ai + n** (2 nguyên âm) → thêm thẳng, giống rain → rained. n vẫn gấp đôi được (plan → planned); từ 2 âm tiết nhấn âm cuối vẫn gấp đôi được (prefer → preferred).","src":"tr. 285"},{"type":"mcq","q":"Động từ nào **gấp đôi** phụ âm cuối khi thêm -ing?","options":["regret (re-GRET)","enter (EN-ter)","gather (GATH-er)","boil"],"answer":0,"explain":"**regret** nhấn âm cuối, tận cùng 1 nguyên âm (e) + 1 phụ âm (t) → regretting. enter, gather nhấn âm đầu → entering, gathering. boil có 2 nguyên âm (o, i) trước l → boiling.","src":"tr. 285"},{"type":"mcq","q":"Chọn dạng V-ed viết **sai**:","options":["deliverred","edited","limited","suffered"],"answer":0,"explain":"deliver nhấn âm giữa (de-**LIV**-er), tiếng cuối không được nhấn → **delivered**, không gấp đôi r. edited (**ED**-it), limited (**LIM**-it), suffered (**SUF**-fer) đều nhấn âm đầu nên thêm thẳng, viết đúng.","src":"tự soạn"},{"type":"fill","q":"She ___ her hair before going out. (dry, quá khứ)","answer":["dried"],"explain":"dry: phụ âm r + y → đổi y thành i rồi thêm -ed: **dried**.","src":"tự soạn"},{"type":"fill","q":"Mum is ___ some eggs for breakfast. (fry)","answer":["frying"],"explain":"fry: phụ âm + y, nhưng thêm **-ing thì giữ y**: **frying** (đổi y thì thành 'friing', hai chữ i liền nhau).","src":"tự soạn"},{"type":"fix","wrong":"The children obeied their teacher.","answer":["The children obeyed their teacher."],"explain":"obey tận cùng **nguyên âm (e) + y** → giữ y, thêm thẳng -ed: **obeyed** (giống play → played). Chỉ phụ âm + y mới đổi y thành i.","src":"tự soạn"},{"type":"classify","q":"Khi thêm **-ing**, mỗi động từ thay đổi thế nào?","buckets":["Bỏ e","Gấp đôi phụ âm cuối","Thêm thẳng"],"items":[{"text":"move","bucket":0},{"text":"share","bucket":0},{"text":"dig","bucket":1},{"text":"shut","bucket":1},{"text":"put","bucket":1},{"text":"whisper (WHIS-per)","bucket":2},{"text":"throw","bucket":2},{"text":"sleep","bucket":2}],"explain":"moving, sharing (bỏ e). digging, shutting, putting (1 âm tiết, 1 nguyên âm + 1 phụ âm → gấp đôi). whispering (nhấn âm đầu), throwing (không gấp đôi w), sleeping (2 nguyên âm e, e) → thêm thẳng.","src":"tr. 284–285"},{"type":"classify","q":"Khi thêm **-ed**, mỗi động từ thay đổi thế nào?","buckets":["Đổi y → i","Gấp đôi phụ âm cuối","Chỉ thêm -d","Thêm -ed"],"items":[{"text":"deny","bucket":0},{"text":"empty","bucket":0},{"text":"grab","bucket":1},{"text":"skip","bucket":1},{"text":"chase","bucket":2},{"text":"receive","bucket":2},{"text":"destroy","bucket":3},{"text":"borrow","bucket":3}],"explain":"denied, emptied (phụ âm + y → i). grabbed, skipped (1 âm tiết, 1 nguyên âm + 1 phụ âm → gấp đôi). chased, received (tận cùng e → chỉ thêm d). destroyed (nguyên âm o + y, giữ y), borrowed (không gấp đôi w) → thêm -ed.","src":"tr. 284–285"},{"type":"mcq","q":"Ngôi thứ ba số ít (he/she) của **tidy** (dọn dẹp) là:","options":["tidies","tidys","tidyes"],"answer":0,"explain":"tidy: phụ âm d + y → đổi y thành i rồi thêm **-es**: **tidies** (giống study → studies).","src":"tr. 255–256"},{"type":"fix","wrong":"She buies fruit at the market every morning.","answer":["She buys fruit at the market every morning."],"explain":"buy tận cùng **nguyên âm (u) + y** → giữ y, chỉ thêm -s: **buys** (giống enjoy → enjoys, stay → stays).","src":"tr. 255–256"},{"type":"fix","wrong":"The baby touchs everything on the table.","answer":["The baby touches everything on the table."],"explain":"touch tận cùng **ch** → thêm **-es**: **touches** (giống watch → watches).","src":"tr. 255–256"},{"type":"fill","q":"My brother ___ to Da Nang every month. (fly, hiện tại đơn)","answer":["flies"],"explain":"Chủ ngữ ngôi thứ ba số ít → thêm -s/-es. fly: phụ âm l + y → đổi y thành i rồi thêm -es: **flies**.","src":"tr. 255–256"},{"type":"mcq","q":"allow nhấn âm cuối (al-**LOW**). Vì sao viết **allowing**, không gấp đôi w?","options":["Vì không bao giờ gấp đôi y, w, x","Vì allow nhấn âm đầu","Vì allow có 2 âm tiết"],"answer":0,"explain":"allow đúng là nhấn âm cuối, nhưng sách ghi rõ ngoại lệ: **không gấp đôi y, w, x** → allowing, allowed. Số âm tiết không phải lý do (prefer cũng 2 âm tiết mà vẫn gấp đôi).","src":"tr. 285"},{"type":"order","q":"Sắp xếp thành câu đúng (Họ đang thái rau):","words":["They","are","chopping","the","vegetables."],"explain":"Hiện tại tiếp diễn: are + V-ing. chop: 1 âm tiết, 1 nguyên âm (o) + 1 phụ âm (p) → gấp đôi p: **chopping**.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng (Mẹ tôi đang gói quà):","words":["My","mother","is","wrapping","the","presents."],"explain":"wrap: 1 âm tiết, 1 nguyên âm (a) + 1 phụ âm (p) → gấp đôi p: **wrapping**.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng (Họ đã hoãn cuộc họp):","words":["They","delayed","the","meeting."],"explain":"delay tận cùng **nguyên âm (a) + y** → giữ y, thêm thẳng -ed: **delayed**.","src":"tự soạn"},{"type":"mcq","q":"Đuôi -ed trong **asked** đọc thế nào?","options":["/t/","/d/","/ɪd/"],"answer":0,"explain":"ask có âm cuối /k/ (vô thanh) → -ed đọc **/t/**: /ɑ:skt/, 1 tiếng. Không phải /ɪd/ vì âm cuối không phải /t/, /d/.","src":"tự soạn"},{"type":"mcq","q":"Đuôi -ed trong **counted** đọc thế nào?","options":["/ɪd/","/t/","/d/"],"answer":0,"explain":"count có âm cuối /t/ → -ed đọc **/ɪd/**, thêm một tiếng: count-ed.","src":"tự soạn"},{"type":"mcq","q":"Đuôi -ed trong **advised** (đã khuyên) đọc thế nào?","options":["/d/","/t/","/ɪd/"],"answer":0,"explain":"advise đọc /ədˈvaɪz/: chữ s đọc **/z/** (hữu thanh), chữ e câm → -ed đọc **/d/**. Nhìn âm, không nhìn chữ s.","src":"tự soạn"},{"type":"mcq","q":"Đuôi -ed trong **noticed** (đã nhận ra) đọc thế nào?","options":["/t/","/d/","/ɪd/"],"answer":0,"explain":"notice đọc /ˈnəʊtɪs/: âm cuối **/s/** (vô thanh), chữ e câm → -ed đọc **/t/**: /ˈnəʊtɪst/. Không phải /ɪd/: chữ t nằm giữa từ, âm cuối là /s/.","src":"tự soạn"},{"type":"mcq","q":"Đuôi -ed trong **managed** (đã xoay xở được) đọc thế nào?","options":["/d/","/ɪd/","/t/"],"answer":0,"explain":"manage có âm cuối **/dʒ/** (hữu thanh), không phải /d/ → -ed đọc **/d/**: /ˈmænɪdʒd/, không thêm tiếng.","src":"tự soạn"},{"type":"mcq","q":"Chọn từ có đuôi -ed đọc **khác** các từ còn lại:","options":["dressed","nodded","wasted","guided"],"answer":0,"explain":"nodded, guided (âm cuối /d/), wasted (âm cuối /t/) → /ɪd/. **dressed**: âm cuối /s/ (vô thanh) → /t/: /drest/.","src":"tr. 285–286"},{"type":"mcq","q":"Chọn từ có đuôi -ed đọc **khác** các từ còn lại:","options":["filled","rushed","smoked","searched"],"answer":0,"explain":"rushed (/ʃ/), smoked (/k/), searched (/tʃ/): vô thanh → /t/. **filled**: âm cuối /l/ (hữu thanh) → /d/.","src":"tr. 285"},{"type":"mcq","q":"Chọn từ có đuôi -ed đọc **khác** các từ còn lại:","options":["wished","loved","turned","ordered"],"answer":0,"explain":"loved (/v/), turned (/n/), ordered (âm cuối hữu thanh) → /d/. **wished**: âm cuối /ʃ/ (vô thanh) → /t/.","src":"tr. 285"},{"type":"mcq","q":"Chọn từ có đuôi -s đọc **khác** các từ còn lại:","options":["pens","cups","books","shirts"],"answer":0,"explain":"cups (/p/), books (/k/), shirts (/t/) → /s/. **pens**: âm cuối /n/ (hữu thanh) → /z/. Quy tắc này dùng cho cả danh từ số nhiều.","src":"tr. 286"},{"type":"mcq","q":"Chọn từ có đuôi -s/-es đọc **khác** các từ còn lại:","options":["eggs","bridges","noses","matches"],"answer":0,"explain":"bridges (/dʒ/), noses (/z/), matches (/tʃ/): âm xuýt → /ɪz/, thêm một tiếng. **eggs**: âm cuối /g/ → /z/, không thêm tiếng.","src":"tr. 286"},{"type":"mcq","q":"Chọn từ có đuôi -s đọc **khác** các từ còn lại:","options":["meets","agrees","pays","sends"],"answer":0,"explain":"agrees, pays (tận cùng nguyên âm), sends (/d/): hữu thanh → /z/. **meets**: âm cuối /t/ → /s/.","src":"tr. 286"},{"type":"mcq","q":"Đuôi -s trong **likes** đọc thế nào?","options":["/s/","/z/","/ɪz/"],"answer":0,"explain":"like có âm cuối /k/ (chữ e câm) → **/s/**: /laɪks/, 1 tiếng. Đừng vì chữ e mà đọc thành 2 tiếng.","src":"tự soạn"},{"type":"mcq","q":"Đuôi -es trong **raises** (giơ lên) đọc thế nào?","options":["/ɪz/","/z/","/s/"],"answer":0,"explain":"raise đọc /reɪz/: âm cuối **/z/** là âm xuýt → -es đọc **/ɪz/**: /ˈreɪzɪz/, 2 tiếng. Không phải /z/: /z/ dính với /z/ thì không nghe ra.","src":"tự soạn"},{"type":"mcq","q":"Đuôi -ed trong **breathed** (đã thở; breathe /bri:ð/) đọc thế nào?","options":["/d/","/t/","/ɪd/"],"answer":0,"explain":"breathe có âm cuối **/ð/** (hữu thanh, như trong *this*; chữ e câm) → -ed đọc **/d/**, giống ví dụ clothed /kləʊðd/ của sách.","src":"tr. 285"},{"type":"fill","q":"**attended** có ___ âm tiết (tiếng).","answer":["3","ba"],"explain":"attend có âm cuối /d/ → -ed đọc /ɪd/, thêm một tiếng: at-tend-ed = **3** tiếng.","src":"tự soạn"},{"type":"fill","q":"**freezes** có ___ âm tiết (tiếng).","answer":["2","hai"],"explain":"freeze đọc /fri:z/: âm cuối /z/ là âm xuýt → -es đọc /ɪz/: freez-es = **2** tiếng.","src":"tự soạn"},{"type":"fill","q":"**pressed** có ___ âm tiết (tiếng).","answer":["1","một"],"explain":"press có âm cuối /s/ (vô thanh), không phải /t/, /d/ → -ed chỉ là /t/ nhẹ: /prest/ = **1** tiếng.","src":"tự soạn"},{"type":"fill","q":"**arranged** có ___ âm tiết (tiếng).","answer":["2","hai"],"explain":"arrange có 2 tiếng (ar-range), âm cuối /dʒ/ (hữu thanh, không phải /d/) → -ed chỉ thêm /d/, không thêm tiếng: ar-ranged = **2** tiếng.","src":"tự soạn"},{"type":"classify","q":"Đuôi -ed của mỗi từ đọc thế nào?","buckets":["/ɪd/","/t/","/d/"],"items":[{"text":"tasted","bucket":0},{"text":"voted","bucket":0},{"text":"stepped","bucket":1},{"text":"sliced","bucket":1},{"text":"crossed","bucket":1},{"text":"remembered","bucket":2},{"text":"employed","bucket":2},{"text":"joined","bucket":2}],"explain":"tasted, voted: âm cuối /t/ → /ɪd/. stepped (/p/), sliced (/s/), crossed (/s/): vô thanh → /t/. remembered (âm cuối hữu thanh), employed (nguyên âm), joined (/n/) → /d/.","src":"tr. 285–286"},{"type":"classify","q":"Đuôi -s/-es của mỗi từ đọc thế nào?","buckets":["/ɪz/","/s/","/z/"],"items":[{"text":"pages","bucket":0},{"text":"buses","bucket":0},{"text":"maps","bucket":1},{"text":"cakes","bucket":1},{"text":"hats","bucket":1},{"text":"gives","bucket":2},{"text":"learns","bucket":2},{"text":"apples","bucket":2}],"explain":"pages (/dʒ/), buses (/s/): âm xuýt → /ɪz/. maps (/p/), cakes (/k/), hats (/t/) → /s/. gives (/v/), learns (/n/), apples (/l/): hữu thanh → /z/.","src":"tr. 286"},{"type":"mcq","q":"Vì sao **planted** có thêm một tiếng (plant-ed) mà **planned** thì không?","options":["plant có âm cuối /t/ → /ɪd/; plan có âm cuối /n/ → /d/","Vì planned có gấp đôi chữ n","Vì plant dài hơn plan"],"answer":0,"explain":"Cách đọc -ed chỉ phụ thuộc **âm cuối**: sau /t/, /d/ thì /ɪd/ (thêm tiếng); /n/ hữu thanh thì chỉ /d/: /plænd/, 1 tiếng. Gấp đôi n là chuyện chính tả, không ảnh hưởng cách đọc.","src":"tr. 285–286"},{"type":"mcq","q":"*She brushed her teeth and combed her hair.* Hai đuôi -ed lần lượt đọc là:","options":["/t/ – /d/","/t/ – /t/","/ɪd/ – /d/","/d/ – /ɪd/"],"answer":0,"explain":"brush có âm cuối /ʃ/ (vô thanh) → brushed **/t/**. comb đọc /kəʊm/ (chữ b câm), âm cuối /m/ hữu thanh → combed **/d/**. Nhìn âm, không nhìn chữ.","src":"tự soạn"},{"type":"mcq","q":"**buried** (đã chôn; bury /ˈberi/): chính tả và cách đọc đuôi đúng là:","options":["đổi y → i; -ed đọc /d/","đổi y → i; -ed đọc /ɪd/","giữ y; -ed đọc /d/"],"answer":0,"explain":"bury: phụ âm r + y → đổi y thành i: buried. Âm cuối là nguyên âm /i/ (hữu thanh) → -ed đọc **/d/**: /ˈberid/, không thêm tiếng.","src":"tr. 285","shuffle":false},{"type":"mcq","q":"Từ nào có đuôi -ed đọc **/ɪd/**?","options":["included","laughed","boxed","pulled"],"answer":0,"explain":"include có âm cuối /d/ (chữ e câm) → **included** /ɪnˈklu:dɪd/. laughed (/f/), boxed (/ks/) → /t/; pulled (/l/) → /d/.","src":"tự soạn"},{"type":"mcq","q":"Từ nào có đuôi -s đọc **/s/**?","options":["hits","wins","swims","loves"],"answer":0,"explain":"hit có âm cuối /t/ → **hits** /hɪts/. wins (/n/), swims (/m/), loves (/v/): hữu thanh → /z/.","src":"tự soạn"}]]}},{"id":"05-phoi-hop-thi","title":"Sự phối hợp thì","en":"Sequence of tenses","icon":"🔗","pages":"307–310","summary":"Khi một câu có hai mệnh đề, thì của mệnh đề chính quyết định mệnh đề kia được dùng thì nào. Tiếng Việt không đổi gì ('Anh ấy nói anh ấy mệt'), còn tiếng Anh thì phải phối hợp: *He said he was tired.* Chủ đề này dạy bạn bảng phối hợp thì giữa mệnh đề chính và mệnh đề phụ (kể cả would + V và trường hợp chân lý), cách chia động từ trong mệnh đề chỉ thời gian (when, before, as soon as, by the time, no sooner…than…), quy tắc không dùng will sau when/until/as soon as, và cách dùng since.","mindmap":{"label":"Phối hợp thì","children":[{"label":"Mệnh đề chính – mệnh đề phụ","icon":"🕰️","children":[{"label":"Hiện tại / tương lai → phụ tự do"},{"label":"Quá khứ → phụ lùi: was, had done, would"},{"label":"Chân lý, thói quen → giữ hiện tại đơn"},{"label":"HT hoàn thành → hiện tại đơn"},{"label":"QK hoàn thành → quá khứ đơn"}]},{"label":"Mệnh đề chỉ thời gian","icon":"⏰","children":[{"label":"Hiện tại → hiện tại: when you are having"},{"label":"Quá khứ → quá khứ: when I got there"},{"label":"no sooner…than, hardly…when"},{"label":"Tương lai → hiện tại: when I get home"}]},{"label":"since","icon":"📍","children":[{"label":"have + V3 + since + quá khứ đơn"},{"label":"It is / was … since …"}]}]},"lessons":[{"id":"05a","title":"Phối hợp thì giữa mệnh đề chính và mệnh đề phụ","minutes":25,"goal":"Nhận ra mệnh đề chính và mệnh đề phụ trong câu; chọn đúng thì cho mệnh đề phụ theo thì của mệnh đề chính, kể cả would + V (tương lai trong quá khứ) và trường hợp chân lý vẫn giữ hiện tại đơn.","pretest":[{"type":"mcq","q":"Hôm qua anh ấy nói anh ấy mệt. → Yesterday he said that he ___ tired.","options":["was","is","be"],"answer":0,"explain":"Động từ chính *said* ở quá khứ nên động từ phía sau cũng lùi về quá khứ: **was**. Tiếng Việt giữ nguyên chữ 'mệt', tiếng Anh thì không.","src":"tự soạn"},{"type":"mcq","q":"I knew you ___ help me. (Tôi biết bạn sẽ giúp tôi.)","options":["would","will","are"],"answer":0,"explain":"*knew* ở quá khứ, nên 'sẽ' phía sau phải là **would** (sẽ, nhìn từ quá khứ). *will* là lỗi bê nguyên chữ 'sẽ' của tiếng Việt sang.","src":"tự soạn"},{"type":"mcq","q":"Our teacher told us that the sun ___ in the east.","options":["rises","rose","had risen"],"answer":0,"explain":"Mặt trời mọc ở hướng đông là **chân lý**, lúc nào cũng đúng, nên giữ hiện tại đơn **rises** dù *told* ở quá khứ.","src":"tự soạn"}],"hook":{"icon":"🕰️","text":"Một câu dài thường có hai phần, mỗi phần có **chủ ngữ và động từ riêng**. Mỗi phần như vậy gọi là **mệnh đề** (clause). Phần mang ý chính, đứng một mình được, là **mệnh đề chính** (main clause). Phần phụ thêm, thường mở đầu bằng *that, what, why, because…* và không đứng một mình được, là **mệnh đề phụ** (subordinate clause).\nHãy hình dung mệnh đề chính là **chiếc đồng hồ** của cả câu: nó chỉ 'bây giờ' hay 'hồi đó'. Mệnh đề phụ phải **chỉnh giờ theo** chiếc đồng hồ ấy.\nTiếng Việt không làm vậy: 'Anh ấy **nói** anh ấy **mệt**', hai động từ chẳng đổi gì. Tiếng Anh thì phải: *He **said** he **was** tired.* Đó là **sự phối hợp thì** (sequence of tenses)."},"diagram":{"type":"flow","title":"Mệnh đề chính ở thì nào → mệnh đề phụ dùng thì nào?","start":{"q":"Mệnh đề chính ở thì nào?","branches":[{"label":"Hiện tại đơn / tương lai đơn","to":{"q":"Mệnh đề phụ có mốc quá khứ (in 1980…)?","branches":[{"label":"Có","to":{"result":"Quá khứ đơn: she was born in 1980","icon":"📅"}},{"label":"Không","to":{"result":"Thì hiện tại, will, am/is/are going to","icon":"🟢"}}]}},{"label":"Quá khứ đơn","to":{"q":"Mệnh đề phụ nói chân lý / thói quen hiện tại?","branches":[{"label":"Có","to":{"result":"Hiện tại đơn: the earth moves","icon":"🌍"}},{"label":"Không","to":{"result":"Thì quá khứ, would + V, was going to","icon":"⏪"}}]}},{"label":"Hiện tại hoàn thành","to":{"result":"Hiện tại đơn: what he looks like","icon":"✅"}},{"label":"Quá khứ hoàn thành","to":{"result":"Quá khứ đơn: all that was necessary","icon":"✅"}}]}},"chunks":[{"title":"Mệnh đề chính ở hiện tại đơn hoặc tương lai đơn","icon":"🟢","rule":"Mệnh đề chính ở **hiện tại đơn** hoặc **tương lai đơn** → mệnh đề phụ dùng được **mọi thì hiện tại**, **will + V**, **am/is/are going to + V**, và **quá khứ đơn** nếu có **mốc thời gian quá khứ** rõ ràng.","explain":"Đồng hồ của câu đang chỉ 'bây giờ' (hoặc 'sắp tới'), nên mệnh đề phụ cứ chọn thì theo đúng nghĩa của nó: việc thường xuyên → hiện tại đơn, việc sẽ làm → will hoặc going to, việc đã xong → hiện tại hoàn thành. Riêng việc gắn với một mốc trong quá khứ (in 1980, yesterday…) thì dùng quá khứ đơn, y như khi nó đứng một mình.","formula":"Chính: hiện tại đơn / will + V\nPhụ: hiện tại đơn, hiện tại tiếp diễn, hiện tại hoàn thành, will + V, am/is/are going to + V\nPhụ: quá khứ đơn nếu có mốc quá khứ","examples":[{"en":"I **work** so hard that I **am** always tired.","vi":"Tôi làm việc vất vả đến nỗi lúc nào cũng cảm thấy mệt mỏi."},{"en":"She **will think** that I **have taken** her book.","vi":"Cô ta sẽ nghĩ rằng tôi đã lấy cuốn sách của cô ta."},{"en":"Tom **promises** that he **will visit** me again.","vi":"Tom hứa sẽ đến thăm tôi lần nữa."},{"en":"He **says** that he **is going to eat** it.","vi":"Anh ta nói rằng anh ta sẽ ăn món đó."},{"en":"She **says** she **was born** in 1980.","vi":"Cô ấy nói cô ấy sinh năm 1980."},{"en":"She says she is born in 1980.","ok":false,"note":"có mốc 1980 → was born"}],"mistake":{"wrong":"She says she is born in 1980.","right":"She says she was born in 1980.","why":"Việc sinh ra gắn với mốc quá khứ (1980) nên dùng quá khứ đơn, dù mệnh đề chính ở hiện tại."},"tip":"Đồng hồ chỉ 'bây giờ' → mệnh đề phụ cứ nói đúng thời gian của nó, không cần lùi.","src":"tr. 307"},{"title":"Mệnh đề chính ở quá khứ đơn: mệnh đề phụ lùi về quá khứ","icon":"⏪","rule":"Mệnh đề chính ở **quá khứ đơn** → mệnh đề phụ dùng **các thì quá khứ** (quá khứ đơn, quá khứ tiếp diễn, quá khứ hoàn thành), **would + V** hoặc **was/were going to + V**.","explain":"Đồng hồ của câu đã quay về 'hồi đó', nên mệnh đề phụ cũng nhìn từ 'hồi đó': việc đang diễn ra lúc ấy → quá khứ tiếp diễn; việc đã xảy ra **trước** lúc ấy → quá khứ hoàn thành.\nCòn 'sẽ' mà nhìn từ quá khứ thì *will* đổi thành **would** (sách gọi là **tương lai trong quá khứ**, future in the past), *am/is/are going to* đổi thành **was/were going to**. Tiếng Việt vẫn nói 'Tôi tưởng trời **sẽ** mưa', nên người Việt rất hay viết nhầm *will*.","formula":"S + V2/V-ed + (that) + S + V2/V-ed / was/were + V-ing / had + V3\nS + V2/V-ed + (that) + S + would + V\nS + V2/V-ed + (that) + S + was/were going to + V","examples":[{"en":"We **knew** that the bridge **was** unsafe.","vi":"Chúng tôi đã biết rằng cây cầu này không an toàn."},{"en":"I **thought** that she **was cooking** then.","vi":"Lúc đó tôi tưởng cô ta đang nấu ăn."},{"en":"He **saw** that he **had made** a mistake.","vi":"Anh ta nhận ra rằng anh ta đã lầm."},{"en":"I **asked** him why he **hadn't bought** that book.","vi":"Tôi hỏi anh ấy sao không mua cuốn sách đó."},{"en":"We **thought** that it **would rain**.","vi":"Chúng tôi cứ tưởng trời sẽ mưa."},{"en":"We thought that it will rain.","ok":false,"note":"thought ở quá khứ → would"}],"mistake":{"wrong":"I thought that she is cooking then.","right":"I thought that she was cooking then.","why":"Mệnh đề chính ở quá khứ (*thought*), lại có *then* (lúc đó) → quá khứ tiếp diễn *was cooking*."},"tip":"Lùi theo đồng hồ: will → **would**, am/is/are going to → **was/were going to**. Việc xảy ra trước 'hồi đó' → **had + V3**.","src":"tr. 307–308","check":{"type":"mcq","q":"She said she ___ call me later.","options":["would","will"],"answer":0,"explain":"*said* ở quá khứ → 'sẽ' nhìn từ quá khứ là **would**.","src":"tự soạn"}},{"title":"Ngoại lệ: chân lý và thói quen hiện tại","icon":"🌍","rule":"Mệnh đề chính ở quá khứ đơn nhưng mệnh đề phụ nói **chân lý**, **sự thật hiển nhiên** hoặc **thói quen ở hiện tại** → mệnh đề phụ vẫn giữ **hiện tại đơn**.","explain":"Trái đất quay quanh mặt trời hôm qua, hôm nay, ngày mai đều đúng, nên không có lý do gì để lùi thì. Tương tự, điều gì bây giờ **vẫn còn đúng** (tiếng Anh của anh ấy hiện vẫn chưa tốt) thì dùng hiện tại đơn. Hãy tự hỏi: điều này là sự thật chung hay thói quen **vẫn còn tới bây giờ** không?","examples":[{"en":"Copernicus **proved** that the earth **moves** round the sun.","vi":"Copernicus đã chứng minh rằng trái đất xoay quanh mặt trời."},{"en":"He **didn't get** the job because his English **isn't** good.","vi":"Anh ấy không nhận được việc vì không giỏi tiếng Anh."},{"en":"Our teacher **told** us that water **boils** at 100°C.","vi":"Thầy giáo nói với chúng tôi rằng nước sôi ở 100°C."},{"en":"Copernicus proved that the earth moved round the sun.","ok":false,"note":"chân lý → giữ moves (theo sách)"}],"mistake":{"wrong":"Our teacher told us that water boiled at 100°C.","right":"Our teacher told us that water boils at 100°C.","why":"Nước sôi ở 100°C lúc nào cũng đúng → giữ hiện tại đơn."},"tip":"Chân lý không có tuổi → không lùi thì.","src":"tr. 307–308"},{"title":"Mệnh đề chính ở thì hoàn thành","icon":"✅","rule":"Mệnh đề chính ở **hiện tại hoàn thành** → mệnh đề phụ ở **hiện tại đơn**; mệnh đề chính ở **quá khứ hoàn thành** → mệnh đề phụ ở **quá khứ đơn**.","explain":"Hai cặp này đi theo 'phe': hiện tại hoàn thành thuộc nhóm hiện tại nên đi với hiện tại đơn; quá khứ hoàn thành thuộc nhóm quá khứ nên đi với quá khứ đơn. Mệnh đề phụ ở đây thường mở đầu bằng *what, that…*.","formula":"S + have/has + V3 … + S + V(s/es)\nS + had + V3 … + S + V2/V-ed","examples":[{"en":"I **have forgotten** what he **looks** like.","vi":"Tôi đã quên anh ta trông như thế nào."},{"en":"They **had done** all that **was** necessary.","vi":"Họ đã làm tất cả những điều cần làm."},{"en":"They had done all that is necessary.","ok":false,"note":"had done thuộc nhóm quá khứ → was"}],"tip":"Chữ trong tên thì là chìa khóa: hoàn thành **hiện tại** → hiện tại đơn; hoàn thành **quá khứ** → quá khứ đơn.","src":"tr. 307–308"}],"practice":[{"type":"mcq","q":"She says she ___ born in 1995.","options":["was","is","has been"],"answer":0,"explain":"Mệnh đề chính *says* ở hiện tại, nhưng mệnh đề phụ có mốc quá khứ **1995** → quá khứ đơn **was born**. *is born* là lỗi dịch từng chữ 'cô ấy sinh năm…'.","src":"tự soạn"},{"type":"mcq","q":"Lan said that she ___ a new phone the next day.","options":["was going to buy","is going to buy","will buy"],"answer":0,"explain":"*said* ở quá khứ → am/is/are going to lùi thành **was going to**. *is going to* và *will* là chưa lùi thì.","src":"tự soạn"},{"type":"classify","q":"Mỗi vế sau đi được với mở đầu nào?","buckets":["He says that …","He said that …"],"items":[{"text":"he is tired","bucket":0},{"text":"he will come back","bucket":0},{"text":"he has finished the work","bucket":0},{"text":"he would come back","bucket":1},{"text":"he had finished the work","bucket":1},{"text":"he was going to move","bucket":1}],"explain":"*says* (hiện tại) → thì hiện tại, will. *said* (quá khứ) → thì quá khứ, would, was going to.","src":"tự soạn"},{"type":"mcq","q":"The boy knew that an hour ___ sixty minutes.","options":["has","had","would have"],"answer":0,"explain":"Một giờ có sáu mươi phút là **sự thật hiển nhiên** → giữ hiện tại đơn **has** dù *knew* ở quá khứ.","src":"tr. 311"},{"type":"fill","q":"I thought that she ___ (cook) dinner at that moment.","answer":["was cooking"],"hint":"đang làm lúc đó","explain":"*thought* ở quá khứ, việc **đang diễn ra** 'lúc đó' → quá khứ tiếp diễn **was cooking**.","src":"tự soạn"},{"type":"fill","q":"I suddenly realised that I ___ (leave) my wallet at home.","answer":["had left"],"hint":"việc xảy ra trước","explain":"Để quên ví xảy ra **trước** lúc nhận ra (*realised*, quá khứ) → quá khứ hoàn thành **had left**.","src":"tự soạn"},{"type":"fill","q":"Tom promised he ___ (not do) it again.","answer":["would not do","wouldn't do","was not going to do","wasn't going to do"],"explain":"*promised* ở quá khứ, 'sẽ không' nhìn từ quá khứ → **would not do** (hoặc *was not going to do*). *won't do* là chưa lùi thì.","src":"tr. 311"},{"type":"fill","q":"I've forgotten where she ___ (live).","answer":["lives"],"explain":"Mệnh đề chính ở **hiện tại hoàn thành** (*have forgotten*) → mệnh đề phụ ở **hiện tại đơn**: *lives*.","src":"tự soạn"},{"type":"fill","q":"We had bought everything that ___ (be) on the list.","answer":["was"],"explain":"Mệnh đề chính ở **quá khứ hoàn thành** (*had bought*) → mệnh đề phụ ở **quá khứ đơn**: *was*.","src":"tự soạn"},{"type":"fix","wrong":"I knew that you will like this film.","answer":["I knew that you would like this film.","I knew that you were going to like this film."],"explain":"*knew* ở quá khứ → *will* phải lùi thành **would** (hoặc *were going to*).","src":"tự soạn"},{"type":"fix","wrong":"The teacher explained that the moon went round the earth.","answer":["The teacher explained that the moon goes round the earth."],"explain":"Mặt trăng quay quanh trái đất là **chân lý** → giữ hiện tại đơn **goes**, không lùi thì.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng: (Tôi đã biết bạn sẽ giúp tôi.)","words":["I","knew","that","you","would","help","me."],"explain":"*knew* (quá khứ) + *would help* (sẽ, nhìn từ quá khứ).","src":"tự soạn"}],"flashcards":[{"front":"Mệnh đề chính ở quá khứ đơn → mệnh đề phụ dùng thì nào?","back":"**Các thì quá khứ**, **would + V**, **was/were going to + V**: We knew that the bridge **was** unsafe."},{"front":"'Sẽ' nhìn từ quá khứ (tương lai trong quá khứ) viết thế nào?","back":"**would + V**: We thought that it **would rain**."},{"front":"Mệnh đề chính quá khứ, khi nào mệnh đề phụ vẫn ở hiện tại đơn?","back":"Khi nói **chân lý, sự thật hiển nhiên, thói quen hiện tại**: Copernicus proved that the earth **moves** round the sun."},{"front":"Mệnh đề chính hiện tại đơn, khi nào mệnh đề phụ dùng quá khứ đơn?","back":"Khi có **mốc thời gian quá khứ**: She says she **was born** in 1980."},{"front":"Chính: hiện tại hoàn thành → phụ? Chính: quá khứ hoàn thành → phụ?","back":"**Hiện tại đơn**: I have forgotten what he **looks** like.\n**Quá khứ đơn**: They had done all that **was** necessary."}]},{"id":"05b","title":"Mệnh đề trạng ngữ chỉ thời gian: hiện tại và quá khứ","minutes":25,"goal":"Nhận ra mệnh đề chỉ thời gian (when, while, before, after, as soon as…) và chia động từ trong đó cùng nhóm thì với mệnh đề chính: hiện tại đi với hiện tại, quá khứ đi với quá khứ; dùng đúng by the time, no sooner…than, hardly…when.","pretest":[{"type":"mcq","q":"It was raining when I ___ there.","options":["got","get","will get"],"answer":0,"explain":"Mệnh đề chính *was raining* ở quá khứ → mệnh đề sau *when* cũng ở quá khứ: **got**.","src":"tr. 309"},{"type":"mcq","q":"Let me know once you ___ finished.","options":["have","had","will have"],"answer":0,"explain":"Câu mệnh lệnh *Let me know* thuộc nhóm hiện tại → mệnh đề thời gian dùng thì hiện tại: **have finished**.","src":"tr. 308"},{"type":"mcq","q":"By the time I arrived, they ___ already left.","options":["had","have","will have"],"answer":0,"explain":"Câu ở quá khứ (*arrived*), việc rời đi xảy ra **trước** lúc tôi đến → quá khứ hoàn thành **had left**.","src":"tr. 309"}],"hook":{"icon":"⏰","text":"**Mệnh đề trạng ngữ chỉ thời gian** (adverbial clause of time) là một loại mệnh đề phụ cho biết việc ở mệnh đề chính xảy ra **lúc nào**: *when you call, before he left, as soon as it stops raining*. Nó luôn mở đầu bằng một **liên từ chỉ thời gian**.\nHãy hình dung hai **bánh răng** ăn khớp: mệnh đề chính quay ở **hiện tại** thì mệnh đề thời gian cũng ở **hiện tại**; chính ở **quá khứ** thì thời gian cũng ở **quá khứ**.\nTiếng Việt chỉ cần nói 'Khi tôi **đến**, trời **đang mưa**', không ai chia chữ 'đến'. Tiếng Anh thì phải: *It **was raining** when I **got** there.*"},"diagram":{"type":"table","title":"Phối hợp thì với mệnh đề chỉ thời gian (bảng của sách)","head":["Mệnh đề chính","Mệnh đề thời gian","Ví dụ"],"rows":[["Các thì hiện tại","Các thì hiện tại","He visits us whenever he is in town."],["Các thì quá khứ","Các thì quá khứ","It was raining when I got there."],["Các thì tương lai","Các thì hiện tại (bài 05c)","I'll call you when I get home."]]},"chunks":[{"title":"Liên từ chỉ thời gian","icon":"🗝️","rule":"Mệnh đề thời gian mở đầu bằng **liên từ chỉ thời gian**: when, while, whenever, as, before, after, as soon as, till/until, just as, since, no sooner…than, hardly/scarcely…when/before, as long as, once, by the time.","explain":"Liên từ là 'chìa khóa' cho biết đây là mệnh đề thời gian. Mệnh đề này có thể đứng **trước** mệnh đề chính (thường có dấu phẩy) hoặc đứng **sau**, nghĩa không đổi. Nhưng nó là mệnh đề phụ nên **không đứng một mình** thành câu được. Học nghĩa theo bảng dưới đây.","diagram":{"type":"table","title":"Nghĩa của các liên từ chỉ thời gian","head":["Liên từ","Nghĩa"],"rows":[["when, as","khi"],["while","trong khi"],["whenever","mỗi khi, bất cứ khi nào"],["before / after","trước khi / sau khi"],["as soon as, once","ngay khi, một khi"],["till / until","cho đến khi"],["just as","ngay lúc"],["since","từ khi"],["by the time","tới lúc, trước lúc"],["as long as","chừng nào còn"],["no sooner…than, hardly…when","vừa mới… thì…"]]},"examples":[{"en":"He visits us **whenever** he is in town.","vi":"Mỗi khi xuống phố anh ấy lại ghé thăm chúng tôi."},{"en":"**By the time** I arrived, they had already left.","vi":"Lúc tôi đến, họ đã đi rồi."},{"en":"**Once** you know how to ride a bike you never forget it.","vi":"Một khi biết chạy xe đạp thì bạn sẽ không bao giờ quên."},{"en":"When I got home.","ok":false,"note":"mệnh đề thời gian không đứng một mình thành câu"}],"tip":"Thấy liên từ chỉ thời gian → dừng lại kiểm tra thì của động từ ngay sau nó.","src":"tr. 308–309"},{"title":"Chính ở hiện tại → thời gian ở hiện tại","icon":"🟢","rule":"Mệnh đề chính ở **thì hiện tại** (kể cả câu mệnh lệnh) → mệnh đề thời gian dùng **thì hiện tại** hợp ngữ cảnh: hiện tại đơn, hiện tại tiếp diễn hoặc hiện tại hoàn thành.","explain":"Chọn thì nào trong nhóm hiện tại là tùy nghĩa: việc đang diễn ra → hiện tại tiếp diễn (*when you are having a bath*); việc phải **xong trước** → hiện tại hoàn thành (*once you have finished*). Nhiều khi cả hiện tại đơn lẫn hiện tại hoàn thành đều đúng: *after I finish / have finished college*. Câu mệnh lệnh (*Wait…, Let me know…*) sách xếp chung vào nhóm này.","formula":"Chính (thì hiện tại / mệnh lệnh) + when/while/until/once… + S + V (thì hiện tại)","examples":[{"en":"The phone always **rings** when you **are having** a bath.","vi":"Hễ anh đang tắm là điện thoại lại reng."},{"en":"I often **read** a newspaper while I **am waiting** for the bus.","vi":"Tôi thường đọc báo trong khi đợi xe buýt."},{"en":"He never **goes** home before he **has finished** his work.","vi":"Anh ta không bao giờ về nhà trước khi làm xong công việc."},{"en":"**Let** me know once you **have finished**.","vi":"Cho tôi biết ngay khi xong nhé."},{"en":"He visits us whenever he was in town.","ok":false,"note":"chính ở hiện tại → is"}],"mistake":{"wrong":"He visits us whenever he was in town.","right":"He visits us whenever he is in town.","why":"*visits* ở hiện tại (thói quen) → mệnh đề thời gian cũng ở hiện tại: *is*."},"tip":"Hiện tại đi với hiện tại: *rings* + *are having*.","src":"tr. 308–309","check":{"type":"fill","q":"Wait here until I ___ (come) back.","answer":["come"],"explain":"Câu mệnh lệnh thuộc nhóm hiện tại → hiện tại đơn **come**.","src":"tr. 309"}},{"title":"Chính ở quá khứ → thời gian ở quá khứ","icon":"⏪","rule":"Mệnh đề chính ở **thì quá khứ** → mệnh đề thời gian dùng **thì quá khứ** hợp ngữ cảnh: quá khứ đơn, quá khứ tiếp diễn hoặc quá khứ hoàn thành.","explain":"Bạn đã học ở chủ đề thì quá khứ: việc **đang diễn ra** dùng quá khứ tiếp diễn, việc **xen vào** dùng quá khứ đơn. Ở đây chỉ cần nhớ thêm: cả hai mệnh đề cùng nằm trong nhóm quá khứ. Tiếng Việt có thể bỏ hết 'đã, đang'; tiếng Anh thì không bỏ được.","examples":[{"en":"It **was raining** hard when I **got** there.","vi":"Khi tôi đến đó trời đang mưa rất to."},{"en":"They **arrived** while we **were having** dinner.","vi":"Họ đến khi chúng tôi đang ăn tối."},{"en":"He **slammed** the door as he **went** out.","vi":"Khi đi ra, anh ta đóng sầm cửa lại."},{"en":"It was raining hard when I get there.","ok":false,"note":"chính ở quá khứ → got"}],"mistake":{"wrong":"They arrived while we have dinner.","right":"They arrived while we were having dinner.","why":"*arrived* ở quá khứ, việc ăn tối **đang diễn ra** lúc đó → quá khứ tiếp diễn *were having*."},"tip":"Quá khứ đi với quá khứ: *was raining* + *got*.","src":"tr. 309"},{"title":"Việc xảy ra trước: by the time, after, no sooner…than, hardly…when","icon":"🥇","rule":"Trong câu quá khứ, việc xảy ra **trước** dùng **had + V3**. Với **no sooner…than** và **hardly/scarcely…when/before** (vừa mới… thì…), vế 'vừa mới' dùng **had + V3**, vế sau dùng **quá khứ đơn**.","explain":"*By the time I arrived* = tới lúc tôi đến thì việc kia **đã xong rồi** → mệnh đề chính dùng *had left*. Với *after*, việc đứng sau *after* xảy ra trước → *after the train had left*. *Once* cũng vậy: *Once he had found somewhere to live…*\n**no sooner** luôn đi cặp với **than**; **hardly/scarcely** đi cặp với **when** hoặc **before**. Đừng trộn cặp: ~~no sooner… when~~ là sai.","formula":"By the time + S + V2, S + had + V3\nS + had no sooner + V3 … than + S + V2\nS + had hardly/scarcely + V3 … when/before + S + V2","examples":[{"en":"**By the time** I **arrived**, they **had** already **left**.","vi":"Lúc tôi đến, họ đã đi rồi."},{"en":"They **arrived** at the station after the train **had left**.","vi":"Họ đến nhà ga sau khi xe lửa đã rời ga."},{"en":"Once he **had found** somewhere to live he **started** looking for work.","vi":"Anh ấy bắt đầu tìm việc làm ngay khi tìm được nơi để sống."},{"en":"I **had no sooner closed** the door **than** somebody **knocked**.","vi":"Tôi vừa đóng cửa thì lại có người gõ cửa."},{"en":"I **had hardly closed** my eyes **when** the phone **rang**.","vi":"Tôi vừa mới chợp mắt thì điện thoại reng."},{"en":"I had no sooner closed the door when somebody knocked.","ok":false,"note":"no sooner đi với than"}],"mistake":{"wrong":"By the time I arrived, they have already left.","right":"By the time I arrived, they had already left.","why":"Cả câu ở quá khứ, việc rời đi xảy ra trước → *had left*, không phải *have left*."},"tip":"**no sooner** có *sooner* là so sánh hơn → đi với **than** (như *bigger than*). **hardly** → **when**.","src":"tr. 309"}],"practice":[{"type":"mcq","q":"My dog barks whenever someone ___ at the door.","options":["knocks","knocked","will knock"],"answer":0,"explain":"*barks* ở hiện tại (thói quen) → mệnh đề sau *whenever* cũng ở hiện tại: **knocks**.","src":"tự soạn"},{"type":"mcq","q":"Our guests arrived while we ___ dinner.","options":["were cooking","are cooking","cook"],"answer":0,"explain":"*arrived* ở quá khứ, việc nấu ăn **đang diễn ra** lúc khách đến → quá khứ tiếp diễn **were cooking**.","src":"tự soạn"},{"type":"classify","q":"Câu nào đúng, câu nào sai?","buckets":["Đúng","Sai"],"items":[{"text":"She always sings while she is cooking.","bucket":0},{"text":"She always sings while she was cooking.","bucket":1},{"text":"The lights went out while we were watching TV.","bucket":0},{"text":"The lights went out while we are watching TV.","bucket":1},{"text":"Call me as soon as you have finished.","bucket":0},{"text":"By the time we arrived, the film has started.","bucket":1}],"explain":"Hiện tại đi với hiện tại (*sings – is cooking*; mệnh lệnh *Call me – have finished*), quá khứ đi với quá khứ (*went out – were watching*; *arrived – had started*).","src":"tự soạn"},{"type":"fill","q":"I had a cup of tea before I ___ (leave) for work.","answer":["left"],"explain":"*had a cup of tea* ở quá khứ → mệnh đề sau *before* cũng ở quá khứ: **left**.","src":"tr. 312"},{"type":"fill","q":"He never goes to bed before he ___ (finish) his homework.","answer":["finishes","has finished"],"explain":"*goes* ở hiện tại → thì hiện tại: **finishes** hoặc **has finished** (nhấn mạnh làm xong trước) đều đúng.","src":"tự soạn"},{"type":"fill","q":"By the time we got to the cinema, the film ___ (already / start).","answer":["had already started"],"explain":"Tới lúc chúng tôi đến thì phim **đã bắt đầu rồi** (xảy ra trước) → **had already started**.","src":"tự soạn"},{"type":"fill","q":"I had no sooner sat down ___ the phone rang.","answer":["than"],"explain":"**no sooner** luôn đi cặp với **than**: vừa mới ngồi xuống thì điện thoại reng.","src":"tự soạn"},{"type":"fill","q":"She had hardly left the house ___ it started to rain.","answer":["when","before"],"explain":"**hardly** đi cặp với **when** (hoặc **before**): cô ấy vừa ra khỏi nhà thì trời đổ mưa. *than* chỉ đi với no sooner.","src":"tự soạn"},{"type":"mcq","q":"Mohammad ___ about Halloween before he came to the U.S.","options":["had never heard","has never heard","never hears"],"answer":0,"explain":"*came* ở quá khứ, việc 'chưa từng nghe' kéo dài tới **trước** lúc đến Mỹ → quá khứ hoàn thành **had never heard**. *has never heard* là thì hiện tại, không khớp với quá khứ.","src":"tr. 312"},{"type":"fix","wrong":"We got to the airport after the plane has taken off.","answer":["We got to the airport after the plane had taken off."],"explain":"Câu ở quá khứ (*got*), máy bay cất cánh xảy ra trước → **had taken off**.","src":"tự soạn"},{"type":"fix","wrong":"When I was a child, I play football every day.","answer":["When I was a child, I played football every day."],"explain":"Mệnh đề thời gian ở quá khứ (*was*) → mệnh đề chính cũng ở quá khứ: **played**.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng: (Lúc chúng tôi về nhà thì bọn trẻ đã đi ngủ.)","words":["By","the","time","we","got","home,","the","children","had","gone","to","bed."],"explain":"*By the time* + quá khứ đơn (*got*), việc xảy ra trước dùng **had gone**.","src":"tự soạn"}],"flashcards":[{"front":"Mệnh đề chính ở hiện tại → mệnh đề thời gian ở thì nào?","back":"**Thì hiện tại** (đơn, tiếp diễn, hoàn thành): He visits us whenever he **is** in town."},{"front":"Mệnh đề chính ở quá khứ → mệnh đề thời gian ở thì nào?","back":"**Thì quá khứ**: It was raining hard when I **got** there."},{"front":"no sooner đi cặp với từ nào?","back":"**than**: I had no sooner closed the door **than** somebody knocked."},{"front":"hardly / scarcely đi cặp với từ nào?","back":"**when** hoặc **before**: I had hardly closed my eyes **when** the phone rang."},{"front":"By the time + quá khứ đơn, mệnh đề chính dùng gì?","back":"**had + V3** (việc đã xong trước): By the time I arrived, they **had** already **left**."}]},{"id":"05c","title":"Không dùng thì tương lai trong mệnh đề thời gian; since","minutes":25,"goal":"Khi mệnh đề chính nói về tương lai, dùng thì hiện tại (không dùng will) trong mệnh đề thời gian; dùng since đúng: hiện tại hoàn thành + since + quá khứ đơn, và cấu trúc It is / It was … since …","pretest":[{"type":"mcq","q":"I'll phone you when I ___ home.","options":["get","will get","got"],"answer":0,"explain":"Sau *when* không dùng will dù nói về tương lai → hiện tại đơn **get**.","src":"tự soạn"},{"type":"mcq","q":"I have known Lan since she ___ ten.","options":["was","has been","is"],"answer":0,"explain":"*since* chỉ **mốc bắt đầu** đã qua (năm lên mười) → quá khứ đơn **was**.","src":"tự soạn"}],"hook":{"icon":"🚦","text":"Tiếng Việt nói: 'Khi nào tôi **đến**, tôi **sẽ** gọi.' Chữ 'sẽ' chỉ nằm ở vế 'tôi gọi'; vế 'khi nào tôi đến' không có 'sẽ'. Tiếng Anh cũng vậy: *I **will** call you when I **arrive**.* Mệnh đề thời gian chỉ đặt **mốc**, còn 'sẽ' đã nằm ở mệnh đề chính.\nLỗi phổ biến nhất là thấy 'tương lai' liền thêm *will* vào cả hai vế: ~~when I will arrive~~. Bài này dạy bạn bỏ *will* đúng cách, và dạy thêm **since** (từ khi), liên từ có cặp thì riêng."},"diagram":{"type":"flow","title":"Mệnh đề chính ở tương lai: mệnh đề thời gian dùng gì?","start":{"q":"Ý tương lai trong mệnh đề thời gian là kiểu nào?","branches":[{"label":"Sẽ làm (will + V)","to":{"result":"Hiện tại đơn: when she gets a job","icon":"1️⃣"}},{"label":"Sẽ đang làm (will be + V-ing)","to":{"result":"Hiện tại tiếp diễn: when I'm lying","icon":"🔄"}},{"label":"Sẽ làm xong (will have + V3)","to":{"result":"Hiện tại hoàn thành: until we've finished","icon":"✅"}},{"label":"will have been + V-ing","to":{"result":"Hiện tại hoàn thành tiếp diễn","icon":"⏳"}}]}},"chunks":[{"title":"Không dùng will sau when, as soon as, until…","icon":"🚫","rule":"Mệnh đề chính ở **tương lai** → mệnh đề thời gian dùng **thì hiện tại**, **không dùng will**: *I'll call you when I **get** home.*","explain":"Sách nói rõ: **không dùng các thì tương lai trong mệnh đề trạng ngữ chỉ thời gian**. Mệnh đề chính đã có *will* để nói 'sẽ'; mệnh đề sau *when, as soon as, after, before, until, once, as long as, by the time…* chỉ đánh dấu mốc, nên dùng **hiện tại đơn** thay cho tương lai đơn.","formula":"S + will + V + when/as soon as/after/until… + S + V (hiện tại đơn)\nWhen/After… + S + V (hiện tại đơn), S + will + V","examples":[{"en":"She'll **pay** us back when she **gets** a job.","vi":"Khi có việc làm cô ấy sẽ trả tiền cho chúng ta."},{"en":"After she **graduates**, she **will get** a job.","vi":"Sau khi tốt nghiệp cô ấy sẽ đi làm."},{"en":"I'll **remember** that day as long as I **live**.","vi":"Tôi sẽ nhớ mãi ngày đó cho đến khi chết."},{"en":"She'll pay us back when she'll get a job.","ok":false,"note":"không dùng will sau when"}],"mistake":{"wrong":"I'll call you when I will arrive.","right":"I'll call you when I arrive.","why":"Mệnh đề thời gian không dùng will; chữ 'sẽ' đã nằm ở *I'll call*."},"tip":"Một câu chỉ cần **một** *will*, đặt ở mệnh đề chính.","src":"tr. 309–310","check":{"type":"mcq","q":"We'll start dinner as soon as Dad ___ home.","options":["gets","will get","got"],"answer":0,"explain":"Sau *as soon as* không dùng will → hiện tại đơn **gets**.","src":"tự soạn"}},{"title":"Tiếp diễn và hoàn thành: bỏ will, giữ dáng","icon":"🔁","rule":"Trong mệnh đề thời gian: **hiện tại tiếp diễn** thay tương lai tiếp diễn; **hiện tại hoàn thành** (hoặc hiện tại hoàn thành tiếp diễn) thay tương lai hoàn thành (hoặc tương lai hoàn thành tiếp diễn).","explain":"Giữ nguyên 'dáng' của thì, chỉ bỏ phần *will*: *will be lying* → *am lying*; *will have finished* → *have finished*. Hiện tại hoàn thành nhấn mạnh việc **xong rồi** mới tới mệnh đề chính. Nhiều khi hiện tại đơn và hiện tại hoàn thành đều đúng: *as soon as we arrive / have arrived*.\nCòn mệnh đề chính thì tự do dùng *will + V*, *will be + V-ing*, *will have + V3* tùy nghĩa: *By the time he comes, we will have already left*.","examples":[{"en":"I'll **relax** when I'**m lying** by the pool.","vi":"Tôi sẽ thư giãn khi nằm bên hồ bơi."},{"en":"On Sunday I'**ll be lying** on the beach while you **are studying**.","vi":"Vào Chủ Nhật, trong khi bạn đang học thì tôi sẽ đang nằm trên bãi biển."},{"en":"Let's **carry on** until we'**ve finished**.","vi":"Chúng ta làm tiếp cho đến khi xong việc nhé."},{"en":"We **will give** you a call as soon as we **arrive / have arrived**.","vi":"Chúng tôi sẽ gọi điện cho anh ngay khi chúng tôi đến."},{"en":"By the time he **comes**, we **will have** already **left**.","vi":"Lúc anh ta đến thì chúng ta đã đi rồi."},{"en":"Let's carry on until we'll have finished.","ok":false,"note":"không dùng will have sau until"}],"mistake":{"wrong":"I'll relax when I'll be lying by the pool.","right":"I'll relax when I'm lying by the pool.","why":"Bỏ *will*, giữ dáng tiếp diễn: *will be lying* → *am lying*."},"tip":"Bỏ *will*, giữ phần còn lại: will be lying → **am** lying; will have finished → **have** finished.","src":"tr. 309–310"},{"title":"since: từ một mốc trong quá khứ đến nay","icon":"📍","rule":"Với **since**, mệnh đề chính thường ở **hiện tại hoàn thành** (hoặc hiện tại hoàn thành tiếp diễn); mệnh đề có since thường ở **quá khứ đơn** (hoặc hiện tại hoàn thành), tùy nghĩa.","explain":"Mệnh đề chính nói một khoảng thời gian **kéo dài tới bây giờ** nên dùng hiện tại hoàn thành. Mệnh đề *since* chỉ **mốc bắt đầu**, một thời điểm đã qua → quá khứ đơn (*since she left school, since she was eight*). Sách cũng cho ví dụ *since I've lived in this street*: 'sống ở phố này' là trạng thái **vẫn còn đến nay**, nên dùng hiện tại hoàn thành.\nTiếng Việt chỉ nói 'Tôi biết cô ấy từ khi…', nên người Việt hay viết ~~I know her since…~~.","diagram":{"type":"flow","title":"Chia động từ trong mệnh đề since","start":{"q":"Việc sau since là gì?","branches":[{"label":"Một mốc đã qua","to":{"result":"Quá khứ đơn: since she left school","icon":"📍"}},{"label":"Trạng thái vẫn còn tới nay","to":{"result":"Hiện tại hoàn thành: since I've lived here","icon":"🏠"}}]}},"formula":"S + have/has + V3 (hoặc have/has been + V-ing) + since + S + V2/V-ed","examples":[{"en":"We **haven't seen** her since she **left** school.","vi":"Chúng tôi không gặp cô ấy từ khi cô ấy nghỉ học."},{"en":"She **has been playing** tennis since she **was** eight.","vi":"Cô ta chơi quần vợt từ năm lên tám."},{"en":"I'**ve known** her since I'**ve lived** in this street.","vi":"Tôi quen cô ấy từ khi sống ở con phố này."},{"en":"I know her since she moved here.","ok":false,"note":"mệnh đề chính phải là have known"}],"mistake":{"wrong":"She plays tennis since she was eight.","right":"She has been playing tennis since she was eight.","why":"Một khoảng thời gian kéo tới nay → hiện tại hoàn thành (tiếp diễn), không dùng hiện tại đơn."},"tip":"since + **mốc** (quá khứ đơn) → khoảng thời gian tới nay (**have + V3**).","src":"tr. 310"},{"title":"It is / It was … since …","icon":"⏳","rule":"Trong cấu trúc **It is / It was + khoảng thời gian + since …**, sau since dùng được **quá khứ đơn**, **hiện tại hoàn thành** hoặc **quá khứ hoàn thành**.","explain":"Câu này nói 'đã bao lâu kể từ khi…'. Theo ví dụ của sách: nhìn từ bây giờ (*It's*) thì sau since là quá khứ đơn (*since I last saw them*) hoặc hiện tại hoàn thành (*since I've ridden a bike*); nhìn từ một lúc trong quá khứ (*It was*) thì sau since là **quá khứ hoàn thành** (*since her father had died*). Nhớ: *It's* = *It is*.","formula":"It is + thời gian + since + S + V2/V-ed (hoặc have/has + V3)\nIt was + thời gian + since + S + had + V3","examples":[{"en":"It's a long time since I last **saw** them.","vi":"Lần cuối tôi gặp họ cách đây lâu lắm rồi."},{"en":"It's years since I'**ve ridden** a bike.","vi":"Lâu rồi tôi không chạy xe đạp."},{"en":"It **was** exactly five years since her father **had died**.","vi":"Đã 5 năm rồi kể từ khi cha cô ấy qua đời."},{"en":"It's a long time since I last see them.","ok":false,"note":"lần cuối là mốc đã qua → saw"}],"mistake":{"wrong":"It's two years since I last visit my hometown.","right":"It's two years since I last visited my hometown.","why":"'Lần cuối' là một mốc đã qua → quá khứ đơn."},"tip":"*It's* … since … **last** + V2: It's ages since I last **saw** you.","src":"tr. 310"}],"practice":[{"type":"mcq","q":"We'll wait here until the rain ___.","options":["stops","will stop","stopped"],"answer":0,"explain":"Sau *until* không dùng will → hiện tại đơn **stops**. *stopped* là quá khứ, sai thời gian.","src":"tự soạn"},{"type":"classify","q":"Câu nào đúng, câu nào sai?","buckets":["Đúng","Sai"],"items":[{"text":"I'll buy a car when I get a job.","bucket":0},{"text":"I'll buy a car when I'll get a job.","bucket":1},{"text":"Let's wait here until the bus comes.","bucket":0},{"text":"After she will graduate, she will get a job.","bucket":1},{"text":"We have lived here since we got married.","bucket":0},{"text":"We live here since we got married.","bucket":1}],"explain":"Mệnh đề thời gian không dùng will (*when I get, until the bus comes, after she graduates*). Với since, mệnh đề chính dùng hiện tại hoàn thành (*have lived*).","src":"tự soạn"},{"type":"fill","q":"As soon as I ___ (find) a flat, I'll send you my address.","answer":["find","have found"],"explain":"Không dùng will sau *as soon as* → **find** (hiện tại đơn) hoặc **have found** (nhấn mạnh tìm xong rồi) đều đúng.","src":"tự soạn"},{"type":"fill","q":"They'll have stopped serving meals by the time we ___ (get) to the restaurant.","answer":["get"],"explain":"Mệnh đề chính ở tương lai hoàn thành, nhưng sau *by the time* vẫn dùng hiện tại đơn **get**.","src":"tr. 312"},{"type":"fill","q":"This time tomorrow I'll be sitting on the plane while you ___ (sleep).","answer":["are sleeping"],"hint":"việc đang diễn ra lúc đó","explain":"Ý 'sẽ đang ngủ' (*will be sleeping*) vào mệnh đề sau *while* thì bỏ will, giữ dáng tiếp diễn → **are sleeping**.","src":"tự soạn"},{"type":"fill","q":"She has been working here since she ___ (leave) university.","answer":["left"],"explain":"Rời trường đại học là **mốc** đã qua → quá khứ đơn **left**.","src":"tự soạn"},{"type":"fill","q":"I have been late to work three times since my watch ___ (break).","answer":["broke"],"explain":"Đồng hồ hỏng là **mốc** trong quá khứ → quá khứ đơn **broke**; mệnh đề chính *have been* ở hiện tại hoàn thành.","src":"tr. 312"},{"type":"fill","q":"We ___ (know) each other since we were five.","answer":["have known","'ve known"],"explain":"Khoảng thời gian từ năm lên năm **tới nay** → hiện tại hoàn thành **have known**. *know* (hiện tại đơn) là lỗi dịch 'chúng tôi biết nhau từ…'.","src":"tự soạn"},{"type":"mcq","q":"It was ten years since they ___ each other.","options":["had met","have met","meet"],"answer":0,"explain":"*It was* nhìn từ một lúc trong quá khứ → sau since dùng **quá khứ hoàn thành** *had met*, như ví dụ của sách *It was … since her father had died*.","src":"tự soạn"},{"type":"fix","wrong":"I will call you when I will arrive at the airport.","answer":["I will call you when I arrive at the airport.","I will call you when I have arrived at the airport."],"explain":"Không dùng will trong mệnh đề sau *when* → **when I arrive** (hoặc *have arrived*).","src":"tự soạn"},{"type":"fix","wrong":"I know her since we were at school.","answer":["I have known her since we were at school.","I've known her since we were at school."],"explain":"Với since, mệnh đề chính dùng hiện tại hoàn thành: **have known**.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng: (Tôi sẽ nhắn tin cho bạn ngay khi phim kết thúc.)","words":["I'll","text","you","as","soon","as","the","film","ends."],"explain":"*I'll* ở mệnh đề chính; sau *as soon as* dùng hiện tại đơn **ends**.","src":"tự soạn"}],"flashcards":[{"front":"Có dùng will sau when, as soon as, until, after… không?","back":"**Không**, dùng thì hiện tại: I'll call you when I **get** home."},{"front":"Tương lai tiếp diễn trong mệnh đề thời gian đổi thành gì?","back":"**Hiện tại tiếp diễn**: I'll relax when I'**m lying** by the pool."},{"front":"Tương lai hoàn thành trong mệnh đề thời gian đổi thành gì?","back":"**Hiện tại hoàn thành**: Let's carry on until we'**ve finished**."},{"front":"since: mệnh đề chính và mệnh đề since thường ở thì nào?","back":"Chính: **hiện tại hoàn thành**; since + **quá khứ đơn**: We **haven't seen** her since she **left** school."},{"front":"It's a long time since I last ___ (see) them.","back":"**saw**: It's … since + quá khứ đơn (hoặc hiện tại hoàn thành); It was … since + **had + V3**."}]}],"quiz":{"pass":0.8,"sets":[[{"type":"mcq","q":"Mai told me that she ___ a new job the next month.","options":["was going to start","is going to start","will start"],"answer":0,"explain":"*told* ở quá khứ → am/is/are going to lùi thành **was going to** (hoặc dùng *would start*).","src":"tự soạn"},{"type":"fill","q":"The children learned that water ___ (boil) at 100°C.","answer":["boils"],"explain":"Nước sôi ở 100°C là **chân lý** → giữ hiện tại đơn **boils**, dù *learned* ở quá khứ.","src":"tự soạn"},{"type":"fill","q":"My boss knows that I ___ (finish) the report yesterday.","answer":["finished"],"explain":"Mệnh đề chính *knows* ở hiện tại, nhưng có mốc quá khứ **yesterday** → quá khứ đơn **finished**.","src":"tự soạn"},{"type":"fix","wrong":"Everyone thought that our team will win the final.","answer":["Everyone thought that our team would win the final.","Everyone thought that our team was going to win the final."],"explain":"*thought* ở quá khứ → 'sẽ' nhìn từ quá khứ là **would win** (hoặc *was going to win*). Giữ *will* là bê nguyên chữ 'sẽ' của tiếng Việt sang, chưa lùi thì.","src":"tự soạn"},{"type":"mcq","q":"He told us that he goes jogging every morning. Vì sao *goes* vẫn ở hiện tại đơn?","options":["Vì đó là thói quen vẫn còn ở hiện tại","Vì mệnh đề chính ở hiện tại hoàn thành","Vì có mốc thời gian quá khứ xác định"],"answer":0,"explain":"Mệnh đề chính *told* ở quá khứ đơn, nhưng chạy bộ mỗi sáng là **thói quen ở hiện tại** → được giữ hiện tại đơn. Mệnh đề chính không phải hiện tại hoàn thành, và câu không có mốc quá khứ nào.","src":"tự soạn"},{"type":"fill","q":"I've forgotten what time the shop ___ (open).","answer":["opens"],"explain":"Mệnh đề chính ở **hiện tại hoàn thành** (*have forgotten*) → mệnh đề phụ ở hiện tại đơn **opens**.","src":"tự soạn"},{"type":"mcq","q":"My phone always rings when I ___ a shower.","options":["am having","was having","will have"],"answer":0,"explain":"*rings* ở hiện tại → mệnh đề sau *when* ở thì hiện tại: **am having** (đang tắm).","src":"tự soạn"},{"type":"fill","q":"Khi đèn tắt, chúng tôi đang ăn tối. → We ___ (have) dinner when the lights went out.","answer":["were having"],"explain":"*went out* ở quá khứ, việc ăn tối **đang diễn ra** lúc đó → quá khứ tiếp diễn **were having**.","src":"tự soạn"},{"type":"fill","q":"By the time the police arrived, the thief ___ (escape).","answer":["had escaped"],"explain":"Tới lúc cảnh sát đến thì tên trộm **đã trốn thoát rồi** (xảy ra trước) → **had escaped**.","src":"tự soạn"},{"type":"fill","q":"I had no sooner got into bed ___ the doorbell rang.","answer":["than"],"explain":"**no sooner** đi cặp với **than**: vừa mới lên giường thì chuông cửa reo.","src":"tự soạn"},{"type":"fix","wrong":"She had hardly closed her eyes than the baby started crying.","answer":["She had hardly closed her eyes when the baby started crying.","She had hardly closed her eyes before the baby started crying."],"explain":"**hardly** đi cặp với **when** hoặc **before**; *than* chỉ đi với *no sooner*.","src":"tự soạn"},{"type":"mcq","q":"They left the party before we ___.","options":["arrived","arrive","will arrive"],"answer":0,"explain":"*left* ở quá khứ → mệnh đề sau *before* cũng ở quá khứ: **arrived**.","src":"tự soạn"},{"type":"mcq","q":"Call me as soon as you ___ the results.","options":["get","will get","got"],"answer":0,"explain":"Việc nhận kết quả ở tương lai, nhưng sau *as soon as* không dùng will → hiện tại đơn **get**.","src":"tự soạn"},{"type":"fill","q":"After the film ___ (finish), we'll go for a pizza.","answer":["finishes","has finished","'s finished"],"explain":"Mệnh đề chính *we'll go* ở tương lai → sau *after* dùng **finishes** hoặc **has finished**, không dùng will.","src":"tự soạn"},{"type":"fill","q":"This time next week I'll be lying on a beach while you ___ (sit) in the office.","answer":["are sitting"],"explain":"Ý 'sẽ đang ngồi' (*will be sitting*) vào mệnh đề sau *while* → bỏ will, giữ dáng tiếp diễn: **are sitting**.","src":"tự soạn"},{"type":"fill","q":"My grandparents ___ (live) in this house since they got married.","answer":["have lived","'ve lived","have been living","'ve been living"],"explain":"Khoảng thời gian từ lúc cưới **tới nay** → hiện tại hoàn thành **have lived** (hoặc *have been living*); *got married* là mốc ở quá khứ đơn.","src":"tự soạn"},{"type":"fix","wrong":"I'll look after your dog until you will get back from holiday.","answer":["I'll look after your dog until you get back from holiday.","I'll look after your dog until you have got back from holiday.","I'll look after your dog until you've got back from holiday."],"explain":"Không dùng will sau *until* → **until you get back** (hoặc *have got back*). Chữ 'sẽ' đã nằm ở *I'll look after*.","src":"tự soạn"},{"type":"mcq","q":"It's three months since I last ___ my grandmother.","options":["visited","visit","had visited"],"answer":0,"explain":"*It's* (= It is) … since … **last**: 'lần cuối' là một mốc đã qua → quá khứ đơn **visited**. *visit* là hiện tại, sai thời gian; *had visited* chỉ đi với *It was …* (nhìn từ một lúc trong quá khứ).","src":"tự soạn"},{"type":"classify","q":"Mỗi câu dùng quy tắc nào?","buckets":["Lùi theo mệnh đề chính quá khứ","Tương lai → hiện tại sau when/after…","Chân lý: giữ hiện tại đơn"],"items":[{"text":"She said she was tired.","bucket":0},{"text":"We knew he would win.","bucket":0},{"text":"I'll text you when I land.","bucket":1},{"text":"We'll start after everyone arrives.","bucket":1},{"text":"The teacher said that light travels faster than sound.","bucket":2},{"text":"My dad told me that oil floats on water.","bucket":2}],"explain":"*was, would* lùi theo *said, knew*. *land, arrives* là hiện tại đơn thay cho will trong mệnh đề thời gian. *travels, floats* là chân lý nên giữ hiện tại đơn dù mệnh đề chính ở quá khứ.","src":"tự soạn"},{"type":"mcq","q":"We thought the shop ___ open on Sunday, but it was closed.","options":["would be","will be","is"],"answer":0,"explain":"*thought* ở quá khứ → 'sẽ' nhìn từ quá khứ là **would be**. *will be* là chưa lùi thì; *is* sai vì cửa hàng thật ra đóng cửa, đây không phải sự thật hay thói quen hiện tại.","src":"tự soạn"},{"type":"mcq","q":"She says that she ___ to Đà Lạt last summer.","options":["went","goes","has gone"],"answer":0,"explain":"Mệnh đề chính *says* ở hiện tại, nhưng mệnh đề phụ có mốc quá khứ **last summer** → quá khứ đơn **went**. *has gone* không đi với mốc thời gian quá khứ xác định.","src":"tự soạn"},{"type":"mcq","q":"Nam promises that he ___ the money back next week.","options":["will pay","would pay","paid"],"answer":0,"explain":"*promises* ở **hiện tại** → mệnh đề phụ dùng thì hiện tại hoặc **will + V**: *will pay*. *would* chỉ dùng khi mệnh đề chính ở quá khứ (*promised*).","src":"tự soạn"},{"type":"mcq","q":"When I opened the fridge, I saw that someone ___ my cake.","options":["had eaten","has eaten","eats"],"answer":0,"explain":"*saw* ở quá khứ, việc ăn bánh xảy ra **trước** lúc tôi nhìn thấy → quá khứ hoàn thành **had eaten**. *has eaten* là thì hiện tại, không khớp với mệnh đề chính quá khứ.","src":"tự soạn"},{"type":"mcq","q":"Our science teacher said that plants ___ sunlight to grow.","options":["need","had needed","would need"],"answer":0,"explain":"Cây cần ánh sáng để lớn là **chân lý** → giữ hiện tại đơn **need** dù *said* ở quá khứ (theo sách). *had needed, would need* là lùi thì không cần thiết.","src":"tự soạn"},{"type":"mcq","q":"I hoped that he ___ able to come to my birthday party.","options":["would be","will be","is"],"answer":0,"explain":"*hoped* ở quá khứ → 'sẽ' nhìn từ quá khứ là **would be**. *will be* và *is* là quên lùi thì theo mệnh đề chính.","src":"tr. 311"},{"type":"mcq","q":"Before the trip, we had packed everything that we ___.","options":["needed","need","will need"],"answer":0,"explain":"Mệnh đề chính ở **quá khứ hoàn thành** (*had packed*) → mệnh đề phụ ở **quá khứ đơn**: *needed*. *need, will need* thuộc nhóm hiện tại/tương lai, không khớp.","src":"tự soạn"},{"type":"fill","q":"At the party, I thought that the man in the blue shirt ___ (be) your brother.","answer":["was"],"explain":"*thought* ở quá khứ, mình nghĩ về chuyện **lúc đó** → quá khứ đơn **was**. *is* là quên lùi thì theo mệnh đề chính.","src":"tự soạn"},{"type":"fix","wrong":"Minh says that he has bought this car two years ago.","answer":["Minh says that he bought this car two years ago."],"explain":"Mệnh đề chính *says* ở hiện tại, nhưng có mốc quá khứ **two years ago** → quá khứ đơn **bought**. Hiện tại hoàn thành không đi với *ago*.","src":"tự soạn"},{"type":"fix","wrong":"They had eaten everything that is in the fridge.","answer":["They had eaten everything that was in the fridge."],"explain":"Mệnh đề chính ở **quá khứ hoàn thành** (*had eaten*) → mệnh đề phụ ở **quá khứ đơn**: *was*. *is* thuộc nhóm hiện tại, không khớp.","src":"tự soạn"},{"type":"classify","q":"Mỗi câu đúng theo quy tắc nào?","buckets":["Chính hiện tại hoàn thành → phụ hiện tại đơn","Chính quá khứ hoàn thành → phụ quá khứ đơn","Chính hiện tại + mốc quá khứ → phụ quá khứ đơn"],"items":[{"text":"I have lost the paper that shows my address.","bucket":0},{"text":"She has forgotten how old her nephew is.","bucket":0},{"text":"We had cleaned every room that was dirty.","bucket":1},{"text":"He had answered all the questions that were on the test.","bucket":1},{"text":"My uncle says he met the president in 2015.","bucket":2},{"text":"She tells everyone that she won a prize last year.","bucket":2}],"explain":"*have lost, has forgotten* (hiện tại hoàn thành) → *shows, is*. *had cleaned, had answered* (quá khứ hoàn thành) → *was, were*. *says, tells* ở hiện tại nhưng có mốc **in 2015, last year** → *met, won*.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng: (Chúng tôi tưởng chuyến bay sẽ bị hoãn.)","words":["We","thought","that","the","flight","would","be","delayed."],"explain":"*thought* (quá khứ) → 'sẽ bị hoãn' nhìn từ quá khứ là **would be delayed**, không phải *will be*.","src":"tự soạn"},{"type":"mcq","q":"Whenever my aunt visits us, she ___ a big bag of fruit.","options":["brings","brought","had brought"],"answer":0,"explain":"Mệnh đề thời gian *whenever my aunt visits* ở **hiện tại** (thói quen) → mệnh đề chính cũng ở hiện tại: **brings**. *brought, had brought* là thì quá khứ, không khớp.","src":"tự soạn"},{"type":"mcq","q":"I cut my finger while I ___ vegetables.","options":["was chopping","am chopping","chop"],"answer":0,"explain":"*cut* ở quá khứ (cut – cut – cut), việc thái rau **đang diễn ra** lúc bị đứt tay → quá khứ tiếp diễn **was chopping**. *am chopping, chop* là thì hiện tại, không khớp.","src":"tự soạn"},{"type":"mcq","q":"By the time we reached the station, our train ___.","options":["had left","has left","leaves"],"answer":0,"explain":"*By the time we reached* (quá khứ): tới lúc đến ga thì tàu **đã chạy rồi** → **had left**. *has left* là thì hiện tại, không đi với câu quá khứ.","src":"tự soạn"},{"type":"mcq","q":"She had no sooner put the phone down ___ it rang again.","options":["than","when","then"],"answer":0,"explain":"**no sooner** luôn đi cặp với **than**. *when* chỉ đi với *hardly/scarcely*; *then* (rồi thì) là lỗi nhầm chính tả với *than*.","src":"tự soạn"},{"type":"mcq","q":"After the guests ___, we cleaned the kitchen.","options":["had left","have left","leave"],"answer":0,"explain":"*cleaned* ở quá khứ, khách về xảy ra **trước** → **had left** (như sách: *after the train had left*). *have left, leave* là thì hiện tại, không khớp.","src":"tự soạn"},{"type":"mcq","q":"Chọn câu đúng:","options":["He always checks his email as soon as he gets to work.","He always checks his email as soon as he got to work.","He always checks his email as soon as he will get to work."],"answer":0,"explain":"*checks* ở hiện tại (thói quen) → mệnh đề sau *as soon as* cũng ở hiện tại: **gets**. *got* là quá khứ, không khớp; *will get* không dùng trong mệnh đề thời gian.","src":"tự soạn"},{"type":"fill","q":"As soon as the teacher ___ (walk) into the room, the students stopped talking.","answer":["walked","had walked"],"explain":"*stopped* ở quá khứ → mệnh đề sau *as soon as* cũng ở quá khứ: **walked** (hoặc *had walked*, nhấn mạnh việc xảy ra trước). *walks* là hiện tại, không khớp.","src":"tự soạn"},{"type":"fix","wrong":"The baby woke up while I am vacuuming the floor.","answer":["The baby woke up while I was vacuuming the floor."],"explain":"*woke up* ở quá khứ, việc hút bụi **đang diễn ra** lúc em bé thức → quá khứ tiếp diễn **was vacuuming**, không phải *am vacuuming*.","src":"tự soạn"},{"type":"fix","wrong":"I had no sooner arrived at the beach when it started to rain.","answer":["I had no sooner arrived at the beach than it started to rain.","I had hardly arrived at the beach when it started to rain.","I had scarcely arrived at the beach when it started to rain."],"explain":"**no sooner** đi cặp với **than**, không đi với *when*. (Nếu muốn giữ *when* thì phải đổi *no sooner* thành *hardly/scarcely*.)","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng: (Lúc tôi thức dậy thì trời đã tạnh mưa.)","words":["By","the","time","I","woke","up,","the","rain","had","stopped."],"explain":"*By the time* + quá khứ đơn (*woke up*); mưa tạnh xảy ra **trước** lúc thức dậy → **had stopped**.","src":"tự soạn"},{"type":"mcq","q":"I'll lend you this book after I ___ it.","options":["finish","will finish","finished"],"answer":0,"explain":"Mệnh đề chính *I'll lend* ở tương lai → sau *after* dùng thì hiện tại, **không dùng will**: **finish**. *finished* là quá khứ, sai thời gian.","src":"tự soạn"},{"type":"mcq","q":"Don't forget to lock the door before you ___ the house.","options":["leave","will leave","left"],"answer":0,"explain":"Câu mệnh lệnh (*Don't forget*) nói về việc sắp làm → sau *before* dùng hiện tại đơn **leave**. *will leave* là lỗi thêm will vào mệnh đề thời gian.","src":"tự soạn"},{"type":"mcq","q":"My sister ___ a lot of weight since she started jogging.","options":["has lost","loses","lost"],"answer":0,"explain":"*since she started* chỉ **mốc bắt đầu** đã qua; việc giảm cân kéo dài **tới nay** → hiện tại hoàn thành **has lost**. *loses, lost* không đi với since kiểu này.","src":"tự soạn"},{"type":"mcq","q":"When Hoa came back to Hà Nội in 2020, it was ten years since she ___ her old school friends.","options":["had seen","has seen","sees"],"answer":0,"explain":"*It was … since*: nhìn từ một lúc trong quá khứ (năm 2020) → sau since dùng **quá khứ hoàn thành** *had seen*, như sách: *It was … since her father had died*. *has seen, sees* là thì hiện tại, không khớp với *It was*.","src":"tự soạn"},{"type":"mcq","q":"By the time I go to bed tonight, I ___ my work for the day.","options":["will have finished","have finished","had finished"],"answer":0,"explain":"Mệnh đề chính nói về một việc **sẽ xong trước** một lúc trong tương lai (lúc đi ngủ tối nay) → tương lai hoàn thành **will have finished**. *have finished* là dạng dùng trong mệnh đề thời gian, không phải mệnh đề chính; *had finished* là quá khứ.","src":"tr. 314"},{"type":"fill","q":"We ___ (not / see) our cousins since they moved to Canada.","answer":["haven't seen","have not seen"],"explain":"*since they moved* là mốc đã qua; khoảng thời gian không gặp kéo dài **tới nay** → hiện tại hoàn thành **haven't seen**. *didn't see* là lỗi dịch 'không gặp'.","src":"tự soạn"},{"type":"fix","wrong":"My father works as a taxi driver since he retired from the army.","answer":["My father has worked as a taxi driver since he retired from the army.","My father's worked as a taxi driver since he retired from the army.","My father has been working as a taxi driver since he retired from the army.","My father's been working as a taxi driver since he retired from the army."],"explain":"Với *since*, mệnh đề chính nói một khoảng thời gian **tới nay** → hiện tại hoàn thành **has worked** (hoặc *has been working*), không dùng hiện tại đơn *works*.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng: (Tôi không ăn thịt từ năm lên mười.)","words":["I","haven't","eaten","meat","since","I","was","ten."],"explain":"Mệnh đề chính **haven't eaten** (hiện tại hoàn thành, tới nay) + *since* + **was ten** (quá khứ đơn, mốc đã qua).","src":"tự soạn"},{"type":"classify","q":"Câu nào đúng, câu nào sai?","buckets":["Đúng","Sai"],"items":[{"text":"I'll wait until the shop opens.","bucket":0},{"text":"I'll wait until the shop will open.","bucket":1},{"text":"He has worked here since he was twenty.","bucket":0},{"text":"He works here since he was twenty.","bucket":1},{"text":"By the time we got there, the shop had closed.","bucket":0},{"text":"By the time we got there, the shop has closed.","bucket":1}],"explain":"Sau *until* không dùng will (*opens*). Với *since*, mệnh đề chính dùng hiện tại hoàn thành (*has worked*). *By the time* + quá khứ → việc xong trước dùng *had closed*, không phải *has closed*.","src":"tự soạn"}],[{"type":"mcq","q":"The weather forecast says it ___ tomorrow.","options":["will rain","would rain","rained"],"answer":0,"explain":"*says* ở **hiện tại** → mệnh đề phụ nói việc sắp tới dùng **will + V**: *will rain*. *would rain* chỉ dùng khi mệnh đề chính ở quá khứ; *rained* sai thời gian (tomorrow).","src":"tự soạn"},{"type":"mcq","q":"We didn't go swimming because we thought the water ___ too cold.","options":["was","is","will be"],"answer":0,"explain":"*thought* ở quá khứ, ta nghĩ về nước **lúc đó** → quá khứ đơn **was**. *is, will be* là quên lùi thì theo mệnh đề chính.","src":"tự soạn"},{"type":"mcq","q":"Hùng hoped that his parents ___ him a bike for his birthday.","options":["would give","will give","give"],"answer":0,"explain":"*hoped* ở quá khứ → 'sẽ' nhìn từ quá khứ (tương lai trong quá khứ) là **would give**. *will give* là bê nguyên chữ 'sẽ' của tiếng Việt sang.","src":"tự soạn"},{"type":"mcq","q":"I was sure that I ___ the oven off, but it was still on.","options":["had turned","have turned","turn"],"answer":0,"explain":"*was sure* ở quá khứ, việc tắt lò (mà mình tưởng) xảy ra **trước** lúc đó → quá khứ hoàn thành **had turned**. *have turned* thuộc nhóm hiện tại, không khớp.","src":"tự soạn"},{"type":"mcq","q":"The guide explained that the Mekong ___ into the sea in southern Vietnam.","options":["flows","had flowed","would flow"],"answer":0,"explain":"Sông Mê Kông đổ ra biển là **sự thật hiển nhiên** → giữ hiện tại đơn **flows** dù *explained* ở quá khứ (theo sách). *had flowed, would flow* là lùi thì không cần thiết.","src":"tự soạn"},{"type":"mcq","q":"When I phoned Mai, she said she ___ her homework.","options":["was doing","is doing","does"],"answer":0,"explain":"*said* ở quá khứ, việc làm bài tập **đang diễn ra** lúc tôi gọi → quá khứ tiếp diễn **was doing**. *is doing* là quên lùi thì.","src":"tự soạn"},{"type":"mcq","q":"Chọn câu đúng:","options":["I have forgotten where my cousin works.","I have forgotten where my cousin had worked.","I have forgotten where my cousin would work."],"answer":0,"explain":"Mệnh đề chính ở **hiện tại hoàn thành** (*have forgotten*) → mệnh đề phụ ở **hiện tại đơn**: *works*. *had worked, would work* thuộc nhóm quá khứ, không khớp.","src":"tự soạn"},{"type":"mcq","q":"Chọn câu đúng:","options":["Linh had already paid for everything that she needed.","Linh had already paid for everything that she needs.","Linh had already paid for everything that she will need."],"answer":0,"explain":"Mệnh đề chính ở **quá khứ hoàn thành** (*had paid*) → mệnh đề phụ ở **quá khứ đơn**: *needed*. *needs, will need* thuộc nhóm hiện tại/tương lai.","src":"tự soạn"},{"type":"fill","q":"Mẹ tôi tưởng tôi sẽ về muộn. → My mother thought that I ___ (be) late.","answer":["would be","'d be","was going to be"],"explain":"*thought* ở quá khứ → 'sẽ' nhìn từ quá khứ là **would be** (hoặc *was going to be*). *will be* là chưa lùi thì.","src":"tự soạn"},{"type":"fill","q":"My grandfather told me that bees ___ (make) honey from flowers.","answer":["make"],"explain":"Ong làm mật từ hoa là **sự thật hiển nhiên** → giữ hiện tại đơn **make** dù *told* ở quá khứ (theo sách).","src":"tự soạn"},{"type":"fill","q":"I thought that my kids ___ (sleep), but they were playing games.","answer":["were sleeping"],"explain":"*thought* ở quá khứ, việc ngủ (mình tưởng) **đang diễn ra** lúc đó → quá khứ tiếp diễn **were sleeping**, khớp với *were playing* ở vế sau.","src":"tự soạn"},{"type":"fill","q":"I have never understood why my cat ___ (hate) water.","answer":["hates"],"explain":"Mệnh đề chính ở **hiện tại hoàn thành** (*have never understood*) → mệnh đề phụ ở **hiện tại đơn**: *hates* (chủ ngữ số ít → thêm -s).","src":"tự soạn"},{"type":"fix","wrong":"Dad promised that he will take us to the zoo on Sunday.","answer":["Dad promised that he would take us to the zoo on Sunday.","Dad promised that he was going to take us to the zoo on Sunday."],"explain":"*promised* ở quá khứ → *will* phải lùi thành **would** (hoặc *was going to*).","src":"tự soạn"},{"type":"fix","wrong":"Our geography teacher said that Mount Everest was the highest mountain in the world.","answer":["Our geography teacher said that Mount Everest is the highest mountain in the world."],"explain":"Everest là núi cao nhất thế giới là **sự thật hiển nhiên** → giữ hiện tại đơn **is**, không lùi thì (theo sách).","src":"tự soạn"},{"type":"fix","wrong":"She says that she has met her husband in 2010.","answer":["She says that she met her husband in 2010."],"explain":"*says* ở hiện tại, nhưng có mốc quá khứ **in 2010** → quá khứ đơn **met**. Hiện tại hoàn thành không đi với mốc quá khứ xác định.","src":"tự soạn"},{"type":"classify","q":"Hôm qua Mai nói với tôi: *Mai told me that …* Mỗi vế sau dùng quy tắc nào?","buckets":["Giữ hiện tại đơn (sự thật, chân lý)","Lùi thì theo told"],"items":[{"text":"cats see well in the dark","bucket":0},{"text":"Hà Nội is the capital of Vietnam","bucket":0},{"text":"the sun sets in the west","bucket":0},{"text":"she was feeling sick","bucket":1},{"text":"she would come back soon","bucket":1},{"text":"she had lost her umbrella","bucket":1}],"explain":"Sự thật lúc nào cũng đúng (mèo nhìn rõ trong tối, Hà Nội là thủ đô, mặt trời lặn ở hướng tây) → giữ hiện tại đơn. Chuyện riêng của Mai lúc đó → lùi theo *told*: *was feeling, would come, had lost*.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng: (Cô ấy hứa sẽ gọi cho tôi.)","words":["She","promised","that","she","would","call","me."],"explain":"*promised* (quá khứ) → 'sẽ gọi' nhìn từ quá khứ là **would call**.","src":"tự soạn"},{"type":"mcq","q":"My cat always hides under the bed when someone ___ the vacuum cleaner.","options":["uses","used","will use"],"answer":0,"explain":"*hides* ở hiện tại (thói quen, *always*) → mệnh đề sau *when* cũng ở hiện tại: **uses**. *used* là quá khứ, không khớp; *will use* không dùng trong mệnh đề thời gian.","src":"tự soạn"},{"type":"mcq","q":"We ___ along the beach when we saw a turtle.","options":["were walking","are walking","walk"],"answer":0,"explain":"*saw* ở quá khứ, việc đi dạo **đang diễn ra** lúc nhìn thấy rùa → quá khứ tiếp diễn **were walking**. *are walking, walk* là thì hiện tại, không khớp.","src":"tự soạn"},{"type":"mcq","q":"By the time the firefighters arrived, the fire ___ half the house.","options":["had destroyed","has destroyed","destroys"],"answer":0,"explain":"*By the time the firefighters arrived* (quá khứ): tới lúc lính cứu hỏa đến thì lửa **đã thiêu rụi** nửa căn nhà rồi → **had destroyed**. *has destroyed* là thì hiện tại.","src":"tự soạn"},{"type":"mcq","q":"I had hardly started my speech ___ the microphone stopped working.","options":["when","than","then"],"answer":0,"explain":"**hardly** đi cặp với **when** (hoặc *before*). *than* chỉ đi với *no sooner*; *then* không dùng trong cấu trúc này.","src":"tự soạn"},{"type":"mcq","q":"Tom had no sooner left the office ___ his boss called him.","options":["than","when","then"],"answer":0,"explain":"**no sooner** có *sooner* là so sánh hơn → đi với **than**. *when* là cặp của *hardly/scarcely*, không đi với *no sooner*.","src":"tự soạn"},{"type":"mcq","q":"Chọn câu đúng:","options":["My grandmother always tells stories while she is knitting.","My grandmother always tells stories while she was knitting.","My grandmother always tells stories while she will knit."],"answer":0,"explain":"*tells* ở hiện tại (thói quen) → mệnh đề sau *while* cũng ở hiện tại: **is knitting**. *was knitting* là quá khứ, không khớp; *will knit* không dùng trong mệnh đề thời gian.","src":"tự soạn"},{"type":"mcq","q":"Once the children ___ their lunch, they went back to the playground.","options":["had eaten","have eaten","eat"],"answer":0,"explain":"*went back* ở quá khứ, ăn trưa xong **trước** rồi mới ra sân → **had eaten** (như sách: *Once he had found somewhere to live…*). *have eaten, eat* là thì hiện tại.","src":"tự soạn"},{"type":"mcq","q":"Trong câu *They got to the cinema after the film had started*, vì sao dùng *had started*?","options":["Vì phim bắt đầu xảy ra trước việc họ đến, trong một câu quá khứ","Vì sau after lúc nào cũng phải dùng had + V3","Vì mệnh đề chính ở hiện tại hoàn thành"],"answer":0,"explain":"Câu ở quá khứ (*got*), việc phim bắt đầu xảy ra **trước** → **had started**. Không phải sau *after* lúc nào cũng dùng had + V3: câu hiện tại vẫn nói *after I finish college*. Mệnh đề chính *got* là quá khứ đơn, không phải hiện tại hoàn thành.","src":"tự soạn"},{"type":"fill","q":"Mỗi khi buồn, tôi lại nghe nhạc. → Whenever I ___ (feel) sad, I listen to music.","answer":["feel"],"explain":"*listen* ở hiện tại (thói quen) → mệnh đề sau *whenever* cũng ở hiện tại đơn: **feel**.","src":"tự soạn"},{"type":"fill","q":"Trevor tried to fix the shelves while Laura ___ (be) out shopping.","answer":["was"],"explain":"*tried* ở quá khứ → mệnh đề sau *while* cũng ở quá khứ: **was**. *is* là quên phối hợp thì.","src":"tr. 313"},{"type":"fill","q":"We had scarcely got into the taxi ___ it started to pour.","answer":["when","before"],"explain":"**scarcely** đi cặp với **when** (hoặc **before**): vừa lên taxi thì trời đổ mưa. *than* chỉ đi với *no sooner*.","src":"tự soạn"},{"type":"fill","q":"By the time the teacher came in, the students ___ (already / finish) the test.","answer":["had already finished"],"explain":"*By the time the teacher came in* (quá khứ): học sinh **đã làm xong** trước lúc đó → **had already finished**. *have already finished* là thì hiện tại, không khớp.","src":"tự soạn"},{"type":"fix","wrong":"Somebody stole my bag while I sit in the café.","answer":["Somebody stole my bag while I was sitting in the café."],"explain":"*stole* ở quá khứ, việc ngồi trong quán **đang diễn ra** lúc bị trộm → quá khứ tiếp diễn **was sitting**.","src":"tự soạn"},{"type":"fix","wrong":"By the time Hoa answered all her messages, her soup has gone cold.","answer":["By the time Hoa answered all her messages, her soup had gone cold."],"explain":"*By the time* + quá khứ (*answered*): súp nguội xảy ra **trước** lúc đó → **had gone**, không phải *has gone*.","src":"tự soạn"},{"type":"fix","wrong":"My little sister always cries when she lost a game.","answer":["My little sister always cries when she loses a game."],"explain":"*cries* ở hiện tại (thói quen, *always*) → mệnh đề sau *when* cũng ở hiện tại: **loses**.","src":"tự soạn"},{"type":"classify","q":"Câu nào đúng, câu nào sai?","buckets":["Đúng","Sai"],"items":[{"text":"I had no sooner paid than I saw a cheaper price.","bucket":0},{"text":"I had no sooner paid when I saw a cheaper price.","bucket":1},{"text":"She had hardly got home when the power went off.","bucket":0},{"text":"She had hardly got home than the power went off.","bucket":1},{"text":"By the time the guests came, we had cooked everything.","bucket":0},{"text":"By the time the guests came, we have co
