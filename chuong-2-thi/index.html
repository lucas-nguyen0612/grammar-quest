<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ngữ pháp Chương 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --surface-2: #f1eee7;
  --text: #1f2328;
  --muted: #5d636b;
  --border: #e2ddd2;
  --accent: #3b5bdb;
  --accent-soft: #e7ecff;
  --ok: #2f9e44;
  --ok-soft: #e6f6ea;
  --bad: #d6336c;
  --bad-soft: #fde8ef;
  --warn: #e8890c;
  --warn-soft: #fff3e0;
  --c1: #3b5bdb; --c2: #0c8599; --c3: #2f9e44; --c4: #e8590c; --c5: #ae3ec9; --c6: #c2255c;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171c; --surface: #1d2027; --surface-2: #252932; --text: #e8eaed; --muted: #a1a7b0;
    --border: #333844; --accent: #7b93ff; --accent-soft: #263056; --ok: #51cf66; --ok-soft: #1f3a27;
    --bad: #ff6b9b; --bad-soft: #43202d; --warn: #ffa94d; --warn-soft: #3d2c16;
    --c1: #7b93ff; --c2: #3bc9db; --c3: #69db7c; --c4: #ff922b; --c5: #da77f2; --c6: #f06595;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171c; --surface: #1d2027; --surface-2: #252932; --text: #e8eaed; --muted: #a1a7b0;
  --border: #333844; --accent: #7b93ff; --accent-soft: #263056; --ok: #51cf66; --ok-soft: #1f3a27;
  --bad: #ff6b9b; --bad-soft: #43202d; --warn: #ffa94d; --warn-soft: #3d2c16;
  --c1: #7b93ff; --c2: #3bc9db; --c3: #69db7c; --c4: #ff922b; --c5: #da77f2; --c6: #f06595;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
.en { font-family: "Source Serif 4", Georgia, serif; }

.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
}
.topbar .brand { font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.iconbtn { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; }

main { max-width: 860px; margin: 0 auto; padding: 20px 16px 80px; }
.crumbs { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.crumbs a { color: var(--muted); }
h1 { font-size: 28px; line-height: 1.25; margin: 4px 0 8px; }
h2 { font-size: 21px; margin: 28px 0 10px; }
h3 { font-size: 18px; margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px; margin: 14px 0;
}
.hero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.hero .big-icon { font-size: 52px; line-height: 1; }
.pill { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); margin: 2px 4px 2px 0; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.topic-card { display: block; color: var(--text); transition: transform .15s ease, box-shadow .15s ease; margin: 0; }
.topic-card:hover { transform: translateY(-2px); }
.topic-card .ico { font-size: 30px; }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.bar > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .8s ease; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 12px;
  padding: 10px 18px; background: var(--accent); color: #fff; font-weight: 600;
  transition: transform .1s ease, filter .15s ease;
}
:root[data-theme="dark"] .btn, :root:not([data-theme="light"]) .btn { color: #fff; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.97); }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn.ok { background: var(--ok); }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.lesson-list a { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; color: var(--text); border: 1px solid var(--border); background: var(--surface); margin: 8px 0; }
.lesson-list a:hover { border-color: var(--accent); }
.lesson-list .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-weight: 700; flex: none; }
.lesson-list .num.done { background: var(--ok); color: #fff; }

/* stepper */
.stepper { display: flex; gap: 6px; margin: 12px 0 18px; }
.stepper i { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); transition: background .3s; }
.stepper i.on { background: var(--accent); }
.stepper i.past { background: var(--ok); }
.step-title { display: flex; align-items: center; gap: 10px; }
.step-title .ico { font-size: 30px; }
.step-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }

/* chunk */
.chunk .rule {
  font-size: 18px; font-weight: 600; padding: 12px 14px; border-left: 4px solid var(--accent);
  background: var(--accent-soft); border-radius: 0 10px 10px 0; margin: 10px 0;
}
.formula {
  font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 15px; background: var(--surface-2);
  padding: 10px 14px; border-radius: 10px; margin: 10px 0; overflow-x: auto; white-space: pre-wrap;
}
.ex { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px dashed var(--border); }
.ex:last-child { border-bottom: 0; }
.ex .mark { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; margin-top: 2px; }
.ex .mark.y { background: var(--ok); }
.ex .mark.n { background: var(--bad); }
.ex .en { font-size: 17px; }
.ex.wrong .en { text-decoration: line-through; text-decoration-color: var(--bad); }
.ex .vi { color: var(--muted); font-size: 14px; }
.ex .note { font-size: 13px; color: var(--accent); }
.tip, .mistake, .hook { border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
.tip { background: var(--warn-soft); }
.mistake { background: var(--bad-soft); }
.hook { background: var(--accent-soft); font-size: 17px; }
.src { font-size: 12px; color: var(--muted); }
strong { color: var(--accent); }
del { color: var(--bad); }

/* questions */
.q { padding: 14px 0; border-bottom: 1px solid var(--border); }
.q:last-child { border-bottom: 0; }
.q .qtext { font-size: 17px; margin-bottom: 10px; }
.q .qnum { display: inline-grid; place-items: center; min-width: 26px; height: 26px; border-radius: 8px; background: var(--surface-2); font-size: 13px; font-weight: 700; margin-right: 8px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface); transition: border-color .15s, background .15s; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s; }
.opt[disabled] { cursor: default; }
input.blank, textarea.fixbox {
  font: inherit; color: var(--text); background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 8px; padding: 4px 10px;
}
input.blank { width: 9em; margin: 0 4px; }
textarea.fixbox { width: 100%; min-height: 54px; padding: 8px 12px; resize: vertical; }
input.blank:focus, textarea.fixbox:focus { outline: 2px solid var(--accent); border-color: transparent; }
input.blank.correct, textarea.fixbox.correct { border-color: var(--ok); background: var(--ok-soft); }
input.blank.wrong, textarea.fixbox.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s; }
.fixsrc { font-size: 16px; padding: 8px 12px; background: var(--bad-soft); border-radius: 8px; margin-bottom: 8px; }
.check-row { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.feedback { margin-top: 10px; padding: 10px 14px; border-radius: 10px; font-size: 15px; animation: pop .3s ease; }
.feedback.good { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback .ans { font-weight: 600; }
.classify-item { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0; }
.classify-item .it { min-width: 9em; font-size: 16px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-size: 14px; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button.sel { background: var(--accent); color: #fff; }
.seg.correct { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok-soft); }
.seg.wrong { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; padding: 6px; border-radius: 10px; }
.chips.target { border: 1.5px dashed var(--border); margin-bottom: 8px; }
.chip { padding: 6px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); animation: pop .2s ease; }
.chip.used { visibility: hidden; }
.score { font-size: 40px; font-weight: 800; }

/* diagrams */
.diagram { margin: 14px 0; }
.diagram .dtitle { font-weight: 700; margin-bottom: 6px; }
.diagram .scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
.diagram svg { display: block; }
.diagram .hint { font-size: 12px; color: var(--muted); }
svg .node rect { stroke-width: 1.5; }
svg .node text { fill: var(--text); font-size: 13px; font-family: inherit; }
svg .node.root text { font-weight: 700; font-size: 15px; }
svg .node.result rect { fill: var(--ok-soft); stroke: var(--ok); }
svg .node.ask rect { fill: var(--surface); stroke: var(--accent); stroke-dasharray: 0; }
svg .link { fill: none; stroke-width: 2; }
svg .elabel { font-size: 12px; font-weight: 700; fill: var(--muted); }
svg .elabel-bg { fill: var(--bg); }
.anim svg .link { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1s ease forwards; }
.anim svg .node, .anim svg .elabel-g { opacity: 0; animation: fadein .45s ease forwards; }
table.cmp { width: 100%; border-collapse: collapse; font-size: 15px; }
table.cmp th, table.cmp td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
table.cmp th { background: var(--surface-2); }
table.cmp tr { animation: fadein .4s ease both; }
.table-wrap { overflow-x: auto; }

/* flashcards */
.flash { perspective: 1000px; height: 190px; margin: 10px 0; cursor: pointer; }
.flash .inner { position: relative; width: 100%; height: 100%; transition: transform .55s; transform-style: preserve-3d; }
.flash.flipped .inner { transform: rotateY(180deg); }
.flash .face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--radius);
  display: grid; place-items: center; text-align: center; padding: 18px; font-size: 19px; border: 1px solid var(--border); box-shadow: var(--shadow);
}
.flash .front { background: var(--surface); }
.flash .back { background: var(--accent-soft); transform: rotateY(180deg); font-size: 17px; }
.mini-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.mini-cards .flash { height: 150px; margin: 0; }
.mini-cards .flash .face { font-size: 16px; }

.ring { width: 84px; height: 84px; }
.ring circle { fill: none; stroke-width: 9; }
.ring .bg { stroke: var(--surface-2); }
.ring .fg { stroke: var(--ok); stroke-linecap: round; transition: stroke-dashoffset 1s ease; transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring text { font-size: 20px; font-weight: 800; fill: var(--text); }

.reveal { opacity: 0; transform: translateY(14px); transition: opacity .5s ease, transform .5s ease; }
.reveal.in { opacity: 1; transform: none; }
.confetti { position: fixed; top: -20px; z-index: 99; pointer-events: none; font-size: 22px; animation: fall 1.8s ease-in forwards; }

@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .2; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .reveal { opacity: 1; transform: none; }
  .anim svg .link { stroke-dashoffset: 0; } .anim svg .node, .anim svg .elabel-g { opacity: 1; }
}
@media (max-width: 560px) {
  h1 { font-size: 24px; }
  .card { padding: 14px; }
  .flash { height: 210px; }
}
em { font-style: italic; color: inherit; }

/* Large screens: widen the content column and scale everything (text, diagrams, buttons) up
   so a 24–32" monitor doesn't show a narrow strip of small text. */
@media (min-width: 1400px) {
  main { max-width: 960px; }
  body { zoom: 1.1; }
}
@media (min-width: 1800px) {
  main { max-width: 1060px; }
  body { zoom: 1.25; }
}
@media (min-width: 2300px) {
  main { max-width: 1140px; }
  body { zoom: 1.4; }
}

</style>
</head>

 / she / it?","branches":[{"label":"Có","to":{"result":"V-s/es: She works.","icon":"➕"}},{"label":"Không","to":{"result":"V nguyên mẫu: I work.","icon":"✅"}}]}},{"label":"Phủ định","to":{"result":"don't / doesn't + V nguyên mẫu","icon":"🚫"}},{"label":"Câu hỏi","to":{"result":"Do / Does + S + V nguyên mẫu?","icon":"❓"}}]}}]}},"chunks":[{"title":"Động từ be: am, is, are","icon":"🧍","rule":"**I am**, **he/she/it is**, **you/we/they are**. Phủ định thêm **not** sau be; câu hỏi đưa **be lên đầu câu**.","explain":"Tiếng Việt hay bỏ chữ 'là': 'Jane rất xinh', 'Tôi mệt'. Tiếng Anh không bỏ được: câu nào không có động từ khác thì phải có be. Dạng rút gọn hay dùng khi nói: I'm, you're, he's, isn't, aren't (riêng am not chỉ rút thành 'm not: I'm not).","diagram":{"type":"table","title":"be ở hiện tại đơn","head":["Chủ ngữ","Khẳng định","Phủ định","Câu hỏi"],"rows":[["I","am (I'm)","am not (I'm not)","Am I …?"],["He / She / It","is (he's)","is not (isn't)","Is he …?"],["You / We / They","are (you're)","are not (aren't)","Are you …?"]]},"examples":[{"en":"I **am** (I'**m**) a student.","vi":"Tôi là học sinh."},{"en":"Jane **is** very beautiful.","vi":"Jane rất xinh."},{"en":"Jane very beautiful.","ok":false,"note":"thiếu is"},{"en":"Peter **isn't** at home now.","vi":"Hiện giờ Peter không có ở nhà."},{"en":"**Are** you ready?","vi":"Các bạn sẵn sàng chưa?"}],"mistake":{"wrong":"I tired.","right":"I am tired. / I'm tired.","why":"Tiếng Việt nói 'Tôi mệt' không cần 'là', nhưng tiếng Anh phải có be."},"tip":"Hỏi với be: chỉ cần đảo be lên trước chủ ngữ. You are ready → **Are you** ready?","src":"tr. 254–255"},{"title":"Động từ thường: V, V-s/es, do/does","icon":"🔧","rule":"**I/you/we/they + V**; **he/she/it + V-s/es**. Phủ định: **don't/doesn't + V**. Câu hỏi: **Do/Does + S + V?**","explain":"Động từ chia ở hiện tại là động từ nguyên mẫu không 'to' (bare infinitive), chỉ ngôi thứ ba số ít mới thêm -s/-es. Khi phủ định và hỏi, ta mượn trợ động từ do/does; đuôi -s chuyển sang does, nên động từ chính trở về **nguyên mẫu**: She works → She **doesn't work** → **Does** she **work**?","diagram":{"type":"table","title":"Động từ work ở hiện tại đơn","head":["","I / You / We / They","He / She / It"],"rows":[["Khẳng định","work","works"],["Phủ định","don't work","doesn't work"],["Câu hỏi","Do … work?","Does … work?"]]},"examples":[{"en":"We **play** volleyball every Wednesday.","vi":"Thứ Tư nào chúng tôi cũng chơi bóng chuyền."},{"en":"Alice **works** for an insurance company.","vi":"Alice làm việc cho công ty bảo hiểm."},{"en":"My father **doesn't drink** coffee.","vi":"Cha tôi không uống cà phê."},{"en":"My father doesn't drinks coffee.","ok":false,"note":"sau doesn't dùng nguyên mẫu"},{"en":"**Does** she **go** to school by bus?","vi":"Cô ấy đi học bằng xe buýt hả?"}],"mistake":{"wrong":"She don't like coffee.","right":"She doesn't like coffee.","why":"Chủ ngữ she là ngôi thứ ba số ít → doesn't, không phải don't."},"tip":"Đuôi -s chỉ xuất hiện **một lần**: hoặc ở động từ (she works), hoặc ở does (she doesn't work). Không bao giờ ở cả hai.","src":"tr. 254–256","check":{"type":"fill","q":"___ you know the answer?","answer":["Do"],"explain":"Chủ ngữ you → mượn **Do** để hỏi: Do you know the answer?","src":"tr. 255"}},{"title":"Thêm -s hay -es?","icon":"✍️","rule":"Thường thêm **-s**; tận cùng **o, s, x, z, ch, sh** thêm **-es**; **phụ âm + y** đổi y thành **i + es**; **nguyên âm + y** chỉ thêm **-s**.","explain":"Nguyên âm là a, e, i, o, u; các chữ còn lại là phụ âm. study: trước y là d (phụ âm) → studies. stay: trước y là a (nguyên âm) → stays. Lưu ý ngoài sách: **have** là trường hợp đặc biệt, ngôi thứ ba số ít là **has** (She has a car).","diagram":{"type":"table","title":"Thêm -s/-es cho ngôi thứ ba số ít","head":["Động từ tận cùng bằng","Thêm","Ví dụ"],"rows":[["hầu hết động từ","-s","work → works"],["o, s, x, z, ch, sh","-es","go → goes, watch → watches"],["phụ âm + y","y → i + es","study → studies, try → tries"],["nguyên âm + y","-s","stay → stays, enjoy → enjoys"]]},"examples":[{"en":"He **watches** TV every evening.","vi":"Tối nào anh ấy cũng xem tivi."},{"en":"She **pushes** the door.","vi":"Cô ấy đẩy cửa."},{"en":"My brother **studies** English.","vi":"Em trai tôi học tiếng Anh."},{"en":"My brother studys English.","ok":false,"note":"phụ âm + y → studies"},{"en":"She **enjoys** her job.","vi":"Cô ấy thích công việc của mình."}],"mistake":{"wrong":"He gos to work by bus.","right":"He goes to work by bus.","why":"go tận cùng bằng o → thêm -es."},"tip":"Nhớ nhóm thêm -es bằng câu: '**O**ng **S**ẽ **X**em **Z**oo, **CH**ạy **SH**ow' → o, s, x, z, ch, sh.","src":"tr. 255–256","check":{"type":"fill","q":"My little sister ___ hard every day. (try)","answer":["tries"],"explain":"try: trước y là r (phụ âm) → đổi y thành i rồi thêm -es: **tries**.","src":"tr. 255"}},{"title":"Hiện tại đơn dùng để làm gì?","icon":"🔁","rule":"Hiện tại đơn nói về **thói quen lặp lại**, **chân lý**, **nhận thức – cảm xúc – công việc – trạng thái hiện tại**, và **thời gian biểu** trong tương lai.","explain":"Thói quen hay đi với trạng từ tần suất: always, usually, often, sometimes, occasionally, seldom, never, every day/week, once a week, twice a year. Thời gian biểu: tàu xe, phim, lịch họp đã cố định thì dùng hiện tại đơn dù việc xảy ra trong tương lai (tiếng Việt nói 'sẽ', tiếng Anh vẫn để hiện tại đơn). Phần nói về tương lai sẽ học kỹ ở chủ đề 03.","diagram":{"type":"mindmap","title":"Bốn cách dùng hiện tại đơn","root":{"label":"Hiện tại đơn","children":[{"label":"Thói quen","icon":"🔁","children":[{"label":"It always rains in November."}]},{"label":"Chân lý, sự thật","icon":"🌍","children":[{"label":"Water freezes at 0 °C."}]},{"label":"Nhận thức, cảm xúc, công việc","icon":"💭","children":[{"label":"I think you should call him."}]},{"label":"Thời gian biểu","icon":"🚆","children":[{"label":"His train arrives at 11.45."}]}]}},"examples":[{"en":"Richard **visits** his mother every week.","vi":"Tuần nào Richard cũng đến thăm mẹ."},{"en":"Water **freezes** at 0 °C.","vi":"Nước đóng băng ở 0 °C."},{"en":"Water freeze at 0 °C.","ok":false,"note":"water là ngôi thứ ba số ít → freezes"},{"en":"We **don't like** living in flats.","vi":"Chúng tôi không thích sống ở căn hộ."},{"en":"Angela **works** in the post office.","vi":"Angela làm việc ở bưu điện."},{"en":"What time **does** the film **begin**?","vi":"Phim sẽ bắt đầu lúc mấy giờ?"}],"tip":"Hỏi: việc này 'lúc nào cũng thế' hay 'theo lịch'? Nếu có → hiện tại đơn.","src":"tr. 256–257"}],"practice":[{"type":"classify","q":"Thêm đuôi gì cho ngôi thứ ba số ít?","buckets":["+ s","+ es","y → ies"],"items":[{"text":"play","bucket":0},{"text":"enjoy","bucket":0},{"text":"work","bucket":0},{"text":"wash","bucket":1},{"text":"go","bucket":1},{"text":"mix","bucket":1},{"text":"carry","bucket":2},{"text":"try","bucket":2}],"explain":"wash (sh), go (o), mix (x) → -es. carry, try: phụ âm + y → ies. play, enjoy: nguyên âm + y → chỉ thêm -s.","src":"tr. 255–256"},{"type":"mcq","q":"Tom ___ in a bank.","options":["works","work","is work"],"answer":0,"explain":"Tom = he → **works**. 'is work' sai vì không ghép be với động từ nguyên mẫu.","src":"tự soạn"},{"type":"fill","q":"My sister ___ English every evening. (study)","answer":["studies"],"explain":"study: phụ âm d + y → đổi y thành i, thêm -es: **studies**.","src":"tự soạn"},{"type":"fill","q":"He ___ his car every Sunday. (wash)","answer":["washes"],"explain":"wash tận cùng bằng sh → thêm -es: **washes**.","src":"tự soạn"},{"type":"fill","q":"My parents ___ at home now. (be, phủ định)","answer":["aren't","are not"],"explain":"My parents = they → are; phủ định thêm not: **are not / aren't**.","src":"tr. 255"},{"type":"fill","q":"My mother ___ meat. (not / eat)","answer":["doesn't eat","does not eat"],"explain":"Chủ ngữ ngôi thứ ba số ít → **doesn't** + nguyên mẫu **eat** (không viết eats).","src":"tự soạn"},{"type":"fill","q":"___ your brother play the guitar?","answer":["Does"],"explain":"your brother = he → hỏi bằng **Does**, động từ play giữ nguyên mẫu.","src":"tự soạn"},{"type":"mcq","q":"Câu 'The sun rises in the east.' dùng hiện tại đơn để nói về:","options":["Một chân lý, sự thật hiển nhiên","Một thói quen của riêng ai đó","Một thời gian biểu"],"answer":0,"explain":"Mặt trời mọc ở hướng đông là sự thật luôn đúng → chân lý.","src":"tr. 287"},{"type":"fill","q":"According to the timetable, our train ___ at 11.45. (leave)","answer":["leaves"],"explain":"Giờ tàu chạy theo thời gian biểu → hiện tại đơn dù là việc sắp tới; our train = it → **leaves**.","src":"tr. 256"},{"type":"fix","wrong":"She don't like living in flats.","answer":["She doesn't like living in flats.","She does not like living in flats."],"explain":"She là ngôi thứ ba số ít → **doesn't**, không phải don't.","src":"tự soạn"},{"type":"fix","wrong":"Does he speaks Portuguese?","answer":["Does he speak Portuguese?"],"explain":"Đã có Does thì động từ chính về nguyên mẫu: Does he **speak**…?","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu hỏi đúng:","words":["What","time","does","the","film","begin?"],"explain":"Từ để hỏi (What time) + does + chủ ngữ (the film) + động từ nguyên mẫu (begin).","src":"tr. 257"}],"flashcards":[{"front":"Hiện tại đơn: khi nào động từ thêm -s/-es?","back":"Khi chủ ngữ là **ngôi thứ ba số ít** (he, she, it, Tom): She **works**."},{"front":"Động từ tận cùng bằng chữ gì thì thêm -es?","back":"**o, s, x, z, ch, sh**: go → goes, watch → watches"},{"front":"study → ?   stay → ?","back":"**studies** (phụ âm + y) · **stays** (nguyên âm + y)"},{"front":"Câu phủ định / câu hỏi có còn -s ở động từ không?","back":"Không. She **doesn't drink**. **Does** she **go**…?"},{"front":"Hiện tại đơn dùng cho 4 việc gì?","back":"Thói quen · chân lý · nhận thức/cảm xúc/công việc hiện tại · thời gian biểu"}]},{"id":"01b","title":"Hiện tại tiếp diễn; động từ không dùng tiếp diễn","minutes":25,"goal":"Lập câu am/is/are + V-ing; biết lúc nào dùng tiếp diễn, lúc nào dùng hiện tại đơn; nhận ra các động từ chỉ nhận thức, tri giác, sở hữu không chia tiếp diễn.","pretest":[{"type":"mcq","q":"Look! The cat ___ your breakfast!","options":["eats","is eating","eating"],"answer":1,"explain":"'Look!' → việc đang diễn ra ngay lúc nói → **is eating**. 'eating' một mình thiếu is.","src":"tr. 257"},{"type":"mcq","q":"Câu nào đúng?","options":["I'm knowing the answer.","I know the answer."],"answer":1,"explain":"**know** là động từ chỉ nhận thức, không chia tiếp diễn → I know.","src":"tr. 259"}],"hook":{"icon":"🎬","text":"Tiếng Việt chỉ cần một chữ **'đang'**: 'Tôi đang viết'. Tiếng Anh cần **hai mảnh** cùng lúc: **am/is/are** + động từ đuôi **-ing**: I **am writing**. Thiếu mảnh nào cũng sai. Hãy hình dung thì tiếp diễn như **máy quay đang chạy**: nó quay lại cảnh đang diễn ra, chưa xong."},"diagram":{"type":"flow","title":"Hiện tại đơn hay hiện tại tiếp diễn?","start":{"q":"Động từ chỉ nhận thức, cảm xúc, sở hữu? (know, want, like, own…)","branches":[{"label":"Có","to":{"result":"Hiện tại đơn: I know, she wants","icon":"🧠"}},{"label":"Không","to":{"q":"Việc đó là gì?","branches":[{"label":"Đang diễn ra, tạm thời, đang thay đổi","to":{"result":"am/is/are + V-ing","icon":"🎬"}},{"label":"Thói quen, sự thật, cố định lâu dài","to":{"result":"Hiện tại đơn: V / V-s","icon":"🔁"}}]}}]}},"chunks":[{"title":"Công thức: am/is/are + V-ing","icon":"🧩","rule":"Hiện tại tiếp diễn = **am/is/are + V-ing**. Phủ định thêm **not** sau be; câu hỏi đưa **Am/Is/Are** lên đầu.","explain":"Phần be chia theo chủ ngữ y như bài trước (I am, he is, they are); động từ chính luôn ở dạng V-ing, không đổi theo chủ ngữ. Lỗi hay gặp: bỏ be ('I writing') vì tiếng Việt chỉ nói 'tôi đang viết', hoặc quên -ing ('I am write').","formula":"S + am/is/are + V-ing\nS + am/is/are + not + V-ing\nAm/Is/Are + S + V-ing?","diagram":{"type":"table","title":"Ba dạng câu hiện tại tiếp diễn","head":["","Công thức","Ví dụ"],"rows":[["Khẳng định","S + am/is/are + V-ing","I'm writing an email."],["Phủ định","S + am/is/are + not + V-ing","They aren't playing."],["Câu hỏi","Am/Is/Are + S + V-ing?","Where are you calling from?"]]},"examples":[{"en":"I'**m writing** an email.","vi":"Tôi đang viết email."},{"en":"I writing an email.","ok":false,"note":"thiếu am"},{"en":"It'**s raining** now, look.","vi":"Nhìn kìa, trời đang mưa."},{"en":"The children **aren't playing** in the yard at the moment.","vi":"Lúc này bọn trẻ không chơi trong sân."},{"en":"Where **are** you **calling** from?","vi":"Anh đang gọi từ đâu vậy?"}],"mistake":{"wrong":"She is cook dinner.","right":"She is cooking dinner.","why":"Sau is phải là V-ing, không phải động từ nguyên mẫu."},"tip":"Thêm -ing: thường thêm thẳng (work → working); bỏ e câm (write → writing, take → taking); giữ ee (see → seeing); ie → y (lie → lying); một âm tiết, một nguyên âm + một phụ âm thì gấp đôi (stop → stopping, get → getting). Quy tắc đầy đủ ở chủ đề 04.","src":"tr. 257, 284–285"},{"title":"Đang diễn ra: ngay lúc nói hoặc quanh lúc nói","icon":"📍","rule":"Dùng tiếp diễn cho việc **đang diễn ra ngay lúc nói**, hoặc việc **đang làm dở** quanh thời điểm hiện tại dù lúc nói không làm.","explain":"'I am reading an interesting book' không có nghĩa là người nói đang cầm sách đọc, mà là đã đọc nhưng chưa xong. Dấu hiệu hay gặp: now, right now, at present, at the moment, at the present time, Look!, Listen!. Còn việc làm **thường xuyên** thì dùng hiện tại đơn: What do you do every night? ~ I watch TV.","examples":[{"en":"What **are** you **doing**? ~ I'**m writing** letters.","vi":"Anh đang làm gì thế? ~ Tôi đang viết thư."},{"en":"Please call back as we **are having** dinner now.","vi":"Vui lòng gọi lại sau vì giờ chúng tôi đang ăn tối."},{"en":"I **am reading** an interesting book at the moment.","vi":"Dạo này tôi đang đọc một cuốn sách rất hay (chưa đọc xong)."},{"en":"Look! It rains.","ok":false,"note":"đang diễn ra → It's raining"},{"en":"What **do** you **do** every night? ~ I **watch** TV.","vi":"Tối nào anh làm gì? ~ Tôi xem tivi. (thói quen → hiện tại đơn)"}],"mistake":{"wrong":"Listen! The baby cries.","right":"Listen! The baby is crying.","why":"Listen! báo hiệu việc đang xảy ra ngay lúc này → tiếp diễn."},"tip":"Thêm được chữ 'đang' vào câu tiếng Việt → nghĩ tới am/is/are + V-ing.","src":"tr. 257–258","check":{"type":"mcq","q":"We usually ___ dinner at six o'clock.","options":["have","are having"],"answer":0,"explain":"**usually** → thói quen → hiện tại đơn: We usually **have** dinner at six.","src":"tr. 258"}},{"title":"Tạm thời, đang thay đổi, phàn nàn, kế hoạch gần","icon":"🌀","rule":"Tiếp diễn còn dùng cho việc **tạm thời**, việc **đang thay đổi**, thói quen gây bực mình với **always**, và **kế hoạch** trong tương lai gần.","explain":"Tạm thời (this week, these days, for a few days, nowadays, at/for the moment, at present, still) → tiếp diễn; cố định, lâu dài → hiện tại đơn. Việc đang thay đổi, phát triển: getting warmer, going up. always, continually, constantly, forever + V-ing: việc xảy ra quá thường xuyên khiến người nói bực mình (hoặc việc tình cờ cứ lặp lại: I'm always meeting Mrs Bailiff in the supermarket). Kế hoạch đã định trước: thường kèm tonight, tomorrow, next week…; thiếu trạng từ tương lai thì người nghe dễ hiểu là việc đang xảy ra.","diagram":{"type":"mindmap","title":"Những việc khác của thì tiếp diễn","root":{"label":"am/is/are + V-ing","children":[{"label":"Tạm thời","icon":"⏳","children":[{"label":"this week, these days"}]},{"label":"Đang thay đổi","icon":"📈","children":[{"label":"is getting warmer"}]},{"label":"Phàn nàn","icon":"😤","children":[{"label":"always, constantly, forever"}]},{"label":"Kế hoạch gần","icon":"📅","children":[{"label":"tonight, tomorrow, next week"}]}]}},"examples":[{"en":"This week Paul **is travelling** to work by bus because his car is broken.","vi":"Tuần này Paul đi làm bằng xe buýt vì xe ô tô của anh ấy bị hỏng. (tạm thời)"},{"en":"Paul **travels** to work by car.","vi":"Paul đi làm bằng ô tô. (cố định → hiện tại đơn)"},{"en":"The earth **is getting** warmer.","vi":"Trái đất đang nóng dần lên."},{"en":"You'**re always losing** your keys!","vi":"Anh cứ đánh mất chìa khóa mãi thế!"},{"en":"I'**m meeting** Kate at the club tonight.","vi":"Tối nay tôi sẽ gặp Kate ở câu lạc bộ."}],"tip":"always + hiện tại đơn = kể thói quen bình thường; always + V-ing = than phiền 'cứ… mãi'.","src":"tr. 258–259"},{"title":"Động từ không dùng tiếp diễn","icon":"🧠","rule":"Động từ chỉ **nhận thức, tri giác, sở hữu** và động từ **ngôn hành** (promise, agree…) **không chia tiếp diễn**; dùng **hiện tại đơn**.","explain":"Danh sách trong sách: be, suppose, know, think, understand, believe, admire, adore, detest, hate, like, love, respect, want, see, hear, feel, smell, taste, sound, glance, realize, seem, remember, forget, own, belong, have, need; và promise, agree, swear, deny. Tiếng Việt nói 'tôi đang muốn', 'bạn có đang hiểu không' rất tự nhiên, nhưng tiếng Anh không nói *I'm wanting*. Riêng **have** với nghĩa 'có, sở hữu' thì không chia tiếp diễn; còn have dinner (ăn tối) là hành động nên sách vẫn viết *we are having dinner now*.","examples":[{"en":"I'**m** tired of watching television; let's go for a walk.","vi":"Tôi chán xem tivi rồi; chúng ta đi dạo nhé."},{"en":"I'm being tired of watching television.","ok":false,"note":"be không chia tiếp diễn"},{"en":"She **wants** to go home now.","vi":"Giờ cô ấy muốn về nhà."},{"en":"She's wanting to go home now.","ok":false,"note":"want → hiện tại đơn"},{"en":"**Do** you **understand** what I mean?","vi":"Anh có hiểu những gì tôi muốn nói không?"},{"en":"I **promise** never to smoke again.","vi":"Tôi hứa sẽ không bao giờ hút thuốc nữa."}],"mistake":{"wrong":"Are you understanding what I mean?","right":"Do you understand what I mean?","why":"understand là động từ nhận thức → hiện tại đơn, hỏi bằng Do."},"tip":"Hỏi: đây là **hành động** làm được (viết, chạy, ăn) hay **trạng thái trong đầu / sở hữu** (biết, muốn, thích, có)? Trạng thái → không -ing.","src":"tr. 259","check":{"type":"mcq","q":"This bag ___ to me.","options":["belongs","is belonging"],"answer":0,"explain":"**belong** (thuộc về) chỉ sự sở hữu → không chia tiếp diễn: This bag **belongs** to me.","src":"tr. 259"}}],"practice":[{"type":"mcq","q":"Câu nào đúng?","options":["I'm writing an email.","I writing an email.","I am write an email."],"answer":0,"explain":"Cần đủ hai mảnh: **am** + **writing**. Câu 2 thiếu am, câu 3 thiếu -ing.","src":"tự soạn"},{"type":"fill","q":"Please be quiet. The children ___. (sleep)","answer":["are sleeping","'re sleeping"],"explain":"'Please be quiet' → bọn trẻ đang ngủ ngay lúc này; the children là số nhiều → **are sleeping**.","src":"tr. 257"},{"type":"fill","q":"Tom and Lan ___ in the yard at the moment. (not / play)","answer":["aren't playing","are not playing"],"explain":"at the moment → tiếp diễn; chủ ngữ số nhiều → **are not / aren't playing**.","src":"tr. 257"},{"type":"classify","q":"Cụm từ này thường đi với thì nào?","buckets":["Hiện tại đơn","Hiện tại tiếp diễn"],"items":[{"text":"every morning","bucket":0},{"text":"at the moment","bucket":1},{"text":"usually","bucket":0},{"text":"these days","bucket":1},{"text":"right now","bucket":1},{"text":"once a week","bucket":0},{"text":"seldom","bucket":0},{"text":"at present","bucket":1}],"explain":"Tần suất (every, usually, once a week, seldom) → hiện tại đơn. Lúc này, dạo này (now, at the moment, these days, at present) → tiếp diễn.","src":"tr. 256, 258"},{"type":"mcq","q":"This week Paul ___ to work by bus because his car is broken.","options":["is travelling","travels"],"answer":0,"explain":"**This week** + xe hỏng → việc tạm thời → tiếp diễn. 'travels' dùng cho việc cố định.","src":"tr. 258"},{"type":"fill","q":"Paul usually ___ to work by car. (travel)","answer":["travels"],"explain":"**usually** → thói quen → hiện tại đơn, Paul = he → **travels**.","src":"tr. 258"},{"type":"mcq","q":"She ___ to go home now.","options":["wants","is wanting"],"answer":0,"explain":"**want** không chia tiếp diễn, kể cả khi có now → She **wants**.","src":"tr. 259"},{"type":"mcq","q":"'You're always losing your keys!' Người nói muốn:","options":["Phàn nàn vì việc này xảy ra quá thường xuyên","Kể một việc đang diễn ra ngay lúc nói","Nói về một thời gian biểu"],"answer":0,"explain":"always + V-ing = than phiền 'cứ… mãi', không phải đang làm ngay lúc nói.","src":"tr. 259"},{"type":"fill","q":"The earth ___ warmer and warmer. (get)","answer":["is getting","'s getting"],"explain":"Sự việc đang thay đổi → tiếp diễn: **is getting** (get gấp đôi t: getting).","src":"tr. 258"},{"type":"fix","wrong":"Are you understanding what I mean?","answer":["Do you understand what I mean?"],"explain":"understand là động từ nhận thức → hiện tại đơn: **Do** you **understand**…?","src":"tr. 259"},{"type":"fix","wrong":"This car is belonging to my father.","answer":["This car belongs to my father."],"explain":"belong chỉ sở hữu → không chia tiếp diễn; this car = it → **belongs**.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu nói về kế hoạch tối nay:","words":["I'm","meeting","Kate","at","the","club","tonight."],"explain":"Kế hoạch đã định + trạng từ tương lai (tonight) → hiện tại tiếp diễn.","src":"tr. 259"}],"flashcards":[{"front":"Công thức hiện tại tiếp diễn?","back":"**am/is/are + V-ing**: She **is working**."},{"front":"this week, these days (tạm thời) đi với thì nào?","back":"Hiện tại **tiếp diễn**: This week Paul **is travelling** by bus."},{"front":"always + V-ing nghĩa là gì?","back":"Phàn nàn 'cứ… mãi': You**'re always losing** your keys!"},{"front":"know, want, like, need, own… có chia tiếp diễn không?","back":"**Không**, dùng hiện tại đơn: She **wants** to go home (không nói is wanting)."},{"front":"write → ?   stop → ?   see → ?","back":"**writing** · **stopping** · **seeing**"}]},{"id":"01c","title":"Hiện tại hoàn thành: công thức và cách dùng","minutes":25,"goal":"Lập câu have/has + quá khứ phân từ (V3) ở ba dạng; biết hiện tại hoàn thành nói về việc trước đây còn liên quan tới bây giờ: vừa xảy ra, không rõ thời gian, lặp lại, còn kết quả, kéo dài tới nay, báo tin mới.","pretest":[{"type":"mcq","q":"My sister ___ French. (Chị tôi học tiếng Pháp rồi.)","options":["has learned","have learned","has learn"],"answer":0,"explain":"my sister = she → **has**; sau has là quá khứ phân từ **learned**.","src":"tr. 260"},{"type":"mcq","q":"'Tom has lost his keys.' nghĩa là:","options":["Tom làm mất chìa, đến giờ vẫn chưa có chìa","Tom từng mất chìa nhưng đã tìm lại được"],"answer":0,"explain":"Hiện tại hoàn thành: việc đã xảy ra nhưng **kết quả còn ở hiện tại** (bây giờ không có chìa).","src":"tr. 262"}],"hook":{"icon":"🌉","text":"Hiện tại hoàn thành là **cây cầu** nối quá khứ với bây giờ: việc đã xảy ra rồi, nhưng vẫn còn 'dính' tới hiện tại. Tiếng Việt nói 'Tôi **đã** làm gãy kính **rồi**' (và giờ kính vẫn gãy). Tiếng Anh: I **have broken** my glasses. Không cần nói lúc nào gãy, chỉ cần biết bây giờ nó đang gãy."},"diagram":{"type":"flow","title":"Dùng hiện tại hoàn thành được không?","start":{"q":"Câu có nói rõ lúc việc xảy ra không?","branches":[{"label":"Có, mốc đã qua: yesterday, … ago","to":{"result":"Không dùng HTHT → quá khứ đơn (chủ đề 02)","icon":"⛔"}},{"label":"Có, thời gian chưa hết: today, this week","to":{"result":"Dùng được: I've been busy this morning.","icon":"✅"}},{"label":"Không nói thời gian","to":{"q":"Việc còn dính tới bây giờ không?","branches":[{"label":"Có: kết quả, còn tiếp, còn lặp lại, tin mới","to":{"result":"have/has + V3","icon":"🌉"}},{"label":"Không: đã khép lại hẳn","to":{"result":"Quá khứ đơn (chủ đề 02)","icon":"📦"}}]}}]}},"chunks":[{"title":"Công thức: have/has + V3","icon":"🧩","rule":"Hiện tại hoàn thành = **have/has + quá khứ phân từ (V3)**. I/you/we/they **have**, he/she/it **has**.","explain":"Quá khứ phân từ (past participle, V3): động từ quy tắc thêm **-ed** (finish → finished, work → worked, study → studied); động từ bất quy tắc lấy **cột 3** trong bảng (see → seen, go → gone, write → written). Tiếng Việt chỉ thêm 'đã… rồi' mà động từ không đổi; tiếng Anh cần cả have/has lẫn V3. Rút gọn: I've, you've, we've, they've, he's/she's/it's (ở đây 's = has); haven't, hasn't.","diagram":{"type":"table","title":"Ba dạng câu hiện tại hoàn thành","head":["","I / You / We / They","He / She / It"],"rows":[["Khẳng định","have ('ve) + V3","has ('s) + V3"],["Phủ định","haven't + V3","hasn't + V3"],["Câu hỏi","Have + S + V3?","Has + S + V3?"]]},"examples":[{"en":"I **have broken** my glasses.","vi":"Tôi bị gãy kính rồi."},{"en":"Charles **hasn't washed** his car yet.","vi":"Charles vẫn chưa rửa xe."},{"en":"**Have** you **done** all the homework?","vi":"Bạn làm hết bài tập về nhà chưa?"},{"en":"I have saw that film.","ok":false,"note":"sau have dùng V3: seen"},{"en":"She have seen that film.","ok":false,"note":"she → has"}],"mistake":{"wrong":"I have saw that film.","right":"I have seen that film.","why":"Sau have/has là V3 (cột 3): see – saw – **seen**."},"tip":"Đọc to ba dạng mỗi khi gặp động từ bất quy tắc: see – saw – **seen**, go – went – **gone**, write – wrote – **written**.","src":"tr. 260","check":{"type":"fill","q":"She ___ her homework, so now she can play. (finish)","hint":"have/has + V3","answer":["has finished","'s finished"],"explain":"she → **has**; finish là động từ quy tắc → V3 = finished.","src":"tr. 260"}},{"title":"Vừa xảy ra, hoặc không nói lúc nào","icon":"🕳️","rule":"Dùng hiện tại hoàn thành cho việc **vừa mới xảy ra**, hoặc việc đã xảy ra mà **không biết rõ / không muốn nói thời gian**.","explain":"Khi nêu rõ mốc thời gian đã qua (yesterday, three years ago…) thì không dùng hiện tại hoàn thành nữa mà dùng quá khứ đơn (sẽ học ở chủ đề 02). Nhưng với thời gian **chưa kết thúc** như today, this week, this month, this year, this morning (khi vẫn còn buổi sáng) thì vẫn dùng hiện tại hoàn thành được.","examples":[{"en":"John **has just told** me that he's getting married.","vi":"John vừa nói với tôi rằng anh ấy sắp kết hôn."},{"en":"I **have seen** that film.","vi":"Tôi xem phim đó rồi."},{"en":"All my friends **have moved** to London.","vi":"Tất cả bạn bè của tôi đều chuyển tới London."},{"en":"I have seen that film yesterday.","ok":false,"note":"có yesterday → không dùng HTHT"},{"en":"I haven't asked her yet. I **haven't seen** her today.","vi":"Tôi vẫn chưa hỏi cô ấy. Hôm nay tôi chưa gặp cô ấy."}],"mistake":{"wrong":"I have seen him two days ago.","right":"I saw him two days ago.","why":"… ago là mốc đã qua → không dùng hiện tại hoàn thành mà dùng quá khứ đơn (học ở chủ đề 02)."},"tip":"Thấy yesterday, last…, … ago, in 2002 → **dừng lại**, đó không phải chỗ của have/has + V3.","src":"tr. 260–261"},{"title":"Lặp lại nhiều lần, kết quả còn đến bây giờ","icon":"🔂","rule":"Dùng hiện tại hoàn thành cho việc **lặp lại nhiều lần và còn có thể lặp lại**, và việc đã xảy ra mà **kết quả vẫn còn** ở hiện tại.","explain":"Susan has seen it eight times: tính đến nay là tám lần, có thể còn xem nữa. once, twice, three times đi với hiện tại hoàn thành là **số lần tính đến nay**. Nếu việc không còn liên quan tới hiện tại (đã quá lâu, người đã mất, không thể lặp lại nữa, hoặc kết quả không còn) thì dùng quá khứ đơn: Shakespeare *wrote* thirty-seven plays (ông không thể viết thêm).","examples":[{"en":"Susan really loves that film. She **has seen** it eight times!","vi":"Susan rất thích bộ phim đó. Cô ấy đã xem phim đó tám lần rồi!"},{"en":"We'**ve been** to Singapore a lot over the last few years.","vi":"Mấy năm vừa qua chúng tôi đi Singapore rất nhiều lần."},{"en":"We'**ve** only **been** to Scotland once.","vi":"Chúng tôi chỉ đến Scotland có một lần (tính đến nay)."},{"en":"Tom **has had** a bad car crash. He's in hospital.","vi":"Tom bị tai nạn ô tô nghiêm trọng. Anh ấy đang nằm viện."},{"en":"I can't go on holiday because I **have broken** my leg.","vi":"Tôi bị gãy chân nên không đi nghỉ được."},{"en":"Shakespeare has written thirty-seven plays.","ok":false,"note":"ông đã mất, không viết thêm được → wrote"}],"tip":"Hỏi: 'Bây giờ còn thấy hậu quả không? Còn có thể xảy ra nữa không?' Có → have/has + V3.","src":"tr. 261–262","check":{"type":"mcq","q":"'Rhys Bowen has written many short stories.' cho biết:","options":["Bà ấy vẫn còn tiếp tục sáng tác","Bà ấy không còn viết được nữa"],"answer":0,"explain":"Hiện tại hoàn thành → việc còn có thể lặp lại, bà vẫn đang sáng tác.","src":"tr. 261"}},{"title":"Kéo dài tới nay, và báo tin mới","icon":"📰","rule":"Dùng hiện tại hoàn thành cho việc **bắt đầu trong quá khứ, kéo dài tới nay** (có thể còn tiếp), và để **báo tin** về việc vừa xảy ra.","explain":"Kéo dài tới nay hay đi với up to now, up to present, so far, for, since (bài sau học kỹ). I've worked at McDonald's for ten years = giờ tôi **vẫn còn** làm ở đó. Báo tin: câu đầu tiên dùng hiện tại hoàn thành; khi kể tiếp chi tiết (lúc nào, ở đâu) thì chuyển sang quá khứ đơn (chủ đề 02).","examples":[{"en":"We'**ve been** here since three o'clock.","vi":"Chúng tôi đã ở đây từ lúc 3 giờ."},{"en":"I'**ve worked** at McDonald's for ten years.","vi":"Tôi làm ở McDonald's được mười năm rồi (giờ vẫn làm)."},{"en":"This young director **has made** four films so far.","vi":"Cho đến nay, đạo diễn trẻ này đã làm được bốn bộ phim."},{"en":"Andy **has passed** his exam!","vi":"Andy thi đậu rồi!"},{"en":"There **has been** a serious accident on the M6.","vi":"Có tai nạn nghiêm trọng xảy ra trên cao tốc M6."}],"tip":"Tin nóng mở đầu bằng have/has + V3: 'Andy **has passed**!'. Hỏi thêm chi tiết là đã sang chuyện quá khứ.","src":"tr. 262–263"}],"practice":[{"type":"mcq","q":"She ___ that film.","options":["has seen","have seen","has saw"],"answer":0,"explain":"she → **has**; see bất quy tắc, V3 là **seen** (saw là V2).","src":"tự soạn"},{"type":"classify","q":"Quá khứ phân từ (V3) của động từ này tạo thế nào?","buckets":["Quy tắc: thêm -ed","Bất quy tắc: học cột 3"],"items":[{"text":"finish","bucket":0},{"text":"work","bucket":0},{"text":"study","bucket":0},{"text":"move","bucket":0},{"text":"see","bucket":1},{"text":"go","bucket":1},{"text":"write","bucket":1},{"text":"break","bucket":1}],"explain":"finished, worked, studied, moved (quy tắc). seen, gone, written, broken (bất quy tắc).","src":"tr. 260"},{"type":"fill","q":"Charles ___ his car yet. (not / wash)","answer":["hasn't washed","has not washed"],"explain":"Charles = he → **has not / hasn't** + V3 **washed**.","src":"tr. 260"},{"type":"fill","q":"___ you done all the homework?","answer":["Have"],"explain":"Chủ ngữ you → câu hỏi bắt đầu bằng **Have**: Have you done…?","src":"tr. 260"},{"type":"fill","q":"I can't find my keys. I ___ them. (lose)","answer":["have lost","'ve lost"],"explain":"Mất rồi và bây giờ vẫn không có chìa → kết quả còn ở hiện tại: I **have lost** them.","src":"tr. 262"},{"type":"fill","q":"Great news! Andy ___ his exam! (pass)","answer":["has passed","'s passed"],"explain":"Báo tin vừa xảy ra → hiện tại hoàn thành: Andy **has passed**.","src":"tr. 263"},{"type":"mcq","q":"'I've worked at this hotel for ten years.' nghĩa là:","options":["Tôi vẫn đang làm ở khách sạn này","Tôi đã nghỉ làm ở đó rồi"],"answer":0,"explain":"Hiện tại hoàn thành + for → việc kéo dài **tới nay** và còn có thể tiếp tục.","src":"tr. 262"},{"type":"mcq","q":"'We've only been to Scotland once.' nghĩa là:","options":["Tính đến nay mới đến Scotland một lần","Có một dịp cụ thể trong quá khứ đã đến Scotland"],"answer":0,"explain":"once đi với hiện tại hoàn thành = số lần **tính đến nay**.","src":"tr. 261"},{"type":"mcq","q":"Câu nào SAI?","options":["I have seen that film yesterday.","I have seen that film.","I've been busy this morning."],"answer":0,"shuffle":false,"explain":"**yesterday** là mốc đã qua → không đi với hiện tại hoàn thành (phải dùng quá khứ đơn, chủ đề 02). this morning (khi buổi sáng chưa hết) thì được.","src":"tr. 261"},{"type":"fix","wrong":"She have written many short stories.","answer":["She has written many short stories.","She's written many short stories."],"explain":"she → **has**, không phải have.","src":"tr. 261"},{"type":"fix","wrong":"I have broke my leg.","answer":["I have broken my leg.","I've broken my leg."],"explain":"break bất quy tắc: break – broke – **broken**. Sau have dùng V3.","src":"tr. 262"},{"type":"order","q":"Sắp xếp thành câu báo tin:","words":["There","has","been","a","serious","accident."],"explain":"There + has been (V3 của be) + danh từ: báo tin vừa xảy ra.","src":"tr. 263"}],"flashcards":[{"front":"Công thức hiện tại hoàn thành?","back":"**have/has + V3**: She **has learned** French."},{"front":"V3 của see, go, write, break?","back":"**seen**, **gone**, **written**, **broken**"},{"front":"Hiện tại hoàn thành có đi với yesterday, … ago không?","back":"**Không** (mốc đã qua → quá khứ đơn). Nhưng today, this week (chưa hết) thì được."},{"front":"'I've worked here for ten years' → còn làm không?","back":"**Còn**. Hiện tại hoàn thành = kéo dài tới nay."},{"front":"Báo tin mới dùng thì gì?","back":"Hiện tại hoàn thành: Andy **has passed** his exam! (kể chi tiết sau đó → quá khứ đơn)"}]},{"id":"01d","title":"Dấu hiệu hiện tại hoàn thành: just, already, yet, for/since…","minutes":25,"goal":"Dùng đúng nghĩa và vị trí các dấu hiệu just, recently, lately, already, before, ever, never, yet, for, since, so far, It's the first time…, và biết dùng hiện tại hoàn thành với today, this morning khi thời gian chưa hết.","pretest":[{"type":"mcq","q":"Turkey has been a republic ___ 1923.","options":["since","for"],"answer":0,"explain":"1923 là **một mốc** thời gian → **since**.","src":"tr. 264"},{"type":"mcq","q":"Susan hasn't finished the report ___.","options":["yet","already"],"answer":0,"explain":"**yet** (chưa) dùng trong câu phủ định và câu hỏi, đứng cuối câu.","src":"tr. 264"}],"hook":{"icon":"🚦","text":"Những từ như **just, already, yet, for, since** giống **biển báo** trên đường: thấy chúng là bạn biết sắp tới là have/has + V3. Tiếng Việt cũng có 'vừa', 'rồi', 'chưa', 'từ khi', 'được… rồi'; học cặp nghĩa này là bạn có ngay một bộ dấu hiệu."},"diagram":{"type":"table","title":"Dấu hiệu của hiện tại hoàn thành","head":["Từ","Nghĩa","Ví dụ"],"rows":[["just, recently, lately","vừa mới, gần đây","I've just been on holiday."],["already","rồi","I've already had breakfast."],["before","trước đây","We've met before."],["ever / never","đã từng / chưa bao giờ","Have you ever seen a ghost?"],["yet","chưa (phủ định, câu hỏi)","She hasn't finished yet."],["for / since","trong khoảng / từ khi","for ages, since 1923"],["so far, until now, up to now","cho đến nay","four films so far"],["It's the first time…","đây là lần đầu…","…I've heard her sing."]]},"chunks":[{"title":"just, recently, lately, already, before, ever, never","icon":"📌","rule":"**just** (vừa), **already** (rồi), **ever** (đã từng), **never** (chưa bao giờ) thường đứng **giữa have/has và V3**; **recently, lately** (gần đây), **before** (trước đây) hay đứng cuối câu (lately có thể đứng đầu).","explain":"Vị trí này rút ra từ các câu ví dụ của sách. ever hay dùng trong câu hỏi: Have you **ever** …? = 'Bạn đã bao giờ… chưa?'. never đã mang nghĩa phủ định, nên không thêm not nữa.","formula":"S + have/has + just/already/ever/never + V3","examples":[{"en":"**Lately**, I'**ve had** trouble sleeping.","vi":"Gần đây tôi bị khó ngủ."},{"en":"I have **already** had breakfast.","vi":"Tôi đã ăn sáng rồi."},{"en":"I'm sure we'**ve met before**.","vi":"Chắc chắn trước đây chúng ta đã gặp nhau rồi."},{"en":"Have you **ever** seen a ghost?","vi":"Anh đã bao giờ thấy ma chưa?"},{"en":"He's **never** been to Australia.","vi":"Anh ấy chưa từng đến Úc."},{"en":"He hasn't never been to Australia.","ok":false,"note":"never đã là phủ định, bỏ n't"}],"mistake":{"wrong":"He hasn't never been to Australia.","right":"He has never been to Australia.","why":"never đã mang nghĩa 'không bao giờ', thêm not là phủ định hai lần."},"tip":"Kẹp giữa 'bánh mì' have và V3: have **just** / **already** / **ever** / **never** + V3.","src":"tr. 263"},{"title":"yet; for hay since; so far","icon":"⏲️","rule":"**yet** (chưa) dùng trong câu **phủ định và câu hỏi**. **for** + **khoảng** thời gian; **since** + **mốc** thời gian. **so far, until now, up to now, up to the present** = cho đến nay.","explain":"for = trong khoảng: for six days, for a week, for two years, for a long time, for ages. since = từ khi: since 1987, since January, since last year, since Christmas, since eight o'clock. Tiếng Việt nói 'tôi sống ở đây **từ** mười năm' hay 'được mười năm', dễ khiến người học viết since ten years. Mười năm là một khoảng → for.","diagram":{"type":"flow","title":"for hay since?","start":{"q":"Sau chỗ trống là gì?","branches":[{"label":"Một khoảng: two years, ages, a week","to":{"result":"for","icon":"↔️"}},{"label":"Một mốc: 1987, Christmas, 8 o'clock","to":{"result":"since","icon":"📍"}}]}},"examples":[{"en":"Susan **hasn't finished** the report **yet**.","vi":"Susan vẫn chưa làm xong bản báo cáo."},{"en":"Simon! I **haven't seen** you **for** ages.","vi":"Simon! Lâu rồi không gặp anh."},{"en":"Turkey **has been** a republic **since** 1923.","vi":"Từ năm 1923, Thổ Nhĩ Kỳ trở thành nước cộng hòa."},{"en":"I've lived here since ten years.","ok":false,"note":"ten years là khoảng → for"},{"en":"This young director **has made** four films **so far**.","vi":"Cho đến nay, đạo diễn trẻ này đã làm được bốn bộ phim."}],"tip":"Hỏi 'bao lâu?' → for. Hỏi 'từ bao giờ?' → since.","src":"tr. 262–264","check":{"type":"fill","q":"I've known her ___ Christmas.","answer":["since"],"explain":"Christmas là một mốc → **since**.","src":"tr. 263"}},{"title":"It's the first time…; often, sometimes","icon":"🥇","rule":"Sau **It / This / That is the first / second / only / best / worst…** dùng **hiện tại hoàn thành**. **often, sometimes, occasionally** cũng đi với hiện tại hoàn thành để nói việc lặp lại **tính đến nay**.","explain":"Tiếng Việt nói 'Đây là lần đầu tôi **nghe** cô ấy hát', không có dấu hiệu thì, nên người học hay viết *the first time I hear*. Tiếng Anh tính 'từ trước tới giờ' nên phải là I **have heard**. Với best/worst hay kèm ever: the best book I've **ever** read.","formula":"It/This/That is the first/best/only… + (that) + S + have/has + V3","examples":[{"en":"This is the first time I'**ve heard** her sing.","vi":"Đây là lần đầu tiên tôi nghe cô ấy hát."},{"en":"This is the first time I hear her sing.","ok":false,"note":"the first time → hiện tại hoàn thành"},{"en":"It's the best book I'**ve ever read**.","vi":"Đó là cuốn sách hay nhất mà tôi từng đọc."},{"en":"How often **have** you **been** in love in your life?","vi":"Anh đã yêu bao nhiêu lần trong đời?"},{"en":"We'**ve sometimes talked** about moving.","vi":"Thỉnh thoảng chúng tôi bàn về việc chuyển nhà."}],"mistake":{"wrong":"It's the first time I eat sushi.","right":"It's the first time I've eaten sushi.","why":"Đếm 'lần thứ mấy tính đến nay' → hiện tại hoàn thành."},"src":"tr. 263–264"},{"title":"Lưu ý: câu đơn; today, this morning","icon":"⚠️","rule":"Các dấu hiệu trên chỉ 'chốt' hiện tại hoàn thành trong **câu đơn** (một mệnh đề). Với **today, this morning, this week, this month**: dùng hiện tại hoàn thành khi khoảng thời gian đó **chưa hết**.","explain":"Trong câu có hai mệnh đề hoặc đoạn văn, thì phải chia theo ngữ cảnh chứ không theo trạng từ: *He said that he had just seen her* (học ở chủ đề 02 và 05). Với this morning: nếu vẫn còn buổi sáng → *It has been windy this morning*; nếu đã sang trưa, chiều thì buổi sáng đã qua → quá khứ đơn *It was windy this morning* (chủ đề 02).","examples":[{"en":"He **has just seen** her.","vi":"Anh ấy vừa mới gặp cô ta."},{"en":"It **has been** windy this morning.","vi":"Sáng nay trời nhiều gió. (nói lúc vẫn còn buổi sáng)"},{"en":"I **haven't seen** John today.","vi":"Cả ngày nay tôi không gặp John. (tính từ sáng tới giờ)"}],"tip":"Với today, this morning… hãy nhìn đồng hồ: khoảng thời gian **còn đang chạy** → have/has + V3.","src":"tr. 264"}],"practice":[{"type":"classify","q":"Điền for hay since trước cụm thời gian này?","buckets":["for","since"],"items":[{"text":"two years","bucket":0},{"text":"1987","bucket":1},{"text":"last year","bucket":1},{"text":"ages","bucket":0},{"text":"Christmas","bucket":1},{"text":"a week","bucket":0},{"text":"eight o'clock","bucket":1},{"text":"a long time","bucket":0}],"explain":"Khoảng thời gian (two years, ages, a week, a long time) → for. Mốc thời gian (1987, last year, Christmas, eight o'clock) → since.","src":"tr. 263"},{"type":"mcq","q":"I have ___ had breakfast. (Tôi đã ăn sáng rồi.)","options":["already","yet"],"answer":0,"explain":"Câu khẳng định, nghĩa 'rồi' → **already**. yet chỉ dùng trong câu phủ định và câu hỏi.","src":"tr. 263"},{"type":"fill","q":"He has ___ been to Australia. (chưa bao giờ)","answer":["never"],"explain":"'chưa bao giờ' = **never**, đứng giữa has và V3.","src":"tr. 263"},{"type":"fill","q":"I've worked here ___ 2019.","answer":["since"],"explain":"2019 là một mốc → **since**.","src":"tự soạn"},{"type":"fill","q":"Simon! I haven't seen you ___ ages.","answer":["for"],"explain":"ages (rất lâu) là một khoảng thời gian → **for**.","src":"tr. 263"},{"type":"fill","q":"I haven't finished my homework ___.","answer":["yet"],"explain":"Câu phủ định, nghĩa 'chưa' → **yet**, đứng cuối câu.","src":"tự soạn"},{"type":"fill","q":"This is the first time I ___ sushi. (eat)","answer":["have eaten","'ve eaten"],"explain":"Sau This is the first time → hiện tại hoàn thành: I **have eaten** (eat – ate – eaten).","src":"tự soạn"},{"type":"fill","q":"It's the best book I have ___ read.","answer":["ever"],"explain":"the best … I have **ever** read = hay nhất mà tôi **từng** đọc.","src":"tr. 264"},{"type":"mcq","q":"Bây giờ là 4 giờ chiều. 'I haven't seen John today.' nghĩa là:","options":["Từ sáng tới giờ tôi chưa gặp John","Sáng nay tôi đã gặp John rồi"],"answer":0,"explain":"today chưa hết + hiện tại hoàn thành → tính cả ngày tới lúc nói, và chưa gặp.","src":"tr. 264"},{"type":"fix","wrong":"I have lived here since ten years.","answer":["I have lived here for ten years.","I've lived here for ten years."],"explain":"ten years là một khoảng → **for**, không phải since.","src":"tự soạn"},{"type":"fix","wrong":"This is the first time I see snow.","answer":["This is the first time I have seen snow.","This is the first time I've seen snow."],"explain":"Sau the first time dùng hiện tại hoàn thành: I **have seen** snow.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["We","have","known","each","other","since","2010."],"explain":"have + V3 (known) + since + mốc (2010).","src":"tự soạn"}],"flashcards":[{"front":"for hay since + 1987?","back":"**since** (mốc). for + khoảng: **for** two years."},{"front":"yet dùng trong loại câu nào?","back":"**Phủ định và câu hỏi**, cuối câu: I haven't finished **yet**."},{"front":"already đứng ở đâu?","back":"Giữa have và V3: I have **already** had breakfast."},{"front":"This is the first time + thì gì?","back":"Hiện tại hoàn thành: This is the first time I**'ve heard** her sing."},{"front":"so far, until now, up to now nghĩa là?","back":"**Cho đến nay**: He has made four films **so far**."}]},{"id":"01e","title":"Hiện tại hoàn thành tiếp diễn; tiếp diễn hay hoàn thành","minutes":25,"goal":"Lập câu have/has been + V-ing; biết ba cách dùng của thì này; chọn đúng giữa hiện tại hoàn thành tiếp diễn (nhấn quá trình) và hiện tại hoàn thành (nhấn kết quả).","pretest":[{"type":"mcq","q":"I ___ for you for over an hour.","options":["have been waiting","am waiting","have waiting"],"answer":0,"explain":"Việc bắt đầu từ trước và kéo dài tới bây giờ → **have been waiting**. 'have waiting' thiếu been.","src":"tr. 265"},{"type":"mcq","q":"Look at all the rose bushes I ___!","options":["have planted","have been planting"],"answer":0,"explain":"'Look at all…' → khoe **kết quả** đã xong → hiện tại hoàn thành **have planted**.","src":"tr. 266"}],"hook":{"icon":"🎥","text":"Hiện tại hoàn thành giống **tấm ảnh kết quả**: 'Tôi đã sơn xong hai phòng.' Hiện tại hoàn thành tiếp diễn giống **đoạn video quá trình**: 'Tôi sơn nhà **suốt** từ trưa tới giờ.' Tiếng Việt dùng 'suốt', 'nãy giờ', 'mãi'; tiếng Anh dùng **have/has been + V-ing**."},"diagram":{"type":"flow","title":"Hoàn thành tiếp diễn hay hoàn thành?","start":{"q":"Động từ không dùng tiếp diễn? (be, know, like, want…)","branches":[{"label":"Có","to":{"result":"have/has + V3: I've known her for two days.","icon":"🧠"}},{"label":"Không","to":{"q":"Bạn muốn nhấn điều gì?","branches":[{"label":"Quá trình kéo dài, liên tục","to":{"result":"have/has been + V-ing","icon":"🎥"}},{"label":"Kết quả, số lượng đã xong","to":{"result":"have/has + V3","icon":"📸"}}]}}]}},"chunks":[{"title":"Công thức: have/has + been + V-ing","icon":"🧩","rule":"Hiện tại hoàn thành tiếp diễn = **have/has + been + V-ing**. Phủ định: **haven't/hasn't been + V-ing**. Câu hỏi: **Have/Has + S + been + V-ing?**","explain":"Ghép hai thì đã học: phần 'hoàn thành' (have/has + been) và phần 'tiếp diễn' (V-ing). been luôn giữ nguyên, không đổi theo chủ ngữ; chỉ have/has đổi.","formula":"S + have/has + been + V-ing\nS + haven't/hasn't + been + V-ing\nHave/Has + S + been + V-ing?","diagram":{"type":"table","title":"Ba dạng câu","head":["","Công thức","Ví dụ"],"rows":[["Khẳng định","have/has been + V-ing","I've been waiting."],["Phủ định","haven't/hasn't been + V-ing","Tina hasn't been studying."],["Câu hỏi","Have/Has + S + been + V-ing?","Have you been sleeping?"]]},"examples":[{"en":"I'**ve been waiting** for you for over an hour.","vi":"Tôi đã đợi anh hơn một tiếng đồng hồ rồi."},{"en":"I have waiting for you for over an hour.","ok":false,"note":"thiếu been"},{"en":"Tina **hasn't been studying** very well recently.","vi":"Dạo này Tina học hành không tốt lắm."},{"en":"You look tired. **Have** you **been sleeping** properly?","vi":"Trông anh mệt mỏi quá. Anh có ngủ đủ giấc không vậy?"}],"mistake":{"wrong":"She has being working all day.","right":"She has been working all day.","why":"Sau has là V3 của be: **been**, không phải being."},"tip":"Nhớ 'chuỗi ba mắt xích': have/has → **been** → V-ing.","src":"tr. 265"},{"title":"Ba cách dùng: kéo dài, lặp đi lặp lại, vừa dừng","icon":"⏳","rule":"Dùng cho việc **kéo dài liên tục đến bây giờ** (có thể còn tiếp), việc **liên tục lặp đi lặp lại**, và việc **vừa mới dừng còn để lại kết quả** thấy được.","explain":"Dấu hiệu hay gặp: recently, lately, all day/morning/week, since January, for six months, over/for the last three days, How long…?. 'It's been raining' khi đường còn ướt: mưa vừa tạnh, nhưng dấu vết còn đó.","diagram":{"type":"mindmap","title":"Hiện tại hoàn thành tiếp diễn dùng cho","root":{"label":"have/has been + V-ing","children":[{"label":"Kéo dài tới nay","icon":"➡️","children":[{"label":"He's been writing since 9."}]},{"label":"Lặp đi lặp lại","icon":"🔂","children":[{"label":"He's been phoning me every day."}]},{"label":"Vừa dừng, còn dấu vết","icon":"💧","children":[{"label":"It's been raining. The streets are wet."}]}]}},"examples":[{"en":"He'**s been writing** his project since 9 o'clock.","vi":"Anh ấy viết bản kế hoạch từ lúc 9 giờ (vẫn chưa xong)."},{"en":"How long **have** you **been studying** French?","vi":"Bạn học tiếng Pháp bao lâu rồi?"},{"en":"He'**s been phoning** me every day since the party.","vi":"Từ sau bữa tiệc, ngày nào anh ta cũng gọi điện cho tôi."},{"en":"Why are your hands dirty? ~ I'**ve been fixing** my bike.","vi":"Sao tay anh bẩn vậy? ~ Tôi mới sửa xe xong."},{"en":"It'**s been raining**, the streets are still wet.","vi":"Trời vừa tạnh mưa, đường phố vẫn còn ướt."}],"tip":"Thấy dấu vết (tay bẩn, mặt đỏ, đường ướt) mà hỏi 'nãy giờ làm gì?' → have/has been + V-ing.","src":"tr. 265–266","check":{"type":"fill","q":"You're red in the face. ___ you been running?","answer":["Have"],"explain":"Câu hỏi hiện tại hoàn thành tiếp diễn: **Have** + you + been + V-ing?","src":"tr. 266"}},{"title":"Tiếp diễn hay hoàn thành?","icon":"⚖️","rule":"Hoàn thành tiếp diễn nhấn **quá trình liên tục**; hoàn thành nhấn **kết quả, sự hoàn tất** (thường có con số). Động từ không dùng tiếp diễn (be, know…) thì **luôn dùng hoàn thành**.","explain":"Các động từ nhận thức, tri giác, sở hữu ở bài 01b (be, know, like, want, have nghĩa 'có'…) không có dạng been + V-ing, nên dù việc kéo dài tới nay vẫn dùng have/has + V3. Câu có số lượng đã làm được (two rooms, four films) → hoàn thành.","diagram":{"type":"table","title":"Quá trình hay kết quả","head":["have/has been + V-ing (quá trình)","have/has + V3 (kết quả)"],"rows":[["I've been planting rose bushes all afternoon.","Look at all the rose bushes I've planted!"],["We've been painting the house.","We've painted two rooms since lunchtime."]]},"examples":[{"en":"I'**ve been planting** rose bushes all afternoon.","vi":"Tôi trồng mấy bụi hồng suốt cả buổi chiều. (nhấn quá trình)"},{"en":"We'**ve painted** two rooms since lunchtime.","vi":"Từ sau bữa trưa tới giờ chúng tôi đã sơn được hai phòng. (nhấn kết quả)"},{"en":"We've been painting two rooms since lunchtime.","ok":false,"note":"có số lượng đã xong → have painted"},{"en":"I'**ve** only **known** her for two days.","vi":"Tôi chỉ mới quen cô ta có hai ngày."},{"en":"I've only been knowing her for two days.","ok":false,"note":"know không chia tiếp diễn"},{"en":"John **has been** ill all week.","vi":"John bệnh cả tuần nay."}],"mistake":{"wrong":"John has been being ill all week.","right":"John has been ill all week.","why":"be không chia tiếp diễn → has been ill."},"tip":"Làm **bao lâu** (all afternoon) → been + V-ing. Làm được **bao nhiêu** (two rooms) → V3.","src":"tr. 266"}],"practice":[{"type":"mcq","q":"Câu nào đúng?","options":["I've been waiting here for half an hour.","I've waiting here for half an hour.","I've been wait here for half an hour."],"answer":0,"explain":"Đủ ba mắt xích: have + **been** + **waiting**. Câu 2 thiếu been, câu 3 thiếu -ing.","src":"tr. 265"},{"type":"fill","q":"It ___ all day. I'm tired of it. (rain)","answer":["has been raining","'s been raining"],"explain":"all day + vẫn đang mưa → kéo dài liên tục tới nay: **has been raining**.","src":"tr. 265"},{"type":"fill","q":"How long ___ you been studying French?","answer":["have"],"explain":"Câu hỏi với you: How long + **have** + you + been + V-ing?","src":"tr. 265"},{"type":"fill","q":"Tina ___ very well recently. (not / study)","answer":["hasn't been studying","has not been studying"],"explain":"Tina = she → **has not / hasn't been studying**.","src":"tr. 265"},{"type":"mcq","q":"Why are your hands dirty? ~ ___ my bike.","options":["I've been fixing","I fix","I've been fix"],"answer":0,"explain":"Việc vừa dừng, để lại dấu vết (tay bẩn) → **I've been fixing**.","src":"tr. 266"},{"type":"classify","q":"Câu này nhấn quá trình hay kết quả?","buckets":["Quá trình (been + V-ing)","Kết quả (V3)"],"items":[{"text":"I've been painting the house all day.","bucket":0},{"text":"We've painted two rooms.","bucket":1},{"text":"She's been writing letters since 9.","bucket":0},{"text":"She has written five letters.","bucket":1},{"text":"It's been raining for the last three days.","bucket":0},{"text":"I've planted ten rose bushes.","bucket":1}],"explain":"been + V-ing kể **quá trình** (all day, since 9, for the last three days). V3 + con số (two rooms, five letters, ten bushes) kể **kết quả**.","src":"tr. 266"},{"type":"mcq","q":"I ___ her for two days.","options":["have only known","have only been knowing"],"answer":0,"explain":"**know** không chia tiếp diễn → dùng hiện tại hoàn thành: have only **known**.","src":"tr. 266"},{"type":"fill","q":"John ___ ill all week. (be)","answer":["has been","'s been"],"explain":"be không chia tiếp diễn → **has been** ill (không phải has been being).","src":"tr. 266"},{"type":"fill","q":"I've been waiting for two hours, but my friend ___ yet. (not / come)","answer":["hasn't come","has not come"],"explain":"yet trong câu phủ định → hiện tại hoàn thành: **hasn't come** (come – came – come).","src":"tr. 288"},{"type":"fix","wrong":"We've been painting two rooms since lunchtime.","answer":["We've painted two rooms since lunchtime.","We have painted two rooms since lunchtime."],"explain":"Có số lượng đã xong (two rooms) → nhấn kết quả → **have painted**.","src":"tr. 266"},{"type":"fix","wrong":"How long have you been knowing Jane?","answer":["How long have you known Jane?"],"explain":"know không chia tiếp diễn → **have you known**.","src":"tr. 288"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["He","has","been","phoning","me","every","day."],"explain":"has + been + V-ing: việc liên tục lặp đi lặp lại tới nay.","src":"tr. 265"}],"flashcards":[{"front":"Công thức hiện tại hoàn thành tiếp diễn?","back":"**have/has + been + V-ing**: I**'ve been waiting** for an hour."},{"front":"been + V-ing nhấn gì? V3 nhấn gì?","back":"been + V-ing: **quá trình** (all afternoon). V3: **kết quả**, số lượng (two rooms)."},{"front":"know, be… với 'for two days' chia thế nào?","back":"Hiện tại hoàn thành: I**'ve known** her for two days (không nói been knowing)."},{"front":"'It's been raining' khi trời đã tạnh nghĩa là?","back":"Mưa **vừa dừng**, còn để lại kết quả: đường vẫn ướt."}]}],"quiz":{"pass":0.8,"sets":[[{"type":"mcq","q":"Water ___ at 100 °C.","options":["boils","is boiling","boil"],"answer":0,"explain":"Chân lý luôn đúng → hiện tại đơn; water = it → **boils**.","src":"tự soạn"},{"type":"fill","q":"Kids ___ to school five days a week. (go)","answer":["go"],"explain":"Kids là số nhiều → động từ nguyên mẫu **go**, không thêm -es.","src":"tr. 256"},{"type":"fill","q":"She usually ___ her homework before dinner. (finish)","answer":["finishes"],"explain":"usually → thói quen; she + finish (tận cùng sh) → **finishes**.","src":"tự soạn"},{"type":"fix","wrong":"My brother don't eat meat.","answer":["My brother doesn't eat meat.","My brother does not eat meat."],"explain":"my brother = he → **doesn't**.","src":"tự soạn"},{"type":"mcq","q":"What do you do every night? ~ I ___ TV.","options":["watch","am watching"],"answer":0,"explain":"every night → thói quen → hiện tại đơn **watch**.","src":"tr. 257"},{"type":"mcq","q":"Listen! Someone ___ at the door.","options":["is knocking","knocks"],"answer":0,"explain":"Listen! → việc đang xảy ra ngay lúc nói → **is knocking**.","src":"tự soạn"},{"type":"fill","q":"These days, house prices ___ up again. (go)","answer":["are going","'re going"],"explain":"these days + sự việc đang thay đổi → tiếp diễn; house prices số nhiều → **are going**. 'go up' là chuyện thường lệ, không hợp.","src":"tr. 258"},{"type":"mcq","q":"Câu nào đúng?","options":["I want a new computer.","I'm wanting a new computer."],"answer":0,"explain":"**want** không chia tiếp diễn → I want.","src":"tr. 287"},{"type":"mcq","q":"Câu nào là lời phàn nàn 'cứ… mãi'?","options":["They're always fighting about something.","They always have lunch at twelve."],"answer":0,"explain":"**always + V-ing** diễn tả việc xảy ra quá thường xuyên khiến người nói bực mình. always + hiện tại đơn chỉ kể một thói quen bình thường.","src":"tr. 259, 287"},{"type":"fill","q":"Tom ___ a bad car crash. He's in hospital. (have)","answer":["has had","'s had"],"explain":"Kết quả còn ở hiện tại (đang nằm viện) → hiện tại hoàn thành; have – had – **had**.","src":"tr. 262"},{"type":"fix","wrong":"He has write three books.","answer":["He has written three books.","He's written three books."],"explain":"Sau has là V3: write – wrote – **written**.","src":"tự soạn"},{"type":"mcq","q":"Câu nào SAI?","options":["I have met her two days ago.","I have met her before.","I haven't met her today."],"answer":0,"shuffle":false,"explain":"**two days ago** là mốc đã qua → không đi với hiện tại hoàn thành. before và today (chưa hết) thì được.","src":"tr. 261, 264"},{"type":"mcq","q":"I've lived in Hanoi ___ last year.","options":["since","for"],"answer":0,"explain":"last year là một mốc → **since**.","src":"tự soạn"},{"type":"fill","q":"Lan hasn't replied to my message ___.","answer":["yet"],"explain":"Câu phủ định, nghĩa 'chưa' → **yet**, đứng cuối câu.","src":"tự soạn"},{"type":"fix","wrong":"It's the best film I have never seen.","answer":["It's the best film I have ever seen.","It's the best film I've ever seen."],"explain":"the best … I have **ever** seen = hay nhất tôi **từng** xem. never ở đây làm câu mất nghĩa.","src":"tr. 264"},{"type":"fill","q":"I ___ Lan for ten years. We're old friends. (know)","answer":["have known","'ve known"],"explain":"know không chia tiếp diễn → kéo dài tới nay dùng hiện tại hoàn thành: **have known**.","src":"tr. 266"},{"type":"mcq","q":"She ___ four books so far.","options":["has written","has been writing"],"answer":0,"explain":"Có con số kết quả (four books) + so far → hiện tại hoàn thành **has written**.","src":"tr. 262, 266"},{"type":"mcq","q":"___ she been sleeping well lately?","options":["Has","Is","Does"],"answer":0,"explain":"been + V-ing đi với **have/has**; she → **Has** she been sleeping…?","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu hỏi đúng:","words":["How","long","have","you","been","learning","English?"],"explain":"How long + have + you + been + V-ing: hỏi việc kéo dài tới nay.","src":"tr. 265"},{"type":"classify","q":"Dấu hiệu này thường gợi ý thì nào?","buckets":["Hiện tại đơn","Hiện tại tiếp diễn","Hiện tại hoàn thành"],"items":[{"text":"every week","bucket":0},{"text":"twice a year","bucket":0},{"text":"right now","bucket":1},{"text":"at the moment","bucket":1},{"text":"these days","bucket":1},{"text":"already","bucket":2},{"text":"so far","bucket":2},{"text":"yet","bucket":2}],"explain":"Tần suất (every week, twice a year) → đơn. Lúc này, dạo này (right now, at the moment, these days) → tiếp diễn. already, so far, yet → hoàn thành.","src":"tr. 256, 258, 263"},{"type":"mcq","q":"Câu nào đúng?","options":["My cousins are nurses.","My cousins is nurses.","My cousins nurses."],"answer":0,"explain":"Chủ ngữ *my cousins* số nhiều → **are**. Không bỏ be như tiếng Việt ('anh họ tôi y tá'), cũng không dùng is cho số nhiều.","src":"tự soạn"},{"type":"fill","q":"Mr Nam ___ the bus to work every morning. (catch)","answer":["catches"],"hint":"tận cùng -ch","explain":"Thói quen (every morning), chủ ngữ ngôi thứ ba số ít; catch tận cùng **ch** → thêm -es: **catches**.","src":"tự soạn"},{"type":"fix","wrong":"My uncle fixs cars in a small garage.","answer":["My uncle fixes cars in a small garage."],"explain":"fix tận cùng bằng **x** → thêm -es: **fixes**, không phải fixs.","src":"tự soạn"},{"type":"mcq","q":"___ your parents live near here?","options":["Do","Does","Are"],"answer":0,"explain":"*your parents* số nhiều, động từ chính là live → hỏi bằng **Do**. Does chỉ dùng cho he/she/it; Are không đi với động từ nguyên mẫu live.","src":"tự soạn"},{"type":"mcq","q":"Câu 'The concert starts at 8 p.m. tomorrow.' dùng hiện tại đơn vì:","options":["Đây là thời gian biểu đã cố định","Đây là việc đang xảy ra ngay lúc nói","Đây là thói quen hằng ngày"],"answer":0,"explain":"Buổi hoà nhạc có giờ cố định theo lịch → hiện tại đơn dù việc ở tương lai (tomorrow). Không phải đang xảy ra, cũng không phải thói quen.","src":"tự soạn"},{"type":"mcq","q":"Shh! Dad ___ on the phone with his boss.","options":["is talking","talks","talking"],"answer":0,"explain":"Shh! báo hiệu việc đang diễn ra ngay lúc nói → **is talking**. 'talking' thiếu is; 'talks' là thói quen.","src":"tự soạn"},{"type":"fill","q":"Lan ___ with her aunt this month while her parents are abroad. (stay)","answer":["is staying","'s staying"],"explain":"Việc **tạm thời** (this month, trong lúc bố mẹ đi vắng) → hiện tại tiếp diễn: **is staying**. 'stays' dùng cho việc cố định, lâu dài.","src":"tự soạn"},{"type":"mcq","q":"I ___ what this word means.","options":["don't know","am not knowing","not know"],"answer":0,"explain":"know là động từ nhận thức, **không chia tiếp diễn** → don't know. 'not know' thiếu trợ động từ don't.","src":"tự soạn"},{"type":"fix","wrong":"My little brother is always break his toys!","answer":["My little brother is always breaking his toys!"],"explain":"Phàn nàn 'cứ… mãi' = is always + **V-ing**: is always **breaking**. Sau is không dùng động từ nguyên mẫu.","src":"tự soạn"},{"type":"classify","q":"Động từ này có chia tiếp diễn (V-ing) được không?","buckets":["Chia tiếp diễn được (hành động)","Không chia tiếp diễn (trạng thái)"],"items":[{"text":"run","bucket":0},{"text":"own","bucket":1},{"text":"cook","bucket":0},{"text":"believe","bucket":1},{"text":"swim","bucket":0},{"text":"need","bucket":1},{"text":"write","bucket":0},{"text":"hate","bucket":1}],"explain":"run, cook, swim, write là hành động → được chia tiếp diễn. own (sở hữu), believe (nhận thức), need, hate (cảm xúc, trạng thái) → không chia tiếp diễn, dùng hiện tại đơn.","src":"tr. 259"},{"type":"mcq","q":"Are you free tonight? ~ Sorry, I ___ my grandparents tonight.","options":["am visiting","visit","visiting"],"answer":0,"explain":"Kế hoạch đã định cho tương lai gần (tonight) → hiện tại tiếp diễn **am visiting**. 'visiting' thiếu am; 'visit' là thói quen.","src":"tự soạn"},{"type":"mcq","q":"This soup ___ delicious. Can I have some more?","options":["tastes","is tasting","taste"],"answer":0,"explain":"taste (có vị) là động từ tri giác → không chia tiếp diễn. Chủ ngữ *this soup* ngôi thứ ba số ít → **tastes**.","src":"tự soạn"},{"type":"mcq","q":"My cousins ___ a new car. Come and see it!","options":["have bought","has bought","have buy"],"answer":0,"explain":"Việc đã xảy ra, kết quả còn đó (xe đang ở đây) → hiện tại hoàn thành. *my cousins* số nhiều → **have**; sau have là V3 **bought**, không phải buy.","src":"tự soạn"},{"type":"fill","q":"Oh no! My bike isn't here. Somebody ___ it. (steal)","answer":["has stolen","'s stolen"],"explain":"Việc vừa xảy ra, kết quả còn đó (xe không còn) → **has stolen** (steal – stole – **stolen**). somebody dùng như ngôi thứ ba số ít → has.","src":"tự soạn"},{"type":"fix","wrong":"She has went to the market.","answer":["She has gone to the market.","She's gone to the market."],"explain":"Sau has là V3: go – went – **gone**. went là dạng quá khứ (cột 2), không đứng sau has.","src":"tự soạn"},{"type":"mcq","q":"'Our team has won three matches so far this season.' nghĩa là:","options":["Tính đến nay đội thắng 3 trận, mùa giải vẫn còn tiếp","Mùa giải đã kết thúc từ lâu"],"answer":0,"explain":"Hiện tại hoàn thành + so far: đếm **tính đến nay**, việc còn có thể tiếp diễn (còn trận để đá). Nếu mùa giải đã xong từ lâu thì không còn dính tới hiện tại.","src":"tự soạn"},{"type":"mcq","q":"Câu nào báo tin mới đúng cách?","options":["Guess what? I have found a job!","Guess what? I find a job!","Guess what? I am finding a job!"],"answer":0,"explain":"Báo tin vừa xảy ra → hiện tại hoàn thành **have found**. 'I find' là thói quen; 'am finding' là đang diễn ra, không hợp.","src":"tự soạn"},{"type":"classify","q":"Mỗi tình huống cần thì nào?","buckets":["Hiện tại đơn","Hiện tại tiếp diễn","Hiện tại hoàn thành"],"items":[{"text":"Giờ tàu chạy theo lịch cố định","bucket":0},{"text":"Một sự thật khoa học","bucket":0},{"text":"Việc đang xảy ra ngay lúc nói","bucket":1},{"text":"Kế hoạch đã hẹn cho tối nay","bucket":1},{"text":"Việc vừa mới xảy ra","bucket":2},{"text":"Số lần làm một việc tính đến nay","bucket":2}],"explain":"Thời gian biểu, chân lý → hiện tại đơn. Đang xảy ra, kế hoạch gần → hiện tại tiếp diễn. Vừa xảy ra, số lần tính đến nay → hiện tại hoàn thành.","src":"tr. 256–262"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Lan","has","cut","her","hair","short."],"explain":"Kết quả còn thấy (tóc đang ngắn) → has + V3. cut – cut – **cut** (ba cột giống nhau).","src":"tự soạn"},{"type":"mcq","q":"I've ___ finished my homework, so I can go out now.","options":["already","yet","ever"],"answer":0,"explain":"Câu khẳng định, nghĩa 'xong **rồi**' → **already**, đứng giữa have và V3. yet chỉ dùng trong câu phủ định/câu hỏi; ever là 'đã từng'.","src":"tự soạn"},{"type":"fill","q":"Have you ___ been to Da Lat? (Bạn đã **bao giờ** đến Đà Lạt chưa?)","answer":["ever"],"explain":"'Đã bao giờ… chưa?' → **ever**, đứng giữa have và V3: Have you ever been…?","src":"tự soạ
