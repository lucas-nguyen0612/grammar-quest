ill + S + have + V3…?**","src":"tr. 279"}],"flashcards":[{"front":"Công thức tương lai hoàn thành?","back":"S + **will have + V3**: They'll have finished the roof by Tuesday."},{"front":"Công thức tương lai hoàn thành tiếp diễn?","back":"S + **will have been + V-ing**: By 2018 he'll have been living in Madrid for 20 years."},{"front":"Dấu hiệu hay gặp của hai thì này?","back":"**by** + mốc tương lai: by then, by the time, by next June, by 10 o'clock"},{"front":"TL hoàn thành khác TL hoàn thành tiếp diễn thế nào?","back":"HT: **xong, kết quả** (written the report). HTTD: **kéo dài liên tục** (been writing it for a week)."},{"front":"Sau when/before, thay 'will have finished' bằng gì?","back":"**Hiện tại hoàn thành**: when I **have finished** my homework."}]}],"quiz":{"pass":0.8,"sets":[[{"type":"mcq","q":"A: This box is too heavy for me.\nB: Don't worry. I ___ you.","options":["'ll help","help","'m going to help"],"answer":0,"explain":"B quyết định ngay lúc nghe A nói → **will**. 'help' thiếu will; going to dành cho việc đã định từ trước.","src":"tự soạn"},{"type":"fill","q":"I think our team ___ (win) the match on Sunday.","answer":["will win","'ll win","is going to win","'s going to win"],"explain":"**I think** + dự đoán theo ý kiến → **will win** (cách sách dạy). *is going to win* cũng được chấp nhận. Sai hay gặp: *our team wins* (thiếu dạng tương lai).","src":"tự soạn"},{"type":"mcq","q":"Bạn gợi ý: **Chiều nay mình đi bơi nhé?**","options":["Shall we go swimming this afternoon?","Will we go swimming this afternoon?","Are we go swimming this afternoon?"],"answer":0,"explain":"Gợi ý, rủ rê với we → **Shall we…?** 'Will we go…?' chỉ là hỏi xem việc đó có xảy ra không.","src":"tr. 277"},{"type":"fix","wrong":"I promise I call you every day.","answer":["I promise I'll call you every day.","I promise I will call you every day."],"explain":"Lời hứa về tương lai → **will**: I'll call. Tiếng Việt bỏ được chữ 'sẽ', tiếng Anh thì không.","src":"tự soạn"},{"type":"mcq","q":"Look at that man on the roof! He ___!","options":["is going to fall","will fall","falls"],"answer":0,"explain":"Dấu hiệu trước mắt, việc sắp xảy ra chắc chắn → **be going to**.","src":"tự soạn"},{"type":"fill","q":"A: Why are you wearing old clothes?\nB: I ___ (paint) my bedroom this afternoon. I decided that last week.","answer":["am going to paint","'m going to paint","am painting","'m painting","will be painting","'ll be painting"],"explain":"Việc đã quyết từ tuần trước → **be going to** (hoặc hiện tại tiếp diễn / *will be painting* cho việc đã sắp xếp theo kế hoạch). Không dùng *will paint*: will chỉ dành cho quyết định vừa nảy ra lúc nói.","src":"tự soạn"},{"type":"mcq","q":"Bạn **đã ấp ủ từ lâu**, chưa đăng ký lớp nào: **Tôi định học tiếng Nhật.**","options":["I'm going to learn Japanese.","I'll learn Japanese.","I learn Japanese."],"answer":0,"explain":"Dự định có sẵn, chưa sắp xếp → **be going to**. Will chỉ cho quyết định vừa nảy ra; hiện tại đơn không diễn đạt dự định.","src":"tr. 282–283"},{"type":"classify","q":"Mỗi tình huống dùng cách nói tương lai nào?","buckets":["Hiện tại đơn","Hiện tại tiếp diễn","be about to"],"items":[{"text":"Lịch bay: máy bay hạ cánh lúc 6:40.","bucket":0},{"text":"Đã hẹn bác sĩ chiều thứ Hai.","bucket":1},{"text":"Tàu đang rục rịch, vài giây nữa là chạy.","bucket":2},{"text":"Lịch rạp: phim chiếu lúc 8 giờ tối nay.","bucket":0},{"text":"Đã đặt vé, cuối tuần này đi Huế với bạn.","bucket":1},{"text":"Mọi người đã ngồi vào chỗ, buổi họp sắp bắt đầu ngay.","bucket":2}],"explain":"Thời gian biểu (lịch bay, lịch rạp) → hiện tại đơn. Việc cá nhân đã sắp xếp (hẹn bác sĩ, đã đặt vé đi chơi) → hiện tại tiếp diễn. Việc sắp xảy ra ngay → be about to.","src":"tự soạn"},{"type":"mcq","q":"Nhanh lên! **Ngân hàng sắp đóng cửa rồi.**","options":["The bank is about to close.","The bank is about closing.","The bank about to close."],"answer":0,"explain":"**be about to + V nguyên mẫu**: is about to close. Không bỏ to, không bỏ is.","src":"tự soạn"},{"type":"mcq","q":"Câu nào là văn phong bản tin, trang trọng?","options":["The two companies are to merge shortly.","The two companies are to merging shortly.","The two companies merging shortly."],"answer":0,"explain":"Kế hoạch chính thức trong bản tin → **be to + V nguyên mẫu**: are to merge.","src":"tr. 284"},{"type":"fill","q":"Our English class ___ (start) at 6.30 tomorrow evening, as usual. (lịch học cố định)","answer":["starts"],"hint":"thời gian biểu","explain":"Thời gian biểu cố định → **hiện tại đơn**, ngôi thứ ba số ít → starts.","src":"tự soạn"},{"type":"fill","q":"This time tomorrow, I ___ (sit) on a plane to Tokyo.","answer":["will be sitting","'ll be sitting","shall be sitting"],"explain":"Việc sẽ đang diễn ra tại một thời điểm tương lai (giờ này ngày mai) → **will be + V-ing**.","src":"tự soạn"},{"type":"mcq","q":"Hỏi lịch sự kế hoạch của sếp: **Ngày mai anh có dùng phòng họp không?**","options":["Will you be using the meeting room tomorrow?","Will you using the meeting room tomorrow?","Are you use the meeting room tomorrow?"],"answer":0,"explain":"Hỏi lịch sự về kế hoạch → **Will you be + V-ing…?**","src":"tr. 279"},{"type":"fix","wrong":"When Dad gets home, we will be prepare dinner.","answer":["When Dad gets home, we will be preparing dinner.","When Dad gets home, we'll be preparing dinner."],"explain":"Hành động nền đang diễn ra khi bố về → **will be preparing** (will be + V-ing), không dùng V nguyên mẫu sau will be.","src":"tự soạn"},{"type":"fill","q":"By the end of this year, we ___ (build) the new school. (xong trước mốc đó)","answer":["will have built","'ll have built"],"explain":"Hoàn tất trước một mốc tương lai (by the end of this year) → **will have + V3**: build – built – built.","src":"tự soạn"},{"type":"mcq","q":"**Đến hè này là tôi làm việc ở công ty này được 6 năm.**","options":["By this summer I'll have worked at this company for six years.","By this summer I'll work at this company for six years.","By this summer I'll have work at this company for six years."],"answer":0,"explain":"Kéo dài đến một mốc tương lai (by this summer + for six years) → **will have + V3** (worked). *I'll work* không diễn đạt 'đã được 6 năm'; *have work* thiếu -ed.","src":"tr. 280"},{"type":"fix","wrong":"By 8 p.m. she will have been study for six hours.","answer":["By 8 p.m. she will have been studying for six hours.","By 8 p.m. she'll have been studying for six hours."],"explain":"**will have been + V-ing**: have been **studying**.","src":"tự soạn"},{"type":"mcq","q":"**Đến lúc anh ấy tới thì bữa tiệc đã kết thúc rồi.** By the time he arrives, the party ___.","options":["will have ended","will be ending","is ending"],"answer":0,"explain":"Xong **trước** mốc 'lúc anh ấy tới' → **tương lai hoàn thành**: will have ended. *will be ending* là lúc đó đang kết thúc dở, không phải đã xong.","src":"tr. 280"},{"type":"classify","q":"Chọn dạng động từ hợp với từng tình huống:","buckets":["will + V","be going to + V","will be + V-ing","will have + V3"],"items":[{"text":"Lời hứa: 'Tôi sẽ không bao giờ quên bạn.'","bucket":0},{"text":"Quyết định ngay: 'Thôi được, tôi sẽ mua nó.'","bucket":0},{"text":"Thấy thân cây nứt toác: 'Cái cây sắp đổ!'","bucket":1},{"text":"Đã quyết từ tháng trước: 'Năm sau tôi sẽ học thạc sĩ.'","bucket":1},{"text":"'Lúc 9 giờ tối mai tôi đang xem phim.'","bucket":2},{"text":"'Tầm này tuần sau tôi đang đi thi.'","bucket":2},{"text":"'Đến thứ Sáu tôi sẽ đọc xong cuốn sách.'","bucket":3},{"text":"'Đến năm 2030 họ sẽ xây xong cây cầu.'","bucket":3}],"explain":"Hứa, quyết định tức thì → will. Dấu hiệu trước mắt, dự định có sẵn → be going to. Đang diễn ra tại một lúc tương lai → will be V-ing. Xong trước một mốc → will have V3.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu:","words":["She","will","have","finished","the","course","by","June."],"explain":"Hoàn tất trước mốc tương lai: **will have + V3** + by June.","src":"tự soạn","answer":["She will have finished the course by June.","By June she will have finished the course."]},{"type":"mcq","q":"Phủ định của **'Lan will come to the meeting'** là:","options":["Lan won't come to the meeting.","Lan willn't come to the meeting.","Lan won't comes to the meeting.","Lan doesn't will come to the meeting."],"answer":0,"explain":"Phủ định: will **not** = **won't**, động từ sau vẫn nguyên mẫu (come). Không có dạng *willn't*, không thêm -s, và không mượn doesn't vì will đã là trợ động từ.","src":"tự soạn"},{"type":"fill","q":"Don't wait for me tonight. I ___ (probably / be) home late.","answer":["will probably be","'ll probably be","am probably going to be","'m probably going to be"],"hint":"probably đứng sau will","explain":"Dự đoán của người nói → **will**, và **probably đứng sau will**: I'll probably be. Sai hay gặp: *I probably will be* hoặc quên will (*I probably am*).","src":"tự soạn"},{"type":"mcq","q":"A: It's so hot in here.\nB: ___ open the window?","options":["Shall I","Will I","Do I"],"answer":0,"explain":"Ngỏ ý làm giúp người khác → **Shall I…?** (= tôi mở cửa sổ nhé?). *Will I open…?* chỉ hỏi xem việc đó có xảy ra không, không phải lời đề nghị; *Do I open?* là hỏi thói quen.","src":"tr. 277"},{"type":"mcq","q":"Bạn nhờ bạn cùng phòng: **Cậu tắt đèn giúp mình nhé?**","options":["Will you turn off the light, please?","Shall you turn off the light, please?","Are you going to turn off the light, please?"],"answer":0,"explain":"Nhờ người khác làm gì → **Will you…?** Shall chỉ đi với I/we, nên *Shall you* sai. *Are you going to…?* là hỏi dự định của người ta, không phải lời nhờ.","src":"tự soạn"},{"type":"fix","wrong":"I think the price of petrol will goes up next year.","answer":["I think the price of petrol will go up next year."],"explain":"Sau will động từ luôn nguyên mẫu: will **go** up, không thêm -s dù chủ ngữ là ngôi thứ ba số ít.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","promise","I","won't","be","late","again."],"explain":"Lời hứa → **will**; phủ định *won't* + V nguyên mẫu: I won't **be** late again.","src":"tự soạn"},{"type":"mcq","q":"___ your brother going to study abroad next year?","options":["Is","Does","Will"],"answer":0,"explain":"Câu hỏi với be going to: đưa **be** (chia theo chủ ngữ) lên đầu → **Is** your brother going to…? Không mượn does, và không ghép will với going to.","src":"tự soạn"},{"type":"fill","q":"I've thought about it a lot and I've decided. I ___ (not / buy) a new phone this year; my old one is fine.","answer":["'m not going to buy","am not going to buy"],"hint":"quyết định đã có từ trước","explain":"Đã quyết định **từ trước** (I've decided) → **be going to**: I'm not going to buy. Will dành cho quyết định vừa nảy ra lúc nói.","src":"tự soạn"},{"type":"mcq","q":"Look at the score! It's 3–0 to them and there are only two minutes left. We ___ the match.","options":["are going to lose","will lose","lose"],"answer":0,"explain":"Dự đoán dựa vào **tình huống trước mắt** (tỷ số 0–3, còn 2 phút) → **be going to**. Will dùng cho dự đoán theo ý kiến, cảm nghĩ; hiện tại đơn không nói được dự đoán.","src":"tự soạn"},{"type":"mcq","q":"A: I want to go out tomorrow evening but I haven't got a baby-sitter.\nB: That's no problem. I ___ after the children.","options":["'ll look","'m going to look","look"],"answer":0,"explain":"B **vừa nghe xong mới ngỏ ý** giúp → quyết định tức thì → **will**. Going to là việc đã định từ trước; *I look* thiếu will.","src":"tr. 299"},{"type":"mcq","q":"A: Have you decided about the course?\nB: Yes, I decided last weekend. ___ for a place.","options":["I'm going to apply","I'll apply","I apply"],"answer":0,"explain":"B đã quyết **từ cuối tuần trước** → dự định có sẵn → **be going to**. Will chỉ cho quyết định ngay lúc nói.","src":"tr. 300"},{"type":"classify","q":"Mỗi câu dự đoán dựa vào đâu?","buckets":["Ý kiến, phỏng đoán → will","Dấu hiệu trước mắt → be going to"],"items":[{"text":"Perhaps she'll like the book.","bucket":0},{"text":"Look at the traffic! We're going to be late.","bucket":1},{"text":"I expect the exam will be easy.","bucket":0},{"text":"Watch out! The ladder's going to fall!","bucket":1},{"text":"Someday everyone will speak two languages.","bucket":0},{"text":"Listen to that thunder. There's going to be a storm.","bucket":1}],"explain":"Perhaps, I expect, someday… chỉ là ý kiến của người nói → **will**. Nhìn thấy kẹt xe, cái thang chao đảo, nghe tiếng sấm → bằng chứng ngay trước mắt → **be going to**.","src":"tự soạn"},{"type":"mcq","q":"Bạn **đã hẹn** ăn trưa với sếp mới lúc 12 giờ trưa mai. Câu nào đúng?","options":["I'm meeting my new boss for lunch at noon tomorrow.","I'll meet my new boss for lunch at noon tomorrow.","I meet my new boss for lunch at noon tomorrow."],"answer":0,"explain":"Việc cá nhân **đã sắp xếp**, có giờ cụ thể → **hiện tại tiếp diễn**. Will là quyết định vừa nảy ra, không hợp với lịch hẹn có sẵn; hiện tại đơn dành cho thời gian biểu chung (tàu xe, rạp, lịch học).","src":"tự soạn"},{"type":"fill","q":"The exam ___ (begin) at 7.30 next Monday morning. (lịch thi của trường)","answer":["begins"],"explain":"Thời gian biểu, lịch cố định → **hiện tại đơn**; chủ ngữ the exam là ngôi thứ ba số ít → **begins**.","src":"tự soạn"},{"type":"mcq","q":"Tắt điện thoại đi, **máy bay sắp cất cánh rồi**.","options":["The plane is about to take off.","The plane is to take off.","The plane is about to taking off."],"answer":0,"explain":"Việc **sắp xảy ra ngay** → **be about to + V nguyên mẫu**. *be to* là kế hoạch chính thức (văn bản tin), không mang nghĩa 'ngay bây giờ'; sau about to không dùng V-ing.","src":"tự soạn"},{"type":"mcq","q":"Tôi **vừa định gọi** cho bạn thì bạn gọi tới.","options":["I was about to call you when you called me.","I am about to call you when you called me.","I was about to calling you when you called me."],"answer":0,"explain":"Chuyện đã qua: 'lúc đó sắp sửa làm thì…' → **was about to + V**. Câu chuyện ở quá khứ nên không dùng am; sau to là V nguyên mẫu (call).","src":"tự soạn"},{"type":"fix","wrong":"What time does the flight leaves tomorrow?","answer":["What time does the flight leave tomorrow?"],"explain":"Hỏi về giờ bay (thời gian biểu) → hiện tại đơn. Đã có **does** thì động từ chính trở về nguyên mẫu: leave.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["We","are","flying","to","Da Nang","on","Friday."],"answer":["We are flying to Da Nang on Friday.","On Friday we are flying to Da Nang."],"explain":"Chuyến đi đã đặt vé, có ngày cụ thể → **hiện tại tiếp diễn**: are flying… on Friday.","src":"tự soạn"},{"type":"fill","q":"At ten o'clock tonight I ___ (study) for my English test, so please don't call.","answer":["will be studying","'ll be studying","shall be studying"],"explain":"Sẽ **đang** làm gì tại một thời điểm tương lai (10 giờ tối nay) → **will be + V-ing**.","src":"tự soạn"},{"type":"mcq","q":"Tối mai từ 7 đến 10 giờ mình **sẽ đang làm thêm** ở quán cà phê, nên không đi được.\nFrom 7 to 10 tomorrow evening I ___ at the café.","options":["will be working","will have worked","will working"],"answer":0,"explain":"Việc **đang diễn ra suốt một khoảng** thời gian ở tương lai → **will be + V-ing**. *will have worked* là 'sẽ làm xong' trước một mốc; *will working* thiếu be.","src":"tự soạn"},{"type":"mcq","q":"**Khi bạn ra khỏi phòng thi, mình sẽ đang đợi bạn ở cổng.**","options":["When you come out of the exam room, I'll be waiting for you at the gate.","When you will come out of the exam room, I'll be waiting for you at the gate.","When you come out of the exam room, I'll waiting for you at the gate."],"answer":0,"explain":"Hành động nền đang diễn ra → **will be waiting**; việc chen vào đứng sau **when** chia **hiện tại đơn** (you come), không dùng will. Câu 3 thiếu be.","src":"tự soạn"},{"type":"mcq","q":"**Con sẽ hiểu khi con lớn lên.**","options":["You'll understand when you're older.","You'll be understanding when you're older."],"answer":0,"explain":"**understand** là động từ chỉ nhận thức, không chia tiếp diễn → dùng **tương lai đơn**: you'll understand.","src":"tự soạn"},{"type":"fix","wrong":"This time next month she will be live in Canada.","answer":["This time next month she will be living in Canada.","This time next month she'll be living in Canada."],"explain":"Tương lai tiếp diễn: will be + **V-ing** → will be **living**. Sau will be không dùng V nguyên mẫu.","src":"tự soạn"},{"type":"mcq","q":"Câu nào nghĩa là **2 giờ chiều mai tôi đang ngồi trên xe buýt đi Hải Phòng** (xe chạy từ trước đó)?","options":["At 2 tomorrow afternoon I'll be travelling to Hai Phong by bus.","At 2 tomorrow afternoon I'll travel to Hai Phong by bus."],"answer":0,"explain":"'Đang' làm gì tại một thời điểm tương lai → **will be + V-ing**. *I'll travel at 2* nghĩa là 2 giờ mới **bắt đầu** đi.","src":"tự soạn"},{"type":"mcq","q":"Next Monday, Chuck ___ in Britain for exactly three years.","options":["will have been","will be","will have being"],"answer":0,"explain":"Kéo dài **đến một mốc** tương lai (next Monday) + **for** three years → **tương lai hoàn thành**: will have **been** (V3 của be). *will be* không nói được 'đã được ba năm'; sau have phải là V3, không phải being.","src":"tr. 302"},{"type":"fill","q":"By the time we reach Hue, we ___ (drive) for eight hours.","answer":["will have been driving","'ll have been driving","will have driven","'ll have driven"],"explain":"Việc kéo dài **liên tục** đến một mốc tương lai → **will have been driving** (nhấn mạnh liên tục). *will have driven for eight hours* cũng đúng (tương lai hoàn thành + for). Không dùng *will be driving*: nó không nói được 'đến lúc đó đã được 8 tiếng'.","src":"tự soạn"},{"type":"fix","wrong":"By the end of the week, we will have spend all our money.","answer":["By the end of the week, we will have spent all our money.","By the end of the week, we'll have spent all our money."],"explain":"Sau will have là **quá khứ phân từ (V3)**: spend – spent – **spent**.","src":"tự soạn"},{"type":"mcq","q":"**Đến trưa mai, Mai sẽ đọc xong 200 trang.**","options":["By noon tomorrow Mai will have read 200 pages.","By noon tomorrow Mai will have been reading 200 pages.","By noon tomorrow Mai will be reading 200 pages."],"answer":0,"explain":"Nói **kết quả** (con số 200 trang đã xong) → **will have + V3**. Thì tiếp diễn nhấn mạnh độ dài thời gian, không đi với số lượng đã hoàn thành.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["The","guests","will","have","left","by","midnight."],"answer":["The guests will have left by midnight.","By midnight the guests will have left."],"explain":"Việc xong trước một mốc (by midnight) → **will have + V3**: will have left.","src":"tự soạn"},{"type":"mcq","q":"I'll phone you as soon as I ___ at the hotel.","options":["arrive","will arrive","am going to arrive"],"answer":0,"explain":"Sau **as soon as** (mệnh đề chỉ thời gian) không dùng will hay going to, mà dùng **hiện tại đơn**: as soon as I arrive. Chủ đề 05 sẽ học kỹ quy tắc này.","src":"tự soạn"}],[{"type":"mcq","q":"Chọn câu hỏi đúng:","options":["What time will the guests arrive?","What time will the guests arrives?","What time the guests will arrive?"],"answer":0,"explain":"Câu hỏi: từ để hỏi + **will** + chủ ngữ + V nguyên mẫu. Không thêm -s sau will, và phải đảo will lên trước chủ ngữ.","src":"tự soạn"},{"type":"mcq","q":"**shan't** là dạng rút gọn của:","options":["shall not","should not","shall it"],"answer":0,"explain":"**shan't = shall not** (giống won't = will not). Shall chỉ dùng với I/we: We shan't be long.","src":"tự soạn"},{"type":"mcq","q":"A: The alarm's going. It's making an awful noise.\nB: OK, ___ it off.","options":["I'll switch","I'm going to switch","I'm switching"],"answer":0,"explain":"B quyết định **ngay lúc nghe** A nói → **will**. Going to và hiện tại tiếp diễn dành cho việc đã định, đã sắp xếp từ trước.","src":"tr. 301"},{"type":"fill","q":"Don't worry. You ___ (pass) the exam – you've studied so hard.","answer":["will pass","'ll pass","are going to pass","'re going to pass"],"explain":"Dự đoán về tương lai cần dạng tương lai: **will pass** (ý kiến, niềm tin của người nói). *are going to pass* cũng chấp nhận vì có căn cứ 'bạn học chăm thế'. Sai hay gặp: *You pass* (thiếu will).","src":"tự soạn"},{"type":"mcq","q":"**Năm sau em trai tôi sẽ 18 tuổi.**","options":["My brother will be 18 next year.","My brother will have 18 years next year.","My brother will 18 next year."],"answer":0,"explain":"Tuổi tác trong tương lai là sự việc chắc chắn → **will be** + tuổi. Tiếng Anh nói tuổi bằng **be**, không dùng have; và sau will phải có động từ.","src":"tự soạn"},{"type":"mcq","q":"Bạn mời bạn mình: **Cậu ở lại ăn tối với nhà mình nhé?**","options":["Will you stay for dinner?","Shall you stay for dinner?","Do you stay for dinner?"],"answer":0,"explain":"Lời mời → **Will you…?** Shall chỉ đi với I/we; *Do you stay…?* là hỏi thói quen.","src":"tự soạn"},{"type":"fix","wrong":"Shall you help me with these boxes, please?","answer":["Will you help me with these boxes, please?"],"explain":"Nhờ người khác giúp → **Will you…?** Shall chỉ dùng với **I/we** (Shall I…? Shall we…?).","src":"tự soạn"},{"type":"classify","q":"Mỗi câu dùng will để làm gì?","buckets":["Dự đoán / việc chắc chắn","Hứa / đe dọa","Quyết định tức thì","Nhờ / mời"],"items":[{"text":"I'll be 30 next June.","bucket":0},{"text":"I think Vietnam will win the cup.","bucket":0},{"text":"I'll pay you back on Monday, I promise.","bucket":1},{"text":"Touch my bike again and you'll be sorry!","bucket":1},{"text":"The tea's cold. ~ Oh, I'll make some more.","bucket":2},{"text":"Which one do you want? ~ I'll have the red one.","bucket":2},{"text":"Will you pass me the salt, please?","bucket":3},{"text":"Will you join us for lunch?","bucket":3}],"explain":"Tuổi tác, I think… → dự đoán / việc chắc chắn. I promise, câu dọa → hứa, đe dọa. Vừa nghe xong mới quyết (Oh…, Which one?) → quyết định tức thì. *Will you…?* → nhờ hoặc mời.","src":"tự soạn"},{"type":"fill","q":"___ we meet at the café at five? ~ Good idea! (will hay shall?)","answer":["Shall"],"explain":"Gợi ý, rủ cùng làm → **Shall we…?** *Will we meet…?* chỉ hỏi xem việc đó có xảy ra không, không phải lời rủ.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","think","it","will","be","sunny","tomorrow."],"answer":["I think it will be sunny tomorrow.","I think tomorrow it will be sunny."],"explain":"I think + dự đoán → **will** + V nguyên mẫu (be).","src":"tự soạn"},{"type":"mcq","q":"Câu phủ định nào đúng?","options":["Hoa isn't going to take the exam.","Hoa doesn't going to take the exam.","Hoa isn't going to takes the exam."],"answer":0,"explain":"Phủ định be going to: thêm **not** sau be (is not = isn't). Không mượn doesn't; sau going to là V nguyên mẫu.","src":"tự soạn"},{"type":"fill","q":"Look at that car! It's going much too fast. It ___ (crash)!","answer":["is going to crash","'s going to crash"],"explain":"Thấy **dấu hiệu ngay trước mắt** (xe chạy quá nhanh), việc sắp xảy ra gần như chắc chắn → **be going to**, không dùng will.","src":"tự soạn"},{"type":"mcq","q":"That dog doesn't look friendly, and it's coming towards us. It ___ us!","options":["is going to attack","will attack","attacks"],"answer":0,"explain":"Con chó đang lao về phía mình: **dấu hiệu trước mắt**, sắp xảy ra → **be going to**. Will chỉ là dự đoán theo ý kiến.","src":"tr. 298"},{"type":"mcq","q":"A: Why are you working so hard these days?\nB: Because ___ a car, so I'm saving as much as I can.","options":["I'm going to buy","I'll buy","I buy"],"answer":0,"explain":"Mua xe là **dự định có sẵn** (đã đang để dành tiền) → **be going to**. Will chỉ cho quyết định vừa nảy ra.","src":"tr. 299"},{"type":"mcq","q":"Caller: Hello. Can I speak to Jim, please?\nYou: Just a moment. I ___ him.","options":["'ll get","'m going to get","get"],"answer":0,"explain":"Nghe người gọi hỏi mới quyết đi gọi Jim → **quyết định tức thì** → **will**.","src":"tr. 298"},{"type":"classify","q":"Tình huống nào dùng will, tình huống nào dùng be going to?","buckets":["will","be going to"],"items":[{"text":"Thấy bạn không có ô: 'Để tớ cho mượn.'","bucket":0},{"text":"Đã quyết từ năm ngoái: 'Tôi sẽ bỏ thuốc lá.'","bucket":1},{"text":"Thấy xe chở hàng nghiêng hẳn: 'Nó sắp đổ!'","bucket":1},{"text":"Đoán mò: 'Chắc mai trời đẹp.'","bucket":0},{"text":"Hứa với sếp: 'Tôi sẽ gửi báo cáo trước 5 giờ.'","bucket":0},{"text":"Còn 2 phút, cách ga 3 km: 'Mình sắp lỡ tàu rồi.'","bucket":1}],"explain":"Ngỏ ý ngay, đoán theo cảm nghĩ, lời hứa → **will**. Dự định có từ trước, dấu hiệu trước mắt (xe nghiêng, không kịp giờ) → **be going to**.","src":"tự soạn"},{"type":"fix","wrong":"I bought all these eggs because I will make a cake for Mai's birthday.","answer":["I bought all these eggs because I'm going to make a cake for Mai's birthday.","I bought all these eggs because I am going to make a cake for Mai's birthday.","I bought all these eggs because I'm making a cake for Mai's birthday.","I bought all these eggs because I am making a cake for Mai's birthday."],"explain":"Đã mua trứng sẵn → làm bánh là **dự định có từ trước** → **be going to** (hoặc hiện tại tiếp diễn). Will chỉ dùng cho quyết định vừa nảy ra lúc nói.","src":"tự soạn"},{"type":"mcq","q":"Theo sách, câu nào tự nhiên hơn?","options":["My uncle is coming to stay with us next week.","My uncle is going to come to stay with us next week."],"answer":0,"explain":"Sách lưu ý: be going to **thường không dùng với go và come**; nói kế hoạch đi/đến thì dùng **hiện tại tiếp diễn**: is coming.","src":"tr. 282"},{"type":"mcq","q":"A: ___ a party next Saturday. Can you come?\nB: Yes, of course.","options":["We're having","We'll have","We have"],"answer":0,"explain":"Bữa tiệc đã lên kế hoạch, đã mời khách → **sắp xếp cá nhân** → **hiện tại tiếp diễn**. Will là quyết định tức thì; hiện tại đơn dành cho thời gian biểu chung.","src":"tr. 300"},{"type":"fill","q":"According to the timetable, the next ferry ___ (depart) at 3.15 this afternoon.","answer":["departs"],"explain":"Theo **thời gian biểu** → **hiện tại đơn**; the ferry là ngôi thứ ba số ít → departs.","src":"tự soạn"},{"type":"mcq","q":"A: Excuse me. What time ___ to Hai Phong?\nB: At half past seven in the morning.","options":["does this train get","will this train get","is this train going to get"],"answer":0,"explain":"Hỏi giờ tàu đến → **thời gian biểu** → hiện tại đơn: What time **does** this train **get**…?","src":"tr. 300"},{"type":"mcq","q":"A: You look nice! Where ___ tonight?\nB: To Lan's birthday party.","options":["are you going","do you go","will you go"],"answer":0,"explain":"Kế hoạch đã có cho tối nay, và động từ là **go** → **hiện tại tiếp diễn**: are you going. *do you go* hỏi thói quen; will không dùng cho việc đã định sẵn.","src":"tự soạn"},{"type":"fill","q":"Turn off the stove! The milk ___ (be about to / boil) over.","answer":["is about to boil","'s about to boil","is just about to boil","'s just about to boil"],"explain":"Việc **sắp xảy ra ngay** → **be about to + V nguyên mẫu**: is about to boil. Đừng quên **is** và **to**.","src":"tự soạn"},{"type":"fill","q":"Bản tin: The famous singer ___ (be to / perform) in Ho Chi Minh City next month.","answer":["is to perform"],"explain":"Kế hoạch chính thức, văn phong bản tin → **be to + V nguyên mẫu**: is to perform.","src":"tự soạn"},{"type":"mcq","q":"**Minh was to fly to Singapore on Monday, but he got ill.** Câu này nghĩa là:","options":["Minh đã định (theo kế hoạch) bay đi Singapore hôm thứ Hai, nhưng bị ốm.","Minh sắp sửa bay đi Singapore thì bị ốm ngay trên máy bay.","Minh đã bay đi Singapore hôm thứ Hai rồi mới bị ốm."],"answer":0,"explain":"**was to + V** = đã định, theo kế hoạch sẽ làm (nhưng thường là không thành). 'Sắp sửa ngay lúc đó' là *was about to*.","src":"tự soạn"},{"type":"fix","wrong":"We play badminton with Nam at five tomorrow afternoon.","answer":["We're playing badminton with Nam at five tomorrow afternoon.","We are playing badminton with Nam at five tomorrow afternoon.","We're going to play badminton with Nam at five tomorrow afternoon.","We are going to play badminton with Nam at five tomorrow afternoon.","We'll be playing badminton with Nam at five tomorrow afternoon.","We will be playing badminton with Nam at five tomorrow afternoon."],"explain":"Đã hẹn với người khác, có giờ cụ thể → **hiện tại tiếp diễn**: We're playing (be going to, will be playing cũng được). Hiện tại đơn chỉ dùng cho thời gian biểu chung, không cho lịch hẹn cá nhân.","src":"tự soạn"},{"type":"fix","wrong":"Mai is come to my house for dinner tonight.","answer":["Mai is coming to my house for dinner tonight.","Mai's coming to my house for dinner tonight."],"explain":"Kế hoạch đã sắp xếp, động từ **come** → hiện tại tiếp diễn: is **coming** (am/is/are + V-ing, không phải is + V nguyên mẫu).","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["My","sister","is","about","to","leave","for","work."],"explain":"Việc sắp xảy ra ngay → **be about to + V nguyên mẫu**: is about to leave.","src":"tự soạn"},{"type":"mcq","q":"Chọn câu đúng:","options":["This time on Sunday we'll be climbing Fansipan.","This time on Sunday we'll climbing Fansipan.","This time on Sunday we'll be climb Fansipan."],"answer":0,"explain":"Tương lai tiếp diễn: will + **be** + **V-ing** → we'll be climbing. Thiếu be hoặc thiếu -ing đều sai.","src":"tự soạn"},{"type":"fill","q":"Please don't phone me at 9 tomorrow morning. I ___ (take) my driving test then.","answer":["will be taking","'ll be taking","shall be taking"],"explain":"Sẽ **đang** làm gì tại một thời điểm tương lai (9 giờ sáng mai) → **will be + V-ing**.","src":"tự soạn"},{"type":"mcq","q":"**Khi khách tới, chúng tôi sẽ đang ăn tối** (đã ăn từ trước, khách tới thì vẫn đang ăn).","options":["When the guests arrive, we'll be having dinner.","When the guests arrive, we'll have dinner.","When the guests will arrive, we'll be having dinner."],"answer":0,"explain":"Hành động nền đang diễn ra → **will be having**. *we'll have dinner* nghĩa là khách tới rồi mới bắt đầu ăn. Sau when dùng hiện tại đơn (arrive), không dùng will.","src":"tự soạn"},{"type":"fix","wrong":"What time will you arriving at the airport tomorrow?","answer":["What time will you be arriving at the airport tomorrow?"],"explain":"Hỏi lịch sự về kế hoạch → **will you be + V-ing**. Thiếu be: phải là will you **be** arriving.","src":"tự soạn"},{"type":"mcq","q":"**Mình chắc là bạn sẽ thích bộ phim này.**","options":["I'm sure you'll like the film.","I'm sure you'll be liking the film."],"answer":0,"explain":"**like** là động từ chỉ cảm xúc, trạng thái → không chia tiếp diễn; dùng **tương lai đơn**: you'll like.","src":"tự soạn"},{"type":"fix","wrong":"Next week I'll be being on holiday in Phu Quoc.","answer":["Next week I'll be on holiday in Phu Quoc.","Next week I will be on holiday in Phu Quoc."],"explain":"Không dùng tương lai tiếp diễn với **be** → dùng tương lai đơn: I'll **be** on holiday.","src":"tự soạn"},{"type":"fill","q":"___ (you / use) the printer this morning? I need to print some photos. (hỏi lịch sự bằng tương lai tiếp diễn)","answer":["Will you be using"],"explain":"Hỏi lịch sự về kế hoạch của người khác → **Will you be + V-ing…?** Câu hỏi nhẹ nhàng, chỉ hỏi kế hoạch chứ không nhờ vả trực tiếp.","src":"tự soạn"},{"type":"mcq","q":"A: Can I borrow your bike on Monday?\nB: I'm sorry, but ___ it. I always cycle to work.","options":["I'll be using","I'll have used"],"answer":0,"explain":"Thứ Hai B **sẽ đang dùng** xe (theo lịch quen thuộc) → **will be + V-ing**. *I'll have used* là 'sẽ dùng xong', không hợp nghĩa.","src":"tr. 303"},{"type":"mcq","q":"Tomorrow afternoon we're going to play tennis from 3 o'clock until 4.30. So at 4 o'clock we ___ tennis.","options":["will be playing","will have played","play"],"answer":0,"explain":"4 giờ nằm **giữa** quãng 3:00–4:30 → lúc đó **đang** chơi → **will be playing**. *will have played* là đã chơi xong, mà lúc 4 giờ trận còn chưa kết thúc.","src":"tr. 302"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["At","nine","tonight","we'll","be","watching","the","final."],"answer":["At nine tonight we'll be watching the final.","We'll be watching the final at nine tonight."],"explain":"Sẽ đang làm gì tại một thời điểm tương lai → **will be + V-ing**: we'll be watching.","src":"tự soạn"},{"type":"mcq","q":"By the time you get up tomorrow, I ___ for Hanoi.","options":["will have left","will has left","will have leave"],"answer":0,"explain":"Xong **trước** một mốc tương lai → **will have + V3**: leave – left – **left**. Sau will luôn là have, không phải has.","src":"tự soạn"},{"type":"fill","q":"A: Will you be free at 11.30?\nB: Yes. The meeting ___ (finish) by that time.","answer":["will have finished","'ll have finished"],"explain":"Cuộc họp sẽ xong **trước** mốc 11.30 (by that time) → **tương lai hoàn thành**: will have finished.","src":"tr. 302"},{"type":"mcq","q":"**Đến 6 giờ chiều, Nam sẽ đá bóng liên tục được 3 tiếng.**","options":["By 6 p.m. Nam will have been playing football for three hours.","By 6 p.m. Nam will be playing football for three hours.","By 6 p.m. Nam will have been play football for three hours."],"answer":0,"explain":"Nhấn mạnh việc **kéo dài liên tục** đến một mốc (by 6 p.m. + for three hours) → **will have been + V-ing**. *will be playing* không nói được 'đã được 3 tiếng'; sau have been phải là V-ing.","src":"tự soạn"},{"type":"fill","q":"There's too much to do. We ___ (not / finish) painting the house by the weekend.","answer":["won't have finished","will not have finished"],"explain":"Sẽ **chưa** xong trước một mốc (by the weekend) → **won't have + V3**: won't have finished.","src":"tự soạn"},{"type":"mcq","q":"A: It's quite a long way, isn't it?\nB: Yes. ___ about five miles by the time we get back.","options":["We'll have walked","We'll be walking"],"answer":0,"explain":"Nói **kết quả** (5 dặm) tính đến mốc 'lúc về tới' → **will have + V3**. Tương lai tiếp diễn chỉ nói 'lúc đó đang đi'.","src":"tr. 303"},{"type":"fix","wrong":"I hope the builders will have finish the kitchen by Christmas.","answer":["I hope the builders will have finished the kitchen by Christmas."],"explain":"Tương lai hoàn thành: will have + **V3** → will have **finished** (thêm -ed).","src":"tự soạn"},{"type":"classify","q":"Mỗi câu nhấn mạnh điều gì?","buckets":["Hoàn tất, kết quả (will have V3)","Kéo dài liên tục (will have been V-ing)"],"items":[{"text":"By lunchtime I'll have answered all my emails.","bucket":0},{"text":"By Friday the workers will have been digging the road for three days.","bucket":1},{"text":"By the end of the course we'll have learned 2,000 new words.","bucket":0},{"text":"Next month she'll have been running the shop for ten years.","bucket":1},{"text":"By Monday they'll have sold every ticket.","bucket":0},{"text":"When the bus comes, we'll have been standing in the rain for 40 minutes.","bucket":1}],"explain":"Có kết quả đếm được (all my emails, 2,000 words, every ticket) → **will have V3**. Có độ dài thời gian và muốn nói 'liên tục suốt' (for three days, ten years, 40 minutes) → **will have been V-ing**.","src":"tự soạn"},{"type":"mcq","q":"Mai's eyes will be red tonight because she ___ at a computer screen all day.","options":["will have been staring","will be staring","stares"],"answer":0,"explain":"Việc kéo dài liên tục **trước** một việc khác ở tương lai, nói **nguyên nhân – kết quả** (mắt đỏ vì nhìn màn hình cả ngày) → **will have been + V-ing**. *will be staring* là tối nay vẫn đang nhìn, không giải thích được kết quả.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["By","June","I","will","have","saved","enough","money."],"answer":["By June I will have saved enough money.","I will have saved enough money by June."],"explain":"Xong trước một mốc tương lai (by June) → **will have + V3**: will have saved.","src":"tự soạn"},{"type":"fill","q":"Please wait here until I ___ (come) back.","answer":["come"],"explain":"Sau **until** (mệnh đề chỉ thời gian) không dùng will mà dùng **hiện tại đơn**: until I come back. Chủ đề 05 sẽ học kỹ.","src":"tự soạn"},{"type":"classify","q":"Mỗi tình huống dùng cách nói tương lai nào?","buckets":["will","be going to","HT tiếp diễn (đã sắp xếp)","HT đơn (thời gian biểu)"],"items":[{"text":"Thấy trời đổ mưa, quyết luôn: 'Thôi, tôi sẽ đi taxi.'","bucket":0},{"text":"Đoán theo cảm nghĩ: 'Tôi đoán anh ấy sẽ đến muộn.'","bucket":0},{"text":"Đã quyết, chưa chọn ngày: 'Tôi định sơn lại phòng.'","bucket":1},{"text":"Thấy xe đạp mất phanh lao xuống dốc: 'Nó sắp đâm vào tường!'","bucket":1},{"text":"Đã hẹn cắt tóc lúc 4 giờ chiều thứ Bảy.","bucket":2},{"text":"Đã đặt vé, tối thứ Sáu đi xem ca nhạc với bạn.","bucket":2},{"text":"Lịch tàu: tàu chạy lúc 19 giờ tối mai.","bucket":3},{"text":"Lịch khai giảng: học kỳ bắt đầu ngày 5 tháng 9.","bucket":3}],"explain":"Quyết ngay, đoán theo cảm nghĩ → will. Dự định chưa sắp xếp, dấu hiệu trước mắt → be going to. Đã hẹn, đã đặt vé → hiện tại tiếp diễn. Lịch tàu, lịch khai giảng → hiện tại đơn.","src":"tự soạn"},{"type":"mcq","q":"Câu nào nói việc **sẽ xong trước 8 giờ tối**?","options":["I'll have done my homework by 8 p.m.","I'll be doing my homework at 8 p.m.","I'm doing my homework at 8 p.m.","I'm going to do my homework at 8 p.m."],"answer":0,"explain":"Xong **trước** một mốc (by 8 p.m.) → **will have + V3**. Ba câu kia đều nói lúc 8 giờ mới **đang làm** hoặc **định làm**.","src":"tự soạn"}]]}},{"id":"04-chinh-ta-phat-am","title":"Chính tả và phát âm đuôi -s, -ed, -ing","en":"Spelling and pronunciation of endings","icon":"🔤","pages":"284–286","summary":"Chủ đề này giúp bạn viết và đọc đúng phần đuôi của động từ. Bài 1: thêm -ing và -ed đúng chính tả (bỏ e, gấp đôi phụ âm cuối, đổi y thành i, hay chỉ thêm thẳng). Bài 2: đọc đúng đuôi -ed (/d/, /t/, /ɪd/) và đuôi -s/-es (/s/, /z/, /ɪz/) bằng cách nhìn âm cuối của từ: hữu thanh hay vô thanh, có phải âm xuýt không.","mindmap":{"label":"Đuôi động từ","children":[{"label":"Chính tả -ing / -ed","icon":"✍️","children":[{"label":"Tận cùng e: hoped, taking"},{"label":"ee giữ, ie → y: seeing, dying"},{"label":"Gấp đôi: stopped, preferring"},{"label":"Không gấp đôi y, w, x: played, fixed"},{"label":"Phụ âm + y: studied, studying"},{"label":"Thêm thẳng: worked, visited"}]},{"label":"Phát âm -ed","icon":"🗣️","children":[{"label":"/ɪd/ sau /t/, /d/: wanted"},{"label":"/t/ sau âm vô thanh: worked"},{"label":"/d/ sau hữu thanh, nguyên âm: lived"}]},{"label":"Phát âm -s / -es","icon":"🐝","children":[{"label":"/ɪz/ sau âm xuýt: watches"},{"label":"/s/ sau /t/, /p/, /k/: stops"},{"label":"/z/ sau hữu thanh, nguyên âm: knows"}]},{"label":"Mẹo","icon":"✋","children":[{"label":"Tay lên cổ: rung = hữu thanh"},{"label":"Xét âm cuối, không xét chữ cuối"}]}]},"lessons":[{"id":"04a","title":"Thêm -ing và -ed đúng chính tả","minutes":25,"goal":"Viết đúng dạng V-ing và V-ed của động từ có quy tắc: khi nào bỏ e, khi nào gấp đôi phụ âm cuối, khi nào đổi y thành i, và khi nào chỉ cần thêm thẳng.","pretest":[{"type":"mcq","q":"make → V-ing?","options":["making","makeing","makking"],"answer":0,"explain":"make tận cùng bằng e → bỏ e rồi thêm -ing: **making**.","src":"tr. 284"},{"type":"mcq","q":"stop → V-ed?","options":["stopped","stoped","stopt"],"answer":0,"explain":"stop: 1 âm tiết, tận cùng 1 nguyên âm (o) + 1 phụ âm (p) → gấp đôi p: **stopped**.","src":"tr. 285"},{"type":"mcq","q":"study → V-ed?","options":["studied","studyed","studdied"],"answer":0,"explain":"study tận cùng phụ âm (d) + y → đổi y thành i rồi thêm -ed: **studied**.","src":"tr. 285"}],"hook":{"icon":"✍️","text":"Ở các chủ đề trước bạn đã gặp rất nhiều **V-ing** (đang làm) và **V-ed** (đã làm): *working, worked, playing, played*. Phần lớn chỉ cần thêm đuôi. Nhưng có những từ 'đổi mặt' khi thêm đuôi: *make* thành **making** (mất e), *stop* thành **stopped** (thêm một chữ p), *study* thành **studied** (y thành i). Tiếng Việt không bao giờ đổi chữ của từ, nên đây là chỗ người Việt hay viết sai. Tin vui: sách chỉ có 4 nhóm quy tắc, và một sơ đồ là đủ."},"diagram":{"type":"flow","title":"Thêm -ing / -ed thế nào?","start":{"q":"Động từ tận cùng bằng gì?","branches":[{"label":"Chữ e","to":{"result":"-ed: thêm -d (hoped) · -ing: bỏ e (taking), ee giữ (seeing), ie → y (dying)","icon":"✂️"}},{"label":"Phụ âm + y","to":{"result":"-ed: y → i (studied) · -ing: giữ y (trying)","icon":"🔄"}},{"label":"1 nguyên âm + 1 phụ âm","to":{"q":"Phụ âm cuối là y, w hoặc x?","branches":[{"label":"Có","to":{"result":"thêm thẳng: play → played, fix → fixing","icon":"➕"}},{"label":"Không","to":{"q":"Từ 1 âm tiết, hoặc nhấn âm cuối?","branches":[{"label":"Có","to":{"result":"gấp đôi: stop → stopped, prefer → preferring","icon":"✌️"}},{"label":"Không, nhấn âm đầu","to":{"result":"thêm thẳng: visit → visited","icon":"➕"}}]}}]}},{"label":"2 phụ âm / 2 nguyên âm + phụ âm","to":{"result":"thêm thẳng: work → worked, rain → raining","icon":"➕"}}]}},"chunks":[{"title":"Tận cùng bằng e","icon":"✂️","rule":"Tận cùng **e**: thêm **-d** để có -ed; **bỏ e** rồi thêm -ing. Riêng **ee** giữ nguyên, còn **ie** đổi thành **y** trước -ing.","explain":"Chữ e cuối thường là e câm (không đọc). Thêm -ed thì từ đã có sẵn e, nên chỉ thêm d: hope → hoped (không viết hopeed). Thêm -ing thì bỏ e: take → taking, drive → driving.\nHai trường hợp đặc biệt khi thêm -ing: **ee** giữ nguyên (see → seeing, agree → agreeing); **ie** đổi thành **y** (die → dying, lie → lying). Với -ed, die vẫn chỉ thêm d: died.","formula":"hope → hoped · decide → decided · die → died\ntake → taking · drive → driving\nsee → seeing · agree → agreeing\ndie → dying · lie → lying","examples":[{"en":"We **hoped** for good weather.","vi":"Chúng tôi đã mong trời đẹp."},{"en":"She is **taking** a shower.","vi":"Cô ấy đang tắm."},{"en":"I'm **seeing** the doctor tomorrow.","vi":"Ngày mai tôi có hẹn gặp bác sĩ."},{"en":"The plant is **dying**.","vi":"Cái cây đang chết dần."},{"en":"He is writeing an email.","ok":false,"note":"write → writing (bỏ e)"}],"mistake":{"wrong":"I'm comeing now!","right":"I'm coming now!","why":"come tận cùng bằng e → bỏ e rồi thêm -ing: coming."},"tip":"e câm 'nhường chỗ' cho -ing; ee thì ở lại; ie thì hóa y.","src":"tr. 284–285","check":{"type":"fill","q":"Look! The children are ___ in the garden. (dance)","answer":["dancing"],"explain":"dance tận cùng bằng e → bỏ e: **dancing**.","src":"tự soạn"}},{"title":"Gấp đôi phụ âm cuối","icon":"✌️","rule":"Động từ **1 âm tiết**, hoặc **2 âm tiết nhấn âm cuối**, tận cùng bằng **1 nguyên âm + 1 phụ âm** → **gấp đôi** phụ âm cuối rồi thêm -ed / -ing.","explain":"Nguyên âm (vowel) là các chữ a, e, i, o, u; các chữ còn lại là phụ âm (consonant). Âm tiết (syllable) là một 'tiếng' khi đọc: stop có 1 tiếng, pre-fer có 2 tiếng.\nstop kết thúc bằng 1 nguyên âm (o) + 1 phụ âm (p) → stopped, stopping. Với từ 2 âm tiết, chỉ gấp đôi khi **trọng âm** (stress: tiếng được đọc mạnh) rơi vào tiếng cuối: pre-**FER** → preferred, con-**TROL** → controlled. Từ điển đánh dấu trọng âm bằng dấu ˈ trước tiếng đọc mạnh.\nNgoại lệ trong sách: **không gấp đôi y, w, x**: play → played, playing; plow (cày) → plowed, plowing; fix → fixed, fixing.","formula":"stop → stopped, stopping\nplan → planned, planning\nprefer → preferred, preferring\ncontrol → controlled, controlling\nNhưng: play → played · plow → plowing · fix → fixed","examples":[{"en":"The bus **stopped** at the corner.","vi":"Xe buýt đã dừng ở góc phố."},{"en":"We are **planning** a trip to Da Lat.","vi":"Chúng tôi đang lên kế hoạch đi Đà Lạt."},{"en":"She **preferred** the blue dress.","vi":"Cô ấy thích chiếc váy xanh hơn."},{"en":"He is **fixing** his bike.","vi":"Anh ấy đang sửa xe đạp."},{"en":"He is runing in the park.","ok":false,"note":"run → running (gấp đôi n)"}],"mistake":{"wrong":"The children are swiming.","right":"The children are swimming.","why":"swim: 1 âm tiết, 1 nguyên âm (i) + 1 phụ âm (m) → gấp đôi m."},"tip":"Nhìn 3 chữ cuối: phụ âm – nguyên âm – phụ âm (s-**top**, **run**) và tiếng cuối được đọc mạnh → gấp đôi. Gặp y, w, x ở cuối thì thôi.","src":"tr. 285","check":{"type":"mcq","q":"plan → V-ing?","options":["planning","planing","planeing"],"answer":0,"explain":"plan: 1 âm tiết, 1 nguyên âm (a) + 1 phụ âm (n) → gấp đôi n: **planning**.","src":"tr. 285"}},{"title":"Chỉ cần thêm thẳng","icon":"➕","rule":"Tận cùng **2 phụ âm**, hoặc **2 nguyên âm + 1 phụ âm**, hoặc từ 2 âm tiết **nhấn âm đầu** → chỉ việc thêm **-ed / -ing**, không đổi gì.","explain":"Đây là nhóm đông nhất. work có 2 phụ âm cuối (r, k) → worked, working. rain có 2 nguyên âm (a, i) trước n → rained, raining. visit, open đọc mạnh ở tiếng đầu (**VIS**-it, **O**-pen) → visited, opening.\nĐừng gấp đôi 'cho chắc': *rainned, visitted, openning* đều sai. Gấp đôi là trường hợp riêng, không phải mặc định.","formula":"work → worked, working\nrain → rained, raining\nvisit → visited, visiting\nopen → opened, opening","examples":[{"en":"I **worked** late last night.","vi":"Tối qua tôi làm việc muộn."},{"en":"It was **raining** when I left home.","vi":"Trời đang mưa khi tôi ra khỏi nhà."},{"en":"We **visited** our grandparents last weekend.","vi":"Cuối tuần trước chúng tôi đi thăm ông bà."},{"en":"She is openning the door.","ok":false,"note":"open nhấn âm đầu → opening"}],"mistake":{"wrong":"We waitted for an hour.","right":"We waited for an hour.","why":"wait có 2 nguyên âm (a, i) trước t → không gấp đôi."},"tip":"Không đủ điều kiện gấp đôi thì cứ thêm thẳng.","src":"tr. 285"},{"title":"Tận cùng bằng y","icon":"🔄","rule":"**Phụ âm + y**: đổi **y → i** rồi thêm **-ed**, nhưng **giữ y** khi thêm -ing. **Nguyên âm + y**: thêm thẳng.","explain":"study (d + y) → studied, nhưng studying (nếu đổi y thì thành 'studiing' với hai chữ i liền nhau). Còn play, enjoy có nguyên âm trước y → played, enjoyed, playing, enjoying.\nQuy tắc này giống cách thêm -s/-es ở thì hiện tại đơn (chủ đề 1, tr. 255–256): study → studies, try → tries, nhưng stay → stays, enjoy → enjoys. Nhắc lại: động từ tận cùng **o, s, x, z, ch, sh** thì thêm **-es**: go → goes, watch → watches, fix → fixes.","formula":"phụ âm + y: study → studies → studied → studying\nnguyên âm + y: play → plays → played → playing","examples":[{"en":"She **studied** English at university.","vi":"Cô ấy đã học tiếng Anh ở đại học."},{"en":"He **hurried** to the station.","vi":"Anh ấy vội vã ra ga."},{"en":"I'm **trying** to sleep.","vi":"Tôi đang cố ngủ."},{"en":"We **enjoyed** the party.","vi":"Chúng tôi rất vui ở bữa tiệc."},{"en":"They playied football.","ok":false,"note":"nguyên âm + y → played"},{"en":"She is studing for the exam.","ok":false,"note":"giữ y trước -ing: studying"}],"mistake":{"wrong":"He carryed the box upstairs.","right":"He carried the box upstairs.","why":"carry: phụ âm r + y → đổi y thành i trước -ed."},"tip":"-ed 'ăn' mất y (sau phụ âm), -ing thì không: studied nhưng studying.","src":"tr. 285; 255–256","check":{"type":"fill","q":"Have you ___ to his message yet? (reply)","answer":["replied"],"explain":"reply: phụ âm l + y → đổi y thành i rồi thêm -ed: **replied**.","src":"tự soạn"}}],"practice":[{"type":"classify","q":"Khi thêm -ing, mỗi động từ thay đổi thế nào?","buckets":["Bỏ e","Gấp đôi phụ âm cuối","Thêm thẳng"],"items":[{"text":"write","bucket":0},{"text":"make","bucket":0},{"text":"sit","bucket":1},{"text":"shop","bucket":1},{"text":"begin (be-GIN)","bucket":1},{"text":"see","bucket":2},{"text":"visit (VIS-it)","bucket":2},{"text":"play","bucket":2}],"explain":"writing, making (bỏ e); sitting, shopping, beginning (1 nguyên âm + 1 phụ âm, 1 âm tiết hoặc nhấn âm cuối → gấp đôi); seeing (ee giữ nguyên), visiting (nhấn âm đầu), playing (không gấp đôi y).","src":"tr. 284–285"},{"type":"classify","q":"Khi thêm -ed, mỗi động từ thay đổi thế nào?","buckets":["Đổi y → i","Gấp đôi phụ âm cuối","Chỉ thêm -d","Thêm -ed"],"items":[{"text":"cry","bucket":0},{"text":"drop","bucket":1},{"text":"plan","bucket":1},{"text":"smile","bucket":2},{"text":"die","bucket":2},{"text":"stay","bucket":3},{"text":"fix","bucket":3},{"text":"rain","bucket":3}],"explain":"cried (phụ âm + y → i); dropped, planned (gấp đôi); smiled, died (tận cùng e → chỉ thêm d); stayed (nguyên âm + y), fixed (không gấp đôi x), rained (2 nguyên âm a, i) → thêm thẳng -ed.","src":"tr. 284–285"},{"type":"mcq","q":"lie (nói dối) → V-ing?","options":["lying","lieing","liing"],"answer":0,"explain":"Tận cùng **ie** → đổi ie thành y rồi thêm -ing: **lying** (giống die → dying).","src":"tr. 285"},{"type":"mcq","q":"Câu nào viết đúng chính tả?","options":["She is writing a letter.","She is writting a letter.","She is writeing a letter."],"answer":0,"explain":"write tận cùng e → bỏ e: **writing**, chỉ một chữ t. Nhiều bạn viết *writting* vì nhớ nhầm sang *written*.","src":"tự soạn"},{"type":"fill","q":"Look! It's ___ again. (snow)","answer":["snowing"],"explain":"snow tận cùng bằng w → không gấp đôi: **snowing**.","src":"tự soạn"},{"type":"fill","q":"I ___ my keys on the floor a minute ago. (drop)","answer":["dropped"],"explain":"drop: 1 âm tiết, 1 nguyên âm (o) + 1 phụ âm (p) → gấp đôi p: **dropped**.","src":"tự soạn"},{"type":"fill","q":"We ___ the film very much. (enjoy)","answer":["enjoyed"],"explain":"enjoy: nguyên âm o + y → thêm thẳng: **enjoyed** (không đổi y thành i).","src":"tr. 285"},{"type":"fill","q":"In the end, I ___ the red one. (prefer, quá khứ)","answer":["preferred"],"hint":"prefer đọc nhấn âm cuối: pre-FER","explain":"prefer 2 âm tiết, nhấn âm cuối, tận cùng 1 nguyên âm (e) + 1 phụ âm (r) → gấp đôi r: **preferred**.","src":"tr. 285"},{"type":"fix","wrong":"They are siting in the garden.","answer":["They are sitting in the garden.","They're sitting in the garden."],"explain":"sit: 1 âm tiết, 1 nguyên âm (i) + 1 phụ âm (t) → gấp đôi t: **sitting**.","src":"tự soạn"},{"type":"fix","wrong":"She studyed hard for the exam.","answer":["She studied hard for the exam."],"explain":"study: phụ âm d + y → đổi y thành i rồi thêm -ed: **studied**.","src":"tự soạn"},{"type":"fix","wrong":"We are visitting our aunt this weekend.","answer":["We are visiting our aunt this weekend.","We're visiting our aunt this weekend."],"explain":"visit nhấn âm đầu (**VIS**-it) → không gấp đôi: **visiting**.","src":"tự soạn"},{"type":"fill","q":"Họ đang lên kế hoạch cho đám cưới: They ___ their wedding. (plan)","answer":["are planning","'re planning"],"explain":"Hiện tại tiếp diễn: are + V-ing. plan gấp đôi n: **are planning**.","src":"tự soạn"}],"flashcards":[{"front":"make, write, come + -ing?","back":"Bỏ e: **making, writing, coming**"},{"front":"see, die + -ing?","back":"**ee** giữ nguyên: seeing · **ie → y**: dying, lying"},{"front":"Khi nào gấp đôi phụ âm cuối?","back":"Từ 1 âm tiết (hoặc 2 âm tiết nhấn âm cuối) tận cùng 1 nguyên âm + 1 phụ âm: **stopped, planning, preferred**. Không gấp đôi y, w, x: played, fixed."},{"front":"study → -ed? -ing?","back":"**studied** (y → i) nhưng **studying** (giữ y)"},{"front":"visit, open, rain + -ed?","back":"Thêm thẳng: **visited, opened, rained** (nhấn âm đầu / 2 nguyên âm)"}]},{"id":"04b","title":"Phát âm đuôi -ed và -s/-es","minutes":25,"goal":"Đọc đúng đuôi -ed (/d/, /t/, /ɪd/) và đuôi -s/-es (/s/, /z/, /ɪz/) bằng cách xét âm cuối của từ.","pretest":[{"type":"mcq","q":"Đuôi -ed trong **wanted** đọc thế nào?","options":["/ɪd/ (thêm một tiếng)","/t/","/d/"],"answer":0,"explain":"want có âm cuối /t/ → -ed đọc **/ɪd/**, thành 2 tiếng: want-ed.","src":"tr. 286"},{"type":"mcq","q":"Từ nào có đuôi -es đọc thành một tiếng riêng /ɪz/?","options":["watches","plays","works"],"answer":0,"explain":"watch có âm cuối /tʃ/ là âm xuýt → -es đọc **/ɪz/**: watches có 2 tiếng.","src":"tr. 286"},{"type":"mcq","q":"Đuôi -ed trong **worked** đọc thế nào?","options":["/t/","/d/","/ɪd/"],"answer":0,"explain":"work có âm cuối /k/ (vô thanh) → -ed đọc **/t/**: /wɜ:kt/, chỉ 1 tiếng.","src":"tr. 285"}],"hook":{"icon":"🗣️","text":"Bạn đã biết viết *worked, played, wanted*. Nhưng ba đuôi -ed này đọc **ba kiểu khác nhau**: worked kết thúc bằng /t/ nhẹ, played bằng /d/, còn wanted thì mọc thêm hẳn một tiếng /ɪd/. Đuôi -s/-es cũng vậy: *works* /s/, *plays* /z/, *watches* /ɪz/. Người Việt hay nuốt mất đuôi, hoặc đọc worked thành 'wơ-kịt' (thừa một tiếng). Bí quyết: đừng nhìn chữ cái cuối, hãy nghe **âm cuối** của từ, và đặt tay lên cổ họng."},"diagram":{"type":"flow","title":"Đuôi -ed đọc thế nào?","start":{"q":"Âm cuối của động từ là gì?","branches":[{"label":"/t/ hoặc /d/","to":{"result":"/ɪd/ (thêm 1 tiếng): wanted, decided","icon":"➕"}},{"label":"Âm vô thanh (cổ không rung)","to":{"result":"/t/: stopped, watched","icon":"🤫"}},{"label":"Âm hữu thanh hoặc nguyên âm","to":{"result":"/d/: lived, played","icon":"📳"}}]}},"chunks":[{"title":"Hữu thanh hay vô thanh? Chạm tay vào cổ","icon":"✋","rule":"Đặt tay lên cổ họng rồi phát âm: cổ **rung** là âm **hữu thanh** (voiced); cổ **không rung**, chỉ có hơi gió, là âm **vô thanh** (unvoiced).","explain":"Thử ngay: kéo dài 'sssss' (âm /s/, như tiếng rắn, gần chữ 'x' tiếng Việt) → cổ không rung. Kéo dài 'zzzzz' (âm /z/, như tiếng ong vo ve, gần chữ 'd' giọng Bắc trong 'da') → cổ rung. Hai âm cùng khẩu hình, chỉ khác có rung hay không.\nSách liệt kê: âm **vô thanh** /θ/, /p/, /f/, /s/, /ʃ/, /tʃ/, /k/, /t/. Âm **hữu thanh** /b/, /d/, /g/, /m/, /n/, /l/, /v/, /z/, /ð/, /ʒ/, /dʒ/, /ŋ/, và **mọi nguyên âm** (a, e, i, o, u).\nQuan trọng: xét **âm** cuối, không xét **chữ** cuối. *hope* tận cùng bằng chữ e (e câm) nhưng âm cuối là /p/; *laugh* tận cùng bằng chữ gh nhưng âm cuối là /f/.","diagram":{"type":"table","title":"Cặp âm: vô thanh – hữu thanh","head":["Vô thanh (không rung)","Hữu thanh (rung)","Nghe trong từ"],"rows":[["/p/","/b/","stop – rob"],["/t/","/d/","sit – hide"],["/k/","/g/","work – beg"],["/f/","/v/","laugh – live"],["/s/","/z/","kiss – use"],["/θ/","/ð/","thin – this (âm đầu)"],["/ʃ/","/ʒ/","wash – television"],["/tʃ/","/dʒ/","watch – change"]]},"examples":[{"en":"**stop, work, kiss, wash, watch, laugh**","vi":"Âm cuối vô thanh /p/, /k/, /s/, /ʃ/, /tʃ/, /f/: cổ không rung."},{"en":"**live, rob, call, play, see**","vi":"Âm cuối hữu thanh /v/, /b/, /l/ hoặc nguyên âm: cổ rung."},{"en":"**hope** /p/ · **use** /z/ · **laugh** /f/","vi":"Nhìn âm cuối, không nhìn chữ cuối."}],"mistake":{"wrong":"hope tận cùng bằng chữ e (nguyên âm) → hữu thanh","right":"hope có âm cuối /p/ → vô thanh","why":"Chữ e cuối là e câm, không đọc. Âm cuối thật là /p/."},"tip":"Rung = hữu thanh. Nguyên âm thì luôn rung.","src":"tr. 285–286","check":{"type":"mcq","q":"Âm cuối của **live** là /v/. Khi đọc /v/, cổ họng có rung không?","options":["Có → hữu thanh","Không → vô thanh"],"answer":0,"shuffle":false,"explain":"/v/ rung → **hữu thanh** (cặp với /f/ vô thanh).","src":"tr. 285"}},{"title":"Sau /t/, /d/: -ed đọc /ɪd/","icon":"➕","rule":"Động từ có âm cuối **/t/** hoặc **/d/** → đuôi -ed đọc **/ɪd/**, thêm hẳn **một tiếng**.","explain":"/ɪd/ đọc ngắn và nhẹ, gần như 'ịt' kết thúc bằng d. want (1 tiếng) → wanted (2 tiếng: want-ed); decide (2 tiếng) → decided (3 tiếng: de-ci-ded).\nVì sao? /t/ hay /d/ dính liền với một /d/ nữa thì không nghe ra, nên phải chèn thêm nguyên âm /ɪ/. Đây là trường hợp **duy nhất** -ed tạo thêm một tiếng. Lỗi rất phổ biến là đọc mọi -ed thành 'ịt': worked thành 'wơ-kịt' là sai.","formula":"âm cuối /t/, /d/ + ed → /ɪd/\nended /ˈendɪd/ · started /ˈstɑ:tɪd/\ndecided /dɪˈsaɪdɪd/ · invited /ɪnˈvaɪtɪd/","examples":[{"en":"The meeting **ended** at five.","vi":"Cuộc họp kết thúc lúc 5 giờ."},{"en":"We **decided** to stay at home.","vi":"Chúng tôi quyết định ở nhà."},{"en":"She **invited** me to her party.","vi":"Cô ấy mời tôi đến bữa tiệc của cô ấy."},{"en":"It **started** to rain.","vi":"Trời bắt đầu mưa."}],"mistake":{"wrong":"worked đọc /ˈwɜ:kɪd/ (2 tiếng)","right":"worked đọc /wɜ:kt/ (1 tiếng)","why":"Âm cuối của work là /k/, không phải /t/ hay /d/, nên không thêm tiếng."},"tip":"Chỉ hai âm **t** và **d** mới 'mọc thêm tiếng': want-ed, need-ed.","src":"tr. 285–286"},{"title":"Còn lại: -ed đọc /t/ hay /d/","icon":"📳","rule":"Âm cuối **vô thanh** (/θ/, /p/, /f/, /s/, /ʃ/, /tʃ/, /k/) → -ed đọc **/t/**; âm cuối **hữu thanh** hoặc **nguyên âm** → -ed đọc **/d/**.","explain":"Ở hai trường hợp này -ed **không** thêm tiếng: nó chỉ là một phụ âm nhẹ dính vào cuối từ. stopped /stɒpt/ vẫn là 1 tiếng.\n/t/ ở đây là t rất nhẹ, gần như chữ 't' cuối trong 'tốt' của tiếng Việt; /d/ là d nhẹ, không mở miệng thành 'đơ'.\nCách nhớ: âm cuối không rung thì đuôi cũng không rung (/t/); âm cuối rung thì đuôi cũng rung (/d/). Miệng không phải đổi chế độ.","formula":"vô thanh + ed → /t/: stopped /stɒpt/, passed /pɑ:st/, laughed /lɑ:ft/, worked /wɜ:kt/, watched /wɒtʃt/, finished /ˈfɪnɪʃt/\nhữu thanh / nguyên âm + ed → /d/: tried /traɪd/, lived /lɪvd/, used /ju:zd/, failed /feɪld/, clothed /kləʊðd/","examples":[{"en":"I **worked** until ten.","vi":"Tôi làm việc đến 10 giờ. (worked: /t/)"},{"en":"She **laughed** at my joke.","vi":"Cô ấy bật cười vì câu đùa của tôi. (laughed: /t/)"},{"en":"He **lived** in Hanoi for five years.","vi":"Anh ấy đã sống ở Hà Nội 5 năm. (lived: /d/)"},{"en":"We **tried** the new restaurant.","vi":"Chúng tôi đã ăn thử nhà hàng mới. (tried: /d/)"}],"mistake":{"wrong":"stopped đọc /ˈstɒpɪd/ ('xtóp-pịt')","right":"stopped đọc /stɒpt/ (1 tiếng)","why":"/p/ vô thanh → -ed chỉ là /t/ nhẹ, không thêm tiếng."},"tip":"Tay trên cổ: rung → /d/, không rung → /t/.","src":"tr. 285","check":{"type":"mcq","q":"Đuôi -ed trong **finished** đọc thế nào?","options":["/t/","/d/","/ɪd/"],"answer":0,"explain":"finish có âm cuối /ʃ/ (vô thanh) → **/t/**: /ˈfɪnɪʃt/. Không phải /ɪd/ vì âm cuối không phải /t/, /d/.","src":"tr. 285"}},{"title":"Đuôi -s/-es: /ɪz/, /s/, /z/","icon":"🐝","rule":"Sau **âm xuýt** (/s/, /z/, /ʃ/, /ʒ/, /tʃ/, /dʒ/) → **/ɪz/** (thêm một tiếng); sau **/t/, /p/, /k/** → **/s/**; sau âm **hữu thanh** và **nguyên âm** → **/z/**.","explain":"Cách nghĩ giống hệt -ed. Âm xuýt (sibilant sounds) là những âm nghe 'xì, xuỵt' như s, z, sh, ch, j. Thêm /s/ ngay sau chúng thì không nghe ra, nên phải chèn tiếng /ɪz/ (gần như 'ìz'): watches /ˈwɒtʃɪz/ có 2 tiếng.\nSau /t/, /p/, /k/ (vô thanh) → /s/, như chữ 'x' tiếng Việt: stops, sits, takes. Sau âm hữu thanh (/b/, /d/, /g/, /m/, /n/, /l/, /v/, /ð/, /ŋ/) và nguyên âm → /z/, âm rung như tiếng ong: knows, sings, robs.\nĐây chính là đuôi bạn thêm vào động từ ở thì hiện tại đơn. Sách cũng cho ví dụ danh từ (ropes, edges). Lưu ý ngoài sách: /f/, /θ/ cũng vô thanh nên sau chúng -s cũng đọc /s/ (laughs).","formula":"âm xuýt + es → /ɪz/: watches /ˈwɒtʃɪz/, washes /ˈwɒʃɪz/, buzzes /ˈbʌzɪz/, kisses /ˈkɪsɪz/, edges /ˈedʒɪz/\n/t/ /p/ /k/ + s → /s/: stops /stɒps/, sits /sɪts/, takes /teɪks/, gets /gets/, ropes /rəʊps/\nhữu thanh / nguyên âm + s → /z/: hides /haɪdz/, knows /nəʊz/, sings /sɪŋz/, robs /rɒbz/, saves /seɪvz/, travels /ˈtrævlz/","diagram":{"type":"flow","title":"Đuôi -s/-es đọc thế nào?","start":{"q":"Âm cuối của từ là gì?","branches":[{"label":"Âm xuýt: /s/ /z/ /ʃ/ /ʒ/ /tʃ/ /dʒ/","to":{"result":"/ɪz/ (thêm 1 tiếng): watches, kisses","icon":"➕"}},{"label":"/t/, /p/, /k/","to":{"result":"/s/: sits, stops, takes","icon":"🤫"}},{"label":"Âm hữu thanh hoặc nguyên âm","to":{"result":"/z/: robs, knows, sees","icon":"🐝"}}]}},"examples":[{"en":"She **watches** TV every evening.","vi":"Tối nào cô ấy cũng xem TV. (watches: /ɪz/)"},{"en":"He **gets** up at six.","vi":"Anh ấy dậy lúc 6 giờ. (gets: /s/)"},{"en":"My son **sings** very well.","vi":"Con trai tôi hát rất hay. (sings: /z/)"},{"en":"She **washes** the dishes after dinner.","vi":"Cô ấy rửa bát sau bữa tối. (washes: /ɪz/)"}],"mistake":{"wrong":"takes đọc /ˈteɪkɪz/ (2 tiếng) vì viết có chữ e","right":"takes đọc /teɪks/ (1 tiếng)","why":"Chữ e trong take là e câm; âm cuối là /k/ → -s đọc /s/, không thêm tiếng."},"tip":"Viết -es chưa chắc đã đọc /ɪz/: takes, hopes vẫn 1 tiếng. Chỉ âm xuýt mới thêm tiếng.","src":"tr. 286","check":{"type":"mcq","q":"Đuôi -es trong **kisses** đọc thế nào?","options":["/ɪz/","/s/","/z/"],"answer":0,"explain":"kiss có âm cuối /s/ là âm xuýt → **/ɪz/**: /ˈkɪsɪz/, 2 tiếng.","src":"tr. 286"}}],"practice":[{"type":"classify","q":"Đuôi -ed của mỗi từ đọc thế nào?","buckets":["/ɪd/","/t/","/d/"],"items":[{"text":"needed","bucket":0},{"text":"visited","bucket":0},{"text":"helped","bucket":1},{"text":"cooked","bucket":1},{"text":"washed","bucket":1},{"text":"played","bucket":2},{"text":"cleaned","bucket":2},{"text":"called","bucket":2}],"explain":"needed, visited: âm cuối /d/, /t/ → /ɪd/. helped (/p/), cooked (/k/), washed (/ʃ/): vô thanh → /t/. played (nguyên âm), cleaned (/n/), called (/l/): hữu thanh → /d/.","src":"tự soạn"},{"type":"classify","q":"Đuôi -s/-es của mỗi từ đọc thế nào?","buckets":["/ɪz/","/s/","/z/"],"items":[{"text":"teaches","bucket":0},{"text":"misses","bucket":0},{"text":"changes","bucket":0},{"text":"eats","bucket":1},{"text":"helps","bucket":1},{"text":"plays","bucket":2},{"text":"reads","bucket":2},{"text":"comes","bucket":2}],"explain":"teaches (/tʃ/), misses (/s/), changes (/dʒ/): âm xuýt → /ɪz/. eats (/t/), helps (/p/) → /s/. plays (nguyên âm), reads (/d/), comes (/m/): hữu thanh → /z/.","src":"tự soạn"},{"type":"mcq","q":"Đuôi -ed trong **hoped** đọc thế nào?","options":["/t/","/d/","/ɪd/"],"answer":0,"explain":"hope tận cùng bằng chữ e nhưng e câm; âm cuối là /p/ (vô thanh) → **/t/**. Đừng bị chữ e lừa mà chọn /d/.","src":"tự soạn"},{"type":"mcq","q":"Đuôi -ed trong **closed** (đóng) đọc thế nào?","options":["/d/","/t/","/ɪd/"],"answer":0,"explain":"Động từ close đọc /kləʊz/, âm cuối /z/ (hữu thanh) → **/d/**. Chữ s ở đây đọc /z/ chứ không phải /s/.","src":"tự soạn"},{"type":"mcq","q":"Chọn từ có đuôi -ed đọc **khác** các từ còn lại:","options":["stopped","wanted","decided","started"],"answer":0,"explain":"wanted, decided, started: âm cuối /t/, /d/ → /ɪd/. **stopped**: âm cuối /p/ → /t/.","src":"tr. 285–286"},{"type":"mcq","q":"Chọn từ có đuôi -ed đọc **khác** các từ còn lại:","options":["lived","watched","finished","laughed"],"answer":0,"explain":"watched (/tʃ/), finished (/ʃ/), laughed (/f/): vô thanh → /t/. **lived**: /v/ hữu thanh → /d/.","src":"tr. 285"},{"type":"mcq","q":"Chọn từ có đuôi -s/-es đọc **khác** các từ còn lại:","options":["stops","washes","buzzes","kisses"],"answer":0,"explain":"washes, buzzes, kisses: âm xuýt /ʃ/, /z/, /s/ → /ɪz/. **stops**: âm cuối /p/ → /s/.","src":"tr. 286"},{"type":"mcq","q":"Chọn từ có đuôi -s đọc **khác** các từ còn lại:","options":["knows","sits","takes","ropes"],"answer":0,"explain":"sits (/t/), takes (/k/), ropes (/p/) → /s/. **knows**: tận cùng nguyên âm → /z/.","src":"tr. 286"},{"type":"fill","q":"**decided** có ___ âm tiết (tiếng).","answer":["3","ba"],"explain":"decide có âm cuối /d/ → -ed đọc /ɪd/, thêm một tiếng: de-ci-ded = **3** tiếng.","src":"tr. 286"},{"type":"fill","q":"**watched** có ___ âm tiết (tiếng).","answer":["1","một"],"explain":"watch có âm cuối /tʃ/ (vô thanh) → -ed chỉ là /t/ nhẹ: /wɒtʃt/ = **1** tiếng. Đừng nhầm với watches (2 tiếng).","src":"tr. 285"},{"type":"fill","q":"**watches** có ___ âm tiết (tiếng).","answer":["2","hai"],"explain":"/tʃ/ là âm xuýt → -es đọc /ɪz/, thêm một tiếng: /ˈwɒtʃɪz/ = **2** tiếng.","src":"tr. 286"},{"type":"mcq","q":"*She visited her mother and cooked dinner.* Hai đuôi -ed lần lượt đọc là:","options":["/ɪd/ – /t/","/t/ – /ɪd/","/ɪd/ – /ɪd/","/d/ – /t/"],"answer":0,"explain":"visit có âm cuối /t/ → visited /ɪd/; cook có âm cuối /k/ (vô thanh) → cooked /t/.","src":"tự soạn"}],"flashcards":[{"front":"Khi nào -ed đọc /ɪd/?","back":"Âm cuối **/t/** hoặc **/d/**: wanted, decided (thêm 1 tiếng)"},{"front":"-ed đọc /t/ hay /d/?","back":"Âm cuối vô thanh → **/t/**: stopped, watched · hữu thanh / nguyên âm → **/d/**: lived, played"},{"front":"Kiểm tra hữu thanh hay vô thanh thế nào?","back":"Đặt tay lên cổ: **rung** = hữu thanh (/z/, /v/, nguyên âm); **không rung** = vô thanh (/s/, /p/, /k/)"},{"front":"Khi nào -s/-es đọc /ɪz/?","back":"Sau âm xuýt /s/, /z/, /ʃ/, /ʒ/, /tʃ/, /dʒ/: **watches, kisses, edges**"},{"front":"-s đọc /s/ hay /z/?","back":"Sau /t/, /p/, /k/ → **/s/**: sits, stops, takes · sau hữu thanh / nguyên âm → **/z/**: robs, knows, sees"},{"front":"hoped: -ed đọc gì?","back":"**/t/**: e câm, âm cuối thật là /p/ (vô thanh)"}]}],"quiz":{"pass":0.8,"sets":[[{"type":"mcq","q":"shake → V-ing?","options":["shaking","shakeing","shakking"],"answer":0,"explain":"shake tận cùng bằng e câm → bỏ e rồi thêm -ing: **shaking**. Không gấp đôi k: trước k là e câm, không phải 1 nguyên âm + 1 phụ âm.","src":"tr. 284"},{"type":"fill","q":"She ___ to the radio while she was cooking. (listen, quá khứ)","answer":["listened"],"hint":"listen đọc nhấn âm đầu: LIS-ten","explain":"listen 2 âm tiết, nhấn âm đầu → thêm thẳng, không gấp đôi n: **listened**.","src":"tự soạn"},{"type":"fill","q":"The rabbit ___ across the garden. (hop, quá khứ)","answer":["hopped"],"explain":"hop (nhảy lò cò): 1 âm tiết, 1 nguyên âm (o) + 1 phụ âm (p) → gấp đôi p: **hopped**. Đừng nhầm với hope → hoped (tận cùng e, chỉ thêm d).","src":"tự soạn"},{"type":"fill","q":"Why is the baby ___? (cry)","answer":["crying"],"explain":"cry: phụ âm + y, nhưng thêm -ing thì **giữ y**: **crying**.","src":"tự soạn"},{"type":"fill","q":"He ___ my bag to the car. (carry, quá khứ)","answer":["carried"],"explain":"carry: phụ âm r + y → đổi y thành i trước -ed: **carried**.","src":"tự soạn"},{"type":"fix","wrong":"He is tieing his shoes.","answer":["He is tying his shoes.","He's tying his shoes."],"explain":"tie tận cùng **ie** → đổi ie thành y rồi thêm -ing: **tying** (giống die → dying).","src":"tự soạn"},{"type":"mcq","q":"Chọn câu viết đúng (admit nhấn âm cuối: ad-**MIT**):","options":["They admitted their mistake.","They admited their mistake.","They admitied their mistake."],"answer":0,"explain":"admit 2 âm tiết, nhấn âm cuối, tận cùng 1 nguyên âm (i) + 1 phụ âm (t) → gấp đôi t: **admitted**.","src":"tự soạn"},{"type":"mcq","q":"relax → V-ed? (relax nhấn âm cuối: re-**LAX**)","options":["relaxed","relaxxed","relaxd"],"answer":0,"explain":"relax nhấn âm cuối nhưng tận cùng bằng **x** → không bao giờ gấp đôi x: **relaxed**. Chỉ được thêm -ed (relaxd thiếu e).","src":"tr. 285"},{"type":"fix","wrong":"She is agreing with you.","answer":["She is agreeing with you.","She's agreeing with you."],"explain":"agree tận cùng **ee** → giữ nguyên ee rồi thêm -ing: **agreeing**.","src":"tr. 284"},{"type":"mcq","q":"Đuôi -ed trong **arrived** đọc thế nào?","options":["/d/","/t/","/ɪd/"],"answer":0,"explain":"arrive có âm cuối /v/ (hữu thanh; chữ e câm) → **/d/**.","src":"tự soạn"},{"type":"mcq","q":"Đuôi -ed trong **danced** đọc thế nào?","options":["/t/","/d/","/ɪd/"],"answer":0,"explain":"dance có âm cuối /s/ (vô thanh; chữ e câm) → **/t/**.","src":"tự soạn"},{"type":"mcq","q":"Đuôi -ed trong **added** đọc thế nào?","options":["/ɪd/","/d/","/t/"],"answer":0,"explain":"add có âm cuối /d/ → -ed đọc **/ɪd/**, thêm một tiếng: add-ed. Không phải /d/: hai âm /d/ liền nhau không nghe ra nên phải chèn /ɪ/.","src":"tự soạn"},{"type":"mcq","q":"Chọn từ có đuôi -s/-es đọc **khác** các từ còn lại:","options":["plays","changes","uses","passes"],"answer":0,"explain":"changes (/dʒ/), uses (/z/), passes (/s/): âm xuýt → /ɪz/. **plays**: tận cùng nguyên âm → /z/.","src":"tự soạn"},{"type":"classify","q":"Đuôi -s/-es của mỗi động từ đọc thế nào?","buckets":["/ɪz/","/s/","/z/"],"items":[{"text":"fixes","bucket":0},{"text":"dances","bucket":0},{"text":"cooks","bucket":1},{"text":"keeps","bucket":1},{"text":"opens","bucket":2},{"text":"cries","bucket":2}],"explain":"fixes (âm cuối /s/ trong /ks/), dances (/s/): âm xuýt → /ɪz/. cooks (/k/), keeps (/p/) → /s/. opens (/n/), cries (nguyên âm) → /z/.","src":"tự soạn"},{"type":"mcq","q":"Đuôi -es trong **studies** đọc thế nào?","options":["/z/","/s/","/ɪz/"],"answer":0,"explain":"study kết thúc bằng âm nguyên âm /i/ → **/z/**. Viết -ies nhưng không thêm tiếng /ɪz/, vì âm cuối không phải âm xuýt.","src":"tự soạn"},{"type":"mcq","q":"**hugged** (đã ôm): chính tả và cách đọc đuôi đúng là:","options":["gấp đôi g; -ed đọc /d/","gấp đôi g; -ed đọc /ɪd/","không gấp đôi; -ed đọc /t/"],"answer":0,"explain":"hug: 1 âm tiết, 1 nguyên âm (u) + 1 phụ âm (g) → gấp đôi g. Âm cuối /g/ hữu thanh → -ed đọc **/d/**: /hʌgd/, chỉ 1 tiếng. Không phải /ɪd/ vì âm cuối không phải /t/, /d/.","src":"tr. 285","shuffle":false},{"type":"mcq","q":"Chọn câu viết đúng chính tả (happen nhấn âm đầu: **HAP**-pen):","options":["What happened?","What happenned?","What happend?"],"answer":0,"explain":"happen 2 âm tiết, nhấn âm đầu → thêm thẳng -ed, không gấp đôi n: **happened**. *happend* thiếu e.","src":"tự soạn"},{"type":"mcq","q":"refer (nhắc tới) → V-ing? (re-**FER**)","options":["referring","refering","reffering"],"answer":0,"explain":"refer 2 âm tiết, **nhấn âm cuối**, tận cùng 1 nguyên âm (e) + 1 phụ âm (r) → gấp đôi r: **referring** (giống prefer → preferring).","src":"tự soạn"},{"type":"mcq","q":"return nhấn âm cuối (re-**TURN**). Vì sao vẫn viết **returned**, không gấp đôi n?","options":["Vì return tận cùng bằng 2 phụ âm (r, n)","Vì chữ n không bao giờ được gấp đôi","Vì return có 2 âm tiết"],"answer":0,"explain":"Muốn gấp đôi phải tận cùng **1 nguyên âm + 1 phụ âm**. return tận cùng **r + n** (2 phụ âm) → thêm thẳng: returned. n vẫn gấp đôi được (plan → planned), và từ 2 âm tiết nhấn âm cuối vẫn gấp đôi được (prefer → preferred).","src":"tr. 285"},{"type":"mcq","q":"Động từ nào **không** gấp đôi phụ âm cuối khi thêm -ed?","options":["follow","chat","pat","ban"],"answer":0,"explain":"chat → chatted, pat → patted, ban → banned: 1 âm tiết, 1 nguyên âm + 1 phụ âm → gấp đôi. **follow** tận cùng bằng **w** (và nhấn âm đầu: **FOL**-low) → thêm thẳng: followed.","src":"tr. 285"},{"type":"mcq","q":"develop nhấn âm giữa (de-**VEL**-op). V-ed đúng là:","options":["developed","developped","develloped"],"answer":0,"explain":"Chỉ gấp đôi khi tiếng **cuối** được nhấn. develop nhấn tiếng giữa, tiếng cuối -op đọc nhẹ → thêm thẳng: **developed**.","src":"tự soạn"},{"type":"mcq","q":"Ngôi thứ ba số ít (he/she) của **push** là:","options":["pushes","pushs","pushies"],"answer":0,"explain":"Động từ tận cùng **sh** → thêm **-es**: **pushes** (giống wash → washes).","src":"tr. 255–256"},{"type":"fill","q":"Everyone ___ at the end of the show. (clap, quá khứ)","answer":["clapped"],"explain":"clap (vỗ tay): 1 âm tiết, 1 nguyên âm (a) + 1 phụ âm (p) → gấp đôi p: **clapped**.","src":"tự soạn"},{"type":"fill","q":"Stop ___! Everything will be fine. (worry)","answer":["worrying"],"explain":"worry: phụ âm r + y, nhưng thêm **-ing thì giữ y**: **worrying** (không viết worriing).","src":"tự soạn"},{"type":"fill","q":"She ___ the new words into her notebook. (copy, quá khứ)","answer":["copied"],"explain":"copy: phụ âm p + y → đổi y thành i rồi thêm -ed: **copied**.","src":"tự soạn"},{"type":"fill","q":"Mum is ___ a cake for my birthday. (bake)","answer":["baking"],"explain":"bake tận cùng bằng e câm → bỏ e rồi thêm -ing: **baking** (không viết bakeing, bakking).","src":"tự soạn"},{"type":"fix","wrong":"He is giveing his sister a present.","answer":["He is giving his sister a present.","He's giving his sister a present."],"explain":"give tận cùng bằng e → bỏ e rồi thêm -ing: **giving**.","src":"tự soạn"},{"type":"fix","wrong":"The little boy beged for more sweets.","answer":["The little boy begged for more sweets."],"explain":"beg (năn nỉ): 1 âm tiết, 1 nguyên âm (e) + 1 phụ âm (g) → gấp đôi g: **begged**.","src":"tự soạn"},{"type":"fix","wrong":"She offerred to help me with my homework.","answer":["She offered to help me with my homework."],"explain":"offer nhấn âm đầu (**OF**-fer) → thêm thẳng, không gấp đôi r: **offered**. Khác prefer (pre-**FER**) → preferred.","src":"tự soạn"},{"type":"classify","q":"Khi thêm **-ing**, mỗi động từ thay đổi thế nào?","buckets":["Bỏ e","Gấp đôi phụ âm cuối","Thêm thẳng"],"items":[{"text":"ride","bucket":0},{"text":"use","bucket":0},{"text":"hit","bucket":1},{"text":"cut","bucket":1},{"text":"forget (for-GET)","bucket":1},{"text":"wonder (WON-der)","bucket":2},{"text":"show","bucket":2},{"text":"look","bucket":2}],"explain":"riding, using (bỏ e). hitting, cutting (1 âm tiết, 1 nguyên âm + 1 phụ âm), forgetting (nhấn âm cuối) → gấp đôi. wondering (nhấn âm đầu), showing (không gấp đôi w), looking (2 nguyên âm o, o) → thêm thẳng.","src":"tr. 284–285"},{"type":"classify","q":"Khi thêm **-ed**, mỗi động từ thay đổi thế nào?","buckets":["Đổi y → i","Gấp đôi phụ âm cuối","Thêm -ed / -d, không đổi gì"],"items":[{"text":"apply","bucket":0},{"text":"rely","bucket":0},{"text":"tap","bucket":1},{"text":"occur (oc-CUR)","bucket":1},{"text":"pray","bucket":2},{"text":"complain (com-PLAIN)","bucket":2},{"text":"rest","bucket":2},{"text":"save","bucket":2}],"explain":"applied, relied (phụ âm + y → i). tapped (1 âm tiết), occurred (nhấn âm cuối) → gấp đôi. prayed (nguyên âm a + y, giữ y), complained (2 nguyên âm a, i trước n), rested (2 phụ âm s, t), saved (tận cùng e → chỉ thêm d).","src":"tr. 284–285"},{"type":"order","q":"Sắp xếp thành câu đúng (Chúng tôi đang chạy bộ quanh hồ):","words":["We","are","jogging","around","the","lake."],"explain":"Hiện tại tiếp diễn: are + V-ing. jog: 1 âm tiết, 1 nguyên âm + 1 phụ âm → gấp đôi g: **jogging**.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng (Cô ấy đã cưới một bác sĩ):","words":["She","married","a","doctor."],"explain":"marry: phụ âm r + y → đổi y thành i rồi thêm -ed: **married**.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng (Cô ấy đang nghe điện thoại):","words":["She","is","answering","the","phone."],"explain":"answer nhấn âm đầu (**AN**-swer) → thêm thẳng: **answering**, không gấp đôi r.","src":"tự soạn"},{"type":"mcq","q":"Đuôi -ed trong **jumped** đọc thế nào?","options":["/t/","/d/","/ɪd/"],"answer":0,"explain":"jump có âm cuối /p/ (vô thanh) → -ed đọc **/t/**: /dʒʌmpt/, 1 tiếng. Không phải /ɪd/ vì âm cuối không phải /t/, /d/.","src":"tự soạn"},{"type":"mcq","q":"Đuôi -ed trong **painted** đọc thế nào?","options":["/ɪd/","/t/","/d/"],"answer":0,"explain":"paint có âm cuối /t/ → -ed đọc **/ɪd/**, thêm một tiếng: paint-ed. Không phải /t/: /t/ dính với /t/ thì không nghe ra.","src":"tự soạn"},{"type":"mcq","q":"Đuôi -ed trong **refused** (đã từ chối) đọc thế nào?","options":["/d/","/t/","/ɪd/"],"answer":0,"explain":"refuse đọc /rɪˈfju:z/: chữ s ở đây đọc **/z/** (hữu thanh), chữ e câm → -ed đọc **/d/**. Đừng nhìn chữ s mà chọn /t/.","src":"tự soạn"},{"type":"mcq","q":"Chọn từ có đuôi -ed đọc **khác** các từ còn lại:","options":["robbed","packed","picked","locked"],"answer":0,"explain":"packed, picked, locked: âm cuối /k/ (vô thanh) → /t/. **robbed**: âm cuối /b/ (hữu thanh) → /d/.","src":"tr. 285"},{"type":"mcq","q":"Chọn từ có đuôi -ed đọc **khác** các từ còn lại:","options":["obeyed","hated","landed","pointed"],"answer":0,"explain":"hated, pointed (âm cuối /t/), landed (âm cuối /d/) → /ɪd/, thêm một tiếng. **obeyed**: tận cùng nguyên âm → /d/, không thêm tiếng.","src":"tr. 285–286"},{"type":"mcq","q":"Chọn từ có đuôi -s/-es đọc **khác** các từ còn lại:","options":["drinks","boxes","oranges","rises"],"answer":0,"explain":"boxes (/ks/, âm cuối /s/), oranges (/dʒ/), rises (/z/): âm xuýt → /ɪz/. **drinks**: âm cuối /k/ → /s/.","src":"tr. 286"},{"type":"mcq","q":"Chọn từ có đuôi -s đọc **khác** các từ còn lại:","options":["shops","runs","tells","leaves"],"answer":0,"explain":"runs (/n/), tells (/l/), leaves (/v/): hữu thanh → /z/. **shops**: âm cuối /p/ → /s/.","src":"tr. 286"},{"type":"mcq","q":"Đuôi -es trong **goes** đọc thế nào?","options":["/z/","/s/","/ɪz/"],"answer":0,"explain":"go tận cùng bằng nguyên âm /əʊ/ → **/z/**: /gəʊz/, 1 tiếng. Viết thêm -es (vì tận cùng o) nhưng **không** đọc /ɪz/: chỉ âm xuýt mới thêm tiếng.","src":"tự soạn"},{"type":"mcq","q":"Đuôi -ed trong **promised** (đã hứa) đọc thế nào?","options":["/t/","/d/","/ɪd/"],"answer":0,"explain":"promise đọc /ˈprɒmɪs/: âm cuối **/s/** (vô thanh), chữ e câm → -ed đọc **/t/**: /ˈprɒmɪst/. Khác refuse /z/ → refused /d/.","src":"tự soạn"},{"type":"fill","q":"**collected** có ___ âm tiết (tiếng).","answer":["3","ba"],"explain":"collect có âm cuối /t/ → -ed đọc /ɪd/, thêm một tiếng: col-lect-ed = **3** tiếng.","src":"tự soạn"},{"type":"fill","q":"**brushes** có ___ âm tiết (tiếng).","answer":["2","hai"],"explain":"brush có âm cuối /ʃ/ là âm xuýt → -es đọc /ɪz/, thêm một tiếng: brush-es = **2** tiếng.","src":"tự soạn"},{"type":"fill","q":"**judged** có ___ âm tiết (tiếng).","answer":["1","một"],"explain":"judge có âm cuối /dʒ/ (hữu thanh), không phải /t/, /d/ → -ed chỉ là /d/ nhẹ: /dʒʌdʒd/ = **1** tiếng. Đừng nhầm với judges (2 tiếng, vì /dʒ/ là âm xuýt khi thêm -s).","src":"tự soạn"},{"type":"classify","q":"Đuôi -ed của mỗi từ đọc thế nào?","buckets":["/ɪd/","/t/","/d/"],"items":[{"text":"treated","bucket":0},{"text":"folded","bucket":0},{"text":"reached","bucket":1},{"text":"coughed","bucket":1},{"text":"mixed","bucket":1},{"text":"believed","bucket":2},{"text":"annoyed","bucket":2},{"text":"waved","bucket":2}],"explain":"treated (/t/), folded (/d/) → /ɪd/. reached (/tʃ/), coughed (/f/), mixed (/ks/, âm cuối /s/): vô thanh → /t/. believed, waved (/v/), annoyed (nguyên âm): hữu thanh → /d/.","src":"tr. 285–286"},{"type":"classify","q":"Đuôi -s/-es của mỗi từ đọc thế nào?","buckets":["/ɪz/","/s/","/z/"],"items":[{"text":"catches","bucket":0},{"text":"places","bucket":0},{"text":"loses","bucket":0},{"text":"writes","bucket":1},{"text":"types","bucket":1},{"text":"needs","bucket":2},{"text":"sells","bucket":2},{"text":"drives","bucket":2}],"explain":"catches (/tʃ/), places (/s/), loses (/z/): âm xuýt → /ɪz/. writes (/t/), types (/p/) → /s/ (chữ e câm, không thêm tiếng). needs (/d/), sells (/l/), drives (/v/): hữu thanh → /z/.","src":"tr. 286"},{"type":"mcq","q":"Vì sao đuôi -ed trong **walked** **không** đọc /ɪd/?","options":["Vì âm cuối của walk là /k/, không phải /t/ hay /d/","Vì walk chỉ có 1 âm tiết","Vì walk tận cùng bằng chữ k, mà k không gấp đôi"],"answer":0,"explain":"-ed chỉ đọc /ɪd/ sau **/t/, /d/**. walk có âm cuối /k/ (vô thanh) → -ed đọc /t/: /wɔ:kt/. Số âm tiết không quyết định (want cũng 1 âm tiết mà wanted đọc /ɪd/); chuyện gấp đôi là chính tả, không phải phát âm.","src":"tr. 285–286"},{"type":"mcq","q":"*He kicked the ball and scored.* Hai đuôi -ed lần lượt đọc là:","options":["/t/ – /d/","/d/ – /t/","/ɪd/ – /d/","/t/ – /ɪd/"],"answer":0,"explain":"kick có âm cuối /k/ (vô thanh) → kicked **/t/**. score tận cùng bằng âm nguyên âm /ɔ:/ (hữu thanh; chữ e câm) → scored **/d/**.","src":"tự soạn"}],[{"type":"mcq","q":"choose → V-ing?","options":["choosing","chooseing","chosing"],"answer":0,"explain":"choose tận cùng bằng e câm → bỏ e rồi thêm -ing: **choosing**. Vẫn giữ hai chữ o của từ gốc (chosing sai).","src":"tr. 284"},{"type":"mcq","q":"free (giải thoát, thả) → V-ing?","options":["freeing","freing","freeying"],"answer":0,"explain":"free tận cùng bằng **ee** → giữ nguyên ee rồi thêm -ing: **freeing** (giống see → seeing, agree → agreeing). Chỉ e câm đơn mới bị bỏ.","src":"tr. 284"},{"type":"fix","wrong":"He is untieing the boat.","answer":["He is untying the boat.","He's untying the boat."],"explain":"untie (cởi dây) tận cùng **ie** → đổi ie thành y rồi thêm -ing: **untying** (giống die → dying, lie → lying).","src":"tr. 285"},{"type":"fill","q":"Hurry up! The train is ___ in five minutes. (leave)","answer":["leaving"],"explain":"leave tận cùng bằng e câm → bỏ e rồi thêm -ing: **leaving**.","src":"tự soạn"},{"type":"mcq","q":"Chọn câu viết đúng (submit nhấn âm cuối: sub-**MIT**):","options":["She submitted her essay on time.","She submited her essay on time.","She submmitted her essay on time."],"answer":0,"explain":"submit (nộp) 2 âm tiết, nhấn âm cuối, tận cùng 1 nguyên âm (i) + 1 phụ âm (t) → gấp đôi t ở cuối: **submitted**. Chỉ gấp đôi phụ âm **cuối**, không đụng vào m.","src":"tự soạn"},{"type":"fill","q":"Smoking is not ___ in this building. (permit)","answer":["permitted"],"hint":"permit (cho phép) đọc nhấn âm cuối: per-MIT","explain":"permit 2 âm tiết, nhấn âm cuối, tận cùng 1 nguyên âm (i) + 1 phụ âm (t) → gấp đôi t: **permi
