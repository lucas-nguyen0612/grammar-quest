yên ngày trước: thói quen trong quá khứ. Việc đang diễn ra thì phải dùng was/were + V-ing; việc còn kéo dài tới nay thì dùng hiện tại hoàn thành.","src":"tự soạn"},{"type":"fill","q":"Last night I came home, ___ a quick shower and went to bed. (take)","answer":["took"],"explain":"Chuỗi việc nối tiếp nhau (came → took → went) → mỗi việc một V2: take – **took** – taken.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu hỏi đúng:","words":["Where","did","you","buy","that","jacket?"],"explain":"Câu hỏi quá khứ đơn: từ hỏi + **did** + chủ ngữ + nguyên mẫu (buy, không dùng bought).","src":"tự soạn"},{"type":"mcq","q":"Oh no! Somebody ___ my bike. It isn't here anymore.","options":["has stolen","stole"],"answer":0,"explain":"Không nói lúc nào, và **kết quả còn ở hiện tại** (bây giờ xe không còn) → hiện tại hoàn thành: has stolen. Quá khứ đơn dùng khi nói rõ thời gian, ví dụ *stole it last night*.","src":"tự soạn","shuffle":false},{"type":"mcq","q":"When ___ your driving test?","options":["did you pass","have you passed"],"answer":0,"explain":"Câu hỏi **When?** hỏi thời điểm cụ thể → quá khứ đơn: did you pass. Không dùng hiện tại hoàn thành với When.","src":"tự soạn","shuffle":false},{"type":"fix","wrong":"My grandmother has lived in that small house for 40 years, until she moved in with us last year.","answer":["My grandmother lived in that small house for 40 years, until she moved in with us last year.","My grandmother had lived in that small house for 40 years, until she moved in with us last year."],"explain":"Bà đã dọn đi (**last year**) → quãng 40 năm đã **chấm dứt**, không còn dính tới bây giờ → không dùng has lived; dùng quá khứ đơn: **lived** (had lived cũng đúng, vì việc kéo dài tới một mốc quá khứ). for + khoảng thời gian không tự quyết định thì; nghĩa của câu mới quyết định.","src":"tự soạn"},{"type":"mcq","q":"I ___ any coffee today. I'll have a cup now.","options":["haven't had","didn't have"],"answer":0,"explain":"**today** chưa hết (tôi định uống ngay bây giờ) → hiện tại hoàn thành: haven't had. *didn't have* chỉ dùng khi khoảng thời gian đó đã trôi qua.","src":"tự soạn","shuffle":false},{"type":"fix","wrong":"Hang has bought a new phone last week.","answer":["Hang bought a new phone last week."],"explain":"Có **last week** (thời điểm đã qua) → quá khứ đơn: bought. Không dùng has + V3 khi đã nói rõ lúc nào.","src":"tự soạn"},{"type":"mcq","q":"'Linh has got married!' – 'Really? When ___ married?'","options":["did she get","has she got","does she get"],"answer":0,"explain":"Câu báo tin dùng hiện tại hoàn thành; câu hỏi chi tiết **When?** → quá khứ đơn: did she get. *has she got* không đi với When; *does she get* là hiện tại.","src":"tự soạn"},{"type":"classify","q":"Mỗi chỗ trống nên dùng thì nào?","buckets":["Quá khứ đơn","Hiện tại hoàn thành"],"items":[{"text":"I ___ (see) Minh two days ago.","bucket":0},{"text":"I ___ never (try) durian. Is it good?","bucket":1},{"text":"My grandfather ___ (build) this house in 1970.","bucket":0},{"text":"We ___ (be) friends since 2015.","bucket":1},{"text":"She ___ (live) in Hue for three years, but now she lives in Hanoi.","bucket":0},{"text":"I ___ (lose) my keys, so I can't open the door.","bucket":1}],"explain":"Có thời điểm đã qua (two days ago, in 1970) hoặc việc đã khép lại (giờ cô ấy sống ở Hà Nội) → quá khứ đơn. Chưa từng tính tới nay (never), kéo dài tới nay (since 2015), kết quả còn bây giờ (không mở được cửa) → hiện tại hoàn thành.","src":"tự soạn"},{"type":"mcq","q":"At 7 o'clock this morning, my sister ___ breakfast in the kitchen.","options":["was eating","were eating","is eating"],"answer":0,"explain":"Việc **đang diễn ra** ở một lúc trong quá khứ (7 giờ sáng nay, đã qua) → was/were + V-ing; **my sister** số ít → was eating. *is eating* là hiện tại.","src":"tự soạn"},{"type":"mcq","q":"When we left the cinema, it ___ heavily, so we took a taxi instead of walking.","options":["was raining","is raining","has rained"],"answer":0,"explain":"Mưa là **việc nền đang diễn ra** lúc chúng tôi ra khỏi rạp → quá khứ tiếp diễn: was raining. *is raining* là hiện tại, *has rained* là hiện tại hoàn thành, đều không hợp câu kể quá khứ.","src":"tự soạn"},{"type":"mcq","q":"While I ___ dinner, the lights went out.","options":["was cooking","cooked","am cooking"],"answer":0,"explain":"Nấu ăn là việc **dài, đang diễn ra**; mất điện là việc **ngắn xen vào** (went out) → While + was cooking. *am cooking* là hiện tại.","src":"tự soạn"},{"type":"mcq","q":"When Mai heard the good news, she ___ her mother at once.","options":["called","was calling"],"answer":0,"explain":"Nghe tin **xong rồi** mới gọi mẹ (**at once** = ngay lập tức): hai việc **nối tiếp** → cả hai quá khứ đơn. Không có việc nào làm nền nên không dùng was calling.","src":"tự soạn","shuffle":false},{"type":"fix","wrong":"Yesterday at 9 p.m. they were play cards in the living room.","answer":["Yesterday at 9 p.m. they were playing cards in the living room."],"explain":"Quá khứ tiếp diễn cần đủ **were + V-ing**: were playing. Thiếu -ing là sai.","src":"tự soạn"},{"type":"mcq","q":"While Dad ___ the car, Mum was cleaning the kitchen.","options":["was washing","washed","has washed"],"answer":0,"explain":"Hai việc **cùng diễn ra song song** → cả hai dùng quá khứ tiếp diễn: was washing … was cleaning. *has washed* là hiện tại hoàn thành, không hợp.","src":"tự soạn"},{"type":"mcq","q":"My roommate ___ my things without asking. It was so annoying!","options":["was always using","was always use","always was using"],"answer":0,"explain":"Việc lặp đi lặp lại gây **bực mình** → was + **always** + V-ing. always đứng **giữa** was và V-ing; *was always use* thiếu -ing.","src":"tự soạn"},{"type":"fill","q":"When I got to the station, the last bus ___. I had to walk home. (leave)","answer":["had left","'d left"],"explain":"Xe buýt đi **trước** lúc tôi tới (vì thế tôi phải đi bộ) → had left (leave – left – **left**). *left* sẽ hiểu là tôi tới rồi xe mới chạy.","src":"tự soạn"},{"type":"mcq","q":"I didn't recognise him at first because he ___ a lot.","options":["had changed","has changed","changes"],"answer":0,"explain":"Anh ấy thay đổi **trước** lúc tôi gặp và không nhận ra (didn't recognise) → had changed. *has changed* là hiện tại hoàn thành, không hợp câu kể quá khứ.","src":"tự soạn"},{"type":"fix","wrong":"They had went to bed when I called.","answer":["They had gone to bed when I called.","They'd gone to bed when I called."],"explain":"Sau **had** dùng V3: go – went – **gone**. went là V2.","src":"tự soạn"},{"type":"mcq","q":"After the guests ___, we cleaned the whole house.","options":["left","had left","have left","Cả left và had left đều đúng"],"answer":3,"explain":"Sau **after** (cũng như as soon as, before, when…), thứ tự đã rõ nên dùng được **cả** quá khứ đơn lẫn quá khứ hoàn thành. *have left* là hiện tại hoàn thành, sai trong câu kể quá khứ.","src":"tr. 272","shuffle":false},{"type":"fill","q":"I thought I ___ the door, but it was still open. (lock)","answer":["had locked","'d locked"],"explain":"Sau **thought** (quá khứ), việc khoá cửa (tưởng là) xảy ra **trước** lúc nghĩ → had locked.","src":"tự soạn"},{"type":"mcq","q":"Her eyes were red because she ___.","options":["had been crying","has been crying","had been cry"],"answer":0,"explain":"Khóc vừa kết thúc và **để lại dấu vết** lúc đó (mắt đỏ, were) → had been crying. *has been crying* dùng cho hiện tại; *had been cry* thiếu -ing.","src":"tự soạn"},{"type":"fill","q":"When I finally arrived, my friends ___ for me for an hour. (wait)","answer":["had been waiting"],"explain":"Chờ **liên tục một tiếng** tới lúc tôi đến (arrived) → had been waiting. Có 'bao lâu' (for an hour) nên không dùng were waiting.","src":"tự soạn"},{"type":"mcq","q":"By the end of the day, Minh ___ 200 photos.","options":["had taken","had been taking"],"answer":0,"explain":"Có **số lượng đã xong** (200 photos) → nhấn kết quả → had taken. had been taking nhấn sự liên tục, không đi với con số hoàn tất.","src":"tự soạn","shuffle":false},{"type":"fix","wrong":"We were waiting for the bus for 40 minutes when it finally came.","answer":["We had been waiting for the bus for 40 minutes when it finally came.","We'd been waiting for the bus for 40 minutes when it finally came."],"explain":"Nói chờ **bao lâu** (for 40 minutes) tới lúc xe đến → had been waiting. Quá khứ tiếp diễn không đi với 'bao lâu'.","src":"tự soạn"},{"type":"fill","q":"I ___ that old laptop for seven years when it finally broke. (have)","answer":["had had","'d had"],"explain":"have ở đây = **sở hữu**, không dùng tiếp diễn → không dùng had been having. Sở hữu kéo dài tới một mốc quá khứ (broke) → had + V3: **had had** (sách: I had had it since College, không dùng I had it).","src":"tự soạn"},{"type":"classify","q":"Chỗ trống trong mỗi câu cần thì nào?","buckets":["had been + V-ing","had + V3"],"items":[{"text":"By noon he ___ (drink) four cups of coffee.","bucket":1},{"text":"His hands were dirty because he ___ (repair) the car.","bucket":0},{"text":"By the time I came, she ___ (read) the whole book.","bucket":1},{"text":"They ___ (talk) on the phone for two hours when I got home.","bucket":0},{"text":"When we met, I ___ (know) his sister for years.","bucket":1}],"explain":"Liên tục 'bao lâu' (for two hours) hoặc vừa xong còn dấu vết (tay bẩn) → had been + V-ing. Số lượng, kết quả trọn vẹn (four cups, the whole book) → had + V3. know chỉ nhận thức, không dùng tiếp diễn → had known.","src":"tự soạn"}],[{"type":"mcq","q":"The weather ___ terrible on our trip last week.","options":["was","were","did"],"answer":0,"explain":"**the weather** là số ít → **was**. *were* dùng cho we/you/they; *did* không đứng trước tính từ.","src":"tự soạn"},{"type":"mcq","q":"You went to the cinema last night. ___ the film good?","options":["Was","Did","Were"],"answer":0,"explain":"Câu hỏi với be: đưa **was** lên đầu; **the film** số ít → Was. be tự làm câu hỏi, không mượn *Did*.","src":"tự soạn"},{"type":"fill","q":"I ___ a strange noise in the kitchen last night. (hear)","answer":["heard"],"explain":"**last night** → quá khứ đơn; hear – **heard** – heard.","src":"tự soạn"},{"type":"fill","q":"We ___ the museum yesterday because it was closed. (not/ visit)","answer":["didn't visit","did not visit"],"explain":"Phủ định quá khứ đơn: **didn't** + nguyên mẫu: didn't visit (không dùng *didn't visited*).","src":"tự soạn"},{"type":"fill","q":"Mr Hai ___ us a funny story at dinner last night. (tell)","answer":["told"],"explain":"tell là động từ bất quy tắc: tell – **told** – told. Không viết *telled*.","src":"tự soạn"},{"type":"fix","wrong":"Did they won the match last Sunday?","answer":["Did they win the match last Sunday?"],"explain":"Sau **Did** dùng nguyên mẫu: win (won là V2). Một câu chỉ có một dấu quá khứ.","src":"tự soạn"},{"type":"fix","wrong":"My brother teached me to swim when I was seven.","answer":["My brother taught me to swim when I was seven."],"explain":"teach là động từ bất quy tắc: teach – **taught** – taught.","src":"tự soạn"},{"type":"mcq","q":"Chọn câu kể đúng một chuỗi hành động trong quá khứ:","options":["He opened the fridge, took out a bottle of milk and drank it.","He opened the fridge, take out a bottle of milk and drink it.","He was opening the fridge, was taking out a bottle of milk and was drinking it."],"answer":0,"explain":"Chuỗi việc **nối tiếp nhau** → mỗi việc một V2: opened → took → drank. Câu 2 bỏ quá khứ giữa chừng; câu 3 dùng tiếp diễn như thể các việc làm nền cho nhau.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["She","didn't","come","to","class","last","Monday"],"answer":["Last Monday she didn't come to class"],"explain":"Phủ định quá khứ đơn: S + **didn't** + nguyên mẫu (come).","src":"tự soạn"},{"type":"mcq","q":"'My grandfather smoked a lot when he was young.' Câu này diễn đạt gì?","options":["Một thói quen trong quá khứ","Một việc đang diễn ra ở một lúc trong quá khứ","Một việc xảy ra trước một việc quá khứ khác"],"answer":0,"explain":"Hút thuốc nhiều hồi trẻ = việc lặp lại thường xuyên ngày trước → thói quen trong quá khứ, dùng quá khứ đơn.","src":"tự soạn"},{"type":"mcq","q":"Mum, I ___ all my homework. Can I go out and play now?","options":["have finished","finished"],"answer":0,"explain":"Không nói lúc nào, và **kết quả còn ở hiện tại** (bài đã xong nên giờ đi chơi được) → hiện tại hoàn thành: have finished.","src":"tự soạn","shuffle":false},{"type":"mcq","q":"Albert Einstein was the scientist who ___ the theory of relativity.","options":["developed","has developed"],"answer":0,"explain":"Einstein đã mất, việc **đã khép lại** và không thể lặp lại → quá khứ đơn: developed.","src":"tr. 292","shuffle":false},{"type":"fill","q":"The last time I ___ to the dentist was in March. (go)","answer":["went"],"explain":"'Lần cuối … là vào tháng Ba' → một thời điểm đã qua → quá khứ đơn: go – **went**.","src":"tr. 292"},{"type":"fill","q":"Your sister has left a message for you. She ___ an hour ago. (call)","answer":["called"],"explain":"Câu báo tin dùng hiện tại hoàn thành (has left); câu chi tiết có **an hour ago** → quá khứ đơn: called.","src":"tr. 292"},{"type":"mcq","q":"(Lúc 4 giờ chiều) I ___ two cups of coffee this morning, so I don't want any more now.","options":["drank","have drunk"],"answer":0,"explain":"Lúc nói là buổi chiều → **this morning đã trôi qua** → quá khứ đơn: drank (drink – drank – drunk). Nếu vẫn còn buổi sáng thì mới dùng have drunk.","src":"tự soạn","shuffle":false},{"type":"mcq","q":"So far I ___ to Phu Quoc only once, and I'd love to go again.","options":["have been","went"],"answer":0,"explain":"**once** đi với hiện tại hoàn thành = số lần **tính đến nay** (so far) → have been. Quá khứ đơn dùng khi once chỉ một dịp cụ thể đã qua, ví dụ *went there once, in 2019*.","src":"tự soạn","shuffle":false},{"type":"fix","wrong":"I didn't see Hoa since she moved to Australia.","answer":["I haven't seen Hoa since she moved to Australia.","I have not seen Hoa since she moved to Australia."],"explain":"**since** = từ đó **đến nay** → hiện tại hoàn thành: haven't seen. Mệnh đề sau since (she moved) nói mốc đã qua nên vẫn là quá khứ đơn.","src":"tự soạn"},{"type":"fix","wrong":"Our team has won the final two days ago.","answer":["Our team won the final two days ago."],"explain":"Có **two days ago** (thời điểm đã qua) → quá khứ đơn: won (win – won – won).","src":"tự soạn"},{"type":"mcq","q":"There has been a big storm in the north. It ___ more than 100 houses last night.","options":["damaged","has damaged"],"answer":0,"explain":"Câu đầu báo tin (has been); câu sau kể chi tiết có **last night** → quá khứ đơn: damaged.","src":"tự soạn","shuffle":false},{"type":"classify","q":"Mỗi câu thuộc nhóm nào?","buckets":["Còn liên quan đến bây giờ → hiện tại hoàn thành","Đã khép lại → quá khứ đơn"],"items":[{"text":"He has broken his arm, so he can't write.","bucket":0},{"text":"He broke his arm when he was ten.","bucket":1},{"text":"I have known her for years.","bucket":0},{"text":"Leonardo da Vinci painted the Mona Lisa.","bucket":1},{"text":"We've lived here since 2010.","bucket":0},{"text":"We lived in Hue for five years, but now we live in Hanoi.","bucket":1}],"explain":"Kết quả còn bây giờ (không viết được), kéo dài tới nay (for years, since 2010) → hiện tại hoàn thành. Có thời điểm đã qua (when he was ten), người đã mất, việc đã chấm dứt (giờ sống ở Hà Nội) → quá khứ đơn.","src":"tự soạn"},{"type":"fill","q":"What ___ when the earthquake started? (you/ do)","answer":["were you doing"],"explain":"Hỏi việc **đang diễn ra** lúc động đất xảy ra → câu hỏi quá khứ tiếp diễn: Were + you + doing.","src":"tự soạn"},{"type":"mcq","q":"He was sitting in the garden when a wasp ___ him on the nose.","options":["stung","was stinging","has stung"],"answer":0,"explain":"Ngồi trong vườn là việc nền; con ong đốt là việc **ngắn xen vào** → quá khứ đơn: stung (sting – stung – stung).","src":"tr. 290"},{"type":"fill","q":"I ___ home through the park when it suddenly started to rain. (walk)","answer":["was walking"],"explain":"Đi bộ qua công viên là **việc nền đang diễn ra**; trời đột nhiên mưa (**suddenly**) là việc xen vào → was walking.","src":"tr. 290"},{"type":"mcq","q":"Felix ___ the fire brigade when the cooker caught fire.","options":["phoned","was phoning"],"answer":0,"explain":"Bếp bắt lửa **rồi** Felix mới gọi cứu hỏa: hai việc **nối tiếp** → cả hai quá khứ đơn. was phoning sẽ hiểu là đang gọi sẵn trước khi cháy, vô lý.","src":"tr. 290","shuffle":false},{"type":"mcq","q":"While the kids ___ in the yard, their parents were chatting inside.","options":["were playing","was playing","have played"],"answer":0,"explain":"Hai việc **cùng diễn ra song song** → cả hai quá khứ tiếp diễn; **the kids** số nhiều → were playing.","src":"tự soạn"},{"type":"fix","wrong":"I was hearing a strange noise while I was reading in bed.","answer":["I heard a strange noise while I was reading in bed."],"explain":"hear là động từ **tri giác**, không dùng tiếp diễn → heard. Việc đọc sách mới là việc nền: was reading.","src":"tự soạn"},{"type":"fix","wrong":"When the guests arrived, we were still decorate the room.","answer":["When the guests arrived, we were still decorating the room."],"explain":"Việc nền đang diễn ra → were + **V-ing**: were still decorating.","src":"tự soạn"},{"type":"mcq","q":"My parents ___ in a village near Hue for twenty years before they moved to the city.","options":["lived","were living"],"answer":0,"explain":"Ở **hai mươi năm** là tình huống lâu dài, không tạm thời → quá khứ đơn: lived. Thì tiếp diễn dành cho tình huống tạm thời và không dùng để nói 'bao lâu'.","src":"tự soạn","shuffle":false},{"type":"fill","q":"Our neighbour ___ loud music late at night. We hated it! (always/ play)","answer":["was always playing"],"explain":"Việc lặp lại gây **khó chịu** → was + always + V-ing: was always playing. always đứng giữa was và V-ing.","src":"tự soạn"},{"type":"fill","q":"The film ___ when we got to the cinema, so we missed the beginning. (already/ start)","answer":["had already started","'d already started"],"explain":"Phim bắt đầu **trước** lúc chúng tôi tới (nên lỡ đoạn đầu) → had already started.","src":"tự soạn"},{"type":"mcq","q":"'Khi chúng tôi tới, bữa tiệc mới bắt đầu' (chúng tôi tới rồi tiệc mới bắt đầu). Chọn câu đúng:","options":["When we arrived, the party started.","When we arrived, the party had started."],"answer":0,"explain":"Tới **rồi** tiệc mới bắt đầu → hai việc nối tiếp → quá khứ đơn: started. *had started* nghĩa là tiệc đã bắt đầu **trước** khi chúng tôi tới.","src":"tự soạn","shuffle":false},{"type":"mcq","q":"At first I thought I had done the right thing, but I soon realised I ___ a serious mistake.","options":["had made","have made","make"],"answer":0,"explain":"Sau **realised** (quá khứ), việc phạm sai lầm xảy ra **trước** lúc nhận ra → had made. *have made* là hiện tại hoàn thành, không hợp câu kể quá khứ.","src":"tr. 294"},{"type":"fill","q":"By 1960 most of Britain's old colonies ___ independent. (become)","answer":["had become"],"explain":"**By 1960** là một mốc quá khứ; việc giành độc lập xong **trước** mốc đó → had become (become – became – **become**).","src":"tr. 294"},{"type":"fix","wrong":"When I got home, I found that someone has broken the window.","answer":["When I got home, I found that someone had broken the window."],"explain":"Câu kể quá khứ (got, found); cửa sổ bị vỡ **trước** lúc tôi phát hiện → had broken, không dùng has.","src":"tự soạn"},{"type":"fix","wrong":"I had never ate sushi before I went to Japan.","answer":["I had never eaten sushi before I went to Japan.","I'd never eaten sushi before I went to Japan."],"explain":"Sau **had** dùng V3: eat – ate – **eaten**.","src":"tự soạn"},{"type":"mcq","q":"When I ___ the dishes, I sat down and watched TV.","options":["had washed","washed","have washed"],"answer":0,"explain":"Rửa bát **xong hẳn** rồi mới sang việc khác, và rửa bát không gây ra việc xem TV → sách dùng **had + V3** sau when (như 'When I had written my letters, I did some gardening'). *washed* hợp khi việc 1 kéo theo việc 2 ngay.","src":"tr. 272"},{"type":"mcq","q":"When I opened the door, the dog ___ out.","options":["ran","had run"],"answer":0,"explain":"Mở cửa là con chó chạy ra **ngay sau đó** (việc 1 gây ra việc 2) → quá khứ đơn: ran. *had run* nghĩa là con chó đã chạy ra trước khi tôi mở cửa, vô lý.","src":"tự soạn","shuffle":false},{"type":"mcq","q":"I wish I ___ harder for the exam last month.","options":["had studied","have studied","studied"],"answer":0,"explain":"Ước về một việc **đã không xảy ra** trong quá khứ (last month) → wish + had + V3: had studied. *studied* sau wish nói về hiện tại.","src":"tự soạn"},{"type":"fill","q":"As soon as the rain ___, the children ran outside. (stop)","answer":["stopped","had stopped","'d stopped"],"explain":"Sau **as soon as**, thứ tự đã rõ nên dùng được **cả** stopped lẫn had stopped.","src":"tự soạn"},{"type":"classify","q":"Ba tình huống: (1) Tôi về tới nhà thì mẹ đã nấu xong cơm. (2) Cô ấy nhận ra mình đã quên ví. (3) Chúng tôi tới sân bay thì máy bay đã cất cánh. Mỗi việc xảy ra trước hay sau?","buckets":["Xảy ra trước → had + V3","Xảy ra sau → V2"],"items":[{"text":"(Câu 1) Mum / cook dinner","bucket":0},{"text":"(Câu 1) I / get home","bucket":1},{"text":"(Câu 2) she / forget her wallet","bucket":0},{"text":"(Câu 2) she / realize","bucket":1},{"text":"(Câu 3) the plane / take off","bucket":0},{"text":"(Câu 3) we / reach the airport","bucket":1}],"explain":"(1) When I got home, Mum had cooked dinner. (2) She realized that she had forgotten her wallet. (3) When we reached the airport, the plane had taken off. Việc xảy ra trước lùi thêm một bậc → had + V3; việc sau → V2.","src":"tự soạn"},{"type":"fill","q":"The kitchen smelled of smoke. Someone ___ fish. (fry)","answer":["had been frying","'d been frying"],"explain":"Việc rán cá **vừa kết thúc** và còn để lại dấu vết lúc đó (mùi khói, smelled) → had been frying.","src":"tự soạn"},{"type":"mcq","q":"At last the bus came. I ___ for 20 minutes.","options":["had been waiting","have been waiting","was waiting"],"answer":0,"explain":"Chờ liên tục 20 phút **tới lúc xe đến** (came, quá khứ) → had been waiting. *was waiting* không đi với 'bao lâu'; *have been waiting* là tính tới bây giờ.","src":"tr. 295"},{"type":"mcq","q":"I hope the bus comes soon. I ___ for 20 minutes.","options":["have been waiting","had been waiting","was waiting"],"answer":0,"explain":"Vẫn đang chờ **tới bây giờ** (hope … comes soon) → hiện tại hoàn thành tiếp diễn: have been waiting. had been waiting chỉ dùng khi mốc là một lúc trong quá khứ.","src":"tr. 295"},{"type":"fill","q":"Lan's clothes were dirty because she ___ in the garden. (work)","answer":["had been working","'d been working"],"explain":"Làm vườn vừa xong và còn để lại kết quả lúc đó (quần áo bẩn, were) → had been working.","src":"tự soạn"},{"type":"mcq","q":"By the time the police arrived, the thieves ___ all the jewellery.","options":["had taken","had been taking"],"answer":0,"explain":"Lấy **hết** (all) số trang sức = kết quả hoàn tất trước mốc quá khứ → had taken (take – took – **taken**).","src":"tự soạn","shuffle":false},{"type":"fix","wrong":"When they started working together, they had been knowing each other for years.","answer":["When they started working together, they had known each other for years.","When they started working together, they'd known each other for years."],"explain":"know chỉ **nhận thức**, không dùng tiếp diễn → had known (kéo dài tới một mốc quá khứ, không dùng *knew*).","src":"tự soạn"},{"type":"mcq","q":"When I woke up, my mother ___ in the kitchen for an hour.","options":["had been cooking","was cooking","has been cooking"],"answer":0,"explain":"Nấu **một tiếng** (for an hour) tới lúc tôi thức dậy → had been cooking. Có 'bao lâu' nên không dùng was cooking; *has been cooking* là tính tới bây giờ.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["She","had","been","working","there","for","ten","years","before","she","left"],"answer":["Before she left she had been working there for ten years"],"explain":"Làm việc liên tục 10 năm **trước** khi nghỉ (left) → had been working; việc xảy ra sau dùng quá khứ đơn.","src":"tự soạn"},{"type":"mcq","q":"___ been waiting long when the doctor finally called your name?","options":["Had you","Have you","Were you"],"answer":0,"explain":"Câu hỏi quá khứ hoàn thành tiếp diễn: **Had** + S + been + V-ing; mốc là lúc bác sĩ gọi tên (called, quá khứ) → Had you. *Were you been* không có cấu trúc này; *Have you been waiting* tính tới bây giờ, không hợp mốc quá khứ.","src":"tự soạn"},{"type":"classify","q":"Chỗ trống trong mỗi câu cần thì nào?","buckets":["Quá khứ đơn","Quá khứ tiếp diễn","Quá khứ hoàn thành","Quá khứ hoàn thành tiếp diễn"],"items":[{"text":"I ___ (meet) her in 2018.","bucket":0},{"text":"At 10 p.m. last night I ___ (sleep).","bucket":1},{"text":"When I got there, everyone ___ (already/ leave).","bucket":2},{"text":"She was out of breath because she ___ (run).","bucket":3},{"text":"While I ___ (shop), I lost my purse.","bucket":1},{"text":"By noon we ___ (finish) the whole job.","bucket":2}],"explain":"in 2018 → met (quá khứ đơn). Đang diễn ra lúc 10 giờ, hay làm nền cho việc xen vào → was sleeping, was shopping. Xong trước một việc/mốc quá khứ → had already left, had finished. Vừa kết thúc còn để lại dấu vết (thở hổn hển) → had been running.","src":"tự soạn"}]]}},{"id":"03-thi-tuong-lai","title":"Các thì tương lai","en":"Future tenses","icon":"⏩","pages":"275–284","summary":"Tiếng Việt chỉ cần 'sẽ' hoặc 'sắp' cho mọi chuyện tương lai, còn tiếng Anh có nhiều cách nói, mỗi cách một sắc thái. Chủ đề này dạy bạn: tương lai đơn **will/shall** (chắc chắn, dự đoán, hứa, quyết định tức thì, nhờ – mời); **be going to** (dự định có sẵn, dự đoán từ dấu hiệu) và cách chọn giữa will và going to; mượn **hiện tại tiếp diễn** (việc đã hẹn) và **hiện tại đơn** (thời gian biểu); **be to** và **be about to**; rồi ba thì 'nhìn từ tương lai': **will be V-ing**, **will have V3**, **will have been V-ing**.","mindmap":{"label":"Tương lai","children":[{"label":"will / shall","icon":"🔮","children":[{"label":"Chắc chắn, dự đoán"},{"label":"Hứa, dọa, quyết định tức thì"},{"label":"Nhờ, mời: Will you…?"},{"label":"Shall I/we…?"}]},{"label":"be going to","icon":"🧳","children":[{"label":"Dự định có sẵn"},{"label":"Dấu hiệu: It's going to rain"}]},{"label":"Mượn thì hiện tại","icon":"📅","children":[{"label":"HT tiếp diễn: đã hẹn"},{"label":"HT đơn: thời gian biểu"}]},{"label":"be to / be about to","icon":"📰","children":[{"label":"be to: chính thức, bản tin"},{"label":"be about to: sắp… ngay"}]},{"label":"will be V-ing","icon":"⏸️","children":[{"label":"Sẽ đang làm lúc đó"},{"label":"Hỏi lịch sự kế hoạch"}]},{"label":"will have V3","icon":"✅","children":[{"label":"Xong trước mốc: by…"}]},{"label":"will have been V-ing","icon":"⏳","children":[{"label":"Kéo dài liên tục đến mốc"}]}]},"lessons":[{"id":"03a","title":"Tương lai đơn will/shall","minutes":25,"goal":"Đặt đúng câu khẳng định, phủ định, câu hỏi với will/shall + động từ nguyên mẫu, và biết will dùng cho 5 việc: sự việc chắc chắn, dự đoán, lời hứa – đe dọa, quyết định tức thì, lời yêu cầu – đề nghị – mời.","pretest":[{"type":"mcq","q":"Trời đang mưa. **Tôi sẽ lấy ô.** Câu nào đúng?","options":["It's raining. I'll take an umbrella.","It's raining. I'll to take an umbrella.","It's raining. I'll taking an umbrella."],"answer":0,"explain":"Sau **will** ('ll) là động từ nguyên mẫu, không có to, không thêm -ing: I'll **take**.","src":"tr. 276"},{"type":"mcq","q":"Will you ___ at home tomorrow?","options":["be","are","to be"],"answer":0,"explain":"Sau will luôn là động từ nguyên mẫu: **be**, không chia thành are/is.","src":"tr. 275"},{"type":"mcq","q":"**Shall I carry your bag?** nghĩa là gì?","options":["Cháu xách túi giúp bà nhé?","Bà xách túi giúp cháu nhé?"],"answer":0,"explain":"**Shall I…?** là lời ngỏ ý: người nói xin làm việc đó giúp người nghe.","src":"tr. 277","shuffle":false}],"hook":{"icon":"🔮","text":"Tiếng Việt chỉ cần thêm chữ **sẽ** trước động từ: tôi sẽ đi, trời sẽ mưa. Tiếng Anh cũng có một chữ y hệt: **will**. Will không đổi theo ngôi (I will, she will), và động từ đứng sau nó giữ nguyên mẫu. Nhưng cẩn thận: không phải chữ 'sẽ' nào cũng dịch thành will. Bài này dạy will dùng vào việc gì; các bài sau dạy những cách khác để nói 'sẽ'."},"diagram":{"type":"table","title":"Thì tương lai đơn: ba thể","head":["Thể","Công thức","Ví dụ"],"rows":[["Khẳng định","I/We + will/shall + V","We'll know the results soon."],["Khẳng định","You/He/She/It/They + will + V","She will call you."],["Phủ định","S + will/shall + not + V","You won't get another chance."],["Câu hỏi","Will/Shall + S + V?","Will you be at home tomorrow?"],["Rút gọn","'ll · won't · shan't","I'll · won't · shan't"]]},"chunks":[{"title":"Công thức: will/shall + động từ nguyên mẫu","icon":"🧱","rule":"Tương lai đơn (future simple) = **will** + **động từ nguyên mẫu**, giống nhau cho mọi ngôi; **shall** chỉ đi với **I/we**.","explain":"Will không thêm -s, động từ sau nó cũng không thêm -s, -ed, -ing và không có to. Phủ định: thêm **not** sau will (will not = **won't**, shall not = **shan't**). Câu hỏi: đưa will lên trước chủ ngữ, dùng để hỏi về việc sẽ xảy ra: Where **will** you **spend** the night?\nShall cùng nghĩa với will nhưng ít dùng hơn và mang vẻ trang trọng. Người Mỹ thường không dùng shall để nói về tương lai.\nLưu ý: sau **when, as soon as, until, before, after, by the time** (mệnh đề chỉ thời gian) không dùng will mà dùng hiện tại đơn: Call me as soon as you **have** any news. Chủ đề 05 sẽ học kỹ.","formula":"S + will + V nguyên mẫu\nS + won't + V nguyên mẫu\nWill + S + V nguyên mẫu?","examples":[{"en":"We'**ll know** the results soon.","vi":"Chúng ta sẽ sớm biết kết quả."},{"en":"You **won't get** another chance.","vi":"Anh sẽ không có thêm một cơ hội nào nữa đâu."},{"en":"**Will** all the family **be** at the wedding?","vi":"Cả gia đình sẽ đến dự đám cưới chứ?"},{"en":"I **shall** see you at the meeting tomorrow.","vi":"Ngày mai tôi sẽ gặp anh tại cuộc họp. (trang trọng)"},{"en":"She will comes tomorrow.","ok":false,"note":"sau will không thêm -s → will come"},{"en":"Call me as soon as you will have any news.","ok":false,"note":"sau as soon as dùng hiện tại đơn → you have"}],"mistake":{"wrong":"He will goes to work by bus.","right":"He will go to work by bus.","why":"Chữ -s đã 'bị' will lấy mất: sau will động từ luôn nguyên mẫu."},"tip":"Sau will là động từ 'trần': không to, không -s, không -ed, không -ing.","src":"tr. 275–277","check":{"type":"fill","q":"I'm sure you ___ (not / need) a coat tomorrow.","answer":["won't need","will not need","aren't going to need","are not going to need"],"explain":"Phủ định tương lai đơn: **won't / will not + V nguyên mẫu**: won't need. Shall không đi với you.","src":"tự soạn"}},{"title":"Sự việc chắc chắn và dự đoán","icon":"🔭","rule":"Dùng **will** cho sự việc **chắc chắn** sẽ xảy ra, và cho **ý kiến, dự đoán** của người nói về tương lai.","explain":"Sự việc chắc chắn: ngày tháng, tuổi tác, việc ai cũng biết sẽ đến. Dự đoán: điều mình nghĩ, đoán, phỏng đoán, nhiều khi dựa vào kinh nghiệm. Người Việt hay bỏ chữ 'sẽ' rồi nói 'I think it rains tomorrow'; tiếng Anh nói về tương lai thì phải có will.\nCác từ hay đi với will: **definitely, certainly** (chắc chắn), **probably** (chắc là), **possibly** (có lẽ), **someday** (một ngày nào đó), **tomorrow, next week, next month, soon**. Probably đứng sau will: I'll **probably** be home late.","examples":[{"en":"I **will be** at high school next year.","vi":"Năm sau tôi sẽ học trung học."},{"en":"My birthday **will fall** on a Tuesday in 2017.","vi":"Năm 2017, sinh nhật tôi sẽ rơi vào ngày thứ Ba."},{"en":"I think the DVD **will disappear** in ten years.","vi":"Tôi cho là 10 năm nữa DVD sẽ biến mất."},{"en":"Tom **won't pass** the examination. He hasn't worked hard enough for it.","vi":"Tom sẽ không thi đậu. Anh ấy đã không học hành chăm chỉ."},{"en":"One day people **will travel** to Mars.","vi":"Ngày nào đó con người sẽ lên đến Sao Hỏa."},{"en":"I think he passes the exam next week.","ok":false,"note":"đoán về tương lai → he will pass"}],"tip":"Thấy I think, probably, definitely, someday, soon… nói về tương lai → nghĩ ngay tới will.","src":"tr. 276–277"},{"title":"Lời hứa, lời đe dọa, quyết định tức thì","icon":"⚡","rule":"Dùng **will** cho **lời hứa**, **lời đe dọa**, và **quyết định ngay lúc đang nói**.","explain":"Quyết định tức thì: trước đó bạn chưa hề định, nghe hoặc thấy chuyện gì đó và quyết luôn. Tiếng Việt hay nói 'để tôi giúp', 'thôi tôi mua' mà không có chữ 'sẽ', nên người Việt dễ nói 'I help you'. Tiếng Anh cần will: **I'll help** you.\nSách nhấn mạnh: will **không** dùng cho quyết định đã có sẵn hay dự định từ trước. Điều đó có cách nói riêng, học ở bài 03b.","examples":[{"en":"I'**ll do** my best to help you.","vi":"Tôi sẽ cố hết sức giúp anh. (lời hứa)"},{"en":"The next time you do that I'**ll send** you out of the room.","vi":"Em làm thế lần nữa là tôi đuổi em ra khỏi phòng đấy. (lời đe dọa)"},{"en":"I can't do this. ~ Don't worry. I'**ll help** you.","vi":"Tôi không làm được việc này. ~ Đừng lo. Tôi sẽ giúp anh."},{"en":"You can have it for half price. ~ OK, I'**ll buy** it.","vi":"Anh có thể mua với nửa giá. ~ Được rồi, tôi sẽ mua."},{"en":"I can't do this. ~ Don't worry. I help you.","ok":false,"note":"quyết định ngay lúc nói → I'll help"}],"mistake":{"wrong":"I promise I call you tonight.","right":"I promise I'll call you tonight.","why":"Lời hứa về tương lai cần will, dù tiếng Việt có thể bỏ chữ 'sẽ'."},"tip":"Ý định vừa nảy ra trong đầu, nói ngay → I'll…","src":"tr. 276"},{"title":"Yêu cầu, đề nghị, lời mời; Shall I/we…?","icon":"🙋","rule":"**Will you…?** để nhờ hoặc mời; **I'll…** để ngỏ ý giúp; **Shall I/we…?** để đề nghị, gợi ý hoặc xin lời khuyên.","explain":"Đây là chỗ shall còn hay gặp nhất: câu hỏi với **I** hoặc **we**. Shall I…? = tôi làm việc này giúp bạn nhé? Shall we…? = mình cùng làm việc này nhé? What shall we…? = mình nên làm gì? Không dùng shall với you, he, she, they.","examples":[{"en":"**Will** you **carry** this bag for me, please?","vi":"Anh xách hộ tôi cái túi này nhé? (yêu cầu)"},{"en":"I'**ll hold** the door open for you.","vi":"Để tôi mở cửa cho cô. (đề nghị giúp)"},{"en":"**Will** you **have** some more tea?","vi":"Anh dùng thêm trà nhé? (lời mời)"},{"en":"**Shall I** carry your bag? ~ Oh, thanks.","vi":"Cháu xách túi giúp bà nhé? ~ Ồ, cám ơn cháu."},{"en":"**Shall we** go to the cinema tonight?","vi":"Tối nay chúng ta đi xem phim nhé?"},{"en":"What **shall we** do this weekend?","vi":"Cuối tuần này chúng ta sẽ làm gì đây?"},{"en":"Shall you carry this bag for me?","ok":false,"note":"shall chỉ đi với I/we → Will you…?"}],"tip":"Shall đi với **I/we**; nhờ người khác thì **Will you…?**","src":"tr. 277"}],"practice":[{"type":"mcq","q":"Chọn câu đúng:","options":["The Conference will open on Sunday evening.","The Conference will opens on Sunday evening.","The Conference will to open on Sunday evening."],"answer":0,"explain":"Sau will là động từ nguyên mẫu: will **open**. Không thêm -s, không có to.","src":"tr. 276"},{"type":"classify","q":"Mỗi câu dùng will để làm gì?","buckets":["Lời hứa / đe dọa","Quyết định tức thì","Yêu cầu / mời"],"items":[{"text":"I won't tell anyone. I promise.","bucket":0},{"text":"Stop that or I'll call the police!","bucket":0},{"text":"This shirt is nice. ~ OK, I'll take it.","bucket":1},{"text":"There's no milk. ~ Really? I'll buy some on my way home.","bucket":1},{"text":"Will you open the window, please?","bucket":2},{"text":"Will you have some more cake?","bucket":2}],"explain":"Hứa / dọa: nói trước điều mình sẽ làm (I promise; …or I'll call the police). Quyết định tức thì: vừa nghe tin là quyết luôn (OK, I'll take it). **Will you…?** để nhờ (open the window) hoặc mời (have some more cake).","src":"tự soạn"},{"type":"fill","q":"I think it ___ (rain) tomorrow.","answer":["will rain","'ll rain"],"explain":"**I think** + dự đoán về tương lai → will + V: will rain. Đừng bỏ will như tiếng Việt ('mai trời mưa').","src":"tự soạn"},{"type":"fill","q":"___ you be at home this evening?","answer":["Will"],"explain":"Hỏi về việc sẽ xảy ra: **Will** + S + V? Shall không đi với you.","src":"tr. 275"},{"type":"fill","q":"Don't worry. We ___ (not / be) late.","answer":["won't be","will not be","shan't be","shall not be","aren't going to be","are not going to be"],"explain":"Phủ định: **won't be** (will not be). Với we có thể dùng shan't (shall not), nhưng won't thông dụng hơn.","src":"tự soạn"},{"type":"mcq","q":"Bạn muốn ngỏ ý: **Để tôi bế em bé giúp chị nhé?**","options":["Shall I hold the baby?","Will I hold the baby?","Shall you hold the baby?"],"answer":0,"explain":"Ngỏ ý giúp đỡ bằng câu hỏi → **Shall I…?** Will I…? không dùng để ngỏ ý; shall không đi với you.","src":"tr. 277"},{"type":"mcq","q":"A: I've lost my pen.\nB: ___","options":["Don't worry. I'll lend you mine.","Don't worry. I lend you mine.","Don't worry. I'll to lend you mine."],"answer":0,"explain":"B quyết định ngay lúc nghe A nói → **will + V nguyên mẫu**: I'll lend. 'I lend' thiếu will; 'I'll to lend' thừa to.","src":"tự soạn"},{"type":"fix","wrong":"She will calls you tonight.","answer":["She will call you tonight.","She'll call you tonight."],"explain":"Sau will là động từ nguyên mẫu: will **call**, bỏ -s.","src":"tự soạn"},{"type":"fix","wrong":"I think he win the match.","answer":["I think he will win the match.","I think he'll win the match.","I think he's going to win the match.","I think he is going to win the match."],"explain":"Dự đoán về tương lai → **will win**. Câu sai bỏ will (bắt chước 'tôi nghĩ anh ấy thắng') và cũng không chia được động từ.","src":"tự soạn"},{"type":"fix","wrong":"Call me as soon as you will get home.","answer":["Call me as soon as you get home."],"explain":"Sau **as soon as** (mệnh đề chỉ thời gian) không dùng will; dùng hiện tại đơn: as soon as you **get** home.","src":"tr. 277"},{"type":"order","q":"Sắp xếp thành lời nhờ vả:","words":["Will","you","carry","this","bag","for","me?"],"explain":"Lời yêu cầu: **Will you + V nguyên mẫu…?**","src":"tr. 277"},{"type":"order","q":"Sắp xếp thành câu hỏi xin ý kiến:","words":["What","shall","we","do","this","weekend?"],"explain":"Hỏi ý kiến, gợi ý: **What shall we + V?**","src":"tr. 277"}],"flashcards":[{"front":"Sau **will** là dạng động từ nào?","back":"Nguyên mẫu không to: She **will call** you."},{"front":"will not, shall not rút gọn thành gì?","back":"**won't**, **shan't**"},{"front":"**shall** đi với chủ ngữ nào?","back":"Chỉ **I / we**: Shall I carry your bag? Shall we go?"},{"front":"Quyết định ngay lúc đang nói: dùng gì?","back":"**will**: It's raining. I'll take an umbrella."},{"front":"Will dùng cho 5 việc nào?","back":"Sự việc chắc chắn · dự đoán · hứa / dọa · quyết định tức thì · yêu cầu / đề nghị / mời"}]},{"id":"03b","title":"be going to; will hay be going to","minutes":25,"goal":"Dùng be going to cho dự định có sẵn và cho dự đoán dựa vào dấu hiệu trước mắt; chọn đúng giữa will và be going to.","pretest":[{"type":"mcq","q":"Nhìn đám mây đen kia! **Trời sắp mưa rồi.**","options":["It's going to rain.","It rains.","It's raining."],"answer":0,"explain":"Dự đoán dựa vào dấu hiệu đang thấy (mây đen) → **be going to**: It's going to rain. 'It's raining' là đang mưa rồi.","src":"tr. 283"},{"type":"mcq","q":"A: Why did you buy all this paint? (B đã định sơn bếp từ tuần trước)\nB: I ___ the kitchen.","options":["'m going to paint","'ll paint"],"answer":0,"explain":"Việc đã định từ trước → **be going to**. Will chỉ dùng cho quyết định vừa đưa ra lúc nói.","src":"tự soạn","shuffle":false}],"hook":{"icon":"🧳","text":"Tiếng Việt dùng chung chữ **sẽ** cho mọi kiểu tương lai. Tiếng Anh tách ra. Điều bạn **đã tính trước** (như chiếc vali đã xếp sẵn) → **be going to**. Điều bạn **vừa quyết** ngay lúc nói → **will**. Dự đoán cũng thế: thấy **dấu hiệu trước mắt** (mây đen kéo tới) → be going to; chỉ là **ý kiến, kinh nghiệm** → will."},"diagram":{"type":"flow","title":"Chọn will hay be going to?","start":{"q":"Bạn đang nói gì về tương lai?","branches":[{"label":"Một quyết định / dự định","to":{"q":"Đã tính từ trước chưa?","branches":[{"label":"Rồi, đã định sẵn","to":{"result":"be going to: We're going to eat out.","icon":"🧳"}},{"label":"Chưa, vừa quyết lúc nói","to":{"result":"will: OK, we'll eat out then.","icon":"⚡"}}]}},{"label":"Một dự đoán","to":{"q":"Dựa vào đâu?","branches":[{"label":"Dấu hiệu đang thấy, nghe","to":{"result":"be going to: It's going to rain.","icon":"🌧️"}},{"label":"Ý kiến, kinh nghiệm","to":{"result":"will: It'll probably rain.","icon":"💭"}}]}}]}},"chunks":[{"title":"be going to: dự định có sẵn","icon":"🧳","rule":"**am/is/are + going to + V nguyên mẫu** nói về **dự định đã có sẵn**, sẽ làm trong tương lai gần.","explain":"Khác will, chữ **be** phải chia theo chủ ngữ: I **am**, he **is**, we **are**. 'going to' ở đây không có nghĩa là 'đi', mà là 'sắp, sẽ, định'. Phủ định và câu hỏi làm như với be bình thường: She **isn't** going to come. **Are** you going to see…?\nSách lưu ý: be going to **thường không dùng với go và come**. Muốn nói kế hoạch đi đâu, đến đâu, dùng hiện tại tiếp diễn: We **are going** to the movies tonight (bài 03c học kỹ).","formula":"S + am/is/are + going to + V nguyên mẫu\nAm/Is/Are + S + going to + V?","examples":[{"en":"I'**m going to look** for a new place to live next month.","vi":"Tháng sau tôi sẽ tìm chỗ ở mới."},{"en":"**Are** you **going to see** the concert tomorrow?","vi":"Ngày mai anh có đi xem hòa nhạc không?"},{"en":"He'**s going to work** in the USA this summer.","vi":"Mùa hè này anh ấy sẽ đi Mỹ làm việc."},{"en":"We **are going** to the movies tonight.","vi":"Tối nay chúng tôi sẽ đi xem phim. (go → không dùng going to go)"},{"en":"I going to look for a new flat.","ok":false,"note":"thiếu be → I'm going to"}],"mistake":{"wrong":"She going to buy a car.","right":"She's going to buy a car.","why":"Tiếng Việt 'cô ấy định mua' không có 'là'; tiếng Anh bắt buộc có is."},"src":"tr. 282"},{"title":"be going to: dự đoán từ dấu hiệu trước mắt","icon":"👀","rule":"Thấy hoặc nghe **dấu hiệu ngay trước mắt** → dự đoán bằng **be going to**; việc **sắp xảy ra chắc chắn** ngay lúc đó cũng dùng be going to, không dùng will.","explain":"Dấu hiệu: cái bụng bầu, con tàu lao về phía đá, cú chuyền bóng đẹp. Câu kêu cứu 'Help! Tôi sắp ngã!' cũng thế: việc đang tới rất gần và gần như chắc chắn, nên sách không cho dùng will.","examples":[{"en":"She's pregnant – she'**s going to have** a baby.","vi":"Cô ấy đang mang thai – cô ấy sắp sinh rồi."},{"en":"She's pregnant – she'll have a baby.","ok":false,"note":"có dấu hiệu rõ → going to"},{"en":"Look at that ship! It'**s going to hit** the rocks!","vi":"Nhìn con tàu đó kìa! Nó sắp va vào đá rồi!"},{"en":"And Beckham passes to Owen. He'**s going to score**. Goal!","vi":"Rồi Beckham chuyền cho Owen. Anh ấy sắp ghi bàn. Vào rồi!"},{"en":"Help! I'**m going to fall**!","vi":"Giúp tôi với! Tôi sắp té rồi!"},{"en":"Help! I'll fall!","ok":false,"note":"sắp xảy ra chắc chắn → I'm going to fall"}],"tip":"Có chữ **Look! / Listen! / Help!** hoặc có bằng chứng trước mặt → going to.","src":"tr. 282–283"},{"title":"will hay be going to?","icon":"⚖️","rule":"Quyết định **ngay lúc nói** → **will**; đã quyết, đã định **từ trước** → **be going to**. Dự đoán theo **ý kiến, kinh nghiệm** → **will**; theo **tình huống hiện tại** → **be going to**.","explain":"Cả hai đều dịch là 'sẽ', nên người Việt hay dùng lẫn. Hãy tự hỏi: ý này có **từ trước** câu nói không? Có → going to. Vừa nảy ra → will. Với dự đoán: có **bằng chứng** nhìn thấy được không? Có → going to. Chỉ là mình nghĩ → will.","examples":[{"en":"I don't feel like cooking tonight. ~ Well, we'**ll eat** out then.","vi":"Tối nay em không muốn nấu nướng. ~ Được rồi, vậy chúng ta sẽ ăn tiệm."},{"en":"I don't feel like cooking tonight. ~ Well, we are going to eat out then.","ok":false,"note":"vừa quyết lúc nói → we'll"},{"en":"We **are going to eat** out tonight.","vi":"Tối nay chúng tôi sẽ đi ăn tiệm. (đã tính từ trước)"},{"en":"It'**ll** probably **rain** at the weekend.","vi":"Cuối tuần này chắc sẽ mưa. (ý kiến)"},{"en":"Look at those clouds. It'**s going to rain**.","vi":"Nhìn những đám mây kìa. Trời sắp mưa rồi. (dấu hiệu)"}],"tip":"Đáp lại ngay bằng **OK / Well / Don't worry…** → thường là will.","src":"tr. 282–283","check":{"type":"mcq","q":"A: The phone's ringing.\nB: ___","options":["I'll answer it.","I'm going to answer it."],"answer":0,"explain":"B quyết định ngay khi nghe chuông → **will**. Going to dành cho việc đã định từ trước.","src":"tự soạn","shuffle":false}}],"practice":[{"type":"mcq","q":"Chọn câu đúng:","options":["He's going to work in the USA this summer.","He going to work in the USA this summer.","He's going to working in the USA this summer."],"answer":0,"explain":"**is going to + V nguyên mẫu**: phải có is, và sau to là work (không -ing).","src":"tr. 282"},{"type":"classify","q":"Tình huống nào dùng will, tình huống nào dùng be going to?","buckets":["will","be going to"],"items":[{"text":"Bạn vừa nghe bạn cùng phòng nói hết sữa: 'Tôi sẽ đi mua.'","bucket":0},{"text":"Bạn đã quyết từ tuần trước: 'Tháng sau tôi sẽ học bơi.'","bucket":1},{"text":"Nhìn bầu trời đen kịt: 'Trời sắp mưa.'","bucket":1},{"text":"Ý kiến riêng: 'Tôi nghĩ cô ấy sẽ thích món quà.'","bucket":0},{"text":"Hứa với mẹ: 'Con sẽ gọi về mỗi tuần.'","bucket":0},{"text":"Thấy cậu bé leo cao, chao đảo: 'Nó sắp ngã!'","bucket":1}],"explain":"will: quyết định tức thì (đi mua sữa), ý kiến (tôi nghĩ…), lời hứa. be going to: dự định có sẵn (đã quyết học bơi), dự đoán từ dấu hiệu (trời đen, cậu bé chao đảo).","src":"tự soạn"},{"type":"fill","q":"Look at those black clouds! It ___ (rain).","answer":["is going to rain","'s going to rain"],"explain":"Dấu hiệu trước mắt (mây đen) → **be going to**: It's going to rain.","src":"tr. 283"},{"type":"fill","q":"I don't feel like cooking tonight. ~ OK, we ___ (eat) out then.","answer":["will eat","'ll eat"],"explain":"Quyết định ngay lúc nghe (chữ **then**: vậy thì) → **will**. Sách ghi rõ không dùng 'we are going to eat out then'.","src":"tr. 282"},{"type":"fill","q":"We've saved enough money, and we decided last week. We ___ (buy) a new car next month.","answer":["are going to buy","'re going to buy","are buying","'re buying"],"hint":"đã quyết từ trước","explain":"Quyết định đã có từ tuần trước → **be going to**: we're going to buy. (Hiện tại tiếp diễn 'we're buying' cũng đúng, bài 03c sẽ học.) Không dùng will cho dự định có sẵn.","src":"tự soạn"},{"type":"mcq","q":"Look out! That car ___ the dog!","options":["is going to hit","will hit","hits"],"answer":0,"explain":"Việc sắp xảy ra ngay trước mắt, gần như chắc chắn → **be going to**. Sách không dùng will trong tình huống này.","src":"tr. 283"},{"type":"mcq","q":"Theo sách, câu nào tự nhiên hơn khi nói kế hoạch tối nay?","options":["We're going to the cinema tonight.","We're going to go to the cinema tonight."],"answer":0,"explain":"Sách lưu ý: be going to **thường không dùng với go và come**; nói kế hoạch đi đâu thì dùng hiện tại tiếp diễn: We're going to the cinema.","src":"tr. 282","shuffle":false},{"type":"fix","wrong":"She going to visit her grandparents this weekend.","answer":["She's going to visit her grandparents this weekend.","She is going to visit her grandparents this weekend."],"explain":"be going to phải có **be** chia theo chủ ngữ: she **is** going to.","src":"tự soạn"},{"type":"fix","wrong":"Look at Tom's face. He will cry.","answer":["Look at Tom's face. He's going to cry.","Look at Tom's face. He is going to cry."],"explain":"Dự đoán dựa vào dấu hiệu đang thấy (khuôn mặt Tom) → **be going to**, không dùng will.","src":"tự soạn"},{"type":"fix","wrong":"Are you going to sells your old car?","answer":["Are you going to sell your old car?"],"explain":"Sau **going to** là động từ nguyên mẫu: going to **sell**, không thêm -s.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu hỏi:","words":["Are","you","going","to","see","the","concert","tomorrow?"],"explain":"Câu hỏi: **Are + you + going to + V**…?","src":"tr. 282"},{"type":"order","q":"Sắp xếp thành câu nói về dự định:","words":["I'm","going","to","look","for","a","new","job","next","month."],"explain":"**I'm going to + V**: dự định đã có sẵn.","src":"tự soạn"}],"flashcards":[{"front":"Công thức **be going to**?","back":"S + **am/is/are + going to + V**: I'm going to look for a new flat."},{"front":"Dự đoán khi thấy dấu hiệu trước mắt?","back":"**be going to**: Look at those clouds. It's going to rain."},{"front":"Quyết định ngay lúc nói: will hay going to?","back":"**will**: ~ Well, we'll eat out then."},{"front":"Dự định đã có từ trước: will hay going to?","back":"**be going to**: We're going to eat out tonight."},{"front":"Kế hoạch với **go / come**: sách khuyên dùng gì?","back":"Hiện tại tiếp diễn: We're going to the movies tonight. My brother is coming on the weekend."}]},{"id":"03c","title":"Hiện tại tiếp diễn, hiện tại đơn cho tương lai; be to, be about to","minutes":25,"goal":"Dùng hiện tại tiếp diễn cho việc đã sắp xếp, hiện tại đơn cho thời gian biểu, be to cho kế hoạch chính thức (văn trang trọng) và be about to cho việc sắp xảy ra ngay.","pretest":[{"type":"mcq","q":"Theo lịch tàu: The train ___ at 11.15 tomorrow.","options":["leaves","leave","is leave"],"answer":0,"explain":"Thời gian biểu → **hiện tại đơn**, ngôi thứ ba số ít thêm -s: leaves.","src":"tr. 283"},{"type":"mcq","q":"Đừng ra ngoài bây giờ – **chúng ta sắp ăn trưa rồi**.","options":["we're about to have lunch","we're about to having lunch","we about to have lunch"],"answer":0,"explain":"**be about to + V nguyên mẫu** = sắp sửa (ngay bây giờ): we're about to have.","src":"tr. 284"}],"hook":{"icon":"📅","text":"Mở sổ lịch hẹn: 'Thứ Bảy, gặp Larry'. Việc **đã sắp xếp** → tiếng Anh dùng **hiện tại tiếp diễn**: *I'm seeing Larry on Saturday*. Nhìn bảng giờ tàu: 'Tàu chạy 11 giờ 15' → **hiện tại đơn**: *The train leaves at 11.15*. Tiếng Việt vẫn nói 'sẽ', nhưng tiếng Anh lại mượn thì hiện tại. Còn 'sắp… rồi' (ngay lúc này) thì là **be about to**."},"diagram":{"type":"flow","title":"Nói về tương lai: chọn dạng nào?","start":{"q":"Việc tương lai đó thuộc loại nào?","branches":[{"label":"Thời gian biểu cố định","to":{"result":"HT đơn: The train leaves at 11.15.","icon":"🚆"}},{"label":"Đã hẹn, đã sắp xếp","to":{"result":"HT tiếp diễn: I'm seeing Larry.","icon":"📅"}},{"label":"Dự định, chưa sắp xếp","to":{"result":"be going to: I'm going to see him.","icon":"🧳"}},{"label":"Kế hoạch chính thức, bản tin","to":{"result":"be to: The President is to visit…","icon":"📰"}},{"label":"Sắp xảy ra ngay","to":{"result":"be about to: The bus is about to leave.","icon":"⏱️"}}]}},"chunks":[{"title":"Hiện tại tiếp diễn: việc đã sắp xếp","icon":"📅","rule":"Dùng **hiện tại tiếp diễn** (am/is/are + V-ing) cho **sắp xếp cá nhân** trong tương lai gần (hẹn gặp ai, đi đâu, làm gì), nhất là khi đã định **thời gian, nơi chốn**.","explain":"Hình thức giống hệt 'đang làm' ở chủ đề 01, nên câu cần có từ chỉ tương lai (this evening, on Saturday, next summer) để người nghe hiểu là 'sẽ'. Đây cũng là cách sách khuyên dùng với **go** và **come** thay cho be going to.","examples":[{"en":"What **are** you **doing** this evening? ~ I'**m doing** my homework.","vi":"Tối nay bạn sẽ làm gì? ~ Tôi sẽ làm bài tập về nhà."},{"en":"I'**m seeing** Larry on Saturday.","vi":"Thứ Bảy này tôi sẽ gặp Larry."},{"en":"We'**re travelling** round France next summer.","vi":"Hè năm sau chúng tôi sẽ đi vòng quanh nước Pháp."},{"en":"My brother **is coming** to see me on the weekend.","vi":"Cuối tuần này anh trai tôi sẽ đến thăm tôi."},{"en":"I meet Ann at six o'clock tonight.","ok":false,"note":"hẹn đã sắp xếp → I'm meeting"}],"tip":"Viết được vào sổ lịch hẹn → am/is/are + V-ing.","src":"tr. 282–283"},{"title":"Hiện tại tiếp diễn hay be going to?","icon":"🤝","rule":"Khi nói về dự định, hai dạng thường **dùng thay nhau được**; nhưng **chưa sắp xếp cố định** → **be going to**, **đã sắp xếp cố định** → **hiện tại tiếp diễn**.","explain":"be going to: ý định còn nằm trong đầu, chưa hẹn được với ai. Hiện tại tiếp diễn: đã chốt với người khác, thường có giờ giấc cụ thể.","examples":[{"en":"I'**m meeting** / I'**m going to meet** Ann at six o'clock.","vi":"Tôi sẽ gặp Ann lúc 6 giờ. (cả hai đều được)"},{"en":"We'**re visiting** / We'**re going to visit** friends at the weekend.","vi":"Cuối tuần này chúng tôi sẽ đến nhà bạn chơi."},{"en":"I'**m going to see** my tutor about my test results.","vi":"Tôi sẽ gặp giáo viên phụ đạo để hỏi kết quả thi. (mới là dự định, thầy có thể chưa biết)"},{"en":"I'**m seeing** my tutor about my test results on Monday at nine.","vi":"Thứ Hai, lúc 9 giờ tôi sẽ gặp giáo viên phụ đạo để hỏi kết quả thi. (đã hẹn với thầy)"}],"tip":"Đã hẹn xong, có giờ → V-ing. Mới tính trong đầu → going to.","src":"tr. 283"},{"title":"Hiện tại đơn: thời gian biểu","icon":"🚆","rule":"Dùng **hiện tại đơn** cho tương lai khi nói về **thời gian biểu** (tàu xe, rạp hát…), chương trình hoặc kế hoạch đã cố định theo lịch.","explain":"Bạn đã gặp cách dùng này ở bài 01a. Giờ tàu chạy, giờ phim chiếu, ngày khai giảng đều đã ghi trên lịch, không ai đổi được, nên tiếng Anh coi như một sự thật và dùng hiện tại đơn. Nhớ thêm -s/-es cho ngôi thứ ba số ít.","examples":[{"en":"The conference **begins** on Tuesday at 10.00.","vi":"Hội nghị khai mạc vào thứ Ba, lúc 10 giờ."},{"en":"The train **leaves** at 11.15 and **arrives** at 12.35.","vi":"Chuyến tàu sẽ rời ga lúc 11 giờ 15 và đến nơi lúc 12 giờ 35."},{"en":"I **start** my new job tomorrow.","vi":"Ngày mai tôi sẽ bắt đầu công việc mới."},{"en":"**Are** you on duty next weekend?","vi":"Cuối tuần sau anh có đi làm không?"},{"en":"The film start at eight tonight.","ok":false,"note":"ngôi thứ ba số ít → starts"}],"src":"tr. 283–284"},{"title":"be to và be about to","icon":"📰","rule":"**be to + V** nói về kế hoạch đã sắp xếp **chính thức** (văn trang trọng, bản tin); **be about to + V** nói về việc **sắp xảy ra ngay**.","explain":"be about to = 'sắp… rồi' (rất gần, ngay lúc này). Thêm **just** để nhấn mạnh 'sắp sửa': is **just about to** start = is **just going to** start.\nCả hai cũng dùng được ở quá khứ: **was to** go = đáng lẽ/đã định sẽ đi; **was about to** go = lúc đó sắp sửa đi thì…","formula":"S + am/is/are + to + V (trang trọng)\nS + am/is/are + (just) about to + V","examples":[{"en":"The President **is to visit** Nigeria next month.","vi":"Tổng thống sẽ đến thăm Nigeria vào tháng tới."},{"en":"We **are to get** a 10 per cent wage rise in June.","vi":"Chúng ta sẽ được tăng lương 10% vào tháng Sáu."},{"en":"Hurry up. The bus **is about to leave**.","vi":"Nhanh lên nào. Xe buýt sắp chạy rồi kìa."},{"en":"The performance **is just about to start**.","vi":"Buổi diễn sắp bắt đầu rồi."},{"en":"Daniel fell ill on the day he **was to go** for a job interview.","vi":"Daniel ngã bệnh ngay cái ngày anh ấy sẽ đi phỏng vấn xin việc."},{"en":"I **was about to go** to bed when the phone rang.","vi":"Tôi sắp sửa đi ngủ thì chuông điện thoại reng lên."},{"en":"The bus is about to leaving.","ok":false,"note":"about to + V nguyên mẫu → leave"}],"mistake":{"wrong":"Hurry up. The bus is about leave.","right":"Hurry up. The bus is about to leave.","why":"Cụm cố định là **be about to** + V: không bỏ to."},"src":"tr. 284"}],"practice":[{"type":"classify","q":"Mỗi câu dùng hiện tại để nói tương lai theo cách nào?","buckets":["HT tiếp diễn (đã sắp xếp)","HT đơn (thời gian biểu)"],"items":[{"text":"I'm having dinner with Mai on Friday.","bucket":0},{"text":"The museum opens at 9 a.m. tomorrow.","bucket":1},{"text":"Our flight leaves at 6.30 tomorrow morning.","bucket":1},{"text":"We're moving to a new flat next week.","bucket":0},{"text":"The match starts at 7.45 tonight.","bucket":1},{"text":"She's getting married in June.","bucket":0}],"explain":"Hẹn ăn tối, chuyển nhà, cưới: sắp xếp cá nhân → am/is/are + V-ing. Giờ mở cửa bảo tàng, giờ bay, giờ trận đấu: thời gian biểu → hiện tại đơn.","src":"tự soạn"},{"type":"mcq","q":"Bạn **đã hẹn** gặp Ann lúc 7 giờ tối nay. Câu nào đúng?","options":["I'm meeting Ann at seven tonight.","I meet Ann at seven tonight.","I'm meet Ann at seven tonight."],"answer":0,"explain":"Hẹn đã sắp xếp → **hiện tại tiếp diễn**: I'm meeting. Hiện tại đơn chỉ dành cho thời gian biểu; 'I'm meet' thiếu -ing.","src":"tr. 283"},{"type":"fill","q":"The film is about ___ start. Let's go in.","answer":["to"],"explain":"Cụm cố định **be about to + V**: is about **to** start.","src":"tr. 284"},{"type":"fill","q":"The bus ___ (leave) at 8.15 tomorrow morning, so don't be late. (giờ chạy in trên bảng giờ xe)","answer":["leaves"],"hint":"thời gian biểu","explain":"Thời gian biểu tàu xe → **hiện tại đơn**: the bus **leaves**.","src":"tr. 283"},{"type":"fill","q":"What ___ (you / do) this Saturday? ~ I'm visiting my grandmother.","answer":["are you doing","will you be doing"],"explain":"Hỏi về sắp xếp đã có → **hiện tại tiếp diễn**: What **are you doing**…? Câu trả lời cũng dùng V-ing.","src":"tr. 283"},{"type":"mcq","q":"Bản tin: **Thủ tướng sẽ thăm Nhật Bản vào tuần tới.** Cách nói trang trọng kiểu bản tin:","options":["The Prime Minister is to visit Japan next week.","The Prime Minister is about to visit Japan next week.","The Prime Minister is to visiting Japan next week."],"answer":0,"explain":"Kế hoạch chính thức, văn bản tin → **be to + V**. be about to chỉ việc sắp xảy ra ngay, không hợp với 'next week'; 'is to visiting' sai vì sau to là V nguyên mẫu.","src":"tr. 284"},{"type":"mcq","q":"Bạn **mới định** gặp thầy phụ đạo để hỏi kết quả, **chưa hẹn** ngày giờ. Câu nào đúng theo sách?","options":["I'm going to see my tutor about my results.","I'm seeing my tutor about my results."],"answer":0,"explain":"Chưa có sắp xếp cố định → **be going to**. Hiện tại tiếp diễn dành cho việc đã hẹn xong.","src":"tr. 283","shuffle":false},{"type":"fix","wrong":"Quick! The shop is about close.","answer":["Quick! The shop is about to close."],"explain":"**be about to + V**: thiếu to.","src":"tự soạn"},{"type":"fix","wrong":"The concert start at 8 p.m. tomorrow.","answer":["The concert starts at 8 p.m. tomorrow."],"explain":"Thời gian biểu → hiện tại đơn, chủ ngữ the concert (ngôi thứ ba số ít) → **starts**.","src":"tự soạn"},{"type":"fix","wrong":"Sorry, I can't come. I am work late tomorrow.","answer":["Sorry, I can't come. I am working late tomorrow.","Sorry, I can't come. I'm working late tomorrow."],"explain":"Việc đã sắp xếp → **am + V-ing**: am **working**.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu:","words":["I","was","about","to","go","to","bed","when","the","phone","rang."],"explain":"**was about to + V** = lúc đó sắp sửa làm gì thì việc khác xảy ra.","src":"tr. 284"},{"type":"order","q":"Sắp xếp thành câu về việc đã sắp xếp:","words":["My","parents","are","coming","to","see","me","on","Sunday."],"explain":"come + kế hoạch → hiện tại tiếp diễn: are **coming**.","src":"tự soạn"}],"flashcards":[{"front":"Hẹn đã sắp xếp (có giờ, có nơi): dùng thì nào?","back":"**HT tiếp diễn**: I'm seeing Larry on Saturday."},{"front":"Thời gian biểu tàu xe, rạp hát: dùng thì nào?","back":"**HT đơn**: The train leaves at 11.15."},{"front":"**be to + V** dùng khi nào?","back":"Kế hoạch chính thức, văn trang trọng, bản tin: The President is to visit Nigeria next month."},{"front":"'Sắp… rồi' (ngay bây giờ) nói thế nào?","back":"**be (just) about to + V**: The bus is about to leave."},{"front":"Dự định chưa sắp xếp: HT tiếp diễn hay going to?","back":"**be going to**: I'm going to see my tutor."}]},{"id":"03d","title":"Tương lai tiếp diễn","minutes":25,"goal":"Dùng will be + V-ing cho việc sẽ đang diễn ra tại một lúc trong tương lai, làm nền cho việc khác, kéo dài tạm thời, theo kế hoạch, và để hỏi lịch sự; biết khi nào không được dùng.","pretest":[{"type":"mcq","q":"Tầm này tuần sau, **tôi đang nằm** trên bãi biển.","options":["This time next week, I'll be lying on the beach.","This time next week, I'll lie on the beach."],"answer":0,"explain":"'Sẽ đang' làm gì tại một thời điểm tương lai → **will be + V-ing**.","src":"tr. 278","shuffle":false},{"type":"mcq","q":"Câu nào đúng?","options":["All the family will be there.","All the family will be being there."],"answer":0,"explain":"Không dùng tương lai tiếp diễn với **be**: dùng tương lai đơn will be there.","src":"tr. 279"}],"hook":{"icon":"🎬","text":"Hãy tưởng tượng bạn bấm **tạm dừng** một đoạn phim của tương lai: 8 giờ tối mai, khung hình cho thấy Sue **đang** làm bài tập. Tiếng Việt ghép 'sẽ' với 'đang'. Tiếng Anh cũng ghép: **will** (sẽ) + **be V-ing** (đang). Bạn đã biết quá khứ tiếp diễn (was doing) ở chủ đề 02; tương lai tiếp diễn là anh em của nó, chỉ dời sang tương lai."},"diagram":{"type":"table","title":"Thì tương lai tiếp diễn: ba thể","head":["Thể","Công thức","Ví dụ"],"rows":[["Khẳng định","S + will/shall + be + V-ing","I'll be working all day tomorrow."],["Phủ định","S + won't/shan't + be + V-ing","We won't be doing much on Sunday."],["Câu hỏi","Will/Shall + S + be + V-ing?","Will you be staying here long?"]]},"chunks":[{"title":"Sẽ đang làm gì vào lúc đó","icon":"⏸️","rule":"**will be + V-ing** = sẽ **đang** làm gì tại một **thời điểm** hoặc trong một **khoảng thời gian** cụ thể ở tương lai.","explain":"Will không đổi, **be** giữ nguyên (không thành is/are), động từ chính thêm **-ing**. Dấu hiệu hay gặp: this time next week, at eight o'clock tomorrow evening, between 8 and 9, in ten years' time.","formula":"S + will + be + V-ing","examples":[{"en":"This time next week, I'**ll be lying** on the beach in the Seychelles!","vi":"Tuần sau, vào giờ này tôi đang nằm trên bãi biển ở Seychelles đấy!"},{"en":"At eight o'clock tomorrow evening, Sue **will be doing** her homework.","vi":"Lúc 8 giờ tối mai, Sue đang làm bài tập về nhà."},{"en":"Don't ring between 8 and 9. I'**ll be watching** 'Who Wants to be a Millionaire'.","vi":"Đừng gọi điện trong khoảng từ 8 đến 9 giờ. Tôi đang xem chương trình 'Ai là triệu phú'."},{"en":"What **will** you **be doing** in ten years' time?","vi":"Mười năm sau anh sẽ đang làm gì nhỉ?"},{"en":"At eight tomorrow I will watching TV.","ok":false,"note":"thiếu be → will be watching"}],"mistake":{"wrong":"This time tomorrow I will be fly to Hanoi.","right":"This time tomorrow I will be flying to Hanoi.","why":"Sau will be phải là V-ing."},"src":"tr. 277–278"},{"title":"Hành động nền và việc kéo dài tạm thời","icon":"🎞️","rule":"Dùng **will be + V-ing** cho việc **đang diễn ra thì một việc khác xảy đến**, và cho việc **kéo dài liên tục** trong một quãng thời gian (tạm thời) ở tương lai.","explain":"Giống quá khứ tiếp diễn ở chủ đề 02 (hành động dài làm nền, hành động ngắn xen vào), chỉ dời sang tương lai. Việc xen vào đứng sau **when** chia **hiện tại đơn** (when you arrive), không dùng will.","examples":[{"en":"The band **will be playing** when the President enters.","vi":"Ban nhạc sẽ đang chơi khi Tổng thống bước vào."},{"en":"When you arrive, my baby **will be sleeping** so please be quiet.","vi":"Lúc anh đến thì bé nhà tôi đang ngủ, nên xin hãy giữ im lặng."},{"en":"My parents are going to London, so I'**ll be staying** with my grandma for the next two weeks.","vi":"Cha mẹ tôi sẽ đi London, vì vậy trong hai tuần tới tôi sẽ ở với bà."},{"en":"I'**ll be working** all night in the restaurant, so please take care of the kids.","vi":"Tôi sẽ làm việc ở nhà hàng suốt đêm, vì thế hãy chăm sóc bọn trẻ nhé."}],"tip":"Hành động dài (nền) → will be V-ing; việc ngắn chen vào (sau when) → hiện tại đơn.","src":"tr. 278"},{"title":"Theo kế hoạch, và hỏi lịch sự","icon":"🗓️","rule":"**will be + V-ing** còn nói về việc sẽ xảy ra **theo kế hoạch, thời gian biểu**, và dùng để **hỏi lịch sự** về kế hoạch của ai đó.","explain":"Theo sách, ở cách dùng này *will be + V-ing* có nghĩa gần giống hiện tại tiếp diễn chỉ tương lai (bài 03c). Câu hỏi *Will you be going…?* chỉ hỏi kế hoạch của người ta, nghe nhẹ nhàng, lịch sự.","examples":[{"en":"At 5 a.m. tomorrow, they **will be departing** Alaska.","vi":"5 giờ sáng mai họ sẽ khởi hành đi Alaska."},{"en":"I'**ll be returning** home next Thursday.","vi":"Thứ Năm tới anh sẽ về."},{"en":"What time **will** your friends **be arriving** tomorrow?","vi":"Ngày mai các bạn của anh sẽ đến lúc mấy giờ?"},{"en":"**Will** you **be going** away at the weekend?","vi":"Cuối tuần này anh có đi chơi xa không?"},{"en":"How long **will** you **be using** the tennis court?","vi":"Các bạn sẽ dùng sân tennis trong bao lâu?"}],"src":"tr. 278–279"},{"title":"Lưu ý: không dùng với be và động từ trạng thái","icon":"🚫","rule":"Không dùng tương lai tiếp diễn với **be** và các động từ chỉ **nhận thức, tri giác, sở hữu** (know, believe, see, have…); dùng **tương lai đơn** thay thế.","explain":"Đây là quy tắc bạn đã gặp ở chủ đề 01: những động từ như know, believe, like, want, own, need không chia tiếp diễn. Sang tương lai cũng vậy.","examples":[{"en":"All the family **will be** there.","vi":"Cả nhà sẽ đến đó."},{"en":"All the family will be being there.","ok":false,"note":"be → will be"},{"en":"You **won't believe** this.","vi":"Anh sẽ không tin điều này đâu."},{"en":"You won't be believing this.","ok":false,"note":"believe → won't believe"}],"src":"tr. 279"}],"practice":[{"type":"mcq","q":"Chọn câu đúng:","options":["I'll be working all day tomorrow.","I'll be work all day tomorrow.","I'll working all day tomorrow."],"answer":0,"explain":"**will + be + V-ing**: I'll be working. Thiếu -ing hoặc thiếu be đều sai.","src":"tr. 277"},{"type":"mcq","q":"Phủ định của 'We will be doing much on Sunday' là:","options":["We won't be doing much on Sunday.","We will be not doing much on Sunday.","We won't doing much on Sunday."],"answer":0,"explain":"not đứng ngay sau will: **won't be doing**. Không đặt not sau be, không bỏ be.","src":"tr. 278"},{"type":"fill","q":"Don't call me between 9 and 10 tonight. I ___ (watch) the football match.","answer":["will be watching","'ll be watching"],"hint":"will + be + V-ing","explain":"Đang diễn ra trong một khoảng thời gian tương lai (9–10 giờ tối nay) → **will be watching**.","src":"tr. 278"},{"type":"fill","q":"This time tomorrow we ___ (fly) to Paris.","answer":["will be flying","'ll be flying","shall be flying"],"explain":"'This time tomorrow' = vào giờ này ngày mai → việc sẽ đang diễn ra → **will be flying**.","src":"tự soạn"},{"type":"fill","q":"___ you be using the car tonight? I'd like to borrow it.","answer":["Will"],"explain":"Hỏi lịch sự về kế hoạch: **Will you be + V-ing…?** Shall không đi với you.","src":"tr. 279"},{"type":"mcq","q":"**Tôi sẽ biết kết quả vào thứ Sáu.** Câu nào đúng?","options":["I'll know the result on Friday.","I'll be knowing the result on Friday."],"answer":0,"explain":"**know** là động từ nhận thức, không dùng tiếp diễn → dùng tương lai đơn: I'll know.","src":"tr. 279","shuffle":false},{"type":"classify","q":"Câu nào đúng, câu nào sai?","buckets":["Đúng","Sai"],"items":[{"text":"At 10 tomorrow I'll be sitting in the exam room.","bucket":0},{"text":"I'll be having a new car next year.","bucket":1},{"text":"When you get home, I'll be cooking dinner.","bucket":0},{"text":"She will be knowing the answer soon.","bucket":1},{"text":"Will you be going to the party on Saturday?","bucket":0},{"text":"This time next week we will lying on the beach.","bucket":1}],"explain":"Sai: **have** (sở hữu) và **know** không dùng tiếp diễn → I'll have a new car, She will know; 'will lying' thiếu be → will be lying. Ba câu kia đúng: việc đang diễn ra lúc 10 giờ, hành động nền khi bạn về, hỏi lịch sự về kế hoạch.","src":"tự soạn"},{"type":"fix","wrong":"At 7 tomorrow morning I will driving to work.","answer":["At 7 tomorrow morning I will be driving to work.","At 7 tomorrow morning I'll be driving to work."],"explain":"Thiếu **be**: will **be** driving.","src":"tự soạn"},{"type":"fix","wrong":"When you arrive, the children will be sleep.","answer":["When you arrive, the children will be sleeping."],"explain":"Sau will be phải là **V-ing**: will be **sleeping**.","src":"tự soạn"},{"type":"fix","wrong":"They will be owning a big house in ten years.","answer":["They will own a big house in ten years.","They'll own a big house in ten years."],"explain":"**own** (sở hữu) không dùng tiếp diễn → tương lai đơn: will **own**.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu hỏi:","words":["What","will","you","be","doing","in","ten","years'","time?"],"explain":"Câu hỏi: **Wh- + will + S + be + V-ing**…?","src":"tr. 278"},{"type":"order","q":"Sắp xếp thành câu hỏi lịch sự:","words":["What","time","will","your","friends","be","arriving?"],"explain":"Hỏi lịch sự về kế hoạch của người khác: will … **be arriving**.","src":"tr. 279"}],"flashcards":[{"front":"Công thức tương lai tiếp diễn?","back":"S + **will be + V-ing**: I'll be working all day tomorrow."},{"front":"'Giờ này tuần sau tôi đang…' dùng thì nào?","back":"TL tiếp diễn: This time next week, I'll be lying on the beach."},{"front":"Hỏi lịch sự về kế hoạch của ai đó?","back":"**Will you be + V-ing…?** Will you be going away at the weekend?"},{"front":"be / know / believe có dùng will be + V-ing không?","back":"Không → dùng TL đơn: All the family **will be** there. You **won't believe** this."}]},{"id":"03e","title":"Tương lai hoàn thành và tương lai hoàn thành tiếp diễn","minutes":25,"goal":"Dùng will have + V3 cho việc sẽ xong trước một mốc tương lai, will have been + V-ing cho việc kéo dài liên tục đến mốc đó, và phân biệt hai thì.","pretest":[{"type":"mcq","q":"**Trước 10 giờ, Jack sẽ làm xong bài tập.**","options":["By 10 o'clock Jack will have finished his homework.","By 10 o'clock Jack will has finished his homework.","By 10 o'clock Jack will have finish his homework."],"answer":0,"explain":"**will have + quá khứ phân từ (V3)**: sau will luôn là have (không has), rồi đến finished.","src":"tr. 280"},{"type":"mcq","q":"Hè này là **tôi đã dạy được 20 năm** rồi (và vẫn đang dạy).","options":["I'll have been teaching for twenty years this summer.","I'll be teaching for twenty years this summer."],"answer":0,"explain":"Kéo dài liên tục **đến** một mốc tương lai → **will have been + V-ing**.","src":"tr. 281","shuffle":false}],"hook":{"icon":"🏁","text":"Hãy nghĩ tới một **vạch đích** ở tương lai, ví dụ thứ Ba tuần sau. Đứng ở vạch đích nhìn ngược lại: mái nhà **đã lợp xong** chưa? → *They'll have finished the roof by Tuesday* (tương lai hoàn thành). Việc dạy học **đã kéo dài** bao lâu tính đến mốc đó? → *I'll have been teaching for twenty years this summer* (tương lai hoàn thành tiếp diễn). Tiếng Việt nói 'đến lúc đó thì đã… rồi'; tiếng Anh dùng **will have**."},"diagram":{"type":"table","title":"Hai thì 'nhìn lại từ một mốc tương lai'","head":["Thể / ý","Tương lai hoàn thành","TL hoàn thành tiếp diễn"],"rows":[["Khẳng định","will have + V3","will have been + V-ing"],["Phủ định","won't have + V3","won't have been + V-ing"],["Câu hỏi","Will + S + have + V3?","Will + S + have been + V-ing?"],["Nhấn mạnh","Sự hoàn tất, kết quả","Tính liên tục (kéo dài)"],["Ví dụ","I'll have written the report by Tuesday.","I'll have been writing it for a week."]]},"chunks":[{"title":"Tương lai hoàn thành: xong trước một mốc","icon":"✅","rule":"**will have + quá khứ phân từ (V3)** nói về việc **sẽ hoàn tất trước** một thời điểm hoặc trước một hành động khác trong tương lai.","explain":"Quá khứ phân từ (V3) bạn đã gặp ở hiện tại hoàn thành (have worked, have seen). Sau will luôn là **have**, không bao giờ là has. Thì này hay đi với **by + mốc**: by 10 o'clock, by tomorrow, by then, by the time, by this time next year, by the end of next month, by next June; và với **before, until/till, when**.","formula":"S + will have + V3\nS + won't have + V3\nWill + S + have + V3…?","examples":[{"en":"They'**ll have finished** the roof by Tuesday.","vi":"Đến thứ Ba thì họ sẽ hoàn thành phần mái."},{"en":"By this time next year I'**ll have graduated** from university.","vi":"Năm sau, vào thời gian này tôi đã tốt nghiệp đại học rồi."},{"en":"The train **will have left** by the time you reach the station.","vi":"Lúc anh đến ga thì chắc tàu đã rời ga rồi."},{"en":"I **won't have got** home by six.","vi":"Trước 6 giờ tôi sẽ chưa về đến nhà đâu."},{"en":"**Will** you **have finished** the report by the deadline?","vi":"Liệu anh có hoàn tất bản báo cáo trước thời hạn cuối không?"},{"en":"By Tuesday they will has finished the roof.","ok":false,"note":"sau will luôn là have"}],"mistake":{"wrong":"By Friday I will have finish the book.","right":"By Friday I will have finished the book.","why":"Sau will have là quá khứ phân từ (V3): finished."},"src":"tr. 279–280"},{"title":"Tương lai hoàn thành: kéo dài đến một mốc","icon":"📏","rule":"**will have + V3** còn nói về việc **kéo dài đến** một thời điểm trong tương lai (thường có **for** + khoảng thời gian).","explain":"Đếm ngược từ mốc tương lai: đến lúc đó thì đã được bao lâu. 'won't have … until' = phải đến lúc đó mới xong.\nLưu ý: trong mệnh đề chỉ thời gian (sau when, before, after, by the time…) không dùng tương lai hoàn thành, mà dùng **hiện tại hoàn thành**: when I **have finished**. Chủ đề 05 sẽ học kỹ.","examples":[{"en":"In two years' time, we'**ll have lived** here for ten years.","vi":"Hai năm nữa là chúng tôi sống ở đây được 10 năm rồi."},{"en":"I'**ll have been** at the company for over thirty years when I retire.","vi":"Đến khi nghỉ hưu thì tôi đã làm ở công ty này hơn 30 năm rồi."},{"en":"Gemma **won't have completed** her studies until she's 25.","vi":"Phải đến năm 25 tuổi Gemma mới học xong."},{"en":"I will go with you when I **have finished** my homework.","vi":"Khi làm xong bài tập về nhà, tôi sẽ đi với bạn."},{"en":"I will go with you when I'll have finished my homework.","ok":false,"note":"sau when → I have finished"}],"src":"tr. 280"},{"title":"Tương lai hoàn thành tiếp diễn","icon":"⏳","rule":"**will have been + V-ing** nhấn mạnh việc **kéo dài liên tục** đến một mốc trong tương lai; thường đi với cụm chỉ thời gian bắt đầu bằng **by**.","explain":"Ghép hai ý: 'đã… được bao lâu' (have been) và 'liên tục' (V-ing). Thì này cũng dùng cho việc diễn ra trước một việc khác trong tương lai để nói **nguyên nhân – kết quả**: Jason sẽ mệt **vì** đã lái xe hai ngày liền.","formula":"S + will have been + V-ing\nS + won't have been + V-ing\nWill + S + have been + V-ing…?","examples":[{"en":"By six o'clock, they'**ll have been meeting** for almost ten hours.","vi":"Đến 6 giờ là họ đã họp gần 10 tiếng đồng hồ rồi."},{"en":"By 2018 he'**ll have been living** in Madrid for 20 years.","vi":"Đến năm 2018 là ông ấy sống ở Madrid được 20 năm rồi."},{"en":"Our neighbors are moving. They **won't have been living** here long.","vi":"Hàng xóm của chúng tôi sắp dọn đi. Tính đến lúc đi, họ cũng chưa sống ở đây được bao lâu."},{"en":"How long **will** the spaceship **have been orbiting** the earth?","vi":"Đến lúc đó, tàu vũ trụ sẽ bay quanh trái đất được bao lâu rồi?"},{"en":"Jason will be tired when he gets home because he'**ll have been driving** for over two days straight.","vi":"Khi về đến nhà Jason sẽ rất mệt vì anh ấy vừa lái một mạch hơn hai ngày."},{"en":"By June I'll have been work here for a year.","ok":false,"note":"sau have been → working"}],"src":"tr. 280–281"},{"title":"Hoàn thành hay hoàn thành tiếp diễn?","icon":"⚖️","rule":"**Tương lai hoàn thành** nhấn mạnh **sự hoàn tất, kết quả**; **TL hoàn thành tiếp diễn** nhấn mạnh **tính liên tục** (việc kéo dài bao lâu).","explain":"Giống cặp hiện tại hoàn thành / hiện tại hoàn thành tiếp diễn ở chủ đề 01. Có con số kết quả (xong bản báo cáo, ba phòng, năm trang) → will have + V3. Có độ dài thời gian và muốn nói 'liên tục suốt' → will have been + V-ing.","examples":[{"en":"I'**ll have written** the report by Tuesday.","vi":"Đến thứ Ba, tôi sẽ viết xong báo cáo."},{"en":"I'**ll have been writing** it for a week.","vi":"Tôi sẽ viết nó trong một tuần. (kéo dài liên tục)"},{"en":"By Friday we'**ll have painted** three rooms.","vi":"Đến thứ Sáu chúng tôi sẽ sơn xong ba phòng."},{"en":"By Friday we'**ll have been painting** the house for two weeks.","vi":"Đến thứ Sáu là chúng tôi đã sơn nhà được hai tuần rồi."}],"tip":"Hỏi 'xong được bao nhiêu?' → will have V3. Hỏi 'làm liên tục bao lâu rồi?' → will have been V-ing.","src":"tr. 281"}],"practice":[{"type":"mcq","q":"By the end of next month, she ___ the course.","options":["will have finished","will have finish","will has finished"],"answer":0,"explain":"**will have + V3**: will have **finished**. Sau will không dùng has.","src":"tự soạn"},{"type":"mcq","q":"Câu nào nhấn mạnh **kết quả** (đã viết xong bao nhiêu)?","options":["I'll have written five pages by lunchtime.","I'll have been writing for three hours by lunchtime."],"answer":0,"explain":"Có kết quả đếm được (five pages) → **tương lai hoàn thành**. Câu kia nhấn mạnh việc viết liên tục ba tiếng.","src":"tr. 281","shuffle":false},{"type":"classify","q":"Mỗi câu nhấn mạnh điều gì?","buckets":["Hoàn tất, kết quả (will have V3)","Kéo dài liên tục (will have been V-ing)"],"items":[{"text":"By 2030 they'll have built the new bridge.","bucket":0},{"text":"By noon she'll have been waiting for four hours.","bucket":1},{"text":"Next year I'll have been learning English for five years.","bucket":1},{"text":"By the time you arrive, I'll have cooked dinner.","bucket":0},{"text":"By Sunday he'll have read all the Harry Potter books.","bucket":0},{"text":"By midnight the children will have been playing for six hours.","bucket":1}],"explain":"will have + V3: xây xong cầu, nấu xong bữa tối, đọc xong cả bộ sách (kết quả). will have been + V-ing: chờ, học, chơi liên tục suốt một khoảng thời gian.","src":"tự soạn"},{"type":"fill","q":"By the time you reach the station, the train ___ (leave).","answer":["will have left","'ll have left"],"explain":"Tàu đi **trước** mốc 'lúc bạn tới ga' → **will have left** (leave – left – left).","src":"tr. 280"},{"type":"fill","q":"By midnight, the children ___ (play) video games for five hours.","answer":["will have been playing","'ll have been playing"],"hint":"nhấn mạnh tính liên tục","explain":"Kéo dài liên tục đến mốc nửa đêm → **will have been playing**.","src":"tự soạn"},{"type":"fill","q":"I ___ (not / finish) the report by Monday, so I need more time.","answer":["won't have finished","will not have finished"],"hint":"won't have + V3","explain":"Phủ định tương lai hoàn thành: **won't have + V3**.","src":"tự soạn"},{"type":"fill","q":"I'll call you when I ___ (finish) my homework.","answer":["have finished","'ve finished","finish"],"explain":"Sau **when** (mệnh đề chỉ thời gian) không dùng will have finished; dùng **hiện tại hoàn thành** (have finished), hoặc hiện tại đơn (finish).","src":"tr. 280"},{"type":"fix","wrong":"By next year, I will has graduated from university.","answer":["By next year, I will have graduated from university.","By next year, I'll have graduated from university."],"explain":"Sau will luôn là **have**: will **have** graduated.","src":"tự soạn"},{"type":"fix","wrong":"By 2030 he'll have been live in Hanoi for 20 years.","answer":["By 2030 he'll have been living in Hanoi for 20 years.","By 2030 he will have been living in Hanoi for 20 years."],"explain":"Sau have been phải là **V-ing**: have been **living**.","src":"tự soạn"},{"type":"fix","wrong":"Hurry! By the time we get there, the film will have start.","answer":["Hurry! By the time we get there, the film will have started."],"explain":"Sau will have là **V3**: will have **started**.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu:","words":["By","six","o'clock,","they'll","have","been","meeting","for","ten","hours."],"explain":"**will have been + V-ing** + for + khoảng thời gian, với mốc **by six o'clock**.","src":"tr. 281"},{"type":"order","q":"Sắp xếp thành câu hỏi:","words":["Will","you","have","finished","the","report","by","Friday?"],"explain":"Câu hỏi tương lai hoàn thành: **W
