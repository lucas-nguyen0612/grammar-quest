n"},{"type":"mcq","q":"Lan has worked at this café ___ six months.","options":["for","since","in"],"answer":0,"explain":"six months là một **khoảng** thời gian → **for**. since đi với mốc (since May).","src":"tự soạn"},{"type":"fix","wrong":"I haven't finished my essay already.","answer":["I have not finished my essay yet.","I haven't finished my essay yet."],"explain":"Câu phủ định, nghĩa 'chưa' → **yet** đặt cuối câu. already dùng trong câu khẳng định.","src":"tự soạn"},{"type":"fill","q":"It's 9 a.m. now. I ___ two cups of coffee this morning. (drink)","answer":["have drunk","'ve drunk"],"explain":"Buổi sáng **chưa hết** (mới 9 giờ) → hiện tại hoàn thành. Có số lượng (two cups) → V3: drink – drank – **drunk**.","src":"tự soạn"},{"type":"mcq","q":"This is the second time she ___ this museum.","options":["has visited","visits","is visiting"],"answer":0,"explain":"Sau *This is the second time…* dùng **hiện tại hoàn thành** (đếm lần tính đến nay). Tiếng Việt nói 'lần thứ hai cô ấy thăm' nên dễ viết visits.","src":"tự soạn"},{"type":"mcq","q":"My clothes are wet because I ___ in the rain.","options":["have been walking","walk","has been walking"],"answer":0,"explain":"Việc vừa dừng còn để lại dấu vết (quần áo ướt) → hiện tại hoàn thành tiếp diễn. Chủ ngữ I → **have** been walking, không phải has.","src":"tự soạn"},{"type":"fill","q":"My neighbours ___ loud music since 10 p.m. I can't sleep! (play)","answer":["have been playing","'ve been playing"],"explain":"Việc kéo dài liên tục từ 10 giờ tới giờ và vẫn còn tiếp → **have been playing**. Không có số lượng nào hoàn tất nên nhấn quá trình.","src":"tự soạn"},{"type":"fix","wrong":"She has been teach at this school since 2018.","answer":["She has been teaching at this school since 2018.","She's been teaching at this school since 2018."],"explain":"Chuỗi ba mắt xích: has → been → **V-ing**. Sau been phải là teaching, không phải teach.","src":"tự soạn"},{"type":"mcq","q":"I ___ three emails this morning. Now I can relax.","options":["have written","have been writing"],"answer":0,"explain":"Có số lượng đã xong (three emails) và đã xong việc (Now I can relax) → nhấn **kết quả** → have written.","src":"tự soạn"},{"type":"mcq","q":"How long ___ this flat? ~ Since 2020.","options":["have you owned","have you been owning","are you owning"],"answer":0,"explain":"own (sở hữu) không chia tiếp diễn → kéo dài tới nay dùng hiện tại hoàn thành: **have you owned**.","src":"tự soạn"}],[{"type":"mcq","q":"The shops in my town ___ at 9 p.m. every evening.","options":["close","closes","are close"],"answer":0,"explain":"Việc lặp lại (every evening), chủ ngữ *the shops* số nhiều → động từ nguyên mẫu **close**, không thêm -s. 'are close' ghép sai be với động từ thường.","src":"tự soạn"},{"type":"mcq","q":"Câu nào đúng?","options":["Lan isn't at school today.","Lan not at school today.","Lan doesn't at school today."],"answer":0,"explain":"Câu không có động từ khác → cần be: Lan **isn't** (is not). Không bỏ be; doesn't chỉ đi với động từ thường.","src":"tự soạn"},{"type":"fill","q":"My best friend ___ me every Sunday evening. (call)","answer":["calls"],"explain":"Thói quen (every Sunday evening), chủ ngữ ngôi thứ ba số ít → **calls**.","src":"tự soạn"},{"type":"fill","q":"The baby usually ___ when she is hungry. (cry)","answer":["cries"],"hint":"phụ âm + y","explain":"Thói quen (usually). cry: trước y là r (phụ âm) → đổi y thành i + es: **cries**.","src":"tự soạn"},{"type":"mcq","q":"___ Tom and his sister twins?","options":["Are","Is","Do"],"answer":0,"explain":"Câu không có động từ khác (twins là danh từ) → hỏi bằng be. Chủ ngữ *Tom and his sister* là hai người → **Are**.","src":"tự soạn"},{"type":"fix","wrong":"She go to the gym three times a week.","answer":["She goes to the gym three times a week."],"explain":"Thói quen, chủ ngữ she → thêm đuôi; go tận cùng **o** → **goes**.","src":"tự soạn"},{"type":"fix","wrong":"Is your parents at home?","answer":["Are your parents at home?"],"explain":"*your parents* số nhiều → **Are**, không phải Is.","src":"tự soạn"},{"type":"mcq","q":"According to the school calendar, the new term ___ on 5 September.","options":["starts","is starting","start"],"answer":0,"explain":"Lịch học cố định (thời gian biểu) → hiện tại đơn dù là việc tương lai: **starts**. 'start' thiếu -s cho ngôi thứ ba số ít.","src":"tự soạn"},{"type":"classify","q":"Thêm đuôi gì cho ngôi thứ ba số ít?","buckets":["+ s","+ es","y → ies"],"items":[{"text":"fly","bucket":2},{"text":"buy","bucket":0},{"text":"kiss","bucket":1},{"text":"do","bucket":1},{"text":"cook","bucket":0},{"text":"worry","bucket":2},{"text":"brush","bucket":1},{"text":"say","bucket":0}],"explain":"buy, say: nguyên âm + y → chỉ thêm -s; cook thêm -s. kiss (s), do (o), brush (sh) → -es. fly, worry: phụ âm + y → ies.","src":"tr. 255–256"},{"type":"mcq","q":"Câu nào nói về một chân lý (sự thật hiển nhiên)?","options":["The moon goes round the earth.","My brother goes to bed late.","The bus goes at 7 tomorrow."],"answer":0,"explain":"Mặt trăng quay quanh trái đất là chân lý. Câu 2 là thói quen của một người; câu 3 là thời gian biểu.","src":"tự soạn"},{"type":"mcq","q":"Look! Those boys ___ over the wall.","options":["are climbing","climb","climbing"],"answer":0,"explain":"Look! báo hiệu việc đang diễn ra → **are climbing**. 'climbing' thiếu are; 'climb' là thói quen.","src":"tự soạn"},{"type":"mcq","q":"Excuse me, I ___ for the post office. Is it near here?","options":["am looking","look","looking"],"answer":0,"explain":"Đang tìm ngay lúc nói → **am looking**. 'I look for' là thói quen, không hợp; 'looking' thiếu am.","src":"tự soạn"},{"type":"fill","q":"Mum can't come to the phone. She ___ a bath. (have)","answer":["is having","'s having"],"explain":"have a bath (tắm) là **hành động**, không phải 'sở hữu' → chia tiếp diễn được: **is having** (đang tắm).","src":"tự soạn"},{"type":"mcq","q":"I ___ a new laptop because my old one is too slow.","options":["need","am needing","needing"],"answer":0,"explain":"need nằm trong nhóm động từ **không chia tiếp diễn** → dùng hiện tại đơn: I **need**.","src":"tự soạn"},{"type":"mcq","q":"Hurry up! It ___ dark, and we don't have a torch.","options":["is getting","gets","get"],"answer":0,"explain":"Trời **đang tối dần** (việc đang thay đổi ngay lúc này) → hiện tại tiếp diễn **is getting**. 'gets' là chuyện xảy ra thường lệ.","src":"tự soạn"},{"type":"fix","wrong":"Tom is a teacher, but this month he works in a hotel.","answer":["Tom is a teacher, but this month he is working in a hotel.","Tom is a teacher, but this month he's working in a hotel."],"explain":"Việc **tạm thời** (this month) → hiện tại tiếp diễn **is working**. Nghề cố định (is a teacher) mới dùng hiện tại đơn.","src":"tự soạn"},{"type":"fix","wrong":"I am not believing a word he says.","answer":["I do not believe a word he says.","I don't believe a word he says."],"explain":"believe là động từ nhận thức → không chia tiếp diễn. Phủ định ở hiện tại đơn: **don't believe**.","src":"tự soạn"},{"type":"mcq","q":"What ___ these days? ~ I'm learning to drive.","options":["are you doing","do you do","you are doing"],"answer":0,"explain":"these days + việc tạm thời đang làm → **are you doing**. 'What do you do?' là hỏi nghề nghiệp; 'you are doing' sai trật tự câu hỏi.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu hỏi đúng:","words":["Are","you","meeting","Lan","tonight?"],"explain":"Kế hoạch đã hẹn (tonight) → hiện tại tiếp diễn; câu hỏi đưa **Are** lên đầu: Are + you + V-ing?","src":"tự soạn"},{"type":"classify","q":"Câu này đúng hay sai?","buckets":["Đúng","Sai"],"items":[{"text":"I'm owning a car.","bucket":1},{"text":"This book belongs to Lan.","bucket":0},{"text":"She is knowing the way.","bucket":1},{"text":"I'm cooking dinner.","bucket":0},{"text":"He is hating cold weather.","bucket":1},{"text":"We are watching a film.","bucket":0},{"text":"Do you remember me?","bucket":0},{"text":"I am needing help.","bucket":1}],"explain":"own, know, hate, need là động từ trạng thái → không chia tiếp diễn (I own, she knows, he hates, I need). cook, watch là hành động → chia tiếp diễn được; belong, remember dùng hiện tại đơn là đúng.","src":"tr. 259"},{"type":"fill","q":"Shh! I ___ to the radio. (listen)","answer":["am listening","'m listening"],"explain":"Shh! → việc đang diễn ra ngay lúc nói: **am listening**. Đừng quên am trước V-ing.","src":"tự soạn"},{"type":"mcq","q":"I ___ the dishes. The kitchen is clean now.","options":["have washed","has washed","have wash"],"answer":0,"explain":"Kết quả còn ở hiện tại (bếp sạch) → hiện tại hoàn thành. I → **have**; sau have là V3 **washed**.","src":"tự soạn"},{"type":"fill","q":"My grandparents ___ to the countryside. They don't live in the city any more. (move)","answer":["have moved","'ve moved"],"explain":"Việc đã xảy ra, kết quả còn đó (giờ sống ở quê) → **have moved**. *my grandparents* số nhiều → have.","src":"tự soạn"},{"type":"fix","wrong":"Has you seen my glasses?","answer":["Have you seen my glasses?"],"explain":"Chủ ngữ you → **Have**. has chỉ dùng cho he/she/it.","src":"tự soạn"},{"type":"fill","q":"Linh ___ her leg, so she can't play football this week. (hurt)","answer":["has hurt","'s hurt"],"explain":"Kết quả còn đến bây giờ (không đá bóng được) → **has hurt**. hurt – hurt – **hurt** (ba cột giống nhau).","src":"tự soạn"},{"type":"mcq","q":"'Nam has read this book three times.' nghĩa là:","options":["Tính đến nay Nam đã đọc 3 lần, có thể còn đọc nữa","Nam đang đọc cuốn sách này"],"answer":0,"explain":"Hiện tại hoàn thành + three times = số lần **tính đến nay**, còn có thể lặp lại. Không nói việc đang đọc.","src":"tự soạn"},{"type":"mcq","q":"Câu nào đúng?","options":["Somebody has taken my umbrella.","Somebody have taken my umbrella.","Somebody has took my umbrella."],"answer":0,"explain":"somebody chia như ngôi thứ ba số ít → **has**; sau has là V3: take – took – **taken**.","src":"tự soạn"},{"type":"fill","q":"They ___ the new restaurant yet. (not / try)","answer":["haven't tried","have not tried"],"explain":"Phủ định hiện tại hoàn thành: **haven't + V3**; try → tried (phụ âm + y → ied). yet đi với câu phủ định.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu hỏi đúng:","words":["Have","you","written","to","your","grandma?"],"explain":"Câu hỏi hiện tại hoàn thành: **Have** + you + V3 (write – wrote – **written**)?","src":"tự soạn"},{"type":"fix","wrong":"The children have broke the window.","answer":["The children have broken the window."],"explain":"Sau have là V3: break – broke – **broken**. broke là cột 2.","src":"tự soạn"},{"type":"mcq","q":"There ___ a fire in the city centre. Several shops are closed.","options":["has been","have been","is being"],"answer":0,"explain":"Báo tin một việc vừa xảy ra, hậu quả còn đó → hiện tại hoàn thành. *a fire* số ít → **has been**.","src":"tự soạn"},{"type":"mcq","q":"He has ___ finished his lunch, so he isn't hungry.","options":["just","yet","ever"],"answer":0,"explain":"'Vừa mới' ăn xong → **just**, đứng giữa has và V3. yet chỉ dùng trong phủ định/câu hỏi; ever là 'đã từng'.","src":"tự soạn"},{"type":"fill","q":"We haven't decided where to go for our holiday ___.","answer":["yet"],"explain":"Câu phủ định, nghĩa 'vẫn **chưa**' → **yet**, đặt cuối câu.","src":"tự soạn"},{"type":"mcq","q":"My phone hasn't worked properly ___ Monday.","options":["since","for","from"],"answer":0,"explain":"Monday là một **mốc** → **since**. for đi với khoảng (for three days).","src":"tự soạn"},{"type":"mcq","q":"Is this the first time you ___ pho?","options":["have tried","try","are trying"],"answer":0,"explain":"Sau *the first time* dùng **hiện tại hoàn thành**: have tried. Tiếng Việt 'lần đầu bạn ăn phở' không có dấu hiệu thì nên dễ viết try.","src":"tự soạn"},{"type":"fix","wrong":"Have you seen ever a panda?","answer":["Have you ever seen a panda?"],"explain":"ever đứng **giữa have và V3**: Have you **ever seen**…?","src":"tự soạn"},{"type":"fill","q":"I haven't eaten anything ___ breakfast. I'm so hungry!","answer":["since"],"explain":"breakfast (bữa sáng) là một **mốc** thời gian → **since**: từ bữa sáng tới giờ.","src":"tự soạn"},{"type":"mcq","q":"It's the most beautiful beach I ___.","options":["have ever seen","ever see","have never seen"],"answer":0,"explain":"Sau *the best / most… + danh từ* dùng hiện tại hoàn thành, hay kèm **ever**: have ever seen. 'have never seen' ngược nghĩa (chưa từng thấy mà lại khen đẹp nhất).","src":"tự soạn"},{"type":"mcq","q":"It's 3 p.m. ___ lunch today? ~ Not yet.","options":["Have you had","Do you have","Are you having"],"answer":0,"explain":"today **chưa hết** + câu trả lời 'Not yet' → hiện tại hoàn thành: **Have you had** lunch today?","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","have","just","sent","the","email."],"explain":"**just** (vừa mới) đứng giữa have và V3: have just sent.","src":"tự soạn"},{"type":"mcq","q":"We have had three tests ___ this term.","options":["so far","yet","ago"],"answer":0,"explain":"**so far** = cho đến nay, hợp với hiện tại hoàn thành. yet dùng trong phủ định/câu hỏi; ago không đi với hiện tại hoàn thành.","src":"tự soạn"},{"type":"fill","q":"Why are you so sunburnt? ~ I ___ on the beach all afternoon. (lie)","answer":["have been lying","'ve been lying"],"explain":"Việc kéo dài suốt buổi chiều, để lại dấu vết (cháy nắng) → **have been lying**. lie → **lying** (ie → y + ing).","src":"tự soạn"},{"type":"mcq","q":"Minh ___ the guitar for two hours. His fingers hurt!","options":["has been playing","is playing","plays"],"answer":0,"explain":"Việc kéo dài liên tục hai tiếng tới giờ (for two hours) → **has been playing**. 'is playing' không cho biết đã kéo dài bao lâu; 'plays' là thói quen.","src":"tự soạn"},{"type":"fix","wrong":"They have been build the bridge for two years.","answer":["They have been building the bridge for two years.","They've been building the bridge for two years."],"explain":"have → been → **V-ing**: have been **building**.","src":"tự soạn"},{"type":"mcq","q":"How many cups of coffee ___ today?","options":["have you drunk","have you been drinking"],"answer":0,"explain":"Hỏi **bao nhiêu** (số lượng, kết quả) → hiện tại hoàn thành **have you drunk**. been + V-ing nhấn quá trình, không đi với how many.","src":"tự soạn"},{"type":"fill","q":"I ___ this book for a week, but I haven't finished it yet. (read)","answer":["have been reading","'ve been reading"],"explain":"Đọc liên tục suốt một tuần, **chưa xong** (haven't finished) → nhấn quá trình: **have been reading**.","src":"tr. 288"},{"type":"mcq","q":"Câu nào đúng?","options":["Lan has been having that bike for years.","Lan has had that bike for years.","Lan is having that bike for years."],"answer":1,"explain":"have nghĩa 'có, sở hữu' không chia tiếp diễn → kéo dài tới nay dùng hiện tại hoàn thành: **has had**.","src":"tự soạn"},{"type":"classify","q":"Điền động từ trong ngoặc: dùng have/has + V3 hay have/has been + V-ing?","buckets":["have/has + V3","have/has been + V-ing"],"items":[{"text":"I ___ (be) ill since Monday.","bucket":0},{"text":"She ___ (write) three letters so far.","bucket":0},{"text":"It ___ (rain) all day.","bucket":1},{"text":"We ___ (own) this car since 2019.","bucket":0},{"text":"Her eyes are red. She ___ (cry).","bucket":1},{"text":"They ___ (play) football all afternoon.","bucket":1},{"text":"I ___ (visit) Hue twice.","bucket":0},{"text":"He ___ (dig) the garden all morning.","bucket":1}],"explain":"be, own không chia tiếp diễn → V3. Có số lượng/số lần (three letters, twice) → V3. Kéo dài suốt (all day, all afternoon, all morning) hoặc vừa dừng còn dấu vết (mắt đỏ) → been + V-ing.","src":"tr. 265–266"},{"type":"fill","q":"___ it been raining all morning? The streets are very wet.","answer":["Has"],"explain":"Câu hỏi hiện tại hoàn thành tiếp diễn: **Has** + it + been + V-ing? Chủ ngữ it → has.","src":"tự soạn"},{"type":"mcq","q":"Mum ___ all morning, and the house smells wonderful.","options":["has been cooking","cooks","is cook"],"answer":0,"explain":"Việc kéo dài suốt buổi sáng tới giờ, để lại dấu vết (mùi thơm) → **has been cooking**. 'cooks' là thói quen; 'is cook' sai dạng.","src":"tự soạn"}]]}},{"id":"02-thi-qua-khu","title":"Các thì quá khứ","en":"Past tenses","icon":"⏪","pages":"261–275","summary":"Bốn thì quá khứ giúp bạn kể lại chuyện đã qua. **Quá khứ đơn** (I worked) cho việc đã xong ở một lúc cụ thể; **quá khứ tiếp diễn** (I was working) cho việc đang diễn ra lúc đó, làm nền cho việc khác xen vào; **quá khứ hoàn thành** (I had worked) cho việc xảy ra trước một việc quá khứ khác; **quá khứ hoàn thành tiếp diễn** (I had been working) nhấn mạnh việc kéo dài liên tục tới một mốc quá khứ. Bạn cũng học cách chọn giữa quá khứ đơn và hiện tại hoàn thành, chỗ người Việt hay nhầm nhất vì tiếng Việt dùng chung một chữ 'đã'.","mindmap":{"label":"Các thì quá khứ","children":[{"label":"Quá khứ đơn","icon":"📸","children":[{"label":"was / were"},{"label":"V-ed / V2: worked, saw"},{"label":"didn't + V · Did + S + V?"},{"label":"yesterday, last…, … ago"}]},{"label":"QKĐ hay HTHT?","icon":"🌉","children":[{"label":"Có mốc đã qua → QKĐ"},{"label":"Còn liên quan bây giờ → HTHT"},{"label":"today, this morning, once"},{"label":"Tin: HTHT → chi tiết: QKĐ"}]},{"label":"Quá khứ tiếp diễn","icon":"🎬","children":[{"label":"was / were + V-ing"},{"label":"Đang diễn ra lúc đó"},{"label":"Nền + việc xen vào (V2)"},{"label":"always + V-ing: phàn nàn"}]},{"label":"Quá khứ hoàn thành","icon":"⏮️","children":[{"label":"had + V3"},{"label":"Xảy ra trước việc/mốc khác"},{"label":"Sau told, thought, knew…"},{"label":"Sau if, wish"}]},{"label":"QKHT tiếp diễn","icon":"⏳","children":[{"label":"had been + V-ing"},{"label":"Kéo dài liên tục tới mốc QK"},{"label":"Liên tục ↔ kết quả (had V3)"}]}]},"lessons":[{"id":"02a","title":"Quá khứ đơn: was/were, V-ed/V2","minutes":25,"goal":"Chia được quá khứ đơn với be (was/were) và với động từ thường (V-ed/V2), viết câu phủ định và câu hỏi với did, và biết bốn cách dùng của thì này.","pretest":[{"type":"mcq","q":"'Sáng hôm qua tôi gặp John.' Câu nào đúng?","options":["I met John yesterday morning.","I meet John yesterday morning.","I did met John yesterday morning."],"answer":0,"explain":"Quá khứ của **meet** là **met**. Tiếng Việt giữ nguyên 'gặp', còn tiếng Anh phải đổi động từ. *did met* sai vì đã có did thì động từ quay về nguyên mẫu.","src":"tr. 267"},{"type":"mcq","q":"They ___ at home last night.","options":["weren't","wasn't","didn't"],"answer":0,"explain":"**they** đi với **were** → phủ định là **weren't**. *didn't* không đi trước 'at home' vì câu không có động từ thường.","src":"tr. 267"},{"type":"mcq","q":"Did you ___ the film last week?","options":["see","saw","seen"],"answer":0,"explain":"Sau **Did**, động từ chính ở dạng **nguyên mẫu**: Did you **see**…?","src":"tr. 268"}],"hook":{"icon":"📸","text":"Quá khứ đơn giống **một tấm ảnh đã chụp xong**: việc đã xảy ra, đã kết thúc, gắn với một lúc cụ thể (hôm qua, năm 2013). Tiếng Việt chỉ cần thêm 'hôm qua' hay 'đã', động từ vẫn y nguyên: 'hôm qua tôi **gặp** John'. Tiếng Anh thì phải **đổi chính động từ**: meet → **met**. Quên đổi động từ là lỗi số một của người Việt khi kể chuyện quá khứ."},"diagram":{"type":"table","title":"Quá khứ đơn: ba thể","head":["Thể","Với be","Với động từ thường"],"rows":[["Khẳng định","I/He/She/It was · We/You/They were","S + V-ed / V2"],["Phủ định","wasn't / weren't","S + didn't + V nguyên mẫu"],["Câu hỏi","Was/Were + S …?","Did + S + V nguyên mẫu …?"],["Ví dụ","I was absent yesterday.","I met John. / Did they finish?"]]},"chunks":[{"title":"Quá khứ của be: was / were","icon":"🧍","rule":"Với **be**: I/he/she/it dùng **was**, we/you/they dùng **were**. Phủ định thêm **not**; câu hỏi đưa **was/were** lên đầu câu.","explain":"be ở quá khứ chỉ có hai dạng, chọn theo chủ ngữ giống am/is/are: am và is → **was**, are → **were**. be tự làm câu hỏi và phủ định, không mượn did: 'Did you be…?' là sai. Rút gọn: was not → **wasn't**, were not → **weren't**.","formula":"S + was/were …\nS + wasn't/weren't …\nWas/Were + S …?","examples":[{"en":"I **was** absent from school yesterday.","vi":"Hôm qua tôi nghỉ học."},{"en":"They **weren't** at home last night.","vi":"Tối qua họ không ở nhà."},{"en":"**Was** the train ten minutes late?","vi":"Có phải chuyến tàu trễ 10 phút không?"},{"en":"They was at home last night.","ok":false,"note":"they đi với were"}],"mistake":{"wrong":"Did you be at home yesterday?","right":"Were you at home yesterday?","why":"be tự đứng lên đầu câu hỏi, không mượn did."},"tip":"am, is → was · are → were.","src":"tr. 267–268","check":{"type":"mcq","q":"We ___ tired after the trip.","options":["was","were"],"answer":1,"explain":"**we** đi với **were**.","src":"tự soạn","shuffle":false}},{"title":"Động từ thường: V-ed / V2 và did","icon":"🔧","rule":"Câu khẳng định dùng **V-ed** (động từ quy tắc) hoặc **V2** (cột 2 bảng bất quy tắc); câu phủ định và câu hỏi dùng **did** + động từ **nguyên mẫu**.","explain":"Tiếng Việt thêm 'không', 'có… không' mà động từ không đổi. Tiếng Anh: câu khẳng định đổi động từ (work → worked, see → saw, go → went, write → wrote). Khi đã có **did/didn't**, did gánh phần 'quá khứ' rồi, nên động từ chính quay về **nguyên mẫu không to**: didn't **watch**, Did … **finish**? Động từ quy tắc thêm -ed: finish → finished, study → studied. Động từ bất quy tắc thì tra cột 2 (V2), bảng bạn đã gặp ở Chương 1, bài Động từ. Quy tắc chính tả -ed đầy đủ sẽ học ở chủ đề 4.","formula":"S + V-ed / V2\nS + did not (didn't) + V\nDid + S + V …?","diagram":{"type":"flow","title":"V2 hay nguyên mẫu?","start":{"q":"Câu có did / didn't không?","branches":[{"label":"Không","to":{"result":"V-ed / V2: I met John.","icon":"📸"}},{"label":"Có","to":{"result":"Nguyên mẫu: I didn't meet him.","icon":"🔙"}}]}},"examples":[{"en":"I **met** John yesterday morning.","vi":"Sáng hôm qua tôi gặp John."},{"en":"I **didn't watch** TV last night.","vi":"Tối qua tôi không xem tivi."},{"en":"**Did** they **finish** their meal?","vi":"Họ ăn xong rồi hả?"},{"en":"I didn't watched TV last night.","ok":false,"note":"sau didn't dùng nguyên mẫu: watch"},{"en":"She goed to work.","ok":false,"note":"go bất quy tắc: went"}],"mistake":{"wrong":"She didn't went to work.","right":"She didn't go to work.","why":"did đã mang nghĩa quá khứ, động từ sau nó ở nguyên mẫu."},"tip":"Một câu chỉ có **một** dấu quá khứ: hoặc V2, hoặc did. Không bao giờ cả hai.","src":"tr. 267–268","check":{"type":"fill","q":"Did you ___ Lan at the party? (see)","answer":["see"],"explain":"Sau **Did** dùng nguyên mẫu: see (không dùng saw).","src":"tự soạn"}},{"title":"Việc đã xong ở một lúc cụ thể","icon":"🕰️","rule":"Dùng quá khứ đơn cho việc **bắt đầu và kết thúc** ở **một thời điểm cụ thể** trong quá khứ, hoặc kéo dài **suốt một quãng thời gian** nay đã **chấm dứt**.","explain":"Từ chỉ thời gian hay đi kèm: yesterday, last week/month/year/night/Monday, the other day, … ago, on Monday, in 2013. Nếu việc kéo dài một quãng nhưng nay đã hết hẳn cũng dùng quá khứ đơn: 'He worked in that company for over ten years' → nay anh ta không còn làm ở đó. Tiếng Việt chỉ cần 'năm ngoái' là đủ báo quá khứ; tiếng Anh có từ chỉ thời gian rồi **vẫn** phải đổi động từ.","formula":"S + V2 … + yesterday / last … / … ago / in + năm","examples":[{"en":"Sue **went** shopping yesterday morning.","vi":"Sáng hôm qua Sue đi mua sắm."},{"en":"He **joined** the company two years ago.","vi":"Anh ấy vào công ty cách đây hai năm."},{"en":"The Second World War **ended** in 1945.","vi":"Năm 1945, Chiến tranh thế giới thứ hai kết thúc."},{"en":"When I was a boy, I **lived** on a farm.","vi":"Lúc nhỏ tôi sống ở trang trại."},{"en":"He join the company two years ago.","ok":false,"note":"có ago → joined"}],"mistake":{"wrong":"I see that film last week.","right":"I saw that film last week.","why":"last week là quá khứ → động từ phải đổi sang V2."},"tip":"Thấy yesterday, last…, … ago, in + năm đã qua → nghĩ ngay tới V2.","src":"tr. 268–269"},{"title":"Thói quen trong quá khứ và chuỗi hành động","icon":"🎞️","rule":"Quá khứ đơn còn dùng cho **cảm nhận, cảm xúc, thói quen** trong quá khứ và cho **chuỗi hành động nối tiếp nhau**.","explain":"Việc lặp lại thường xuyên hồi trước (I often visited…), cảm xúc hay cảm nhận lúc đó (loved, smelt) đều dùng quá khứ đơn. Khi kể hai hay nhiều việc **xảy ra kế tiếp nhau**, mỗi việc một động từ V2, theo đúng thứ tự xảy ra, như từng cảnh của một đoạn phim.","examples":[{"en":"I often **visited** this place as a child.","vi":"Khi còn nhỏ, tôi thường đến chỗ này."},{"en":"My grandmother **loved** this house.","vi":"Bà tôi rất yêu thích ngôi nhà này."},{"en":"When the bomb **went** off, the building **collapsed**.","vi":"Khi quả bom phát nổ, tòa nhà đổ sập."},{"en":"She **drove** into the car park, **got** out of the car, **locked** the doors and **walked** toward the theater.","vi":"Cô ấy lái xe vào bãi đỗ, ra khỏi xe, khóa cửa rồi đi về phía rạp hát."},{"en":"She drove into the car park, get out of the car and lock the doors.","ok":false,"note":"mọi động từ trong chuỗi đều ở quá khứ"}],"tip":"Kể chuyện = một chuỗi V2: drove → got → locked → walked.","src":"tr. 269"}],"practice":[{"type":"mcq","q":"I ___ absent from school yesterday.","options":["was","were","did"],"answer":0,"explain":"**I** đi với **was**. *were* dùng cho we/you/they; *did* không đứng trước tính từ absent.","src":"tr. 267"},{"type":"classify","q":"Mỗi động từ thuộc nhóm nào?","buckets":["Quy tắc: thêm -ed","Bất quy tắc: tra cột 2 (V2)"],"items":[{"text":"work → worked","bucket":0},{"text":"see → saw","bucket":1},{"text":"study → studied","bucket":0},{"text":"go → went","bucket":1},{"text":"write → wrote","bucket":1},{"text":"finish → finished","bucket":0}],"explain":"worked, studied, finished thêm -ed (study đổi y → i). saw, went, wrote là V2 bất quy tắc, phải học thuộc.","src":"tr. 268"},{"type":"mcq","q":"Chọn câu đúng:","options":["Did you see Tom yesterday?","Did you saw Tom yesterday?","Do you saw Tom yesterday?"],"answer":0,"explain":"Câu hỏi quá khứ: **Did** + S + **nguyên mẫu**. *Did you saw* thừa dấu quá khứ; *Do* là hiện tại.","src":"tự soạn"},{"type":"fill","q":"We ___ at the cinema last night. (be)","answer":["were"],"explain":"**we** + **were**; last night → quá khứ.","src":"tự soạn"},{"type":"fill","q":"My brother ___ his old car last month. (sell)","answer":["sold"],"explain":"sell là động từ bất quy tắc: sell – **sold** – sold. last month → quá khứ đơn.","src":"tự soạn"},{"type":"fill","q":"I ___ TV last night. I was too busy. (not/ watch)","answer":["didn't watch","did not watch"],"explain":"Phủ định quá khứ: **didn't + nguyên mẫu** → didn't watch (không phải *didn't watched*).","src":"tr. 268"},{"type":"fill","q":"___ you at home last Sunday? (be)","answer":["Were"],"explain":"Câu hỏi với be: đưa **Were** lên đầu (you đi với were). Không dùng *Did you be*.","src":"tự soạn"},{"type":"mcq","q":"'When the bomb went off, the building collapsed.' Quá khứ đơn ở đây diễn đạt gì?","options":["Hai hành động xảy ra kế tiếp nhau","Một thói quen trong quá khứ","Một việc còn kéo dài đến bây giờ"],"answer":0,"explain":"Bom nổ **rồi** tòa nhà sập: hai việc nối tiếp nhau → cả hai dùng quá khứ đơn.","src":"tr. 269"},{"type":"fix","wrong":"She didn't went to work yesterday.","answer":["She didn't go to work yesterday.","She did not go to work yesterday."],"explain":"Sau **didn't** dùng nguyên mẫu: go. Did đã mang nghĩa quá khứ rồi.","src":"tự soạn"},{"type":"fix","wrong":"They was very happy at the party.","answer":["They were very happy at the party."],"explain":"**they** đi với **were**, không đi với was.","src":"tự soạn"},{"type":"fix","wrong":"I visit my grandparents last weekend.","answer":["I visited my grandparents last weekend."],"explain":"last weekend là quá khứ → visit phải thành **visited**. Tiếng Việt không đổi động từ, tiếng Anh thì phải.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu hỏi đúng:","words":["Did","you","finish","your","homework","last","night?"],"explain":"Did + S + nguyên mẫu (finish) + … ?","src":"tự soạn"}],"flashcards":[{"front":"Quá khứ của be?","back":"I/he/she/it **was** · we/you/they **were**\nThey were at home."},{"front":"Sau did / didn't, động từ ở dạng nào?","back":"**Nguyên mẫu**: I didn't **go**. Did you **go**?"},{"front":"Dấu hiệu thời gian của quá khứ đơn?","back":"yesterday, last week, … ago, on Monday, in 2013\nHe joined the company two years ago."},{"front":"V2 của go, see, write?","back":"go → **went**, see → **saw**, write → **wrote**"},{"front":"Kể chuỗi hành động nối tiếp nhau dùng thì gì?","back":"**Quá khứ đơn** cho cả chuỗi: She got out, locked the door and walked away."}]},{"id":"02b","title":"Quá khứ đơn hay hiện tại hoàn thành?","minutes":25,"goal":"Chọn đúng giữa quá khứ đơn và hiện tại hoàn thành bằng hai câu hỏi: có nói rõ thời gian đã qua không, và việc còn liên quan đến bây giờ không; dùng đúng once, today, this morning và cách kể một tin mới.","pretest":[{"type":"mcq","q":"I ___ that film yesterday.","options":["saw","have seen"],"answer":0,"explain":"Có **yesterday** (thời gian cụ thể đã qua) → quá khứ đơn: saw.","src":"tr. 261","shuffle":false},{"type":"mcq","q":"I ___ at McDonald's for ten years, and I still work there.","options":["have worked","worked"],"answer":0,"explain":"Vẫn còn làm (still work there) → việc kéo dài đến bây giờ → hiện tại hoàn thành.","src":"tr. 262","shuffle":false}],"hook":{"icon":"🌉","text":"Tiếng Việt dùng chung một chữ **'đã'**: 'Tôi đã xem phim đó'. Xem hôm qua? Hay từng xem, đến giờ vẫn tính? Tiếng Anh tách làm hai. **Quá khứ đơn** là việc đã khép lại, nằm hẳn ở quá khứ. **Hiện tại hoàn thành** là cây cầu nối quá khứ với **bây giờ**. Chỉ cần tự hỏi hai câu: 'Có nói **lúc nào** không?' và 'Bây giờ còn **liên quan** không?'."},"diagram":{"type":"flow","title":"Quá khứ đơn hay hiện tại hoàn thành?","start":{"q":"Có nói thời điểm đã qua? (yesterday, ago, in 2002)","branches":[{"label":"Có","to":{"result":"Quá khứ đơn: I saw it yesterday.","icon":"📸"}},{"label":"Không","to":{"q":"Việc còn liên quan đến bây giờ?","branches":[{"label":"Còn (kết quả, còn tiếp, còn lặp lại)","to":{"result":"HT hoàn thành: I've lost my key.","icon":"🌉"}},{"label":"Đã khép lại","to":{"result":"Quá khứ đơn: I worked there for 10 years.","icon":"📸"}}]}}]}},"chunks":[{"title":"Có nói thời gian → quá khứ đơn","icon":"⏰","rule":"Hễ nhắc đến **thời gian cụ thể** của hành động (yesterday, three years ago, in 2002) thì phải dùng **quá khứ đơn**, không dùng hiện tại hoàn thành.","explain":"Ở chủ đề 1 bạn đã học: hiện tại hoàn thành dùng khi **không biết rõ** hoặc **không muốn nói** việc xảy ra lúc nào (I have seen that film). Một khi đã nói ra 'lúc nào' thì việc đó nằm gọn trong quá khứ → quá khứ đơn. Tiếng Việt nói 'Tôi **đã** xem phim đó hôm qua' vẫn có chữ 'đã', nên người Việt hay viết sai *I have seen it yesterday*.","examples":[{"en":"I **saw** that film yesterday.","vi":"Hôm qua tôi đã xem bộ phim đó."},{"en":"Eric **moved** to London three years ago.","vi":"Cách đây ba năm Eric đã chuyển tới London."},{"en":"I **have seen** that film.","vi":"Tôi xem phim đó rồi. (không nói lúc nào)"},{"en":"I have seen that film yesterday.","ok":false,"note":"có yesterday → saw"}],"mistake":{"wrong":"Eric has moved to London three years ago.","right":"Eric moved to London three years ago.","why":"ago chỉ một thời điểm đã qua → quá khứ đơn."},"tip":"Câu trả lời được câu hỏi 'When?' (Khi nào?) → quá khứ đơn.","src":"tr. 260–261","check":{"type":"mcq","q":"We ___ in Da Lat in 2020.","options":["were","have been"],"answer":0,"explain":"Có **in 2020** (thời điểm đã qua) → quá khứ đơn: were.","src":"tự soạn","shuffle":false}},{"title":"Còn liên quan đến bây giờ không?","icon":"🔗","rule":"Việc còn **kết quả**, còn **tiếp diễn** hoặc còn **có thể lặp lại** ở hiện tại → **hiện tại hoàn thành**; việc **đã khép lại** → **quá khứ đơn**.","explain":"Sách so ba cặp. (1) Kết quả: 'Tom has had a bad car crash. He's in hospital' (vẫn nằm viện) ↔ 'Tom had a bad car crash' (giờ đã ra viện). (2) Kéo dài: 'I've worked at McDonald's for ten years' (vẫn làm) ↔ 'I worked at McDonald's for ten years' (giờ không làm nữa). Vậy **for + khoảng thời gian** đi được với cả hai thì, nghĩa của câu quyết định. (3) Lặp lại: 'She has seen it eight times' (có thể xem nữa) ↔ việc xảy ra quá lâu hoặc không thể lặp lại nữa → quá khứ đơn: 'Shakespeare wrote thirty-seven plays'.","diagram":{"type":"table","title":"Còn liên quan hay đã khép lại?","head":["Còn liên quan → HT hoàn thành","Đã khép lại → Quá khứ đơn"],"rows":[["Tom has had a crash. (vẫn nằm viện)","Tom had a crash. (đã ra viện)"],["I've worked there for 10 years.","I worked there for 10 years."],["She has seen it eight times.","Shakespeare wrote 37 plays."]]},"examples":[{"en":"I can't go on holiday because I **have broken** my leg.","vi":"Tôi bị gãy chân nên không đi nghỉ được. (chân vẫn đang gãy)"},{"en":"I **broke** my leg while playing football.","vi":"Tôi bị gãy chân khi đang đá bóng. (chuyện đã qua)"},{"en":"We **were** there from three o'clock to five.","vi":"Chúng tôi đã ở đó từ 3 giờ đến 5 giờ. (rồi đi khỏi)"},{"en":"My grandmother **saw** the play at least three times.","vi":"Bà tôi đã xem vở kịch đó ít nhất ba lần. (bà đã mất, vở kịch không còn diễn)"},{"en":"Shakespeare has written thirty-seven plays.","ok":false,"note":"Shakespeare đã mất, việc đã khép lại → wrote"}],"mistake":{"wrong":"He has done a lot for me when he was alive.","right":"He did a lot for me when he was alive.","why":"Người đó không còn nữa, việc đã khép lại → quá khứ đơn."},"tip":"Tự hỏi: 'Bây giờ thế nào?' Còn → have/has + V3. Hết → V2.","src":"tr. 261–262"},{"title":"today, this morning và once","icon":"🌅","rule":"Với **today, this morning, this week**: khoảng thời gian **chưa hết** → hiện tại hoàn thành; **đã trôi qua** → quá khứ đơn. **once** với hiện tại hoàn thành = 'một lần, tính đến nay'; với quá khứ đơn = 'một dịp trong quá khứ'.","explain":"'It has been windy this morning' nói khi vẫn còn buổi sáng; 'It was windy this morning' nói khi đã trưa hoặc chiều. 'I haven't seen John today' = cả ngày đến giờ chưa gặp; 'I saw John today' = gặp lúc sớm hơn trong ngày, việc gặp đã xong. Với once, twice, three times: đi với hiện tại hoàn thành là số lần tính tới nay (We've only been to Scotland once); còn 'We went to Scotland once – in 2002' là một dịp cụ thể đã qua.","examples":[{"en":"It **has been** windy this morning.","vi":"Sáng nay trời nhiều gió. (vẫn còn buổi sáng)"},{"en":"It **was** windy this morning.","vi":"Sáng nay trời nhiều gió. (giờ đã là trưa hoặc chiều)"},{"en":"I **saw** John today and he sent you his regards.","vi":"Hôm nay tôi gặp John và anh ấy gửi lời hỏi thăm anh."},{"en":"We've only **been** to Scotland once.","vi":"Chúng tôi chỉ đến Scotland có một lần (tính đến nay)."},{"en":"We **went** to Scotland once – in 2002.","vi":"Trước kia chúng tôi có lần đến Scotland, vào năm 2002."},{"en":"We have been to Scotland once – in 2002.","ok":false,"note":"có in 2002 → went"}],"tip":"Nhìn đồng hồ: buổi sáng còn → has been; sáng đã qua → was.","src":"tr. 261, 264"},{"title":"Báo tin mới: hiện tại hoàn thành, rồi kể chi tiết bằng quá khứ đơn","icon":"📰","rule":"Câu **báo tin** dùng **hiện tại hoàn thành**; các câu kể **chi tiết** tiếp theo chuyển sang **quá khứ đơn**.","explain":"Câu đầu chỉ báo 'có chuyện này vừa xảy ra', chưa nói lúc nào → hiện tại hoàn thành. Câu sau nói rõ lúc nào, ở đâu, thế nào → đã cụ thể → quá khứ đơn. Cách này dùng trong bản tin và cả khi trò chuyện hằng ngày.","examples":[{"en":"Andy **has passed** his exam! He **got** 87%.","vi":"Andy thi đậu rồi! Anh ấy được 87/100."},{"en":"I've just **been** on holiday. ~ Oh, where **did** you **go**?","vi":"Tôi vừa đi nghỉ mát về. ~ Ồ, anh đi nghỉ ở đâu vậy?"},{"en":"There **has been** a serious accident on the M6. It **happened** at ten o'clock this morning.","vi":"Có tai nạn nghiêm trọng trên cao tốc M6. Tai nạn xảy ra lúc 10 giờ sáng nay."},{"en":"There has been an accident. It has happened at ten o'clock.","ok":false,"note":"chi tiết có at ten o'clock → happened"}],"tip":"Tin: have/has + V3. Chi tiết: V2.","src":"tr. 262–263"}],"practice":[{"type":"mcq","q":"Eric ___ to London three years ago.","options":["moved","has moved"],"answer":0,"explain":"**three years ago** là thời điểm đã qua → quá khứ đơn. Không dùng hiện tại hoàn thành với ago.","src":"tr. 261","shuffle":false},{"type":"classify","q":"Mỗi cụm thời gian thường đi với thì nào?","buckets":["Quá khứ đơn","Hiện tại hoàn thành"],"items":[{"text":"yesterday","bucket":0},{"text":"three years ago","bucket":0},{"text":"in 2002","bucket":0},{"text":"last Monday","bucket":0},{"text":"since 2020","bucket":1},{"text":"so far","bucket":1}],"explain":"yesterday, ago, in 2002, last Monday là thời điểm đã qua → quá khứ đơn. since, so far nối quá khứ với bây giờ → hiện tại hoàn thành (chủ đề 1).","src":"tr. 261, 263, 268"},{"type":"mcq","q":"Tom ___ a bad car crash. He's in hospital now.","options":["has had","had"],"answer":0,"explain":"Anh ấy **vẫn đang nằm viện**: kết quả còn ở hiện tại → hiện tại hoàn thành. Nếu Tom đã ra viện thì dùng *had*.","src":"tr. 262","shuffle":false},{"type":"mcq","q":"My grandfather ___ 30 years ago. I never met him.","options":["died","has died"],"answer":0,"explain":"Có **30 years ago** → quá khứ đơn: died.","src":"tr. 292","shuffle":false},{"type":"fill","q":"I ___ at McDonald's for ten years, but I left last year. (work)","answer":["worked"],"explain":"Giờ không còn làm ở đó nữa (I left) → quãng thời gian đã chấm dứt → quá khứ đơn, dù có for ten years.","src":"tr. 262"},{"type":"fill","q":"We ___ here in 1993, and we have been here a long time now. (move)","answer":["moved"],"explain":"**in 1993** là thời điểm cụ thể đã qua → moved. Vế sau dùng hiện tại hoàn thành vì vẫn còn ở đây.","src":"tr. 292"},{"type":"fill","q":"It ___ windy this morning, but now in the afternoon it's calm. (be)","answer":["was"],"explain":"Bây giờ đã là buổi chiều → buổi sáng đã qua → quá khứ đơn: was. Nếu vẫn còn buổi sáng thì nói *has been*.","src":"tr. 264"},{"type":"mcq","q":"We ___ to Scotland once – in 2002.","options":["went","have been"],"answer":0,"explain":"once + **in 2002** = một dịp cụ thể trong quá khứ → quá khứ đơn.","src":"tr. 261","shuffle":false},{"type":"fix","wrong":"I have seen Lan at the market yesterday.","answer":["I saw Lan at the market yesterday."],"explain":"Có **yesterday** → quá khứ đơn: saw. Chữ 'đã' của tiếng Việt không có nghĩa là phải dùng have + V3.","src":"tự soạn"},{"type":"fix","wrong":"Shakespeare has written thirty-seven plays.","answer":["Shakespeare wrote thirty-seven plays.","Shakespeare wrote 37 plays."],"explain":"Shakespeare đã mất, không viết thêm được nữa → việc đã khép lại → quá khứ đơn.","src":"tr. 261"},{"type":"fix","wrong":"There has been a fire in the city centre. It has started at midnight.","answer":["There has been a fire in the city centre. It started at midnight."],"explain":"Câu báo tin dùng hiện tại hoàn thành là đúng; câu chi tiết có **at midnight** → quá khứ đơn: started.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu hỏi đúng:","words":["When","did","you","move","to","Hanoi?"],"explain":"Hỏi **When** (khi nào) là hỏi thời điểm cụ thể → quá khứ đơn: When did you move…? (không dùng *When have you moved*).","src":"tự soạn"}],"flashcards":[{"front":"Có yesterday / ago / in 2002 → thì nào?","back":"**Quá khứ đơn**: I saw it yesterday. (không dùng have seen)"},{"front":"I've worked there for 10 years ↔ I worked there for 10 years?","back":"**have worked**: vẫn còn làm · **worked**: giờ không làm nữa"},{"front":"It has been windy this morning ↔ It was windy this morning?","back":"**has been**: vẫn còn buổi sáng · **was**: buổi sáng đã qua"},{"front":"Báo tin mới: câu đầu và câu chi tiết dùng thì gì?","back":"Câu đầu: **hiện tại hoàn thành** · chi tiết: **quá khứ đơn**\nThere has been an accident. It happened at ten."},{"front":"We went to Scotland once: once nghĩa là gì?","back":"**Một dịp** trong quá khứ (in 2002). Với HTHT, once = một lần tính đến nay."}]},{"id":"02c","title":"Quá khứ tiếp diễn: việc nền và việc xen vào","minutes":25,"goal":"Chia quá khứ tiếp diễn (was/were + V-ing), dùng nó cho việc đang diễn ra ở một lúc trong quá khứ, và phối hợp đúng với quá khứ đơn khi có việc xen vào.","pretest":[{"type":"mcq","q":"The children ___ their homework at 6 p.m. yesterday.","options":["were doing","was doing","are doing"],"answer":0,"explain":"Đang làm **lúc 6 giờ chiều qua** → quá khứ tiếp diễn; children (số nhiều) đi với **were**.","src":"tr. 270"},{"type":"mcq","q":"We were doing the maths test when the fire alarm ___.","options":["rang","was ringing"],"answer":0,"explain":"Chuông reo là việc **ngắn, xen vào** việc đang làm bài → quá khứ đơn: rang.","src":"tr. 270","shuffle":false}],"hook":{"icon":"🎬","text":"Hãy tưởng tượng một **cảnh phim**: tối qua trời **đang mưa**, bạn **đang đi** bộ về nhà, thì **bỗng** điện thoại reo. Phần 'đang…' là **phông nền** kéo dài; tiếng chuông là **cú chen ngang** ngắn. Tiếng Việt chỉ cần thêm 'đang' và 'thì'; tiếng Anh dùng hai thì khác nhau: nền → **was/were + V-ing**, cú chen ngang → **quá khứ đơn**."},"diagram":{"type":"table","title":"Quá khứ tiếp diễn: ba thể","head":["Thể","Công thức","Ví dụ"],"rows":[["Khẳng định","S + was/were + V-ing","They were playing football."],["Phủ định","S + wasn't/weren't + V-ing","She wasn't looking."],["Câu hỏi","Was/Were + S + V-ing …?","What were you doing at 10?"]]},"chunks":[{"title":"Đang diễn ra ở một lúc trong quá khứ","icon":"⏸️","rule":"Dùng **was/were + V-ing** cho việc **đang diễn ra** tại một thời điểm cụ thể trong quá khứ, hoặc **kéo dài liên tục** suốt một quãng thời gian trong quá khứ.","explain":"Giống hiện tại tiếp diễn (am/is/are + V-ing) nhưng lùi về quá khứ: am/is → was, are → were. Mốc hay gặp: at 6 p.m. yesterday, at this time last week, at that time. Quãng thời gian: all day yesterday, from 3 p.m. to 6 p.m. last Sunday. Tiếng Việt chỉ cần 'lúc đó tôi đang…'; tiếng Anh bắt buộc có **cả** was/were **lẫn** -ing.","formula":"S + was/were + V-ing\nS + wasn't/weren't + V-ing\nWas/Were + S + V-ing …?","examples":[{"en":"The children **were doing** their homework at 6 p.m.","vi":"Lúc 6 giờ chiều bọn trẻ đang làm bài tập về nhà."},{"en":"At this time last week I **was lying** on the beach in Florida.","vi":"Tuần trước, vào giờ này tôi đang nằm dài trên bãi biển ở Florida."},{"en":"We **were working** in the garden all day yesterday.","vi":"Chúng tôi làm vườn suốt ngày hôm qua."},{"en":"What **were** you **doing** at eight o'clock yesterday morning?","vi":"Lúc 8 giờ sáng hôm qua anh đang làm gì?"},{"en":"I was cook at 7 p.m. yesterday.","ok":false,"note":"thiếu -ing: was cooking"}],"mistake":{"wrong":"They was playing football at that time.","right":"They were playing football at that time.","why":"they đi với were."},"tip":"'Lúc đó đang…' = was/were + V-ing.","src":"tr. 269–270"},{"title":"Việc nền và việc xen vào","icon":"⚡","rule":"Việc **dài hơn, đang diễn ra** dùng **quá khứ tiếp diễn**; việc **ngắn hơn, xen vào** dùng **quá khứ đơn**. Hay nối bằng **when, while, as**. Hai việc **nối tiếp nhau** thì cả hai dùng **quá khứ đơn**.","explain":"Việc 'đang diễn ra' là phông nền: nó bắt đầu trước và có thể còn tiếp sau đó; việc kia xảy đến chen ngang. Nhưng nếu việc này **xong rồi mới tới** việc kia (thấy khói → gọi cứu hỏa; chuông reo → ra mở cửa), không có việc nào làm nền, nên cả hai đều là quá khứ đơn.","formula":"S + was/were + V-ing + when + S + V2\nWhile/As + S + was/were + V-ing, S + V2","diagram":{"type":"flow","title":"Hai việc trong quá khứ: chọn thì nào?","start":{"q":"Hai việc quan hệ thế nào?","branches":[{"label":"Một việc đang diễn ra, việc kia chen vào","to":{"result":"Việc dài: was/were + V-ing · việc ngắn: V2","icon":"⚡"}},{"label":"Việc này xong mới tới việc kia","to":{"result":"Cả hai V2: The bell rang and Tim went.","icon":"🎞️"}},{"label":"Hai việc cùng kéo dài song song","to":{"result":"Cả hai was/were + V-ing","icon":"🔁"}}]}},"examples":[{"en":"We **were doing** the maths test when the fire alarm **rang**.","vi":"Chúng tôi đang làm kiểm tra toán thì chuông báo cháy reo."},{"en":"Mozart **died** while he **was composing** the Requiem.","vi":"Mozart qua đời khi đang sáng tác bản 'Cầu hồn'."},{"en":"As I **was walking** down the street, I **saw** Bill.","vi":"Tôi gặp Bill khi đang đi xuống phố."},{"en":"The neighbors **called** the fire brigade when they **saw** smoke.","vi":"Khi nhìn thấy khói, những người hàng xóm đã gọi đội cứu hỏa. (nối tiếp)"},{"en":"I was walking down the street when I was seeing Bill.","ok":false,"note":"gặp Bill là việc ngắn xen vào → saw"}],"mistake":{"wrong":"The bell was ringing, and Tim was going to the door.","right":"The bell rang, and Tim went to the door.","why":"Chuông reo rồi Tim mới ra cửa: hai việc nối tiếp → quá khứ đơn."},"tip":"Dài → -ing · ngắn chen vào → V2 · nối tiếp → hai V2.","src":"tr. 270","check":{"type":"mcq","q":"As I ___ down the street, I saw Bill.","options":["was walking","walked"],"answer":0,"explain":"Đi bộ là việc nền đang diễn ra; gặp Bill xen vào → was walking.","src":"tr. 270","shuffle":false}},{"title":"Song song, phàn nàn, và hai lưu ý","icon":"🔁","rule":"Hai việc **cùng diễn ra** một lúc → cả hai dùng **quá khứ tiếp diễn**. Việc lặp đi lặp lại gây **khó chịu** → **was/were + always/continually/constantly + V-ing**.","explain":"Sách thêm hai lưu ý. (1) Thì tiếp diễn dành cho tình huống **tạm thời**; việc cố định hoặc kéo dài hơn dùng quá khứ đơn: 'It happened while I **was living** in Eastbourne' (tạm thời) nhưng 'I **lived** in London for ten years while I was a child'. (2) Không dùng quá khứ tiếp diễn với động từ chỉ **nhận thức, tri giác, sở hữu** (hear, feel, have, know…), nhóm bạn đã gặp ở chủ đề 1; dùng quá khứ đơn thay vào.","examples":[{"en":"Yesterday, I **was cooking** while my sister **was washing** the dishes.","vi":"Hôm qua, trong khi chị tôi rửa bát đĩa thì tôi nấu ăn."},{"en":"He **was always ringing** me up.","vi":"Hồi đó anh ta cứ gọi điện cho tôi mãi."},{"en":"When the students **heard** the bell, they **left** their class.","vi":"Khi nghe tiếng chuông, các học sinh rời khỏi lớp."},{"en":"He **felt** tired at that time.","vi":"Lúc đó anh ta cảm thấy mệt."},{"en":"He was feeling tired at that time.","ok":false,"note":"theo sách: feel chỉ cảm giác → felt"}],"mistake":{"wrong":"When the students were hearing the bell, they left their class.","right":"When the students heard the bell, they left their class.","why":"hear là động từ tri giác, không dùng tiếp diễn."},"tip":"always + V-ing = 'cứ… mãi' (bực mình).","src":"tr. 270–271"}],"practice":[{"type":"mcq","q":"What ___ you doing at 10 o'clock last night?","options":["were","was","did"],"answer":0,"explain":"Câu hỏi quá khứ tiếp diễn: **Were** + you + V-ing. *did* không đi với doing.","src":"tr. 269"},{"type":"fill","q":"I waved to her but she ___. (not/ look)","answer":["wasn't looking","was not looking"],"explain":"Lúc tôi vẫy, cô ấy **đang không nhìn** → wasn't looking.","src":"tr. 269"},{"type":"fill","q":"At 8 p.m. yesterday, my parents ___ TV, so they didn't hear the phone. (watch)","answer":["were watching"],"explain":"Đang xem **lúc 8 giờ tối qua** → quá khứ tiếp diễn; parents (số nhiều) → were watching.","src":"tự soạn"},{"type":"classify","q":"Câu chuyện: 'Tối qua Lan đang nấu cơm thì mất điện. Lúc đó mẹ cô đang ngủ, và chuông cửa reo.' Xếp mỗi việc vào đúng vai:","buckets":["Việc nền (was/were + V-ing)","Việc xen vào (V2)"],"items":[{"text":"Lan / cook dinner","bucket":0},{"text":"the power / go off","bucket":1},{"text":"her mother / sleep","bucket":0},{"text":"the doorbell / ring","bucket":1}],"explain":"Nấu cơm, ngủ là việc đang diễn ra (nền): was cooking, was sleeping. Mất điện, chuông reo là việc ngắn chen vào: went off, rang.","src":"tự soạn"},{"type":"mcq","q":"When Martin ___ home, Ann was talking to someone on the phone.","options":["arrived","was arriving"],"answer":0,"explain":"Ann đang nói chuyện (nền); Martin về tới nhà là việc ngắn xen vào → arrived.","src":"tr. 290","shuffle":false},{"type":"fill","q":"Lan ___ her phone while she was running for the bus. (lose)","answer":["lost"],"explain":"Chạy theo xe buýt là việc nền (was running); làm mất điện thoại là việc xen vào → quá khứ đơn: lose – **lost**.","src":"tự soạn"},{"type":"mcq","q":"The bell rang, and Tim ___ to the door.","options":["went","was going"],"answer":0,"explain":"Chuông reo **rồi** Tim ra cửa: hai việc nối tiếp nhau → cả hai quá khứ đơn.","src":"tr. 270","shuffle":false},{"type":"mcq","q":"'I was cooking while my sister was washing the dishes.' Câu này diễn đạt gì?","options":["Hai việc diễn ra cùng lúc","Một việc xen vào việc kia","Hai việc nối tiếp nhau"],"answer":0,"explain":"Cả hai vế đều là was/were + V-ing → hai việc kéo dài song song.","src":"tr. 270"},{"type":"fix","wrong":"When I opened the cupboard door, a pile of books was falling out.","answer":["When I opened the cupboard door, a pile of books fell out."],"explain":"Mở cửa tủ **rồi** sách rơi ra: hai việc nối tiếp → fell (quá khứ đơn).","src":"tr. 290"},{"type":"fix","wrong":"She was knowing the answer, but she didn't say it.","answer":["She knew the answer, but she didn't say it.","She knew the answer, but she did not say it."],"explain":"know chỉ nhận thức, không dùng tiếp diễn → knew.","src":"tự soạn"},{"type":"fix","wrong":"He was always borrow money from me.","answer":["He was always borrowing money from me."],"explain":"Phàn nàn: was **always** + **V-ing** → was always borrowing.","src":"tr. 270"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["While","he","was","walking","in","the","mountains","Henry","saw","a","bear"],"answer":["While he was walking in the mountains Henry saw a bear","Henry saw a bear while he was walking in the mountains"],"explain":"Đi bộ trên núi là việc nền (was walking); thấy con gấu là việc xen vào (saw).","src":"tr. 290"}],"flashcards":[{"front":"Công thức quá khứ tiếp diễn?","back":"S + **was/were + V-ing**\nThey were playing football at that time."},{"front":"Việc đang diễn ra + việc ngắn chen vào?","back":"Dài: **was/were + V-ing** · ngắn: **V2**\nI was walking when I saw Bill."},{"front":"Hai việc nối tiếp nhau dùng thì gì?","back":"Cả hai **quá khứ đơn**: The bell rang, and Tim went to the door."},{"front":"was always + V-ing nghĩa là gì?","back":"'Cứ… mãi', gây khó chịu: He was always ringing me up."},{"front":"hear, feel, know có dùng quá khứ tiếp diễn không?","back":"**Không** → quá khứ đơn: He felt tired. They heard the bell."}]},{"id":"02d","title":"Quá khứ hoàn thành","minutes":25,"goal":"Chia quá khứ hoàn thành (had + V3), dùng nó cho việc xảy ra trước một mốc hoặc trước một việc quá khứ khác, và nhận ra nó sau told, thought, knew…, sau if và wish.","pretest":[{"type":"mcq","q":"When I arrived at the party, Lucy ___ home.","options":["had already gone","has already gone","already goes"],"answer":0,"explain":"Lucy về **trước** khi tôi đến (arrived là quá khứ) → việc trước nữa dùng **had + V3**.","src":"tr. 272"},{"type":"mcq","q":"'Khi tôi đến, cuộc họp đã bắt đầu rồi' (bắt đầu trước khi tôi tới). Câu nào đúng nghĩa?","options":["When I arrived, the meeting had begun.","When I arrived, the meeting began."],"answer":0,"explain":"*had begun* = bắt đầu trước khi tôi tới. *began* = tôi tới rồi mới bắt đầu.","src":"tr. 273","shuffle":false}],"hook":{"icon":"⏮️","text":"Khi kể chuyện quá khứ, đôi khi bạn phải **lùi thêm một bước**: 'Lúc tôi đến bữa tiệc thì Lucy **đã về rồi**'. Cả hai việc đều ở quá khứ, nhưng Lucy về **trước**. Tiếng Việt dùng 'đã… rồi' cho mọi chuyện; tiếng Anh có hẳn một thì cho 'quá khứ của quá khứ': **had + V3**."},"diagram":{"type":"flow","title":"Có cần had + V3 không?","start":{"q":"Việc này xảy ra TRƯỚC một việc / mốc quá khứ khác?","branches":[{"label":"Không","to":{"result":"Quá khứ đơn (V2)","icon":"📸"}},{"label":"Có","to":{"q":"Nối bằng after, before, as soon as… và thứ tự đã rõ?","branches":[{"label":"Đúng","to":{"result":"V2 hay had + V3 đều được","icon":"🔀"}},{"label":"Không, hoặc cần nhấn việc 1 xong hẳn","to":{"result":"Việc trước: had + V3 · việc sau: V2","icon":"⏮️"}}]}}]}},"chunks":[{"title":"Công thức had + V3","icon":"🧱","rule":"Quá khứ hoàn thành = **had + quá khứ phân từ (V3)**, dùng **had** cho mọi ngôi.","explain":"Giống hiện tại hoàn thành (have/has + V3) nhưng have/has lùi thành **had**, nên không còn chuyện chia theo ngôi. V3 là cột 3 bảng bất quy tắc (gone, seen, bought); động từ quy tắc thì thêm -ed (finished). Rút gọn: had → **'d**, had not → **hadn't**.","diagram":{"type":"table","title":"Quá khứ hoàn thành: ba thể","head":["Thể","Công thức","Ví dụ"],"rows":[["Khẳng định","S + had + V3","The rain had stopped."],["Phủ định","S + hadn't + V3","I hadn't bought a ticket."],["Câu hỏi","Had + S + V3 …?","Where had he put his wallet?"]]},"examples":[{"en":"When we got there, the rain **had stopped**.","vi":"Khi chúng tôi đến đó thì mưa đã tạnh rồi."},{"en":"I couldn't go as I **hadn't bought** a ticket.","vi":"Tôi không đi được vì tôi đã không mua vé."},{"en":"Where **had** he **put** his wallet?","vi":"Anh ấy đã để ví ở đâu vậy?"},{"en":"She had went home.","ok":false,"note":"sau had dùng V3: gone"}],"mistake":{"wrong":"They had saw the film.","right":"They had seen the film.","why":"had + V3 (seen), không phải V2 (saw)."},"tip":"have/has → had: một dạng cho mọi ngôi.","src":"tr. 271"},{"title":"Xảy ra trước một mốc hoặc một việc quá khứ khác","icon":"⏮️","rule":"Dùng **had + V3** cho việc **đã xong trước** một thời điểm trong quá khứ hoặc **trước** một việc quá khứ khác; việc xảy ra **sau** dùng **quá khứ đơn**. had + V3 cũng dùng cho việc **kéo dài đến** một mốc quá khứ.","explain":"Mốc quá khứ: before 1975, before nine o'clock last night, by the time he was 20. Việc khác: When I **arrived** (sau), Lucy **had gone** (trước). Cẩn thận với **when**: 'When I arrived, the meeting **began**' = tôi đến rồi họp mới bắt đầu; 'When I arrived, the meeting **had begun**' = họp bắt đầu trước khi tôi tới. Việc kéo dài đến mốc quá khứ: 'By the time I met you I **had worked** in that company for five years' (sách ghi: không dùng *worked*). Các từ already, just, never… trong câu kể quá khứ có hai mệnh đề cũng đi với had + V3: When I came, the children **had already done** their exercises.","examples":[{"en":"We **had lived** in Hue before 1975.","vi":"Trước năm 1975 chúng tôi sống ở Huế."},{"en":"When I **arrived** at the party, Lucy **had** already **gone** home.","vi":"Khi tôi đến bữa tiệc thì Lucy đã ra về rồi."},{"en":"She **had** never **seen** a bear before she **moved** to Alaska.","vi":"Trước khi chuyển tới Alaska, cô ấy chưa từng thấy gấu."},{"en":"When they got married, they **had known** each other for 15 years.","vi":"Khi kết hôn thì họ đã quen nhau được 15 năm rồi."},{"en":"When they got married, they knew each other for 15 years.","ok":false,"note":"kéo dài đến mốc quá khứ → had known"}],"mistake":{"wrong":"When I arrived at the party, Lucy has already gone home.","right":"When I arrived at the party, Lucy had already gone home.","why":"Câu kể quá khứ (arrived) → việc trước đó dùng had, không dùng has."},"tip":"Hai việc quá khứ: việc **trước** lùi thêm một bậc → had + V3.","src":"tr. 264, 271–273","check":{"type":"mcq","q":"After the children ___ their homework, they went to bed.","options":["had finished","have finished"],"answer":0,"explain":"Làm xong bài tập **trước** khi đi ngủ (went) → had finished. *have finished* là hiện tại, không hợp câu kể quá khứ.","src":"tr. 272","shuffle":false}},{"title":"after, before, as soon as, when: khi nào cần had + V3?","icon":"🔀","rule":"Sau **after, as soon as, before, when, once, until**, hai việc nối tiếp có thể dùng **quá khứ đơn** hoặc **quá khứ hoàn thành**; dùng **had + V3** để nhấn mạnh việc thứ nhất **độc lập** và **xong hẳn** trước khi việc thứ hai bắt đầu.","explain":"Các liên từ này đã cho biết thứ tự, nên 'As soon as Jane **arrived / had arrived**, we sat down to eat' đều đúng. Nhưng khi việc thứ nhất không liên quan đến việc thứ hai và đã xong hẳn rồi mới sang việc thứ hai, sách dùng had + V3: 'When I **had opened** the window, I sat down and had a cup of tea' (không dùng *When I opened…*). So sánh: 'When I **opened** the window, the cat **jumped** out' → việc 1 gây ra việc 2 ngay → quá khứ đơn.","examples":[{"en":"As soon as Jane **arrived** / **had arrived**, we sat down to eat.","vi":"Chúng tôi ngồi vào bàn ăn ngay khi Jane đến."},{"en":"We didn't want to stop until we **finished** / **had finished** the job.","vi":"Chúng tôi không muốn dừng lại cho đến khi xong việc."},{"en":"When I **had written** my letters, I did some gardening.","vi":"Khi viết thư xong, tôi làm vườn."},{"en":"When I **opened** the window, the cat **jumped** out.","vi":"Khi tôi mở cửa sổ, con mèo nhảy ra ngoài."},{"en":"When I wrote my letters, I did some gardening.","ok":false,"note":"sách: việc 1 độc lập, xong hẳn → had written"}],"tip":"Việc 1 kéo theo việc 2 ngay → V2 + V2. Việc 1 xong hẳn rồi mới sang việc khác → had + V3.","src":"tr. 272–273"},{"title":"Sau told, thought, knew…; sau if và wish","icon":"💭","rule":"Quá khứ hoàn thành hay đi sau các động từ quá khứ **said, told, thought, wondered, forgot, remembered, realized, knew** để nói việc xảy ra **trước** lúc nói, nghĩ, nhớ, biết; nó còn đi sau **if, wish, would rather** để nói việc **đã không xảy ra**.","explain":"'I told her that I **had finished**': làm xong có trước lúc nói (sách ghi: không dùng *have finished*). Sau if và wish, had + V3 nói điều **trái với thực tế** trong quá khứ: 'I wish you **had told** me the truth' = thực tế bạn đã không nói thật. Ở bài này bạn chỉ cần nhận ra had + V3 trong các câu đó; quy tắc phối hợp thì giữa các mệnh đề sẽ học kỹ ở chủ đề 5.","examples":[{"en":"I told her that I **had finished**.","vi":"Tôi nói với bà ấy là tôi đã làm xong rồi."},{"en":"I wondered who **had left** the door open.","vi":"Tôi tự hỏi không biết ai đã để cửa mở vậy."},{"en":"During our conversation, I realized that we **had met** before.","vi":"Trong khi trò chuyện, tôi nhận ra rằng trước đây chúng tôi đã gặp nhau rồi."},{"en":"If I **had gone** to university I would have studied medicine.","vi":"Nếu học đại học thì tôi đã học y khoa rồi. (thực tế: không học)"},{"en":"I wish you **had told** me the truth.","vi":"Phải chi anh nói thật với tôi. (thực tế: anh không nói)"},{"en":"I told her that I have finished.","ok":false,"note":"kể lại trong quá khứ → had finished"}],"tip":"told / thought / knew + (that) + had V3: việc xảy ra trước lúc kể.","src":"tr. 273"}],"practice":[{"type":"mcq","q":"When we got there, the rain ___.","options":["had stopped","has stopped","stops"],"answer":0,"explain":"Mưa tạnh **trước** khi chúng tôi đến (got là quá khứ) → had stopped.","src":"tr. 271"},{"type":"fill","q":"I couldn't go as I ___ a ticket. (not/ buy)","answer":["hadn't bought","had not bought"],"explain":"Việc không mua vé có trước việc không đi được → hadn't + V3 (buy – bought – **bought**).","src":"tr. 271"},{"type":"fill","q":"The house was very quiet when I got home. Everybody ___ to bed. (go)","answer":["had gone"],"explain":"Mọi người đi ngủ **trước** khi tôi về → had + V3: go – went – **gone**.","src":"tr. 294"},{"type":"mcq","q":"Karen didn't want to come to the cinema with us because she ___ the film.","options":["had already seen","has already seen","already sees"],"answer":0,"explain":"Karen xem phim **trước** lúc từ chối (didn't want) → had already seen. already trong câu kể quá khứ đi với had + V3.","src":"tr. 294"},{"type":"mcq","q":"'When I arrived, the meeting had begun.' Nghĩa là:","options":["Cuộc họp bắt đầu trước khi tôi đến","Tôi đến rồi cuộc họp mới bắt đầu"],"answer":0,"explain":"**had begun** = bắt đầu trước (lùi thêm một bậc). Nếu muốn nói tôi đến rồi mới họp thì dùng *began*.","src":"tr. 273","shuffle":false},{"type":"classify","q":"Hai câu chuyện: (1) Tôi đến bữa tiệc; Lucy đã về trước đó. (2) Bọn trẻ làm xong bài tập rồi đi ngủ. Xếp mỗi việc vào đúng nhóm:","buckets":["Xảy ra trước → had + V3","Xảy ra sau → V2"],"items":[{"text":"Lucy / go home","bucket":0},{"text":"I / arrive at the party","bucket":1},{"text":"the children / finish their homework","bucket":0},{"text":"they / go to bed","bucket":1}],"explain":"Lucy had gone / I arrived; the children had finished / they went to bed. Việc trước lùi một bậc thành had + V3.","src":"tr. 272"},{"type":"fill","q":"By the time I met you, I ___ in that company for five years. (work)","answer":["had worked","'d worked"],"explain":"Việc kéo dài **đến** một mốc quá khứ (lúc gặp bạn) → had worked. Sách ghi rõ: không dùng *worked*.","src":"tr. 273"},{"type":"fill","q":"She told me that she ___ the report. (finish)","answer":["had finished","'d finished"],"explain":"Sau **told** (quá khứ), việc làm xong có trước lúc nói → had finished.","src":"tự soạn"},{"type":"mcq","q":"As soon as Jane ___, we sat down to eat.","options":["has arrived","arrived","had arrived","Cả arrived và had arrived đều đúng"],"answer":3,"explain":"Sau **as soon as** (cũng như after, before, when, until), hai việc nối tiếp dùng được cả quá khứ đơn lẫn quá khứ hoàn thành. *has arrived* sai vì câu kể quá khứ.","src":"tr. 272","shuffle":false},{"type":"fix","wrong":"I realized that I have left my keys at home.","answer":["I realized that I had left my keys at home.","I realized that I'd left my keys at home.","I realised that I had left my keys at home."],"explain":"Sau **realized** (quá khứ), việc để quên chìa khóa xảy ra trước → had left.","src":"tự soạn"},{"type":"fix","wrong":"By the time he was 20, he saw all of Elvis Presley's movies.","answer":["By the time he was 20, he had seen all of Elvis Presley's movies.","By the time he was 20, he'd seen all of Elvis Presley's movies."],"explain":"**By the time** + mốc quá khứ: việc xong trước mốc đó → had seen.","src":"tr. 272"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["She","had","never","seen","a","bear","before","she","moved","to","Alaska"],"answer":["She had never seen a bear before she moved to Alaska","Before she moved to Alaska she had never seen a bear"],"explain":"Chưa từng thấy gấu là tình trạng **trước** việc chuyển đến Alaska → had never seen; chuyển đi dùng quá khứ đơn: moved.","src":"tr. 272"}],"flashcards":[{"front":"Công thức quá khứ hoàn thành?","back":"S + **had + V3** (mọi ngôi)\nThe rain had stopped."},{"front":"Hai việc quá khứ: việc xảy ra trước dùng gì?","back":"**had + V3**; việc sau dùng V2\nWhen I arrived, Lucy had gone home."},{"front":"When I arrived, the meeting began ↔ had begun?","back":"**began**: tôi đến rồi mới họp · **had begun**: họp trước khi tôi tới"},{"front":"Sau after / before / as soon as: V2 hay had + V3?","back":"Cả hai đều được; **had + V3** nhấn mạnh việc 1 xong hẳn trước."},{"front":"I told her that I ___ (finish).","back":"**had finished**: việc xảy ra trước lúc nói."}]},{"id":"02e","title":"Quá khứ hoàn thành tiếp diễn; tiếp diễn hay hoàn thành","minutes":25,"goal":"Chia quá khứ hoàn thành tiếp diễn (had been + V-ing), dùng nó để nhấn mạnh việc kéo dài liên tục tới một mốc hay một việc quá khứ, và chọn đúng giữa nó với quá khứ hoàn thành và quá khứ tiếp diễn.","pretest":[{"type":"mcq","q":"By the time Jeanny arrived, we ___ for over two hours.","options":["had been waiting","were waiting","have been waiting"],"answer":0,"explain":"Đợi **liên tục hơn hai tiếng** cho đến lúc Jeanny tới (quá khứ) → had been waiting.","src":"tr. 274"},{"type":"mcq","q":"The ground was wet. It ___.","options":["had been raining","has been raining"],"answer":0,"explain":"Mưa vừa tạnh trước lúc đó (quá khứ: was wet) và để lại kết quả → had been raining.","src":"tr. 274","shuffle":false}],"hook":{"icon":"🏃","text":"Chiều qua bạn gặp Jason: mặt đỏ bừng, áo ướt mồ hôi. Vì sao? Vì **trước lúc đó** anh ấy **đã chạy bộ suốt một tiếng**. Một việc kéo dài **liên tục**, kéo tới một mốc trong quá khứ và để lại dấu vết: đó là chỗ của **had been + V-ing**. Nó giống hiện tại hoàn thành tiếp diễn (have been + V-ing) bạn đã học, chỉ lùi mốc từ 'bây giờ' về 'lúc đó'."},"diagram":{"type":"flow","title":"Việc kéo dài trong quá khứ: chọn thì nào?","start":{"q":"Có nói việc kéo dài bao lâu tới một mốc quá khứ? (for, since, all morning)","branches":[{"label":"Không, chỉ đang diễn ra lúc đó","to":{"result":"Quá khứ tiếp diễn: was/were + V-ing","icon":"🎬"}},{"label":"Có","to":{"q":"Muốn nhấn mạnh điều gì?","branches":[{"label":"Sự liên tục của hành động","to":{"result":"had been + V-ing","icon":"⏳"}},{"label":"Kết quả, số lượng đã xong","to":{"result":"had + V3","icon":"✅"}}]}}]}},"chunks":[{"title":"Công thức had been + V-ing","icon":"🧱","rule":"Quá khứ hoàn thành tiếp diễn = **had been + V-ing**, dùng **had** cho mọi ngôi.","explain":"Ghép hai thứ bạn đã biết: **had** (quá khứ hoàn thành) + **been + V-ing** (tiếp diễn). Phủ định: hadn't been + V-ing. Câu hỏi: Had + S + been + V-ing? Rút gọn: I had been → **I'd been**.","diagram":{"type":"table","title":"Quá khứ hoàn thành tiếp diễn: ba thể","head":["Thể","Công thức","Ví dụ"],"rows":[["Khẳng định","S + had been + V-ing","She had been working hard."],["Phủ định","S + hadn't been + V-ing","Things hadn't been going well."],["Câu hỏi","Had + S + been + V-ing?","Had it been raining?"]]},"examples":[{"en":"She was tired because she **had been working** very hard.","vi":"Cô ấy mệt vì cô ấy đã làm việc rất vất vả."},{"en":"Until then things **hadn't been going** well.","vi":"Cho đến lúc đó, mọi việc đã không tiến triển tốt đẹp."},{"en":"Was the ground wet? **Had** it **been raining**?","vi":"Đất bị ướt hả? Trời vừa mưa xong phải không?"},{"en":"She had been work very hard.","ok":false,"note":"thiếu -ing: had been working"}],"mistake":{"wrong":"He had working all day.","right":"He had been working all day.","why":"Thiếu been: had + been + V-ing đủ ba mảnh."},"tip":"had + been + -ing: ba mảnh, không thiếu mảnh nào.","src":"tr. 273–274"},{"title":"Kéo dài liên tục tới một mốc hoặc một việc quá khứ","icon":"⏳","rule":"Dùng **had been + V-ing** cho việc **kéo dài liên tục** tới một thời điểm trong quá khứ, tới lúc một việc quá khứ khác xảy ra, hoặc **vừa kết thúc** và để lại kết quả ở thời điểm đó.","explain":"Ba cách dùng sách nêu. (a) Tới một mốc: 'I found the calculator. I'd been looking for it for ages.' (b) Trước một việc khác; việc xảy ra sau dùng quá khứ đơn: 'By the time Jeanny **arrived**, we **had been waiting** for over two hours.' (c) Vừa kết thúc, kết quả còn thấy lúc đó: 'It had been raining and the ground was still wet.' So với hiện tại: 'Jason **is** tired because he **has been jogging**' (bây giờ) ↔ 'Jason **was** tired because he **had been jogging**' (lúc đó).","examples":[{"en":"I found the calculator. I**'d been looking** for it for ages.","vi":"Tôi đã tìm ra cái máy tính. Tôi tìm nó lâu lắm rồi."},{"en":"When we came into class the teacher **had been explaining** for 15 minutes.","vi":"Khi chúng tôi vào lớp, thầy đã giảng bài được 15 phút rồi."},{"en":"He **had been living** in Ohio for a long time before he **moved** to Florida.","vi":"Anh ấy đã sống ở Ohio một thời gian dài trước khi chuyển tới Florida."},{"en":"It **had been raining** and the ground was still wet.","vi":"Trời vừa mưa xong nên mặt đất vẫn còn ướt."},{"en":"Jason was tired because he has been jogging.","ok":false,"note":"kể quá khứ (was) → had been jogging"}],"tip":"'Đã… được bao lâu rồi' + mốc quá khứ → had been + V-ing.","src":"tr. 274"},{"title":"Tiếp diễn hay hoàn thành?","icon":"⚖️","rule":"Nói việc kéo dài **bao lâu** → **had been + V-ing**, không dùng was/were + V-ing. **had been + V-ing** nhấn mạnh **sự liên tục**; **had + V3** nhấn mạnh **sự hoàn tất, kết quả**.","explain":"(1) Có since sunrise, for a long time… → không dùng quá khứ tiếp diễn: 'We'd been walking since sunrise' (không dùng *We were walking since sunrise*). (2) 'The volunteers had been collecting money all morning' = họ quyên tiền liên tục suốt buổi sáng; 'The volunteers had collected hundreds of pounds' = kết quả quyên được. Có con số, số lượng đã làm xong → had + V3. (3) Động từ chỉ nhận thức, tri giác, sở hữu (belong, know, have…) không dùng tiếp diễn → dùng had + V3.","examples":[{"en":"We**'d been walking** since sunrise, and we were hungry.","vi":"Chúng tôi đã đi bộ từ lúc bình minh nên đói bụng."},{"en":"We were walking since sunrise, and we were hungry.","ok":false,"note":"có since → had been walking"},{"en":"The volunteers **had been collecting** money all morning.","vi":"Những tình nguyện viên đã đi quyên tiền suốt cả buổi sáng."},{"en":"The volunteers **had collected** hundreds of pounds.","vi":"Những tình nguyện viên đã quyên được hàng trăm bảng."},{"en":"The motorcycle **had belonged** to George for years before Tina bought it.","vi":"George đã sở hữu chiếc môtô đó nhiều năm trước khi Tina mua nó."}],"mistake":{"wrong":"The motorcycle had been belonging to George for years.","right":"The motorcycle had belonged to George for years.","why":"belong chỉ sở hữu, không dùng tiếp diễn."},"tip":"Hỏi 'bao lâu?' → had been + V-ing. Hỏi 'được bao nhiêu?' → had + V3.","src":"tr. 275","check":{"type":"mcq","q":"By noon, she ___ three rooms.","options":["had painted","had been painting"],"answer":0,"explain":"Có số lượng đã xong (**three rooms**) → nhấn kết quả → had painted.","src":"tự soạn","shuffle":false}}],"practice":[{"type":"mcq","q":"She was tired because she ___ very hard.","options":["had been working","has been working","had been work"],"answer":0,"explain":"Kể quá khứ (was tired), việc làm liên tục trước đó → had been working. *has been* là hiện tại; *had been work* thiếu -ing.","src":"tr. 273"},{"type":"fill","q":"My legs were stiff because I ___ still for a long time. (stand)","answer":["had been standing","'d been standing"],"explain":"Đứng yên **lâu** trước lúc chân tê (quá khứ) → had been standing. Sách ghi: không dùng *was standing*.","src":"tr. 275"},{"type":"fill","q":"We were extremely tired at the end of the journey. We ___ for more than 24 hours. (travel)","answer":["had been travelling","had been traveling","'d been travelling","'d been traveling"],"explain":"Đi **liên tục hơn 24 giờ** tới cuối hành trình (quá khứ) → had been travelling.","src":"tr. 295"},{"type":"mcq","q":"Ken gave up smoking two years ago. He ___ for 30 years.","options":["had been smoking","has been smoking","was smoking"],"answer":0,"explain":"Hút **30 năm** cho đến lúc bỏ (gave up, quá khứ) → had been smoking. *has been* sai vì giờ đã bỏ; *was smoking* không dùng với 'bao lâu'.","src":"tr. 295"},{"type":"classify","q":"Mỗi câu nhấn mạnh điều gì?","buckets":["Sự liên tục (had been + V-ing)","Kết quả, số lượng (had + V3)"],"items":[{"text":"She had been painting all day.","bucket":0},{"text":"She had painted three rooms.","bucket":1},{"text":"They had been collecting money all morning.","bucket":0},{"text":"They had collected 500 dollars.","bucket":1},{"text":"He had written ten emails.","bucket":1},{"text":"He had been writing emails since breakfast.","bucket":0}],"explain":"all day, all morning, since breakfast → nhấn hành động kéo dài. three rooms, 500 dollars, ten emails → nhấn số lượng đã xong.","src":"tr. 275"},{"type":"mcq","q":"We ___ since sunrise, and we were hungry.","options":["'d been walking","were walking","have been walking"],"answer":0,"explain":"Có **since sunrise** (bao lâu) và kể quá khứ (were hungry) → had been walking. Quá khứ tiếp diễn không dùng với 'bao lâu'.","src":"tr. 275"},{"type":"mcq","q":"The motorcycle ___ to George for years before Tina bought it.","options":["had belonged","had been belonging"],"answer":0,"explain":"**belong** chỉ sở hữu, không dùng tiếp diễn → had belonged.","src":"tr. 275","shuffle":false},{"type":"fill","q":"Our game of tennis was interrupted. We ___ for about half an hour when it started to rain. (play)","answer":["had been playing","'d been playing"],"explain":"Chơi liên tục **nửa tiếng** trước khi trời mưa (started) → had been playing.","src":"tr. 295"},{"type":"fill","q":"By the time I stopped, I ___ ten pages. (write)","answer":["had written","'d written"],"explain":"Có số lượng đã xong (**ten pages**) → had + V3: write – wrote – **written**.","src":"tự soạn"},{"type":"mcq","q":"Emma went into the sitting-room. It was empty, but the television was still on. Someone ___ it.","options":["had been watching","was watching","has been watching"],"answer":0,"explain":"Phòng trống, tivi vẫn bật: có người **vừa xem xong** trước khi Emma vào → had been watching. *was watching* sai vì lúc đó không ai đang xem.","src":"tr. 295"},{"type":"fix","wrong":"When we came into class, the teacher was explaining for 15 minutes.","answer":["When we came into class, the teacher had been explaining for 15 minutes."],"explain":"Giảng **được 15 phút** tới lúc chúng tôi vào → had been explaining. Có 'bao lâu' thì không dùng was + V-ing.","src":"tr. 274"},{"type":"fix","wrong":"The ground was wet because it has been raining.","answer":["The ground was wet because it had been raining.","The ground was wet because it'd been raining."],"explain":"Câu kể quá khứ (was wet) → mưa vừa tạnh trước đó: had been raining.","src":"tr. 274"}],"flashcards":[{"front":"Công thức quá khứ hoàn thành tiếp diễn?","back":"S + **had been + V-ing**\nShe had been working hard."},{"front":"Kéo dài bao lâu tới mốc quá khứ: were walking hay had been walking?","back":"**had been walking**: We'd been walking since sunrise."},{"front":"had been collecting ↔ had collected?","back":"**had been collecting**: nhấn sự liên tục · **had collected**: nhấn kết quả (hundreds of pounds)"},{"front":"belong, know có dùng had been + V-ing không?","back":"**Không** → had + V3: The motorcycle had belonged to George."}]}],"quiz":{"pass":0.8,"sets":[[{"type":"fill","q":"My sister ___ to Da Nang last summer. (go)","answer":["went"],"explain":"**last summer** → quá khứ đơn; go – **went**.","src":"tự soạn"},{"type":"mcq","q":"___ you at the meeting yesterday?","options":["Were","Was","Did"],"answer":0,"explain":"Câu hỏi với be: **Were** + you. Không dùng *Did* vì câu không có động từ thường.","src":"tự soạn"},{"type":"fix","wrong":"Did she called you last night?","answer":["Did she call you last night?"],"explain":"Sau **Did** dùng nguyên mẫu: call.","src":"tự soạn"},{"type":"mcq","q":"Mike ___ his key. He can't find it anywhere.","options":["has lost","had lost","was losing"],"answer":0,"explain":"Kết quả còn ở hiện tại (bây giờ không tìm thấy) → hiện tại hoàn thành.","src":"tr. 292"},{"type":"mcq","q":"Mr Clack ___ in a bank for 15 years. Then he gave it up.","options":["worked","has worked","was working"],"answer":0,"explain":"Quãng thời gian đã chấm dứt (ông đã bỏ việc) → quá khứ đơn, dù có for 15 years. *was working* không dùng với 'bao lâu'.","src":"tr. 292"},{"type":"fill","q":"There has been a fire at the market. It ___ at 2 a.m. (start)","answer":["started"],"explain":"Câu báo tin dùng hiện tại hoàn thành; câu chi tiết có **at 2 a.m.** → quá khứ đơn: started.","src":"tự soạn"},{"type":"mcq","q":"We ___ to Japan once, in 2019.","options":["went","have been"],"answer":0,"explain":"once + **in 2019** = một dịp cụ thể đã qua → quá khứ đơn.","src":"tự soạn","shuffle":false},{"type":"fill","q":"You called me at 9 p.m. yesterday, but I didn't answer because I ___ a shower. (take)","answer":["was taking"],"explain":"Lúc bạn gọi, tôi **đang tắm** (việc nền) → was taking.","src":"tự soạn"},{"type":"mcq","q":"The train ___ when we arrived at the station.","options":["was waiting","has waited","waits"],"answer":0,"explain":"Tàu đang đợi sẵn (việc nền) khi chúng tôi tới (việc xen vào) → was waiting.","src":"tr. 290"},{"type":"fix","wrong":"When Alex saw the question, he was knowing the answer immediately.","answer":["When Alex saw the question, he knew the answer immediately."],"explain":"know chỉ nhận thức, không dùng tiếp diễn → knew.","src":"tr. 290"},{"type":"classify","q":"Mỗi tình huống dùng thì nào?","buckets":["Quá khứ đơn","Quá khứ tiếp diễn","Quá khứ hoàn thành"],"items":[{"text":"Việc đã xong ở một lúc cụ thể (in 2013)","bucket":0},{"text":"Chuỗi việc nối tiếp nhau","bucket":0},{"text":"Việc đang diễn ra lúc 8 giờ tối qua","bucket":1},{"text":"Việc nền bị một việc khác chen vào","bucket":1},{"text":"Việc xảy ra trước một việc quá khứ khác","bucket":2},{"text":"Việc xảy ra trước lúc 'I told her that…'","bucket":2}],"explain":"Xong ở một lúc / nối tiếp → V2. Đang diễn ra, làm nền → was/were + V-ing. Lùi thêm một bậc trước một việc quá khứ → had + V3.","src":"tr. 268–273"},{"type":"mcq","q":"'Khi chúng tôi tới sân vận động thì trận đấu đã bắt đầu rồi' (trận đấu bắt đầu trước khi chúng tôi tới). Chọn câu đúng:","options":["When we reached the stadium, the match had started.","When we reached the stadium, the match started.","When we reached the stadium, the match has started."],"answer":0,"explain":"Trận đấu bắt đầu **trước** khi chúng tôi tới → had started. *started* nghĩa là chúng tôi tới rồi trận mới bắt đầu; *has started* là hiện tại hoàn thành, không hợp câu kể quá khứ.","src":"tr. 273"},{"type":"fill","q":"There was no sign of a taxi, although I ___ one half an hour before. (order)","answer":["had ordered","'d ordered"],"explain":"Gọi taxi nửa tiếng **trước** lúc đó (was) → had ordered.","src":"tr. 293"},{"type":"fill","q":"When I got home, I realized that I ___ my umbrella on the bus. (leave)","answer":["had left","'d left"],"explain":"Sau **realized**, việc để quên ô xảy ra trước → had left (leave – left – left).","src":"tự soạn"},{"type":"fill","q":"When she came in, everyone ___ 'Surprise! Happy Birthday!' (shout)","answer":["shouted"],"explain":"Cô ấy bước vào thì mọi người hét lên **ngay sau đó**: hai việc nối tiếp → quá khứ đơn.","src":"tr. 272"},{"type":"fill","q":"Ann was tired because she ___ all afternoon. (clean)","answer":["had been cleaning","'d been cleaning"],"explain":"Dọn dẹp **liên tục cả buổi chiều** trước lúc mệt (quá khứ) → had been cleaning.","src":"tự soạn"},{"type":"mcq","q":"By 6 p.m. the volunteers ___ 2,000 dollars.","options":["had collected","had been collecting","were collecting"],"answer":0,"explain":"Có con số đã đạt được (**2,000 dollars**) → nhấn kết quả → had collected.","src":"tr. 275"},{"type":"mcq","q":"When we got home, we ___ for six hours, so we went straight to bed.","options":["had been driving","were driving","have been driving"],"answer":0,"explain":"Lái xe **sáu tiếng liên tục** tới lúc về nhà (quá khứ) → had been driving. *were driving* không dùng với 'bao lâu'.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["She","had","never","eaten","pho","before","she","came","to","Vietnam"],"answer":["She had never eaten pho before she came to Vietnam","Before she came to Vietnam she had never eaten pho"],"explain":"Chưa từng ăn phở là tình trạng **trước** khi đến Việt Nam → had never eaten; came là quá khứ đơn.","src":"tự soạn"},{"type":"mcq","q":"My grandparents ___ very kind to me when I was small.","options":["were","was","did"],"answer":0,"explain":"**grandparents** là số nhiều → **were**. *was* chỉ đi với I/he/she/it; *did* không đứng trước tính từ (kind).","src":"tự soạn"},{"type":"mcq","q":"Chọn câu đúng:","options":["She didn't eat breakfast yesterday.","She didn't ate breakfast yesterday.","She doesn't ate breakfast yesterday."],"answer":0,"explain":"Sau **didn't** dùng nguyên mẫu: eat. *didn't ate* có hai dấu quá khứ; *doesn't* là hiện tại, không hợp với yesterday.","src":"tự soạn"},{"type":"fix","wrong":"We buyed a lot of fruit at the market last Sunday.","answer":["We bought a lot of fruit at the market last Sunday."],"explain":"buy là động từ bất quy tắc: buy – **bought** – bought. Không thêm -ed.","src":"tự soạn"},{"type":"mcq","q":"'When I was a child, I often swam in the river near my house.' Quá khứ đơn ở đây diễn đạt gì?","options":["Một thói quen trong quá khứ","Một việc đang diễn ra ở một lúc trong quá khứ","Một việc còn kéo dài đến bây giờ"],"answer":0,"explain":"**often** + hồi nhỏ → việc lặp lại thường xu
