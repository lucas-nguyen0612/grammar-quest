h I had studied harder for the test."],"explain":"Tiếc chuyện đã qua là điều **không có thật** → **wish** + had V3. hope không dùng với thì lùi.","src":"tr. 384"},{"type":"classify","q":"Mỗi điều ước dùng dạng nào sau wish?","buckets":["would + V","V2 / were","had + V3"],"items":[{"text":"Tiếc là tôi không cao","bucket":1},{"text":"Mong anh ấy gọi lại","bucket":0},{"text":"Tiếc là đã quên sinh nhật mẹ","bucket":2},{"text":"Tiếc là nhà xa trường","bucket":1},{"text":"Mong trời đừng mưa nữa","bucket":0},{"text":"Tiếc là hôm qua đã ngủ quên","bucket":2}],"explain":"Mong ai/cái gì **làm, thay đổi** → would + V. **Tình trạng** bây giờ (không cao, nhà xa) → V2 / were. Việc **đã qua** (đã quên, đã ngủ quên) → had + V3.","src":"tr. 383–385"},{"type":"classify","q":"Điền hope hay wish vào chỗ trống?","buckets":["I hope…","I wish…"],"items":[{"text":"___ you win the race tomorrow.","bucket":0},{"text":"___ I were ten years younger.","bucket":1},{"text":"___ the train is on time.","bucket":0},{"text":"___ I had wings.","bucket":1}],"explain":"Có thể xảy ra, động từ giữ thì hiện tại (win, is) → **hope**. Không có thật, động từ lùi thì (were, had) → **wish**.","src":"tr. 384"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","wish","I","had","more","free","time."],"explain":"wish + S + **V2** (had): ước điều trái với hiện tại.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["She","wishes","she","hadn't","bought","that","dress."],"explain":"wishes + S + **hadn't + V3**: tiếc vì đã mua chiếc váy.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["If","only","it","would","stop","snowing!"],"explain":"If only + S + **would + V**: mong tuyết ngừng rơi.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","hope","you","have","a","safe","trip."],"explain":"Chuyến đi an toàn là điều có thể xảy ra → **hope** + hiện tại (have).","src":"tự soạn"},{"type":"mcq","q":"'I wish I had a dog.' nói về lúc nào?","options":["Hiện tại","Quá khứ","Tương lai"],"answer":0,"explain":"wish + **V2** (had = có) → ước trái với **hiện tại**: bây giờ tôi không có chó. Thì quá khứ ở đây không có nghĩa 'hôm qua'.","src":"tr. 384","shuffle":false},{"type":"mcq","q":"'If only I had called her.' nói về lúc nào?","options":["Quá khứ","Hiện tại","Tương lai"],"answer":0,"explain":"If only + **had + V3** (had called) → hối tiếc về **quá khứ**: tôi đã không gọi cho cô ấy.","src":"tr. 385","shuffle":false},{"type":"mcq","q":"He's really sorry he didn't apologise. He wishes he ___.","options":["had apologised","apologised","would apologise"],"answer":0,"explain":"Thực tế ở quá khứ (didn't apologise) → **had + V3**: had apologised.","src":"tr. 384"},{"type":"mcq","q":"It's my birthday next week, but my best friend is abroad. I wish she ___ come.","options":["could","can","will"],"answer":0,"explain":"Bạn ấy **không thể** đến (đang ở nước ngoài) → wish + **could** + V.","src":"tr. 383–384"},{"type":"mcq","q":"I'm wearing a suit and it's 35 degrees! I wish I ___ shorts.","options":["were wearing","am wearing","would wear"],"answer":0,"explain":"Việc **đang diễn ra** trái ý → lùi thành **were + V-ing**. *am wearing* là thực tế; *would wear* trùng chủ ngữ.","src":"tr. 388"},{"type":"fill","q":"Linh wishes she ___ taller so she could join the basketball team. (be)","answer":["was","were"],"explain":"Chiều cao là tình trạng hiện tại → **was / were**.","src":"tr. 384"},{"type":"fill","q":"If only I ___ so tired, I would go out with you tonight. (not / be)","answer":["wasn't","weren't","was not","were not"],"explain":"If only làm vế điều kiện không thật ở hiện tại → V2: **wasn't / weren't**; vế sau dùng would.","src":"tr. 385"},{"type":"mcq","q":"He knew the truth but kept quiet. Now he wishes he ___ something.","options":["had said","said","would say"],"answer":0,"explain":"Đã im lặng (quá khứ) → hối tiếc bằng **had + V3**: had said.","src":"tr. 384"}],[{"type":"mcq","q":"I'm terrible at maths. I wish I ___ better at it.","options":["were","am","will be"],"answer":0,"explain":"Trái với hiện tại → lùi thì: am → **were** (hoặc was). *will be* không dùng sau wish.","src":"tr. 384"},{"type":"mcq","q":"My flat has no balcony. I wish it ___ one.","options":["had","has","would have"],"answer":0,"explain":"Có ban công là **tình trạng** → V2: **had**. would không dùng cho tình trạng.","src":"tr. 383–384"},{"type":"mcq","q":"It's been snowing for days. I wish the snow ___ stop.","options":["would","will","does"],"answer":0,"explain":"Mong một thay đổi sắp xảy ra → **would + V**.","src":"tr. 383"},{"type":"mcq","q":"Your sister keeps borrowing my clothes. I wish she ___ ask first.","options":["would","will","does"],"answer":0,"explain":"Mong **người khác** làm khác đi → wish + S + **would** + V.","src":"tr. 383"},{"type":"mcq","q":"I ___ your new restaurant is a big success.","options":["hope","wish"],"answer":0,"explain":"Nhà hàng thành công là chuyện **có thể** xảy ra, động từ *is* giữ thì hiện tại → **hope**.","src":"tr. 384"},{"type":"mcq","q":"I wish I ___ to your party next Saturday, but I'll be away.","options":["could come","would come","will come"],"answer":0,"explain":"Nói về chính mình (I … I) → không dùng would, dùng **could**: I wish I could come.","src":"tr. 383"},{"type":"mcq","q":"If only I ___ my passport! Now I can't get on the plane.","options":["hadn't forgotten","didn't forget","wouldn't forget"],"answer":0,"explain":"Quên hộ chiếu là việc **đã xảy ra** → **hadn't + V3**.","src":"tr. 385"},{"type":"mcq","q":"They wish they ___ that old car. It broke down a week later.","options":["hadn't bought","didn't buy","don't buy"],"answer":0,"explain":"Việc mua xe đã qua → **hadn't + V3**: hadn't bought.","src":"tr. 384"},{"type":"mcq","q":"I wish I ___ you at the airport last week, but my flight was delayed.","options":["could have met","could meet","can meet"],"answer":0,"explain":"Tuần trước không thể đón → **could have + V3**.","src":"tr. 385"},{"type":"mcq","q":"'If only I were rich!' cho biết thực tế là:","options":["Tôi không giàu","Tôi đã từng giàu","Tôi sắp giàu"],"answer":0,"explain":"If only + **were** → ước trái với **hiện tại**: thực tế bây giờ tôi không giàu.","src":"tr. 384"},{"type":"mcq","q":"'I wish I could have seen the show.' nghĩa là:","options":["Tôi đã không xem được buổi diễn","Tôi sẽ xem buổi diễn","Tôi đang xem buổi diễn"],"answer":0,"explain":"**could have + V3** = tiếc vì **đã không thể** làm gì trong quá khứ.","src":"tr. 385"},{"type":"mcq","q":"Câu nào đúng về If only?","options":["Có thể đứng một mình như câu cảm thán","Luôn phải đi kèm wish","Chỉ dùng cho quá khứ"],"answer":0,"explain":"Sách: mệnh đề If only có thể **đứng một mình** hoặc nằm trong câu điều kiện, và dùng cho cả ba loại ước.","src":"tr. 385"},{"type":"mcq","q":"Câu nào SAI?","options":["I wish I could drive.","I wish I would drive.","I wish you would drive more carefully."],"answer":1,"explain":"*I wish I would…* sai: chủ ngữ của wish và would không được trùng. Nói về mình → **could**. Câu thứ ba đúng vì chủ ngữ khác (you).","src":"tr. 383"},{"type":"mcq","q":"Last summer, Nam wished he ___ how to swim.","options":["knew","knows","will know"],"answer":0,"explain":"wished **không** làm đổi thì giả định → vẫn dùng V2: **knew**.","src":"tr. 385"},{"type":"mcq","q":"If only I ___ so shy, I would talk to her.","options":["weren't","am not","won't be"],"answer":0,"explain":"If only làm vế điều kiện không thật ở hiện tại → V2: **weren't**; vế sau would + V.","src":"tr. 385"},{"type":"mcq","q":"My team always loses. I wish they ___ for once next Sunday.","options":["would win","win","will win"],"answer":0,"explain":"Mong một việc **sắp xảy ra** (Chủ nhật tới) → **would + V**.","src":"tr. 383"},{"type":"mcq","q":"We didn't book a table, and the restaurant was full. If only we ___ one.","options":["had booked","booked","would book"],"answer":0,"explain":"Việc đã qua (đã không đặt bàn) → **had + V3**.","src":"tr. 385"},{"type":"fill","q":"I'm hungry, but the fridge is empty. I wish there ___ some food in it. (be)","answer":["was","were"],"explain":"Trái với hiện tại → V2 của be: **was / were**.","src":"tr. 384"},{"type":"fill","q":"My parents live in Hue and I live in Hanoi. I wish they ___ closer. (live)","answer":["lived"],"explain":"Tình trạng hiện tại → V2: **lived**.","src":"tr. 384"},{"type":"fill","q":"I can't sing at all. I wish I ___ sing like you.","answer":["could"],"explain":"Thực tế can't → **could** + V.","src":"tr. 384"},{"type":"fill","q":"We have a test tomorrow. I wish we ___ a test. (not / have)","answer":["didn't have","did not have"],"explain":"Bài kiểm tra đã được lên lịch (sự việc không thể thay đổi) → ước bằng V2 phủ định: **didn't have**.","src":"tr. 384"},{"type":"fill","q":"The neighbours' dog barks every night. I wish they ___ it inside tonight. (keep)","answer":["would keep"],"explain":"Mong **người khác làm** một việc tối nay → **would + V**: would keep.","src":"tr. 383"},{"type":"fill","q":"He lost his job because he was rude to his boss. He wishes he ___ so rude. (not / be)","answer":["hadn't been","had not been"],"explain":"Việc đã qua → **hadn't + V3**: hadn't been.","src":"tr. 384"},{"type":"fill","q":"I forgot my best friend's birthday. If only I ___ it! (remember)","answer":["had remembered"],"explain":"Việc đã xảy ra (đã quên) → If only + **had + V3**: had remembered.","src":"tr. 385"},{"type":"fill","q":"It was a great match, but I had to work. I wish I ___ have watched it.","answer":["could"],"explain":"Lúc đó phải làm việc, không thể xem → **could have + V3**.","src":"tr. 385"},{"type":"fill","q":"We met her yesterday. I wish you ___ there too. (be)","answer":["had been","could have been"],"explain":"yesterday → quá khứ → **had + V3**: had been.","src":"tr. 384"},{"type":"fill","q":"I ___ you like the present I bought for you. (hope / wish)","answer":["hope"],"explain":"Thích món quà là chuyện **có thể** xảy ra, *like* giữ thì hiện tại → **hope**.","src":"tr. 384"},{"type":"fill","q":"I'm stuck at home with a cold. I wish I ___ at the beach right now. (be)","answer":["was","were"],"explain":"right now → trái với hiện tại → **was / were**.","src":"tr. 384"},{"type":"fix","wrong":"I wish I know how to cook.","answer":["I wish I knew how to cook."],"explain":"Trái với hiện tại → V2: know → **knew**.","src":"tr. 384"},{"type":"fix","wrong":"I wish I would be good at drawing.","answer":["I wish I was good at drawing.","I wish I were good at drawing."],"explain":"Giỏi vẽ là **tình trạng**, lại trùng chủ ngữ → không dùng would; dùng **was / were**.","src":"tr. 383"},{"type":"fix","wrong":"My son wishes he can stay up late.","answer":["My son wishes he could stay up late."],"explain":"Sau wish lùi thì: can → **could**.","src":"tr. 384"},{"type":"fix","wrong":"If only I didn't miss the bus this morning!","answer":["If only I hadn't missed the bus this morning!","If only I had not missed the bus this morning!"],"explain":"Lỡ xe buýt sáng nay là việc **đã xảy ra** → **hadn't + V3**.","src":"tr. 385"},{"type":"fix","wrong":"I wish I have gone to bed earlier last night.","answer":["I wish I had gone to bed earlier last night."],"explain":"Ước về quá khứ dùng quá khứ hoàn thành: **had** gone, không phải have gone.","src":"tr. 384"},{"type":"fix","wrong":"I wish you enjoy your stay in Vietnam.","answer":["I hope you enjoy your stay in Vietnam.","I hope you will enjoy your stay in Vietnam."],"explain":"Có một kỳ nghỉ vui là điều **có thể** xảy ra → **hope** + hiện tại.","src":"tr. 384"},{"type":"fix","wrong":"She wishes she is a famous singer.","answer":["She wishes she was a famous singer.","She wishes she were a famous singer."],"explain":"Trái với hiện tại → lùi thì: is → **was / were**.","src":"tr. 384"},{"type":"fix","wrong":"I wish I could have spoke to him yesterday.","answer":["I wish I could have spoken to him yesterday.","I wish I had spoken to him yesterday."],"explain":"Sau could have phải là **V3**: speak → spoke → **spoken**.","src":"tr. 385"},{"type":"classify","q":"Mỗi câu ước nói về lúc nào?","buckets":["Tương lai","Hiện tại","Quá khứ"],"items":[{"text":"I wish the bus would come.","bucket":0},{"text":"I wish I had a bike.","bucket":1},{"text":"I wish I had brought a jacket.","bucket":2},{"text":"I wish I could dance.","bucket":1},{"text":"I wish I could have helped.","bucket":2},{"text":"I wish you would call me.","bucket":0}],"explain":"**would + V** → tương lai (mong ai/cái gì làm). **V2, could + V** → hiện tại. **had V3, could have V3** → quá khứ. Chú ý: *had a bike* (V2) là hiện tại; *had brought* (had + V3) là quá khứ.","src":"tr. 383–385"},{"type":"classify","q":"Câu nào đúng, câu nào sai?","buckets":["Đúng","Sai"],"items":[{"text":"I wish I were you.","bucket":0},{"text":"I wish I would win the lottery.","bucket":1},{"text":"I hope it rains tomorrow.","bucket":0},{"text":"I wish she has a car.","bucket":1},{"text":"If only I had known!","bucket":0},{"text":"I hope I were taller.","bucket":1}],"explain":"Sai: *I wish I would…* (trùng chủ ngữ → could), *wish she has* (phải lùi: had), *hope I were* (điều không có thật → wish). Đúng: wish + were, hope + hiện tại, If only + had V3.","src":"tr. 383–385"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","wish","I","could","speak","English","fluently."],"explain":"wish + S + **could** + V: ước làm được việc hiện tại chưa làm được.","src":"tự soạn","answer":["I wish I could speak English fluently.","I wish I could fluently speak English."]},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["If","only","we","had","taken","a","taxi!"],"explain":"If only + S + **had + V3**: hối tiếc vì đã không đi taxi.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["He","wishes","his","boss","would","give","him","a","pay","rise."],"explain":"wishes + S khác (his boss) + **would + V**: mong sếp tăng lương cho mình.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","wish","it","weren't","so","cold","today."],"explain":"wish + S + **weren't**: ước điều trái với hiện tại (hôm nay lạnh).","src":"tự soạn"},{"type":"mcq","q":"'I wish I had studied French.' Thực tế là:","options":["I didn't study French.","I don't study French.","I won't study French."],"answer":0,"explain":"wish + **had + V3** → trái với **quá khứ**: thực tế tôi đã không học tiếng Pháp.","src":"tr. 384"},{"type":"mcq","q":"'She wishes she lived in Da Nang.' Thực tế là:","options":["She doesn't live in Da Nang.","She didn't live in Da Nang.","She will live in Da Nang."],"answer":0,"explain":"wish + **V2** → trái với **hiện tại**: bây giờ cô ấy không sống ở Đà Nẵng.","src":"tr. 384"},{"type":"mcq","q":"A: Are you coming to the beach?\nB: I wish I ___, but I have to work.","options":["could","can","would"],"answer":0,"explain":"B **không thể** đi (phải làm việc) → **could**. would không đi với chủ ngữ trùng (I … I).","src":"tr. 383–384"},{"type":"mcq","q":"A: Did you go to Minh's wedding?\nB: No. I wish I ___.","options":["had gone","went","would go"],"answer":0,"explain":"Đám cưới đã qua, B đã không đi → **had + V3**: had gone.","src":"tr. 384"},{"type":"fill","q":"This room is so dark. I wish it ___ bigger windows. (have)","answer":["had"],"explain":"Tình trạng hiện tại → V2: **had**.","src":"tr. 384"},{"type":"mcq","q":"A: I wish you ___ talking during the film.\nB: Sorry, I'll be quiet.","options":["would stop","stop","are stopping"],"answer":0,"explain":"Mong **người khác** thôi làm một việc → **would + V**.","src":"tr. 388"},{"type":"mcq","q":"He wished he ___ more money, so he got a second job.","options":["had","has","will have"],"answer":0,"explain":"wished không làm đổi thì: ước trái với thực tế lúc đó → V2: **had**.","src":"tr. 385"},{"type":"fix","wrong":"I hope I could fly like a bird.","answer":["I wish I could fly like a bird."],"explain":"Bay như chim là điều **không thể** → **wish** + could, không dùng hope.","src":"tr. 384"}]]}},{"id":"05-its-time-would-rather","title":"It's time và Would rather","en":"Clauses after It's time and Would rather","icon":"⏰","pages":"389–393","summary":"Sau **It's (high) time** và **would rather**, tiếng Anh thường dùng động từ ở **quá khứ** dù câu nói về bây giờ hoặc sắp tới. Chủ đề này dạy bạn ba dạng của It's time, bốn dạng của would rather, và cách chọn đúng dạng bằng hai câu hỏi: **ai làm** việc đó, và việc đó ở **bây giờ hay đã qua**.","mindmap":{"label":"It's time & Would rather","children":[{"label":"It's (high) time","icon":"⏰","children":[{"label":"+ S + V quá khứ đơn"},{"label":"+ to-V"},{"label":"+ for + O + to-V"}]},{"label":"Would rather: chính mình","icon":"🙋","children":[{"label":"+ V nguyên mẫu (than + V)"},{"label":"+ not + V"},{"label":"+ have + V3 (đã qua)"}]},{"label":"Would rather: người khác","icon":"👉","children":[{"label":"+ S + V quá khứ đơn"},{"label":"+ S + had V3 (đã qua)"},{"label":"Đã qua: wish hay dùng hơn"}]}]},"lessons":[{"id":"05a","title":"It's (high) time: đã đến lúc","minutes":25,"goal":"Dùng It's time / It's high time đúng ba dạng: + S + V quá khứ đơn (nghĩa hiện tại), + to-V, + for + tân ngữ + to-V; biết viết câu It's time từ một tình huống 'nên làm gì'.","pretest":[{"type":"mcq","q":"I'm tired. It's time we ___ home.","options":["went","go","going"],"answer":0,"explain":"Sau **It's time + chủ ngữ** (we), động từ chia **quá khứ đơn** dù nghĩa là bây giờ → **went**.","src":"tr. 389"},{"type":"mcq","q":"It's time ___ a new phone.","options":["to buy","buying","bought"],"answer":0,"explain":"Không có chủ ngữ sau It's time → dùng **to + V nguyên mẫu**: It's time **to buy**.","src":"tr. 389"},{"type":"mcq","q":"'It's high time you got a job.' nói về lúc nào?","options":["Bây giờ: anh nên đi làm ngay","Quá khứ: anh đã có việc làm rồi","Tương lai xa: một ngày nào đó"],"answer":0,"explain":"*got* ở dạng quá khứ nhưng nghĩa là **hiện tại**: đã đến lúc (bây giờ) anh phải có việc làm.","src":"tr. 389"}],"hook":{"icon":"⏰","text":"Hãy nghĩ tới chiếc **đồng hồ báo thức** đã reo từ lâu mà bạn vẫn nằm trên giường. Người Việt nói: 'Đến giờ dậy rồi!'. Người Anh nói **It's time you got up!** Việc đáng lẽ phải làm rồi, nên động từ **lùi về quá khứ** (*got*) dù nghĩa là **ngay bây giờ**. Bài này dạy bạn ba cách nói 'đã đến lúc' và cách chọn đúng cách."},"diagram":{"type":"flow","title":"Chọn dạng sau It's (high) time","start":{"q":"Có nói rõ AI phải làm không?","branches":[{"label":"Không","to":{"result":"+ to-V: It's time to go.","icon":"🕒"}},{"label":"Có","to":{"q":"Nói bằng mệnh đề hay bằng for?","branches":[{"label":"Mệnh đề (S + V)","to":{"result":"+ S + V quá khứ: It's time we went.","icon":"⏪"}},{"label":"Cụm for","to":{"result":"+ for + O + to-V: for us to go","icon":"👉"}}]}}]}},"chunks":[{"title":"It's time + S + V quá khứ đơn","icon":"⏪","rule":"Sau **It's time / It's high time + chủ ngữ**, động từ chia ở **quá khứ đơn** nhưng mang nghĩa **hiện tại**.","explain":"Tiếng Việt không đổi động từ: 'Đến lúc mình **về** rồi'. Tiếng Anh lại lùi động từ về quá khứ (*went, got, were*) để nói một việc **chưa làm nhưng đáng lẽ phải làm rồi**. Đây không phải chuyện đã qua: *It's time we went home* nghĩa là 'giờ mình về đi'. Sách còn dùng **It's about time** với cùng nghĩa. Động từ *be* với chủ ngữ số nhiều thành **were**: *the children were in bed*.","formula":"It's time / It's high time + S + V quá khứ đơn (V2/ed)","examples":[{"en":"I'm getting tired. **It's time we went** home.","vi":"Tôi mệt rồi. Đã đến lúc chúng ta phải về nhà."},{"en":"**It's time the children were** in bed.","vi":"Đã đến giờ bọn trẻ đi ngủ."},{"en":"**It's high time you got** a job.","vi":"Đã đến lúc anh phải có việc làm."},{"en":"**It's about time this road was completed**. They've been working on it for months.","vi":"Đã đến lúc phải hoàn tất con đường này. Họ làm nó hàng tháng nay rồi."},{"en":"It's time we go home.","ok":false,"note":"sau It's time + S phải dùng quá khứ: went"}],"mistake":{"wrong":"It's high time you get a job.","right":"It's high time you got a job.","why":"Nghĩa là 'bây giờ', nhưng sau It's time + chủ ngữ động từ vẫn phải ở **quá khứ đơn**."},"tip":"Đồng hồ đã điểm từ lâu → động từ **lùi một bước** về quá khứ.","src":"tr. 389","check":{"type":"fill","q":"It's high time you ___ your room. (clean)","answer":["cleaned"],"explain":"It's high time + you + **quá khứ đơn** → **cleaned**. Nghĩa: dọn phòng ngay đi.","src":"tự soạn"}},{"title":"It's time + to-V và for + O + to-V","icon":"🕒","rule":"It's time / It's high time cũng đi với **to + V nguyên mẫu**; muốn nói rõ ai làm thì thêm **for + tân ngữ** trước to-V.","explain":"Khi không cần nói ai làm (ai cũng hiểu), dùng **It's time to + V**. Khi muốn nói rõ người làm mà không dùng mệnh đề, chen **for + tân ngữ** vào: *for me, for us, for the children*. Sau giới từ *for* phải là **tân ngữ** (us, him, them), không phải chủ ngữ (we, he, they). Ở dạng này động từ luôn là **to + V nguyên mẫu**, không chia quá khứ.","formula":"It's (high) time + to-V\nIt's (high) time + for + tân ngữ + to-V","examples":[{"en":"**It's time to buy** a new car.","vi":"Đã đến lúc phải mua xe mới rồi."},{"en":"**It's high time for the children to go** to bed.","vi":"Đã đến giờ bọn trẻ đi ngủ rồi."},{"en":"**It's time for us to leave**.","vi":"Đã đến lúc chúng ta phải đi."},{"en":"It's time for the children went to bed.","ok":false,"note":"sau for + O dùng to-V: to go"}],"mistake":{"wrong":"It's time for we to leave.","right":"It's time for us to leave.","why":"Sau giới từ **for** là **tân ngữ**: us, không phải we."},"tip":"Có **for** → có **to**. Có chủ ngữ trơn (we, you) → **quá khứ**.","src":"tr. 389","check":{"type":"mcq","q":"It's time for everyone ___ dinner.","options":["to have","had","has"],"answer":0,"explain":"Có **for + tân ngữ** (everyone) → **to + V nguyên mẫu**: to have. *had* chỉ dùng khi có chủ ngữ trơn: It's time we had dinner.","src":"tự soạn"}},{"title":"Viết câu It's time từ một tình huống","icon":"🛠️","rule":"Ai đó **nên / phải** làm gì ngay bây giờ → viết **It's time + S + V quá khứ đơn**: bỏ **should / must**, không giữ should sau It's time.","explain":"Bài tập của sách cho tình huống kiểu 'Bạn nghĩ Tim nên dậy, đã 10 giờ rồi' rồi bảo viết câu It's time. Làm ba bước: (1) giữ chủ ngữ, (2) bỏ *should / must*, (3) đổi động từ sang quá khứ đơn. Câu bị động *should be cleaned* thành **was/were + V3**: *were cleaned*. Sách chỉ dạy quá khứ đơn sau It's time + S, nên *It's time we should go* bị coi là sai (đó là phương án nhiễu trong bài tập của sách).","formula":"S + should/must + V → It's time + S + V2/ed\nS + should be + V3 → It's time + S + was/were + V3","examples":[{"en":"Tim should get up now. → **It's time Tim got up**.","vi":"Đã đến lúc Tim phải dậy rồi."},{"en":"We must go home now. → **It's high time we went** home.","vi":"Đã đến lúc chúng ta phải về nhà rồi."},{"en":"The windows should be cleaned. → **It's time the windows were cleaned**.","vi":"Đã đến lúc phải lau cửa sổ rồi."},{"en":"It's time we should go.","ok":false,"note":"bỏ should: we went"}],"mistake":{"wrong":"It's time you should review your lessons.","right":"It's time you reviewed your lessons.","why":"Sau It's time + chủ ngữ chỉ dùng **quá khứ đơn**, không giữ should."},"tip":"Ba bước: **giữ người – bỏ should – lùi động từ**.","src":"tr. 389, 391–393","check":{"type":"fill","q":"Tom should start studying now. → It's time Tom ___ studying.","answer":["started"],"explain":"Giữ Tom, bỏ should, lùi *start* về quá khứ → **started**.","src":"tự soạn"}}],"practice":[{"type":"classify","q":"Câu nào đúng, câu nào sai?","buckets":["Đúng","Sai"],"items":[{"text":"It's time we left.","bucket":0},{"text":"It's time to leave.","bucket":0},{"text":"It's time for us to leave.","bucket":0},{"text":"It's time we leave.","bucket":1},{"text":"It's time for us leaving.","bucket":1},{"text":"It's time for we to leave.","bucket":1}],"explain":"Ba dạng đúng: **+ S + quá khứ đơn** (we left), **+ to-V** (to leave), **+ for + tân ngữ + to-V** (for us to leave). Sai: *we leave* (phải quá khứ), *for us leaving* (phải to-V), *for we* (sau for là tân ngữ us).","src":"tr. 389"},{"type":"mcq","q":"It's ___ time you stopped playing games and did your homework.","options":["high","big","long"],"answer":0,"explain":"Cụm cố định là **It's high time** (đã đến lúc, nhấn mạnh). Không nói *big time / long time* trong cấu trúc này.","src":"tr. 389"},{"type":"fill","q":"It's late. It's time the kids ___ to sleep. (go)","answer":["went"],"explain":"Có chủ ngữ *the kids* → **quá khứ đơn**: went.","src":"tự soạn"},{"type":"fill","q":"It's high time for the government ___ something about the traffic. (do)","answer":["to do"],"explain":"Có **for + tân ngữ** (the government) → **to + V nguyên mẫu**: to do.","src":"tự soạn"},{"type":"mcq","q":"This room is a mess. It's about time you ___ it.","options":["tidied","tidy","will tidy"],"answer":0,"explain":"**It's about time** = It's time. Sau chủ ngữ *you* → quá khứ đơn **tidied**, nghĩa là dọn ngay bây giờ.","src":"tự soạn"},{"type":"mcq","q":"Chọn câu đúng:","options":["It's time we had a holiday.","It's time we have a holiday.","It's time we should have a holiday."],"answer":0,"explain":"Sau It's time + S chỉ dùng **quá khứ đơn**: *we had*. Hiện tại đơn (*have*) và *should have* đều sai theo sách.","src":"tr. 389, 392"},{"type":"fix","wrong":"It's time you go to bed.","answer":["It's time you went to bed."],"explain":"It's time + you → động từ **quá khứ đơn**: go → **went**.","src":"tự soạn"},{"type":"fix","wrong":"It's high time for him to found a job.","answer":["It's high time for him to find a job."],"explain":"Sau **for + tân ngữ** là **to + V nguyên mẫu**: to find (không chia quá khứ). Chú ý *found* còn là quá khứ của *find*.","src":"tự soạn"},{"type":"fix","wrong":"It's time for they to start the meeting.","answer":["It's time for them to start the meeting."],"explain":"Sau giới từ **for** là **tân ngữ**: they → **them**.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["It's","about","time","you","told","her","the","truth."],"explain":"It's about time + you + **told** (quá khứ đơn, nghĩa hiện tại): đã đến lúc bạn nói thật với cô ấy.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["It's","time","for","me","to","say","goodbye."],"explain":"It's time + **for me** + **to say**: đã đến lúc tôi phải chào tạm biệt.","src":"tự soạn"},{"type":"fill","q":"You should get your hair cut. → It's time you ___ your hair cut. (get)","answer":["got"],"explain":"Bỏ should, lùi *get* về quá khứ: **got**.","src":"tr. 391–393"}],"flashcards":[{"front":"It's time + chủ ngữ + động từ ở dạng nào?","back":"**Quá khứ đơn**, nhưng nghĩa hiện tại: It's time we **went** home."},{"front":"It's time + (không có chủ ngữ) + ?","back":"**to-V**: It's time **to buy** a new car."},{"front":"It's time + for + ?","back":"for + **tân ngữ** + **to-V**: It's high time **for the children to go** to bed."},{"front":"Ba cách mở đầu 'đã đến lúc' trong sách?","back":"**It's time / It's high time / It's about time** + S + V quá khứ."},{"front":"Sửa: It's time we should go.","back":"Bỏ should: It's time we **went**."}]},{"id":"05b","title":"Would rather: thích hơn và muốn ai đó làm gì","minutes":25,"goal":"Dùng would rather đúng bốn dạng: chính mình làm (V nguyên mẫu; have + V3 khi nói quá khứ) và muốn người khác làm (S + quá khứ đơn; S + quá khứ hoàn thành khi nói quá khứ); phủ định bằng would rather not.","pretest":[{"type":"mcq","q":"I'm tired. I'd rather ___ at home tonight.","options":["stay","to stay","staying"],"answer":0,"explain":"Sau **would rather** là **V nguyên mẫu không to**: stay.","src":"tr. 389"},{"type":"mcq","q":"I'd rather you ___ home now.","options":["went","go","will go"],"answer":0,"explain":"Muốn **người khác** (you) làm gì bây giờ → **quá khứ đơn**: went. Sách ghi rõ [NOT I'd rather you go home now].","src":"tr. 390"},{"type":"mcq","q":"Chọn câu đúng:","options":["I'd rather not go out tonight.","I wouldn't rather go out tonight.","I'd not rather go out tonight."],"answer":0,"explain":"Phủ định: **not đứng sau rather**: would rather **not** + V. Không nói *wouldn't rather*.","src":"tr. 389"}],"hook":{"icon":"🍵","text":"Bạn bè rủ đi ăn lẩu, bạn đáp: 'Thôi, tôi **thích** ở nhà **hơn**.' → *I'd rather stay at home.* Còn khi bạn muốn **người khác** làm gì: 'Tôi muốn anh về ngay' → *I'd rather you **went** home now.* Giống It's time, khi nói về người khác thì động từ lại **lùi về quá khứ**. Bài này cho bạn hai câu hỏi để chọn dạng: **Ai làm?** và **Lúc nào?**"},"diagram":{"type":"flow","title":"Chọn dạng sau would rather","start":{"q":"Ai làm việc đó?","branches":[{"label":"Chính mình","to":{"q":"Bây giờ / sắp tới hay đã qua?","branches":[{"label":"Bây giờ / sắp tới","to":{"result":"+ V nguyên mẫu: I'd rather stay","icon":"🙋"}},{"label":"Đã qua","to":{"result":"+ have + V3: I'd rather have gone","icon":"⏮️"}}]}},{"label":"Người khác","to":{"q":"Bây giờ / sắp tới hay đã qua?","branches":[{"label":"Bây giờ / sắp tới","to":{"result":"+ S + V quá khứ: you went","icon":"👉"}},{"label":"Đã qua","to":{"result":"+ S + had V3: you had met","icon":"🕰️"}}]}}]}},"chunks":[{"title":"Would rather + V nguyên mẫu (than…)","icon":"🙋","rule":"**Would rather + V nguyên mẫu** (không to) = thích làm gì **hơn**, trong một tình huống cụ thể; so sánh bằng **than + V nguyên mẫu**; phủ định là **would rather not + V**.","explain":"*would rather do* = *would prefer to do*: 'thích… hơn' cho **một lần cụ thể** (tối nay, bây giờ); sách nói không dùng cho trường hợp tổng quát. Hay viết tắt: **I'd rather, you'd rather, she'd rather...** (I'd = I would). Hai vế quanh *than* đều là V nguyên mẫu: *walk than take*. Phủ định: đặt **not sau rather**, không nói *wouldn't rather*. Câu hỏi: *Would you rather + V…?*","formula":"S + would rather (+ not) + V nguyên mẫu (+ than + V nguyên mẫu)\nwould rather do = would prefer to do","examples":[{"en":"I **would rather stay** at home tonight.","vi":"Tối nay tôi thích ở nhà hơn."},{"en":"**Would** you **rather have** tea or coffee?","vi":"Bạn thích dùng trà hay cà phê hơn?"},{"en":"I'm tired. **I'd rather not go** out this evening.","vi":"Tôi mệt. Tối nay tôi không thích đi chơi."},{"en":"We'd **rather walk than take** a bus.","vi":"Chúng tôi thích đi bộ hơn đi xe buýt."},{"en":"I wouldn't rather go out.","ok":false,"note":"phủ định: I'd rather not go"}],"mistake":{"wrong":"I'd rather to go by train.","right":"I'd rather go by train.","why":"Sau would rather là V nguyên mẫu **không to**. Có to là *would prefer*: I'd prefer to go."},"tip":"**rather** không đi với **to**; **prefer** thì cần **to**.","src":"tr. 389–390","check":{"type":"fill","q":"I'd rather cook at home ___ eat out tonight.","answer":["than"],"explain":"So sánh hai việc: would rather + V **than** + V.","src":"tự soạn"}},{"title":"Would rather have + V3: chuyện đã qua","icon":"⏮️","rule":"Nói về **quá khứ** (mình muốn đã làm khác đi nhưng không được), dùng **would rather (+ not) + have + V3**.","explain":"Việc đã xong, không đổi được nữa, nên dùng **have + V3** (quá khứ phân từ). *We went by sea but I'd rather have gone by air* = tôi muốn đi máy bay nhưng không được như ý. Vẫn so sánh được bằng **than**; phủ định là **would rather not have + V3**: thà đã không làm còn hơn.","formula":"S + would rather (+ not) + have + V3 (+ than …)","examples":[{"en":"We went by sea but **I'd rather have gone** by air.","vi":"Chúng tôi đã đi bằng tàu thủy nhưng tôi thích đi bằng máy bay hơn."},{"en":"Tommy **would rather have gone** skiing **than** fishing last weekend.","vi":"Cuối tuần trước, Tommy thích đi trượt tuyết hơn đi câu."},{"en":"The film was boring. **I'd rather not have seen** it.","vi":"Phim chán quá. Thà tôi đừng xem còn hơn."},{"en":"Yesterday I'd rather stayed at home.","ok":false,"note":"việc của mình ở quá khứ: have stayed"}],"mistake":{"wrong":"I'd rather went by plane last summer.","right":"I'd rather have gone by plane last summer.","why":"Chính mình làm, nói về quá khứ → **have + V3**, không dùng V2."},"tip":"Chuyện **đã qua** của mình → thêm **have**.","src":"tr. 390","check":{"type":"mcq","q":"We stayed at a cheap hotel, but I'd rather ___ at a better one.","options":["have stayed","stayed","stay"],"answer":0,"explain":"Việc đã qua (we stayed), chính mình muốn khác → **have + V3**: have stayed.","src":"tự soạn"}},{"title":"Would rather + S + V quá khứ đơn","icon":"👉","rule":"Muốn **người khác** làm gì ở hiện tại / tương lai: **would rather (that) + S + V quá khứ đơn**; không dùng hiện tại đơn.","explain":"Khi có **chủ ngữ thứ hai** (you, she, they...) sau would rather, nghĩa là 'mong, muốn' người đó làm gì. Giống It's time, động từ **lùi về quá khứ đơn** nhưng nghĩa là bây giờ hoặc sắp tới. Phủ định: **didn't + V**. Trả lời ngắn: *I'd rather you didn't.* (Tôi muốn bạn đừng làm). *that* có thể có hoặc bỏ. **Lưu ý (sách):** **were** có thể thay **was** với I, he, she, it.","formula":"S + would rather (that) + S2 + V2/ed\nS + would rather + S2 + didn't + V","examples":[{"en":"**I'd rather you went** home now.","vi":"Tôi muốn anh về nhà ngay."},{"en":"Shall I open a window? ~ **I'd rather you didn't**.","vi":"Tôi mở cửa sổ nhé? ~ Tôi muốn bạn đừng mở."},{"en":"Tomorrow's difficult. **I'd rather you came** next weekend.","vi":"Ngày mai thì khó đấy. Tôi muốn bạn đến vào cuối tuần tới."},{"en":"I feel embarrassed about what happened and would rather **the event was / were forgotten**.","vi":"Tôi thấy bối rối về chuyện đã xảy ra và mong rằng sự việc này sẽ được quên đi."},{"en":"I'd rather you go home now.","ok":false,"note":"phải dùng quá khứ: went"}],"mistake":{"wrong":"I'd rather you don't smoke here.","right":"I'd rather you didn't smoke here.","why":"Người khác làm, ở hiện tại → **quá khứ đơn**: didn't smoke."},"tip":"Có **người thứ hai** → động từ **lùi về quá khứ** (giống It's time).","src":"tr. 390","check":{"type":"fill","q":"Tomorrow I'm busy. I'd rather you ___ on Friday. (come)","answer":["came"],"explain":"Muốn người khác (you) làm ở tương lai → **quá khứ đơn**: came.","src":"tự soạn"}},{"title":"Would rather + S + quá khứ hoàn thành","icon":"🕰️","rule":"Mong **người khác / sự việc** đã khác đi **trong quá khứ**: **would rather (that) + S + had + V3**; ở trường hợp này **wish** thường được dùng hơn.","explain":"Việc đã xảy ra rồi, nên lùi thêm một bậc: **quá khứ hoàn thành** (had + V3). *Roberto would rather we hadn't left yesterday* = nhưng hôm qua chúng tôi đã đi. Sách nói với mong muốn về quá khứ, người ta hay dùng **wish** hơn would rather: *I wish you had met my future wife* (học kỹ ở chủ đề Wish và If only).","formula":"S + would rather (that) + S2 + had (not) + V3\n≈ S + wish + S2 + had + V3","examples":[{"en":"Roberto **would rather we hadn't left** yesterday.","vi":"Roberto muốn hôm qua chúng tôi đã không ra đi."},{"en":"**I would rather you had met** my future wife.","vi":"Tôi muốn anh đã gặp vợ sắp cưới của tôi."},{"en":"**I wish you had met** my future wife.","vi":"Ước gì anh đã gặp vợ sắp cưới của tôi."},{"en":"Mary left early last night. I'd rather she didn't leave so early.","ok":false,"note":"đã qua → hadn't left"}],"mistake":{"wrong":"I'd rather you didn't tell her yesterday.","right":"I'd rather you hadn't told her yesterday.","why":"Chuyện **đã xảy ra** (yesterday) → quá khứ hoàn thành: **hadn't told**."},"tip":"Người khác + **bây giờ** → V2. Người khác + **đã qua** → **had V3**.","src":"tr. 390","check":{"type":"mcq","q":"You told everyone my secret last week! I'd rather you ___ anyone.","options":["hadn't told","didn't tell","don't tell"],"answer":0,"explain":"Việc đã xảy ra (last week), muốn người khác đã làm khác → **hadn't told**. *didn't tell* dùng cho bây giờ / sắp tới.","src":"tự soạn"}}],"practice":[{"type":"classify","q":"Mỗi câu nói về việc của ai?","buckets":["Chính người nói","Người khác"],"items":[{"text":"I'd rather walk.","bucket":0},{"text":"I'd rather you walked.","bucket":1},{"text":"I'd rather not say.","bucket":0},{"text":"I'd rather she stayed.","bucket":1},{"text":"I'd rather have gone by air.","bucket":0},{"text":"I'd rather they hadn't come.","bucket":1}],"explain":"Sau would rather mà **có chủ ngữ mới** (you, she, they) là muốn **người khác** làm → động từ lùi về quá khứ. Không có chủ ngữ mới → chính người nói, dùng V nguyên mẫu hoặc have + V3.","src":"tr. 389–390"},{"type":"mcq","q":"I'd rather ___ tea than coffee, please.","options":["have","to have","having"],"answer":0,"explain":"would rather + **V nguyên mẫu** không to: have.","src":"tự soạn"},{"type":"fill","q":"I'm full. I'd ___ not eat any more.","answer":["rather"],"explain":"Phủ định: would **rather** not + V.","src":"tự soạn"},{"type":"fill","q":"I'd rather you ___ the window. It's cold. (not open)","answer":["didn't open","did not open"],"explain":"Muốn người khác đừng làm, bây giờ → **didn't + V**: didn't open.","src":"tự soạn"},{"type":"fill","q":"The concert last night was terrible. I'd rather ___ at home. (stay)","answer":["have stayed"],"explain":"Buổi hòa nhạc đã qua, chính mình tiếc → **have + V3**: have stayed.","src":"tự soạn"},{"type":"fill","q":"Jane would rather we ___ her party last Saturday. (not miss)","answer":["hadn't missed","had not missed"],"explain":"Người khác (we), việc đã qua (last Saturday) → **quá khứ hoàn thành**: hadn't missed.","src":"tự soạn"},{"type":"mcq","q":"Do you mind if I use your phone? ~ I'd rather you ___.","options":["didn't","don't","won't"],"answer":0,"explain":"Câu trả lời ngắn vẫn giữ quá khứ: **I'd rather you didn't** (tôi muốn bạn đừng).","src":"tr. 390"},{"type":"fix","wrong":"I wouldn't rather watch that film.","answer":["I'd rather not watch that film.","I would rather not watch that film."],"explain":"Phủ định của would rather: **would rather not** + V. Không nói *wouldn't rather*.","src":"tr. 389"},{"type":"fix","wrong":"She'd rather her son studies medicine.","answer":["She'd rather her son studied medicine.","She would rather her son studied medicine."],"explain":"Muốn người khác (her son) làm → **quá khứ đơn**: studied, không dùng hiện tại *studies*.","src":"tự soạn"},{"type":"fix","wrong":"We'd rather to take a taxi than walk.","answer":["We'd rather take a taxi than walk.","We would rather take a taxi than walk."],"explain":"Sau would rather là **V nguyên mẫu không to**: take.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I'd","rather","you","didn't","tell","anyone."],"explain":"would rather + **you** + **didn't tell**: tôi muốn bạn đừng kể với ai.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Would","you","rather","stay","in","or","go","out?"],"answer":["Would you rather stay in or go out?","Would you rather go out or stay in?"],"explain":"Câu hỏi: **Would you rather + V nguyên mẫu** … or …? (Bạn thích ở nhà hay ra ngoài hơn?)","src":"tự soạn"}],"flashcards":[{"front":"would rather + ? (chính mình, bây giờ / sắp tới)","back":"**V nguyên mẫu** không to: I'd rather **stay** home."},{"front":"Phủ định của would rather?","back":"**would rather not** + V: I'd rather **not** go. (không nói wouldn't rather)"},{"front":"would rather do = would prefer ___ do?","back":"would prefer **to** do: I'd prefer **to** walk."},{"front":"would rather + chính mình + chuyện đã qua?","back":"**have + V3**: I'd rather **have gone** by air."},{"front":"would rather + người khác + bây giờ / sắp tới?","back":"S + **quá khứ đơn**: I'd rather you **went** home now."},{"front":"would rather + người khác + chuyện đã qua?","back":"S + **had V3**: Roberto would rather we **hadn't left** yesterday. (wish hay dùng hơn)"},{"front":"Từ chối lịch sự 'Tôi muốn bạn đừng làm vậy'?","back":"**I'd rather you didn't.**"}]}],"quiz":{"pass":0.8,"sets":[[{"type":"mcq","q":"It's time I ___ my mum. I haven't called her for weeks.","options":["called","call","calling"],"answer":0,"explain":"It's time + **I** (chủ ngữ) → **quá khứ đơn**: called. Nghĩa là gọi ngay bây giờ.","src":"tự soạn"},{"type":"mcq","q":"It's high time the government ___ the problem.","options":["solved","solves","solve"],"answer":0,"explain":"It's high time + S → quá khứ đơn **solved**; hiện tại *solves/solve* là lỗi hay gặp.","src":"tự soạn"},{"type":"fill","q":"It's nearly midnight. It's time we ___ to bed. (go)","answer":["went"],"explain":"It's time + we → **went** (quá khứ đơn, nghĩa hiện tại).","src":"tự soạn"},{"type":"fill","q":"You've worn those shoes for five years. It's time you ___ some new ones. (buy)","answer":["bought"],"explain":"It's time + you → quá khứ đơn: buy → **bought**.","src":"tự soạn"},{"type":"fill","q":"It's time for Anna ___ her own decisions. (make)","answer":["to make"],"explain":"**for + tân ngữ** (Anna) → **to + V**: to make.","src":"tự soạn"},{"type":"mcq","q":"It's time ___ the meeting. Everyone is here.","options":["to start","started","starting"],"answer":0,"explain":"Không có chủ ngữ sau It's time → **to-V**: to start. *started* cần có chủ ngữ (It's time we started).","src":"tự soạn"},{"type":"fix","wrong":"It's about time you learn to cook.","answer":["It's about time you learned to cook.","It's about time you learnt to cook."],"explain":"It's about time + you → quá khứ đơn: **learned / learnt**.","src":"tự soạn"},{"type":"fix","wrong":"It's time for us went home.","answer":["It's time for us to go home.","It's time we went home."],"explain":"Sau **for us** phải là **to + V**: to go. (Hoặc bỏ for, dùng chủ ngữ: It's time **we went** home.)","src":"tự soạn"},{"type":"classify","q":"Mỗi câu dùng dạng nào của It's time?","buckets":["+ S + V quá khứ","+ (for O) + to-V"],"items":[{"text":"It's time you knew the truth.","bucket":0},{"text":"It's time to say sorry.","bucket":1},{"text":"It's high time she found a job.","bucket":0},{"text":"It's time for Tom to wake up.","bucket":1},{"text":"It's about time they paid us.","bucket":0},{"text":"It's high time for me to rest.","bucket":1}],"explain":"Có chủ ngữ ngay sau time (you, she, they) → động từ **quá khứ** (knew, found, paid). Có *to* (có thể kèm for + tân ngữ) → nhóm **to-V**.","src":"tr. 389"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["It's","high","time","you","went","to","the","dentist."],"explain":"It's high time + you + **went** (quá khứ đơn): đã đến lúc bạn đi nha sĩ.","src":"tự soạn"},{"type":"mcq","q":"Câu 'It's time we left.' nói về lúc nào?","options":["Bây giờ: chúng ta nên đi ngay","Quá khứ: chúng ta đã đi rồi","Tương lai xa: một ngày nào đó"],"answer":0,"explain":"Sau It's time, động từ chia quá khứ nhưng **mang nghĩa hiện tại**.","src":"tr. 389"},{"type":"mcq","q":"Bạn nghĩ anh trai nên bỏ thuốc lá. Bạn nói:","options":["It's time you stopped smoking.","It's time you stop smoking.","It's time you will stop smoking."],"answer":0,"explain":"It's time + you + **quá khứ đơn**: stopped.","src":"tr. 391"},{"type":"fill","q":"The cars are really dirty. It's time they ___ washed. (be)","answer":["were"],"explain":"Câu bị động sau It's time: be chia quá khứ, chủ ngữ số nhiều → **were** washed.","src":"tr. 389"},{"type":"fix","wrong":"It's high time we should do something about the noise.","answer":["It's high time we did something about the noise."],"explain":"Bỏ should, dùng **quá khứ đơn**: did.","src":"tr. 392"},{"type":"mcq","q":"Chọn câu SAI:","options":["It's time to go.","It's time we went.","It's time for us to go.","It's time we go."],"answer":3,"explain":"Ba câu đầu là ba dạng đúng. *It's time we go* sai vì sau It's time + S phải dùng quá khứ: **went**.","src":"tr. 389"},{"type":"fill","q":"It's high time ___ him to look for a better job.","answer":["for"],"explain":"Dạng **for + tân ngữ + to-V**: for him to look.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["It's","time","for","the","kids","to","have","a","bath."],"explain":"It's time + **for the kids** + **to have**: đã đến giờ bọn trẻ tắm.","src":"tự soạn"},{"type":"mcq","q":"It's late, Peter. It's time you ___ off the computer.","options":["turned","turn","have turned"],"answer":0,"explain":"It's time + you → quá khứ đơn **turned**; không dùng hiện tại hay hiện tại hoàn thành.","src":"tự soạn"},{"type":"mcq","q":"I don't feel like cooking. I'd rather ___ out tonight.","options":["eat","to eat","eating"],"answer":0,"explain":"would rather + **V nguyên mẫu** không to: eat.","src":"tự soạn"},{"type":"fill","q":"___ stay at home than go to that party. (Tôi thích ở nhà hơn là đi dự bữa tiệc đó.)","answer":["I'd rather","I would rather"],"explain":"Chính mình thích hơn → **I'd rather / I would rather** + V nguyên mẫu + than + V nguyên mẫu.","src":"tự soạn"},{"type":"fill","q":"She'd rather read a book ___ watch TV.","answer":["than"],"explain":"So sánh hai việc: would rather + V **than** + V.","src":"tự soạn"},{"type":"mcq","q":"Chọn câu đúng:","options":["She'd rather not talk about it.","She wouldn't rather talk about it.","She'd rather not to talk about it."],"answer":0,"explain":"Phủ định: **would rather not + V nguyên mẫu** (không to). Không nói *wouldn't rather*.","src":"tr. 389"},{"type":"fill","q":"I'd rather walk. = I'd prefer ___ walk.","answer":["to"],"explain":"would rather do = would prefer **to** do.","src":"tr. 389"},{"type":"fix","wrong":"I would rather staying in tonight.","answer":["I would rather stay in tonight.","I'd rather stay in tonight."],"explain":"Sau would rather là **V nguyên mẫu**: stay, không dùng V-ing.","src":"tự soạn"},{"type":"mcq","q":"Theo sách, would rather (thích… hơn) dùng để nói về điều gì?","options":["Điều một người muốn làm trong một tình huống cụ thể","Sở thích chung, lâu dài","Thói quen trong quá khứ"],"answer":0,"explain":"Sách: would rather diễn đạt điều một người muốn làm **trong một tình huống cụ thể**, không dùng cho trường hợp tổng quát.","src":"tr. 389"},{"type":"mcq","q":"We took the train, but I'd rather ___ by car.","options":["have gone","went","go"],"answer":0,"explain":"Chuyến đi đã qua, chính mình muốn khác → **have + V3**: have gone.","src":"tự soạn"},{"type":"fill","q":"Last night I watched TV until 2 a.m., but I'd rather ___ to bed early. (go)","answer":["have gone"],"explain":"Chuyện tối qua của chính mình → **have + V3**: have gone.","src":"tự soạn"},{"type":"fix","wrong":"He'd rather have went to the beach.","answer":["He'd rather have gone to the beach.","He would rather have gone to the beach."],"explain":"Sau have là **V3** (quá khứ phân từ): gone, không phải went.","src":"tự soạn"},{"type":"mcq","q":"Bữa tiệc chán quá. Chọn câu nghĩa 'Thà tôi đã không đi còn hơn':","options":["I'd rather not have gone.","I'd rather haven't gone.","I'd rather not went."],"answer":0,"explain":"Phủ định ở quá khứ: **would rather not + have + V3**.","src":"tr. 390"},{"type":"mcq","q":"I'd rather you ___ me the truth now.","options":["told","tell","will tell"],"answer":0,"explain":"Muốn người khác (you) làm bây giờ → **quá khứ đơn**: told.","src":"tự soạn"},{"type":"fill","q":"My sister would rather I ___ her clothes. (not borrow)","answer":["didn't borrow","did not borrow"],"explain":"Muốn người khác (I) đừng làm → **didn't + V**: didn't borrow.","src":"tự soạn"},{"type":"fill","q":"I'd rather he ___ with us right now. (be)","answer":["was","were"],"explain":"Người khác, hiện tại → quá khứ đơn. Sách lưu ý: với I, he, she, it có thể dùng **was** hoặc **were**.","src":"tr. 390"},{"type":"fix","wrong":"I'd rather you don't park here.","answer":["I'd rather you didn't park here.","I would rather you didn't park here."],"explain":"Muốn người khác đừng làm → **didn't** park, không dùng hiện tại *don't*.","src":"tự soạn"},{"type":"fill","q":"Shall I call you tonight? ~ I'd rather you ___. I'm going to bed early.","answer":["didn't","did not"],"explain":"Trả lời ngắn vẫn giữ quá khứ: **I'd rather you didn't**.","src":"tr. 390"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I'd","rather","you","came","next","week."],"explain":"would rather + **you** + **came** (quá khứ đơn, nghĩa tương lai): tôi muốn bạn đến vào tuần sau.","src":"tự soạn"},{"type":"mcq","q":"Last night you drove too fast. I'd rather you ___ so fast.","options":["hadn't driven","didn't drive","don't drive"],"answer":0,"explain":"Việc **đã qua** (last night) của người khác → **quá khứ hoàn thành**: hadn't driven.","src":"tự soạn"},{"type":"fill","q":"The coach would rather we ___ harder before yesterday's match. (train)","answer":["had trained"],"explain":"Người khác (we), việc trước trận hôm qua → **had + V3**: had trained.","src":"tự soạn"},{"type":"fix","wrong":"I'd rather you didn't sell the house last year.","answer":["I'd rather you hadn't sold the house last year.","I would rather you hadn't sold the house last year."],"explain":"Việc đã xảy ra (last year) → **quá khứ hoàn thành**: hadn't sold.","src":"tự soạn"},{"type":"mcq","q":"Với mong muốn về quá khứ, sách nói từ nào thường được dùng hơn would rather?","options":["wish","hope","prefer"],"answer":0,"explain":"Sách: 'trong trường hợp này **wish** thường được dùng hơn would rather', vd *I wish you had met my future wife.*","src":"tr. 390"},{"type":"mcq","q":"Câu nào cùng nghĩa với 'I would rather you had come to my wedding.'?","options":["I wish you had come to my wedding.","I hope you came to my wedding.","I'd rather come to your wedding."],"answer":0,"explain":"would rather + S + had V3 ≈ **wish + S + had V3**: tiếc vì bạn đã không đến.","src":"tr. 390"},{"type":"classify","q":"Mỗi câu dùng dạng nào sau would rather?","buckets":["V nguyên mẫu","have + V3","S + V quá khứ","S + had V3"],"items":[{"text":"I'd rather go now.","bucket":0},{"text":"I'd rather have stayed longer.","bucket":1},{"text":"I'd rather you stayed longer.","bucket":2},{"text":"I'd rather you had stayed longer.","bucket":3},{"text":"We'd rather not wait.","bucket":0},{"text":"She'd rather they left now.","bucket":2}],"explain":"Không có chủ ngữ mới: V nguyên mẫu (bây giờ) hoặc have + V3 (đã qua). Có chủ ngữ mới: V quá khứ (bây giờ) hoặc had V3 (đã qua).","src":"tr. 389–390"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["She'd","rather","have","studied","law","than","medicine."],"answer":["She'd rather have studied law than medicine.","She'd rather have studied medicine than law."],"explain":"Chính mình, quá khứ: would rather **have studied** … than …: cô ấy thích (đã) học luật hơn y.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Would","you","rather","we","met","tomorrow?"],"explain":"Hỏi ý người nghe về việc của người khác (we): Would you rather + **we met** (quá khứ đơn, nghĩa tương lai)?","src":"tự soạn"},{"type":"mcq","q":"Chọn câu đúng:","options":["It's time you got up.","I'd rather you get up.","It's time you get up."],"answer":0,"explain":"Cả It's time + S và would rather + S đều cần **quá khứ đơn**: got up. Hai câu còn lại dùng hiện tại nên sai.","src":"tự soạn"},{"type":"mcq","q":"Điểm chung của 'It's time we left' và 'I'd rather you left'?","options":["Động từ ở quá khứ đơn nhưng nghĩa hiện tại","Cả hai kể chuyện đã xảy ra","Cả hai dùng V nguyên mẫu"],"answer":0,"explain":"Sau It's time + S và would rather + S, động từ lùi về **quá khứ đơn** nhưng nói về bây giờ / sắp tới.","src":"tr. 389–390"},{"type":"fix","wrong":"I'd rather you to wait outside.","answer":["I'd rather you waited outside.","I would rather you waited outside."],"explain":"would rather + S + **V quá khứ đơn**: you waited. Không dùng *you to wait* (đó là cấu trúc của want).","src":"tự soạn"},{"type":"fill","q":"You must stop eating junk food. → It's time you ___ eating junk food.","answer":["stopped"],"explain":"Bỏ must, lùi động từ: **stopped**.","src":"tr. 391–393"},{"type":"fill","q":"I want you to come with me. → I'd rather you ___ with me.","answer":["came"],"explain":"Muốn người khác làm → would rather + you + **came**.","src":"tr. 393"},{"type":"fill","q":"They didn't invite me. → I'd rather they ___ me. (invite)","answer":["had invited"],"explain":"Việc đã qua (didn't invite) → **had + V3**: had invited.","src":"tr. 393"},{"type":"mcq","q":"I'd prefer to sit by the window. = I'd rather ___ by the window.","options":["sit","to sit","sat"],"answer":0,"explain":"would prefer **to** do = would rather **do** (không to).","src":"tự soạn"}],[{"type":"mcq","q":"Look at the time! It's time we ___.","options":["left","leave","are leaving"],"answer":0,"explain":"It's time + we → quá khứ đơn **left**, nghĩa là đi ngay bây giờ.","src":"tự soạn"},{"type":"mcq","q":"It's high time Mike ___ responsible for his own life.","options":["became","becomes","become"],"answer":0,"explain":"It's high time + Mike → quá khứ đơn: become → **became**.","src":"tự soạn"},{"type":"fill","q":"Your hair is too long. It's time you ___ it cut. (have)","answer":["had"],"explain":"It's time + you → quá khứ đơn của have: **had**.","src":"tự soạn"},{"type":"fill","q":"The kids have been playing all day. It's time they ___ a rest. (take)","answer":["took"],"explain":"It's time + they → quá khứ đơn: take → **took**.","src":"tự soạn"},{"type":"fill","q":"It's about time somebody ___ him the truth. (tell)","answer":["told"],"explain":"It's about time + somebody → quá khứ đơn: **told**.","src":"tự soạn"},{"type":"fill","q":"It's time for the students ___ their exam papers. (hand in)","answer":["to hand in"],"explain":"**for + tân ngữ** (the students) → **to + V**: to hand in.","src":"tự soạn"},{"type":"mcq","q":"It's high time for you ___ your own flat.","options":["to rent","rented","rent"],"answer":0,"explain":"Có **for you** → **to-V**: to rent.","src":"tự soạn"},{"type":"fix","wrong":"It's time you take your medicine.","answer":["It's time you took your medicine."],"explain":"It's time + you → **quá khứ đơn**: took.","src":"tự soạn"},{"type":"fix","wrong":"It's high time for her to learned to drive.","answer":["It's high time for her to learn to drive."],"explain":"Sau to là **V nguyên mẫu**: to learn, không chia quá khứ.","src":"tự soạn"},{"type":"fix","wrong":"It's time for he to apologise.","answer":["It's time for him to apologise.","It's time for him to apologize."],"explain":"Sau giới từ for là **tân ngữ**: he → **him**.","src":"tự soạn"},{"type":"classify","q":"Câu nào đúng, câu nào sai?","buckets":["Đúng","Sai"],"items":[{"text":"It's high time we started.","bucket":0},{"text":"It's about time you paid.","bucket":0},{"text":"It's time for her to rest.","bucket":0},{"text":"It's time she rests.","bucket":1},{"text":"It's time to went.","bucket":1},{"text":"It's high time we should start.","bucket":1}],"explain":"Đúng: + S + quá khứ (we started, you paid), + for + O + to-V. Sai: *she rests* (phải rested), *to went* (sau to là V nguyên mẫu), *we should start* (bỏ should, dùng started).","src":"tr. 389"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["It's","time","we","did","something","about","it."],"explain":"It's time + we + **did** (quá khứ đơn): đã đến lúc chúng ta làm gì đó.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["It's","high","time","for","you","to","find","a","job."],"explain":"It's high time + **for you** + **to find**.","src":"tự soạn"},{"type":"mcq","q":"Đã 11 giờ đêm, bạn nghĩ bọn trẻ nên đi ngủ. Bạn nói:","options":["It's time the children went to bed.","It's time the children go to bed.","It's time the children to go to bed."],"answer":0,"explain":"It's time + the children + **went** (quá khứ đơn). *the children to go* thiếu *for*.","src":"tr. 391"},{"type":"mcq","q":"Trong 'It's high time you got a job.', got ở dạng nào và mang nghĩa lúc nào?","options":["Quá khứ đơn, nghĩa hiện tại","Quá khứ đơn, nghĩa quá khứ","Hiện tại hoàn thành, nghĩa hiện tại"],"answer":0,"explain":"Sách: động từ chia ở **quá khứ** nhưng mang **nghĩa hiện tại**.","src":"tr. 389"},{"type":"fill","q":"The walls look old and dirty. It's time they ___ painted. (be)","answer":["were"],"explain":"Bị động sau It's time, chủ ngữ số nhiều → **were** painted.","src":"tự soạn"},{"type":"mcq","q":"The bus is twenty minutes late. It's about time it ___.","options":["came","comes","come"],"answer":0,"explain":"It's about time + it → quá khứ đơn **came**.","src":"tự soạn"},{"type":"mcq","q":"We've worked for three hours. It's time ___ a coffee break.","options":["to have","having","had"],"answer":0,"explain":"Không có chủ ngữ → **to-V**: to have. *had* cần chủ ngữ (It's time we had…).","src":"tự soạn"},{"type":"mcq","q":"It's a lovely day. I'd rather ___ in the garden than stay indoors.","options":["sit","to sit","sitting"],"answer":0,"explain":"would rather + **V nguyên mẫu** … than + V nguyên mẫu: sit … than stay.","src":"tự soạn"},{"type":"fill","q":"___ you rather go to the beach or to the mountains?","answer":["Would"],"explain":"Câu hỏi: **Would** you rather + V…?","src":"tr. 389"},{"type":"fill","q":"I'm too tired. I'd rather ___ go to the gym today.","answer":["not"],"explain":"Phủ định: would rather **not** + V.","src":"tự soạn"},{"type":"mcq","q":"Chọn câu đúng:","options":["They'd rather walk than take a taxi.","They'd rather walk than taking a taxi.","They'd rather walking than take a taxi."],"answer":0,"explain":"Hai vế quanh **than** đều là **V nguyên mẫu**: walk … take.","src":"tr. 389–390"},{"type":"fix","wrong":"I'd rather not to answer that question.","answer":["I'd rather not answer that question.","I would rather not answer that question."],"explain":"would rather not + **V nguyên mẫu không to**: answer.","src":"tự soạn"},{"type":"fix","wrong":"We'd prefer stay at home tonight.","answer":["We'd prefer to stay at home tonight.","We would prefer to stay at home tonight."],"explain":"would prefer cần **to**: prefer **to stay** (= would rather stay).","src":"tr. 389"},{"type":"fill","q":"I'd rather go to an opera ___ to the movies.","answer":["than"],"explain":"would rather + V … **than** …: thích đi xem opera hơn đi xem phim.","src":"tự soạn"},{"type":"fill","q":"Last summer we went to the mountains, but I'd rather ___ to the sea. (go)","answer":["have gone"],"explain":"Chuyện đã qua của chính mình → **have + V3**: have gone.","src":"tự soạn"},{"type":"mcq","q":"Did you enjoy the trip last weekend? ~ Not really. I'd rather ___ at home.","options":["have stayed","stayed","had stayed"],"answer":0,"explain":"Chính mình, chuyện đã qua → would rather **have + V3**. Không dùng *stayed* hay *had stayed* khi không có chủ ngữ mới.","src":"tự soạn"},{"type":"fix","wrong":"She would rather had stayed in bed this morning.","answer":["She would rather have stayed in bed this morning.","She'd rather have stayed in bed this morning."],"explain":"Chính mình, quá khứ: would rather **have** + V3, không phải *had*.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I'd","rather","not","have","told","him."],"explain":"Phủ định quá khứ: would rather **not have + V3**: thà tôi đừng kể với anh ta.","src":"tự soạn"},{"type":"mcq","q":"I'd rather you ___ your phone during dinner.","options":["didn't use","don't use","not use"],"answer":0,"explain":"Muốn người khác đừng làm → **didn't + V**: didn't use.","src":"tự soạn"},{"type":"fill","q":"Mum would rather we ___ home before ten tonight. (get)","answer":["got"],"explain":"Muốn người khác (we) làm, tối nay → **quá khứ đơn**: got.","src":"tự soạn"},{"type":"fill","q":"I'd rather the boss ___ about this yet. (not know)","answer":["didn't know","did not know"],"explain":"Muốn người khác (the boss) không biết, bây giờ → **didn't know**.","src":"tự soạn"},{"type":"fix","wrong":"I'd rather you will call me tomorrow.","answer":["I'd rather you called me tomorrow.","I would rather you called me tomorrow."],"explain":"Dù nghĩa là tương lai (tomorrow), sau would rather + S dùng **quá khứ đơn**: called.","src":"tự soạn"},{"type":"fix","wrong":"Peter would rather his wife doesn't work at night.","answer":["Peter would rather his wife didn't work at night.","Peter would rather his wife did not work at night."],"explain":"Người khác, hiện tại → **didn't** work.","src":"tự soạn"},{"type":"mcq","q":"This is just between us. I'd rather you ___ your friends.","options":["didn't tell","don't tell","hadn't told"],"answer":0,"explain":"Việc chưa xảy ra (bây giờ / sắp tới) → **quá khứ đơn**: didn't tell. *hadn't told* dành cho việc đã qua.","src":"tự soạn"},{"type":"mcq","q":"Chọn câu đúng:","options":["I'd rather she were here now.","I'd rather she is here now.","I'd rather she will be here now."],"answer":0,"explain":"Người khác, hiện tại → quá khứ đơn; với she có thể dùng **were** (hoặc was).","src":"tr. 390"},{"type":"fill","q":"This bag is nice, but I'd rather it ___ a bit cheaper. (be)","answer":["was","were"],"explain":"would rather + it + quá khứ đơn của be: **was** hoặc **were** (sách cho phép were với it).","src":"tr. 390"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I'd","rather","you","didn't","smoke","in","here."],"explain":"would rather + **you didn't smoke**: tôi muốn bạn đừng hút thuốc trong này.","src":"tự soạn"},{"type":"mcq","q":"You sold the old piano last month! I'd rather you ___ it.","options":["hadn't sold","didn't sell","don't sell"],"answer":0,"explain":"Việc đã xảy ra (last month) → **hadn't sold**.","src":"tự soạn"},{"type":"fill","q":"Lan would rather her brother ___ her diary yesterday. (not read)","answer":["hadn't read","had not read"],"explain":"Người khác, việc hôm qua → **had not + V3**: hadn't read.","src":"tự soạn"},{"type":"fix","wrong":"My parents would rather I didn't quit my job last year.","answer":["My parents would rather I hadn't quit my job last year.","My parents would rather I had not quit my job last year."],"explain":"Việc đã xảy ra (last year) → **quá khứ hoàn thành**: hadn't quit.","src":"tự soạn"},{"type":"fill","q":"I'd rather you had met my wife. = I ___ you had met my wife.","answer":["wish"],"explain":"Với mong muốn về quá khứ, **wish** thường được dùng hơn would rather.","src":"tr. 390"},{"type":"classify","q":"Mỗi câu nói về lúc nào?","buckets":["Bây giờ / sắp tới","Đã qua"],"items":[{"text":"I'd rather you hadn't come.","bucket":1},{"text":"I'd rather you came tomorrow.","bucket":0},{"text":"I'd rather have walked.","bucket":1},{"text":"I'd rather walk.","bucket":0},{"text":"He'd rather we didn't wait.","bucket":0},{"text":"He'd rather we hadn't waited.","bucket":1}],"explain":"**had V3** hoặc **have V3** → chuyện đã qua. **V nguyên mẫu** hoặc **S + V quá khứ đơn** → bây giờ / sắp tới.","src":"tr. 389–390"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["We'd","rather","you","hadn't","invited","them."],"explain":"Người khác, đã qua → would rather + you + **hadn't invited**.","src":"tự soạn"},{"type":"mcq","q":"Chọn câu SAI:","options":["I'd rather you went.","It's time you went.","I'd rather go.","I'd rather you go."],"answer":3,"explain":"*I'd rather you go* sai: có chủ ngữ mới thì phải dùng quá khứ **went**. Sách ghi rõ [NOT I'd rather you go home now].","src":"tr. 390"},{"type":"fill","q":"We should leave now. → It's high time we ___.","answer":["left"],"explain":"Bỏ should, lùi động từ: leave → **left**.","src":"tr. 393"},{"type":"fill","q":"I'd like you to stay a bit longer. → I'd rather you ___ a bit longer.","answer":["stayed"],"explain":"Muốn người khác làm → **quá khứ đơn**: stayed.","src":"tự soạn"},{"type":"fill","q":"I'd prefer not to go out tonight. → I'd rather ___ out tonight.","answer":["not go"],"explain":"would prefer not to go = would rather **not go**.","src":"tự soạn"},{"type":"fix","wrong":"It's high time you have a haircut.","answer":["It's high time you had a haircut."],"explain":"It's high time + you → **quá khứ đơn**: had.","src":"tự soạn"},{"type":"mcq","q":"He didn't come to the meeting. I'd rather he ___.","options":["had come","came","comes"],"answer":0,"explain":"Việc đã qua (didn't come) → **had + V3**: had come.","src":"tự soạn"}]]}}],"order":3}</script>
<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('course-data').textContent);
  var app = document.getElementById('app');
  var REVIEW_DAYS = [1, 3, 7, 14, 30];

  // ---------- storage (per viewer, optional) ----------
  var KEY = 'egc:' + D.slug;
  var S = { done: {}, quiz: {}, cards: {}, mix: 0 };
  try { var raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  try { var th = localStorage.getItem('egc:theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}

  // ---------- indexes ----------
  var lessonById = {}, topicById = {}, lessonTopic = {};
  D.topics.forEach(function (t) {
    topicById[t.id] = t;
    t.lessons.forEach(function (l) { lessonById[l.id] = l; lessonTopic[l.id] = t; });
  });

  // ---------- helpers ----------
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') n.className = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k === 'text') n.textContent = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    });
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  // safe mini-markup: **bold**, *italic*, ~~strike~~
  function fmt(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g, '$1<em>$2</em>')
      .replace(/~~(.+?)~~/g, '<del>$1</del>').replace(/\n/g, '<br>');
  }
  function rich(tag, s, cls) { return el(tag, { class: cls, html: fmt(s) }); }
  function srcTag(src) {
    if (!src) return null;
    var self = /tự soạn/i.test(src);
    return el('span', { class: 'src', text: (self ? '✍️ ' : '📖 ') + src });
  }
  // Commas are ignored: a beginner who writes the right words without "However," punctuation
  // should not be marked wrong.
  function norm(s) {
    return String(s).toLowerCase().replace(/[’‘`]/g, "'").replace(/[“”]/g, '"').replace(/,/g, ' ')
      .replace(/\s+/g, ' ').replace(/\s*([,.!?;:])\s*/g, '$1 ').replace(/[.!?\s]+$/, '').trim();
  }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function today() { return new Date().toISOString().slice(0, 10); }
  function addDays(iso, n) { var d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
  function fmtDate(iso) { var p = iso.split('-'); return p[2] + '/' + p[1]; }
  function go(h) { location.hash = h; }
  function confetti() {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var sy = ['🎉', '⭐', '✨', '🎊', '💯'];
    for (var i = 0; i < 36; i++) {
      var s = el('span', { class: 'confetti', text: sy[i % sy.length] });
      s.style.left = Math.random() * 100 + 'vw';
      s.style.animationDelay = Math.random() * 0.5 + 's';
      document.body.appendChild(s);
      setTimeout(function (n) { return function () { n.remove(); }; }(s), 2600);
    }
  }
  function ring(pct) {
    var r = 36, c = 2 * Math.PI * r;
    var svg = '<svg class="ring" viewBox="0 0 84 84"><circle class="bg" cx="42" cy="42" r="' + r + '"/>' +
      '<circle class="fg" cx="42" cy="42" r="' + r + '" stroke-dasharray="' + c + '" stroke-dashoffset="' + c + '"/>' +
      '<text x="42" y="49" text-anchor="middle">' + Math.round(pct) + '%</text></svg>';
    var w = el('div', { html: svg });
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      var fg = w.querySelector('.fg'); if (fg) fg.style.strokeDashoffset = c * (1 - pct / 100);
    }); });
    return w.firstChild;
  }
  function observeReveal(root) {
    var items = root.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) { items.forEach(function (n) { n.classList.add('in'); }); return; }
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    items.forEach(function (n) { io.observe(n); });
  }
  function topicProgress(t) {
    var n = t.lessons.filter(function (l) { return S.done[l.id]; }).length;
    return { done: n, total: t.lessons.length };
  }

  // ---------- diagrams ----------
  function wrapText(s, max) {
    var words = String(s).split(/\s+/), lines = [], cur = '';
    words.forEach(function (w) {
      if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; }
      else cur = (cur + ' ' + w).trim();
    });
    if (cur) lines.push(cur);
    return lines;
  }
  function toTree(n, kind, edge) {
    // mindmap: {label, icon?, children[]}; flow: {q, branches[{label,to}]} | {result, icon?}
    var label, kids = [], role;
    if (kind === 'flow') {
      if (n.result != null) { label = n.result; role = 'result'; }
      else { label = n.q; role = 'ask'; kids = (n.branches || []).map(function (b) { return toTree(b.to, kind, b.label); }); }
    } else {
      label = n.label; role = 'map';
      kids = (n.children || []).map(function (c) { return toTree(c, kind); });
    }
    if (n.icon) label = n.icon + ' ' + label;
    return { label: label, kids: kids, role: role, edge: edge };
  }
  var PALETTE = ['--c1', '--c2', '--c3', '--c4', '--c5', '--c6'];
  function measure(node, maxChars, fixedW) {
    node.lines = wrapText(node.label, maxChars);
    var longest = node.lines.reduce(function (m, l) { return Math.max(m, l.length); }, 0);
    node.w = fixedW || Math.min(260, Math.max(70, longest * 7.4 + 26));
    node.h = node.lines.length * 18 + 16;
    node.kids.forEach(function (k) { measure(k, maxChars, fixedW); });
  }
  function svgNode(n, color, cls, delay) {
    var t = n.lines.map(function (l, i) {
      return '<tspan x="' + (n.x + n.w / 2) + '" y="' + (n.y + 21 + i * 18) + '">' + esc(l) + '</tspan>';
    }).join('');
    var style = cls === 'map' || cls === 'root' ? ' style="fill:color-mix(in srgb, var(' + color + ') 14%, var(--surface));stroke:var(' + color + ')"' : '';
    return '<g class="node ' + cls + '" style="animation-delay:' + delay + 'ms"><rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="10"' + style + '/>' +
      '<text text-anchor="middle">' + t + '</text></g>';
  }
  function renderMindmap(d) {
    var root = toTree(d.root, 'map');
    measure(root, 24);
    var GAP = 12, HG = 46;
    function sh(n) { var s = n.kids.reduce(function (a, k) { return a + sh(k); }, 0) + GAP * Math.max(0, n.kids.length - 1); n.sh = Math.max(n.h, s); return n.sh; }
    sh(root);
    var maxX = 0;
    function place(n, top, x, depth, color) {
      n.x = x; n.depth = depth; n.color = color;
      if (n.kids.length) {
        var sum = n.kids.reduce(function (a, k) { return a + k.sh; }, 0) + GAP * (n.kids.length - 1);
        var y = top + (n.sh - sum) / 2;
        n.kids.forEach(function (k, i) { place(k, y, x + n.w + HG, depth + 1, depth === 0 ? PALETTE[i % PALETTE.length] : color); y += k.sh + GAP; });
        var f = n.kids[0], l = n.kids[n.kids.length - 1];
        n.y = (f.y + f.h / 2 + l.y + l.h / 2) / 2 - n.h / 2;
      } else n.y = top + (n.sh - n.h) / 2;

      var fb = el('div', { class: 'feedback ' + (ok ? 'good' : 'bad') });
      fb.appendChild(el('div', { html: (ok ? '✅ <b>Chính xác!</b>' : '❌ <b>Chưa đúng.</b>') + (!ok && answerText ? ' Đáp án: <span class="ans">' + fmt(answerText) + '</span>' : '') }));
      if (q.explain) fb.appendChild(rich('div', q.explain));
      var st = srcTag(q.src); if (st) fb.appendChild(st);
      wrap.appendChild(fb);
      if (onResult) onResult(ok);
    }
    var head = el('div', { class: 'qtext' }, [num != null ? el('span', { class: 'qnum', text: String(num) }) : null]);
    wrap.appendChild(head);

    if (q.type === 'mcq') {
      head.appendChild(rich('span', q.q));
      var opts = el('div', { class: 'opts' });
      var order = q.shuffle === false ? q.options.map(function (_, i) { return i; }) : shuffle(q.options.map(function (_, i) { return i; }));
      var btns = [];

        var b = el('button', { class: 'opt', html: fmt(q.options[i]), onclick: function () {
          btns.forEach(function (x) { x.disabled = true; });
          var ok = i === q.answer;
          b.classList.add(ok ? 'correct' : 'wrong');
          if (!ok) btns.forEach(function (x) { if (+x.dataset.i === q.answer) x.classList.add('correct'); });
          finish(ok, null);
        } });
        b.dataset.i = i; btns.push(b); opts.appendChild(b);

    } else if (q.type === 'fill') {

      head.appendChild(rich('span', parts[0]));

      head.appendChild(rich('span', parts.slice(1).join('___')));
      if (q.hint) wrap.appendChild(el('div', { class: 'small muted', text: '💡 ' + q.hint }));
      var cb = el('button', { class: 'btn ghost', text: 'Kiểm tra' });
      function chk() {

    } else if (q.type === 'fix') {

        var it = q.items[i], seg = el('div', { class: 'seg' }), sel = { v: -1 };
