hông** dùng *of whom* để chỉ sở hữu: phải dùng whose.","formula":"N + whose + N + …\n(her hair → whose hair, its name → whose name)","examples":[{"en":"It's the house **whose door** is painted red.","vi":"Đó là ngôi nhà có cửa màu đỏ."},{"en":"He's a man **whose opinion** I respect very much.","vi":"Ông ấy là người mà tôi rất tôn trọng ý kiến."},{"en":"He's written a book **of which** I've forgotten **the name**.","vi":"Ông ấy đã viết một cuốn sách mà tôi không nhớ tên."},{"en":"He had a sister the name of whom I've forgotten.","ok":false,"note":"sở hữu của người: whose name, không dùng of whom"}],"mistake":{"wrong":"I met a man who his car was stolen.","right":"I met a man whose car was stolen.","why":"'xe **của** anh ấy' trong mệnh đề quan hệ là **whose car**, không viết who his car."},"tip":"Thấy chữ '**của**' (của người đó, của nó) → **whose + danh từ**.","src":"tr. 324–326","check":{"type":"mcq","q":"The cat, ___ name is Molly, is sitting on the sofa.","options":["whose","which","who's"],"answer":0,"explain":"Tên **của** con mèo → **whose** name. which không chỉ sở hữu; who's = who is.","src":"tr. 324"}},{"title":"Không lặp lại đại từ","icon":"🚫","rule":"Đại từ quan hệ **đã thay** cho danh từ, nên **không lặp lại** he/she/it/they… trong mệnh đề quan hệ; nhưng khi đại từ quan hệ làm **tân ngữ**, mệnh đề vẫn phải có **chủ ngữ riêng**.","explain":"Cách gộp hai câu: tìm từ chỉ cùng một người/vật, **thay** nó bằng who/which/that/whose rồi đặt sát danh từ.\n*The people are away on holiday. **They** own that house.* → they thành who → *The people **who** own that house…* (không còn they).\n*We lost the match. We played **it** on Saturday.* → it thành that → *the match **that** we played on Saturday* (không còn it).\nNgười Việt hay mắc lỗi này vì tiếng Việt nói 'người mà **anh ấy** sống cạnh nhà tôi' vẫn được. Ngược lại, đừng xóa nhầm chủ ngữ thật: trong *the people who **we** met*, *we* là chủ ngữ; bỏ *we* đi câu sẽ sai.","diagram":{"type":"table","title":"Gộp hai câu: thay, không lặp","head":["Câu thứ hai","Thành mệnh đề quan hệ"],"rows":[["They own that house.","who own that house"],["We played it on Saturday.","that we played on Saturday"],["Her hair came down…","whose hair came down…"]]},"formula":"Câu 1 + Câu 2 (có he/she/it/they/him/her/its…)\n→ thay từ đó bằng who/which/that/whose, đặt sau danh từ","examples":[{"en":"The people **who** own that house are away on holiday.","vi":"Những người chủ căn nhà đó đang đi nghỉ."},{"en":"We lost the match **that** we played on Saturday.","vi":"Chúng tôi đã thua trận đấu hôm thứ Bảy."},{"en":"I saw a girl **whose hair** came down to her waist.","vi":"Tôi gặp một cô gái có mái tóc dài ngang eo."},{"en":"We lost the match that we played it on Saturday.","ok":false,"note":"that đã thay cho it → bỏ it"},{"en":"Do you remember the people who met in Italy?","ok":false,"note":"thiếu chủ ngữ we: who we met"}],"mistake":{"wrong":"The man who he lives next door is a doctor.","right":"The man who lives next door is a doctor.","why":"**who** đã đứng vào chỗ của *he*, nên bỏ *he*."},"tip":"Mỗi chỗ chỉ một người ngồi: **who** đã ngồi chỗ của **he** thì **he** phải ra ngoài.","src":"tr. 326","check":{"type":"fix","wrong":"This is the bag which I bought it last week.","answer":["This is the bag which I bought last week.","This is the bag that I bought last week.","This is the bag I bought last week."],"explain":"**which** đã thay cho *it* (tân ngữ của bought) → bỏ *it*.","src":"tự soạn"}}],"practice":[{"type":"mcq","q":"The woman ___ lives next door is a nurse.","options":["who","which","whose"],"answer":0,"explain":"woman là người, chỗ trống làm chủ ngữ của lives → **who**. which cho vật; whose cần danh từ theo sau.","src":"tự soạn"},{"type":"mcq","q":"I lost the umbrella ___ my mother gave me.","options":["which","who","whose"],"answer":0,"explain":"umbrella là vật → **which**. who chỉ dùng cho người.","src":"tự soạn"},{"type":"classify","q":"Danh từ nào đi với who, danh từ nào đi với which?","buckets":["who","which"],"items":[{"text":"teacher","bucket":0},{"text":"dog","bucket":1},{"text":"computer","bucket":1},{"text":"neighbours","bucket":0},{"text":"accident","bucket":1},{"text":"doctor","bucket":0},{"text":"letter","bucket":1},{"text":"children","bucket":0}],"explain":"**who**: người (teacher, neighbours, doctor, children). **which**: vật, con vật, sự việc (dog, computer, accident, letter). that thì dùng được cho cả hai nhóm.","src":"tr. 323"},{"type":"fill","q":"Is this the train ___ goes to Hanoi?","answer":["which","that"],"explain":"train là vật, chỗ trống làm chủ ngữ của goes → **which** hoặc **that**.","src":"tự soạn"},{"type":"fill","q":"I know a girl ___ father is a pilot.","answer":["whose"],"explain":"Bố **của** cô gái → **whose** father (thay cho her father).","src":"tự soạn"},{"type":"fill","q":"The students ___ passed the test got a prize.","answer":["who","that"],"explain":"students là người, chỗ trống làm chủ ngữ của passed → **who** hoặc **that**.","src":"tự soạn"},{"type":"mcq","q":"The writer ___ book I'm reading lives in Hanoi.","options":["whose","who","which"],"answer":0,"explain":"Cuốn sách **của** nhà văn → **whose** book. who/which không đứng trước danh từ để chỉ sở hữu.","src":"tự soạn"},{"type":"mcq","q":"Chọn câu đúng:","options":["The man whom you saw is my uncle.","The man whom lives here is my uncle."],"answer":0,"explain":"**whom** chỉ làm **tân ngữ**: *whom you saw* (you là chủ ngữ). Trong *whom lives here*, chỗ trống là chủ ngữ → phải dùng who.","src":"tr. 323"},{"type":"fix","wrong":"I have a cousin which works in a bank.","answer":["I have a cousin who works in a bank.","I have a cousin that works in a bank."],"explain":"cousin là người → **who** (hoặc that), không dùng which.","src":"tự soạn"},{"type":"fix","wrong":"The phone that I bought it yesterday is broken.","answer":["The phone that I bought yesterday is broken.","The phone which I bought yesterday is broken.","The phone I bought yesterday is broken."],"explain":"**that** đã thay cho *it* (tân ngữ của bought) → bỏ *it*.","src":"tr. 326"},{"type":"fix","wrong":"I met a woman who her son is a famous singer.","answer":["I met a woman whose son is a famous singer."],"explain":"Con trai **của** bà ấy → **whose son**, không viết *who her son*.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["The","girl","whose","bag","was","stolen","is","crying."],"explain":"Mệnh đề *whose bag was stolen* đứng ngay sau *The girl*; động từ chính *is crying* theo sau. Nghĩa: Cô gái bị mất cắp túi đang khóc.","src":"tự soạn"}],"flashcards":[{"front":"Mệnh đề quan hệ đứng ở đâu?","back":"**Ngay sau** danh từ nó bổ nghĩa: the man **who lives next door**"},{"front":"who / which dùng cho gì?","back":"**who**: người · **which**: vật, con vật, sự việc"},{"front":"that thay được cho gì?","back":"Cả người lẫn vật (thay who/whom/which), chỉ trong mệnh đề **xác định** (không dấu phẩy)"},{"front":"whom khác who ở đâu?","back":"**whom** chỉ làm tân ngữ, trang trọng: the scientists **whom** I admire"},{"front":"'của người/vật đó' trong mệnh đề quan hệ?","back":"**whose + N**: a girl **whose hair** was long"},{"front":"the man who he lives… sai ở đâu?","back":"Bỏ **he**: the man **who lives**… (who đã thay cho he)"}]},{"id":"02b","title":"Dùng that, lược bỏ đại từ; where, when, why","minutes":25,"goal":"Biết khi nào phải dùng that, khi nào bỏ được đại từ quan hệ, và dùng where, when, why thay cho nơi chốn, thời gian, lý do.","pretest":[{"type":"mcq","q":"It's the best film ___ I've ever seen.","options":["that","which","what"],"answer":0,"explain":"Sau **so sánh nhất** (the best), sách chỉ cho dùng **that**, không dùng which. what không làm đại từ quan hệ sau danh từ.","src":"tr. 324–325"},{"type":"mcq","q":"This is the town ___ I was born.","options":["where","which","when"],"answer":0,"explain":"town là **nơi chốn**, và *I was born* đã đủ chủ ngữ, động từ → **where** (= in which).","src":"tự soạn"},{"type":"mcq","q":"Câu 'The film that we saw last night was great.' có bỏ được *that* không?","options":["Được: The film we saw last night was great.","Không được"],"answer":0,"explain":"**that** là **tân ngữ** của saw (we là chủ ngữ) trong mệnh đề xác định → bỏ được.","src":"tr. 325","shuffle":false}],"hook":{"icon":"🧭","text":"Bài trước bạn đã có bộ 'chữ mà' **who, which, that, whose**. Bài này thêm ba điều. Một: lúc nào **chỉ that mới đúng**. Hai: lúc nào **bỏ hẳn chữ 'mà'**, giống tiếng Việt nói 'cái phim tụi mình xem hôm qua' mà không cần 'mà'. Ba: ba chữ 'mà' đặc biệt chỉ **nơi chốn, thời gian, lý do**: **where, when, why**."},"diagram":{"type":"mindmap","title":"Bài 02b trong một hình","root":{"label":"Mở rộng đại từ quan hệ","children":[{"label":"Phải dùng that","icon":"🎯","children":[{"label":"Người + vật: farmers and cattle"},{"label":"So sánh nhất: the best"}]},{"label":"Thường dùng that","icon":"👍","children":[{"label":"something, everything, all…"},{"label":"the only, the first, the last"}]},{"label":"Lược bỏ","icon":"✂️","children":[{"label":"Đại từ tân ngữ: the film (that) we saw"}]},{"label":"Trạng từ quan hệ","icon":"📍","children":[{"label":"where = in/at which"},{"label":"when = on/at/in which"},{"label":"why = for which"}]}]}},"chunks":[{"title":"Khi nào dùng that","icon":"🎯","rule":"Phải dùng **that** (không dùng who/which) sau danh từ **vừa người vừa vật** và sau **so sánh nhất**; that cũng **thường** được dùng sau *something, everything, all, much, little, the only, the first, the last…*","explain":"**Tiền ngữ** (antecedent) là danh từ đứng trước mệnh đề quan hệ. *farmers and cattle* gồm cả người (farmers) lẫn vật (cattle): who chỉ hợp với người, which chỉ hợp với vật, nên chỉ **that** bao được cả hai. Sau **so sánh nhất** (the best, the kindest…) sách cũng chỉ cho dùng that.\nSau đại từ bất định *nothing, everything, something, anything*, sau các lượng từ *all, every, some, any, no, none, little, much, few* (+ danh từ) và sau *the only / the first / the second / the last*, người ta **thường** dùng that thay cho which. (which vẫn có thể làm chủ ngữ sau *something, anything*, nhưng ít gặp hơn.)\nĐừng dùng **what** ở những chỗ này: *all **that** I want*, *the only thing **that***, không phải *all what*, *the only thing what*.","formula":"người + vật → that\nso sánh nhất + that\nall / everything / the only … + that","examples":[{"en":"We can see **farmers and cattle that** are going to the field.","vi":"Chúng ta có thể thấy nông dân và gia súc đang trên đường ra đồng."},{"en":"It's **the best film that** has ever been made about madness.","vi":"Đó là bộ phim hay nhất từng được làm về chứng mất trí."},{"en":"**The only** thing **that** keeps me awake is coffee.","vi":"Thứ duy nhất giúp tôi tỉnh táo là cà phê."},{"en":"These walls are **all that** remain of the city.","vi":"Các bức tường này là tất cả những gì còn sót lại của thành phố."},{"en":"She's one of the kindest people who I know.","ok":false,"note":"sau so sánh nhất: that (hoặc bỏ)"},{"en":"All what I want is your happiness.","ok":false,"note":"all + that, không dùng what"}],"mistake":{"wrong":"It's the best film which I've ever seen.","right":"It's the best film that I've ever seen.","why":"Sau so sánh nhất (the best), sách chỉ cho dùng **that** (hoặc bỏ hẳn, vì ở đây that là tân ngữ)."},"tip":"**Nhất**, **tất cả**, **duy nhất**, **người lẫn vật** → nghĩ ngay tới **that**.","src":"tr. 324–325","check":{"type":"fill","q":"I saw a man and his dog ___ were walking in the park.","answer":["that"],"explain":"*a man and his dog* gồm cả người lẫn con vật → chỉ **that** dùng được (who chỉ cho người, which chỉ cho vật).","src":"tự soạn"}},{"title":"Lược bỏ đại từ làm tân ngữ","icon":"✂️","rule":"Trong mệnh đề quan hệ **xác định**, đại từ làm **tân ngữ** (who, whom, which, that) **bỏ được**, nhất là trong lối văn thân mật.","explain":"Cách nhận ra đại từ là tân ngữ: ngay sau nó còn **một chủ ngữ khác** (I, you, we, the boy…) rồi mới tới động từ. *the film (that) **we saw*** → that là tân ngữ của saw → bỏ được. Còn *the man **who lives** here*: who đứng ngay trước động từ, nó là **chủ ngữ** → **không bỏ**.\nTiếng Việt cũng hay bỏ 'mà': 'bộ phim (mà) tụi mình xem tối qua'. Tiếng Anh giống vậy, nhưng chỉ bỏ được chữ 'mà' làm tân ngữ, và chỉ trong mệnh đề xác định (không có dấu phẩy).","diagram":{"type":"flow","title":"Bỏ được đại từ quan hệ không?","start":{"q":"Mệnh đề có dấu phẩy?","branches":[{"label":"Có","to":{"result":"Không bỏ (mệnh đề không xác định)","icon":"🚫"}},{"label":"Không","to":{"q":"Sau đại từ còn S + V?","branches":[{"label":"Có (đại từ là tân ngữ)","to":{"result":"Bỏ được: the film (that) we saw","icon":"✂️"}},{"label":"Không (đại từ là chủ ngữ)","to":{"result":"Giữ: the man who lives here","icon":"📌"}}]}}]}},"formula":"N + (who/whom/which/that) + S + V …","examples":[{"en":"Do you remember the people **we met** in Italy?","vi":"Anh có nhớ những người chúng ta đã gặp ở Ý không?"},{"en":"The American girl **we met last year** is staying with us.","vi":"Cô gái Mỹ chúng tôi quen năm ngoái đang ở chơi với chúng tôi."},{"en":"All **I want** is your happiness.","vi":"Tất cả những gì mẹ muốn là con được hạnh phúc."},{"en":"The man lives next door is a doctor.","ok":false,"note":"who là chủ ngữ → không bỏ được"}],"mistake":{"wrong":"The girl sits next to me is my sister.","right":"The girl who sits next to me is my sister.","why":"Đại từ làm **chủ ngữ** (đứng ngay trước động từ sits) không bỏ được."},"tip":"Đại từ kẹp giữa **danh từ** và **chủ ngữ mới** (the film _ we saw) → bỏ được. Đại từ đứng sát **động từ** → giữ.","src":"tr. 325","check":{"type":"mcq","q":"Câu nào bỏ được đại từ quan hệ?","options":["The cake that you made was delicious.","The bus that goes to the airport is late."],"answer":0,"explain":"Trong câu 1, **that** là tân ngữ của made (you là chủ ngữ) → bỏ được. Trong câu 2, that là chủ ngữ của goes → phải giữ.","src":"tự soạn"}},{"title":"where, when, why","icon":"📍","rule":"**where** (= in/at which) thay cho **nơi chốn**, **when** (= on/at/in which) thay cho **thời gian**, **why** (= for which) chỉ **lý do**, đi sau *the reason*.","explain":"Ba từ này là **trạng từ quan hệ** (relative adverbs). Mỗi từ đã 'gói sẵn' một giới từ bên trong: where = in/at which, when = on/at/in which, why = for which. Vì vậy:\n• **Không thêm giới từ** vào mệnh đề bắt đầu bằng where, when, why: *the building **where he lives***, không phải *in where he lives* hay *where he lives in*; *the day **when I met you***, không phải *the day when I met you on*.\n• Khi nói về nơi chốn, đừng nhầm **where** với **which** (sách nhắc ở tr. 332): sau **where**, mệnh đề đã **đủ** chủ ngữ và tân ngữ (*London, where **I was born**, …*); còn **which** phải tự làm chủ ngữ hoặc tân ngữ (*London, which **is** the capital of England, …*).","diagram":{"type":"table","title":"Trạng từ quan hệ","head":["Từ","Bằng","Dùng sau"],"rows":[["where","in / at which","nơi chốn: house, city"],["when","on / at / in which","thời gian: day, year"],["why","for which","lý do: the reason"]]},"formula":"nơi chốn + where + S + V\nthời gian + when + S + V\nthe reason + why + S + V","examples":[{"en":"The house **where** Mozart was born is now a museum.","vi":"Ngôi nhà nơi Mozart chào đời hiện là viện bảo tàng."},{"en":"I'll never forget the day **when** I met her.","vi":"Tôi sẽ không bao giờ quên cái ngày tôi gặp cô ấy."},{"en":"The reason **why** I didn't call you is that I've lost your phone number.","vi":"Lý do tôi không gọi điện cho anh là vì tôi đánh mất số điện thoại của anh."},{"en":"The building where he lives in is very old.","ok":false,"note":"where đã chứa in → bỏ in"}],"mistake":{"wrong":"This is the city which I was born.","right":"This is the city where I was born.","why":"*I was born* đã đủ, chỉ thiếu 'ở đâu' → **where** (= in which). which phải làm chủ ngữ hoặc tân ngữ, mà ở đây không thiếu chỗ nào như vậy."},"tip":"**Where**: ở đâu. **When**: khi nào. **Why**: tại sao. Giới từ đã nằm sẵn bên trong, đừng thêm nữa.","src":"tr. 326–327, 332","check":{"type":"fill","q":"Spring is the season ___ flowers of all kinds are in full bloom.","answer":["when","in which","that"],"explain":"season là **thời gian** → **when** (= in which). Trong mệnh đề xác định, when cũng thay được bằng that.","src":"tr. 326"}},{"title":"Lưu ý: thay hoặc bỏ where, when, why","icon":"💡","rule":"Trong mệnh đề xác định, **when** và **why** thay được bằng **that** hoặc bỏ hẳn; **where** chỉ làm vậy được sau **somewhere, anywhere, everywhere, nowhere** và **place**.","explain":"*the day **when** I met her* = *the day **on which** I met her* = *the day **that** I met her* = *the day I met her*. Với why cũng vậy: *the reason (why/that) she didn't accept the job*.\n**where** khó tính hơn: sau *somewhere* hay *place* thì được (*We need a place (that) we can stay for a few days*). Còn sau danh từ khác như *house, city*, nếu bỏ where (hoặc đổi sang that) thì phải **trả giới từ về cuối**: *This is the house (that) I used to live **in***. Không được viết *This is the house I used to live.*\nNgoài ra, **where** và **when** có thể đứng **không cần danh từ phía trước**: *Put it **where** we can all see it* (= the place where); *Remember **when** we went camping?* (= the time when).","formula":"the day (when/that) S + V\nthe reason (why/that) S + V\nsomewhere / a place (where/that) S + V\nthe house (that) S + V + in","examples":[{"en":"I'll never forget the day I met her.","vi":"Tôi sẽ không bao giờ quên ngày tôi gặp cô ấy."},{"en":"Is there somewhere I can lie down for an hour?","vi":"Có chỗ nào cho tôi ngả lưng một tiếng đồng hồ không?"},{"en":"This is the house I used to live **in**.","vi":"Đây là ngôi nhà mà tôi sống trước đây."},{"en":"Put it **where** we can all see it.","vi":"Hãy đặt nó ở nơi mà tất cả chúng ta đều nhìn thấy."},{"en":"This is the house I used to live.","ok":false,"note":"bỏ where sau house → phải thêm in"}],"mistake":{"wrong":"This is the house I used to live.","right":"This is the house I used to live in.","why":"Sau *house*, bỏ where thì giới từ **in** phải quay về cuối mệnh đề."},"tip":"Bỏ **where** sau danh từ thường → nhớ **trả giới từ về cuối** (live in, work at).","src":"tr. 327","check":{"type":"mcq","q":"Câu nào đúng?","options":["This is the village I grew up.","This is the village I grew up in."],"answer":1,"explain":"Sau *village* (không phải place/somewhere), bỏ where thì phải giữ giới từ **in** ở cuối.","src":"tự soạn"}}],"practice":[{"type":"mcq","q":"This is the most beautiful beach ___ I've ever visited.","options":["that","which","where"],"answer":0,"explain":"Sau **so sánh nhất** (the most beautiful) → **that**. where sai vì *visited* cần tân ngữ (visit a beach, không cần giới từ).","src":"tự soạn"},{"type":"mcq","q":"Do you know the reason ___ she left early?","options":["why","which","where"],"answer":0,"explain":"Sau **the reason** → **why** (= for which).","src":"tr. 326"},{"type":"mcq","q":"I remember the year ___ we moved to Saigon.","options":["when","where","which"],"answer":0,"explain":"year là **thời gian**, *we moved to Saigon* đã đủ → **when** (= in which).","src":"tự soạn"},{"type":"classify","q":"Đại từ quan hệ trong câu nào bỏ được?","buckets":["Bỏ được","Không bỏ được"],"items":[{"text":"The shirt that I bought is too small.","bucket":0},{"text":"The boy who broke the window ran away.","bucket":1},{"text":"The people whom we invited didn't come.","bucket":0},{"text":"The road which leads to the beach is closed.","bucket":1},{"text":"Mai, who I met yesterday, is a nurse.","bucket":1},{"text":"The song that you are singing is lovely.","bucket":0}],"explain":"Bỏ được khi đại từ là **tân ngữ** trong mệnh đề **xác định** (sau nó còn I, we, you…). *who broke*, *which leads* là chủ ngữ → giữ. *Mai, who…* có dấu phẩy → không bỏ.","src":"tr. 325"},{"type":"fill","q":"Is there anything ___ I can do for you?","answer":["that"],"hint":"đại từ bất định","explain":"Sau **anything** (đại từ bất định), thường dùng **that**.","src":"tr. 325"},{"type":"fill","q":"Ho Chi Minh City is the place ___ I work.","answer":["where","in which","at which","that"],"explain":"Nơi chốn → **where** (= in/at which). Riêng sau **place**, where còn thay được bằng that hoặc bỏ hẳn.","src":"tr. 326–327"},{"type":"fill","q":"Everything ___ he said was true.","answer":["that"],"explain":"Sau **everything**, dùng **that** (không dùng what).","src":"tr. 325"},{"type":"fix","wrong":"All what I need is a good sleep.","answer":["All that I need is a good sleep.","All I need is a good sleep."],"explain":"Sau **all** dùng **that** (hoặc bỏ, vì nó là tân ngữ của need), không dùng what.","src":"tr. 325"},{"type":"fix","wrong":"The hotel where we stayed at was very clean.","answer":["The hotel where we stayed was very clean.","The hotel which we stayed at was very clean.","The hotel that we stayed at was very clean.","The hotel we stayed at was very clean.","The hotel at which we stayed was very clean.","The hotel in which we stayed was very clean."],"explain":"**where** đã mang nghĩa 'at which', nên không thêm **at** nữa.","src":"tr. 327"},{"type":"fix","wrong":"This is the restaurant I had dinner.","answer":["This is the restaurant where I had dinner.","This is the restaurant I had dinner at.","This is the restaurant that I had dinner at.","This is the restaurant which I had dinner at.","This is the restaurant at which I had dinner.","This is the restaurant in which I had dinner."],"explain":"Sau *restaurant* không bỏ where được. Hoặc dùng **where**, hoặc bỏ where nhưng giữ giới từ **at** ở cuối.","src":"tr. 327"},{"type":"mcq","q":"We talked about the people and the places ___ we had visited.","options":["that","who","which"],"answer":0,"explain":"*the people and the places* gồm cả người lẫn nơi chốn → chỉ **that** bao được cả hai.","src":"tr. 324–325"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I'll","never","forget","the","day","when","I","met","you."],"explain":"*when I met you* đứng ngay sau *the day*. Nghĩa: Tôi sẽ không bao giờ quên ngày tôi gặp bạn.","src":"tự soạn"}],"flashcards":[{"front":"Danh từ vừa người vừa vật → đại từ quan hệ nào?","back":"**that**: farmers and cattle **that** are going to the field"},{"front":"Sau so sánh nhất dùng gì?","back":"**that** (hoặc bỏ nếu là tân ngữ): the best film **that** I've seen"},{"front":"all what I want đúng không?","back":"Sai. **All (that) I want** …"},{"front":"Khi nào bỏ được đại từ quan hệ?","back":"Khi nó là **tân ngữ** trong mệnh đề xác định: the film (that) we saw"},{"front":"where / when / why bằng gì?","back":"where = in/at which · when = on/at/in which · why = for which"},{"front":"the house I used to live … ?","back":"Bỏ where thì thêm giới từ: the house I used to live **in**"}]},{"id":"02c","title":"Giới từ trong mệnh đề quan hệ","minutes":25,"goal":"Đặt giới từ đúng chỗ (trước whom/which hay sau động từ), tránh lỗi 'about who', 'for that', không tách cụm động từ, và dùng many of whom, none of which…","pretest":[{"type":"mcq","q":"This is the house about ___ I told you.","options":["which","that","where"],"answer":0,"explain":"Giới từ đứng trước đại từ quan hệ thì chỉ dùng **which** (vật) hoặc **whom** (người). Không đặt giới từ trước that.","src":"tr. 328"},{"type":"mcq","q":"Chọn câu đúng:","options":["She's the woman about who I told you.","She's the woman who I told you about."],"answer":1,"explain":"Không đặt giới từ trước **who**. Hoặc để giới từ ở cuối (*who I told you about*), hoặc dùng *about whom*.","src":"tr. 329"},{"type":"mcq","q":"There are 30 students, many of ___ are from Hanoi.","options":["whom","who","them"],"answer":0,"explain":"Sau **many of**, người → **whom**. *many of them* thì phải tách thành câu khác; *of who* là sai.","src":"tr. 329"}],"hook":{"icon":"🧲","text":"Tiếng Việt nói 'người mà tôi làm việc **cùng**', 'ngôi nhà mà tôi đã kể **về**': giới từ có thể nằm cuối. Tiếng Anh có **hai chỗ** cho giới từ: **đứng đầu**, ngay trước whom/which (trang trọng), hoặc **đứng cuối**, sau động từ (thân mật). Bài này dạy bạn chọn chỗ, cùng vài điều cấm kỵ."},"diagram":{"type":"flow","title":"Đặt giới từ ở đâu?","start":{"q":"Là cụm động từ (look after, listen to)?","branches":[{"label":"Có","to":{"result":"Giữ sau động từ: the child I look after","icon":"🧩"}},{"label":"Không","to":{"q":"Văn trang trọng?","branches":[{"label":"Có","to":{"result":"Giới từ + whom/which: with whom","icon":"🎩"}},{"label":"Không","to":{"result":"Cuối câu: who/that … with","icon":"💬"}}]}}]}},"chunks":[{"title":"Hai vị trí của giới từ","icon":"↔️","rule":"Khi đại từ quan hệ là **tân ngữ của giới từ**, giới từ đứng **trước whom/which** (trang trọng) hoặc **sau động từ** (thân mật).","explain":"*He worked **with** the people.* → mệnh đề quan hệ có hai cách viết:\n• Trang trọng: *the people **with whom** he worked*.\n• Thân mật: *the people **who/that** he worked **with***.\nTrong mệnh đề **xác định**, cách thân mật còn gọn hơn: bỏ luôn đại từ, giới từ ở cuối: *the people he worked **with***. Mệnh đề có dấu phẩy (không xác định) thì giữ đại từ: *Sandra, **who** we had been waiting **for**, finally arrived.*","formula":"Trang trọng: N + giới từ + whom/which + S + V\nThân mật: N + (who/that/which) + S + V + giới từ","examples":[{"en":"He was respected by the people **with whom** he worked.","vi":"Ông ấy được những người làm việc chung tôn trọng."},{"en":"That's the man **who** I was talking **about**.","vi":"Đó là người mà tôi đã nói đến."},{"en":"The picture she was looking **at** was famous.","vi":"Bức tranh mà cô ấy đang xem rất nổi tiếng."},{"en":"The actress thanked her parents, **to whom** she owed her success.","vi":"Nữ diễn viên cảm ơn cha mẹ mình, nhờ có họ cô ấy mới có được thành công."},{"en":"This is the chair which I was sitting.","ok":false,"note":"mất giới từ on"}],"mistake":{"wrong":"This is the chair which I was sitting.","right":"This is the chair which I was sitting on.","why":"sit **on** a chair: giới từ không được rơi mất. Hoặc đưa lên trước (*on which I was sitting*), hoặc giữ ở cuối."},"tip":"Giới từ **không biến mất**: nó chỉ **chạy lên đầu** (with whom) hoặc **ở lại cuối** (who … with).","src":"tr. 328","check":{"type":"fill","q":"The friend ___ whom I share a flat is a cook.","answer":["with"],"explain":"share a flat **with** someone → giới từ **with** đứng trước whom (lối trang trọng).","src":"tự soạn"}},{"title":"Không đặt giới từ trước that và who","icon":"⛔","rule":"Giới từ **không** được đứng trước **that** và **who**; muốn đưa giới từ lên đầu thì phải đổi sang **whom** (người) hoặc **which** (vật).","explain":"Lỗi *the bus **for that** I'm waiting*, *the woman **about who** I told you* rất hay gặp. Cách sửa: hoặc đẩy giới từ về cuối (*the bus **that** I'm waiting **for***), hoặc đổi đại từ (*the bus **for which** I'm waiting*, *the woman **about whom** I told you*).\nRiêng **without** thì ngược lại: nó **không** được đứng cuối sau động từ, phải đứng trước whom/which: *The woman **without whom** I can't live is Jane.*","diagram":{"type":"table","title":"Giới từ + đại từ quan hệ","head":["","Đúng","Sai"],"rows":[["Người","about whom / who … about","about who"],["Vật","for which / that … for","for that"],["without","without whom / without which","who … without"]]},"examples":[{"en":"She's the woman **who** I told you **about**.","vi":"Bà ấy là người mà tôi đã kể với bạn."},{"en":"The bus **that** I'm waiting **for** is late.","vi":"Chuyến xe buýt mà tôi đang đợi đến trễ."},{"en":"The woman **without whom** I can't live is Jane.","vi":"Người phụ nữ mà tôi không thể sống thiếu cô ấy chính là Jane."},{"en":"The bus for that I'm waiting is late.","ok":false,"note":"không đặt giới từ trước that"},{"en":"The woman who I can't live without is Jane.","ok":false,"note":"without không đứng cuối"}],"mistake":{"wrong":"Mr. Jones, for who I am working, is very generous.","right":"Mr. Jones, for whom I am working, is very generous.","why":"Giới từ đứng trước thì phải là **whom**. Cũng có thể viết *who I am working for*."},"tip":"Chỉ hai chữ **whom** và **which** nhận giới từ đứng trước. **who, that**: không.","src":"tr. 329","check":{"type":"mcq","q":"Chọn câu đúng:","options":["The man to that I spoke was rude.","The man to whom I spoke was rude."],"answer":1,"explain":"Giới từ **to** đứng trước thì chỉ dùng **whom** (người). *to that* là sai.","src":"tự soạn"}},{"title":"Cụm động từ: giới từ không tách rời","icon":"🧩","rule":"Với **cụm động từ** (phrasal verbs) như *look after, look up, listen to, make up*, giới từ **ở lại sau động từ**, không đưa lên trước whom/which.","explain":"Cụm động từ là động từ + giới từ/trạng từ tạo thành **một nghĩa mới**: *look after* = chăm sóc, *look up* = tra (từ điển), *make up* = bịa ra. Tách giới từ khỏi động từ thì cụm mất nghĩa, nên không viết *the child **after whom** I have looked*. Sách xếp cả *listen to* vào nhóm này: *the music (which/that) Julie **listens to***, không phải *the music to which Julie listens*.\nĐiều này đúng cả trong mệnh đề có dấu phẩy: *The story, which she had **made up**, was accepted as the truth.*","examples":[{"en":"The child (who/that) I have **looked after** for a year is very naughty.","vi":"Đứa bé mà tôi chăm sóc cả năm nay rất nghịch."},{"en":"Did you find the word (which/that) you were **looking up**?","vi":"Anh đã tìm ra từ mà anh muốn tra chưa?"},{"en":"The story, which she had **made up**, was accepted as the truth.","vi":"Câu chuyện mà bà ấy bịa ra đã được cho là thật."},{"en":"The child after whom I have looked for a year is very naughty.","ok":false,"note":"không tách look after"}],"mistake":{"wrong":"The music to which Julie listens is good.","right":"The music which Julie listens to is good.","why":"Sách coi **listen to** là cụm động từ: giữ *to* sau listens."},"tip":"Cụm động từ là **một khối**: look after, look up, listen to, make up đi đâu cũng đi cùng nhau.","src":"tr. 329, 332","check":{"type":"fix","wrong":"Did you find the word up which you were looking?","answer":["Did you find the word which you were looking up?","Did you find the word that you were looking up?","Did you find the word you were looking up?"],"explain":"**look up** (tra từ) là cụm động từ → *up* phải ở lại sau *looking*.","src":"tr. 329"}},{"title":"many of whom, none of which","icon":"🔢","rule":"Trong mệnh đề **không xác định**, các cụm số lượng **all of, most of, many of, none of, neither of, both of…** đi với **whom** (người), **which** (vật) và **whose**.","explain":"*There are over 6,000 students. Many **of them** come from overseas.* → *of them* đổi thành **of whom**: *…students, many **of whom** come from overseas.* Với vật, *of them / of it* đổi thành **of which**: *three jackets, none **of which** fitted him*.\nSau *of* không dùng **who** hay **that**: *many of who*, *none of that* đều sai. Người Việt hay viết *…two brothers, both of them are doctors* (nối hai câu chỉ bằng dấu phẩy): phải đổi *them* thành **whom**.\nMệnh đề này luôn có **dấu phẩy** phía trước, vì nó chỉ thêm thông tin.","formula":"…, all of / most of / many of / none of / neither of / both of + whom / which / whose N + V …","examples":[{"en":"There are over 6,000 students, **many of whom** come from overseas.","vi":"Có hơn 6.000 sinh viên, trong số đó có nhiều sinh viên nước ngoài."},{"en":"Tom tried on three jackets, **none of which** fitted him.","vi":"Tom thử 3 chiếc áo vét, không chiếc nào vừa với anh ấy."},{"en":"He had thousands of books, **most of which** he had read.","vi":"Ông ấy có hàng ngàn cuốn sách, ông ấy đã đọc hầu hết số sách đó."},{"en":"She had a teddy-bear, **both of whose** eyes were missing.","vi":"Cô ấy có một con gấu bông bị mất cả hai con mắt."},{"en":"There are over 6,000 students, many of who come from overseas.","ok":false,"note":"sau of: whom"}],"mistake":{"wrong":"I have two brothers, both of them are doctors.","right":"I have two brothers, both of whom are doctors.","why":"Hai mệnh đề nối bằng dấu phẩy thì cần đại từ quan hệ: *of them* → **of whom**."},"tip":"**of** + người → **of whom**; **of** + vật → **of which**. Không bao giờ *of who*, *of that*.","src":"tr. 329","check":{"type":"fill","q":"He has three cars, two of ___ are red.","answer":["which"],"explain":"cars là vật, đứng sau **of** → **which**.","src":"tự soạn"}}],"practice":[{"type":"mcq","q":"The man ___ I spoke was very kind.","options":["to whom","to who","to that"],"answer":0,"explain":"Giới từ đứng trước thì chỉ dùng **whom** (người) hoặc which (vật). *to who*, *to that* đều sai.","src":"tr. 329"},{"type":"mcq","q":"The keys ___ I was looking for are in my bag.","options":["that","for that","for which"],"answer":0,"explain":"Giới từ **for** đã nằm ở cuối, nên trước đó chỉ cần **that**. *for which … for* lặp giới từ hai lần; *for that* sai vì giới từ không đứng trước that.","src":"tr. 329"},{"type":"fill","q":"The pen with ___ she signed the letter was a gift.","answer":["which"],"explain":"pen là vật, đứng sau giới từ **with** → **which** (không dùng that sau giới từ).","src":"tự soạn"},{"type":"fill","q":"This is the girl ___ I told you about.","answer":["who","whom","that"],"explain":"Giới từ *about* ở cuối, nên trước đó dùng **who / whom / that** (người, làm tân ngữ). Trong câu này cũng bỏ được đại từ.","src":"tr. 328"},{"type":"fill","q":"I have many friends, most of ___ live in Hanoi.","answer":["whom"],"explain":"friends là người, đứng sau **most of** → **whom**.","src":"tr. 329"},{"type":"mcq","q":"Chọn câu đúng:","options":["The baby who she looks after is very cute.","The baby after whom she looks is very cute."],"answer":0,"explain":"**look after** là cụm động từ, không tách *after* ra khỏi *looks*.","src":"tr. 329"},{"type":"classify","q":"Cụm nào đúng, cụm nào sai?","buckets":["Đúng","Sai"],"items":[{"text":"the man with whom I work","bucket":0},{"text":"the man with who I work","bucket":1},{"text":"the house about which I told you","bucket":0},{"text":"the house about that I told you","bucket":1},{"text":"the friend I live with","bucket":0},{"text":"the friend who I can't live without","bucket":1}],"explain":"Giới từ chỉ đứng trước **whom/which**, không đứng trước who/that. *the friend I live with* đúng (bỏ đại từ, giới từ ở cuối). **without** không được đứng cuối: phải là *without whom I can't live*.","src":"tr. 328–329"},{"type":"fix","wrong":"The hotel for that we paid was very noisy.","answer":["The hotel for which we paid was very noisy.","The hotel that we paid for was very noisy.","The hotel which we paid for was very noisy.","The hotel we paid for was very noisy."],"explain":"Không đặt giới từ trước **that**: đổi thành *for which*, hoặc đẩy *for* về cuối.","src":"tr. 329"},{"type":"fix","wrong":"She has two sisters, both of who are teachers.","answer":["She has two sisters, both of whom are teachers."],"explain":"Sau **of**, người → **whom**, không dùng who.","src":"tr. 329"},{"type":"fix","wrong":"I bought five eggs, three of them were broken.","answer":["I bought five eggs, three of which were broken."],"explain":"Nối bằng dấu phẩy thì cần đại từ quan hệ: *of them* → **of which** (eggs là vật).","src":"tr. 329"},{"type":"mcq","q":"My best friend, ___ I can't live, is moving abroad.","options":["without whom","without who","without that"],"answer":0,"explain":"**without** phải đứng trước **whom** (người). Không dùng giới từ trước who/that.","src":"tr. 329"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["The","people","with","whom","I","work","are","very","friendly."],"explain":"Lối trang trọng: giới từ **with** đứng ngay trước **whom**. Nghĩa: Những người làm việc cùng tôi rất thân thiện.","src":"tự soạn"}],"flashcards":[{"front":"Hai chỗ đặt giới từ trong mệnh đề quan hệ?","back":"Trước **whom/which** (trang trọng): with whom he worked · Sau động từ (thân mật): who he worked **with**"},{"front":"about who / for that được không?","back":"Không. Giới từ chỉ đứng trước **whom** và **which**."},{"front":"without đặt ở đâu?","back":"Trước whom/which: the woman **without whom** I can't live. Không để cuối."},{"front":"look after, listen to trong mệnh đề quan hệ?","back":"Không tách: the child (who) I **look after**"},{"front":"many of + ? (người) · none of + ? (vật)","back":"many **of whom** · none **of which** (có dấu phẩy phía trước)"}]},{"id":"02d","title":"Mệnh đề xác định và không xác định","minutes":25,"goal":"Phân biệt mệnh đề quan hệ xác định và không xác định, đặt dấu phẩy đúng, nhớ hai điều cấm của mệnh đề có dấu phẩy (không that, không bỏ đại từ) và dùng which để nói về cả câu.","pretest":[{"type":"mcq","q":"My mother, ___ is 60, still works every day.","options":["who","that","which"],"answer":0,"explain":"Mẹ là người, mệnh đề nằm giữa hai dấu phẩy → **who**. Có dấu phẩy thì không dùng that.","src":"tự soạn"},{"type":"mcq","q":"Câu nào cần thêm dấu phẩy?","options":["Hanoi which is the capital of Vietnam is very old.","The man who called you is my boss."],"answer":0,"explain":"Hanoi là tên riêng, ai cũng biết là đâu; mệnh đề chỉ thêm thông tin → cần dấu phẩy: *Hanoi, which is the capital of Vietnam, is very old.* Câu 2 cần mệnh đề để biết người nào → không phẩy.","src":"tự soạn"},{"type":"mcq","q":"It rained all night, ___ was good for the garden.","options":["which","that","what"],"answer":0,"explain":"**, which** nói về **cả việc** mưa suốt đêm (= điều đó).","src":"tr. 332"}],"hook":{"icon":"🏷️","text":"Lớp bạn có ba bạn tên Lan. Nói 'Lan **ngồi bàn đầu** đang cười': phần 'ngồi bàn đầu' là **bắt buộc**, thiếu nó không biết Lan nào. Đó là mệnh đề **xác định**. Còn 'Mẹ tôi, **năm nay 60 tuổi**, vẫn đi làm': ai cũng biết mẹ tôi là ai, phần giữa chỉ là **thông tin thêm**, kẹp giữa hai dấu phẩy. Đó là mệnh đề **không xác định**."},"diagram":{"type":"table","title":"Hai loại mệnh đề quan hệ","head":["","Xác định","Không xác định"],"rows":[["Vai trò","Cho biết người/vật nào","Thêm thông tin"],["Bỏ đi được?","Không (câu mất nghĩa)","Được (câu vẫn đủ nghĩa)"],["Dấu phẩy","Không","Có (hoặc gạch ngang)"],["Dùng that?","Được","Không"],["Bỏ đại từ tân ngữ?","Được","Không"],["Ví dụ","the man who called you","My mother, who is 60, …"]]},"chunks":[{"title":"Mệnh đề xác định","icon":"🎯","rule":"Mệnh đề quan hệ **xác định** (defining) cho biết **người/vật nào**; nó **cần thiết** cho nghĩa câu và **không có dấu phẩy**.","explain":"*I'm looking for a secretary **who can use a computer well**.* Bỏ phần in đậm thì câu chỉ còn 'Tôi đang tìm một thư ký': mất ý chính. Đó là dấu hiệu của mệnh đề xác định.\nTrong mệnh đề xác định bạn được dùng **that**, và được **bỏ** đại từ làm tân ngữ (who, whom, which, that) cùng **when, why**: *The woman (who) you met yesterday works in advertising*; *Do you remember the day (when) we met each other?*","examples":[{"en":"I'm looking for a secretary **who/that can use a computer well**.","vi":"Tôi đang tìm một thư ký giỏi vi tính."},{"en":"Do you see the cat **which/that is lying on the roof**?","vi":"Anh có thấy con mèo đang nằm trên mái nhà không?"},{"en":"The book **you lent me** was very interesting.","vi":"Cuốn sách mà anh cho tôi mượn rất hay."},{"en":"Do you know a shop **where I can find sandals**?","vi":"Anh có biết cửa hiệu nào bán xăng-đan không?"},{"en":"The man, who called you, is my boss.","ok":false,"note":"cần biết người nào → không phẩy"}],"mistake":{"wrong":"The man, who called you, is my boss.","right":"The man who called you is my boss.","why":"Câu đang nói **người nào** gọi bạn → mệnh đề xác định, không có dấu phẩy."},"tip":"Che mệnh đề đi: câu còn **rõ là ai, cái nào** không? Không rõ → xác định → **không phẩy**.","src":"tr. 330","check":{"type":"mcq","q":"Trong câu 'The book you lent me was very interesting.', mệnh đề quan hệ thuộc loại nào?","options":["Xác định","Không xác định"],"answer":0,"explain":"*you lent me* cho biết **cuốn sách nào**, không có dấu phẩy, và đại từ đã được bỏ → mệnh đề **xác định**.","src":"tr. 330","shuffle":false}},{"title":"Mệnh đề không xác định","icon":"➕","rule":"Mệnh đề quan hệ **không xác định** (non-defining) chỉ **thêm thông tin** về người/vật **đã rõ là ai, cái gì**; nó được ngăn với mệnh đề chính bằng **dấu phẩy** (hoặc gạch ngang).","explain":"Danh từ đứng trước thường đã rõ sẵn: **tên riêng** (*Madrid, Sarah*), có **my/her/this** (*my secretary, her car*), hoặc là thứ duy nhất (*the sun*). Mệnh đề lúc đó chỉ là 'à, nói thêm…'; bỏ đi câu vẫn đủ nghĩa.\nMệnh đề có thể chen **giữa câu** (hai dấu phẩy) hoặc ở **cuối câu** (một dấu phẩy phía trước). Trong mệnh đề này vẫn dùng được who, whom, which, whose, where, when.","formula":"N (đã rõ), who/which/whose/where/when …, V …\n… N (đã rõ), who/which …","examples":[{"en":"Madrid, **which is the capital of Spain**, lies on the river Manzanares.","vi":"Madrid, thủ đô của Tây Ban Nha, nằm bên sông Manzanares."},{"en":"Her car, **which was very old**, broke down after just five miles.","vi":"Xe của cô ấy, rất cũ kỹ, mới chạy 5 dặm đã bị chết máy."},{"en":"This is George, **whose sister is my best friend**.","vi":"Đây là George, chị của cậu ấy là bạn thân của tôi."},{"en":"We then moved to Paris, **where we lived for six years**.","vi":"Sau đó chúng tôi chuyển đến Paris, chúng tôi sống ở đó 6 năm."}],"mistake":{"wrong":"My father who is 60 still plays football.","right":"My father, who is 60, still plays football.","why":"Bạn chỉ có một người cha; mệnh đề chỉ thêm thông tin → phải có **hai dấu phẩy**."},"tip":"**Tên riêng / my / this + N** đứng trước → thường là **không xác định** → **có phẩy**.","src":"tr. 330–331","check":{"type":"classify","q":"Xếp mỗi câu vào đúng loại mệnh đề quan hệ:","buckets":["Xác định","Không xác định"],"items":[{"text":"The girl who sits by the door is new.","bucket":0},{"text":"Hanoi, which is my hometown, is very busy.","bucket":1},{"text":"The phone I bought is broken.","bucket":0},{"text":"My brother, who lives in Hue, is a teacher.","bucket":1}],"explain":"Mệnh đề cho biết **người/vật nào** (the girl…, the phone…) → xác định, không phẩy. Danh từ đã rõ (Hanoi, my brother) + dấu phẩy → không xác định.","src":"tr. 330"}},{"title":"Có dấu phẩy: không that, không bỏ","icon":"🚫","rule":"Trong mệnh đề **không xác định**: **không dùng that**, và **không bỏ** đại từ làm tân ngữ (who, whom, which) hay where, when.","explain":"Dấu phẩy là 'đèn đỏ' cho that: *Julie, **who** lives in New York*, không phải *Julie, that lives…*; *Monday, **when** people go back to work*, không phải *Monday, that people go back…*.\nCũng vì có dấu phẩy, đại từ phải được **giữ** dù nó là tân ngữ: *My sister, **who/whom** I live with, …*, không viết *My sister, I live with, …*.\nGiới từ vẫn có hai chỗ như bài 02c: *The hotel room, **for which** we had already paid, …* = *The hotel room, **which** we had already paid **for**, …*","examples":[{"en":"Yesterday I called our friend Julie, **who** lives in New York.","vi":"Hôm qua tôi đã gọi điện cho Julie, bạn của chúng ta, người đang sống ở New York."},{"en":"I really love the new restaurant, **which** we went to last night.","vi":"Tôi rất thích cái nhà hàng mới mà tối qua chúng ta đi ăn."},{"en":"We were led to the dining room, **where** lunch was being served.","vi":"Chúng tôi được dẫn đến phòng ăn, nơi bữa trưa đang được dọn."},{"en":"The film, that stars Tom Carter, is released on Friday.","ok":false,"note":"có dấu phẩy → which, không that"},{"en":"My sister, I live with, knows a lot about cars.","ok":false,"note":"không bỏ who/whom"}],"mistake":{"wrong":"Hoa, that works with me, is very friendly.","right":"Hoa, who works with me, is very friendly.","why":"Có dấu phẩy → không dùng **that**; Hoa là người → **who**."},"tip":"**Có phẩy** thì **không that, không bỏ**.","src":"tr. 331–332","check":{"type":"fix","wrong":"Lan, that teaches us English, is from Da Nang.","answer":["Lan, who teaches us English, is from Da Nang."],"explain":"Mệnh đề có dấu phẩy → không dùng **that**; Lan là người → **who**.","src":"tr. 331"}},{"title":"which nói về cả câu","icon":"🌧️","rule":"Trong mệnh đề không xác định, **which** có thể nói về **cả mệnh đề đứng trước**, nghĩa là 'điều đó' (the fact that…).","explain":"*It rained all night, **which** was good for the garden.* Cái gì tốt cho khu vườn? Không phải 'đêm', mà là **việc trời mưa suốt đêm**. which ở đây trỏ cả câu trước; tiếng Việt dịch là 'điều đó, việc đó'.\nKiểu này luôn có **dấu phẩy** trước which, nên cũng không dùng that.","formula":"Mệnh đề 1, which + V …   (which = điều đó)","examples":[{"en":"It rained all night, **which** was good for the garden.","vi":"Mưa suốt đêm, điều đó tốt cho khu vườn."},{"en":"Max isn't home yet, **which** worries me.","vi":"Max chưa về nhà, điều này khiến tôi lo lắng."},{"en":"He drank too much, **which** is why he was sick.","vi":"Ông ta uống rượu quá nhiều, đó là lý do tại sao ông ta bị bệnh."},{"en":"Max isn't home yet, that worries me.","ok":false,"note":"trỏ cả câu: , which"}],"mistake":{"wrong":"He failed the exam, that surprised everyone.","right":"He failed the exam, which surprised everyone.","why":"Điều làm mọi người ngạc nhiên là **việc** anh ấy thi trượt → **, which**."},"tip":"Dịch được thành '**điều đó**' → **, which**.","src":"tr. 332","check":{"type":"mcq","q":"Chris did really well in his exams, ___ is quite a surprise.","options":["which","that","who"],"answer":0,"explain":"Điều đáng ngạc nhiên là **việc** Chris thi rất tốt → **, which** (trỏ cả câu). Có dấu phẩy nên không dùng that.","src":"tr. 332"}}],"practice":[{"type":"classify","q":"Mệnh đề quan hệ trong mỗi câu thuộc loại nào?","buckets":["Xác định","Không xác định"],"items":[{"text":"The man who repaired my bike is very kind.","bucket":0},{"text":"Da Lat, which is in the mountains, is cool all year.","bucket":1},{"text":"I need a phone that has a good camera.","bucket":0},{"text":"My mother, who is a nurse, works at night.","bucket":1},{"text":"The students whose names are called must stand up.","bucket":0},{"text":"Mr Long, whose son is my friend, is a doctor.","bucket":1}],"explain":"Xác định: cho biết người/vật **nào**, không phẩy. Không xác định: danh từ đã rõ (tên riêng, my mother) + dấu phẩy.","src":"tr. 330"},{"type":"mcq","q":"Ha Long Bay, ___ is in Quang Ninh, is very famous.","options":["which","that","where"],"answer":0,"explain":"Có dấu phẩy → không dùng that. Chỗ trống là **chủ ngữ** của *is* → **which**; where không làm chủ ngữ.","src":"tr. 331"},{"type":"mcq","q":"My brother, ___ you met at the party, is a pilot.","options":["who","that","(bỏ trống)"],"answer":0,"explain":"Có dấu phẩy → không dùng that và **không bỏ** đại từ dù nó là tân ngữ → **who** (hoặc whom).","src":"tr. 331"},{"type":"fill","q":"I spent a week in Da Nang, ___ my aunt lives.","answer":["where","in which"],"explain":"Da Nang là nơi chốn, *my aunt lives* đã đủ → **where** (= in which).","src":"tự soạn"},{"type":"fill","q":"She passed all her exams, ___ made her parents very happy.","answer":["which"],"explain":"Điều làm bố mẹ vui là **việc** cô ấy đỗ hết → **, which** trỏ cả câu.","src":"tr. 332"},{"type":"fill","q":"This is Mr Tuan, ___ daughter is in my class.","answer":["whose"],"explain":"Con gái **của** ông Tuấn → **whose** daughter.","src":"tự soạn"},{"type":"mcq","q":"Câu nào có nghĩa 'Tôi chỉ có một chị gái, và chị ấy sống ở Úc'?","options":["My sister, who lives in Australia, is a doctor.","My sister who lives in Australia is a doctor."],"answer":0,"explain":"Có dấu phẩy → mệnh đề chỉ **thêm thông tin**, nên chỉ có một chị. Không phẩy → mệnh đề xác định: ngầm hiểu có nhiều chị, đây là chị sống ở Úc.","src":"tr. 330"},{"type":"fix","wrong":"Our hotel, that was near the beach, was very cheap.","answer":["Our hotel, which was near the beach, was very cheap."],"explain":"Có dấu phẩy → không dùng **that**; hotel là vật → **which**.","src":"tr. 331"},{"type":"fix","wrong":"My grandmother, I visit every Sunday, is 85.","answer":["My grandmother, who I visit every Sunday, is 85.","My grandmother, whom I visit every Sunday, is 85."],"explain":"Mệnh đề không xác định → **không bỏ** đại từ tân ngữ: thêm **who/whom**.","src":"tr. 331"},{"type":"fix","wrong":"We visited Hue, which my father was born.","answer":["We visited Hue, where my father was born.","We visited Hue, in which my father was born."],"explain":"*my father was born* đã đủ, thiếu 'ở đâu' → **where** (= in which), không dùng which.","src":"tr. 332"},{"type":"mcq","q":"The last time I saw her was in 2020, ___ she was still a student.","options":["when","which","that"],"answer":0,"explain":"2020 là thời gian, *she was still a student* đã đủ → **when**. Có dấu phẩy nên không dùng that.","src":"tr. 331"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["He","lost","his","keys,","which","made","him","late."],"explain":"**, which** trỏ cả việc mất chìa khóa: Anh ấy làm mất chìa khóa, điều đó khiến anh ấy bị trễ.","src":"tự soạn"}],"flashcards":[{"front":"Mệnh đề xác định là gì?","back":"Cho biết người/vật **nào**, không có dấu phẩy: the man **who called you**"},{"front":"Mệnh đề không xác định là gì?","back":"Thêm thông tin về người/vật đã rõ, có dấu phẩy: Hanoi, **which is the capital**, …"},{"front":"Mệnh đề có dấu phẩy dùng that được không?","back":"**Không**: Julie, **who** lives in New York, …"},{"front":"Mệnh đề có dấu phẩy bỏ được đại từ tân ngữ không?","back":"**Không**: My sister, **who** I live with, …"},{"front":"', which' trỏ cả câu nghĩa là gì?","back":"'**điều đó**': It rained all night, **which** was good for the garden."},{"front":"London, ___ I was born: where hay which?","back":"**where** (= in which), vì *I was born* đã đủ chủ ngữ, động từ."}]},{"id":"02e","title":"Rút gọn mệnh đề quan hệ","minutes":25,"goal":"Rút gọn mệnh đề quan hệ thành cụm V-ing, V3, cụm danh từ, cụm giới từ và to-V, và biết khi nào không được rút gọn bằng V-ing.","pretest":[{"type":"mcq","q":"The man ___ at the door is my uncle.","options":["standing","stood","to stand"],"answer":0,"explain":"= *The man **who is standing** at the door*: đang diễn ra, chủ động → rút gọn thành **V-ing**.","src":"tự soạn"},{"type":"mcq","q":"The cars ___ in Japan are very reliable.","options":["made","making","to make"],"answer":0,"explain":"Xe **được** sản xuất → bị động (*which are made*) → rút gọn thành **V3**: made.","src":"tự soạn"},{"type":"mcq","q":"She was the first woman ___ the prize.","options":["to win","winning","won"],"answer":0,"explain":"Sau **the first** → **to-V**: the first woman **to win**.","src":"tr. 335"}],"hook":{"icon":"🎒","text":"Mệnh đề quan hệ giống chiếc vali đầy đồ: *the people **who are waiting** outside*. Khi cần gọn, bạn **bớt** who và động từ be, chỉ mang theo thứ cần thiết: *the people **waiting** outside*. Bài này dạy năm cách 'xếp vali gọn': **V-ing, V3, cụm danh từ, cụm giới từ** và **to-V**. Mỗi cách hợp với một loại câu."},"diagram":{"type":"table","title":"Rút gọn bằng gì?","head":["Mệnh đề quan hệ có gì?","Rút gọn bằng","Ví dụ"],"rows":[["Chủ động: đang / lâu dài / mong muốn","V-ing","the people waiting outside"],["Bị động (be + V3)","V3","the book published in 1970"],["be + danh từ, có phẩy","Cụm danh từ","Peter, our manager, …"],["be + giới từ chỉ vị trí","Cụm giới từ","the man in that car"],["Sau the first / only / so sánh nhất","to-V","the first man to go…"],["Mục đích, cho phép","to-V / for + O + to-V","a garden for children to play in"]]},"chunks":[{"title":"Rút gọn bằng V-ing","icon":"🏃","rule":"Dùng **V-ing** (hiện tại phân từ) khi mệnh đề quan hệ **chủ động** và nói về việc **đang diễn ra**, tình trạng **lâu dài, thường xuyên**, hoặc **ước muốn, hy vọng**: bỏ đại từ quan hệ (và be), động từ đổi thành V-ing.","explain":"Ba trường hợp sách nêu:\n• Thì **tiếp diễn**: *the people who are waiting* → *the people **waiting***.\n• Tình trạng **cố định, lâu dài**: *the bridge which connects…* → *the bridge **connecting**…*; *the woman who lives next door* → *the woman **living** next door*.\n• **Ước muốn, hy vọng, mong đợi**: *Fans who hope to buy tickets* → *Fans **hoping** to buy tickets*; *Anyone who wants a ticket* → *Anyone **wanting** a ticket*.\n**Lưu ý**: không dùng V-ing cho **một hành động đơn đã xong** trong quá khứ: *That was the customer **who phoned** yesterday*, không viết *the customer phoning yesterday*.","formula":"N + who/which/that + (be) + V … → N + V-ing …","examples":[{"en":"Tell the people **waiting** outside to come in.","vi":"Hãy bảo những người đang đợi bên ngoài vào trong."},{"en":"He ignored the phone **ringing** on his desk.","vi":"Anh ta phớt lờ cái điện thoại đang reo trên bàn làm việc."},{"en":"The woman **living** next door is a famous novelist.","vi":"Người phụ nữ sống kế bên nhà là một tiểu thuyết gia nổi tiếng."},{"en":"Fans **hoping** to buy tickets have been queuing all night.","vi":"Những người hâm mộ hy vọng mua được vé đã xếp hàng suốt đêm."},{"en":"That was the customer phoning yesterday.","ok":false,"note":"một lần, đã xong → who phoned"}],"mistake":{"wrong":"The man stands at the door is my uncle.","right":"The man standing at the door is my uncle.","why":"Đã bỏ who thì động từ phải thành **V-ing**; để *stands* thì câu có hai động từ chia mà không có từ nối."},"tip":"Chủ động → **-ing**. Nhưng 'đã gọi **hôm qua**, một lần' → giữ nguyên **who + V-ed**.","src":"tr. 333–334","check":{"type":"fill","q":"Rút gọn: Who is the girl ___ next to Lan? (sit)","answer":["sitting"],"explain":"= *the girl who is sitting*: đang diễn ra, chủ động → **sitting**.","src":"tự soạn"}},{"title":"Rút gọn bằng V3","icon":"📦","rule":"Dùng **V3/V-ed** (quá khứ phân từ) khi mệnh đề quan hệ ở **bị động** (be + V3): bỏ đại từ quan hệ và **be**, giữ V3.","explain":"Bị động (passive) là khi danh từ **chịu** hành động: sách **được** xuất bản, học sinh **được** chọn. *The student **that is chosen** as winner* → *The student **chosen** as winner*.\nMuốn nói việc **đang bị** làm thì dùng **being + V3**: *The man **who is being taken away** by the police* → *The man **being taken away** by the police*.\nMẹo phân biệt: danh từ **tự làm** → V-ing (*the man driving the car*); danh từ **bị làm** → V3 (*the car driven by the man*).","formula":"N + who/which/that + be + V3 → N + V3\nN + who/which/that + is/are being + V3 → N + being + V3","examples":[{"en":"The student **chosen** as winner will get a prize.","vi":"Học sinh được chọn là người thắng cuộc sẽ nhận được giải thưởng."},{"en":"The book, **first published** in 1970, has sold over a million copies.","vi":"Cuốn sách này, được xuất bản lần đầu vào năm 1970, đã bán được hơn một triệu bản."},{"en":"'Robinson Crusoe' is a novel **based** on the true story of Alexander Selkirk.","vi":"'Robinson Crusoe' là cuốn tiểu thuyết dựa trên câu chuyện có thật về Alexander Selkirk."},{"en":"The man **being taken away** by the police is our neighbour.","vi":"Người đàn ông đang bị cảnh sát bắt đi là hàng xóm của chúng tôi."},{"en":"The cars making in Japan are very good.","ok":false,"note":"xe được làm ra → bị động → made"}],"mistake":{"wrong":"The letter writing by my grandfather is very old.","right":"The letter written by my grandfather is very old.","why":"Lá thư **được** viết → bị động → **V3**: written."},"tip":"Có **by** (bởi ai) hoặc nghĩa '**được / bị**' → **V3**.","src":"tr. 334","check":{"type":"mcq","q":"The houses ___ last year are very modern.","options":["built","building","to build"],"answer":0,"explain":"Nhà **được** xây → bị động (*which were built*) → **built**.","src":"tự soạn"}},{"title":"Rút gọn bằng cụm danh từ, cụm giới từ","icon":"🏷️","rule":"Mệnh đề **không xác định** dạng *who/which + be + danh từ* rút gọn thành **cụm danh từ**; mệnh đề **xác định** dạng *who/which + be + giới từ…* rút gọn thành **cụm giới từ**.","explain":"**Cụm danh từ** (noun phrase): bỏ *who is / which is*, giữ phần danh từ, và **giữ dấu phẩy**: *Peter Donaldson, **who is our manager**, …* → *Peter Donaldson, **our manager**, …*. Giống tiếng Việt 'Peter, **giám đốc của chúng tôi**, …'.\n**Cụm giới từ** (prepositional phrase): bỏ *which is / who is*, giữ phần giới từ chỉ vị trí: *the painting **which is on the bedroom wall*** → *the painting **on the bedroom wall***. Cụm này **không** có dấu phẩy.","formula":"N, who/which + be + cụm danh từ, … → N, cụm danh từ, …\nN + who/which + be + giới từ + N → N + giới từ + N","examples":[{"en":"Peter Donaldson, **our manager**, graduated in chemical engineering.","vi":"Peter Donaldson, giám đốc của chúng tôi, tốt nghiệp ngành công nghệ hóa."},{"en":"We visited Barcelona, **a city in northern Spain**.","vi":"Chúng tôi tham quan Barcelona, một thành phố ở miền bắc Tây Ban Nha."},{"en":"I like the painting **on the bedroom wall**.","vi":"Tôi thích bức tranh trên tường phòng ngủ."},{"en":"The man **in that big black car** is the President of Erewhon.","vi":"Người đàn ông trong chiếc xe to màu đen kia là chủ tịch của Erewhon."}],"mistake":{"wrong":"The book is on the table is mine.","right":"The book on the table is mine.","why":"Rút gọn thì bỏ cả which **và is**; giữ is thì câu có hai động từ chính."},"tip":"Bỏ **who/which + be**, giữ phần còn lại: danh từ (có phẩy) hoặc giới từ (không phẩy).","src":"tr. 334–335","check":{"type":"order","q":"Sắp xếp thành câu đúng:","words":["The","keys","on","the","table","are","mine."],"explain":"*on the table* là cụm giới từ rút gọn từ *which are on the table*, đứng ngay sau *The keys*.","src":"tự soạn"}},{"title":"Rút gọn bằng to-V","icon":"🥇","rule":"Dùng **to-V** sau **the first, second, last, next, only** và **so sánh nhất**; dùng **to-V** hoặc **for + O + to-V** để nói **mục đích** hoặc **sự cho phép**.","explain":"*Yuri Gagarin was the first man **that went** into space.* → *the first man **to go** into space* (to + động từ nguyên mẫu, không chia thì).\nMục đích, cho phép: *a big yard **which they can play in*** → *a big yard **to play in***. Cần nói rõ **ai** làm thì thêm **for + tân ngữ**: *a garden **that he could play in*** → *a garden **for him to play in***. Nhớ giữ giới từ ở cuối (play **in**, fill **in**).\n**Lưu ý**: kiểu rút gọn này cũng dùng với hai tính từ **available** và **possible**, đặt **sau** danh từ: *all the tickets **available*** (= that are available), *the only date **possible***.","formula":"the first / last / only / so sánh nhất + N + to-V\nN + to-V (+ giới từ)  ·  N + for + O + to-V","examples":[{"en":"Yuri Gagarin was the first man **to go** into space.","vi":"Yuri Gagarin là người đầu tiên bay vào vũ trụ."},{"en":"He became the youngest player **to represent** his country.","vi":"Anh ấy trở thành cầu thủ nhỏ tuổi nhất đại diện cho đất nước mình."},{"en":"Here is a form **for you to fill in**.","vi":"Đây là mẫu đơn để anh điền vào."},{"en":"Tuesday's the only date **possible**.","vi":"Thứ Ba là ngày duy nhất có thể."},{"en":"Was she the only person visited you?","ok":false,"note":"rút gọn sau the only → to visit"}],"mistake":{"wrong":"Neil Armstrong was the first man walked on the moon.","right":"Neil Armstrong was the first man to walk on the moon.","why":"Sau **the first** rút gọn bằng **to-V**; *walked* là động từ chia, không đứng ngay sau danh từ như vậy."},"tip":"**Đầu tiên, cuối cùng, duy nhất, nhất** → **to-V**. Cần chỉ ai làm → **for + O + to-V**.","src":"tr. 335–336","check":{"type":"fill","q":"Rút gọn: I need a pen ___ with. (write)","answer":["to write"],"explain":"Mục đích (cây bút để viết) → **to write**, giữ *with* ở cuối.","src":"tự soạn"}}],"practice":[{"type":"mcq","q":"The girl ___ to the teacher is my sister.","options":["talking","talked","to talk"],"answer":0,"explain":"= *The girl who is talking*: đang diễn ra, chủ động → **talking**.","src":"tự soạn"},{"type":"mcq","q":"Most of the goods ___ in this shop are imported.","options":["sold","selling","to sell"],"answer":0,"explain":"Hàng hóa **được** bán → bị động → **sold**.","src":"tự soạn"},{"type":"classify","q":"Rút gọn mỗi cụm bằng V-ing hay V3?","buckets":["V-ing","V3"],"items":[{"text":"the man who is driving the bus","bucket":0},{"text":"the money which was stolen","bucket":1},{"text":"the students who live in this dorm","bucket":0},{"text":"the cakes which were made by Mai","bucket":1},{"text":"the bridge which connects two villages","bucket":0},{"text":"the songs which are sung by children","bucket":1}],"explain":"Chủ động (đang làm, lâu dài) → **V-ing**: driving, living, connecting. Bị động (be + V3) → **V3**: stolen, made, sung.","src":"tr. 333–334"},{"type":"fill","q":"Rút gọn: Anyone ___ to join the club should call Nam. (want)","answer":["wanting"],"explain":"Ước muốn, chủ động → **wanting** (= who wants).","src":"tr. 333"},{"type":"fill","q":"Rút gọn: The photos ___ by my father are on the wall. (take)","answer":["taken"],"explain":"Ảnh **được** chụp → bị động → **taken**.","src":"tr. 334"},{"type":"fill","q":"Rút gọn: He was the last person ___ the room. (leave)","answer":["to leave"],"explain":"Sau **the last** → **to leave**.","src":"tr. 335"},{"type":"mcq","q":"Hoi An, ___, attracts many tourists.","options":["an old town in central Vietnam","is an old town in central Vietnam","which an old town in central Vietnam"],"answer":0,"explain":"Rút gọn *which is an old town…* bằng **cụm danh từ**: bỏ cả which **và is**, giữ dấu phẩy.","src":"tr. 334–335"},{"type":"mcq","q":"Câu nào KHÔNG rút gọn được bằng V-ing?","options":["The man who phoned me yesterday was rude.","The man who is standing there is rude.","The people who live upstairs are noisy."],"answer":0,"explain":"*phoned me yesterday* là **một hành động đã xong** trong quá khứ → không rút gọn bằng V-ing. Hai câu kia: đang diễn ra (standing), lâu dài (living).","src":"tr. 334"},{"type":"fix","wrong":"Most of the people inviting to the party were my friends.","answer":["Most of the people invited to the party were my friends.","Most of the people who were invited to the party were my friends.","Most of the people that were invited to the party were my friends."],"explain":"Người **được** mời → bị động → **invited**, không phải inviting.","src":"tự soạn"},{"type":"fix","wrong":"The books are on the shelf are mine.","answer":["The books on the shelf are mine.","The books which are on the shelf are mine.","The books that are on the shelf are mine."],"explain":"Rút gọn bằng cụm giới từ thì bỏ cả which **và are**: *The books on the shelf*.","src":"tr. 335"},{"type":"fix","wrong":"She was the youngest girl winning the contest.","answer":["She was the youngest girl to win the contest.","She was the youngest girl that won the contest."],"explain":"Sau **so sánh nhất** (the youngest) rút gọn bằng **to-V**: to win.","src":"tr. 335"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","need","a","quiet","room","for","my","son","to","study","in."],"explain":"Mục đích + chỉ rõ ai → **for + O + to-V**, giới từ *in* ở cuối: một căn phòng yên tĩnh để con trai tôi học.","src":"tự soạn"}],"flashcards":[{"front":"Rút gọn mệnh đề chủ động (đang / lâu dài / mong muốn)?","back":"**V-ing**: the people **waiting** outside"},{"front":"Khi nào KHÔNG rút gọn bằng V-ing?","back":"Hành động **một lần, đã xong** trong quá khứ: the customer **who phoned** yesterday"},{"front":"Rút gọn mệnh đề bị động?","back":"**V3**: the student **chosen** as winner · đang bị: **being** taken away"},{"front":"Peter, who is our manager, … → ?","back":"Cụm danh từ: Peter, **our manager**, …"},{"front":"the first / the only / so sánh nhất + ?","back":"**to-V**: the first man **to go** into space"},{"front":"a garden that he could play in → ?","back":"a garden **for him to play in**"},{"front":"available / possible đứng ở đâu?","back":"Sau danh từ: all the tickets **available**, the only date **possible**"}]}],"quiz":{"pass":0.8,"sets":[[{"type":"mcq","q":"The nurse ___ looked after me was very kind.","options":["who","which","whose"],"answer":0,"explain":"nurse là người, chỗ trống là chủ ngữ của looked after → **who**.","src":"tự soạn"},{"type":"mcq","q":"I can't find the keys ___ I put on the table.","options":["which","who","whose"],"answer":0,"explain":"keys là vật → **which**. who chỉ dùng cho người; whose phải có danh từ theo sau.","src":"tự soạn"},{"type":"fill","q":"Children ___ eat too much sugar often have bad teeth.","answer":["who","that"],"explain":"Children là người, chỗ trống là chủ ngữ của eat → **who** hoặc **that**.","src":"tự soạn"},{"type":"fill","q":"We stayed at a hotel ___ rooms were very small.","answer":["whose"],"explain":"Phòng **của** khách sạn → **whose** rooms (whose dùng được cho vật).","src":"tr. 324"},{"type":"mcq","q":"Mr Hai is the man ___ son won the race.","options":["whose","who","who's"],"answer":0,"explain":"Con trai **của** ông ấy → **whose** son. who's = who is.","src":"tự soạn"},{"type":"mcq","q":"That is the woman ___ I met at the bank. (lối văn trang trọng)","options":["whom","which","whose"],"answer":0,"explain":"woman là người, chỗ trống là **tân ngữ** của met (I là chủ ngữ) → **whom** trong văn trang trọng.","src":"tr. 323"},{"type":"fix","wrong":"The film who we watched last night was boring.","answer":["The film which we watched last night was boring.","The film that we watched last night was boring.","The film we watched last night was boring."],"explain":"film là vật → **which/that**, không dùng who.","src":"tự soạn"},{"type":"fix","wrong":"The girl who she won the prize is my classmate.","answer":["The girl who won the prize is my classmate.","The girl that won the prize is my classmate."],"explain":"**who** đã thay cho *she* → bỏ *she*.","src":"tr. 326"},{"type":"fix","wrong":"I have a friend who his father is a famous chef.","answer":["I have a friend whose father is a famous chef."],"explain":"Bố **của** bạn ấy → **whose father**, không viết *who his father*.","src":"tr. 324"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["The","dog","that","bit","me","belongs","to","my","neighbour."],"explain":"*that bit me* đứng ngay sau *The dog*; động từ chính *belongs* theo sau. Nghĩa: Con chó cắn tôi là của hàng xóm.","src":"tự soạn"},{"type":"mcq","q":"Gộp hai câu: 'I know a man. He can fix your car.'","options":["I know a man who can fix your car.","I know a man who he can fix your car.","I know a man which can fix your car."],"answer":0,"explain":"**who** thay cho *He* (người, chủ ngữ) → không giữ *he*; which dùng cho vật.","src":"tr. 326"},{"type":"mcq","q":"This is the most expensive watch ___ I've ever bought.","options":["that","which","what"],"answer":0,"explain":"Sau **so sánh nhất** → **that**; sách không dùng which ở đây. what không đứng sau danh từ làm đại từ quan hệ.","src":"tr. 324–325"},{"type":"mcq","q":"Is there anything ___ I can help you with?","options":["that","what","whose"],"answer":0,"explain":"Sau **anything** thường dùng **that**. Không dùng what.","src":"tr. 325"},{"type":"fill","q":"The farmer and his cows ___ live on this hill are famous in the village.","answer":["that"],"explain":"*the farmer and his cows*: cả người lẫn con vật → chỉ **that** (who chỉ cho người, which chỉ cho vật).","src":"tr. 324–325"},{"type":"mcq","q":"I'll never forget the summer ___ we spent in Nha Trang.","options":["that","when","where"],"answer":0,"explain":"*spent* cần tân ngữ (spend the summer) → chỗ trống là **tân ngữ** → **that** (hoặc which). when/where dùng khi mệnh đề đã đủ, không thiếu tân ngữ.","src":"tự soạn"},{"type":"mcq","q":"Do you know a shop ___ I can buy cheap shoes?","options":["where","which","when"],"answer":0,"explain":"shop là nơi chốn, *I can buy cheap shoes* đã đủ → **where** (= at which).","src":"tr. 330"},{"type":"fill","q":"The reason ___ he was late is that his car broke down.","answer":["why","that","for which"],"explain":"Sau **the reason** → **why** (= for which); trong mệnh đề xác định why cũng thay được bằng that.","src":"tr. 326–327"},{"type":"mcq","q":"Chọn câu đúng:","options":["This is the city I was born.","This is the city where I was born in.","This is the city I was born in."],"answer":2,"explain":"Sau *city*, bỏ where thì phải giữ **in** ở cuối. Có where thì không thêm in.","src":"tr. 327"},{"type":"classify","q":"Đại từ quan hệ trong mỗi cụm có bỏ được không?","buckets":["Bỏ được","Không bỏ được"],"items":[{"text":"the coffee that I drink every morning","bucket":0},{"text":"the coffee which keeps me awake","bucket":1},{"text":"the man whom you met","bucket":0},{"text":"the man who called you","bucket":1},{"text":"everything that she said","bucket":0},{"text":"the train that leaves at 8","bucket":1}],"explain":"Bỏ được khi đại từ là **tân ngữ** (sau nó có I, you, she…). Đại từ đứng ngay trước động từ (keeps, called, leaves) là chủ ngữ → giữ.","src":"tr. 325"},{"type":"fix","wrong":"The hospital where my mother works at is very big.","answer":["The hospital where my mother works is very big.","The hospital which my mother works at is very big.","The hospital that my mother works at is very big.","The hospital my mother works at is very big.","The hospital at which my mother works is very big.","The hospital in which my mother works is very big."],"explain":"**where** đã mang nghĩa 'at/in which' → không thêm **at** nữa.","src":"tr. 327"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Is","there","somewhere","I","can","sit","down?"],"explain":"Sau **somewhere**, where được bỏ: *Is there somewhere (where) I can sit down?* Nghĩa: Có chỗ nào tôi ngồi được không?","src":"tr. 327"},{"type":"mcq","q":"Put the box ___ everyone can see it.","options":["where","which","that"],"answer":0,"explain":"**where** đứng không cần danh từ phía trước, nghĩa là *the place where* (ở chỗ mà).","src":"tr. 327"},{"type":"mcq","q":"The friend ___ I went on holiday was very funny.","options":["with whom","with who","with that"],"answer":0,"explain":"Giới từ đứng trước đại từ quan hệ chỉ đi với **whom** (người) hoặc which (vật).","src":"tr. 328–329"},{"type":"fill","q":"The topic about ___ we talked was very interesting.","answer":["which"],"explain":"topic là vật, đứng sau giới từ **about** → **which** (không dùng that sau giới từ).","src":"tr. 328"},{"type":"mcq","q":"Chọn câu đúng:","options":["The chair on that I sat was broken.","The chair that I sat on was broken."],"answer":1,"explain":"Không đặt giới từ trước **that**; để *on* ở cuối.","src":"tr. 329"},{"type":"fix","wrong":"The man for who I work is very strict.","answer":["The man for whom I work is very strict.","The man who I work for is very strict.","The man whom I work for is very strict.","The man that I work for is very strict.","The man I work for is very strict."],"explain":"Giới từ đứng trước thì phải là **whom**: *for whom*. Hoặc đưa *for* về cuối.","src":"tr. 329"},{"type":"mcq","q":"The old lady ___ is my grandmother.","options":["who I look after","after whom I look"],"answer":0,"explain":"**look after** là cụm động từ → không tách *after* lên trước whom.","src":"tr. 329"},{"type":"fill","q":"She has many friends, none of ___ live near her.","answer":["whom"],"explain":"friends là người, đứng sau **none of** → **whom**.","src":"tr. 329"},{"type":"mcq","q":"I read three books, ___ were boring.","options":["all of which","all of them","all of that"],"answer":0,"explain":"Nối bằng dấu phẩy cần đại từ quan hệ; books là vật → **all of which**.","src":"tr. 329"},{"type":"fix","wrong":"The team has ten players, most of who are under 20.","answer":["The team has ten players, most of whom are under 20."],"explain":"Sau **of**, người → **whom**.","src":"tr. 329"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["The","music","which","she","listens","to","is","very","loud."],"explain":"**listen to** là cụm động từ: *to* ở lại sau *listens*. Nghĩa: Thứ nhạc cô ấy nghe rất ồn.","src":"tr. 329"},{"type":"mcq","q":"Ms Lan, ___ teaches us maths, is very kind.","options":["who","that","which"],"answer":0,"explain":"Tên riêng + dấu phẩy → mệnh đề không xác định → không dùng that; người → **who**.","src":"tr. 331"},{"type":"mcq","q":"Câu nào cần thêm dấu phẩy?","options":["The Mekong which flows through six countries is very long.","The river which flows through our village is very clean."],"answer":0,"explain":"*The Mekong* là tên riêng, mệnh đề chỉ thêm thông tin → cần dấu phẩy. Câu 2 cần mệnh đề để biết **con sông nào**.","src":"tr. 330"},{"type":"classify","q":"Mệnh đề quan hệ trong mỗi câu thuộc loại nào?","buckets":["Xác định","Không xác định"],"items":[{"text":"The bag which I lost was brown.","bucket":0},{"text":"My bag, which I bought in Bangkok, is brown.","bucket":1},{"text":"People who exercise live longer.","bucket":0},{"text":"Mr Son, who exercises every day, is 90.","bucket":1},{"text":"Is this the place where you work?","bucket":0},{"text":"We drove to Vung Tau, where we stayed two days.","bucket":1}],"explain":"Xác định: cho biết cái/người/nơi **nào**, không phẩy. Không xác định: danh từ đã rõ (my bag, Mr Son, Vung Tau) + dấu phẩy.","src":"tr. 330–331"},{"type":"fill","q":"I gave her a scarf, ___ she wore every day.","answer":["which"],"explain":"scarf là vật, mệnh đề có dấu phẩy → **which** (không dùng that, không bỏ).","src":"tr. 331"},{"type":"mcq","q":"He came to the party late, ___ annoyed everybody.","options":["which","that","what"],"answer":0,"explain":"Điều làm mọi người khó chịu là **việc** anh ấy đến trễ → **, which** trỏ cả câu.","src":"tr. 332"},{"type":"fix","wrong":"My laptop, that I bought last year, is already slow.","answer":["My laptop, which I bought last year, is already slow."],"explain":"Có dấu phẩy → không dùng **that**; laptop là vật → **which**.","src":"tr. 331"},{"type":"fix","wrong":"Mr Quang, I work for, is very generous.","answer":["Mr Quang, who I work for, is very generous.","Mr Quang, whom I work for, is very generous.","Mr Quang, for whom I work, is very generous."],"explain":"Mệnh đề không xác định → **không bỏ** đại từ: thêm who/whom (hoặc for whom).","src":"tr. 331"},{"type":"mcq","q":"Câu 'The students, who had finished the test, went home.' có nghĩa là gì?","options":["Tất cả học sinh đều đã làm xong bài, và các em đi về.","Chỉ những học sinh đã làm xong bài mới đi về."],"answer":0,"explain":"Có dấu phẩy → mệnh đề chỉ thêm thông tin về **tất cả** học sinh. Nếu không có phẩy mới là 'chỉ những em đã làm xong'.","src":"tr. 330"},{"type":"mcq","q":"Da Lat, ___ we spent our honeymoon, is very romantic.","options":["where","which","that"],"answer":0,"explain":"*we spent our honeymoon* đã đủ (honeymoon là tân ngữ), thiếu 'ở đâu' → **where**.","src":"tr. 332"},{"type":"fill","q":"My uncle, ___ car was stolen last week, has to take the bus now.","answer":["whose"],"explain":"Xe **của** chú tôi → **whose** car.","src":"tr. 331"},{"type":"mcq","q":"The boy ___ in the garden is my son.","options":["playing","played","to play"],"answer":0,"explain":"= *who is playing*: đang diễn ra, chủ động → **playing**.","src":"tr. 333"},{"type":"mcq","q":"The new bridge ___ the two towns will open next month.","options":["connecting","connected","connects"],"answer":0,"explain":"Cây cầu **nối** hai thị trấn: chủ động, tính chất lâu dài → **connecting**. *connects* là động từ chia, không đứng ngay sau danh từ khi đã bỏ which.","src":"tr. 333"},{"type":"fill","q":"Rút gọn: Many of the people ___ in the accident were children. (injure)","answer":["injured"],"explain":"Người **bị** thương → bị động → **injured**.","src":"tr. 334"},{"type":"fill","q":"Rút gọn: She was the only student ___ the answer. (know)","answer":["to know"],"explain":"Sau **the only** → **to-V**: to know.","src":"tr. 335"},{"type":"mcq","q":"Rút gọn câu: 'Mr Binh, who is my neighbour, is a pilot.'","options":["Mr Binh, my neighbour, is a pilot.","Mr Binh, is my neighbour, is a pilot.","Mr Binh, being neighbour, a pilot."],"answer":0,"explain":"Rút gọn bằng **cụm danh từ**: bỏ *who is*, giữ *my neighbour* và hai dấu phẩy.","src":"tr. 334–335"},{"type":"fix","wrong":"The letters sending yesterday will arrive tomorrow.","answer":["The letters sent yesterday will arrive tomorrow.","The letters which were sent yesterday will arrive tomorrow.","The letters that were sent yesterday will arrive tomorrow."],"explain":"Thư **được** gửi → bị động → **sent**.","src":"tr. 334"},{"type":"fix","wrong":"The girl is sitting by the window is my sister.","answer":["The girl sitting by the window is my sister.","The girl who is sitting by the window is my sister.","The girl that is sitting by the window is my sister."],"explain":"Rút gọn thì bỏ cả who **và is** → *the girl sitting*; hoặc giữ đủ *who is sitting*.","src":"tr. 333"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["She","was","the","first","person","to","arrive."],"explain":"Sau **the first** → **to-V**: Cô ấy là người đến đầu tiên.","src":"tr. 335"},{"type":"mcq","q":"Please book the earliest flight ___.","options":["possible","possibly","is possible"],"answer":0,"explain":"Tính từ **possible** đứng **sau** danh từ, rút gọn từ *that is possible*.","src":"tr. 336"}],[{"type":"mcq","q":"The police caught the man ___ stole my bike.","options":["who","which","whose"],"answer":0,"explain":"man là người, chỗ trống là chủ ngữ của stole → **who**.","src":"tự soạn"},{"type":"mcq","q":"Where is the letter ___ came this morning?","options":["which","who","whom"],"answer":0,"explain":"letter là vật → **which**. who/whom chỉ dùng cho người.","src":"tự soạn"},{"type":"fill","q":"Students ___ study hard usually pass.","answer":["who","that"],"explain":"Students là người, chỗ trống là chủ ngữ của study → **who** hoặc **that**.","src":"tự soạn"},{"type":"fill","q":"The tree ___ leaves are turning yellow is very old.","answer":["whose"],"explain":"Lá **của** cây → **whose** leaves (whose dùng được cho vật).","src":"tr. 324"},{"type":"fill","q":"It's a song ___ which I can't remember the words.","answer":["of"],"explain":"Với vật, có thể thay whose bằng **of which**: *a song of which I can't remember the words* (= whose words I can't remember).","src":"tr. 325"},{"type":"mcq","q":"Chọn câu đúng:","options":["I met a writer whose books I love.","I met a writer the books of whom I love."],"answer":0,"explain":"Sở hữu của **người** phải dùng **whose**; không dùng *of whom* để chỉ sở hữu.","src":"tr. 325–326"},{"type":"classify","q":"Điền who, which hay whose?","buckets":["who","which","whose"],"items":[{"text":"the girl ___ is singing","bucket":0},{"text":"the song ___ she is singing","bucket":1},{"text":"the girl ___ voice is lovely","bucket":2},{"text":"the shop ___ sells bread","bucket":1},{"text":"the baker ___ bread is famous","bucket":2},{"text":"the baker ___ opens at 5 a.m.","bucket":0}],"explain":"Người làm chủ ngữ → **who**; vật → **which**; '**của**' + danh từ (voice, bread) → **whose**.","src":"tr. 323–324"},{"type":"fix","wrong":"The bike which I borrowed it from Nam is very old.","answer":["The bike which I borrowed from Nam is very old.","The bike that I borrowed from Nam is very old.","The bike I borrowed from Nam is very old."],"explain":"**which** đã thay cho *it* → bỏ *it*.","src":"tr. 326"},{"type":"fix","wrong":"The children which live here go to the same school.","answer":["The children who live here go to the same school.","The children that live here go to the same school."],"explain":"children là người → **who/that**, không dùng which.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","have","a","neighbour","whose","dog","barks","all","night."],"explain":"*whose dog* = con chó **của** người hàng xóm. Nghĩa: Tôi có một người hàng xóm có con chó sủa suốt đêm.","src":"tự soạn"},{"type":"mcq","q":"Gộp hai câu: 'This is the cake. My mother made it.'","options":["This is the cake which my mother made.","This is the cake which my mother made it.","This is the cake who my mother made."],"answer":0,"explain":"**which** thay cho *it* (tân ngữ) → bỏ *it*; cake là vật nên không dùng who.","src":"tr. 326"},{"type":"mcq","q":"She is the most beautiful girl ___ I've ever met.","options":["that","who","whose"],"answer":0,"explain":"Sau **so sánh nhất**, sách cho dùng **that** (hoặc bỏ), không dùng who.","src":"tr. 325"},{"type":"mcq","q":"The jockey and the horse ___ won the race are famous.","options":["that","who","which"],"answer":0,"explain":"jockey (người) + horse (con vật) → tiền ngữ hỗn hợp → chỉ **that**.","src":"tr. 324–325"},{"type":"fill","q":"There's nothing ___ you can do now."
