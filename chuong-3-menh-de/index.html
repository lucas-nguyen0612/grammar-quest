,"answer":["that"],"explain":"Sau **nothing** (đại từ bất định), thường dùng **that**. Ở đây that làm tân ngữ nên cũng có thể bỏ: *There's nothing you can do now.*","src":"tr. 325","hint":"Điền một đại từ quan hệ (dù bỏ trống cũng đúng)"},{"type":"mcq","q":"The only thing ___ matters is your health.","options":["that","what","who"],"answer":0,"explain":"Sau **the only** dùng **that**. Không viết *the only thing what*.","src":"tr. 325"},{"type":"mcq","q":"2010 was the year ___ my son was born.","options":["when","where","which"],"answer":0,"explain":"year là thời gian, *my son was born* đã đủ → **when** (= in which).","src":"tr. 326"},{"type":"fill","q":"That's the café ___ we first met.","answer":["where","in which","at which"],"explain":"Nơi chốn, *we first met* đã đủ → **where** (= in/at which). Sau *café* không bỏ where được.","src":"tr. 326–327"},{"type":"mcq","q":"This is the town ___ I visited last summer.","options":["which","where","when"],"answer":0,"explain":"*visited* cần tân ngữ (visit a town) → chỗ trống là **tân ngữ** → **which** (hoặc that). where chỉ dùng khi mệnh đề đã đủ.","src":"tr. 332"},{"type":"fix","wrong":"Do you know the reason for why she cried?","answer":["Do you know the reason why she cried?","Do you know the reason for which she cried?","Do you know the reason that she cried?","Do you know the reason she cried?"],"explain":"**why** đã bằng *for which* → không thêm giới từ **for** trước why.","src":"tr. 327"},{"type":"mcq","q":"Câu nào KHÔNG bỏ được where?","options":["We need a place where we can rest.","This is the factory where my father works."],"answer":1,"explain":"where chỉ bỏ được sau **place, somewhere, anywhere…**. Sau *factory* bỏ where thì phải thêm giới từ (*the factory my father works in/at*).","src":"tr. 327"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","still","remember","when","we","first","met."],"explain":"**when** đứng không cần danh từ phía trước, nghĩa là *the time when*. Nghĩa: Tôi vẫn nhớ lúc chúng ta gặp nhau lần đầu.","src":"tr. 327"},{"type":"fix","wrong":"Everything what she told me was true.","answer":["Everything that she told me was true.","Everything she told me was true."],"explain":"Sau **everything** dùng **that** (hoặc bỏ vì là tân ngữ), không dùng what.","src":"tr. 325"},{"type":"mcq","q":"This is the knife ___ I cut the bread.","options":["with which","with that","which with"],"answer":0,"explain":"Giới từ đứng **trước** which: *with which*. Không đặt giới từ trước that.","src":"tr. 328"},{"type":"fill","q":"The person to ___ you should speak is the manager.","answer":["whom"],"explain":"person là người, đứng sau giới từ **to** → **whom** (không dùng who/that sau giới từ).","src":"tr. 328–329"},{"type":"mcq","q":"Chọn câu đúng:","options":["The house in that I grew up is small.","The house in which I grew up is small."],"answer":1,"explain":"Giới từ chỉ đứng trước **which/whom**, không đứng trước that.","src":"tr. 329"},{"type":"fix","wrong":"The woman about who you asked is my aunt.","answer":["The woman about whom you asked is my aunt.","The woman who you asked about is my aunt.","The woman whom you asked about is my aunt.","The woman that you asked about is my aunt.","The woman you asked about is my aunt."],"explain":"Không đặt giới từ trước **who**: đổi thành *about whom*, hoặc đưa *about* về cuối.","src":"tr. 329"},{"type":"mcq","q":"The girl ___ is very polite.","options":["who I'm looking after","after whom I'm looking","after who I'm looking"],"answer":0,"explain":"**look after** là cụm động từ → không tách *after* ra khỏi động từ.","src":"tr. 329"},{"type":"fill","q":"I have two brothers, neither of ___ can swim.","answer":["whom"],"explain":"brothers là người, đứng sau **neither of** → **whom**.","src":"tr. 329"},{"type":"mcq","q":"He wrote ten novels, ___ became best-sellers.","options":["three of which","three of them","three of who"],"answer":0,"explain":"Nối bằng dấu phẩy → cần đại từ quan hệ; novels là vật → **of which**.","src":"tr. 329"},{"type":"fix","wrong":"My friend Mai, without who I can't do this job, is ill today.","answer":["My friend Mai, without whom I can't do this job, is ill today."],"explain":"Sau giới từ **without**, người → **whom**.","src":"tr. 329"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","found","the","word","I","was","looking","up."],"explain":"**look up** là cụm động từ: *up* ở lại sau *looking*; đại từ tân ngữ đã được bỏ. Nghĩa: Tôi đã tìm ra từ mà tôi đang tra.","src":"tr. 329","answer":["I found the word I was looking up.","I was looking up the word I found."]},{"type":"mcq","q":"Vietnam, ___ is in Southeast Asia, has a long coastline.","options":["which","that","where"],"answer":0,"explain":"Tên riêng + dấu phẩy → không dùng that. Chỗ trống là chủ ngữ của *is* → **which**; where không làm chủ ngữ.","src":"tr. 331"},{"type":"mcq","q":"My grandfather, ___ I love very much, lives in the countryside.","options":["whom","that","(bỏ trống)"],"answer":0,"explain":"Có dấu phẩy → không dùng that, **không bỏ** đại từ → **whom** (hoặc who).","src":"tr. 331"},{"type":"classify","q":"Mệnh đề quan hệ trong mỗi câu thuộc loại nào?","buckets":["Xác định","Không xác định"],"items":[{"text":"The shoes that I bought hurt my feet.","bucket":0},{"text":"My new shoes, which I bought online, hurt my feet.","bucket":1},{"text":"A man who lives near me is a singer.","bucket":0},{"text":"Mr Tam, who lives near me, is a singer.","bucket":1},{"text":"The day when we met was rainy.","bucket":0},{"text":"We met in 2019, when I was in Hue.","bucket":1}],"explain":"Xác định: cho biết cái/người/lúc **nào**, không phẩy. Không xác định: danh từ đã rõ (my new shoes, Mr Tam, 2019) + dấu phẩy.","src":"tr. 330–331"},{"type":"fill","q":"We had lunch at the Lotus restaurant, ___ the food was excellent.","answer":["where","at which","in which"],"explain":"Nhà hàng là nơi chốn, *the food was excellent* đã đủ → **where** (= at which).","src":"tr. 331"},{"type":"fill","q":"My phone stopped working, ___ was very annoying.","answer":["which"],"explain":"Điều gây bực mình là **việc** điện thoại hỏng → **, which** trỏ cả câu.","src":"tr. 332"},{"type":"fix","wrong":"Nha Trang, that is famous for its beaches, is in Khanh Hoa.","answer":["Nha Trang, which is famous for its beaches, is in Khanh Hoa."],"explain":"Có dấu phẩy → không dùng **that** → **which**.","src":"tr. 331"},{"type":"fix","wrong":"My boss, I told you about, is leaving.","answer":["My boss, who I told you about, is leaving.","My boss, whom I told you about, is leaving.","My boss, about whom I told you, is leaving."],"explain":"Mệnh đề không xác định → không bỏ đại từ: thêm **who/whom**.","src":"tr. 331"},{"type":"mcq","q":"Câu 'My sister who lives in Hue is a nurse.' (không có dấu phẩy) gợi ý điều gì?","options":["Tôi có hơn một chị gái; người sống ở Huế là y tá.","Tôi chỉ có một chị gái."],"answer":0,"explain":"Không có phẩy → mệnh đề **xác định**: nó dùng để chỉ ra chị nào, tức là còn chị khác.","src":"tr. 330"},{"type":"mcq","q":"Sunday, ___ most people stay at home, is my busiest day.","options":["when","which","that"],"answer":0,"explain":"Thời gian, *most people stay at home* đã đủ → **when**. Có dấu phẩy nên không dùng that.","src":"tr. 331"},{"type":"mcq","q":"Câu nào đúng?","options":["London, where I was born, is a big city.","London, which I was born, is a big city."],"answer":0,"explain":"*I was born* đã đủ, thiếu 'ở đâu' → **where** (= in which). which phải làm chủ ngữ hoặc tân ngữ.","src":"tr. 332"},{"type":"mcq","q":"The car ___ repaired now is mine.","options":["being","been","is being"],"answer":0,"explain":"= *which is being repaired*: đang bị sửa → rút gọn bằng **being + V3**.","src":"tr. 334"},{"type":"mcq","q":"The dishes ___ at this restaurant are delicious.","options":["served","serving","to serve"],"answer":0,"explain":"Món ăn **được** phục vụ → bị động → **served**.","src":"tr. 334"},{"type":"fill","q":"Rút gọn: Students ___ to take the exam must register by Friday. (wish)","answer":["wishing"],"explain":"Ước muốn, chủ động → **wishing** (= who wish).","src":"tr. 333"},{"type":"fill","q":"Rút gọn: He was the second man ___ on the moon. (walk)","answer":["to walk"],"explain":"Sau **the second** → **to walk**.","src":"tr. 335"},{"type":"mcq","q":"Rút gọn câu: 'The keys which are in the drawer are mine.'","options":["The keys in the drawer are mine.","The keys are in the drawer are mine.","The keys being in the drawer mine."],"answer":0,"explain":"Rút gọn bằng **cụm giới từ**: bỏ cả which **và are**.","src":"tr. 335"},{"type":"fix","wrong":"The woman injuring in the crash is in hospital.","answer":["The woman injured in the crash is in hospital.","The woman who was injured in the crash is in hospital.","The woman that was injured in the crash is in hospital."],"explain":"Bà ấy **bị** thương → bị động → **injured**.","src":"tr. 334"},{"type":"fix","wrong":"He was the first student answered the question.","answer":["He was the first student to answer the question.","He was the first student that answered the question."],"explain":"Sau **the first** rút gọn bằng **to-V**: to answer.","src":"tr. 335"},{"type":"mcq","q":"Câu nào đúng?","options":["The man phoning you yesterday is here.","The man who phoned you yesterday is here."],"answer":1,"explain":"Gọi điện **hôm qua, một lần, đã xong** → không rút gọn bằng V-ing; giữ *who phoned*.","src":"tr. 334"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Here","is","a","book","for","you","to","read."],"explain":"Mục đích + chỉ rõ ai → **for + O + to-V**: Đây là cuốn sách để bạn đọc.","src":"tr. 336"}]]}},{"id":"03-menh-de-trang-ngu","title":"Mệnh đề trạng ngữ","en":"Adverb clauses","icon":"🧭","pages":"346–382","summary":"Mệnh đề trạng ngữ (adverb clause) là mệnh đề phụ bổ nghĩa cho mệnh đề chính: ở đâu, khi nào, vì sao, kết quả ra sao, để làm gì, dù thế nào, với điều kiện gì, theo cách nào. Chủ đề này dạy bạn chọn đúng liên từ cho từng nghĩa, chia thì đúng trong mệnh đề thời gian, phân biệt các cặp dễ nhầm (because / because of, so / such, too / enough, so that / in order to, although / despite, in case / if, as / like) và bỏ các lỗi kiểu 'Vì… nên…', 'Mặc dù… nhưng…' của người Việt.","mindmap":{"label":"Mệnh đề trạng ngữ","children":[{"label":"Nơi chốn & thời gian","icon":"⏰","children":[{"label":"where, wherever"},{"label":"when, while, as, since"},{"label":"hardly… when, no sooner… than"}]},{"label":"Nguyên nhân","icon":"💡","children":[{"label":"because, since, as, for"},{"label":"because of, due to + N"}]},{"label":"Kết quả","icon":"⚖️","children":[{"label":"so… that, such… that"},{"label":"too… to, enough… to"}]},{"label":"Mục đích","icon":"🎯","children":[{"label":"so that, in order that"},{"label":"to-V, in order to, so as to"}]},{"label":"Tương phản","icon":"↔️","children":[{"label":"although, even though"},{"label":"despite, in spite of"},{"label":"no matter, however"}]},{"label":"Điều kiện","icon":"🔑","children":[{"label":"unless, in case, provided"},{"label":"Should / Were / Had…"}]},{"label":"Thể cách","icon":"🎭","children":[{"label":"as, like"},{"label":"as if, as though"}]}]},"lessons":[{"id":"03a","title":"Mệnh đề trạng ngữ: nơi chốn và thời gian","minutes":25,"goal":"Nhận ra mệnh đề trạng ngữ và đặt dấu phẩy đúng; dùng where / wherever; chia thì đúng trong mệnh đề thời gian (hiện tại thay cho tương lai, since + quá khứ đơn).","pretest":[{"type":"mcq","q":"I'll call you when I ___ home.","options":["get","will get","got"],"answer":0,"explain":"Nói về tương lai, mệnh đề sau **when** dùng **thì hiện tại**: when I **get** home. Không dùng *will* sau when.","src":"tr. 347"},{"type":"mcq","q":"Put the keys ___ you can find them easily.","options":["where","which","what"],"answer":0,"explain":"**where** = ở nơi mà: để chìa khoá ở chỗ dễ tìm.","src":"tr. 346"},{"type":"mcq","q":"I haven't seen her since she ___ to Hanoi.","options":["moved","has moved","moves"],"answer":0,"explain":"Sau **since** (kể từ khi) dùng **quá khứ đơn**: since she **moved**. Mệnh đề chính dùng hiện tại hoàn thành: haven't seen.","src":"tr. 348"}],"hook":{"icon":"🧭","text":"Hãy coi câu chính là **chiếc xe**, còn mệnh đề trạng ngữ là **tấm bản đồ** gắn kèm: nó cho biết xe chạy **ở đâu, khi nào, vì sao, để làm gì**. Tiếng Việt nói 'Khi nào rảnh tôi **sẽ** viết thư', nhưng tiếng Anh không dùng *will* trong mệnh đề 'khi nào': I'll write **when I have time**. Bài đầu tiên này cho bạn thấy cả bản đồ và học hai loại dễ nhất: **nơi chốn** và **thời gian**."},"diagram":{"type":"mindmap","title":"8 loại mệnh đề trạng ngữ (gom thành 7 nhánh)","root":{"label":"Mệnh đề trạng ngữ","children":[{"label":"Nơi chốn & thời gian","icon":"📍","children":[{"label":"where, wherever"},{"label":"when, while, since, until…"}]},{"label":"Nguyên nhân","icon":"💡","children":[{"label":"because, since, as"},{"label":"because of + N"}]},{"label":"Kết quả","icon":"⚖️","children":[{"label":"so… that, such… that"},{"label":"too… to, enough… to"}]},{"label":"Mục đích","icon":"🎯","children":[{"label":"so that, in order that"},{"label":"to-V, in order to"}]},{"label":"Tương phản","icon":"↔️","children":[{"label":"although, even though"},{"label":"despite, in spite of"}]},{"label":"Điều kiện","icon":"🔑","children":[{"label":"if, unless, in case"}]},{"label":"Thể cách","icon":"🎭","children":[{"label":"as, like, as if"}]}]}},"chunks":[{"title":"Mệnh đề trạng ngữ là gì?","icon":"🧩","rule":"Mệnh đề trạng ngữ là **mệnh đề phụ** (có S + V) mở đầu bằng **liên từ phụ thuộc** (when, where, because, if, although…), bổ nghĩa cho mệnh đề chính. Đứng **trước** mệnh đề chính thì có **dấu phẩy**.","explain":"Mệnh đề trạng ngữ (adverb clause) làm việc giống một trạng từ: nó trả lời *ở đâu? khi nào? vì sao? để làm gì?…* cho mệnh đề chính (main clause). Nó luôn bắt đầu bằng một liên từ phụ thuộc (subordinating conjunction) như *where, wherever, when, while, before, after, if, unless, because, as, since, though, although, even though*. Phần lớn mệnh đề trạng ngữ đứng trước hay sau mệnh đề chính đều được. Khi đứng **trước**, nó được ngăn với mệnh đề chính bằng **dấu phẩy**; trong các ví dụ của sách, khi đứng sau thì không có dấu phẩy.","formula":"Mệnh đề trạng ngữ, mệnh đề chính.\nMệnh đề chính + mệnh đề trạng ngữ.","examples":[{"en":"I'll phone you again **when I get home**.","vi":"Khi về đến nhà tôi sẽ gọi lại cho anh."},{"en":"**When I get home**, I'll phone you again.","vi":"Khi về đến nhà, tôi sẽ gọi lại cho anh."},{"en":"We finished early **because we worked fast**.","vi":"Chúng tôi xong sớm vì chúng tôi làm nhanh."},{"en":"**Even though you are 16**, you can't go to that movie.","vi":"Cho dù con đã 16 tuổi, con vẫn không thể đi xem bộ phim đó."},{"en":"Because we worked fast we finished early.","ok":false,"note":"mệnh đề trạng ngữ đứng đầu → thiếu dấu phẩy"}],"mistake":{"wrong":"If it rains we'll stay at home.","right":"If it rains, we'll stay at home.","why":"Mệnh đề trạng ngữ đứng trước mệnh đề chính thì phải có dấu phẩy ngăn cách."},"tip":"Mệnh đề phụ mở đầu câu → 'đóng cửa' nó bằng một **dấu phẩy**.","src":"tr. 346","check":{"type":"mcq","q":"Trong câu 'I saw her a few days before she died', đâu là mệnh đề trạng ngữ?","options":["before she died","I saw her","a few days"],"answer":0,"explain":"**before she died** có liên từ *before* + S + V, bổ nghĩa thời gian cho mệnh đề chính *I saw her*.","src":"tr. 346"}},{"title":"Nơi chốn: where, wherever","icon":"📍","rule":"**where** = ở nơi (một chỗ cụ thể); **wherever** = bất cứ nơi đâu. Trong lối nói thân mật, *everywhere* đôi khi thay cho *wherever*.","explain":"Ở đây *where* không bổ nghĩa cho một danh từ (như mệnh đề quan hệ ở chủ đề trước) mà cho cả hành động của mệnh đề chính: *để ở đâu? đi đâu?* Đuôi **-ever** mang nghĩa 'bất cứ': wherever = bất cứ nơi nào. Trong mệnh đề trạng ngữ, trật tự từ là **S + V** như câu kể: *where you are*, không phải *where are you*.","formula":"… where + S + V\nWherever + S + V, …","examples":[{"en":"Put the keys **where** you can find them easily.","vi":"Hãy để chìa khoá ở nơi dễ tìm thấy."},{"en":"Stay **where** you are.","vi":"Hãy ở yên đó."},{"en":"I'll go **wherever** you go.","vi":"Anh đi đâu tôi sẽ theo đó."},{"en":"**Wherever** we went, people greeted us warmly.","vi":"Đi đến đâu chúng tôi cũng được mọi người chào đón nồng nhiệt."},{"en":"**Everywhere** we went, people greeted us warmly.","vi":"Đi đến đâu chúng tôi cũng được chào đón nồng nhiệt (lối nói thân mật)."}],"mistake":{"wrong":"Stay where are you.","right":"Stay where you are.","why":"Mệnh đề trạng ngữ giữ trật tự câu kể S + V, không đảo như câu hỏi."},"tip":"**where** = chỗ đó; **wher-ever** = chỗ nào cũng vậy.","src":"tr. 346–347","check":{"type":"fill","q":"The singer is followed by fans ___ she goes. (bất cứ nơi đâu)","answer":["wherever","everywhere"],"explain":"**wherever** = bất cứ nơi đâu cô ấy đi. *everywhere* cũng được trong lối nói thân mật.","src":"tr. 347"}},{"title":"Thì trong mệnh đề thời gian","icon":"⏰","rule":"Nói về **tương lai**: mệnh đề thời gian dùng **thì hiện tại**, mệnh đề chính dùng **will** hoặc **câu mệnh lệnh**. Không dùng *will* sau when, until, as soon as, before…","explain":"Liên từ thời gian gồm: *when, whenever, while, as, since, before, after, as soon as, once, as long as, until/till, by the time*. Mệnh đề chính đã báo 'tương lai' rồi, nên mệnh đề thời gian chỉ nêu mốc bằng thì hiện tại (kể cả hiện tại hoàn thành: *as soon as I have finished*). Hai trường hợp khác:\n• **Sự thật hiển nhiên, thói quen**: cả hai mệnh đề dùng **hiện tại**.\n• **Việc đã qua**: cả hai mệnh đề dùng **thì quá khứ** (quá khứ đơn, tiếp diễn hay hoàn thành tuỳ ngữ cảnh).","formula":"will + V / mệnh lệnh + when/until/as soon as + S + V (hiện tại)","diagram":{"type":"flow","title":"Chia thì trong mệnh đề thời gian","start":{"q":"Sự việc xảy ra khi nào?","branches":[{"label":"Tương lai","to":{"result":"when… + hiện tại; chính: will / mệnh lệnh","icon":"🔮"}},{"label":"Sự thật, thói quen","to":{"result":"Hiện tại ở cả hai mệnh đề","icon":"🔁"}},{"label":"Quá khứ","to":{"result":"Quá khứ ở cả hai mệnh đề","icon":"📜"}}]}},"examples":[{"en":"I'll write to her when I **have** time.","vi":"Khi rảnh, tôi sẽ viết thư cho cô ấy."},{"en":"Wait here until she **comes** back.","vi":"Hãy đợi ở đây cho đến khi bà ấy quay lại."},{"en":"I'll phone you as soon as I **have finished**.","vi":"Ngay khi làm xong tôi sẽ gọi cho anh."},{"en":"When you **heat** ice, it **turns** to water.","vi":"Khi đun nóng, đá sẽ tan thành nước."},{"en":"It **was** midday by the time I **got** to the office.","vi":"Lúc tôi đến văn phòng thì đã giữa trưa."},{"en":"I'll write to her when I'll have time.","ok":false,"note":"không dùng will sau when"}],"mistake":{"wrong":"I'll phone you as soon as I'll finish.","right":"I'll phone you as soon as I finish.","why":"Mệnh đề thời gian nói về tương lai vẫn dùng thì hiện tại; will chỉ ở mệnh đề chính."},"tip":"Một câu thời gian chỉ có **một will**, và nó nằm ở mệnh đề chính.","src":"tr. 347–348","check":{"type":"fill","q":"Think carefully before you ___. (decide)","answer":["decide"],"explain":"Câu mệnh lệnh nói về tương lai → mệnh đề *before* dùng hiện tại: before you **decide**.","src":"tr. 347"}},{"title":"since, và rút gọn bằng V-ing / V3","icon":"📌","rule":"Với **since** (kể từ khi): mệnh đề chính dùng **hiện tại hoàn thành** (hoặc hoàn thành tiếp diễn), mệnh đề since dùng **quá khứ đơn**.","explain":"*since* đóng một cái mốc trong quá khứ; việc ở mệnh đề chính kéo dài từ mốc đó đến bây giờ, nên dùng *have/has + V3* (hoặc *have/has been V-ing*). Còn mệnh đề since chỉ là cái mốc đã xong → quá khứ đơn.\n**Lưu ý (sách)**: có thể rút gọn mệnh đề thời gian: dùng **danh động từ V-ing** sau *after, before, since*; dùng **phân từ** (V-ing hoặc V3) sau *once, until, when, whenever, while*.","formula":"S + have/has V3 (been V-ing) + since + S + V2\nbefore/after/since + V-ing\nwhen/while/until… + V-ing / V3","examples":[{"en":"I **haven't played** rugby since I **left** university.","vi":"Từ khi rời đại học, tôi không chơi bóng bầu dục nữa."},{"en":"My daughter **has been learning** the piano since she **was** five.","vi":"Con gái tôi học piano từ năm lên 5."},{"en":"Think carefully before **deciding**.","vi":"Hãy suy nghĩ thật kỹ trước khi quyết định."},{"en":"Don't forget to signal when **turning** right.","vi":"Đừng quên bật đèn xi nhan khi rẽ phải."},{"en":"Please wait until **told** to proceed.","vi":"Hãy đợi cho đến khi được bảo đi tiếp."},{"en":"I didn't play rugby since I left university.","ok":false,"note":"mệnh đề chính phải là hiện tại hoàn thành"}],"mistake":{"wrong":"She has worked here since she has graduated.","right":"She has worked here since she graduated.","why":"Mệnh đề since là cái mốc trong quá khứ → quá khứ đơn."},"tip":"**since** = đóng đinh vào quá khứ (**V2**), sợi dây kéo dài tới hôm nay (**have V3**).","src":"tr. 348","check":{"type":"mcq","q":"We ___ friends since we were at school.","options":["have been","are","were"],"answer":0,"explain":"Tình bạn kéo dài từ thời đi học đến nay → hiện tại hoàn thành **have been**; mệnh đề since dùng quá khứ *were*.","src":"tr. 348"}}],"practice":[{"type":"mcq","q":"I'll follow you ___ you go. (bất cứ nơi đâu)","options":["wherever","whatever","however"],"answer":0,"explain":"**wherever** = bất cứ nơi đâu. *whatever* = bất cứ cái gì, *however* = dù thế nào, không chỉ nơi chốn.","src":"tr. 346"},{"type":"mcq","q":"Chọn câu đúng:","options":["Wait here until she comes back.","Wait here until she will come back.","Wait here until she came back."],"answer":0,"explain":"Câu mệnh lệnh nói về tương lai → mệnh đề *until* dùng hiện tại **comes**. Không dùng will; *came* là quá khứ, sai thời gian.","src":"tr. 347"},{"type":"classify","q":"Mỗi câu nói về thời điểm nào? Xếp vào đúng nhóm:","buckets":["Tương lai: hiện tại + will","Sự thật/thói quen: hiện tại cả hai","Quá khứ: quá khứ cả hai"],"items":[{"text":"I'll call you when I arrive.","bucket":0},{"text":"We'll start as soon as everyone is here.","bucket":0},{"text":"When you heat water to 100°C, it boils.","bucket":1},{"text":"He always reads the news while he is waiting for the bus.","bucket":1},{"text":"I saw Peter as I was getting off the bus.","bucket":2},{"text":"As soon as the gates were opened, the crowds rushed in.","bucket":2}],"explain":"Tương lai: mệnh đề thời gian ở hiện tại, mệnh đề chính có will. Sự thật/thói quen: hiện tại cả hai. Việc đã qua: quá khứ cả hai.","src":"tr. 347–348"},{"type":"fill","q":"I'll phone you as soon as I ___ my work. (finish)","answer":["finish","have finished","'ve finished"],"explain":"Tương lai → mệnh đề *as soon as* dùng hiện tại: **finish** hoặc hiện tại hoàn thành **have finished**. Không dùng *will finish*.","src":"tr. 347"},{"type":"fill","q":"When you heat ice, it ___ to water. (turn)","answer":["turns"],"explain":"Sự thật hiển nhiên → hiện tại ở cả hai mệnh đề: it **turns**. Sách ghi rõ: NOT *it'll turn*.","src":"tr. 348"},{"type":"fill","q":"It was midday by the time I ___ to the office. (get)","answer":["got"],"explain":"Việc đã qua → cả hai mệnh đề dùng quá khứ: by the time I **got**.","src":"tr. 348"},{"type":"fill","q":"My son has been learning English since he ___ seven. (be)","answer":["was"],"explain":"Mệnh đề *since* là mốc trong quá khứ → quá khứ đơn **was**.","src":"tr. 348"},{"type":"mcq","q":"I ___ him since he left school.","options":["haven't seen","didn't see","don't see"],"answer":0,"explain":"Có mốc *since he left school* → mệnh đề chính dùng **hiện tại hoàn thành**: haven't seen.","src":"tr. 348"},{"type":"fix","wrong":"I'll tell him the news when he will arrive.","answer":["I'll tell him the news when he arrives.","I will tell him the news when he arrives."],"explain":"Mệnh đề *when* nói về tương lai dùng thì hiện tại: when he **arrives**.","src":"tr. 347"},{"type":"fix","wrong":"I have known her since we have been children.","answer":["I have known her since we were children.","I've known her since we were children."],"explain":"Mệnh đề *since* dùng quá khứ đơn: since we **were** children.","src":"tr. 348"},{"type":"mcq","q":"Think carefully before ___.","options":["deciding","decide","to decide"],"answer":0,"explain":"Sau *before, after, since* có thể dùng **danh động từ V-ing**: before **deciding** (= before you decide).","src":"tr. 348"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["When","I","get","home,","I'll","phone","you."],"explain":"Mệnh đề thời gian đứng trước + dấu phẩy, rồi đến mệnh đề chính có *will*: When I get home, I'll phone you.","src":"tr. 346"}],"flashcards":[{"front":"Mệnh đề trạng ngữ đứng trước mệnh đề chính thì cần gì?","back":"**Dấu phẩy**: When I get home**,** I'll phone you."},{"front":"where và wherever khác nhau thế nào?","back":"**where** = ở nơi đó: Stay where you are. **wherever** = bất cứ nơi đâu: I'll go wherever you go."},{"front":"Nói về tương lai: mệnh đề when / until / as soon as chia thì gì?","back":"Thì **hiện tại**: I'll write to her when I **have** time. (không dùng will)"},{"front":"Sự thật, thói quen: mệnh đề thời gian chia thì gì?","back":"**Hiện tại ở cả hai**: When you heat ice, it turns to water."},{"front":"since: mệnh đề chính và mệnh đề since chia thì gì?","back":"Chính: **hiện tại hoàn thành**; since: **quá khứ đơn**. I haven't played rugby since I left university."},{"front":"Rút gọn mệnh đề thời gian: sau before / after / since dùng gì?","back":"**V-ing**: Think carefully before **deciding**."}]},{"id":"03b","title":"Liên từ thời gian: while, as, when, as soon as, no sooner","minutes":25,"goal":"Chọn đúng when / while / as / just as / as soon as theo quan hệ thời gian giữa hai việc, và viết được câu Hardly… when, No sooner… than có đảo ngữ.","pretest":[{"type":"mcq","q":"Somebody broke into the house ___ they were sleeping.","options":["while","as soon as","until"],"answer":0,"explain":"Việc dài đang diễn ra (đang ngủ) thì việc khác xen vào → **while** + thì tiếp diễn.","src":"tr. 349"},{"type":"mcq","q":"___ I get older, I get happier.","options":["As","While","Until"],"answer":0,"explain":"Hai việc **cùng thay đổi dần** (càng… càng…) → **As**. Sách ghi rõ: NOT *While I get older*.","src":"tr. 349"},{"type":"mcq","q":"I had no sooner sat down ___ the phone rang.","options":["than","when","that"],"answer":0,"explain":"**no sooner** luôn đi cặp với **than**.","src":"tr. 350"}],"hook":{"icon":"⏱️","text":"Tiếng Việt chỉ cần một chữ **'khi'** cho đủ mọi tình huống. Tiếng Anh tách ra nhiều 'khi' khác nhau: **đang… thì** (while), **càng… càng** (as), **hồi còn…** (when), **vừa đúng lúc** (just as), **vừa… là** (as soon as, no sooner… than). Chọn đúng từ là chọn đúng mối quan hệ giữa hai việc."},"diagram":{"type":"table","title":"Chọn liên từ thời gian","head":["Hai việc liên hệ thế nào?","Dùng","Ví dụ"],"rows":[["Việc dài bị việc khác xen vào","when / while / as + tiếp diễn","As we were doing the test, the alarm went off."],["Hai việc song song","while","While Sarah was cooking, Jim was tidying."],["Cùng thay đổi dần","as","As I get older, I get happier."],["Nối tiếp; tuổi, giai đoạn đời","when","When I was a child, we lived in London."],["Hai việc ngắn cùng lúc","just as / just when","Just when I stepped out, the phone rang."],["Việc sau đến ngay sau việc trước","as soon as · hardly… when · no sooner… than","As soon as I got home, it rained."]]},"chunks":[{"title":"Việc dài bị xen ngang","icon":"🎬","rule":"Dùng **when, while, as** + **thì tiếp diễn** cho việc **đang kéo dài** thì một việc khác xảy đến.","explain":"Cả ba từ *when, while, as* đều dùng được cho việc kéo dài hơn (đang diễn ra) bị một việc ngắn xen vào. Việc kéo dài dùng **thì tiếp diễn**, việc xen vào dùng thì đơn. Nhưng *as* và *while* cũng có thể đi với **thì đơn**, nhất là với các động từ chỉ trạng thái như **sit, lie, grow**: *As I sat reading the paper…*","formula":"when / while / as + S + was/were V-ing, S + V2","examples":[{"en":"Somebody broke into the house **while** they **were sleeping**.","vi":"Có kẻ đã đột nhập vào nhà khi họ đang ngủ."},{"en":"**As** we **were doing** the maths test, the fire alarm went off.","vi":"Trong khi chúng tôi đang làm bài kiểm tra toán thì chuông báo cháy reng lên."},{"en":"The telephone always rings **when** you **are having** a bath.","vi":"Hễ anh đang tắm là điện thoại lại reng."},{"en":"**As** I **sat** reading the paper, the door burst open.","vi":"Lúc tôi ngồi đọc báo thì cánh cửa bật tung ra."},{"en":"The phone rang while I have a bath.","ok":false,"note":"việc đang diễn ra trong quá khứ → was having"}],"mistake":{"wrong":"The phone rang while I have a bath.","right":"The phone rang while I was having a bath.","why":"Việc kéo dài trong quá khứ dùng quá khứ tiếp diễn; việc xen vào dùng quá khứ đơn."},"tip":"Việc dài = 'đang' → **V-ing**; việc ngắn chen vào → **thì đơn**.","src":"tr. 348–349","check":{"type":"mcq","q":"The fire alarm went off as we ___ lunch.","options":["were having","are having","have"],"answer":0,"explain":"Việc đang kéo dài trong quá khứ thì chuông kêu → quá khứ tiếp diễn **were having**.","src":"tr. 349"}},{"title":"while, as, when: mỗi từ một việc","icon":"🔀","rule":"**while**: hai việc **song song**; **as**: hai việc **cùng thay đổi dần**; **when**: việc **nối tiếp** nhau, hoặc nói về **tuổi, giai đoạn trong đời**.","explain":"Sách nêu rõ từng trường hợp và cả câu sai:\n• Hai việc cùng diễn ra: **while** (thì tiếp diễn hoặc thì đơn). NOT *As/When Sarah was cooking, Jim was tidying*.\n• Hai việc cùng phát triển, thay đổi: **as**, thì đơn. NOT *While I get older*.\n• Hai việc kế tiếp nhau: **when**.\n• Tuổi, khoảng thời gian trong đời: **when**. NOT *while I'm thirty*, NOT *As/While I was a child*.","diagram":{"type":"table","title":"while · as · when","head":["Từ","Dùng khi","Ví dụ"],"rows":[["while","Hai việc song song","John cooked while I watched TV"],["as","Cùng thay đổi dần","As I get older, I get happier"],["when","Việc nối tiếp nhau","When the meal was finished, …"],["when","Tuổi, giai đoạn đời","When I was a child, …"]]},"examples":[{"en":"**While** Sarah was cooking, Jim was tidying the room.","vi":"Trong khi Sarah nấu ăn thì Jim dọn dẹp phòng."},{"en":"John cooked supper **while** I watched TV.","vi":"John nấu bữa tối còn tôi thì xem tivi."},{"en":"**As** I get older, I get happier.","vi":"Càng về già tôi càng thấy hạnh phúc."},{"en":"**When** the meal was finished, Rachel washed up and made coffee.","vi":"Khi ăn xong, Rachel dọn rửa rồi pha cà phê."},{"en":"**When** I was a child, we lived in London.","vi":"Khi tôi còn nhỏ, chúng tôi sống ở London."},{"en":"While I was a child, we lived in London.","ok":false,"note":"giai đoạn đời → when"}],"mistake":{"wrong":"I'll be a millionaire while I'm thirty.","right":"I'll be a millionaire when I'm thirty.","why":"Nói về tuổi hoặc giai đoạn trong đời luôn dùng when."},"tip":"**while** = song song · **as** = càng… càng… · **when** = rồi thì / hồi còn…","src":"tr. 349","check":{"type":"mcq","q":"___ I was ten, my family moved to Da Nang.","options":["When","While","As"],"answer":0,"explain":"Nói về tuổi → **When**. Sách ghi rõ không dùng *As/While* trong trường hợp này.","src":"tr. 349"}},{"title":"just as và as soon as","icon":"⚡","rule":"**just as / just when**: hai việc **ngắn** xảy ra **cùng lúc**; **as soon as**: việc này xảy ra **ngay sau** việc kia.","explain":"*just as / just when* giống 'vừa đúng lúc… thì…'. *as soon as* giống 'ngay khi, vừa… là…'. Vì *as soon as* là liên từ thời gian, khi nói về tương lai nó cũng theo quy tắc của bài trước: mệnh đề *as soon as* dùng thì hiện tại.","formula":"Just as / Just when + S + V2, S + V2\nAs soon as + S + V, S + V","examples":[{"en":"**Just when** I stepped out, the phone rang.","vi":"Tôi vừa bước ra khỏi phòng thì chuông điện thoại reng."},{"en":"**As soon as** we got out of the restaurant, it started raining.","vi":"Chúng tôi vừa ra khỏi nhà hàng thì trời đổ mưa."},{"en":"I'll come over to your place **as soon as** I can.","vi":"Tôi sẽ ghé qua chỗ anh ngay khi có thể."},{"en":"As soon as I will arrive, I'll call you.","ok":false,"note":"tương lai → as soon as I arrive"}],"mistake":{"wrong":"As soon as I will arrive, I'll call you.","right":"As soon as I arrive, I'll call you.","why":"as soon as là liên từ thời gian: nói về tương lai vẫn dùng thì hiện tại."},"tip":"**just as** = vừa **đúng lúc**; **as soon as** = vừa… **là**…","src":"tr. 349–350","check":{"type":"fill","q":"___ soon as the film ended, everyone stood up.","answer":["As"],"explain":"**As soon as** = ngay khi: phim vừa hết là mọi người đứng dậy.","src":"tr. 350"}},{"title":"Hardly… when, No sooner… than","icon":"🔁","rule":"**hardly / scarcely … when (before)** và **no sooner … than** nghĩa như *as soon as* (vừa mới… thì…). Đặt **hardly, scarcely, no sooner** ở **đầu câu** thì phải **đảo ngữ**.","explain":"Đây là các cặp cố định: *hardly/scarcely* đi với **when** (hoặc **before**), còn *no sooner* đi với **than** (vì *sooner* là so sánh hơn). Muốn nhấn mạnh, đưa *hardly / scarcely / no sooner* lên đầu câu rồi **đảo ngữ**: trợ động từ (*had, did*) đứng trước chủ ngữ, giống câu hỏi.","formula":"S + had hardly/scarcely + V3 + when/before + S + V2\nHardly/Scarcely + had + S + V3 + when + S + V2\nS + no sooner + V2 + than + S + V2\nNo sooner + did + S + V + than + S + V2","examples":[{"en":"I had **hardly** closed my eyes **when** the phone rang.","vi":"Tôi vừa chợp mắt thì chuông điện thoại reng."},{"en":"**Hardly had I** closed my eyes when the phone rang.","vi":"Tôi vừa mới chợp mắt thì chuông điện thoại reng (nhấn mạnh)."},{"en":"We **no sooner** sat down in the train **than** I felt sick.","vi":"Chúng tôi vừa ổn định chỗ ngồi trên tàu thì tôi thấy buồn nôn."},{"en":"**No sooner did we** sit down in the train than I felt sick.","vi":"Chúng tôi vừa ngồi xuống trên tàu thì tôi thấy buồn nôn (nhấn mạnh)."},{"en":"Hardly I had closed my eyes when the phone rang.","ok":false,"note":"Hardly đầu câu → đảo ngữ: Hardly had I"}],"mistake":{"wrong":"No sooner did we sit down when I felt sick.","right":"No sooner did we sit down than I felt sick.","why":"no sooner đi với than, không đi với when."},"tip":"No soon**er** → **than** (như so sánh hơn); Hardly / Scarcely → **when**.","src":"tr. 350","check":{"type":"mcq","q":"Scarcely had she left the house ___ it started to rain.","options":["when","than","that"],"answer":0,"explain":"**scarcely** đi cặp với **when** (hoặc before). *than* chỉ đi với *no sooner*.","src":"tr. 350"}}],"practice":[{"type":"mcq","q":"Dad was washing the car ___ Mum was cutting the grass.","options":["while","as soon as","just when"],"answer":0,"explain":"Hai việc kéo dài **song song** → **while**. *as soon as* là 'ngay sau khi', *just when* cho hai việc ngắn.","src":"tr. 349"},{"type":"mcq","q":"___ prices go up, people buy less.","options":["As","While","Until"],"answer":0,"explain":"Hai việc **cùng thay đổi dần** → **As**. Sách không dùng *while* cho nghĩa này.","src":"tr. 349"},{"type":"mcq","q":"She learned to swim ___ she was six.","options":["when","while","as"],"answer":0,"explain":"Nói về tuổi → **when**. Sách ghi: NOT *As/While I was a child*.","src":"tr. 349"},{"type":"mcq","q":"I had hardly closed the door ___ someone knocked.","options":["when","than","then"],"answer":0,"explain":"**hardly** đi cặp với **when** (hoặc before).","src":"tr. 350"},{"type":"fill","q":"No sooner did he sit down ___ the phone rang.","answer":["than"],"explain":"**no sooner** đi cặp với **than**.","src":"tr. 350"},{"type":"fill","q":"___ as I opened the door, the lights went out. (vừa đúng lúc)","answer":["Just"],"explain":"**Just as** = vừa đúng lúc: hai việc ngắn xảy ra cùng lúc.","src":"tr. 349"},{"type":"fill","q":"Call me as ___ as you arrive.","answer":["soon"],"explain":"**as soon as** = ngay khi.","src":"tr. 350"},{"type":"classify","q":"Chọn while, as hay when cho mỗi câu:","buckets":["while","as","when"],"items":[{"text":"Tom washed up ___ I dried the plates.","bucket":0},{"text":"The kids played ___ their parents talked.","bucket":0},{"text":"___ the day went on, it got colder.","bucket":1},{"text":"___ she grew older, she became calmer.","bucket":1},{"text":"___ I was ten, we moved to Hue.","bucket":2},{"text":"I'll retire ___ I'm sixty.","bucket":2}],"explain":"Song song → **while**. Cùng thay đổi dần → **as**. Tuổi, giai đoạn đời → **when**.","src":"tr. 349"},{"type":"fix","wrong":"Hardly I had arrived when it began to rain.","answer":["Hardly had I arrived when it began to rain."],"explain":"*Hardly* đứng đầu câu → đảo ngữ: **Hardly had I** arrived…","src":"tr. 350"},{"type":"fix","wrong":"While I was a child, I lived in the country.","answer":["When I was a child, I lived in the country."],"explain":"Giai đoạn trong đời → **When** I was a child.","src":"tr. 349"},{"type":"mcq","q":"The phone rang ___ I was having a shower.","options":["while","as soon as","no sooner"],"answer":0,"explain":"Việc dài (đang tắm) bị việc ngắn (điện thoại reng) xen vào → **while** + tiếp diễn.","src":"tr. 349"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["No","sooner","did","we","arrive","than","it","started","to","rain."],"explain":"*No sooner* đầu câu → đảo ngữ **did we arrive**, rồi **than** + mệnh đề sau.","src":"tr. 350"}],"flashcards":[{"front":"while dùng khi nào?","back":"Hai việc **song song**: John cooked supper **while** I watched TV."},{"front":"as dùng khi nào (nghĩa thời gian)?","back":"Hai việc **cùng thay đổi dần**: **As** I get older, I get happier. (không dùng while)"},{"front":"Nói về tuổi / giai đoạn đời dùng while hay when?","back":"**when**: When I was a child… · I'll be a millionaire **when** I'm thirty."},{"front":"just as / just when nghĩa là gì?","back":"Vừa đúng lúc (hai việc ngắn cùng lúc): **Just when** I stepped out, the phone rang."},{"front":"hardly / scarcely đi với từ nào? no sooner đi với từ nào?","back":"hardly/scarcely… **when** (before) · no sooner… **than**"},{"front":"Hardly / No sooner đứng đầu câu thì sao?","back":"**Đảo ngữ**: **Hardly had I** closed my eyes when… · **No sooner did we** sit down than…"}]},{"id":"03c","title":"Nguyên nhân: because, since, as và because of","minutes":25,"goal":"Nêu lý do bằng because / since / as / for (+ mệnh đề) và because of / due to / owing to (+ danh từ, V-ing); bỏ thói quen 'Vì… nên…' của tiếng Việt.","pretest":[{"type":"mcq","q":"We didn't go out ___ the rain.","options":["because of","because","since"],"answer":0,"explain":"Sau chỗ trống là **danh từ** (the rain) → **because of**. *because, since* phải đi với mệnh đề S + V.","src":"tr. 351"},{"type":"mcq","q":"She stayed at home ___ she was sick.","options":["because","because of","due to"],"answer":0,"explain":"Sau chỗ trống là **mệnh đề** (she was sick) → **because**.","src":"tr. 352"}],"hook":{"icon":"🤔","text":"Người Việt quen nói **'Vì** trời lạnh **nên** tôi bật lò sưởi'. Tiếng Anh chỉ cần **một** từ nối: *Because it was cold, I turned the heating on.* Thêm *so* vào là thừa. Bài này còn dạy bạn nhìn **thứ đứng sau**: mệnh đề thì dùng *because*, danh từ thì dùng *because of*."},"diagram":{"type":"flow","title":"because hay because of?","start":{"q":"Ngay sau chỗ trống là gì?","branches":[{"label":"Mệnh đề (S + V)","to":{"result":"because / since / as / for…","icon":"🧩"}},{"label":"Danh từ, đại từ, V-ing","to":{"result":"because of / due to / owing to","icon":"📦"}},{"label":"the fact that + S + V","to":{"result":"because of / due to the fact that","icon":"📝"}}]}},"chunks":[{"title":"because, since, as","icon":"💡","rule":"**because, since, as + S + V** nêu nguyên nhân. Đã có một trong ba từ này thì **không dùng so** ở mệnh đề kia.","explain":"Sách phân biệt sắc thái:\n• **since, as, seeing that**: lý do người nghe/đọc **đã biết** hoặc không quan trọng; điều nhấn mạnh nằm ở mệnh đề chính.\n• **because**: **nhấn mạnh lý do**, đưa thông tin mới mà người nghe chưa biết.\nTiếng Việt hay nói 'Vì… nên…', nhưng tiếng Anh chỉ dùng một từ nối: hoặc *because/since/as*, hoặc *so*, không dùng cả hai.","formula":"because / since / as + S + V","examples":[{"en":"He came ten minutes late **because** he missed the bus.","vi":"Anh ta đến trễ mười phút vì bị lỡ xe buýt."},{"en":"**Since** it was too dark to go on, we camped there.","vi":"Chúng tôi cắm trại ở đó vì trời quá tối không thể đi tiếp."},{"en":"**As** you weren't there, I left a message.","vi":"Vì anh không có ở đó nên tôi đã để lại lời nhắn."},{"en":"**Because** they live near us, we see them quite often.","vi":"Vì họ sống gần chúng tôi nên chúng tôi thường gặp họ."},{"en":"Since you are unable to answer, so we should ask someone else.","ok":false,"note":"đã có since thì bỏ so"}],"mistake":{"wrong":"Because it was cold, so I turned the heating on.","right":"Because it was cold, I turned the heating on.","why":"Không dùng so trong câu bắt đầu bằng because, since, as."},"tip":"'Vì… nên…' = **một** từ nối thôi: *Because…,* … hoặc …*, so* …","src":"tr. 350–351","check":{"type":"mcq","q":"Since you are unable to answer, ___ should ask someone else.","options":["we","so we","but we"],"answer":0,"explain":"Câu đã bắt đầu bằng *Since* → mệnh đề chính không có *so*: **we** should ask…","src":"tr. 351"}},{"title":"for, in that, seeing that, now that","icon":"📜","rule":"**for, in that, inasmuch as** dẫn lý do trong văn **trang trọng / văn chương**; **seeing (as/that)** hay dùng trong **văn nói**; **now (that)** = vì giờ đây. Trước **for** phải có **dấu phẩy**.","explain":"Mệnh đề **for** không giải thích *tại sao* hành động xảy ra mà chỉ bổ sung thông tin về nó, nên nó đứng **sau** mệnh đề chính và sau dấu phẩy. Còn mệnh đề *because/since/as* đứng trước hay sau mệnh đề chính đều được; đứng trước thì có dấu phẩy.","formula":"Mệnh đề chính, for + S + V\nSeeing (as/that) / Now (that) + S + V, …","examples":[{"en":"The days are short, **for** it is now December.","vi":"Vì giờ là tháng Mười Hai nên ngày thật ngắn."},{"en":"The film is unusual **in that** it features only four actors.","vi":"Bộ phim lạ vì chỉ có 4 diễn viên."},{"en":"**Seeing as** it's your money, I suppose you can buy whatever you want.","vi":"Vì đó là tiền của bạn nên tôi cho là bạn có thể mua bất cứ thứ gì bạn thích."},{"en":"**Now (that)** the weather is nice, the children play outside all day.","vi":"Vì thời tiết tốt nên bọn trẻ chơi ngoài đường suốt cả ngày."},{"en":"For it is now December, the days are short.","ok":false,"note":"mệnh đề for đứng sau mệnh đề chính"}],"mistake":{"wrong":"For it is now December, the days are short.","right":"The days are short, for it is now December.","why":"for chỉ bổ sung thông tin: đặt sau mệnh đề chính, có dấu phẩy trước for."},"tip":"**for** = 'bởi vì' kiểu văn chương: luôn ở **nửa sau** câu, sau **dấu phẩy**.","src":"tr. 350–351","check":{"type":"mcq","q":"I cannot tell whether she is old or young, ___ I have never seen her.","options":["for","so","but"],"answer":0,"explain":"Nửa sau là **lý do** (chưa gặp bao giờ) → **for**, sau dấu phẩy. *so* là kết quả, *but* là trái ngược.","src":"tr. 350"}},{"title":"because of, due to, owing to","icon":"📦","rule":"**because of, due to, owing to** là **giới từ**: theo sau là **danh từ, đại từ hoặc cụm V-ing**, không phải mệnh đề. Muốn giữ mệnh đề: **because of / due to the fact that + S + V**.","explain":"*because* là liên từ nên dẫn mệnh đề; *because of* là giới từ nên dẫn danh từ. Cách nói *the fact that + mệnh đề* thường dùng trong văn trang trọng, nhất là văn viết. Khi đổi mệnh đề sang cụm từ, nếu **hai mệnh đề cùng chủ ngữ** thì dùng **cụm danh động từ** (V-ing): *because she was sick* → *because of being sick*.","formula":"because of / due to / owing to + N / đại từ / V-ing\nbecause of / due to the fact that + S + V","examples":[{"en":"We didn't go out **due to** the cold weather.","vi":"Vì trời lạnh nên chúng tôi không đi chơi."},{"en":"We spent three hours waiting in the rain **because of** you!","vi":"Vì anh mà chúng tôi phải đội mưa đợi 3 tiếng đồng hồ đấy!"},{"en":"**Owing to** his carelessness we had an accident.","vi":"Do sự bất cẩn của anh ta mà chúng tôi bị tai nạn."},{"en":"She stayed at home **because of being** sick.","vi":"Cô ấy ở nhà vì bị ốm."},{"en":"The applicant was rejected **due to the fact that** he was not properly qualified.","vi":"Ứng viên đó bị loại vì không đủ tiêu chuẩn."},{"en":"We didn't go out because of it was cold.","ok":false,"note":"because of + danh từ, không + mệnh đề"}],"mistake":{"wrong":"He was late because of the traffic was heavy.","right":"He was late because the traffic was heavy.","why":"Sau because of không đặt mệnh đề S + V; có mệnh đề thì dùng because (hoặc because of the heavy traffic)."},"tip":"Có **of / to** ở đuôi (because **of**, due **to**, owing **to**) → theo sau là **danh từ**.","src":"tr. 351–352","check":{"type":"fill","q":"She stayed at home because of ___ sick. (be)","answer":["being"],"explain":"Cùng chủ ngữ → đổi sang cụm danh động từ: because of **being** sick.","src":"tr. 352"}}],"practice":[{"type":"mcq","q":"He was late ___ the heavy traffic.","options":["because of","because","as"],"answer":0,"explain":"Sau chỗ trống là cụm danh từ *the heavy traffic* → **because of**.","src":"tr. 351"},{"type":"mcq","q":"___ it was raining, we stayed inside.","options":["As","Because of","Due to"],"answer":0,"explain":"Sau chỗ trống là mệnh đề *it was raining* → liên từ **As**. *Because of, Due to* phải đi với danh từ.","src":"tr. 350"},{"type":"classify","q":"Mỗi từ nối đi với gì?","buckets":["+ mệnh đề (S + V)","+ danh từ / V-ing"],"items":[{"text":"because","bucket":0},{"text":"since","bucket":0},{"text":"as","bucket":0},{"text":"seeing that","bucket":0},{"text":"now that","bucket":0},{"text":"because of","bucket":1},{"text":"due to","bucket":1},{"text":"owing to","bucket":1}],"explain":"Liên từ *because, since, as, seeing that, now that* dẫn mệnh đề. Giới từ *because of, due to, owing to* dẫn danh từ, đại từ hoặc V-ing.","src":"tr. 350–351"},{"type":"fill","q":"The flight was delayed ___ to bad weather.","answer":["due","owing"],"explain":"**due to** hoặc **owing to** + danh từ (bad weather).","src":"tr. 351"},{"type":"fill","q":"He couldn't come because ___ his illness.","answer":["of"],"explain":"*his illness* là danh từ → because **of**.","src":"tr. 351"},{"type":"mcq","q":"Câu nào **nhấn mạnh lý do**, đưa thông tin mới cho người nghe?","options":["Because it was cold, I turned the heating on.","As it was cold, I turned the heating on."],"answer":0,"explain":"**because** nhấn mạnh lý do (thông tin mới). *as / since* dùng khi người nghe đã biết lý do, trọng tâm nằm ở mệnh đề chính.","src":"tr. 351"},{"type":"fix","wrong":"Because it was cold, so I turned the heating on.","answer":["Because it was cold, I turned the heating on.","It was cold, so I turned the heating on."],"explain":"Không dùng *so* trong câu bắt đầu bằng *because*. Giữ *Because…* và bỏ *so*, hoặc bỏ *Because* và giữ *so*.","src":"tr. 351"},{"type":"fix","wrong":"We stayed at home because of it was raining.","answer":["We stayed at home because it was raining.","We stayed at home as it was raining.","We stayed at home since it was raining.","We stayed at home because of the rain.","We stayed at home because of the fact that it was raining.","We stayed at home due to the fact that it was raining."],"explain":"*it was raining* là mệnh đề → dùng **because** (hoặc *because of the rain*, *because of the fact that…*).","src":"tr. 351–352"},{"type":"fill","q":"She left early because of ___ unwell. (feel)","answer":["feeling"],"explain":"Sau giới từ *because of* dùng **V-ing**: because of **feeling** unwell.","src":"tr. 351"},{"type":"mcq","q":"She felt nervous, ___ she had never flown before.","options":["for","so","despite"],"answer":0,"explain":"Nửa sau giải thích lý do, đứng sau dấu phẩy → **for** (văn trang trọng). *so* là kết quả; *despite* là giới từ chỉ tương phản.","src":"tr. 350–351"},{"type":"mcq","q":"___ that you've finished your exams, you can relax.","options":["Now","Because","Due"],"answer":0,"explain":"**Now that** = vì giờ đây: giờ thi xong rồi nên bạn có thể nghỉ ngơi.","src":"tr. 351"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","couldn't","sleep","because","of","the","noise."],"explain":"*because of* + cụm danh từ *the noise*.","src":"tr. 351"}],"flashcards":[{"front":"because / since / as đi với gì?","back":"**S + V**: He came late **because** he missed the bus."},{"front":"because và since/as khác nhau thế nào về sắc thái?","back":"**because** nhấn mạnh lý do (thông tin mới); **since/as** cho lý do người nghe đã biết."},{"front":"Câu bắt đầu bằng Because… có dùng so không?","back":"**Không**: Because it was cold, ~~so~~ I turned the heating on."},{"front":"Mệnh đề for (lý do) đứng ở đâu?","back":"**Sau** mệnh đề chính, sau **dấu phẩy**: The days are short, **for** it is now December."},{"front":"because of / due to / owing to đi với gì?","back":"**Danh từ, đại từ, V-ing**: due to the cold weather · because of being sick"},{"front":"Muốn dùng mệnh đề sau because of / due to?","back":"Thêm **the fact that**: due to the fact that he was not qualified."}]},{"id":"03d","title":"Kết quả: so… that, such… that, too… to, enough… to","minutes":25,"goal":"Chọn đúng so hay such trước tính từ / danh từ, dùng too… to và enough… to đúng vị trí, và tránh lỗi 'very… that', 'to drink it'.","pretest":[{"type":"mcq","q":"It was ___ dark that I couldn't see anything.","options":["so","such","very"],"answer":0,"explain":"Ngay sau chỗ trống là **tính từ** (dark) → **so** + adj + that. *very* không dùng thay *so*.","src":"tr. 352"},{"type":"mcq","q":"It was ___ a heavy piano that we couldn't move it.","options":["such","so","too"],"answer":0,"explain":"Sau chỗ trống là **a + tính từ + danh từ** → **such**.","src":"tr. 353"},{"type":"mcq","q":"He is ___ young to drive a car.","options":["too","so","enough"],"answer":0,"explain":"**too** + adj + to-V = quá… không thể…: quá trẻ để lái xe.","src":"tr. 354"}],"hook":{"icon":"⚖️","text":"Tiếng Việt có ba khuôn quen thuộc: **'quá… đến nỗi…'**, **'quá… không thể…'** và **'đủ… để…'**. Tiếng Anh có đúng ba bộ tương ứng: **so/such… that**, **too… to** và **enough… to**. Cái khó là chọn *so* hay *such*, và đặt *enough* trước hay sau. Mẹo: nhìn từ đứng **ngay sau** chỗ trống."},"diagram":{"type":"flow","title":"so hay such?","start":{"q":"Sau chỗ trống có danh từ không?","branches":[{"label":"Không: chỉ tính từ / trạng từ","to":{"result":"so: so dark that…","icon":"🌑"}},{"label":"Có danh từ","to":{"q":"Trước danh từ là gì?","branches":[{"label":"many / much / few / little","to":{"result":"so: so many people that…","icon":"👥"}},{"label":"(a/an) + tính từ / a lot of","to":{"result":"such: such a heavy piano that…","icon":"🎹"}},{"label":"tính từ + a/an (N số ít)","to":{"result":"so: so hot a day that…","icon":"☀️"}}]}}]}},"chunks":[{"title":"so … that","icon":"🌑","rule":"**so + tính từ/trạng từ + that + S + V** = quá… đến nỗi…; với danh từ: **so many/few** + N đếm được số nhiều, **so much/little** + N không đếm được.","explain":"*so* bổ nghĩa thẳng cho tính từ hoặc trạng từ. Có thêm một khuôn: **so + tính từ + a/an + danh từ số ít + that** (*so hot a day that…*).\n**Lưu ý (sách)**:\n• **that** có thể lược bỏ: *She was so angry she couldn't speak.*\n• **Không dùng very thay so**: *very* chỉ là 'rất', không nối được hậu quả.\n• Muốn nhấn mạnh, đặt **so** đầu câu rồi **đảo ngữ** động từ: *So terrible was the storm that…*","formula":"S + V + so + adj/adv + that + S + V\nso many/few + N số nhiều + that\nso much/little + N không đếm được + that\nS + V + so + adj + a/an + N số ít + that","examples":[{"en":"It was **so dark that** I couldn't see anything.","vi":"Trời tối đến nỗi tôi không thể nhìn thấy gì."},{"en":"He spoke **so fast that** nobody could understand him.","vi":"Anh ta nói nhanh đến nỗi không ai hiểu được."},{"en":"She had **so many children that** she couldn't remember their dates of birth.","vi":"Bà ta có nhiều con đến nỗi không nhớ được ngày sinh của chúng."},{"en":"It was **so hot a day that** we decided to stay indoors.","vi":"Trời đã nóng đến nỗi chúng tôi quyết định ở nhà."},{"en":"**So terrible was the storm** that whole roofs were ripped off.","vi":"Cơn bão khủng khiếp đến nỗi toàn bộ các mái nhà đều bị tốc."},{"en":"He was very weak that he could hardly stand up.","ok":false,"note":"very không thay được so"}],"mistake":{"wrong":"He was very weak that he could hardly stand up.","right":"He was so weak that he could hardly stand up.","why":"Cấu trúc kết quả cần so; very không dùng thay so."},"tip":"**very** chỉ là 'rất'; muốn có '**đến nỗi**' thì phải là **so**.","src":"tr. 352–353","check":{"type":"fill","q":"There were ___ few students that the class was cancelled.","answer":["so"],"explain":"**so few** + danh từ đếm được số nhiều + that.","src":"tr. 352"}},{"title":"such … that","icon":"🎹","rule":"**such + (a/an) + tính từ + danh từ + that** = quá… đến nỗi; **không dùng a/an** trước danh từ **số nhiều** hoặc **không đếm được**.","explain":"*such* ôm cả cụm danh từ, nên đứng trước *a/an*. Có thể dùng *such* trước danh từ **không có tính từ**: *She's such a baby that…*, *He showed such concern that…*\n**Lưu ý (sách)**: **so** đi với *many, much, few, little*; còn **such** đi với *a lot (of)*: *so many people* = *such a lot of people*.","formula":"S + V + such + (a/an) + adj + N + that + S + V","examples":[{"en":"It was **such a heavy piano that** we couldn't move it.","vi":"Chiếc dương cầm nặng đến nỗi chúng tôi không di chuyển được."},{"en":"They had **such fierce dogs that** no one dared to go near their house.","vi":"Họ có mấy con chó dữ đến nỗi không ai dám đến gần nhà họ."},{"en":"It was **such horrible weather that** we spent the whole day indoors.","vi":"Thời tiết khó chịu đến nỗi chúng tôi ở trong nhà suốt ngày."},{"en":"There were **such a lot of** people that some had to sit on the floor.","vi":"Có quá nhiều người đến nỗi một số người phải ngồi dưới đất."},{"en":"We saw such a beautiful stars that we were amazed.","ok":false,"note":"stars số nhiều → bỏ a"}],"mistake":{"wrong":"It was such a good milk that we couldn't stop drinking it.","right":"It was such good milk that we couldn't stop drinking it.","why":"milk không đếm được → such + tính từ + danh từ, không có a."},"tip":"**so** đứng cạnh **tính từ**; **such** ôm cả **cụm danh từ**.","src":"tr. 353–354","check":{"type":"mcq","q":"I love my neighbours. They're ___ friendly people.","options":["such","so","such a"],"answer":0,"explain":"*friendly people* là tính từ + danh từ **số nhiều** → **such**, không có *a*.","src":"tr. 354"}},{"title":"too … to","icon":"🚫","rule":"**too + tính từ/trạng từ + to-V** = quá… không thể…; **too much / too many + danh từ** = quá nhiều.","explain":"*Much, far, a lot, a little, a bit, rather* đứng trước **too** để bổ nghĩa cho nó: *far too cold, much too young*.\n**Lưu ý (sách)**:\n• Khi chủ ngữ của câu cũng là tân ngữ của động từ nguyên mẫu, **không lặp lại tân ngữ**: *The water is too salty to drink* (NOT *to drink it*).\n• Muốn nói rõ ai không làm được: **too … for + O + to-V**: *too salty for us to drink (it)*.\n• *too* thường không đứng trước *tính từ + danh từ* (NOT *too tall men*); chỉ trong lối nói hơi trang trọng mới có *too + adj + a/an + N*: *It's too cold a day for tennis.*","formula":"too + adj/adv + (for + O) + to-V\ntoo much + N không đếm được · too many + N số nhiều","examples":[{"en":"He is **too tired to work**.","vi":"Anh ấy quá mệt không làm việc được."},{"en":"We arrived **too late to have** dinner.","vi":"Chúng tôi đến quá trễ không ăn tối được."},{"en":"You've put **too much sugar** in my coffee.","vi":"Anh đã cho quá nhiều đường vào ly cà phê của tôi."},{"en":"It's **far too cold** to go out for a walk.","vi":"Trời lạnh quá không ra ngoài đi dạo được."},{"en":"The box was **too heavy for me to lift**.","vi":"Cái thùng nặng quá tôi không nhấc nổi."},{"en":"The water is too salty to drink it.","ok":false,"note":"không lặp tân ngữ it"}],"mistake":{"wrong":"The water is too salty to drink it.","right":"The water is too salty to drink.","why":"Chủ ngữ the water chính là thứ được uống, nên bỏ it."},"tip":"**too** mang ý **tiêu cực**: quá… nên **không** làm được việc phía sau.","src":"tr. 354–355","check":{"type":"mcq","q":"There are ___ people on the bus; there's nowhere to sit.","options":["too many","too much","too"],"answer":0,"explain":"*people* đếm được số nhiều → **too many**.","src":"tr. 354"}},{"title":"enough … to","icon":"✅","rule":"**tính từ/trạng từ + enough + to-V** (đủ… để…), nhưng **enough + danh từ + to-V**.","explain":"*enough* đứng **sau** tính từ/trạng từ (*old enough*) nhưng **trước** danh từ (*enough money*). Nếu nghĩa đã rõ, *enough* có thể đứng một mình: *if you haven't got enough*. Giống *too*, sau *enough… to-V* cũng **không lặp tân ngữ** (*small enough to put in your pocket*, NOT *to put it*), và có thể dùng **for + O**: *warm enough for the snow to melt*, *experienced enough for the job*.","formula":"adj/adv + enough + (for + O) + to-V\nenough + N + to-V","examples":[{"en":"Mary is **old enough to do** what she wants.","vi":"Mary đã đủ lớn để làm những gì cô ấy muốn."},{"en":"He didn't jump **high enough to win** a prize.","vi":"Anh ta nhảy chưa đủ cao để có thể đoạt giải."},{"en":"I have **enough strength to lift** that box.","vi":"Tôi đủ khoẻ để nhấc cái thùng đó."},{"en":"The radio is **small enough to put** in your pocket.","vi":"Chiếc radio này đủ nhỏ để bỏ túi."},{"en":"He wasn't **experienced enough for** the job.","vi":"Anh ấy không đủ kinh nghiệm để làm công việc đó."},{"en":"She isn't enough old to drive.","ok":false,"note":"tính từ + enough → old enough"}],"mistake":{"wrong":"She isn't enough old to drive.","right":"She isn't old enough to drive.","why":"enough đứng sau tính từ."},"tip":"Tính từ **+ enough** (old enough) · **enough +** danh từ (enough money).","src":"tr. 354–355","check":{"type":"fill","q":"This room is big ___ for ten people.","answer":["enough"],"explain":"Tính từ *big* + **enough** + for + danh từ.","src":"tr. 355"}}],"practice":[{"type":"mcq","q":"The film was ___ boring that I fell asleep.","options":["so","such","too"],"answer":0,"explain":"Sau chỗ trống là tính từ đứng một mình → **so**. *too* không đi với *that*.","src":"tr. 352"},{"type":"mcq","q":"It was ___ long journey that we were exhausted.","options":["such a","so","such"],"answer":0,"explain":"*long journey* là tính từ + danh từ đếm được số ít → **such a**.","src":"tr. 353"},{"type":"mcq","q":"She made ___ mistakes that she failed the test.","options":["so many","so much","too many"],"answer":0,"explain":"*mistakes* đếm được số nhiều → **so many**… that. *too many* không đi với *that*.","src":"tr. 352"},{"type":"classify","q":"so hay such?","buckets":["so","such"],"items":[{"text":"___ hot","bucket":0},{"text":"___ quickly","bucket":0},{"text":"___ much money","bucket":0},{"text":"___ few friends","bucket":0},{"text":"___ a hot day","bucket":1},{"text":"___ hot weather","bucket":1},{"text":"___ a lot of money","bucket":1},{"text":"___ kind people","bucket":1}],"explain":"**so** + tính từ/trạng từ, + many/much/few/little. **such** + (a/an) + tính từ + danh từ, + a lot of.","src":"tr. 352–354"},{"type":"fill","q":"The coffee is too hot ___ drink.","answer":["to"],"explain":"**too** + adj + **to-V**.","src":"tr. 354"},{"type":"fill","q":"You aren't old ___ to watch this film.","answer":["enough"],"explain":"Tính từ + **enough** + to-V.","src":"tr. 354"},{"type":"fill","q":"There are too ___ cars in the city centre.","answer":["many"],"explain":"*cars* đếm được số nhiều → too **many**.","src":"tr. 354"},{"type":"mcq","q":"The box is too heavy ___ me to carry.","options":["for","to","of"],"answer":0,"explain":"Nói rõ ai không làm được → **for + O** + to-V.","src":"tr. 355"},{"type":"fix","wrong":"He was very tired that he fell asleep at once.","answer":["He was so tired that he fell asleep at once.","He was so tired he fell asleep at once."],"explain":"Không dùng *very* thay *so* trong cấu trúc kết quả.","src":"tr. 353"},{"type":"fix","wrong":"This soup is too hot to eat it.","answer":["This soup is too hot to eat."],"explain":"Chủ ngữ *this soup* chính là thứ được ăn → bỏ tân ngữ *it*.","src":"tr. 355"},{"type":"fix","wrong":"We had such a nice weather that we went to the beach.","answer":["We had such nice weather that we went to the beach.","We had such nice weather we went to the beach."],"explain":"*weather* không đếm được → bỏ *a*: such nice weather.","src":"tr. 354"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["She","isn't","tall","enough","to","reach","the","shelf."],"explain":"Tính từ *tall* + **enough** + to-V.","src":"tr. 354"}],"flashcards":[{"front":"so + ? + that","back":"**Tính từ/trạng từ**: so dark that… · so fast that… (và so many/few/much/little + N)"},{"front":"such + ? + that","back":"**(a/an) + tính từ + danh từ**: such a heavy piano that… · such fierce dogs that…"},{"front":"so many people = such … people?","back":"**such a lot of** people (so đi với many/much; such đi với a lot of)"},{"front":"Có dùng very thay so trong 'quá… đến nỗi' không?","back":"**Không**: He was **so** weak that… (NOT very weak that)"},{"front":"The water is too salty to drink ___? (có thêm it không?)","back":"**Không thêm it**: too salty to drink. Muốn nêu người: too salty **for us** to drink (it)."},{"front":"enough đứng trước hay sau?","back":"**Sau** tính từ: old enough · **Trước** danh từ: enough money"},{"front":"Từ nào bổ nghĩa cho too?","back":"**much, far, a lot, a little, a bit, rather**: far too cold, much too young"}]},{"id":"03e","title":"Mục đích: so that, in order to, so as to","minutes":25,"goal":"Nói 'để…' bằng so that / in order that + modal đúng thì, hoặc to-V / in order to / so as to; nói 'để không…' đúng cách; phân biệt for + N, for + V-ing và for + O + to-V.","pretest":[{"type":"mcq","q":"He went to France ___ study French.","options":["to","for","so that"],"answer":0,"explain":"Cùng chủ ngữ, sau chỗ trống là động từ → **to**-V. *for* không đi với V nguyên mẫu; *so that* phải đi với mệnh đề.","src":"tr. 357"},{"type":"mcq","q":"She is hurrying ___ miss the bus.","options":["in order not to","not to","in order to not"],"answer":0,"explain":"Phủ định mục đích: **in order not to** + V. Sách ghi rõ không dùng *not to-V* một mình.","src":"tr. 357"}],"hook":{"icon":"🎯","text":"Chữ **'để'** của tiếng Việt rất dễ: 'để học', 'để không bị trễ', 'để mọi người nghe được'. Tiếng Anh tách thành hai kiểu: **cụm từ** (to-V, in order to, so as to) khi **cùng chủ ngữ**, và **mệnh đề** (so that, in order that + S + can/will…) khi cần nêu **chủ ngữ riêng**. Còn 'để không' thì phải nhét *not* vào đúng chỗ."},"diagram":{"type":"table","title":"Nói 'để…' thế nào?","head":["Sau 'để' là gì?","Dùng","Ví dụ"],"rows":[["Mệnh đề có chủ ngữ riêng","so that / in order that + S + can/will…","…so that we can see better"],["Chỉ cần động từ (cùng chủ ngữ)","to-V / in order to / so as to","She left early to catch the bus."],["'để không' + động từ","in order not to / so as not to","…so as not to wake the baby"],["Một danh từ","for + N","I went out for some bread."],["Việc người khác làm","for + O + to-V","…for Harry to get in"]]},"chunks":[{"title":"so that / in order that + modal","icon":"🧩","rule":"**so that / in order that + S + will/can/may + V** cho mục đích ở **hiện tại – tương lai**; **would/could/might** (đôi khi **should**) cho mục đích trong **quá khứ**.","explain":"Mục đích là điều sẽ đạt được **sau** hành động, nên mệnh đề mục đích thường có động từ khuyết thiếu (modal). Modal đi theo thì của mệnh đề chính: mệnh đề chính ở hiện tại/tương lai (hoặc mệnh lệnh) → *will, can, may*; mệnh đề chính ở quá khứ → *would, could, might*.","formula":"S + V + so that / in order that + S + will/can/may + V\nS + V2 + so that / in order that + S + would/could/might + V","examples":[{"en":"Put the milk in the refrigerator **so that** it **won't** spoil.","vi":"Hãy cho sữa vào tủ lạnh để sữa không bị hư."},{"en":"We send monthly reports **in order that** they **may** have full information.","vi":"Chúng tôi gửi báo cáo hằng tháng để họ có đầy đủ thông tin."},{"en":"We moved to London **so that** we **could** visit our parents more often.","vi":"Chúng tôi đã chuyển đến London để có thể thăm cha mẹ thường xuyên hơn."},{"en":"He wore glasses and a false beard **so that** nobody **would** recognize him.","vi":"Anh ta mang kính và râu giả để không ai nhận ra anh ta."},{"en":"He wore glasses so that nobody will recognize him.","ok":false,"note":"mệnh đề chính quá khứ → would"}],"mistake":{"wrong":"I'm learning English in order that I could find a better job.","right":"I'm learning English in order that I can find a better job.","why":"Mệnh đề chính ở hiện tại → mục đích dùng can/will/may."},"tip":"Mệnh đề chính lùi về quá khứ → modal lùi theo: **will→would, can→could, may→might**.","src":"tr. 356","check":{"type":"mcq","q":"She sang softly so that the baby ___ wake up.","options":["wouldn't","won't","doesn't"],"answer":0,"explain":"Mệnh đề chính ở quá khứ (*sang*) → **wouldn't**.","src":"tr. 356"}},{"title":"Bỏ that, thì hiện tại, và lest","icon":"✂️","rule":"Lối nói thân mật **bỏ được that sau so** (*so I can…*), nhưng **không bỏ that sau in order**. Đôi khi dùng **hiện tại đơn** sau *so that / in order that* để chỉ tương lai.","explain":"Ví dụ của sách: *Send the letter express so that she **gets / will get** it before Tuesday* — cả hai cách đều được.\n**lest** (= so that … not) cũng chỉ mục đích nhưng **rất trang trọng**, hầu như chỉ gặp trong văn chương và ngôn ngữ nghi lễ: *They kept watch all night lest robbers should come.*\nĐừng nhầm với **so… that** chỉ kết quả ở bài trước: *so + TÍNH TỪ + that* là 'quá… đến nỗi'; *so (that) + mệnh đề có can/will* là 'để'.","formula":"… so (that) + S + can/will + V\n… in order that + S + can/will + V (không bỏ that)","examples":[{"en":"I've come early **so** I can talk to you.","vi":"Tôi đến sớm để có thể nói chuyện với anh."},{"en":"Send the letter express **so that** she **gets** it before Tuesday.","vi":"Hãy gửi phát chuyển nhanh để cô ấy nhận được thư trước thứ Ba."},{"en":"I'm going to make an early start **so that** I **don't** get stuck in the traffic.","vi":"Tôi định đi sớm để khỏi bị kẹt xe."},{"en":"They kept watch all night **lest** robbers should come.","vi":"Họ canh gác suốt đêm để đề phòng bọn cướp bén mảng."},{"en":"I've come early in order I can talk to you.","ok":false,"note":"không bỏ that sau in order"}],"mistake":{"wrong":"I've come early in order I can talk to you.","right":"I've come early in order that I can talk to you.","why":"Chỉ bỏ được that sau so, không bỏ sau in order."},"tip":"**so** (that) bỏ được *that*; **in order that** thì *that* dính chặt.","src":"tr. 356","check":{"type":"mcq","q":"Chọn câu đúng:","options":["I left early in order that I could catch the train.","I left early in order I could catch the train."],"answer":0,"explain":"Không được bỏ *that* sau **in order**.","src":"tr. 356"}},{"title":"to-V, in order to, so as to","icon":"➡️","rule":"Cùng chủ ngữ thì dùng cụm **to-V / in order to / so as to + V**. Phủ định là **in order not to / so as not to + V**, không dùng *not to-V* một mình.","explain":"Cụm chỉ mục đích (phrase of purpose) gọn hơn mệnh đề: *He went to France to study French* (anh ấy đi, anh ấy học). Muốn nói 'để không', *not* phải chui vào giữa: *in order **not** to*, *so as **not** to*.\nNgoại lệ: trong câu nêu bật sự **tương phản** thì được dùng **not + to-V, but + to-V**: *I came to see you not to complain, but to apologize.*","formula":"S + V + to-V / in order to + V / so as to + V\nS + V + in order not to / so as not to + V","examples":[{"en":"He went to France **to study** French.","vi":"Anh ấy đi Pháp để học tiếng Pháp."},{"en":"The staff are working at weekends **in order to complete** the project in time.","vi":"Các nhân viên làm cả cuối tuần để hoàn thành dự án đúng hạn."},{"en":"He does morning exercise regularly **so as to improve** his health.","vi":"Ông ta thường xuyên tập thể dục buổi sáng để sức khoẻ tốt hơn."},{"en":"He studied hard **so as not to fail** in the exam.","vi":"Anh ấy học chăm để không bị thi rớt."},{"en":"I came to see you **not to complain, but to apologize**.","vi":"Tôi gặp anh không phải để phàn nàn, mà là để xin lỗi."},{"en":"She is hurrying not to miss the bus.","ok":false,"note":"phải là in order not to / so as not to"}],"mistake":{"wrong":"He studied hard not to fail in the exam.","right":"He studied hard so as not to fail in the exam.","why":"Mục đích phủ định cần in order not to / so as not to."},"tip":"'Để **không**' → *in order **not** to* / *so as **not** to*: **not** đứng ngay trước **to**.","src":"tr. 357","check":{"type":"fill","q":"She left early so as ___ to be late.","answer":["not"],"explain":"Phủ định mục đích: so as **not** to.","src":"tr. 357"}},{"title":"for + N, for + V-ing, for + O + to-V","icon":"🔧","rule":"**for + danh từ**: mục đích của ai khi làm gì; **to-V / for + V-ing**: **công dụng** của một vật; **for + O + to-V**: mục đích gắn với hành động của **người khác**.","explain":"*I went to the store **for some bread*** (= to buy some bread). Nói **công dụng** của vật thì dùng *to-V* hoặc *for + V-ing*: *This knife is only used to cut / for cutting bread.* Nhưng nói **một hành động cụ thể** thì không dùng *for + V-ing*: *I used this knife to cut bread* (NOT *for cutting bread*).\n**Lưu ý (sách)**: khi mệnh đề chính và mục đích **không cùng chủ ngữ** thì không nên dùng cụm to-V; dùng *so that* hoặc **for + O + to-V**.","formula":"for + N\nto-V / for + V-ing (công dụng của vật)\nfor + O + to-V (việc của người khác)","examples":[{"en":"I went to the store **for some bread**.","vi":"Tôi đi đến cửa hàng để mua một ít bánh mì."},{"en":"This knife is only used **to cut / for cutting** bread.","vi":"Con dao này chỉ được dùng để cắt bánh mì."},{"en":"I used this knife **to cut** bread.","vi":"Tôi dùng con dao này để cắt bánh mì."},{"en":"I left the door unlocked **for Harry to get in**.","vi":"Tôi không khoá cửa để Harry vào được."},{"en":"I left the door unlocked **so that Harry could get in**.","vi":"Tôi không khoá cửa để Harry vào được."},{"en":"I used this knife for cutting bread.","ok":false,"note":"hành động cụ thể → to cut"}],"mistake":{"wrong":"I went to the shop for buy some milk.","right":"I went to the shop to buy some milk.","why":"for + danh từ (for some milk); muốn dùng động từ thì to-V."},"tip":"Vật **dùng để** làm gì → *for V-ing* được; **tôi đã làm** gì → *to-V*.","src":"tr. 357–358","check":{"type":"mcq","q":"I left the key under the mat ___ you to find.","options":["for","so that","to"],"answer":0,"explain":"Việc tìm là của người khác (*you*) → **for + O + to-V**.","src":"tr. 358"}}],"practice":[{"type":"mcq","q":"I'm learning English ___ I can get a better job.","options":["so that","so as to","in order to"],"answer":0,"explain":"Sau chỗ trống là mệnh đề *I can get…* → **so that**. *so as to, in order to* phải đi với V nguyên mẫu.","src":"tr. 356"},{"type":"mcq","q":"She turned on the light ___ she could read.","options":["so that","in order to","for"],"answer":0,"explain":"Sau chỗ trống là mệnh đề có *could* → **so that**.","src":"tr. 356"},{"type":"mcq","q":"He took a taxi ___ be late.","options":["so as not to","not to","so as to not"],"answer":0,"explain":"Phủ định: **so as not to** + V. Không dùng *not to* một mình, và *not* đứng trước *to*.","src":"tr. 357"},{"type":"fill","q":"We went to the market ___ some fruit.","answer":["for"],"explain":"**for + danh từ** chỉ mục đích: for some fruit (= to buy some fruit).","src":"tr. 357"},{"type":"fill","q":"I saved money in order ___ buy a bike.","answer":["to"],"explain":"**in order to** + V nguyên mẫu.","src":"tr. 357"},{"type":"fill","q":"Speak louder so that everyone ___ hear you.","answer":["can","will","may"],"explain":"Câu mệnh lệnh (hiện tại – tương lai) → **can / will / may**.","src":"tr. 356"},{"type":"classify","q":"Mỗi từ nối đi với gì?","buckets":["+ S + V (mệnh đề)","+ V nguyên mẫu"],"items":[{"text":"so that","bucket":0},{"text":"in order that","bucket":0},{"text":"lest","bucket":0},{"text":"in order to","bucket":1},{"text":"so as to","bucket":1},{"text":"in order not to","bucket":1}],"explain":"*so that, in order that, lest* dẫn mệnh đề. *in order (not) to, so as to* dẫn động từ nguyên mẫu.","src":"tr. 356–357"},{"type":"fix","wrong":"She studied hard not to fail the exam.","answer":["She studied hard so as not to fail the exam.","She studied hard in order not to fail the exam."],"explain":"Không dùng *not to-V* một mình: **so as not to / in order not to**.","src":"tr. 357"},{"type":"fix","wrong":"I used a hammer for breaking the window.","answer":["I used a hammer to break the window.","I used a hammer in order to break the window.","I used a hammer so as to break the window."],"explain":"Hành động cụ thể → **to-V**, không dùng *for + V-ing*.","src":"tr. 357"},{"type":"fix","wrong":"He left early in order he could catch the bus.","answer":["He left early in order that he could catch the bus.","He left early so that he could catch the bus.","He left early so he could catch the bus."],"explain":"Không bỏ *that* sau **in order**.","src":"tr. 356"},{"type":"mcq","q":"Chọn câu đúng:","options":["This tool is used for opening bottles.","I used this tool for opening the bottle yesterday."],"answer":0,"explain":"**for + V-ing** nói **công dụng** của vật. Hành động cụ thể (hôm qua) phải là *to open*.","src":"tr. 357"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","left","the","door","open","for","the","cat","to","come","in."],"explain":"Việc vào là của con mèo (người/vật khác) → **for + O + to-V**.","src":"tr. 358"}],"flashcards":[{"front":"so that / in order that + S + ? (hiện tại – tương lai)","back":"**will / can / may** + V: Put the milk in the fridge so that it **won't** spoil."},{"front":"so that sau mệnh đề chính quá khứ dùng gì?","back":"**would / could / might**: We moved to London so that we **could** visit our parents."},{"front":"Bỏ that được sau so? Sau in order?","back":"Sau **so**: được (thân mật). Sau **in order**: **không**."},{"front":"'Để không…' dùng cụm nào?","back":"**in order not to / so as not to** + V (không dùng *not to* một mình)"},{"front":"for + V-ing dùng khi nào?","back":"Nói **công dụng của vật**: used for cutting bread. Hành động cụ thể → **to-V**."},{"front":"Mục đích gắn với việc người khác làm?","back":"**for + O + to-V**: I left the door unlocked **for Harry to get in**."},{"front":"lest nghĩa là gì?","back":"= **so that… not**, rất trang trọng (văn chương): lest robbers should come"}]},{"id":"03f","title":"Tương phản: although, despite, no matter","minutes":25,"goal":"Nói 'mặc dù' bằng although / though / even though / while (+ mệnh đề) và in spite of / despite (+ danh từ, V-ing); dùng no matter / whatever / however; bỏ lỗi 'Mặc dù… nhưng…'.","pretest":[{"type":"mcq","q":"___ it was raining, we went out.","options":["Although","Despite","In spite of"],"answer":0,"explain":"Sau chỗ trống là **mệnh đề** (it was raining) → **Although**. *Despite, In spite of* đi với danh từ.","src":"tr. 358"},{"type":"mcq","q":"Although Kevin worked hard, ___ failed the examination.","options":["he","but he","so he"],"answer":0,"explain":"Đã có *Although* thì **không dùng but**. Sách ghi rõ câu có *but* là sai.","src":"tr. 359"}],"hook":{"icon":"↔️","text":"Người Việt nói **'Mặc dù** chăm chỉ **nhưng** anh ấy vẫn trượt'. Tiếng Anh chỉ giữ **một** từ: *Although Kevin worked hard, he failed.* Giống bài nguyên nhân, bạn cũng phải nhìn thứ đứng sau: **mệnh đề** → *although*; **danh từ / V-ing** → *despite, in spite of*."},"diagram":{"type":"flow","title":"Chọn từ chỉ tương phản","start":{"q":"Sau chỗ trống là gì?","branches":[{"label":"S + V","to":{"result":"although / though / even though / while","icon":"🧩"}},{"label":"Danh từ, đại từ, V-ing","to":{"result":"in spite of / despite","icon":"📦"}},{"label":"the fact (that) + S + V","to":{"result":"in spite of / despite the fact that","icon":"📝"}},{"label":"wh- + S + V (dù… thế nào)","to":{"result":"no matter what/who/how… · whatever…","icon":"🌀"}}]}},"chunks":[{"title":"although, though, even though, while","icon":"🧩","rule":"**although / though / even though + S + V** = mặc dù; **even though** nhấn mạnh hơn. Đã có chúng thì **không dùng but**.","explain":"**while** cũng có thể mang nghĩa tương phản, tương đương *although*: *While there was no conclusive evidence, …*. Mệnh đề *although / though / even though* đứng trước hay sau mệnh đề chính đều được (đứng trước thì có dấu phẩy).\nTiếng Việt hay nói 'Mặc dù… nhưng…'; tiếng Anh **không dùng but** trong câu bắt đầu bằng *though, although, even though* hoặc *while*.","formula":"although / though / even though / while + S + V, S + V","examples":[{"en":"**Although** the weather was very bad, we had a wonderful holiday.","vi":"Mặc dù thời tiết xấu, chúng tôi cũng đã có một kỳ nghỉ tuyệt vời."},{"en":"We had a wonderful holiday, **although** the weather was very bad.","vi":"Chúng tôi đã có một kỳ nghỉ tuyệt vời, mặc dù thời tiết xấu."},{"en":"**Even though** I didn't understand a word, I kept smiling.","vi":"Dù chẳng hiểu một từ nào, tôi vẫn mỉm cười."},{"en":"**While** there was no conclusive evidence, most people thought he was guilty.","vi":"Dù không có bằng chứng thuyết phục, nhưng hầu hết mọi người đều cho là anh ta có tội."},{"en":"Although Kevin worked hard, but he failed the examination.","ok":false,"note":"đã có although thì bỏ but"}],"mistake":{"wrong":"Although Kevin worked hard, but he failed the examination.","right":"Although Kevin worked hard, he failed the examination.","why":"Không dùng but trong câu bắt đầu bằng although / though / even though / while."},"tip":"'Mặc dù… nhưng…' → giữ **một**: *Although…,* … hoặc …*, but* …","src":"tr. 358–359","check":{"type":"mcq","q":"___ she dislikes him, she is always polite to him.","options":["Even though","Despite","But"],"answer":0,"explain":"Sau chỗ trống là mệnh đề → **Even though**. *Despite* cần danh từ; *But* không mở đầu kiểu này.","src":"tr. 358"}},{"title":"though cuối câu, rút gọn, Rich as he is","icon":"✂️","rule":"Ba cách nói 'mặc dù' gọn hơn: **…, though.** ở cuối câu (= but / however); **bỏ S + be** khi cùng chủ ngữ; và **tính từ/trạng từ/danh từ + though/as + S + V**.","explain":"• *though* làm **trạng từ**, thường ở cuối câu: *I like the garden, though.* = nhưng tôi thích khu vườn.\n• Mệnh đề tương phản và mệnh đề chính **cùng chủ ngữ** → bỏ được chủ ngữ và *be*: *Although (she was) a disabled girl, …*\n• Cấu trúc nhấn mạnh: đưa tính từ / trạng từ / danh từ lên đầu, rồi **though** hoặc **as** + S + V: *Rich though/as he is* = *Although he is rich*.","formula":"…, though.\nAlthough + (S + be) + adj/N, S + V\nAdj/Adv/N + though/as + S + V, S + V","examples":[{"en":"The house isn't very nice. I like the garden, **though**.","vi":"Ngôi nhà không đẹp lắm. Thế nhưng tôi thích khu vườn."},{"en":"**Although a disabled girl**, she was quite confident and independent.","vi":"Mặc dù là một cô gái tàn tật, cô ấy khá tự tin và độc lập."},{"en":"**Though not huge**, the garden needs constant attention.","vi":"Dù không rộng lớn, nhưng khu vườn cũng cần được chăm sóc thường xuyên."},{"en":"**Rich though / as he is**, he is unhappy.","vi":"Dù giàu có, ông ta vẫn không hạnh phúc."},{"en":"**Scot though she was**, she supported the English team.","vi":"Dù là người Scotland, cô ấy vẫn cổ vũ đội tuyển Anh."},{"en":"As rich he is, he is unhappy.","ok":false,"note":"tính từ đứng đầu: Rich as he is"}],"mistake":{"wrong":"Although was tired, she kept working.","right":"Although tired, she kept working.","why":"Rút gọn thì bỏ cả chủ ngữ lẫn be; hoặc giữ đủ: Although she was tired."},"tip":"**Rich as he is** = Although he is rich: tính từ chạy lên **đầu**.","src":"tr. 358–359","check":{"type":"fill","q":"Tired ___ she was, she kept working. (dùng as hoặc though)","answer":["as","though"],"explain":"Tính từ + **as / though** + S + V = Although she was tired.","src":"tr. 359"}},{"title":"no matter, whatever, however","icon":"🌀
