","rule":"**No matter + what/who/when/where/why/how (+ tính từ/trạng từ) + S + V** = dù… thế nào đi nữa; tương tự: **whatever (+ N), whoever, whenever, wherever, however (+ tính từ)**.","explain":"Hai cách nói tương đương: *no matter what = whatever*, *no matter who = whoever*, *no matter where = wherever*, *no matter how = however*. Sau chúng là trật tự **S + V** như câu kể (không đảo như câu hỏi); với *how / however*, tính từ hoặc trạng từ đi **liền sau**: *no matter how late it is*, *however much he eats*.","formula":"No matter + what/who/when/where/why/how (+ adj/adv) + S + V\nWhatever (+ N) / whoever / whenever / wherever / however (+ adj) + S + V","examples":[{"en":"**No matter who** you are, I still love you.","vi":"Dù em là ai, anh vẫn yêu em."},{"en":"Don't trust him, **no matter what** he says.","vi":"Bất kể anh ta nói gì cũng đừng tin anh ta."},{"en":"Phone me when you arrive, **no matter how late** it is.","vi":"Hãy gọi điện cho tôi khi anh đến nơi, dù có trễ chăng nữa."},{"en":"**Whatever problems** you have, you can always come to me for help.","vi":"Bất kể bạn gặp vấn đề gì, bạn luôn có thể đến nhờ tôi giúp đỡ."},{"en":"**However much** he eats, he never gets fat.","vi":"Dù có ăn nhiều thế nào đi nữa anh ta cũng không bị béo phì."},{"en":"No matter how late is it, call me.","ok":false,"note":"giữ trật tự S + V: how late it is"}],"mistake":{"wrong":"No matter what does he say, don't trust him.","right":"No matter what he says, don't trust him.","why":"Sau no matter + wh- là S + V như câu kể, không đảo như câu hỏi."},"tip":"**no matter what** = **whatever** · **no matter who** = **whoever** · **no matter how** = **however**.","src":"tr. 359–360","check":{"type":"mcq","q":"I'm not opening the door, ___ you are.","options":["whoever","however","whatever"],"answer":0,"explain":"Dù là **ai** → **whoever** (= no matter who).","src":"tr. 360"}},{"title":"in spite of, despite","icon":"📦","rule":"**in spite of / despite + danh từ / đại từ / V-ing**; muốn dùng mệnh đề: **in spite of / despite the fact (that) + S + V**.","explain":"*in spite of* và *despite* là **giới từ** (mặc dù, bất chấp), nên giống *because of*: theo sau là danh từ, đại từ hoặc V-ing, không phải mệnh đề. **despite không có of**. Cụm này đứng trước hay sau mệnh đề chính đều được.","formula":"in spite of / despite + N / đại từ / V-ing\nin spite of / despite the fact (that) + S + V","examples":[{"en":"**Despite** his physical handicap, he has become a successful businessman.","vi":"Mặc dù tật nguyền, anh ấy vẫn trở thành một doanh nhân thành đạt."},{"en":"I wasn't tired **in spite of working** hard all day.","vi":"Tôi không thấy mệt dù làm việc vất vả cả ngày."},{"en":"She wasn't well, but **despite** this she went to work.","vi":"Cô ấy không được khoẻ, nhưng dù vậy cô ấy vẫn đi làm."},{"en":"I couldn't sleep **despite the fact that** I was very tired.","vi":"Tôi không ngủ được dù rất mệt."},{"en":"We enjoyed our holiday **in spite of** the rain.","vi":"Chúng tôi đã có kỳ nghỉ vui vẻ dù trời mưa."},{"en":"Despite of the rain, we went out.","ok":false,"note":"despite không có of"}],"mistake":{"wrong":"Despite she was ill, she went to work.","right":"Although she was ill, she went to work.","why":"despite không dẫn mệnh đề; dùng although, hoặc Despite being ill / Despite the fact that she was ill."},"tip":"**despite** — không *of*; **in spite of** — có *of*. Cả hai không đi với mệnh đề trần.","src":"tr. 360","check":{"type":"fill","q":"In spite ___ the noise, the baby slept well.","answer":["of"],"explain":"**in spite of** + danh từ.","src":"tr. 360"}}],"practice":[{"type":"mcq","q":"___ the rain, we enjoyed the trip.","options":["Despite","Although","Even though"],"answer":0,"explain":"*the rain* là danh từ → **Despite**. *Although, Even though* cần mệnh đề.","src":"tr. 360"},{"type":"mcq","q":"___ he was tired, he finished the report.","options":["Although","In spite of","Despite"],"answer":0,"explain":"*he was tired* là mệnh đề → **Although**.","src":"tr. 358"},{"type":"classify","q":"Mỗi từ nối đi với gì?","buckets":["+ S + V (mệnh đề)","+ danh từ / V-ing"],"items":[{"text":"although","bucket":0},{"text":"even though","bucket":0},{"text":"though","bucket":0},{"text":"despite the fact that","bucket":0},{"text":"in spite of","bucket":1},{"text":"despite","bucket":1}],"explain":"*although, though, even though* là liên từ → mệnh đề. *despite the fact that* cũng dẫn mệnh đề. *in spite of, despite* → danh từ / V-ing.","src":"tr. 358–360"},{"type":"fill","q":"She went to work ___ being ill. (một từ)","answer":["despite"],"explain":"Sau chỗ trống là V-ing, chỉ được một từ → **despite**.","src":"tr. 360"},{"type":"fill","q":"___ matter what you say, I won't change my mind.","answer":["No"],"explain":"**No matter what** + S + V = dù bạn nói gì.","src":"tr. 359"},{"type":"fill","q":"___ hard I study, I can't remember these words. (dù… thế nào; một từ)","answer":["However"],"explain":"**However** + tính từ/trạng từ (hard) + S + V = dù… thế nào đi nữa.","src":"tr. 360"},{"type":"mcq","q":"The hotel was expensive. The food was great, ___.","options":["though","although","despite"],"answer":0,"explain":"Đứng **cuối câu** làm trạng từ (= but/however) → chỉ **though**.","src":"tr. 358"},{"type":"fix","wrong":"Although it was late, but she kept working.","answer":["Although it was late, she kept working.","It was late, but she kept working."],"explain":"Không dùng *but* trong câu bắt đầu bằng *although*.","src":"tr. 359"},{"type":"fix","wrong":"Despite of the noise, I fell asleep.","answer":["Despite the noise, I fell asleep.","In spite of the noise, I fell asleep."],"explain":"**despite** không có *of* (hoặc dùng *in spite of*).","src":"tr. 360"},{"type":"fix","wrong":"In spite of he was rich, he was unhappy.","answer":["Although he was rich, he was unhappy.","Though he was rich, he was unhappy.","Even though he was rich, he was unhappy.","In spite of being rich, he was unhappy.","Despite being rich, he was unhappy.","In spite of the fact that he was rich, he was unhappy.","In spite of the fact he was rich, he was unhappy.","Despite the fact that he was rich, he was unhappy.","Despite the fact he was rich, he was unhappy."],"explain":"*in spite of* không dẫn mệnh đề: dùng *Although he was rich*, *In spite of being rich* hoặc *In spite of the fact that he was rich*.","src":"tr. 360"},{"type":"mcq","q":"___ you go, I'll find you.","options":["Wherever","Whoever","Whatever"],"answer":0,"explain":"Dù đi **đâu** → **Wherever** (= no matter where).","src":"tr. 359"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Rich","as","he","is,","he","is","not","happy."],"explain":"Tính từ lên đầu + **as** + S + V = Although he is rich.","src":"tr. 359"}],"flashcards":[{"front":"although / though / even though đi với gì?","back":"**S + V**: Although the weather was bad, we had a wonderful holiday."},{"front":"Câu có Although… có dùng but không?","back":"**Không**: Although Kevin worked hard, ~~but~~ he failed."},{"front":"even though khác although thế nào?","back":"**even though** nhấn mạnh sự tương phản hơn: Even though I didn't understand a word, I kept smiling."},{"front":"in spite of / despite đi với gì?","back":"**Danh từ, đại từ, V-ing**: despite the rain · in spite of working hard. Mệnh đề → **the fact that**."},{"front":"Rich as he is, … nghĩa là gì?","back":"= **Although he is rich**, … (tính từ + as/though + S + V)"},{"front":"no matter what / who / how = ?","back":"**whatever / whoever / however**: No matter what he says = Whatever he says"},{"front":"though ở cuối câu nghĩa là gì?","back":"= **but / however**: I like the garden, **though**."}]},{"id":"03g","title":"Điều kiện và thể cách: unless, in case, as, like, as if","minutes":25,"goal":"Dùng đúng unless, in case, provided, as long as, đảo ngữ bỏ if và các cụm with / without / but for; phân biệt as và like; chia thì đúng sau as if / as though.","pretest":[{"type":"mcq","q":"I'll take the job ___ the pay is too low.","options":["unless","if","in case"],"answer":0,"explain":"**unless** = if… not: tôi sẽ nhận việc **trừ khi** lương quá thấp.","src":"tr. 361"},{"type":"mcq","q":"___ you know, the meeting has been cancelled.","options":["As","Like","As if"],"answer":0,"explain":"Nói điều người nghe **đã biết** → **As** you know. Sách ghi rõ NOT *Like you know*.","src":"tr. 363"},{"type":"mcq","q":"He talks as if he ___ everything. (thật ra anh ta không biết)","options":["knew","knows","will know"],"answer":0,"explain":"Điều **không thật ở hiện tại** → sau *as if* dùng **quá khứ đơn**: knew.","src":"tr. 364"}],"hook":{"icon":"🔑","text":"Bài cuối gom hai loại mệnh đề: **điều kiện** (nếu, trừ khi, miễn là, phòng khi) và **thể cách** (như, như thể). Tiếng Việt chỉ nói 'trừ khi' là xong, nhưng *unless* của tiếng Anh đã chứa sẵn chữ **not**, nên thêm *not* là sai. Còn 'như thể' (*as if*) có một bí mật: chuyện **không thật** thì thì động từ phải **lùi lại một bước**."},"diagram":{"type":"mindmap","title":"Điều kiện và thể cách","root":{"label":"Điều kiện & thể cách","children":[{"label":"Liên từ điều kiện","icon":"🔑","children":[{"label":"unless = if… not"},{"label":"provided, as long as"},{"label":"even if, whether… or not"}]},{"label":"in case ≠ if","icon":"☂️","children":[{"label":"in case: phòng khi"}]},{"label":"Bỏ if bằng đảo ngữ","icon":"🔁","children":[{"label":"Should / Were / Had + S"}]},{"label":"Cụm + danh từ","icon":"📦","children":[{"label":"with, without, but for"},{"label":"in case of, in the event of"}]},{"label":"as / like","icon":"🎭","children":[{"label":"as you know (trang trọng)"},{"label":"like (thân mật)"}]},{"label":"as if / as though","icon":"🪞","children":[{"label":"không thật: lùi thì"}]}]}},"chunks":[{"title":"unless và các liên từ điều kiện","icon":"🔑","rule":"**unless = if … not** (trừ khi), nên trong mệnh đề unless **không dùng not**. Ngoài *if* còn có: **even if, whether … or not, provided/providing (that), so/as long as, on condition (that), supposing (that)**.","explain":"Nghĩa của từng từ:\n• **even if** = cho dù; **whether … or not** = dù … hay không.\n• **provided / providing (that), so long as / as long as, on condition (that)** = miễn là, với điều kiện là.\n• **supposing (that)** = giả sử.\nMệnh đề điều kiện đứng trước hay sau mệnh đề chính đều được. (Các kiểu câu điều kiện if loại 1, 2, 3 được học kỹ ở chương câu điều kiện.)","formula":"unless + S + V (khẳng định) = if + S + not V","examples":[{"en":"He won't go to sleep **unless** you tell him a story.","vi":"Thằng bé sẽ không ngủ nếu anh không kể chuyện cho nó nghe."},{"en":"I'll take the job **unless** the pay is too low.","vi":"Tôi sẽ nhận công việc đó nếu lương không quá thấp."},{"en":"**Even if** I had time and money, I still wouldn't go on a cruise.","vi":"Cho dù có thời gian và tiền bạc, tôi vẫn không đi du lịch bằng tàu."},{"en":"You'll have to take the medicine **whether you like it or not**.","vi":"Dù thích hay không thì con vẫn phải uống thuốc."},{"en":"You can borrow the car **so long as** you don't drive too fast.","vi":"Con có thể mượn xe miễn là con đừng lái quá nhanh."},{"en":"He can come with us **provided (that)** he pays for his own meals.","vi":"Anh ta có thể đi với chúng ta miễn là anh ta tự trả tiền ăn."},{"en":"I'll take the job unless the pay isn't too low.","ok":false,"note":"unless đã có nghĩa phủ định → bỏ not"}],"mistake":{"wrong":"I'll take the job unless the pay isn't too low.","right":"I'll take the job unless the pay is too low.","why":"unless = if… not; thêm not nữa thành phủ định hai lần."},"tip":"**unless** đã chứa sẵn **not** bên trong: đừng cho thêm *not*.","src":"tr. 360–361","check":{"type":"fill","q":"You can't come in ___ you have a ticket. (trừ khi)","answer":["unless"],"explain":"**unless** = trừ khi (= if you don't have a ticket).","src":"tr. 361"}},{"title":"in case, đảo ngữ và cụm điều kiện","icon":"☂️","rule":"**in case** = phòng khi (làm **trước** để đề phòng), khác **if** = nếu (chỉ làm **khi** việc đó xảy ra).","explain":"*I'll get some money from the bank **in case** I need some* → rút tiền ngay bây giờ vì sau này có thể cần. *…**if** I need some* → khi nào cần mới rút. Trong **tiếng Anh Mỹ**, *in case* đồng nghĩa với *if*: *In case you need any help, let me know.*\n**Bỏ if bằng đảo ngữ** (xem thêm ở phần câu điều kiện): *Should you need…* = If you should need…; *Were the child mine…* = If the child were mine…; *Had I not carried out…* = If I hadn't carried out…\n**Cụm điều kiện**: **with, without, but for, in case of, in the event of + danh từ/đại từ**.","formula":"in case + S + V\nShould / Were / Had + S + …, S + V\nwith / without / but for / in case of / in the event of + N","examples":[{"en":"I'll get some money from the bank **in case** I need some.","vi":"Tôi sẽ đến ngân hàng rút một ít tiền phòng khi cần dùng."},{"en":"I'll get some money from the bank **if** I need some.","vi":"Nếu cần dùng, tôi sẽ đến ngân hàng rút một ít tiền."},{"en":"**Should you need** any help, you can always phone me.","vi":"Nếu cần giúp đỡ, anh có thể gọi tôi bất kì lúc nào."},{"en":"**Without** the map, I'd have got lost.","vi":"Nếu không có tấm bản đồ thì tôi đã bị lạc đường rồi."},{"en":"**But for** you, I'd have drowned.","vi":"Nếu không có anh thì tôi đã bị chết đuối rồi."},{"en":"**In case of** fire, break glass.","vi":"Nếu xảy ra hoả hoạn, hãy đập vỡ kính."},{"en":"In case of it rains, take an umbrella.","ok":false,"note":"in case of + danh từ; mệnh đề → in case"}],"mistake":{"wrong":"Take an umbrella in case of it rains.","right":"Take an umbrella in case it rains.","why":"in case of + danh từ (in case of rain); in case + S + V."},"tip":"**in case**: mang ô **trước**, phòng mưa · **if**: **mưa rồi** mới mở ô.","src":"tr. 361–362","check":{"type":"mcq","q":"Take a jacket ___ it gets cold later.","options":["in case","unless","in case of"],"answer":0,"explain":"Mang áo trước để **phòng khi** trời lạnh → **in case** + mệnh đề. *in case of* cần danh từ.","src":"tr. 361"}},{"title":"as và like","icon":"🎭","rule":"**as** và **like** + mệnh đề = như, giống như; **like** dùng trong lối nói **thân mật**, **as** trong lối nói **trang trọng**. Với điều **đã biết, đã nói**, dùng **as**: *as you know, as we agreed* (không dùng *like*).","explain":"Các cụm quen thuộc với *as*: *as you know, as we agreed, as you suggested, as I explained, as I said, as you can imagine*. *like* thường không dùng trong loại mệnh đề này, **trừ** với *say* trong lối nói thân mật: *As / Like I said, you're welcome to stay.*\n**Lưu ý (sách)**: trong lối nói rất trang trọng, *as* đôi khi được theo sau bởi đảo ngữ: *She was a Catholic, as were most of her friends.*","formula":"S + V + as / like + S + V\nAs you know / As we agreed / As I said, …","examples":[{"en":"Don't talk to me **as / like** you talk to a child.","vi":"Đừng có nói chuyện với tôi như thể nói với con nít vậy."},{"en":"You look exactly **like** your mother did when she was 20.","vi":"Nhìn con giống hệt mẹ con lúc 20 tuổi."},{"en":"We'd better leave things **as** they are until the police arrive.","vi":"Chúng ta nên để nguyên mọi thứ cho đến khi cảnh sát đến."},{"en":"**As you know**, next Tuesday's meeting has been cancelled.","vi":"Như các bạn đã biết, cuộc họp vào thứ Ba tới đã bị huỷ."},{"en":"I am sending you the bill for the repairs, **as we agreed**.","vi":"Như đã thoả thuận, tôi gửi hoá đơn phí sửa chữa cho anh."},{"en":"Like you know, next Tuesday's meeting has been cancelled.","ok":false,"note":"điều đã biết → As you know"}],"mistake":{"wrong":"I'm sending you the bill, like we agreed.","right":"I'm sending you the bill, as we agreed.","why":"Điều đã thoả thuận, đã biết → dùng as."},"tip":"'Như **đã** biết / **đã** nói / **đã** thoả thuận' → **as**.","src":"tr. 362–363","check":{"type":"mcq","q":"___ I explained, the price includes breakfast.","options":["As","As if","Unless"],"answer":0,"explain":"Điều đã giải thích → **As** I explained.","src":"tr. 363"}},{"title":"as if / as though","icon":"🪞","rule":"**as if / as though** = như thể. Điều **có thể thật** → thì bình thường; **không thật ở hiện tại** → **quá khứ đơn**; **không thật ở quá khứ** → **quá khứ hoàn thành**.","explain":"*as if / as though* thường đi với *be, look, sound, feel, seem* (và *It looks / sounds… as if*), hoặc với động từ khác để tả cách ai làm việc gì.\nSo sánh: *He talks as if he **is** very rich* → có thể anh ta giàu thật. *He talks as if he **was/were** very rich* → nhưng chắc chắn không giàu.\n**Lưu ý (sách)**:\n• **were** có thể thay **was** với *I, he, she, it*.\n• Động từ trước *as if* ở hiện tại hay quá khứ thì thì trong mệnh đề *as if* **không đổi**: *He talks / talked as if he knew everything.*\n• **like** cũng dùng như *as if*, nhất là trong văn thân mật: *It seems like it's going to rain.*\n• Cùng chủ ngữ thì rút gọn được bằng **V-ing, V3 hoặc to-V**: *as if escaping, as if hit by a bullet, as if to remind him*.","formula":"S + V + as if / as though + S + V2 (không thật · hiện tại)\nS + V + as if / as though + S + had V3 (không thật · quá khứ)","diagram":{"type":"table","title":"Thì sau as if / as though","head":["Tình huống","Thì sau as if","Ví dụ"],"rows":[["Có thể thật","Thì bình thường","It looks as if it's going to rain"],["Không thật · hiện tại","Quá khứ đơn (were)","He talks as if he knew"],["Không thật · quá khứ","Quá khứ hoàn thành","He talked as if he had seen it"]]},"examples":[{"en":"That house looks **as if** it's going to fall down.","vi":"Trông ngôi nhà đó cứ như là sắp sập."},{"en":"He talks **as though** he **knew** where she was.","vi":"Anh ấy nói như thể anh ấy biết cô ta ở đâu (nhưng thật ra không biết)."},{"en":"Gary's only 40. Why do you talk about him **as if** he **were** an old man?","vi":"Gary mới 40 thôi. Sao anh lại nói về anh ta như thể anh ta là một ông lão vậy?"},{"en":"Tom looked tired **as if** he **had worked** very hard.","vi":"Trông Tom mệt mỏi như thể anh ta đã làm việc rất vất vả (nhưng không phải vậy)."},{"en":"After scoring, Fowler fell to the floor **as if hit** by a bullet.","vi":"Sau khi ghi điểm, Fowler ngã xuống sàn như thể bị trúng đạn."},{"en":"He talks as if he is a doctor, but he isn't.","ok":false,"note":"không thật ở hiện tại → were/was"}],"mistake":{"wrong":"He talked as if he saw the accident, but he didn't see it.","right":"He talked as if he had seen the accident, but he didn't see it.","why":"Không thật ở quá khứ → quá khứ hoàn thành."},"tip":"Chuyện **không thật** sau *as if* → **lùi một bước**: hiện tại → **V2**, quá khứ → **had V3**.","src":"tr. 363–365","check":{"type":"mcq","q":"She acted as if she ___ the news before. (thật ra cô ấy chưa nghe)","options":["had heard","has heard","hears"],"answer":0,"explain":"Không thật ở quá khứ → **had heard** (quá khứ hoàn thành).","src":"tr. 364"}}],"practice":[{"type":"mcq","q":"You'll fail the test ___ you study harder.","options":["unless","if","in case"],"answer":0,"explain":"**unless** = nếu không: bạn sẽ trượt nếu không học chăm hơn. *if* thành 'trượt nếu học chăm hơn', vô lý.","src":"tr. 361"},{"type":"mcq","q":"Take an umbrella ___ it rains.","options":["in case","unless","in case of"],"answer":0,"explain":"Mang ô trước để **phòng khi** mưa → **in case** + mệnh đề.","src":"tr. 361"},{"type":"mcq","q":"___ the traffic jam, I would have arrived on time.","options":["But for","Unless","Even if"],"answer":0,"explain":"Sau chỗ trống là **danh từ** (the traffic jam) → **But for** (= If it hadn't been for). *Unless, Even if* cần mệnh đề.","src":"tr. 362"},{"type":"fill","q":"___ you need help, call me. (đảo ngữ = If you should need help)","answer":["Should"],"explain":"Bỏ *if* bằng đảo ngữ: **Should** you need help…","src":"tr. 361"},{"type":"fill","q":"You can stay here as ___ as you keep quiet.","answer":["long"],"explain":"**as long as** = miễn là.","src":"tr. 360"},{"type":"fill","q":"She looks as ___ she has seen a ghost.","answer":["if","though"],"explain":"**as if / as though** = như thể.","src":"tr. 363"},{"type":"mcq","q":"___ I said, the party starts at eight. (lối nói thân mật)","options":["Like","As if","Even if"],"answer":0,"explain":"**Like I said** dùng được trong lối nói thân mật (trang trọng hơn: *As I said*).","src":"tr. 363"},{"type":"mcq","q":"She dances as if she ___ a professional, but she isn't.","options":["were","is","has been"],"answer":0,"explain":"Không thật ở hiện tại → **were** (hoặc was).","src":"tr. 364"},{"type":"fix","wrong":"I won't go unless you don't come with me.","answer":["I won't go unless you come with me.","I won't go if you don't come with me."],"explain":"*unless* đã có nghĩa *if… not* → bỏ *don't* (hoặc dùng *if you don't*).","src":"tr. 361"},{"type":"fix","wrong":"Like you know, the shop is closed on Sundays.","answer":["As you know, the shop is closed on Sundays."],"explain":"Điều người nghe đã biết → **As** you know.","src":"tr. 363"},{"type":"fix","wrong":"Take your passport in case of you need it.","answer":["Take your passport in case you need it."],"explain":"Mệnh đề *you need it* → **in case**, không có *of*.","src":"tr. 361–362"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["He","looked","as","if","he","had","seen","a","ghost."],"explain":"Không thật ở quá khứ → as if + **had seen**.","src":"tr. 364"}],"flashcards":[{"front":"unless = ?","back":"**if… not** (trừ khi). Không thêm not: unless the pay **is** too low."},{"front":"in case khác if thế nào?","back":"**in case** = phòng khi (làm trước); **if** = nếu (làm khi việc xảy ra)."},{"front":"Bỏ if bằng đảo ngữ: 3 dạng?","back":"**Should** you need… · **Were** the child mine… · **Had** I not…"},{"front":"with / without / but for đi với gì?","back":"**Danh từ / đại từ**: But for you, I'd have drowned."},{"front":"as you know hay like you know?","back":"**As** you know (điều đã biết → as). like chỉ được với *Like I said* (thân mật)."},{"front":"as if + điều không thật ở hiện tại?","back":"**Quá khứ đơn** (were): He talks as if he **knew** everything."},{"front":"as if + điều không thật ở quá khứ?","back":"**Quá khứ hoàn thành**: He looked as if he **had worked** very hard."}]}],"quiz":{"pass":0.8,"sets":[[{"type":"mcq","q":"I'll lend you my book when I ___ it.","options":["finish","will finish","finished"],"answer":0,"explain":"Nói về tương lai → mệnh đề *when* dùng **hiện tại**: when I **finish**. Không dùng *will* sau when.","src":"tr. 347"},{"type":"mcq","q":"___ you put this plant, it doesn't grow well.","options":["Wherever","Whoever","Whatever"],"answer":0,"explain":"Đặt **ở đâu** cũng vậy → **Wherever** (bất cứ nơi đâu).","src":"tr. 346–347"},{"type":"fill","q":"Don't open the door until I ___ you. (tell)","answer":["tell"],"explain":"Câu mệnh lệnh về tương lai → mệnh đề *until* dùng hiện tại: until I **tell** you.","src":"tr. 347"},{"type":"fill","q":"We ___ in this house since our son was born. (live; hiện tại hoàn thành)","answer":["have lived","'ve lived","have been living","'ve been living"],"explain":"Mệnh đề chính với *since* → **hiện tại hoàn thành** (tiếp diễn): have lived / have been living.","src":"tr. 348"},{"type":"mcq","q":"Chọn câu đúng:","options":["When she arrives, we'll start the meeting.","When she will arrive, we'll start the meeting.","When she arrived, we'll start the meeting."],"answer":0,"explain":"Tương lai → mệnh đề *when* ở hiện tại (**arrives**), mệnh đề chính có *will*.","src":"tr. 347"},{"type":"fix","wrong":"He has worked here since he has left school.","answer":["He has worked here since he left school.","He's worked here since he left school."],"explain":"Mệnh đề *since* là mốc quá khứ → quá khứ đơn: since he **left** school.","src":"tr. 348"},{"type":"mcq","q":"Don't forget to lock the door when ___ the house.","options":["leaving","leave","left"],"answer":0,"explain":"Sau *when* có thể dùng **phân từ V-ing** thay cho mệnh đề: when **leaving** (= when you leave).","src":"tr. 348"},{"type":"mcq","q":"I was reading a book ___ my brother was playing video games.","options":["while","as soon as","no sooner"],"answer":0,"explain":"Hai việc kéo dài **song song** → **while**.","src":"tr. 349"},{"type":"mcq","q":"___ she gets older, she becomes more patient.","options":["As","While","Until"],"answer":0,"explain":"Hai việc **cùng thay đổi dần** → **As**. Sách: NOT *While I get older*.","src":"tr. 349"},{"type":"fill","q":"Hardly had we started the game ___ it began to rain.","answer":["when","before"],"explain":"**hardly** đi cặp với **when** (hoặc **before**).","src":"tr. 350"},{"type":"mcq","q":"We had ___ sat down when the lights went out.","options":["hardly","no sooner","as soon as"],"answer":0,"explain":"Có *when* ở vế sau → **hardly**… when. *no sooner* phải đi với *than*.","src":"tr. 350"},{"type":"fix","wrong":"No sooner had the train left when I realized I'd forgotten my bag.","answer":["No sooner had the train left than I realized I'd forgotten my bag.","No sooner had the train left than I realised I'd forgotten my bag."],"explain":"**no sooner** đi cặp với **than**, không phải *when*.","src":"tr. 350"},{"type":"mcq","q":"I met my wife ___ I was twenty-five.","options":["when","while","as"],"answer":0,"explain":"Nói về tuổi → **when**.","src":"tr. 349"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Just","as","I","sat","down,","the","doorbell","rang."],"explain":"**Just as** + mệnh đề: hai việc ngắn xảy ra cùng lúc.","src":"tr. 349"},{"type":"mcq","q":"The match was cancelled ___ the storm.","options":["due to","because","since"],"answer":0,"explain":"*the storm* là danh từ → **due to**. *because, since* cần mệnh đề.","src":"tr. 351"},{"type":"mcq","q":"___ you're not busy, could you help me?","options":["Since","Because of","Owing to"],"answer":0,"explain":"Sau chỗ trống là mệnh đề → **Since** (vì). *Because of, Owing to* cần danh từ.","src":"tr. 350"},{"type":"fill","q":"We missed the train because ___ you!","answer":["of"],"explain":"*you* là đại từ → because **of**.","src":"tr. 351"},{"type":"fix","wrong":"Since he was ill, so he didn't go to school.","answer":["Since he was ill, he didn't go to school.","He was ill, so he didn't go to school."],"explain":"Không dùng *so* trong câu bắt đầu bằng *since*.","src":"tr. 351"},{"type":"mcq","q":"He lost his job ___ his laziness.","options":["owing to","as","because"],"answer":0,"explain":"*his laziness* là danh từ → **owing to**.","src":"tr. 351"},{"type":"fill","q":"He was absent due to the ___ that his mother was ill.","answer":["fact"],"explain":"**due to the fact that** + mệnh đề (văn trang trọng).","src":"tr. 352"},{"type":"mcq","q":"Chọn câu đúng:","options":["She missed the party because of being sick.","She missed the party because of she was sick.","She missed the party because being sick."],"answer":0,"explain":"Cùng chủ ngữ → **because of + V-ing**. *because of* không dẫn mệnh đề; *because* không đi với V-ing.","src":"tr. 352"},{"type":"mcq","q":"It was ___ a lovely day that we went to the beach.","options":["such","so","too"],"answer":0,"explain":"*a lovely day* = a + tính từ + danh từ → **such**.","src":"tr. 353"},{"type":"mcq","q":"He drove ___ fast that the police couldn't catch him.","options":["so","such","too"],"answer":0,"explain":"Trạng từ *fast* + that → **so**.","src":"tr. 352"},{"type":"fill","q":"I have so ___ time that I can't have lunch with you.","answer":["little"],"explain":"*time* không đếm được, nghĩa 'ít' → so **little**.","src":"tr. 353"},{"type":"mcq","q":"There were ___ a lot of people that we couldn't get in.","options":["such","so","too"],"answer":0,"explain":"**such** đi với *a lot (of)*; *so* đi với *many/much*.","src":"tr. 354"},{"type":"fill","q":"This bag is too heavy for me ___ carry.","answer":["to"],"explain":"too + adj + for + O + **to**-V.","src":"tr. 355"},{"type":"fix","wrong":"She is enough old to travel alone.","answer":["She is old enough to travel alone.","She's old enough to travel alone."],"explain":"*enough* đứng **sau** tính từ: old enough.","src":"tr. 354"},{"type":"mcq","q":"It's ___ cold to go swimming today.","options":["far too","too far","so"],"answer":0,"explain":"*far* đứng trước *too* để nhấn mạnh: **far too** cold. *so* không đi với to-V theo kiểu này.","src":"tr. 354"},{"type":"fix","wrong":"It was such an awful weather that we stayed at home.","answer":["It was such awful weather that we stayed at home.","It was such awful weather we stayed at home."],"explain":"*weather* không đếm được → bỏ *an*: such awful weather.","src":"tr. 354"},{"type":"mcq","q":"I wrote the number down ___ I wouldn't forget it.","options":["so that","in order to","so as to"],"answer":0,"explain":"Sau chỗ trống là mệnh đề có *wouldn't* → **so that**.","src":"tr. 356"},{"type":"mcq","q":"They whispered ___ wake the baby.","options":["so as not to","so that not","not to"],"answer":0,"explain":"Phủ định mục đích + V: **so as not to**. Không dùng *not to* một mình.","src":"tr. 357"},{"type":"fill","q":"She works two jobs in order ___ pay for her studies.","answer":["to"],"explain":"**in order to** + V.","src":"tr. 357"},{"type":"fix","wrong":"We left early so as to not miss the train.","answer":["We left early so as not to miss the train.","We left early in order not to miss the train."],"explain":"*not* đứng trước *to*: **so as not to**.","src":"tr. 357"},{"type":"mcq","q":"I need a box ___ my old books.","options":["for","to","so that"],"answer":0,"explain":"Sau chỗ trống là cụm danh từ → **for + N**.","src":"tr. 357"},{"type":"mcq","q":"She saved money so that she ___ buy a car.","options":["could","can","will"],"answer":0,"explain":"Mệnh đề chính ở quá khứ (*saved*) → **could**.","src":"tr. 356"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","left","some","money","for","my","son","to","buy","lunch."],"explain":"Việc mua là của người khác (my son) → **for + O + to-V**.","src":"tr. 358"},{"type":"mcq","q":"___ being tired, he went on working.","options":["In spite of","Although","Even though"],"answer":0,"explain":"Sau chỗ trống là V-ing → **In spite of**.","src":"tr. 360"},{"type":"mcq","q":"___ tired she is, she always helps her children.","options":["However","Whatever","Whoever"],"answer":0,"explain":"**However** + tính từ + S + V = dù mệt thế nào.","src":"tr. 359"},{"type":"fill","q":"___ though it was cold, he wore shorts. (nhấn mạnh hơn although)","answer":["Even"],"explain":"**Even though** nhấn mạnh sự tương phản hơn *although*.","src":"tr. 359"},{"type":"fix","wrong":"Even though she was rich, but she wasn't happy.","answer":["Even though she was rich, she wasn't happy.","She was rich, but she wasn't happy."],"explain":"Không dùng *but* trong câu bắt đầu bằng *even though*.","src":"tr. 359"},{"type":"mcq","q":"She passed the test ___ the fact that she didn't study.","options":["despite","although","even though"],"answer":0,"explain":"**despite the fact that** + mệnh đề. *although the fact that* sai.","src":"tr. 360"},{"type":"mcq","q":"Chọn câu đúng:","options":["No matter what you do, do it well.","No matter what do you do, do it well.","No matter you do, do it well."],"answer":0,"explain":"**No matter what** + S + V (trật tự câu kể).","src":"tr. 359"},{"type":"fill","q":"Brave ___ they were, they couldn't win. (dùng as hoặc though)","answer":["as","though"],"explain":"Tính từ + **as/though** + S + V = Although they were brave.","src":"tr. 359"},{"type":"mcq","q":"You can go out ___ you're back by ten.","options":["as long as","unless","in case"],"answer":0,"explain":"**as long as** = miễn là.","src":"tr. 360"},{"type":"mcq","q":"___ his help, I would have failed.","options":["Without","Unless","Provided"],"answer":0,"explain":"Sau chỗ trống là danh từ → **Without** (= If I hadn't had his help).","src":"tr. 362"},{"type":"fill","q":"___ I known, I would have helped you. (đảo ngữ = If I had known)","answer":["Had"],"explain":"Bỏ *if* bằng đảo ngữ: **Had** I known…","src":"tr. 361–362"},{"type":"mcq","q":"It sounds ___ Tom is going to move abroad.","options":["as if","as","unless"],"answer":0,"explain":"*It sounds* **as if** + mệnh đề = nghe như là.","src":"tr. 363"},{"type":"fix","wrong":"Unless you don't hurry, you'll miss the bus.","answer":["Unless you hurry, you'll miss the bus.","If you don't hurry, you'll miss the bus."],"explain":"*unless* = if… not → không thêm *don't*.","src":"tr. 361"},{"type":"mcq","q":"___ we discussed yesterday, the price will go up next month.","options":["As","As if","Unless"],"answer":0,"explain":"Điều đã bàn → **As** we discussed.","src":"tr. 363"},{"type":"mcq","q":"She looked at me as if I ___ mad, but I wasn't.","options":["were","am","have been"],"answer":0,"explain":"Không thật → lùi thì: **were** (hoặc was).","src":"tr. 364–365"}],[{"type":"mcq","q":"She always drinks a glass of water before she ___ to work.","options":["goes","will go","went"],"answer":0,"explain":"Thói quen → hiện tại ở cả hai mệnh đề: before she **goes**.","src":"tr. 347–348"},{"type":"fill","q":"I'll wait here until you ___ back. (come)","answer":["come"],"explain":"Tương lai → mệnh đề *until* dùng hiện tại: until you **come** back.","src":"tr. 347"},{"type":"mcq","q":"Sit ___ you can see the board.","options":["where","which","what"],"answer":0,"explain":"**where** = ở chỗ mà: ngồi chỗ nhìn thấy bảng.","src":"tr. 346"},{"type":"fix","wrong":"When I will see him tomorrow, I'll tell him.","answer":["When I see him tomorrow, I'll tell him.","When I see him tomorrow, I will tell him."],"explain":"Mệnh đề *when* về tương lai → hiện tại: When I **see** him.","src":"tr. 347"},{"type":"mcq","q":"It ___ non-stop since we arrived.","options":["has rained","rains","rained"],"answer":0,"explain":"Mốc *since we arrived* → mệnh đề chính dùng **hiện tại hoàn thành**: has rained.","src":"tr. 348"},{"type":"mcq","q":"Câu nào đặt dấu phẩy đúng?","options":["If it rains, we'll stay at home.","If it rains we'll stay, at home.","If, it rains we'll stay at home."],"answer":0,"explain":"Mệnh đề trạng ngữ đứng trước → dấu phẩy đặt **ngay sau nó**, trước mệnh đề chính.","src":"tr. 346"},{"type":"fill","q":"Please wait until ___. (call; rút gọn bằng V3)","answer":["called"],"explain":"Sau *until* có thể dùng **phân từ quá khứ**: until **called** (= until you are called).","src":"tr. 348"},{"type":"mcq","q":"___ we were walking home, it started to snow.","options":["As","No sooner","Hardly"],"answer":0,"explain":"Việc đang kéo dài (đang đi bộ) bị việc khác xen vào → **As** + tiếp diễn.","src":"tr. 349"},{"type":"fill","q":"No sooner had she arrived ___ she started complaining.","answer":["than"],"explain":"**no sooner** đi cặp với **than**.","src":"tr. 350"},{"type":"mcq","q":"___ had I gone to bed when the phone rang.","options":["Scarcely","No sooner","As soon as"],"answer":0,"explain":"Có *when* ở vế sau và đảo ngữ *had I* → **Scarcely**. *No sooner* phải đi với *than*.","src":"tr. 350"},{"type":"mcq","q":"Chọn câu đúng:","options":["As the population grows, the city gets busier.","While the population grows, the city gets busier."],"answer":0,"explain":"Hai việc **cùng thay đổi dần** → **As**, không dùng *while*.","src":"tr. 349"},{"type":"fix","wrong":"Hardly the film had started when the power went off.","answer":["Hardly had the film started when the power went off.","Hardly had the film started before the power went off."],"explain":"*Hardly* đầu câu → đảo ngữ: **Hardly had the film started**…","src":"tr. 350"},{"type":"fill","q":"I'll phone you ___ soon as I get the results.","answer":["as"],"explain":"**as soon as** = ngay khi.","src":"tr. 350"},{"type":"classify","q":"while hay when?","buckets":["while","when"],"items":[{"text":"My dad read the paper ___ my mum cooked.","bucket":0},{"text":"Tom cleaned the kitchen ___ Anna did the laundry.","bucket":0},{"text":"___ I was a student, I lived in Hue.","bucket":1},{"text":"I'll buy a house ___ I'm forty.","bucket":1},{"text":"___ the meal was finished, we washed up.","bucket":1}],"explain":"Hai việc **song song** → while. **Tuổi, giai đoạn đời** và việc **nối tiếp** → when.","src":"tr. 349"},{"type":"mcq","q":"___ it was late, we took a taxi.","options":["As","Because of","Due to"],"answer":0,"explain":"Sau chỗ trống là mệnh đề → **As**.","src":"tr. 350"},{"type":"fill","q":"The game was cancelled ___ to the heavy rain.","answer":["due","owing"],"explain":"**due to / owing to** + danh từ.","src":"tr. 351"},{"type":"fill","q":"___ that the kids have grown up, we have more free time.","answer":["Now"],"explain":"**Now that** = vì giờ đây.","src":"tr. 351"},{"type":"fix","wrong":"He didn't come to class because of he was sick.","answer":["He didn't come to class because he was sick.","He didn't come to class as he was sick.","He didn't come to class since he was sick.","He didn't come to class because of being sick.","He didn't come to class because of the fact that he was sick.","He didn't come to class due to the fact that he was sick."],"explain":"*he was sick* là mệnh đề → **because** (hoặc *because of being sick*).","src":"tr. 351–352"},{"type":"mcq","q":"Chọn câu đúng:","options":["She was nervous, for it was her first interview.","For it was her first interview, she was nervous."],"answer":0,"explain":"Mệnh đề **for** đứng **sau** mệnh đề chính, có dấu phẩy trước.","src":"tr. 351"},{"type":"mcq","q":"The road was closed ___ an accident.","options":["owing to","since","as"],"answer":0,"explain":"*an accident* là danh từ → **owing to**.","src":"tr. 351"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["We","stayed","in","because","of","the","storm."],"explain":"*because of* + cụm danh từ.","src":"tr. 351"},{"type":"mcq","q":"She is ___ a good cook that everyone loves her food.","options":["such","so","very"],"answer":0,"explain":"*a good cook* = a + tính từ + danh từ → **such**.","src":"tr. 353"},{"type":"fill","q":"He has so ___ friends that he never feels lonely.","answer":["many"],"explain":"*friends* đếm được số nhiều → so **many**.","src":"tr. 352"},{"type":"mcq","q":"The shoes were ___ small for me to wear.","options":["too","so","enough"],"answer":0,"explain":"**too** + adj + for + O + to-V = quá… không thể.","src":"tr. 355"},{"type":"fix","wrong":"It was so a hot day that we stayed indoors.","answer":["It was so hot a day that we stayed indoors.","It was such a hot day that we stayed indoors.","It was so hot a day we stayed indoors.","It was such a hot day we stayed indoors."],"explain":"**so + tính từ + a + N**: so hot a day; hoặc **such a hot day**.","src":"tr. 353"},{"type":"fill","q":"Is he tall ___ to be a basketball player?","answer":["enough"],"explain":"Tính từ + **enough** + to-V.","src":"tr. 354"},{"type":"mcq","q":"Chọn câu đúng:","options":["The sofa is light enough to carry.","The sofa is light enough to carry it.","The sofa is enough light to carry."],"answer":0,"explain":"Chủ ngữ *the sofa* là thứ được mang → không lặp *it*; *enough* đứng sau tính từ.","src":"tr. 355"},{"type":"mcq","q":"___ terrible was the storm that many trees fell down.","options":["So","Such","Too"],"answer":0,"explain":"Nhấn mạnh: **So** + tính từ đầu câu + đảo ngữ động từ.","src":"tr. 353"},{"type":"classify","q":"so hay such?","buckets":["so","such"],"items":[{"text":"___ beautiful","bucket":0},{"text":"___ little money","bucket":0},{"text":"___ slowly","bucket":0},{"text":"___ a beautiful girl","bucket":1},{"text":"___ terrible news","bucket":1},{"text":"___ a lot of homework","bucket":1}],"explain":"**so** + tính từ/trạng từ, + little/much…; **such** + (a) + tính từ + danh từ, + a lot of. *news* không đếm được nên không có *a*.","src":"tr. 352–354"},{"type":"mcq","q":"Turn the music down ___ the neighbours won't complain.","options":["so that","in order to","for"],"answer":0,"explain":"Sau chỗ trống là mệnh đề có *won't* → **so that**.","src":"tr. 356"},{"type":"fill","q":"He jogs every morning so ___ to keep fit.","answer":["as"],"explain":"**so as to** + V.","src":"tr. 357"},{"type":"fix","wrong":"I came here for asking you a question.","answer":["I came here to ask you a question.","I came here in order to ask you a question.","I came here so as to ask you a question."],"explain":"Hành động cụ thể → **to-V**, không dùng *for + V-ing*.","src":"tr. 357"},{"type":"mcq","q":"I'll write the address down ___ I don't forget it.","options":["so","in order","so as"],"answer":0,"explain":"Lối nói thân mật bỏ được *that* sau **so**; không bỏ sau *in order*. *so as* phải đi với *to-V*.","src":"tr. 356"},{"type":"mcq","q":"They locked the gate ___ thieves should get in. (rất trang trọng)","options":["lest","so that","in order to"],"answer":0,"explain":"**lest** = so that… not: để đề phòng trộm vào. *so that thieves should get in* thành 'để trộm vào', ngược nghĩa.","src":"tr. 356"},{"type":"fill","q":"We stopped at a café ___ a cup of coffee.","answer":["for"],"explain":"**for + N** chỉ mục đích.","src":"tr. 357"},{"type":"mcq","q":"He opened the window ___ some fresh air to come in.","options":["for","so that","to"],"answer":0,"explain":"Việc 'vào' là của *fresh air* → **for + O + to-V**.","src":"tr. 358"},{"type":"mcq","q":"___ the bad weather, the plane landed safely.","options":["Despite","Although","However"],"answer":0,"explain":"*the bad weather* là danh từ → **Despite**.","src":"tr. 360"},{"type":"fill","q":"___ she is very clever, she failed the test. (mặc dù)","answer":["Although","Though","Even though","While"],"explain":"**Although / Though / Even though** (hoặc *While*) + S + V.","src":"tr. 358"},{"type":"mcq","q":"I'll always love you, ___ you do.","options":["whatever","however","whenever"],"answer":0,"explain":"Dù bạn làm **gì** → **whatever**.","src":"tr. 359"},{"type":"fix","wrong":"In spite of the fact that she was tired, but she went to the party.","answer":["In spite of the fact that she was tired, she went to the party.","She was tired, but she went to the party."],"explain":"Câu đã có *in spite of the fact that* thì không thêm *but* (hoặc bỏ cụm đầu, giữ *but*).","src":"tr. 359–360"},{"type":"mcq","q":"___ a beginner, she played very well. (= Although she was a beginner)","options":["Although","Despite of","But"],"answer":0,"explain":"Cùng chủ ngữ → rút gọn: **Although** (she was) a beginner. *Despite of* sai (despite không có of).","src":"tr. 358"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["No","matter","where","you","go,","I","will","follow","you."],"explain":"**No matter where** + S + V, mệnh đề chính.","src":"tr. 359"},{"type":"fix","wrong":"Despite she worked hard, she didn't get a raise.","answer":["Although she worked hard, she didn't get a raise.","Though she worked hard, she didn't get a raise.","Even though she worked hard, she didn't get a raise.","Despite working hard, she didn't get a raise.","Despite the fact that she worked hard, she didn't get a raise.","Despite the fact she worked hard, she didn't get a raise.","In spite of working hard, she didn't get a raise.","In spite of the fact that she worked hard, she didn't get a raise."],"explain":"*despite* không dẫn mệnh đề: dùng *Although*, *Despite working* hoặc *Despite the fact that*.","src":"tr. 360"},{"type":"mcq","q":"___ you pay me back next week, I'll lend you the money.","options":["Provided that","Unless","In case of"],"answer":0,"explain":"**Provided that** = miễn là.","src":"tr. 361"},{"type":"fill","q":"___ for your help, I would have failed.","answer":["But"],"explain":"**But for** + danh từ = nếu không có.","src":"tr. 362"},{"type":"mcq","q":"I'll take some sandwiches ___ I get hungry on the train.","options":["in case","unless","provided"],"answer":0,"explain":"Mang trước **phòng khi** đói → **in case**.","src":"tr. 361"},{"type":"mcq","q":"___ I rich, I would travel the world. (đảo ngữ = If I were rich)","options":["Were","Was","Had"],"answer":0,"explain":"Đảo ngữ bỏ *if*: **Were** + S + …","src":"tr. 361"},{"type":"fix","wrong":"He spends money as if he is a millionaire, but he's actually poor.","answer":["He spends money as if he were a millionaire, but he's actually poor.","He spends money as if he was a millionaire, but he's actually poor."],"explain":"Không thật ở hiện tại → lùi thì: as if he **were/was**.","src":"tr. 364–365"},{"type":"mcq","q":"Chọn câu đúng:","options":["As we agreed, I'll send you the report.","Like we agreed, I'll send you the report."],"answer":0,"explain":"Điều đã thoả thuận → **As** we agreed.","src":"tr. 363"},{"type":"fill","q":"She ran off ___ if escaping from danger.","answer":["as"],"explain":"**as if** + V-ing (rút gọn, cùng chủ ngữ).","src":"tr. 365"}]]}},{"id":"04-wish-if-only","title":"Mệnh đề sau Wish và If only","en":"Clauses after wish and if only","icon":"🌠","pages":"383–388","summary":"Sau **wish** (ước gì) và **if only** (giá mà), động từ lùi thì để báo hiệu 'điều này không có thật'. Chủ đề này dạy bạn ba loại ước: **tương lai** (would + V), **hiện tại** (V2, were, could) và **quá khứ** (had V3, could have V3); khi nào phải dùng **hope** thay cho wish; và cách dùng If only đứng một mình hoặc trong câu điều kiện.","mindmap":{"label":"Wish / If only","children":[{"label":"Ước tương lai","icon":"🔮","children":[{"label":"S khác + would + V"},{"label":"Mình → could; tình trạng → V2"}]},{"label":"Ước hiện tại","icon":"🌙","children":[{"label":"V2: I wish I had…"},{"label":"be → was / were"},{"label":"can't → could + V"}]},{"label":"Ước quá khứ","icon":"🕰️","children":[{"label":"had + V3"},{"label":"could have + V3"}]},{"label":"If only","icon":"✨","children":[{"label":"Mạnh, rõ ràng hơn wish"},{"label":"Đứng một mình / vế điều kiện"}]},{"label":"Lưu ý","icon":"⚠️","children":[{"label":"Có thể xảy ra → hope"},{"label":"wished: không đổi thì"}]}]},"lessons":[{"id":"04a","title":"Ước ở hiện tại và tương lai; wish hay hope","minutes":25,"goal":"Viết đúng câu ước sau wish / if only cho hiện tại (quá khứ đơn, were, could) và cho tương lai (would + V); biết khi nào phải dùng hope thay cho wish.","pretest":[{"type":"mcq","q":"I'm short. I wish I ___ taller.","options":["were","am","will be"],"answer":0,"explain":"Thực tế: tôi thấp (hiện tại). Ước điều ngược với hiện tại thì **lùi thì**: am → **were/was**. *am* là thực tế, không phải điều ước.","src":"tr. 384"},{"type":"mcq","q":"It's raining. I wish it ___ stop.","options":["would","will","can"],"answer":0,"explain":"Mong một việc **sắp xảy ra** (trời tạnh) → wish + S + **would** + V. Sau wish không dùng will hay can.","src":"tr. 383"},{"type":"mcq","q":"Good luck tomorrow! I ___ you pass your exam.","options":["hope","wish"],"answer":0,"explain":"Thi đỗ là chuyện **có thể** xảy ra → dùng **hope**. wish chỉ dành cho điều không có thật hoặc khó thành.","src":"tr. 384"}],"hook":{"icon":"🌠","text":"Khi thấy **sao băng**, người ta ước một điều mình **chưa có**. Tiếng Việt chỉ cần thêm 'ước gì': 'Ước gì tôi giàu'. Tiếng Anh làm khác: sau **wish**, động từ **lùi về quá khứ** để báo hiệu 'điều này không có thật': *I wish I **was** rich.* Thì quá khứ ở đây không nói về hôm qua, mà nói 'tiếc là không phải vậy'. Bài này dạy hai loại ước: cho **hiện tại** và cho **tương lai**, và lúc nào thì phải đổi sang **hope**."},"diagram":{"type":"flow","title":"Mong điều gì? Chọn hope hay wish + dạng nào","start":{"q":"Điều bạn mong có thể xảy ra không?","branches":[{"label":"Có thể, nhiều khả năng","to":{"result":"hope + hiện tại: I hope you pass.","icon":"🤞"}},{"label":"Không có thật / khó thành","to":{"q":"Bạn ước điều gì?","branches":[{"label":"Một tình trạng bây giờ","to":{"result":"V2 / were: I wish I had a car.","icon":"🌙"}},{"label":"Mình làm được việc gì","to":{"result":"could + V: I wish I could swim.","icon":"💪"}},{"label":"Người/vật khác làm, thay đổi","to":{"result":"would + V: I wish it would stop.","icon":"🔮"}}]}}]}},"chunks":[{"title":"Ước điều trái với hiện tại: V2","icon":"🌙","rule":"Ước điều **không có thật ở hiện tại**: **S + wish(es) / If only + S + V quá khứ đơn (V2)**.","explain":"**Wish** = 'ước gì, mong'; **if only** = 'ước gì, giá mà' (mạnh hơn và rõ ràng hơn wish). Phần đứng sau là một mệnh đề nói điều **ngược với thực tế**; sách xếp nó là mệnh đề danh ngữ (noun clause). Tiếng Việt không đổi động từ: 'tôi biết' → 'ước gì tôi biết'. Tiếng Anh phải **lùi thì**: thực tế là hiện tại (know, live, don't need) → sau wish dùng quá khứ (knew, lived, didn't need). Thì quá khứ này **không** có nghĩa 'hôm qua'; nó là dấu hiệu 'không có thật'. Chủ ngữ ngôi 3 số ít thì nói *she **wishes***. Việc **đang diễn ra** thì lùi thành was/were + V-ing: *I wish I were lying on a beach.* (bài tập sách tr. 386). Ước hiện tại cũng dùng cho việc **không thể làm** ở hiện tại hay tương lai.","formula":"S + wish(es) + S + V2\nIf only + S + V2!","examples":[{"en":"I **wish** you **lived** close by.","vi":"Ước gì anh sống gần đây. (thực tế: anh không sống gần đây)"},{"en":"I **wish** we **didn't need** to work today.","vi":"Ước gì hôm nay chúng ta không phải đi làm."},{"en":"**If only** I **knew** more about European history!","vi":"Giá mà tôi biết nhiều hơn về lịch sử châu Âu!"},{"en":"I wish I have a car.","ok":false,"note":"phải lùi thì: had"}],"mistake":{"wrong":"I wish I know her phone number.","right":"I wish I knew her phone number.","why":"Ước điều trái với hiện tại thì lùi về quá khứ đơn: know → **knew**."},"tip":"Thực tế **lùi một bậc**: know → knew, don't → didn't, am → was/were.","src":"tr. 383–384","check":{"type":"fill","q":"I don't have a car. I wish I ___ a car. (have)","answer":["had"],"explain":"Thực tế 'không có xe' ở hiện tại → sau wish lùi về quá khứ đơn: have → **had**.","src":"tự soạn"}},{"title":"Was hay were? Could cho việc không làm được","icon":"💪","rule":"Ước hiện tại với **be**: I/he/she/it dùng **was** hoặc **were** (were trang trọng hơn); thực tế 'không thể' thì dùng **could + V**, **không** dùng would.","explain":"Với I, he, she, it bạn nói *was* hoặc *were* đều được; sách nói *were* hay dùng 'nhất là trong lối văn trang trọng'. Với you, we, they thì chỉ có *were*. Nếu thực tế là **can't** (không thể), sau wish lùi thành **could**: I can't swim → I wish I **could** swim. Sách nhấn mạnh: **would không dùng để diễn đạt ước muốn ở hiện tại**; *If only I would speak the language* là sai.","formula":"I / he / she / it + was / were\nyou / we / they + were\ncan't → wish + S + could + V","examples":[{"en":"I wish I **was / were** taller. I might be better at basketball.","vi":"Ước gì tôi cao hơn, tôi có thể chơi bóng rổ hay hơn."},{"en":"**If only** Ben **was / were** here.","vi":"Giá mà có Ben ở đây. (thực tế: anh ấy không ở đây)"},{"en":"I wish we **could** go to the party tonight.","vi":"Ước gì tối nay chúng tôi có thể đến dự tiệc. (nhưng chúng tôi bận)"},{"en":"I feel so helpless. **If only** I **could** speak the language.","vi":"Tôi thấy mình thật vô dụng. Giá mà tôi nói được thứ tiếng đó."},{"en":"If only I would speak the language.","ok":false,"note":"ước hiện tại: dùng could, không dùng would"}],"mistake":{"wrong":"I wish I can speak French.","right":"I wish I could speak French.","why":"Sau wish phải lùi thì: can → **could**."},"tip":"Không làm được (**can't**) → ước bằng **could**. Gặp be → **were** dùng được cho mọi ngôi.","src":"tr. 384","check":{"type":"mcq","q":"She can't drive. She wishes she ___ drive.","options":["could","can","would"],"answer":0,"explain":"Thực tế **can't** → sau wish dùng **could**. *can* không lùi thì; *would* không dùng cho ước hiện tại và cũng không đi với chủ ngữ trùng với wish.","src":"tr. 384"}},{"title":"Ước ở tương lai: would + V","icon":"🔮","rule":"Mong một việc **xảy ra** hoặc mong **người khác làm** gì: **S + wish(es) / If only + S + would (not) + V nguyên mẫu**.","explain":"Dùng khi bạn mong một **hành động** hay **sự thay đổi** sắp tới: mưa tạnh, hàng xóm bớt ồn, bạn sớm trả lời email. Sách có hai lưu ý:\n1. Chủ ngữ của wish **không trùng** với chủ ngữ của would: không nói *I wish I would…*; nói về chính mình thì dùng **could**: I wish I could attend your wedding next week.\n2. *wish … would* chỉ dùng cho **hành động, sự thay đổi**; **không** dùng would cho một **tình trạng**: My life isn't interesting → I wish my life **was** more interesting (không phải *would be*).","formula":"S + wish(es) + S khác + would (not) + V\nIf only + S + would (not) + V!","examples":[{"en":"I wish it **would stop** raining.","vi":"Ước gì trời tạnh mưa."},{"en":"I wish Simon **would reply** to my emails soon.","vi":"Ước gì Simon sớm trả lời email của tôi."},{"en":"Tom wishes his neighbors **wouldn't make** so much noise.","vi":"Tom ước những người hàng xóm không ồn ào như thế."},{"en":"**If only** Jane **would take** the trip with me next Sunday.","vi":"Giá mà Chủ nhật tới Jane đi du lịch cùng tôi."},{"en":"I wish something exciting **would happen**.","vi":"Tôi mong điều gì đó thú vị sẽ xảy ra."},{"en":"I wish I would attend your wedding next week.","ok":false,"note":"trùng chủ ngữ: I wish I could attend"},{"en":"I wish my life would be more interesting.","ok":false,"note":"tình trạng: I wish my life was…"}],"mistake":{"wrong":"I wish my room would be bigger.","right":"I wish my room was / were bigger.","why":"'To' là **tình trạng**, không phải hành động → dùng V2 (was/were), không dùng would."},"tip":"**would** = mong **ai đó / cái gì** **làm** gì. Chính mình → **could**. Tình trạng → **V2**.","src":"tr. 383","check":{"type":"mcq","q":"It's been raining all week. I wish it ___ stop.","options":["would","will","stops"],"answer":0,"explain":"Mong một việc sắp xảy ra (mưa tạnh) → **would** + V nguyên mẫu. Sau wish không dùng will; *stops* sai vì sau would/wish ở đây cần V nguyên mẫu.","src":"tr. 383"}},{"title":"Wish hay hope?","icon":"🤞","rule":"Điều **có thể** hoặc **nhiều khả năng** xảy ra → dùng **hope** và **không lùi thì**; **wish** chỉ dành cho điều không có thật, khó thành.","explain":"Chúc bạn thi đỗ, mong mai trời nắng: đó là chuyện **có thể** xảy ra, nên dùng **hope**, và động từ phía sau giữ thì hiện tại như ví dụ của sách: I hope you **pass** (không phải *passed*). So sánh:\n- I **hope** you pass. (có thể đỗ lắm)\n- I **wish** I was taller. (không thể cao thêm)","formula":"hope + S + V hiện tại (có thể xảy ra)\nwish + S + V lùi thì (không có thật)","diagram":{"type":"table","title":"hope và wish","head":["","hope","wish"],"rows":[["Điều mong","Có thể xảy ra","Không có thật / khó thành"],["Động từ sau","Giữ thì: pass, is","Lùi thì: were, could, would"],["Ví dụ","I hope you pass.","I wish I were rich."]]},"examples":[{"en":"I **hope** you **pass** your exams.","vi":"Mong anh sẽ thi đỗ."},{"en":"I **hope** it**'s** sunny tomorrow.","vi":"Mong ngày mai trời sẽ nắng."},{"en":"I wish you passed your exams.","ok":false,"note":"chuyện có thể xảy ra → hope"},{"en":"I wish it was sunny tomorrow.","ok":false,"note":"dùng I hope it's sunny tomorrow"}],"mistake":{"wrong":"I wish you would pass your exams.","right":"I hope you pass your exams.","why":"Thi đỗ là chuyện có thể xảy ra → **hope** + thì hiện tại, không dùng wish."},"tip":"Có thể thành → **hope**. Chỉ là mơ → **wish**.","src":"tr. 384","check":{"type":"mcq","q":"Your exam is tomorrow. I ___ you do well!","options":["hope","wish"],"answer":0,"explain":"Làm bài tốt là chuyện **có thể** xảy ra → **hope**. *I wish you do well* sai vì wish không dùng cho điều có thể xảy ra.","src":"tr. 384"}}],"practice":[{"type":"classify","q":"Mỗi điều ước sau dùng dạng nào sau wish?","buckets":["would + V","V2 / were"],"items":[{"text":"Mong hàng xóm bớt ồn","bucket":0},{"text":"Tiếc là nhà mình nhỏ","bucket":1},{"text":"Mong mưa tạnh","bucket":0},{"text":"Tiếc là anh ấy không ở đây","bucket":1},{"text":"Mong bạn trả lời tin nhắn","bucket":0},{"text":"Tiếc là trời lạnh","bucket":1}],"explain":"Mong **ai đó / cái gì làm, thay đổi** (hàng xóm bớt ồn, mưa tạnh, bạn trả lời) → **would + V**. Tiếc về **tình trạng** hiện tại (nhà nhỏ, anh ấy không ở đây, trời lạnh) → **V2 / were**; would không đi với tình trạng.","src":"tr. 383–384"},{"type":"mcq","q":"I live in a tiny flat. I wish I ___ in a bigger one.","options":["lived","live","would live"],"answer":0,"explain":"Tình trạng hiện tại trái ý → **V2: lived**. *live* là thì của thực tế; *would live* sai vì would không dùng cho tình trạng và không trùng chủ ngữ với wish.","src":"tr. 384"},{"type":"mcq","q":"I wish you ___ smoking in the house. It's bothering me.","options":["would stop","stop","will stop"],"answer":0,"explain":"Mong **người khác** thôi làm một việc → wish + S + **would** + V. Sau wish không dùng hiện tại (*stop*) hay will.","src":"tr. 383"},{"type":"mcq","q":"Have a safe flight! I ___ you get there on time.","options":["hope","wish"],"answer":0,"explain":"Đến nơi đúng giờ là chuyện **có thể** xảy ra → **hope** + hiện tại (get). wish chỉ cho điều không có thật.","src":"tr. 384"},{"type":"fill","q":"I'm so tired. I wish I ___ go to work today. (not / have to)","answer":["didn't have to","did not have to"],"explain":"Thực tế: tôi **phải** đi làm (have to). Ước ngược lại → lùi về quá khứ đơn phủ định: **didn't have to**.","src":"tr. 384"},{"type":"fill","q":"Tom isn't here. If only he ___ here! (be)","answer":["was","were"],"explain":"Thực tế ở hiện tại 'isn't' → sau if only dùng **was** hoặc **were** (were trang trọng hơn).","src":"tr. 384"},{"type":"fill","q":"The music next door is too loud. I wish the neighbours ___ it down. (turn)","answer":["would turn"],"explain":"Mong **người khác làm** một việc (vặn nhỏ nhạc) → **would + V nguyên mẫu**: would turn.","src":"tr. 383","hint":"mong họ làm gì"},{"type":"fix","wrong":"I wish I am a little richer.","answer":["I wish I was a little richer.","I wish I were a little richer."],"explain":"Ước điều trái với hiện tại → lùi thì: am → **was / were**.","src":"tr. 384"},{"type":"fix","wrong":"I wish I would visit you next week.","answer":["I wish I could visit you next week."],"explain":"Chủ ngữ của wish và would không được trùng nhau (I … I). Nói về chính mình → **could**.","src":"tr. 383"},{"type":"fix","wrong":"I hope you passed your exam tomorrow.","answer":["I hope you pass your exam tomorrow.","I hope you will pass your exam tomorrow."],"explain":"Sau **hope** không lùi thì: chuyện có thể xảy ra ngày mai → **pass** (hoặc will pass), không phải passed.","src":"tr. 384"},{"type":"fix","wrong":"I wish my house would be bigger.","answer":["I wish my house was bigger.","I wish my house were bigger."],"explain":"'To' là **tình trạng** → dùng V2 (was / were); would chỉ dùng cho hành động, sự thay đổi.","src":"tr. 383"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["If","only","I","could","speak","Japanese!"],"explain":"If only + S + **could** + V: ước làm được việc mà hiện tại mình không làm được.","src":"tự soạn"}],"flashcards":[{"front":"Ước điều trái với hiện tại: động từ sau wish chia thế nào?","back":"**Quá khứ đơn (V2)**: I wish I **had** a car."},{"front":"wish + be với I / he / she / it?","back":"**was** hoặc **were** (were trang trọng hơn): I wish I were taller."},{"front":"Thực tế 'can't' → sau wish dùng gì?","back":"**could + V**: I wish I could swim."},{"front":"Mong người khác làm gì / việc gì xảy ra?","back":"wish + S + **would + V**: I wish it would stop raining."},{"front":"Có nói 'I wish I would…' được không?","back":"**Không.** Chính mình → could: I wish I could come."},{"front":"Tình trạng có dùng would sau wish được không?","back":"**Không**: I wish my life **was** more interesting (không phải would be)."},{"front":"Điều có thể xảy ra: wish hay hope?","back":"**hope** + hiện tại: I hope you pass your exams."}]},{"id":"04b","title":"Ước ở quá khứ và If only","minutes":25,"goal":"Diễn tả sự hối tiếc về quá khứ bằng wish / if only + had V3 hoặc could have V3; dùng If only đứng một mình hay trong câu điều kiện; biết wished không làm đổi thì phía sau.","pretest":[{"type":"mcq","q":"I didn't study, and I failed. I wish I ___ harder.","options":["had studied","studied","would study"],"answer":0,"explain":"Chuyện **đã qua** (đã không học, đã trượt) → wish + **had + V3**. *studied* chỉ dành cho ước hiện tại.","src":"tr. 384–385"},{"type":"mcq","q":"So với wish, If only:","options":["mạnh hơn và rõ ràng hơn","nhẹ nhàng, lịch sự hơn","chỉ dùng cho tương lai"],"answer":0,"explain":"Sách: if only (ước gì, giá mà) **mạnh hơn và rõ ràng hơn** wish, và dùng được cho cả tương lai, hiện tại, quá khứ.","src":"tr. 383"}],"hook":{"icon":"🕰️","text":"Ai cũng có lúc nghĩ 'Giá mà hôm qua mình…'. Đó là **hối tiếc**: việc đã qua, không đổi được nữa. Tiếng Anh nói hối tiếc bằng cách **lùi thì thêm một bậc**: thực tế ở quá khứ (*I failed*) → sau wish dùng **quá khứ hoàn thành** (*I wish I **hadn't failed***). Bài này cũng cho bạn thấy **If only** mạnh hơn wish thế nào, và ghép cả ba loại ước (tương lai, hiện tại, quá khứ) vào một bảng."},"diagram":{"type":"table","title":"Ba loại ước sau wish / if only","head":["Ước về","Thực tế","Sau wish / if only"],"rows":[["Tương lai","It won't stop raining.","would + V: it would stop"],["Hiện tại","I'm poor. / I can't swim.","V2 / were / could + V"],["Quá khứ","I failed. / I couldn't go.","had V3 / could have V3"]]},"chunks":[{"title":"Ước ở quá khứ: had + V3","icon":"🕰️","rule":"Ước điều **đã không xảy ra**, hoặc hối tiếc điều đã xảy ra: **S + wish(es) / If only + S + had (not) + V3** (quá khứ hoàn thành).","explain":"Thực tế ở quá khứ đơn (*I failed*, *she didn't go*) → sau wish lùi thêm một bậc thành **quá khứ hoàn thành** (had + V3): I wish I **hadn't failed**; she wishes she **had gone**. Tiếng Việt chỉ thêm 'giá mà… đã…'; tiếng Anh phải đổi hình thức động từ. Dấu hiệu hay gặp: yesterday, last night, last year, 'tiếc là đã…'. V3 là quá khứ phân từ (go → gone, meet → met, eat → eaten).","formula":"S + wish(es) + S + had (not) + V3\nIf only + S + had (not) + V3!","examples":[{"en":"I wish I **hadn't failed** my exam last year.","vi":"Giá như năm ngoái tôi không thi rớt. (thực tế: tôi đã thi rớt)"},{"en":"Now she **wishes** she **had gone** to university.","vi":"Lúc này cô ấy ước mình đã học đại học. (thực tế: cô ấy đã không học)"},{"en":"**If only** I **had met** her yesterday.","vi":"Giá như hôm qua tôi đã gặp cô ấy."},{"en":"**If only** I **had studied** harder!","vi":"Phải chi tôi học hành chăm chỉ hơn!"},{"en":"I wish I didn't fail my exam last year.","ok":false,"note":"việc đã qua → hadn't failed"}],"mistake":{"wrong":"I wish I went to the party last night.","right":"I wish I had gone to the party last night.","why":"last night là quá khứ → lùi về **quá khứ hoàn thành**; went chỉ dùng cho ước hiện tại."},"tip":"Quá khứ thật → thêm **had**: went → had gone, didn't go → hadn't gone.","src":"tr. 384–385","check":{"type":"fill","q":"I didn't bring my umbrella, and I got wet. I wish I ___ it. (bring)","answer":["had brought","could have brought"],"explain":"Việc đã qua (đã không mang ô) → **had + V3**: had brought (bring → brought).","src":"tự soạn"}},{"title":"could have + V3: tiếc vì đã không thể","icon":"🚪","rule":"Có thể dùng **could have + V3** để ước về quá khứ, nhất là việc lúc đó bạn **không thể** làm.","explain":"Thực tế: *I couldn't go / I was in another city*. Sau wish: I wish I **could have** + V3. Đây là bản quá khứ của 'I wish I could…' ở bài trước. So sánh:\n- I wish I **could** come. (bây giờ / sắp tới không đến được)\n- I wish I **could have** come. (lúc trước đã không đến được)\nSau could have luôn là **V3**, không phải V2.","formula":"S + wish(es) + S + could have + V3","examples":[{"en":"I wish I **could have been** at the wedding, but I was in New York.","vi":"Giá như tôi đã có thể dự đám cưới nhỉ, nhưng lúc đó tôi đang ở New York."},{"en":"She wishes she **could have said** goodbye to him.","vi":"Cô ấy ước giá mà mình đã có thể chào tạm biệt anh ấy."},{"en":"I wish I could have went with you.","ok":false,"note":"could have + V3: gone"}],"mistake":{"wrong":"I wish I could go to your party last week.","right":"I wish I could have gone to your party last week.","why":"last week là quá khứ → **could have + V3**; could + V chỉ dành cho hiện tại / tương lai."},"tip":"**could** (bây giờ) → **could have V3** (hồi đó).","src":"tr. 385","check":{"type":"mcq","q":"I was ill, so I missed the match. I wish I ___ it.","options":["could have watched","could watch","can watch"],"answer":0,"explain":"Trận đấu đã qua, lúc đó không xem được → **could have + V3**. *could watch* chỉ dùng cho hiện tại/tương lai; *can* không lùi thì.","src":"tr. 385"}},{"title":"If only: mạnh hơn, đứng một mình hoặc trong câu điều kiện","icon":"✨","rule":"**If only** = 'ước gì, giá mà': chia thì **giống hệt wish** nhưng **mạnh hơn, rõ ràng hơn**; mệnh đề If only có thể **đứng một mình** hoặc **nằm trong câu điều kiện**.","explain":"Đứng một mình, If only thường là câu cảm thán: *If only I had studied harder!* Trong câu điều kiện, nó làm vế 'nếu' nói về điều không có thật, vế sau dùng would: *If only I weren't so fat, I would be able to get into this dress.* Sau If only, động từ chia như sau wish: tương lai → would + V, hiện tại → V2 / were, quá khứ → had V3.","formula":"If only + S + would V / V2 / had V3!\nIf only + S + V2, S + would + V.","examples":[{"en":"**If only** I **wasn't / weren't** so fat.","vi":"Giá mà tôi không quá mập."},{"en":"**If only** I **weren't** so fat, I **would** be able to get into this dress.","vi":"Giá như tôi không quá mập thì tôi đã có thể mặc vừa chiếc váy này."},{"en":"**If only** David **had been** a bit more careful, he'd have been all right.","vi":"Giá như David cẩn thận hơn một chút thì anh ta đã bình yên vô sự rồi."},{"en":"**If only** it **would stop** raining.","vi":"Giá mà trời tạnh mưa."},{"en":"If only I am not so busy!","ok":false,"note":"phải lùi thì: wasn't / weren't"}],"mistake":{"wrong":"If only I have more time!","right":"If only I had more time!","why":"Sau If only cũng phải lùi thì như sau wish: have → **had**."},"tip":"wish = 'ước gì'; **If only** = 'giá mà…!' (cảm xúc mạnh hơn). Cách chia thì y hệt.","src":"tr. 383, 385","check":{"type":"fill","q":"I'm so busy. If only I ___ more free time! (have)","answer":["had"],"explain":"Ước điều trái với hiện tại → V2: have → **had**. If only chia thì giống wish.","src":"tự soạn"}},{"title":"wished: wish ở quá khứ không làm đổi thì","icon":"🧭","rule":"Khi **wish** chia ở quá khứ (**wished**), mệnh đề sau nó **giữ nguyên** thì giả định: He wishes / **wished** he **knew** her address.","explain":"Ở chương phối hợp thì, động từ chính ở quá khứ thường kéo mệnh đề sau lùi thì. Với wish thì **không**: dù là *wishes* hay *wished*, ước điều trái với lúc đó vẫn dùng V2 (knew, could), ước về tương lai vẫn dùng would. Hãy nhìn vào **điều ước nói về lúc nào**, không nhìn vào wish. Sơ đồ dưới đây là cách chọn cho mọi câu ước.","diagram":{"type":"flow","title":"Điều ước nói về lúc nào?","start":{"q":"Điều ước nói về lúc nào?","branches":[{"label":"Tương lai: mong ai làm gì","to":{"result":"would + V (chủ ngữ khác)","icon":"🔮"}},{"label":"Hiện tại: tình trạng","to":{"result":"V2 / were / could + V","icon":"🌙"}},{"label":"Quá khứ: việc đã qua","to":{"result":"had V3 / could have V3","icon":"🕰️"}}]}},"examples":[{"en":"He **wishes** he **knew** her address.","vi":"Anh ta ước gì mình biết địa chỉ của cô ấy."},{"en":"He **wished** he **knew** her address.","vi":"Anh ta (lúc đó) ước gì mình biết địa chỉ của cô ấy."},{"en":"Last year Mai **wished** she **lived** near the sea.","vi":"Năm ngoái Mai ước gì mình sống gần biển."}],"mistake":{"wrong":"She wished she can fly.","right":"She wished she could fly.","why":"Sau wish / wished không dùng can; ước khả năng → **could**."},"tip":"Nhìn vào **điều ước**, không nhìn vào wish: wishes hay wished thì 'biết lúc đó' vẫn là **knew**.","src":"tr. 385","check":{"type":"mcq","q":"When I was a child, I often wished I ___ fly.","options":["could","can","will"],"answer":0,"explain":"wished không làm đổi thì giả định: ước khả năng → **could**. can và will không dùng sau wish.","src":"tr. 385"}}],"practice":[{"type":"classify","q":"Điều tiếc này nói về hiện tại hay quá khứ?","buckets":["Hiện tại → V2","Quá khứ → had V3"],"items":[{"text":"Tiếc là bây giờ tôi không biết đáp án","bucket":0},{"text":"Tiếc là hôm qua tôi không đi","bucket":1},{"text":"Tiếc là tôi không có xe","bucket":0},{"text":"Tiếc là tôi đã ăn quá nhiều kem","bucket":1},{"text":"Tiếc là tôi sống xa bố mẹ","bucket":0},{"text":"Tiếc là năm ngoái tôi không học tiếng Anh","bucket":1}],"explain":"Tình trạng **bây giờ** (không biết, không có xe, sống xa) → **V2**. Việc **đã qua** (hôm qua, đã ăn, năm ngoái) → **had + V3**.","src":"tr. 384"},{"type":"mcq","q":"I ate too much cake at the party. I wish I ___ so much.","options":["hadn't eaten","didn't eat","wouldn't eat"],"answer":0,"explain":"Việc đã xảy ra ở bữa tiệc (quá khứ) → **hadn't + V3**. *didn't eat* là dạng ước hiện tại; *wouldn't eat* là ước tương lai.","src":"tr. 384"},{"type":"mcq","q":"If only you ___ me the truth yesterday!","options":["had told","told","would tell"],"answer":0,"explain":"yesterday → quá khứ → If only + **had + V3**. *told* chỉ dùng cho ước hiện tại.","src":"tr. 385"},{"type":"mcq","q":"I was working, so I missed your birthday party. I wish I ___ there.","options":["could have been","could be","can be"],"answer":0,"explain":"Bữa tiệc đã qua, lúc đó không thể đến → **could have + V3** (been). *could be* nói về hiện tại.","src":"tr. 385"},{"type":"fill","q":"We missed the train. If only we ___ home earlier! (leave)","answer":["had left"],"explain":"Lỡ tàu là việc đã qua → If only + **had + V3**: leave → left → **had left**.","src":"tr. 385"},{"type":"fill","q":"She didn't take the job, and now she regrets it. She wishes she ___ it. (take)","answer":["had taken"],"explain":"Việc đã qua (đã không nhận việc) → **had + V3**: take → **taken**. Chủ ngữ she thì wish thêm -es: wishes.","src":"tr. 384"},{"type":"mcq","q":"Last winter Lan was freezing. She wished she ___ a warmer coat with her.","options":["had","has","will have"],"answer":0,"explain":"wished không làm đổi thì: ước điều trái với thực tế lúc đó → **V2: had**. has và will have là thì của thực tế, không dùng sau wish.","src":"tr. 385"},{"type":"fix","wrong":"I wish I didn't shout at my sister yesterday.","answer":["I wish I hadn't shouted at my sister yesterday.","I wish I had not shouted at my sister yesterday."],"explain":"yesterday → việc đã qua → **hadn't + V3**: hadn't shouted.","src":"tr. 384"},{"type":"fix","wrong":"If only I have listened to you!","answer":["If only I had listened to you!"],"explain":"Ước về quá khứ dùng quá khứ hoàn thành: **had** listened, không phải have listened.","src":"tr. 385"},{"type":"fix","wrong":"I wish I could see the fireworks last night.","answer":["I wish I could have seen the fireworks last night.","I wish I had seen the fireworks last night."],"explain":"last night → quá khứ → **could have + V3** (could have seen), hoặc had seen.","src":"tr. 385"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["If","only","I","hadn't","lost","my","phone!"],"explain":"If only + S + **hadn't + V3**: hối tiếc vì đã làm mất điện thoại.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["She","wishes","she","had","studied","medicine."],"explain":"S + wishes + S + **had + V3**: cô ấy tiếc vì đã không học y.","src":"tự soạn"}],"flashcards":[{"front":"Ước ở quá khứ: sau wish chia thế nào?","back":"**had + V3**: I wish I had studied harder."},{"front":"Tiếc vì hồi đó không thể làm gì?","back":"**could have + V3**: I wish I could have been at the wedding."},{"front":"If only khác wish ở điểm nào?","back":"'Giá mà', **mạnh hơn, rõ ràng hơn**; chia thì giống hệt wish."},{"front":"Mệnh đề If only đứng ở đâu?","back":"**Đứng một mình** (If only I had more time!) hoặc **trong câu điều kiện**: If only I weren't so fat, I would…"},{"front":"wished có làm đổi thì phía sau không?","back":"**Không**: He wished he **knew** her address."},{"front":"Ba loại ước: tương lai / hiện tại / quá khứ?","back":"**would + V** / **V2, were, could** / **had V3, could have V3**"}]}],"quiz":{"pass":0.8,"sets":[[{"type":"mcq","q":"I don't speak Spanish. I wish I ___ Spanish.","options":["spoke","speak","would speak"],"answer":0,"explain":"Trái với hiện tại → V2: **spoke**. *would speak* sai vì chủ ngữ trùng với wish (I … I).","src":"tr. 384"},{"type":"mcq","q":"My sister lives in Canada. I wish she ___ nearer.","options":["lived","lives","would live"],"answer":0,"explain":"Sống ở đâu là **tình trạng** hiện tại → V2: **lived**. would không dùng cho tình trạng.","src":"tr. 383–384"},{"type":"mcq","q":"The baby keeps crying. I wish she ___ go to sleep.","options":["would","will","is going to"],"answer":0,"explain":"Mong **người khác** làm một việc sắp tới → **would** + V. Sau wish không dùng will / be going to.","src":"tr. 383"},{"type":"mcq","q":"I'm stuck in a traffic jam. I wish the traffic ___ moving.","options":["would start","will start","starts"],"answer":0,"explain":"Mong một **sự thay đổi** sắp xảy ra → **would + V**. Không dùng will hay hiện tại sau wish.","src":"tr. 383"},{"type":"mcq","q":"Have a good holiday! I ___ the weather is nice for you.","options":["hope","wish"],"answer":0,"explain":"Thời tiết đẹp là chuyện **có thể** xảy ra → **hope** + hiện tại (is).","src":"tr. 384"},{"type":"mcq","q":"I ___ I were on holiday right now.","options":["wish","hope"],"answer":0,"explain":"*were* cho thấy điều **không có thật** (đang không đi nghỉ) → **wish**. Sau hope không lùi thì.","src":"tr. 384"},{"type":"mcq","q":"We can't afford a new car. I wish we ___ buy one.","options":["could","can","would"],"answer":0,"explain":"Thực tế can't → **could**. *would* không dùng cho ước hiện tại và không đi với chủ ngữ trùng (we … we).","src":"tr. 384"},{"type":"mcq","q":"He failed his driving test last week. He wishes he ___ more lessons.","options":["had taken","took","would take"],"answer":0,"explain":"last week → việc đã qua → **had + V3**: had taken. *took* là ước hiện tại.","src":"tr. 384"},{"type":"mcq","q":"I wish I ___ to my mum's advice. She was right.","options":["had listened","listened","would listen"],"answer":0,"explain":"'She was right' → chuyện đã qua, tôi đã không nghe lời → **had listened**.","src":"tr. 384"},{"type":"mcq","q":"Chọn câu đúng:","options":["I wish I would be taller.","I wish I were taller.","I wish I am taller."],"answer":1,"explain":"Chiều cao là **tình trạng** hiện tại → V2 / were. *would be* sai (tình trạng, trùng chủ ngữ); *am* không lùi thì.","src":"tr. 383–384"},{"type":"mcq","q":"If only ___ more time to finish the test yesterday!","options":["I had had","I had","I would have"],"answer":0,"explain":"yesterday → quá khứ → had + V3. V3 của have là **had**, nên thành **had had**. *I had* chỉ là ước hiện tại.","src":"tr. 384–385"},{"type":"mcq","q":"My grandfather died before I was born. I wish I ___ him.","options":["could have met","could meet","can meet"],"answer":0,"explain":"Việc không thể xảy ra trong quá khứ → **could have + V3**: could have met. *could meet* nói về hiện tại.","src":"tr. 385"},{"type":"mcq","q":"When we lived in the city, we often wished we ___ a garden.","options":["had","have","will have"],"answer":0,"explain":"wished **không** làm đổi thì: ước điều trái với thực tế lúc đó → V2 **had**.","src":"tr. 385"},{"type":"mcq","q":"Câu nào dùng hope đúng?","options":["I hope I were a bird.","I hope you get the job.","I hope I had studied harder."],"answer":1,"explain":"**hope** cho điều **có thể** xảy ra và không lùi thì → *I hope you get the job.* Hai câu kia là điều không có thật → phải dùng wish.","src":"tr. 384"},{"type":"mcq","q":"'I wish I hadn't sold my old guitar.' nghĩa là:","options":["Tôi đã bán cây đàn và giờ thấy tiếc","Tôi chưa bán cây đàn","Tôi sắp bán cây đàn"],"answer":0,"explain":"wish + **had(n't) + V3** nói về quá khứ trái với thực tế: thực tế tôi **đã bán**, giờ tiếc.","src":"tr. 384"},{"type":"mcq","q":"'I wish you would stop complaining.' nghĩa là:","options":["Tôi mong bạn thôi phàn nàn","Tôi vui vì bạn đã thôi phàn nàn","Bạn không thể thôi phàn nàn"],"answer":0,"explain":"wish + S + **would + V** = mong người khác làm (thay đổi) một việc: tôi mong bạn thôi phàn nàn.","src":"tr. 383"},{"type":"mcq","q":"If only she ___ so far away. I miss her.","options":["didn't live","doesn't live","won't live"],"answer":0,"explain":"Tình trạng hiện tại (cô ấy sống xa) → If only + V2 phủ định: **didn't live**.","src":"tr. 384"},{"type":"fill","q":"It's so hot today. I wish it ___ cooler. (be)","answer":["was","were"],"explain":"Trái với hiện tại, chủ ngữ it → **was** hoặc **were**.","src":"tr. 384"},{"type":"fill","q":"I can't find my keys. I wish I ___ where they are. (know)","answer":["knew"],"explain":"Trái với hiện tại (không biết) → V2: **knew**.","src":"tr. 384"},{"type":"fill","q":"I have to work this weekend. I wish I ___ work. (not / have to)","answer":["didn't have to","did not have to"],"explain":"Thực tế 'have to' ở hiện tại → ước ngược lại: **didn't have to**.","src":"tr. 384"},{"type":"fill","q":"My roommate never washes the dishes. I wish he ___ them tonight. (wash)","answer":["would wash"],"explain":"Mong **người khác làm** một việc sắp tới (tối nay) → **would + V**: would wash.","src":"tr. 383"},{"type":"fill","q":"Our team lost the final. If only we ___ that last goal! (score)","answer":["had scored","could have scored"],"explain":"Trận chung kết đã qua → If only + **had + V3**: had scored.","src":"tr. 385"},{"type":"fill","q":"I didn't charge my phone, and now it's dead. I wish I ___ it last night. (charge)","answer":["had charged","could have charged"],"explain":"last night → quá khứ → **had + V3**: had charged.","src":"tr. 384"},{"type":"fill","q":"She told everyone my secret. I wish she ___ anyone. (not / tell)","answer":["hadn't told","had not told"],"explain":"Việc đã xảy ra → ước ngược lại bằng **hadn't + V3**: hadn't told.","src":"tr. 384"},{"type":"fill","q":"My friends went to Da Lat last week, but I was ill. I wish I ___ have gone with them.","answer":["could"],"explain":"Lúc đó ốm, không thể đi → **could have + V3**: could have gone.","src":"tr. 385"},{"type":"fill","q":"I ___ you feel better soon. (hope / wish)","answer":["hope"],"explain":"Khỏe lại là chuyện **có thể** xảy ra, và động từ *feel* giữ thì hiện tại → **hope**.","src":"tr. 384"},{"type":"fill","q":"We're lost! If only we ___ a map with us now. (have)","answer":["had"],"explain":"now → trái với hiện tại → V2: **had**.","src":"tr. 384"},{"type":"fill","q":"The concert tickets are sold out. If only there ___ one ticket left! (be)","answer":["was","were"],"explain":"Trái với hiện tại → V2 của be: **was** hoặc **were**.","src":"tr. 384"},{"type":"fix","wrong":"I wish I can play the piano.","answer":["I wish I could play the piano."],"explain":"Sau wish lùi thì: can → **could**.","src":"tr. 384"},{"type":"fix","wrong":"I wish I would have a bigger kitchen.","answer":["I wish I had a bigger kitchen.","I wish I could have a bigger kitchen."],"explain":"Có bếp to là **tình trạng**, chủ ngữ lại trùng (I … I) → không dùng would; dùng V2: **had** (hoặc could have nếu muốn nói 'có thể có').","src":"tr. 383"},{"type":"fix","wrong":"She wishes she has more friends.","answer":["She wishes she had more friends."],"explain":"Trái với hiện tại → lùi thì: has → **had**.","src":"tr. 384"},{"type":"fix","wrong":"I wish I didn't eat so much last night.","answer":["I wish I hadn't eaten so much last night.","I wish I had not eaten so much last night."],"explain":"last night → quá khứ → **hadn't + V3**: hadn't eaten.","src":"tr. 384"},{"type":"fix","wrong":"If only I knew about the sale yesterday!","answer":["If only I had known about the sale yesterday!"],"explain":"yesterday → quá khứ → **had + V3**: had known. knew chỉ dùng cho ước hiện tại.","src":"tr. 385"},{"type":"fix","wrong":"I wish it is Saturday today.","answer":["I wish it was Saturday today.","I wish it were Saturday today."],"explain":"Trái với hiện tại → lùi thì: is → **was / were**.","src":"tr. 384"},{"type":"fix","wrong":"I wish you get well soon.","answer":["I hope you get well soon.","I hope you will get well soon."],"explain":"Khỏi bệnh là chuyện **có thể** xảy ra → **hope**; get giữ thì hiện tại.","src":"tr. 384"},{"type":"fix","wrong":"I hope I had studied harder for the test.","answer":["I wis
