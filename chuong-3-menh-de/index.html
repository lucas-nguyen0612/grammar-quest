<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ngữ pháp Chương 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --surface-2: #f1eee7;
  --text: #1f2328;
  --muted: #5d636b;
  --border: #e2ddd2;
  --accent: #3b5bdb;
  --accent-soft: #e7ecff;
  --ok: #2f9e44;
  --ok-soft: #e6f6ea;
  --bad: #d6336c;
  --bad-soft: #fde8ef;
  --warn: #e8890c;
  --warn-soft: #fff3e0;
  --c1: #3b5bdb; --c2: #0c8599; --c3: #2f9e44; --c4: #e8590c; --c5: #ae3ec9; --c6: #c2255c;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171c; --surface: #1d2027; --surface-2: #252932; --text: #e8eaed; --muted: #a1a7b0;
    --border: #333844; --accent: #7b93ff; --accent-soft: #263056; --ok: #51cf66; --ok-soft: #1f3a27;
    --bad: #ff6b9b; --bad-soft: #43202d; --warn: #ffa94d; --warn-soft: #3d2c16;
    --c1: #7b93ff; --c2: #3bc9db; --c3: #69db7c; --c4: #ff922b; --c5: #da77f2; --c6: #f06595;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171c; --surface: #1d2027; --surface-2: #252932; --text: #e8eaed; --muted: #a1a7b0;
  --border: #333844; --accent: #7b93ff; --accent-soft: #263056; --ok: #51cf66; --ok-soft: #1f3a27;
  --bad: #ff6b9b; --bad-soft: #43202d; --warn: #ffa94d; --warn-soft: #3d2c16;
  --c1: #7b93ff; --c2: #3bc9db; --c3: #69db7c; --c4: #ff922b; --c5: #da77f2; --c6: #f06595;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
.en { font-family: "Source Serif 4", Georgia, serif; }

.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
}
.topbar .brand { font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.iconbtn { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; }

main { max-width: 860px; margin: 0 auto; padding: 20px 16px 80px; }
.crumbs { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.crumbs a { color: var(--muted); }
h1 { font-size: 28px; line-height: 1.25; margin: 4px 0 8px; }
h2 { font-size: 21px; margin: 28px 0 10px; }
h3 { font-size: 18px; margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px; margin: 14px 0;
}
.hero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.hero .big-icon { font-size: 52px; line-height: 1; }
.pill { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); margin: 2px 4px 2px 0; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.topic-card { display: block; color: var(--text); transition: transform .15s ease, box-shadow .15s ease; margin: 0; }
.topic-card:hover { transform: translateY(-2px); }
.topic-card .ico { font-size: 30px; }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.bar > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .8s ease; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 12px;
  padding: 10px 18px; background: var(--accent); color: #fff; font-weight: 600;
  transition: transform .1s ease, filter .15s ease;
}
:root[data-theme="dark"] .btn, :root:not([data-theme="light"]) .btn { color: #fff; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.97); }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn.ok { background: var(--ok); }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.lesson-list a { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; color: var(--text); border: 1px solid var(--border); background: var(--surface); margin: 8px 0; }
.lesson-list a:hover { border-color: var(--accent); }
.lesson-list .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-weight: 700; flex: none; }
.lesson-list .num.done { background: var(--ok); color: #fff; }

/* stepper */
.stepper { display: flex; gap: 6px; margin: 12px 0 18px; }
.stepper i { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); transition: background .3s; }
.stepper i.on { background: var(--accent); }
.stepper i.past { background: var(--ok); }
.step-title { display: flex; align-items: center; gap: 10px; }
.step-title .ico { font-size: 30px; }
.step-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }

/* chunk */
.chunk .rule {
  font-size: 18px; font-weight: 600; padding: 12px 14px; border-left: 4px solid var(--accent);
  background: var(--accent-soft); border-radius: 0 10px 10px 0; margin: 10px 0;
}
.formula {
  font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 15px; background: var(--surface-2);
  padding: 10px 14px; border-radius: 10px; margin: 10px 0; overflow-x: auto; white-space: pre-wrap;
}
.ex { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px dashed var(--border); }
.ex:last-child { border-bottom: 0; }
.ex .mark { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; margin-top: 2px; }
.ex .mark.y { background: var(--ok); }
.ex .mark.n { background: var(--bad); }
.ex .en { font-size: 17px; }
.ex.wrong .en { text-decoration: line-through; text-decoration-color: var(--bad); }
.ex .vi { color: var(--muted); font-size: 14px; }
.ex .note { font-size: 13px; color: var(--accent); }
.tip, .mistake, .hook { border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
.tip { background: var(--warn-soft); }
.mistake { background: var(--bad-soft); }
.hook { background: var(--accent-soft); font-size: 17px; }
.src { font-size: 12px; color: var(--muted); }
strong { color: var(--accent); }
del { color: var(--bad); }

/* questions */
.q { padding: 14px 0; border-bottom: 1px solid var(--border); }
.q:last-child { border-bottom: 0; }
.q .qtext { font-size: 17px; margin-bottom: 10px; }
.q .qnum { display: inline-grid; place-items: center; min-width: 26px; height: 26px; border-radius: 8px; background: var(--surface-2); font-size: 13px; font-weight: 700; margin-right: 8px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface); transition: border-color .15s, background .15s; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s; }
.opt[disabled] { cursor: default; }
input.blank, textarea.fixbox {
  font: inherit; color: var(--text); background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 8px; padding: 4px 10px;
}
input.blank { width: 9em; margin: 0 4px; }
textarea.fixbox { width: 100%; min-height: 54px; padding: 8px 12px; resize: vertical; }
input.blank:focus, textarea.fixbox:focus { outline: 2px solid var(--accent); border-color: transparent; }
input.blank.correct, textarea.fixbox.correct { border-color: var(--ok); background: var(--ok-soft); }
input.blank.wrong, textarea.fixbox.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s; }
.fixsrc { font-size: 16px; padding: 8px 12px; background: var(--bad-soft); border-radius: 8px; margin-bottom: 8px; }
.check-row { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.feedback { margin-top: 10px; padding: 10px 14px; border-radius: 10px; font-size: 15px; animation: pop .3s ease; }
.feedback.good { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback .ans { font-weight: 600; }
.classify-item { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0; }
.classify-item .it { min-width: 9em; font-size: 16px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-size: 14px; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button.sel { background: var(--accent); color: #fff; }
.seg.correct { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok-soft); }
.seg.wrong { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; padding: 6px; border-radius: 10px; }
.chips.target { border: 1.5px dashed var(--border); margin-bottom: 8px; }
.chip { padding: 6px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); animation: pop .2s ease; }
.chip.used { visibility: hidden; }
.score { font-size: 40px; font-weight: 800; }

/* diagrams */
.diagram { margin: 14px 0; }
.diagram .dtitle { font-weight: 700; margin-bottom: 6px; }
.diagram .scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
.diagram svg { display: block; }
.diagram .hint { font-size: 12px; color: var(--muted); }
svg .node rect { stroke-width: 1.5; }
svg .node text { fill: var(--text); font-size: 13px; font-family: inherit; }
svg .node.root text { font-weight: 700; font-size: 15px; }
svg .node.result rect { fill: var(--ok-soft); stroke: var(--ok); }
svg .node.ask rect { fill: var(--surface); stroke: var(--accent); stroke-dasharray: 0; }
svg .link { fill: none; stroke-width: 2; }
svg .elabel { font-size: 12px; font-weight: 700; fill: var(--muted); }
svg .elabel-bg { fill: var(--bg); }
.anim svg .link { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1s ease forwards; }
.anim svg .node, .anim svg .elabel-g { opacity: 0; animation: fadein .45s ease forwards; }
table.cmp { width: 100%; border-collapse: collapse; font-size: 15px; }
table.cmp th, table.cmp td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
table.cmp th { background: var(--surface-2); }
table.cmp tr { animation: fadein .4s ease both; }
.table-wrap { overflow-x: auto; }

/* flashcards */
.flash { perspective: 1000px; height: 190px; margin: 10px 0; cursor: pointer; }
.flash .inner { position: relative; width: 100%; height: 100%; transition: transform .55s; transform-style: preserve-3d; }
.flash.flipped .inner { transform: rotateY(180deg); }
.flash .face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--radius);
  display: grid; place-items: center; text-align: center; padding: 18px; font-size: 19px; border: 1px solid var(--border); box-shadow: var(--shadow);
}
.flash .front { background: var(--surface); }
.flash .back { background: var(--accent-soft); transform: rotateY(180deg); font-size: 17px; }
.mini-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.mini-cards .flash { height: 150px; margin: 0; }
.mini-cards .flash .face { font-size: 16px; }

.ring { width: 84px; height: 84px; }
.ring circle { fill: none; stroke-width: 9; }
.ring .bg { stroke: var(--surface-2); }
.ring .fg { stroke: var(--ok); stroke-linecap: round; transition: stroke-dashoffset 1s ease; transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring text { font-size: 20px; font-weight: 800; fill: var(--text); }

.reveal { opacity: 0; transform: translateY(14px); transition: opacity .5s ease, transform .5s ease; }
.reveal.in { opacity: 1; transform: none; }
.confetti { position: fixed; top: -20px; z-index: 99; pointer-events: none; font-size: 22px; animation: fall 1.8s ease-in forwards; }

@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .2; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .reveal { opacity: 1; transform: none; }
  .anim svg .link { stroke-dashoffset: 0; } .anim svg .node, .anim svg .elabel-g { opacity: 1; }
}
@media (max-width: 560px) {
  h1 { font-size: 24px; }
  .card { padding: 14px; }
  .flash { height: 210px; }
}
em { font-style: italic; color: inherit; }

/* Large screens: widen the content column and scale everything (text, diagrams, buttons) up
   so a 24–32" monitor doesn't show a narrow strip of small text. */
@media (min-width: 1400px) {
  main { max-width: 960px; }
  body { zoom: 1.1; }
}
@media (min-width: 1800px) {
  main { max-width: 1060px; }
  body { zoom: 1.25; }
}
@media (min-width: 2300px) {
  main { max-width: 1140px; }
  body { zoom: 1.4; }
}

</style>
</head>

danh từ"}]},{"label":"if hay whether","icon":"⚖️","children":[{"label":"Đầu câu: chỉ whether"},{"label":"Sau giới từ: chỉ whether"}]},{"label":"Trật tự câu kể","icon":"🔄","children":[{"label":"what he said (không: did he say)"}]}]},"lessons":[{"id":"01a","title":"Mệnh đề danh ngữ là gì? Năm vị trí trong câu","minutes":25,"goal":"Nhận ra mệnh đề danh ngữ (một câu nhỏ có chủ ngữ + động từ, đóng vai một danh từ), biết các từ mở đầu nó, và đặt nó đúng năm vị trí: chủ ngữ, tân ngữ của động từ, tân ngữ của giới từ, bổ ngữ sau be, đồng cách sau danh từ.","pretest":[{"type":"mcq","q":"Trong câu *I know **where she lives**.*, phần in đậm đóng vai gì?","options":["Tân ngữ của động từ know","Trạng ngữ chỉ nơi chốn","Chủ ngữ của câu"],"answer":0,"explain":"Hỏi 'Tôi biết **cái gì**?' → biết 'cô ấy sống ở đâu'. Cả cụm *where she lives* đứng ở chỗ của một danh từ làm **tân ngữ** cho know, giống *I know **her address***.","src":"tự soạn"},{"type":"mcq","q":"Chọn câu đúng:","options":["What I need is a long holiday.","That I need is a long holiday.","I need is a long holiday."],"answer":0,"explain":"'Điều tôi cần' → **What** I need. *need* đang thiếu tân ngữ, **what** (cái mà) lấp vào chỗ đó. *That* không mang nghĩa 'cái mà', còn câu thứ ba thiếu từ mở đầu nên có hai động từ đứng trơ trọi.","src":"tự soạn"},{"type":"mcq","q":"The price depends on ___ you sit. (Giá vé tùy thuộc vào chỗ ngồi.)","options":["where","that","it"],"answer":0,"explain":"'Tùy vào **chỗ nào** bạn ngồi' → **where** you sit. Cả cụm đứng sau giới từ *on* như một danh từ.","src":"tr. 319"}],"hook":{"icon":"🧱","text":"Hãy hình dung một câu là một **bức tường xếp gạch**. Mỗi viên gạch là một vị trí: chủ ngữ, động từ, tân ngữ… Thường mỗi viên là một danh từ: *I know **the answer**.* Nhưng đôi khi ta nhét **cả một câu nhỏ** vào chỗ một viên gạch: *I know **where she lives**.* Câu nhỏ đóng vai danh từ ấy gọi là **mệnh đề danh ngữ**. Tiếng Việt làm y hệt: 'Tôi biết **cô ấy sống ở đâu**.' Bài này cho bạn xem năm chỗ mà viên gạch đặc biệt này đặt vào được."},"diagram":{"type":"mindmap","title":"Năm vị trí của mệnh đề danh ngữ","root":{"label":"Mệnh đề danh ngữ","children":[{"label":"1. Chủ ngữ (đầu câu)","icon":"🎯","children":[{"label":"How he escaped is a mystery."}]},{"label":"2. Tân ngữ của động từ","icon":"➡️","children":[{"label":"Tell me where you live."}]},{"label":"3. Tân ngữ của giới từ","icon":"🔗","children":[{"label":"It depends on where you sit."}]},{"label":"4. Bổ ngữ sau be","icon":"🟰","children":[{"label":"That is not what I want."}]},{"label":"5. Đồng cách sau danh từ","icon":"🪞","children":[{"label":"the news that we won"}]}]}},"chunks":[{"title":"Mệnh đề danh ngữ là gì?","icon":"🧱","rule":"**Mệnh đề danh ngữ** (noun clause) là một mệnh đề phụ có **chủ ngữ + động từ riêng**, nhưng làm việc của **một cụm danh từ** trong câu.","explain":"Mệnh đề (clause) là nhóm từ có chủ ngữ và động từ được chia. Mệnh đề danh ngữ không đứng một mình; nó nằm gọn trong câu lớn, ở chỗ vốn dành cho danh từ. Nó thường mở đầu bằng:\n• **that** (rằng, việc)\n• **whether / if** (liệu… hay không)\n• nghi vấn từ: **what, who, whom, whose, which, where, when, why, how**\n• dạng *-ever*: **whoever, whomever, whatever, whichever** (bất cứ ai / bất cứ cái gì)\nLưu ý (rút ra từ ví dụ và bài tập của sách): **that** chỉ là cái móc nối, không mang nghĩa, sau nó là một câu đầy đủ. **what** mang nghĩa 'điều mà, cái mà' và tự nó lấp chỗ trống trong mệnh đề: *What I had for breakfast* = 'những thứ tôi đã ăn sáng' (*had* thiếu tân ngữ, what lấp vào).","formula":"Câu lớn: … + [từ mở đầu + S + V …] + …","examples":[{"en":"He knew **that something bad had happened**.","vi":"Anh ấy biết đã có chuyện không ổn xảy ra."},{"en":"The price depends on **where you sit**.","vi":"Giá vé tùy thuộc vào chỗ ngồi."},{"en":"**Whoever thought of that idea** is a genius.","vi":"Ai nghĩ ra ý đó đúng là một thiên tài."},{"en":"I wasn't sure **whether you'd like it**.","vi":"Tôi không chắc anh có thích hay không."},{"en":"That I want is a new phone.","ok":false,"note":"'cái mà' phải là What"}],"mistake":{"wrong":"That I want is a new phone.","right":"What I want is a new phone.","why":"*want* đang thiếu tân ngữ ('muốn **cái gì**?'), nên cần **what** (cái mà). *that* không lấp được chỗ trống đó."},"tip":"Thử thay cả cụm bằng **it / something**: *I know **where she lives*** → *I know **it***. Thay được → đó là mệnh đề danh ngữ.","src":"tr. 319","check":{"type":"mcq","q":"*Whoever finishes first* can go home early. — Phần nào là mệnh đề danh ngữ?","options":["Whoever finishes first","finishes first can go home","can go home early"],"answer":0,"explain":"Hỏi 'Ai được về sớm?' → **Whoever finishes first** (bất cứ ai làm xong trước). Cả cụm làm chủ ngữ cho *can go*.","src":"tự soạn"}},{"title":"Vị trí 1: làm chủ ngữ","icon":"🎯","rule":"Mệnh đề danh ngữ có thể làm **chủ ngữ**: nó đứng **đầu câu**, sau nó mới đến **động từ chính** của câu.","explain":"Câu này có hai động từ: một nằm trong mệnh đề, một là động từ chính. *[That we were late to class] **really upset** the teacher.* Hỏi 'Cái gì làm giáo viên khó chịu?' → cả cụm 'việc chúng tôi đến lớp trễ'. Tiếng Việt hay mở bằng 'Việc…', 'Điều…', 'Cách…', '…hay không'; tiếng Anh mở bằng **That, What, How, Whether**. Cả mệnh đề được coi như **một việc**, nên trong ví dụ của sách động từ chính chia số ít (*is, isn't*). (Ở vị trí này không dùng *if*: xem bài 01b.)","formula":"[That / What / How / Whether + S + V …] + V chính + …","examples":[{"en":"**That we were late to class** really upset the teacher.","vi":"Việc chúng tôi đến lớp trễ làm giáo viên khó chịu."},{"en":"**What I had for breakfast** gave me heartburn.","vi":"Những thứ tôi đã ăn sáng khiến tôi bị ợ nóng."},{"en":"**How the prisoner escaped** is a complete mystery.","vi":"Cách tù nhân đó trốn thoát là điều hoàn toàn bí ẩn."},{"en":"**Whether she comes or not** is unimportant to me.","vi":"Với tôi, cô ấy đến hay không cũng chẳng quan trọng."},{"en":"We were late to class really upset the teacher.","ok":false,"note":"thiếu That ở đầu câu"}],"mistake":{"wrong":"She comes or not is unimportant to me.","right":"Whether she comes or not is unimportant to me.","why":"Thiếu từ mở đầu thì câu có hai động từ chen nhau, không ai biết chủ ngữ ở đâu. 'đến **hay không**' → **Whether**."},"tip":"Việc… → **That** · Điều/cái mà… → **What** · Cách… → **How** · …hay không → **Whether**.","src":"tr. 319","check":{"type":"fill","q":"___ he got my phone number is a mystery to me. (Cách anh ta có số điện thoại của tôi…)","answer":["How"],"explain":"'**Cách** anh ta có số…' → **How**. Cả mệnh đề *How he got my phone number* làm chủ ngữ cho *is*.","src":"tự soạn"}},{"title":"Vị trí 2 và 3: làm tân ngữ","icon":"➡️","rule":"Mệnh đề danh ngữ thường làm **tân ngữ**: đứng sau **động từ** (know, tell, choose, wonder…) hoặc sau **giới từ** (about, on, to, in…).","explain":"Tân ngữ (object) là phần đứng sau động từ hay giới từ, hứng tác động của nó: *I know **him***, *depends **on the price***. Thay danh từ bằng cả một mệnh đề: *I know **that you must be tired***, *depends on **where you sit***. Sau **giới từ**, mệnh đề phải mở đầu bằng **nghi vấn từ** (what, where, when, how…) hoặc **whether**; bài 01b sẽ nói vì sao *if* và *that* không đứng sau giới từ.","formula":"S + know / tell / choose / wonder… + [mệnh đề]\n… + about / on / to / in… + [what / where / when… + S + V]","examples":[{"en":"I know **that you must be tired after a long journey**.","vi":"Tôi thấy chắc hẳn anh đã mệt sau chuyến đi dài."},{"en":"Please tell me **where you live**.","vi":"Hãy cho tôi biết anh sống ở đâu."},{"en":"You must choose **which flavor of ice cream you want**.","vi":"Bạn nên chọn vị kem nào bạn muốn."},{"en":"We argued for hours about **when we should start**.","vi":"Chúng tôi tranh cãi hàng giờ về việc nên khởi sự lúc nào."},{"en":"Pay careful attention to **what I am going to say**.","vi":"Hãy lưu ý thật kỹ những điều tôi sắp nói."},{"en":"Josie is not interested in **whatever Kyle says**.","vi":"Josie không quan tâm đến bất cứ điều gì Kyle nói."}],"mistake":{"wrong":"Listen to I am going to say.","right":"Listen to what I am going to say.","why":"Sau giới từ *to* cần một cụm danh từ. Một câu trần không có từ mở đầu không đứng sau giới từ được; 'những điều mà' → **what**."},"tip":"Thấy giới từ (about, on, in, to…) mà muốn đặt cả một ý phía sau → mở bằng **what / where / when / how / whether…**","src":"tr. 320","check":{"type":"mcq","q":"You can eat ___ you like. (bất cứ thứ gì bạn thích)","options":["whatever","whoever","that"],"answer":0,"explain":"'Bất cứ **thứ gì**' → **whatever**; *whoever* là 'bất cứ **ai**'. *that* không có nghĩa 'cái mà', không lấp được tân ngữ còn thiếu của *like*.","src":"tự soạn"}},{"title":"Vị trí 4 và 5: bổ ngữ và đồng cách","icon":"🪞","rule":"Mệnh đề danh ngữ có thể đứng **sau be** để hoàn tất câu (**bổ ngữ**), hoặc đứng **ngay sau một danh từ** (news, statement, idea…) để nói rõ **nội dung** của danh từ đó (**đồng cách**).","explain":"Bổ ngữ (complement) đứng sau *be*, cho biết chủ ngữ 'là gì': *That is not **what I want***. Đồng cách (apposition) nghĩa là 'đứng cạnh và cùng nội dung': *the news **that we are having a holiday tomorrow*** — tin gì? tin rằng mai được nghỉ. Sách chú thích rõ: *that we are having a holiday tomorrow* là mệnh đề đồng cách của *the news*. Mệnh đề **that** cũng theo sau một số danh từ khác như *idea, statement*: *What gave you the idea that I can sing?*","formula":"S + be + [mệnh đề]\nDanh từ (news / statement / idea…) + [that + S + V]","examples":[{"en":"What surprised me was **that he spoke English so well**.","vi":"Điều làm tôi ngạc nhiên là anh ta nói tiếng Anh rất hay."},{"en":"That is not **what I want**.","vi":"Đó không phải những gì tôi cần."},{"en":"The news **that we are having a holiday tomorrow** is not true.","vi":"Tin ngày mai chúng ta được nghỉ là không đúng."},{"en":"Your statement **that you found the money in the street** will not be believed.","vi":"Sẽ chẳng ai tin lời khai anh đã nhặt được số tiền này trên phố."},{"en":"What gave you the idea **that I can sing**?","vi":"Điều gì khiến anh nghĩ là tôi biết hát vậy?"}],"mistake":{"wrong":"That is not I want.","right":"That is not what I want.","why":"Sau *be* cần một cụm danh từ; 'điều tôi muốn' → **what** I want."},"tip":"Đồng cách = chêm được dấu hai chấm: *the news: we are having a holiday tomorrow*.","src":"tr. 320","check":{"type":"mcq","q":"Trong câu *The idea **that he could win** made him happy.*, phần in đậm là gì?","options":["Mệnh đề đồng cách, nói rõ nội dung của the idea","Tân ngữ của động từ made","Bổ ngữ sau be"],"answer":0,"explain":"Ý nghĩ gì? → 'rằng anh ấy có thể thắng'. Mệnh đề đứng ngay sau danh từ *the idea* và nói rõ nội dung của nó → **đồng cách**. Câu không có *be*; tân ngữ của *made* là *him*.","src":"tự soạn"}}],"practice":[{"type":"classify","q":"Phần in đậm làm chức năng gì trong câu?","buckets":["Chủ ngữ","Tân ngữ của động từ","Tân ngữ của giới từ","Bổ ngữ sau be","Đồng cách"],"items":[{"text":"**What she cooked** smelled wonderful.","bucket":0},{"text":"I can't remember **where I parked the car**.","bucket":1},{"text":"We talked about **how we could save money**.","bucket":2},{"text":"The problem is **that we have no time**.","bucket":3},{"text":"The fact **that he lied** made me angry.","bucket":4},{"text":"**Whether we win or lose** doesn't matter.","bucket":0}],"explain":"Đầu câu, trước động từ chính → chủ ngữ. Sau remember → tân ngữ của động từ. Sau about → tân ngữ của giới từ. Sau is → bổ ngữ. Ngay sau danh từ *the fact*, nói rõ sự thật gì → đồng cách.","src":"tr. 319–320"},{"type":"mcq","q":"___ you said yesterday made her cry.","options":["What","That","Which"],"answer":0,"explain":"*said* thiếu tân ngữ ('nói **cái gì**?') → **What** (điều mà). *That you said* không có nghĩa; *Which* cần có các lựa chọn đã nói trước.","src":"tự soạn"},{"type":"fill","q":"Please tell me ___ the bus station is. (ở đâu)","answer":["where"],"explain":"'ở đâu' → **where**. Mệnh đề *where the bus station is* làm tân ngữ của *tell*.","src":"tự soạn"},{"type":"fill","q":"Nobody knows ___ he left so early. (tại sao)","answer":["why"],"explain":"'tại sao' → **why**. Mệnh đề làm tân ngữ của *knows*.","src":"tự soạn"},{"type":"mcq","q":"I'm not interested in ___ people think about me.","options":["what","that","it"],"answer":0,"explain":"Sau giới từ *in* dùng nghi vấn từ: **what** people think (điều người ta nghĩ). *that* không đứng sau giới từ; *it people think* là sai cấu trúc.","src":"tr. 320"},{"type":"mcq","q":"The fact ___ she passed the exam surprised everyone.","options":["that","what","which"],"answer":0,"explain":"Mệnh đề đồng cách nói rõ nội dung của *the fact* → **that**. Sau *that* là một câu đầy đủ (*she passed the exam*), không thiếu gì nên không dùng *what*.","src":"tr. 320"},{"type":"fill","q":"___ he said was not true. (Điều anh ấy nói)","answer":["What"],"explain":"'Điều mà' → **What**. *What he said* làm chủ ngữ cho *was*.","src":"tự soạn"},{"type":"mcq","q":"This is exactly ___ I was looking for.","options":["what","that","which"],"answer":0,"explain":"Sau *is* cần một cụm danh từ 'cái mà tôi đang tìm' → **what**. *for* đang thiếu tân ngữ, chỉ *what* lấp được chỗ đó.","src":"tr. 320"},{"type":"fix","wrong":"That I want is a cup of coffee.","answer":["What I want is a cup of coffee.","All I want is a cup of coffee."],"explain":"*want* thiếu tân ngữ → 'Cái tôi muốn' phải là **What** I want.","src":"tự soạn"},{"type":"fix","q":"Sửa câu (nghĩa: Họ tranh cãi về việc **khi nào** nên đi):","wrong":"They argued about they should leave.","answer":["They argued about when they should leave."],"explain":"Sau giới từ *about* phải có từ mở đầu; 'khi nào' → **when**.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Pay","attention","to","what","the","teacher","says."],"explain":"*what the teacher says* là tân ngữ của giới từ *to*; bên trong mệnh đề, chủ ngữ *the teacher* đứng trước động từ *says*.","src":"tự soạn"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["The","news","that","she","got","the","job","made","us","happy."],"explain":"Mệnh đề đồng cách *that she got the job* đứng ngay sau *The news*; động từ chính *made* đến sau cả cụm chủ ngữ.","src":"tự soạn"}],"flashcards":[{"front":"Mệnh đề danh ngữ là gì?","back":"Một mệnh đề (có **S + V**) đóng vai một cụm danh từ: I know **where she lives**."},{"front":"Năm vị trí của mệnh đề danh ngữ?","back":"**Chủ ngữ** · **tân ngữ của động từ** · **tân ngữ của giới từ** · **bổ ngữ sau be** · **đồng cách sau danh từ**"},{"front":"Những từ mở đầu mệnh đề danh ngữ?","back":"**that**, **whether / if**, **what, who, whom, whose, which, where, when, why, how**, **whoever, whomever, whatever, whichever**"},{"front":"'Điều mà / cái mà' trong tiếng Anh?","back":"**What**: **What** I need is sleep. (không dùng That)"},{"front":"Mệnh đề đồng cách là gì?","back":"Mệnh đề **that** đứng sau danh từ, nói rõ nội dung danh từ đó: the news **that we are having a holiday tomorrow**"},{"front":"Mẹo nhận ra mệnh đề danh ngữ?","back":"Thay cả cụm bằng **it / something**: I know **where she lives** → I know **it**."}]},{"id":"01b","title":"Bỏ that, if hay whether, trật tự câu kể","minutes":25,"goal":"Biết khi nào được bỏ that (sau động từ, sau tính từ) và khi nào phải giữ (đầu câu, sau danh từ); chọn đúng if hay whether; đổi một câu hỏi thành mệnh đề danh ngữ theo trật tự câu kể (chủ ngữ trước động từ).","pretest":[{"type":"mcq","q":"Câu nào đúng?","options":["I wonder where she lives.","I wonder where does she live.","I wonder where lives she."],"answer":0,"explain":"Câu hỏi đã nằm bên trong câu khác thì **không đảo** nữa: chủ ngữ *she* đứng trước động từ *lives*, bỏ *does*.","src":"tr. 321"},{"type":"mcq","q":"___ we can finish on time isn't clear.","options":["Whether","If","That if"],"answer":0,"explain":"Ở vị trí chủ ngữ (đầu câu) chỉ dùng **Whether**; *If* đứng đầu câu sẽ bị đọc thành 'nếu'.","src":"tr. 319"},{"type":"mcq","q":"Câu nào **sai**?","options":["We know the world is round.","I'm glad you came.","She doesn't like me is obvious."],"answer":2,"explain":"Mệnh đề làm chủ ngữ phải giữ **That**: *That she doesn't like me is obvious.* Hai câu kia bỏ *that* được vì mệnh đề đứng sau động từ (*know*) và sau tính từ (*glad*).","src":"tr. 321"}],"hook":{"icon":"🔄","text":"Khi hỏi thẳng, trợ động từ nhảy lên trước chủ ngữ: *Where **does she** live?* Nhưng khi câu hỏi bị **nhét vào trong** một câu khác: *I don't know where **she lives**.* — nó không còn là câu hỏi nữa, nên quay về **trật tự câu kể**. Tiếng Việt không đảo nên ta ít để ý, và đây là lỗi số một của người học. Bài này còn dạy hai 'luật giao thông' nhỏ: khi nào được bỏ **that**, và hai chỗ cấm **if**."},"diagram":{"type":"flow","title":"Mệnh đề that: bỏ that được không?","start":{"q":"Mệnh đề that đứng ở đâu?","branches":[{"label":"Đầu câu (chủ ngữ)","to":{"result":"Giữ: That she lied is obvious.","icon":"🔒"}},{"label":"Sau danh từ","to":{"result":"Giữ: the fact that she lied","icon":"🔒"}},{"label":"Sau động từ","to":{"result":"Bỏ được: We know (that) she lied.","icon":"✂️"}},{"label":"Sau tính từ","to":{"result":"Bỏ được: I'm glad (that) you came.","icon":"✂️"}}]}},"chunks":[{"title":"Khi nào được bỏ that?","icon":"✂️","rule":"Được bỏ **that** khi mệnh đề làm **tân ngữ của động từ** hoặc đứng **sau tính từ**; **không** được bỏ khi mệnh đề làm **chủ ngữ** hoặc đứng **sau danh từ**.","explain":"Mệnh đề *that* đứng được sau động từ (*know, think, say*…), sau một số tính từ (*glad, important*…) và sau một số danh từ (*news, fact, idea*…). *That* giống chữ 'rằng' trong tiếng Việt: sau động từ hay tính từ, bỏ đi vẫn hiểu ('Tôi biết (rằng) trái đất tròn'). Nhưng ở **đầu câu**, thiếu *That* thì người đọc tưởng câu bắt đầu bằng một câu kể bình thường rồi vấp phải động từ thứ hai; còn **sau danh từ**, sách bắt buộc giữ *that*.","formula":"S + V + (that) + S + V\nS + be + tính từ + (that) + S + V\nThat + S + V + V chính …\nDanh từ + that + S + V","examples":[{"en":"We know (**that**) the world is round.","vi":"Chúng ta biết trái đất tròn."},{"en":"It's important (**that**) we look at the problem in more detail.","vi":"Điều quan trọng là chúng ta phải xem xét tường tận vấn đề."},{"en":"We were glad (**that**) things had gone so well.","vi":"Chúng tôi mừng là mọi chuyện đã tiến triển tốt đẹp."},{"en":"**That** she doesn't understand spoken English is obvious.","vi":"Rõ ràng là cô ấy không hiểu được tiếng Anh đàm thoại."},{"en":"I know for a fact **that** she earns more than I do.","vi":"Tôi biết chắc rằng cô ấy kiếm được nhiều tiền hơn tôi."},{"en":"She doesn't understand spoken English is obvious.","ok":false,"note":"mệnh đề chủ ngữ phải giữ That"}],"mistake":{"wrong":"I know for a fact she earns more than I do.","right":"I know for a fact that she earns more than I do.","why":"Mệnh đề đứng ngay sau danh từ *fact* → phải giữ **that**."},"tip":"Đầu câu, sau danh từ: **that ở lại**. Sau động từ, sau tính từ: **that tùy bạn**.","src":"tr. 320–321","check":{"type":"mcq","q":"Trong câu nào **không** được bỏ that?","options":["The idea that he might lose scared him.","I think that he is right.","I'm sure that she will come."],"answer":0,"explain":"*that he might lose* đứng sau danh từ *idea* → phải giữ **that**. Sau động từ *think* và tính từ *sure* thì bỏ được.","src":"tự soạn"}},{"title":"If hay whether?","icon":"⚖️","rule":"**if** và **whether** đều nghĩa 'liệu… (có)… hay không'; nhưng khi mệnh đề làm **chủ ngữ** (đầu câu) hoặc đứng **sau giới từ** thì chỉ dùng **whether**, không dùng if.","explain":"Câu hỏi có/không (Yes/No question) khi nằm trong câu khác sẽ mở đầu bằng *if* hoặc *whether*. Sau động từ thì gặp cả hai: *I wonder **if** he needs help*; sau tính từ sách dùng *whether*: *I wasn't sure **whether** you'd like it*. Hai chỗ cấm *if*:\n• **Đầu câu**: *if* đứng đầu dễ bị đọc thành 'nếu' (điều kiện), câu mất chủ ngữ.\n• **Sau giới từ**: chỉ nghi vấn từ (what, where, how…) hoặc *whether* mới theo sau giới từ; *if* và cả *that* đều không.","formula":"S + wonder / know / ask… + if / whether + S + V\nWhether + S + V + V chính … (không If)\ngiới từ + whether + S + V (không if, không that)","examples":[{"en":"I wonder **if** he needs help.","vi":"Tôi tự hỏi liệu anh ấy có cần giúp gì không."},{"en":"**Whether** we can succeed isn't clear.","vi":"Không chắc liệu chúng ta có thành công hay không."},{"en":"There's no news on **whether** the project is going ahead.","vi":"Chẳng có tin tức gì về việc dự án có được tiến hành hay không."},{"en":"If we can succeed isn't clear.","ok":false,"note":"đầu câu phải dùng Whether"},{"en":"There's no news on if the project is going ahead.","ok":false,"note":"sau giới từ phải dùng whether"}],"mistake":{"wrong":"It depends on if it rains.","right":"It depends on whether it rains.","why":"Sau giới từ *on* chỉ dùng **whether**."},"tip":"Phân vân thì chọn **whether**: chỗ nào *if* đứng được thì *whether* cũng đứng được, còn đầu câu và sau giới từ thì chỉ có *whether*.","src":"tr. 319–320","check":{"type":"fill","q":"We talked about ___ we should sell the house. (liệu có nên… hay không)","answer":["whether"],"explain":"Sau giới từ *about* chỉ dùng **whether**, không dùng *if*.","src":"tr. 320"}},{"title":"Trật tự câu kể: không đảo như câu hỏi","icon":"🔄","rule":"Trong mệnh đề danh ngữ, **chủ ngữ đứng trước động từ** như câu kể; **không** dùng trật tự của câu hỏi (không đảo trợ động từ).","explain":"Câu hỏi thẳng đảo trợ động từ lên trước chủ ngữ: *What **did he** say?* Khi đưa vào câu khác, nó không còn là câu hỏi nữa:\n• Có **do / does / did** → bỏ đi, chia lại động từ chính: *did he say* → *he **said***; *does she live* → *she **lives***.\n• Có **be / can / will / have** → chỉ đổi chỗ, chủ ngữ lên trước: *is Tim getting on* → *Tim **is** getting on*.\n• Câu hỏi có/không → thêm **if / whether**: *Will it rain?* → *I wonder **if it will rain***.\n• Nghi vấn từ đã là chủ ngữ (*Who is coming?*) → giữ nguyên: *I don't know **who is coming***.\nDấu hỏi cuối câu chỉ giữ khi câu lớn là câu hỏi (*Do you know…?*).","diagram":{"type":"table","title":"Câu hỏi → mệnh đề danh ngữ","head":["Câu hỏi thẳng","Trong mệnh đề danh ngữ"],"rows":[["What did he say?","… what he said"],["Where does she live?","… where she lives"],["How is Tim getting on?","… how Tim is getting on"],["Will it rain?","… if / whether it will rain"],["Who is coming?","… who is coming (giữ nguyên)"]]},"formula":"Từ mở đầu + **S + V** (không phải: trợ động từ + S + V)","examples":[{"en":"I couldn't hear **what he said**.","vi":"Tôi không nghe được những gì ông ấy nói."},{"en":"I wonder **how Tim is getting on**.","vi":"Tôi thắc mắc không biết dạo này Tim sống ra sao."},{"en":"Do you know **where she lives**?","vi":"Bạn có biết cô ấy sống ở đâu không?"},{"en":"I couldn't hear what did he say.","ok":false,"note":"không đảo, bỏ did"},{"en":"I wonder how is Tim getting on.","ok":false,"note":"Tim phải đứng trước is"}],"mistake":{"wrong":"Can you tell me where is the station?","right":"Can you tell me where the station is?","why":"Câu lớn là câu hỏi (*Can you…?*) nhưng mệnh đề bên trong vẫn theo trật tự kể: chủ ngữ *the station* trước *is*."},"tip":"Câu hỏi đã 'chui vào trong' thì **thôi đảo**: chủ ngữ trước, động từ sau.","src":"tr. 321","check":{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","don't","know","what","time","the","train","leaves."],"explain":"Trong mệnh đề *what time the train leaves*, chủ ngữ *the train* đứng trước *leaves*; không có *does*.","src":"tự soạn"}}],"practice":[{"type":"mcq","q":"I'd like to know ___.","options":["how much this bag costs","how much does this bag cost","how much costs this bag"],"answer":0,"explain":"Mệnh đề danh ngữ theo trật tự kể: bỏ *does*, chủ ngữ *this bag* trước động từ *costs* (thêm -s vì chủ ngữ số ít).","src":"tr. 321"},{"type":"mcq","q":"___ she will accept the offer is still uncertain.","options":["Whether","If","What"],"answer":0,"explain":"Mệnh đề làm chủ ngữ (đầu câu) → chỉ dùng **Whether**. *What* sai vì sau nó là câu đầy đủ, không thiếu thành phần nào.","src":"tr. 319"},{"type":"classify","q":"Trong mỗi câu, that có bỏ được không?","buckets":["Được bỏ that","Phải giữ that"],"items":[{"text":"I think **(that)** he's tired.","bucket":0},{"text":"She said **(that)** she was busy.","bucket":0},{"text":"I'm afraid **(that)** I can't come.","bucket":0},{"text":"**That** he passed surprised everyone.","bucket":1},{"text":"The fact **that** he lied hurt me.","bucket":1},{"text":"Is there any proof **that** she took it?","bucket":1}],"explain":"Sau động từ (think, said) và tính từ (afraid) → bỏ được. Mệnh đề làm chủ ngữ (That he passed…) và đứng sau danh từ (fact, proof) → phải giữ.","src":"tr. 321"},{"type":"fill","q":"Do you know ___ the shop is open on Sundays? (liệu… có… không)","answer":["if","whether"],"explain":"Câu hỏi có/không nằm sau động từ *know* → **if** hoặc **whether** đều được.","src":"tr. 320"},{"type":"fill","q":"There's a debate on ___ schools should ban phones.","answer":["whether"],"explain":"Sau giới từ *on* chỉ dùng **whether**, không dùng *if*.","src":"tr. 320"},{"type":"mcq","q":"(Is she married?) I wonder ___.","options":["if she is married","if is she married","is she married"],"answer":0,"explain":"Câu hỏi có/không → thêm **if**, rồi theo trật tự kể: *she is*.","src":"tr. 321"},{"type":"fix","wrong":"I don't know where does he work.","answer":["I don't know where he works."],"explain":"Bỏ *does*, chủ ngữ trước động từ, động từ chia theo *he* → **where he works**.","src":"tr. 321"},{"type":"fix","wrong":"Can you tell me what time is it?","answer":["Can you tell me what time it is?"],"explain":"Mệnh đề bên trong theo trật tự kể: **it is**. Dấu hỏi vẫn giữ vì câu lớn *Can you tell me…?* là câu hỏi.","src":"tr. 321"},{"type":"fix","wrong":"She is ill is obvious.","answer":["That she is ill is obvious.","It is obvious that she is ill.","It's obvious that she is ill.","It is obvious she is ill.","It's obvious she is ill."],"explain":"Mệnh đề làm chủ ngữ phải mở bằng **That**: *That she is ill is obvious.*","src":"tr. 321"},{"type":"fix","wrong":"The rumor he is leaving the company is false.","answer":["The rumor that he is leaving the company is false.","The rumour that he is leaving the company is false."],"explain":"Mệnh đề đứng sau danh từ *rumor* nói rõ nội dung tin đồn → phải giữ **that**.","src":"tr. 321"},{"type":"fill","q":"(How old is your grandmother?) I don't know how old ___.","answer":["your grandmother is"],"hint":"Viết phần còn lại của mệnh đề","explain":"Đổi câu hỏi thành mệnh đề: chủ ngữ *your grandmother* đứng trước *is*.","src":"tr. 321"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Do","you","know","where","the","nearest","bank","is?"],"explain":"Câu lớn hỏi *Do you know…?*, còn mệnh đề *where the nearest bank is* theo trật tự kể.","src":"tự soạn"}],"flashcards":[{"front":"Khi nào **được** bỏ that?","back":"Khi mệnh đề đứng **sau động từ** hoặc **sau tính từ**: We know (that) the world is round. · I'm glad (that) you came."},{"front":"Khi nào **phải giữ** that?","back":"Khi mệnh đề làm **chủ ngữ** hoặc đứng **sau danh từ**: **That** she lied is obvious. · the fact **that** she lied"},{"front":"Hai chỗ không dùng if (chỉ dùng whether)?","back":"**Đầu câu** (chủ ngữ) và **sau giới từ**: **Whether** we win isn't clear. · It depends on **whether** it rains."},{"front":"What did he say? → I couldn't hear ___","back":"I couldn't hear **what he said**. (bỏ did, he trước said)"},{"front":"Can you tell me where ___? (the station / is)","back":"Can you tell me where **the station is**?"},{"front":"Will it rain? → I wonder ___","back":"I wonder **if / whether it will rain**."}]}],"quiz":{"pass":0.8,"sets":[[{"type":"mcq","q":"Trong câu *She told me **that she was moving to Da Nang**.*, phần in đậm là gì?","options":["Tân ngữ của động từ told","Chủ ngữ của câu","Đồng cách cho một danh từ"],"answer":0,"explain":"Cô ấy nói với tôi **điều gì**? → rằng cô ấy sắp chuyển vào Đà Nẵng. Mệnh đề đứng sau động từ *told (me)* → **tân ngữ của động từ**.","src":"tr. 320"},{"type":"mcq","q":"___ you do in your free time is your own business.","options":["What","That","Which"],"answer":0,"explain":"*do* thiếu tân ngữ ('làm **gì**?') → **What** (những gì). *That* không lấp được chỗ trống; *Which* cần có sẵn các lựa chọn.","src":"tr. 319"},{"type":"fill","q":"I can't remember ___ I put my keys. (chỗ nào)","answer":["where"],"explain":"'chỗ nào' → **where**. Mệnh đề làm tân ngữ của *remember*.","src":"tr. 320"},{"type":"fill","q":"___ wins the race will get a gold medal. (Bất cứ ai)","answer":["Whoever"],"explain":"'Bất cứ ai' → **Whoever**. *Whoever wins the race* làm chủ ngữ cho *will get*.","src":"tr. 319"},{"type":"mcq","q":"We are worried about ___ the children will get home tonight.","options":["how","that","if"],"answer":0,"explain":"Sau giới từ *about* chỉ dùng nghi vấn từ hoặc whether → **how** (bằng cách nào). *that* và *if* không đứng sau giới từ.","src":"tr. 320"},{"type":"classify","q":"Phần in đậm làm chức năng gì trong câu?","buckets":["Chủ ngữ","Tân ngữ của động từ","Tân ngữ của giới từ","Bổ ngữ sau be","Đồng cách"],"items":[{"text":"**Why she left** is still a secret.","bucket":0},{"text":"Do you know **who broke the window**?","bucket":1},{"text":"It depends on **how much money we have**.","bucket":2},{"text":"The truth is **that I forgot**.","bucket":3},{"text":"The rumor **that the shop will close** is false.","bucket":4}],"explain":"Why she left: đầu câu, trước *is* → chủ ngữ. who broke the window: sau *know* → tân ngữ của động từ. how much money we have: sau *on* → tân ngữ của giới từ. that I forgot: sau *is* → bổ ngữ. that the shop will close: nói rõ nội dung *the rumor* → đồng cách.","src":"tr. 319–320"},{"type":"fill","q":"The question is ___ we will do next. (sẽ làm gì)","answer":["what"],"explain":"'làm **gì**' → **what**. Mệnh đề *what we will do next* làm bổ ngữ sau *is*.","src":"tr. 320"},{"type":"mcq","q":"Chọn câu đúng:","options":["I agree with what you said.","I agree with that you said.","I agree with you said."],"answer":0,"explain":"Sau giới từ *with* cần nghi vấn từ: **what** you said (điều bạn nói). *that* không theo sau giới từ; câu thứ ba thiếu từ mở đầu.","src":"tr. 320"},{"type":"fix","wrong":"This is not I ordered.","answer":["This is not what I ordered.","This isn't what I ordered."],"explain":"Sau *is* cần cụm danh từ 'món tôi đã gọi'; *ordered* thiếu tân ngữ → **what** I ordered.","src":"tr. 320"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["What","she","said","made","me","laugh."],"explain":"*What she said* (điều cô ấy nói) là chủ ngữ, rồi mới đến động từ chính *made*.","src":"tr. 319"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["They","are","talking","about","where","they","should","go."],"explain":"*where they should go* là tân ngữ của giới từ *about*; bên trong mệnh đề, *they* đứng trước *should go*.","src":"tr. 320"},{"type":"mcq","q":"Trong câu *The fact that he is rich doesn't impress me.*, mệnh đề danh ngữ là phần nào?","options":["that he is rich","The fact","he is rich doesn't impress me"],"answer":0,"explain":"**that he is rich** đứng sau danh từ *The fact* và nói rõ sự thật gì → mệnh đề đồng cách. Động từ chính của câu là *doesn't impress*.","src":"tr. 320"},{"type":"fill","q":"She was surprised by ___ much the tickets cost. (bao nhiêu)","answer":["how"],"explain":"'bao nhiêu (tiền)' → **how much**. Mệnh đề làm tân ngữ của giới từ *by*.","src":"tr. 320"},{"type":"mcq","q":"You can invite ___ you like. (bất cứ ai)","options":["whoever","whatever","whichever"],"answer":0,"explain":"'bất cứ **ai**' → **whoever**; *whatever* là 'bất cứ thứ gì', *whichever* là 'bất cứ cái nào (trong số đã nêu)'.","src":"tr. 319"},{"type":"classify","q":"Câu nào có mệnh đề danh ngữ (phần in đậm)?","buckets":["Có mệnh đề danh ngữ","Không (chỉ là cụm từ)"],"items":[{"text":"I know **the answer**.","bucket":1},{"text":"I know **what the answer is**.","bucket":0},{"text":"**Her smile** made me happy.","bucket":1},{"text":"**What she said** made me happy.","bucket":0},{"text":"He arrived **before lunch**.","bucket":1},{"text":"I wonder **why he is late**.","bucket":0}],"explain":"Mệnh đề phải có **chủ ngữ + động từ** riêng: what the answer **is**, what she **said**, why he **is** late. *the answer, her smile, before lunch* chỉ là cụm từ, không có động từ.","src":"tr. 319"},{"type":"mcq","q":"Câu nào dùng mệnh đề danh ngữ làm **chủ ngữ**?","options":["How he became rich is a mystery.","I don't know how he became rich.","We talked about how he became rich."],"answer":0,"explain":"Ở câu đầu, mệnh đề đứng đầu câu, trước động từ chính *is* → **chủ ngữ**. Câu hai: tân ngữ của *know*. Câu ba: tân ngữ của giới từ *about*.","src":"tr. 319"},{"type":"fill","q":"___ we need now is a good plan. (Điều mà)","answer":["What"],"explain":"'Điều mà' → **What**. *What we need now* làm chủ ngữ cho *is*.","src":"tr. 319"},{"type":"mcq","q":"I have no idea ___ this umbrella belongs to. (thuộc về ai)","options":["who","what","that"],"answer":0,"explain":"'thuộc về **ai**' → **who** (… belongs to). *what* chỉ vật, *that* không có nghĩa nghi vấn.","src":"tr. 320"},{"type":"fix","wrong":"Tell me you want for your birthday.","answer":["Tell me what you want for your birthday."],"explain":"*want* thiếu tân ngữ ('muốn **gì**?') → thêm **what**: Tell me **what** you want…","src":"tr. 320"},{"type":"mcq","q":"Câu nào có mệnh đề **đồng cách** (nói rõ nội dung một danh từ)?","options":["The idea that we could fly excited the kids.","The kids were excited about what they saw.","What the kids saw excited them."],"answer":0,"explain":"*that we could fly* đứng sau danh từ *The idea* và cho biết ý tưởng gì → **đồng cách**. Hai câu kia: tân ngữ của giới từ, và chủ ngữ.","src":"tr. 320"},{"type":"fill","q":"The teacher asked ___ had finished the test. (ai)","answer":["who"],"explain":"'**ai** đã làm xong' → **who**. Ở đây *who* chính là chủ ngữ của *had finished*.","src":"tr. 320"},{"type":"mcq","q":"This is ___ we met for the first time. (nơi)","options":["where","that","what"],"answer":0,"explain":"'nơi' → **where**. Mệnh đề *where we met…* làm bổ ngữ sau *is*.","src":"tr. 320"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["The","problem","is","that","we","don't","have","enough","time."],"explain":"*that we don't have enough time* đứng sau *is* → mệnh đề làm **bổ ngữ**.","src":"tr. 320"},{"type":"mcq","q":"Mệnh đề danh ngữ làm chủ ngữ được xem như **một việc**. Chọn động từ đúng: *That the prices are rising ___ everyone.*","options":["worries","worry","are worrying"],"answer":0,"explain":"Chủ ngữ là cả mệnh đề *That the prices are rising* (một việc), không phải *prices* → động từ chính chia số ít: **worries**. Đừng để chữ *prices* đánh lừa.","src":"tr. 319"},{"type":"mcq","q":"I wonder ___.","options":["where he has gone","where has he gone","where gone he has"],"answer":0,"explain":"Trật tự câu kể: chủ ngữ *he* trước trợ động từ *has*.","src":"tr. 321"},{"type":"mcq","q":"Do you know ___?","options":["what time the film starts","what time does the film start","what time starts the film"],"answer":0,"explain":"Bỏ *does*, chủ ngữ *the film* trước *starts* (thêm -s).","src":"tr. 321"},{"type":"fill","q":"(Is the museum open today?) Can you check ___ the museum is open today?","answer":["if","whether"],"explain":"Câu hỏi có/không sau động từ *check* → **if** hoặc **whether**.","src":"tr. 320"},{"type":"fill","q":"___ he will come back is uncertain. (Liệu… có… hay không)","answer":["Whether"],"explain":"Mệnh đề làm chủ ngữ ở đầu câu → chỉ dùng **Whether**, không dùng If.","src":"tr. 319"},{"type":"mcq","q":"There was a long discussion about ___ we should hire more staff.","options":["whether","if","that"],"answer":0,"explain":"Sau giới từ *about* chỉ dùng **whether**; *if* và *that* không theo sau giới từ.","src":"tr. 320"},{"type":"classify","q":"Trong mỗi câu, that có bỏ được không?","buckets":["Được bỏ that","Phải giữ that"],"items":[{"text":"She hopes **(that)** you'll visit.","bucket":0},{"text":"I'm sorry **(that)** I'm late.","bucket":0},{"text":"**That** prices are rising worries me.","bucket":1},{"text":"He made a promise **that** he would help.","bucket":1},{"text":"We noticed **(that)** the door was open.","bucket":0},{"text":"The belief **that** money brings happiness is wrong.","bucket":1}],"explain":"Sau động từ (hopes, noticed) và tính từ (sorry) → bỏ được. Đầu câu (That prices…) và sau danh từ (promise, belief) → phải giữ.","src":"tr. 321"},{"type":"fix","wrong":"The fact she is rich doesn't matter.","answer":["The fact that she is rich doesn't matter.","The fact that she is rich does not matter."],"explain":"Mệnh đề đứng sau danh từ *fact* → phải giữ **that**.","src":"tr. 321"},{"type":"fix","wrong":"I couldn't understand what was he saying.","answer":["I couldn't understand what he was saying.","I could not understand what he was saying."],"explain":"Trong mệnh đề danh ngữ không đảo: **he was** saying.","src":"tr. 321"},{"type":"fix","wrong":"If he is telling the truth is not clear.","answer":["Whether he is telling the truth is not clear.","Whether he is telling the truth isn't clear.","It is not clear whether he is telling the truth.","It isn't clear whether he is telling the truth.","It is not clear if he is telling the truth.","It isn't clear if he is telling the truth."],"explain":"Mệnh đề làm chủ ngữ không mở bằng *If* → đổi thành **Whether**.","src":"tr. 319"},{"type":"fill","q":"(Where did they go?) I have no idea where ___.","answer":["they went"],"hint":"Viết phần còn lại của mệnh đề","explain":"Bỏ *did*, chia động từ về quá khứ, chủ ngữ trước: **they went**.","src":"tr. 321"},{"type":"fill","q":"(How much does this jacket cost?) Could you tell me how much this jacket ___?","answer":["costs"],"explain":"Bỏ *does* → động từ chính phải tự mang -s: this jacket **costs**.","src":"tr. 321"},{"type":"mcq","q":"(Who called you last night?) Tell me ___.","options":["who called you last night","who did call you last night","who you called last night"],"answer":0,"explain":"*Who* đã là chủ ngữ của câu hỏi nên giữ nguyên trật tự: **who called you**. *who you called* đổi hẳn nghĩa (bạn gọi cho ai).","src":"tr. 321"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Could","you","tell","me","where","the","toilet","is?"],"explain":"Mệnh đề *where the toilet is* theo trật tự kể; dấu hỏi giữ vì câu lớn *Could you…?* là câu hỏi.","src":"tr. 321"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Nobody","knows","why","she","quit","her","job."],"explain":"*why she quit her job*: chủ ngữ *she* trước động từ *quit*, không có *did*.","src":"tr. 321"},{"type":"mcq","q":"Câu nào **sai**?","options":["The news he was sick shocked us.","It's important we arrive on time.","She said she would help."],"answer":0,"explain":"Mệnh đề sau danh từ *news* phải giữ **that**: *The news that he was sick…* Hai câu kia bỏ *that* sau tính từ (*important*) và động từ (*said*) là đúng.","src":"tr. 321"},{"type":"mcq","q":"Câu nào đúng?","options":["That he forgot my birthday hurt me.","He forgot my birthday hurt me.","If he forgot my birthday hurt me."],"answer":0,"explain":"Mệnh đề làm chủ ngữ phải mở bằng **That**; thiếu That hoặc dùng If đều sai.","src":"tr. 319–321"},{"type":"fill","q":"I'm not sure ___ she likes spicy food. (liệu… có… không)","answer":["if","whether"],"explain":"Câu hỏi có/không đứng sau tính từ *sure*, không phải đầu câu hay sau giới từ → **whether** (như ví dụ của sách) hoặc **if**.","src":"tr. 319"},{"type":"mcq","q":"(Has the parcel arrived?) Please find out ___.","options":["whether the parcel has arrived","whether has the parcel arrived","has the parcel arrived"],"answer":0,"explain":"Câu hỏi có/không → thêm **whether**, rồi chủ ngữ *the parcel* trước *has*.","src":"tr. 321"},{"type":"fix","wrong":"She asked me where was I going.","answer":["She asked me where I was going."],"explain":"Mệnh đề danh ngữ không đảo: **I was** going.","src":"tr. 321"},{"type":"mcq","q":"The result depends on ___ we work together.","options":["how well","if","that"],"answer":0,"explain":"Sau giới từ *on* chỉ dùng nghi vấn từ hoặc whether → **how well**. *if* và *that* không theo sau giới từ.","src":"tr. 320"},{"type":"classify","q":"Chỗ trống dùng được những từ nào?","buckets":["Dùng được if hoặc whether","Chỉ dùng whether"],"items":[{"text":"I wonder ___ she's at home.","bucket":0},{"text":"___ she's at home doesn't matter.","bucket":1},{"text":"We argued about ___ we should tell him.","bucket":1},{"text":"Ask him ___ he can drive.","bucket":0},{"text":"Do you know ___ the shop is open?","bucket":0},{"text":"There's no information about ___ the flight is delayed.","bucket":1}],"explain":"Sau động từ (wonder, ask, know) → if hoặc whether. Đầu câu (chủ ngữ) và sau giới từ (about) → chỉ **whether**.","src":"tr. 319–320"},{"type":"mcq","q":"Can you tell me ___?","options":["how I can get to the airport","how can I get to the airport","how can get I to the airport"],"answer":0,"explain":"Trật tự kể: chủ ngữ *I* trước *can get*.","src":"tr. 321"},{"type":"fill","q":"(Why was she crying?) Nobody knew why she ___ crying.","answer":["was"],"explain":"Trật tự kể: *she* **was** crying (không đảo *was she*).","src":"tr. 321"},{"type":"mcq","q":"Is it true ___ you're moving to Canada?","options":["that","what","whether"],"answer":0,"explain":"Mệnh đề nêu một điều được cho là sự thật, đầy đủ thành phần → **that**. *what* cần chỗ trống trong mệnh đề; *whether* không hợp với *Is it true…*","src":"tr. 320"},{"type":"fix","wrong":"I'm not sure what does this word mean.","answer":["I'm not sure what this word means.","I am not sure what this word means."],"explain":"Bỏ *does*, động từ chính mang -s: **this word means**.","src":"tr. 321"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Whether","we","win","or","not","is","not","important."],"answer":["Whether we win or not is not important.","Whether or not we win is not important."],"explain":"Mệnh đề *Whether we win or not* làm chủ ngữ; đầu câu phải dùng **Whether**.","src":"tr. 319"}],[{"type":"mcq","q":"Trong câu *I'm thinking about **what I should cook tonight**.*, phần in đậm là gì?","options":["Tân ngữ của giới từ about","Chủ ngữ của câu","Bổ ngữ sau be"],"answer":0,"explain":"Mệnh đề đứng ngay sau giới từ *about* → **tân ngữ của giới từ**. Lưu ý *am* ở đây là trợ động từ của *thinking*, mệnh đề không đứng sau *be*.","src":"tr. 320"},{"type":"mcq","q":"___ she wants for her birthday is a new laptop.","options":["What","That","Whether"],"answer":0,"explain":"*wants* thiếu tân ngữ ('muốn **gì**?') → **What** (thứ mà). *That* không lấp chỗ trống; *Whether* là 'liệu… hay không', sai nghĩa.","src":"tr. 319"},{"type":"fill","q":"I don't understand ___ this machine works. (cách)","answer":["how"],"explain":"'cách' → **how**. Mệnh đề làm tân ngữ của *understand*.","src":"tr. 320"},{"type":"fill","q":"Take ___ you need from the fridge. (bất cứ thứ gì)","answer":["whatever"],"explain":"'bất cứ thứ gì' → **whatever**. Mệnh đề làm tân ngữ của *take*.","src":"tr. 319–320"},{"type":"classify","q":"Phần in đậm làm chức năng gì trong câu?","buckets":["Chủ ngữ","Tân ngữ của động từ","Tân ngữ của giới từ","Bổ ngữ sau be","Đồng cách"],"items":[{"text":"**What happened next** surprised everyone.","bucket":0},{"text":"I didn't hear **what the teacher said**.","bucket":1},{"text":"She's proud of **what her son has done**.","bucket":2},{"text":"My hope is **that you will come back soon**.","bucket":3},{"text":"The story **that he was a spy** was untrue.","bucket":4},{"text":"**How you dress** matters at an interview.","bucket":0}],"explain":"Đầu câu, trước động từ chính → chủ ngữ (What happened next, How you dress). Sau *hear* → tân ngữ của động từ. Sau *of* → tân ngữ của giới từ. Sau *is* → bổ ngữ. Ngay sau *The story*, nói rõ câu chuyện gì → đồng cách.","src":"tr. 319–320"},{"type":"mcq","q":"I'm sorry about ___ I said yesterday.","options":["what","that","which"],"answer":0,"explain":"Sau giới từ *about*, *said* thiếu tân ngữ → **what** (những điều). *that* không theo sau giới từ.","src":"tr. 320"},{"type":"mcq","q":"Câu nào dùng mệnh đề danh ngữ làm **bổ ngữ sau be**?","options":["The problem is that nobody listens.","Nobody listens to what I say.","That nobody listens is a problem."],"answer":0,"explain":"Câu đầu: mệnh đề đứng sau *is* → **bổ ngữ**. Câu hai: tân ngữ của giới từ *to*. Câu ba: chủ ngữ.","src":"tr. 320"},{"type":"fill","q":"That's exactly ___ I wanted to say! (điều)","answer":["what"],"explain":"'điều mà' → **what**. Mệnh đề làm bổ ngữ sau *is* ('s).","src":"tr. 320"},{"type":"fix","wrong":"That she cooked was delicious.","answer":["What she cooked was delicious."],"explain":"*cooked* thiếu tân ngữ ('nấu **món gì**?') → **What** she cooked (những món cô ấy nấu).","src":"tr. 319"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["How","the","fire","started","is","still","unknown."],"explain":"*How the fire started* là chủ ngữ, rồi mới đến *is*.","src":"tr. 319"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I'm","not","interested","in","what","he","thinks."],"explain":"*what he thinks* là tân ngữ của giới từ *in*.","src":"tr. 320"},{"type":"classify","q":"Phần in đậm có phải mệnh đề danh ngữ không?","buckets":["Có mệnh đề danh ngữ","Không (chỉ là cụm từ)"],"items":[{"text":"I believe **you**.","bucket":1},{"text":"I believe **that you are honest**.","bucket":0},{"text":"**The man in the car** is my uncle.","bucket":1},{"text":"**Who called me last night** is still a mystery.","bucket":0},{"text":"She left **after the party**.","bucket":1},{"text":"She asked **when the party would end**.","bucket":0}],"explain":"Mệnh đề có chủ ngữ + động từ riêng: that you **are** honest, who **called** me, when the party **would end**. Các phần còn lại chỉ là đại từ hoặc cụm từ.","src":"tr. 319"},{"type":"mcq","q":"Câu nào dùng mệnh đề danh ngữ làm **tân ngữ của giới từ**?","options":["We're excited about where we're going on holiday.","Where we're going on holiday is a secret.","I can't tell you where we're going on holiday."],"answer":0,"explain":"Câu đầu: mệnh đề đứng sau giới từ *about*. Câu hai: chủ ngữ. Câu ba: tân ngữ của động từ *tell*.","src":"tr. 320"},{"type":"mcq","q":"Can you guess ___ this photo was taken? (khi nào)","options":["when","that","what"],"answer":0,"explain":"'khi nào' → **when**. Mệnh đề làm tân ngữ của *guess*.","src":"tr. 320"},{"type":"fill","q":"We heard the news ___ our flight was delayed.","answer":["that"],"explain":"Mệnh đề nói rõ nội dung *the news* → mệnh đề đồng cách mở bằng **that**, và sau danh từ thì không được bỏ that.","src":"tr. 320–321"},{"type":"mcq","q":"Câu nào có mệnh đề **đồng cách**?","options":["Her claim that she was at home is false.","She claimed that she was at home.","What she claimed is false."],"answer":0,"explain":"*that she was at home* đứng sau danh từ *Her claim* và nói rõ lời khẳng định đó → **đồng cách**. Câu hai: tân ngữ của động từ *claimed*. Câu ba: chủ ngữ.","src":"tr. 320"},{"type":"fill","q":"___ caused the accident is still being investigated. (Điều gì)","answer":["What"],"explain":"'Điều gì' → **What**. *What* làm chủ ngữ của *caused*, cả mệnh đề làm chủ ngữ của *is being investigated*.","src":"tr. 319"},{"type":"mcq","q":"Từ nào **không** dùng để mở đầu mệnh đề danh ngữ?","options":["because","whether","whoever"],"answer":0,"explain":"**because** mở mệnh đề chỉ nguyên nhân (trạng ngữ), không có trong danh sách từ mở đầu mệnh đề danh ngữ. *whether* và *whoever* đều có.","src":"tr. 319"},{"type":"fix","q":"Sửa câu (nghĩa: Chúng tôi không thống nhất được tối nay **ăn gì**):","wrong":"We can't agree on we should eat tonight.","answer":["We can't agree on what we should eat tonight.","We cannot agree on what we should eat tonight."],"explain":"Sau giới từ *on* phải có từ mở đầu; *eat* thiếu tân ngữ ('ăn **gì**') → **what**.","src":"tr. 320"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["My","biggest","fear","is","that","I","will","forget","my","lines."],"explain":"*that I will forget my lines* đứng sau *is* → bổ ngữ cho chủ ngữ *My biggest fear*.","src":"tr. 320"},{"type":"mcq","q":"Show me ___ you bought at the market.","options":["what","that","which"],"answer":0,"explain":"*bought* thiếu tân ngữ → **what** (những thứ). *that / which* không tự lấp chỗ trống khi không có danh từ đứng trước.","src":"tr. 320"},{"type":"fill","q":"Do you know ___ car this is? (của ai)","answer":["whose"],"explain":"'của ai' → **whose** + danh từ: whose car.","src":"tr. 319"},{"type":"mcq","q":"The teacher explained ___ the experiment worked.","options":["how","what","that how"],"answer":0,"explain":"'**cách** thí nghiệm hoạt động' → **how**. *what the experiment worked* sai vì *worked* không cần tân ngữ; *that how* thừa từ.","src":"tr. 320"},{"type":"classify","q":"Từ nào có thể mở đầu mệnh đề danh ngữ?","buckets":["Mở đầu mệnh đề danh ngữ","Không"],"items":[{"text":"that","bucket":0},{"text":"whether","bucket":0},{"text":"whoever","bucket":0},{"text":"whichever","bucket":0},{"text":"because","bucket":1},{"text":"although","bucket":1},{"text":"but","bucket":1}],"explain":"Danh sách của sách: that, how, who, whoever, whom, whomever, whose, what, whatever, which, whichever, where, when, why, whether, if. *because, although* mở mệnh đề trạng ngữ; *but* là liên từ nối ngang hàng.","src":"tr. 319"},{"type":"mcq","q":"Mệnh đề danh ngữ làm chủ ngữ được xem như **một việc**. Chọn động từ đúng: *Whether the twins can come ___ unclear.*","options":["is","are","were being"],"answer":0,"explain":"Chủ ngữ là cả mệnh đề *Whether the twins can come* (một việc), không phải *the twins* → **is**.","src":"tr. 319"},{"type":"mcq","q":"I don't remember ___.","options":["where I left my glasses","where did I leave my glasses","where left I my glasses"],"answer":0,"explain":"Bỏ *did*, chia động từ quá khứ: **I left**.","src":"tr. 321"},{"type":"fill","q":"(Did he lock the door?) I'm not sure ___ he locked the door.","answer":["if","whether"],"explain":"Câu hỏi có/không sau tính từ *sure* → **whether** hoặc **if**.","src":"tr. 319"},{"type":"fill","q":"___ the plan will work depends on the weather. (Liệu… có… hay không)","answer":["Whether"],"explain":"Mệnh đề làm chủ ngữ → chỉ dùng **Whether**.","src":"tr. 319"},{"type":"mcq","q":"I'm worried about ___ I passed the exam.","options":["whether","if","that"],"answer":0,"explain":"Sau giới từ *about* chỉ dùng **whether**; *if* và *that* không theo sau giới từ.","src":"tr. 320"},{"type":"classify","q":"Trong mỗi câu, that có bỏ được không?","buckets":["Được bỏ that","Phải giữ that"],"items":[{"text":"He told me **(that)** he was hungry.","bucket":0},{"text":"I'm surprised **(that)** you remembered.","bucket":0},{"text":"**That** she won the prize amazed us.","bucket":1},{"text":"The suggestion **that** we leave early was ignored.","bucket":1},{"text":"We agreed **(that)** the price was fair.","bucket":0},{"text":"There is evidence **that** he was there.","bucket":1}],"explain":"Sau động từ (told, agreed) và tính từ (surprised) → bỏ được. Đầu câu (That she won…) và sau danh từ (suggestion, evidence) → phải giữ.","src":"tr. 321"},{"type":"fix","wrong":"The news she had a baby surprised everyone.","answer":["The news that she had a baby surprised everyone."],"explain":"Mệnh đề đứng sau danh từ *news* → phải giữ **that**.","src":"tr. 321"},{"type":"fix","wrong":"Do you know how old is she?","answer":["Do you know how old she is?"],"explain":"Mệnh đề bên trong theo trật tự kể: **she is**.","src":"tr. 321"},{"type":"fix","wrong":"I'm thinking about if I should quit my job.","answer":["I'm thinking about whether I should quit my job.","I am thinking about whether I should quit my job."],"explain":"Sau giới từ *about* không dùng *if* → **whether**.","src":"tr. 320"},{"type":"fill","q":"(What did she order?) I don't know what she ___.","answer":["ordered"],"explain":"Bỏ *did*, động từ chính chuyển sang quá khứ: she **ordered**.","src":"tr. 321"},{"type":"fill","q":"(Where is the post office?) Excuse me, do you know where the post office ___?","answer":["is"],"explain":"Trật tự kể: chủ ngữ *the post office* trước *is*.","src":"tr. 321"},{"type":"mcq","q":"(What happened at the meeting?) Nobody told me ___.","options":["what happened at the meeting","what did happen at the meeting","what the meeting happened"],"answer":0,"explain":"*What* là chủ ngữ của câu hỏi gốc nên giữ nguyên: **what happened**. Không thêm *did*.","src":"tr. 321"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["I","wonder","how","long","the","journey","will","take."],"explain":"*how long the journey will take*: chủ ngữ *the journey* trước *will take*.","src":"tr. 321"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["Can","you","tell","me","why","you","were","late?"],"explain":"*why you were late*: *you* trước *were*; dấu hỏi giữ vì câu lớn *Can you…?* là câu hỏi.","src":"tr. 321"},{"type":"mcq","q":"Câu nào **sai**?","options":["He doesn't like his job is clear.","We realized we were lost.","I'm afraid I can't help."],"answer":0,"explain":"Mệnh đề làm chủ ngữ phải mở bằng **That**: *That he doesn't like his job is clear.* Hai câu kia bỏ *that* sau động từ (*realized*) và tính từ (*afraid*) là đúng.","src":"tr. 321"},{"type":"mcq","q":"Câu nào đúng?","options":["Whether he likes it or not doesn't matter.","If he likes it or not doesn't matter.","He likes it or not doesn't matter."],"answer":0,"explain":"Đầu câu (chủ ngữ) chỉ dùng **Whether**.","src":"tr. 319"},{"type":"fill","q":"Ask the waiter ___ they have a table for four. (liệu… có… không)","answer":["if","whether"],"explain":"Sau động từ *ask* → **if** hoặc **whether**.","src":"tr. 320"},{"type":"mcq","q":"(Does she speak French?) Do you know ___?","options":["if she speaks French","if does she speak French","does she speak French"],"answer":0,"explain":"Thêm **if**, bỏ *does*, động từ mang -s: **she speaks**.","src":"tr. 321"},{"type":"fix","wrong":"Tell me what are you doing.","answer":["Tell me what you are doing.","Tell me what you're doing."],"explain":"Trật tự kể: **you are** doing.","src":"tr. 321"},{"type":"mcq","q":"Your success depends on ___ hard you work.","options":["how","if","that"],"answer":0,"explain":"Sau giới từ *on* → nghi vấn từ **how** (hard): bạn làm chăm đến mức nào. *if* và *that* không theo sau giới từ.","src":"tr. 320"},{"type":"classify","q":"Chỗ trống dùng được những từ nào?","buckets":["Dùng được if hoặc whether","Chỉ dùng whether"],"items":[{"text":"Let me know ___ you can come.","bucket":0},{"text":"___ you can come is up to you.","bucket":1},{"text":"It all depends on ___ the bank agrees.","bucket":1},{"text":"She asked ___ I was married.","bucket":0},{"text":"We're not sure ___ the tickets are still available.","bucket":0},{"text":"I'm curious about ___ he'll say yes.","bucket":1}],"explain":"Sau động từ (know, asked) và tính từ (sure) → if hoặc whether. Đầu câu và sau giới từ (on, about) → chỉ **whether**.","src":"tr. 319–320"},{"type":"mcq","q":"I'd love to know ___.","options":["what you think of my idea","what do you think of my idea","what think you of my idea"],"answer":0,"explain":"Bỏ *do*, chủ ngữ *you* trước *think*.","src":"tr. 321"},{"type":"fill","q":"(How many people were there?) Do you know how many people ___ there?","answer":["were"],"explain":"Trật tự kể: *how many people* **were** there (không đảo *were there*).","src":"tr. 321"},{"type":"mcq","q":"I'm glad ___ you like the present.","options":["that","what","whether"],"answer":0,"explain":"Sau tính từ *glad* dùng mệnh đề **that** (và có thể bỏ that). *what* cần chỗ trống trong mệnh đề; *whether* sai nghĩa.","src":"tr. 320"},{"type":"fix","wrong":"I asked him where did he buy his shoes.","answer":["I asked him where he bought his shoes."],"explain":"Bỏ *did*, động từ về quá khứ, chủ ngữ trước: **he bought**.","src":"tr. 321"},{"type":"order","q":"Sắp xếp thành câu đúng:","words":["That","he","was","lying","was","obvious","to","everyone."],"explain":"Mệnh đề *That he was lying* làm chủ ngữ nên phải giữ **That**.","src":"tr. 321"}]]}},{"id":"02-menh-de-quan-he","title":"Mệnh đề quan hệ","en":"Relative clauses","icon":"🔗","pages":"323–345","summary":"Mệnh đề quan hệ (relative clause) là phần 'mà…' gắn sau danh từ để cho biết người/vật nào, hoặc nói thêm về nó: the man **who lives next door**. Chủ đề này dạy bạn chọn đúng who, whom, which, that, whose, where, when, why; khi nào bỏ được đại từ; đặt giới từ đúng chỗ; phân biệt mệnh đề có dấu phẩy và không có dấu phẩy; và rút gọn mệnh đề thành V-ing, V3, cụm danh từ, cụm giới từ, to-V.","mindmap":{"label":"Mệnh đề quan hệ","children":[{"label":"Đại từ quan hệ","icon":"👤","children":[{"label":"who / whom: người"},{"label":"which: vật"},{"label":"that: cả hai"},{"label":"whose + N: sở hữu"}]},{"label":"that và lược bỏ","icon":"✂️","children":[{"label":"that: người + vật, so sánh nhất"},{"label":"Bỏ đại từ tân ngữ"}]},{"label":"Trạng từ quan hệ","icon":"📍","children":[{"label":"where = in/at which"},{"label":"when = on/at/in which"},{"label":"why = for which"}]},{"label":"Giới từ","icon":"🧲","children":[{"label":"with whom / who … with"},{"label":"Không: about who, for that"},{"label":"many of whom, none of which"}]},{"label":"Hai loại","icon":"🏷️","children":[{"label":"Xác định: không phẩy"},{"label":"Không xác định: có phẩy, không that"},{"label":", which = điều đó"}]},{"label":"Rút gọn","icon":"🎒","children":[{"label":"V-ing: chủ động"},{"label":"V3: bị động"},{"label":"Cụm danh từ, cụm giới từ"},{"label":"to-V: the first, mục đích"}]}]},"lessons":[{"id":"02a","title":"Who, which, that, whose: chọn đại từ quan hệ","minutes":25,"goal":"Hiểu mệnh đề quan hệ là gì; chọn đúng who/whom cho người, which cho vật, that cho cả hai, whose cho sở hữu; gộp hai câu mà không lặp lại đại từ.","pretest":[{"type":"mcq","q":"I have a friend ___ lives in Paris.","options":["who","which","whose"],"answer":0,"explain":"friend là **người**, chỗ trống làm chủ ngữ của lives → **who**. which dùng cho vật; whose phải có danh từ theo sau.","src":"tự soạn"},{"type":"mcq","q":"This is the phone ___ I bought yesterday.","options":["which","who","whose"],"answer":0,"explain":"phone là **vật** → **which**. who chỉ dùng cho người.","src":"tự soạn"},{"type":"mcq","q":"Chọn câu đúng:","options":["The man who he lives next door is a doctor.","The man who lives next door is a doctor."],"answer":1,"explain":"**who** đã thay cho *he*, nên không lặp lại *he* nữa.","src":"tr. 326"}],"hook":{"icon":"🔗","text":"Tiếng Việt nói: 'người đàn ông **mà** tôi gặp hôm qua', 'cái điện thoại **mà** tôi mua'. Chỉ một chữ **mà** cho mọi thứ. Tiếng Anh có cả một bộ 'chữ mà': **who** cho người, **which** cho vật, **that** cho cả hai, **whose** cho 'của người/vật đó'. Phần đứng sau chữ 'mà' gọi là **mệnh đề quan hệ**: nó như một cái **móc**, gắn thêm thông tin vào danh từ đứng ngay trước nó."},"diagram":{"type":"flow","title":"Chọn đại từ quan hệ","start":{"q":"Ý là 'của người/vật đó' + danh từ?","branches":[{"label":"Có","to":{"result":"whose + N: a girl whose hair…","icon":"🔑"}},{"label":"Không","to":{"q":"Danh từ phía trước là gì?","branches":[{"label":"Người","to":{"result":"who / that (tân ngữ: cả whom)","icon":"👤"}},{"label":"Vật, con vật, sự việc","to":{"result":"which / that","icon":"📦"}}]}}]}},"chunks":[{"title":"Mệnh đề quan hệ và who/whom","icon":"👤","rule":"Mệnh đề quan hệ đứng **ngay sau** danh từ nó bổ nghĩa. Với **người**, dùng **who** (làm chủ ngữ hoặc tân ngữ); **whom** chỉ làm **tân ngữ**, dùng trong lối văn **trang trọng**.","explain":"Mệnh đề quan hệ (relative clause), còn gọi là mệnh đề tính ngữ (adjective clause), là một mệnh đề phụ dùng như một tính từ dài: nó cho biết *người nào, vật nào*. Nó được mở đầu bằng đại từ quan hệ (relative pronoun) *who, whom, which, whose, that* hoặc trạng từ quan hệ *where, when, why* (học ở bài 02b).\n**Chủ ngữ** (subject) là người làm hành động; **tân ngữ** (object) là người chịu hành động. Trong *people **who** already have computer skills*, who là chủ ngữ của *have*. Trong *the people **who** we met in Italy*, who là tân ngữ của *met* (we mới là chủ ngữ). Ở vị trí tân ngữ có thể dùng **whom**, nhưng whom nghe trang trọng.","formula":"N (người) + who + V …   (who = chủ ngữ)\nN (người) + who/whom + S + V …   (who/whom = tân ngữ)","examples":[{"en":"We only employ people **who** already have computer skills.","vi":"Chúng tôi chỉ tuyển những người đã giỏi vi tính."},{"en":"Do you remember the people **who** we met in Italy?","vi":"Anh có nhớ những người mà chúng ta đã gặp ở Ý không?"},{"en":"He's one of the scientists **whom** I admire most.","vi":"Ông ấy là một trong những nhà khoa học mà tôi ngưỡng mộ nhất."},{"en":"I have a friend which lives in London.","ok":false,"note":"người → who, không dùng which"}],"mistake":{"wrong":"The girl which sits next to me is from Hue.","right":"The girl who sits next to me is from Hue.","why":"girl là người → **who** (hoặc that), không dùng which."},"tip":"**Who** là 'ai?' → dùng cho **người**. **Whom** = who trang trọng, chỉ đứng ở chỗ **tân ngữ**.","src":"tr. 323","check":{"type":"mcq","q":"He's the doctor ___ saved my life.","options":["who","which","whom"],"answer":0,"explain":"doctor là người, chỗ trống là **chủ ngữ** của saved → **who**. whom chỉ làm tân ngữ; which dùng cho vật.","src":"tự soạn"}},{"title":"which cho vật, that cho cả hai","icon":"📦","rule":"**which** thay cho **vật, con vật, sự việc**; **that** thay được cho cả người lẫn vật (thay who, whom, which) trong mệnh đề quan hệ **xác định**.","explain":"which cũng làm được cả chủ ngữ (*a book **which** will interest children*) lẫn tân ngữ (*the accident **which** Daniel saw*).\n**that** là chữ 'mà' đa năng nhất, nhưng có một giới hạn: nó chỉ dùng trong mệnh đề quan hệ **xác định** (defining relative clause), tức mệnh đề cần thiết để biết đang nói người/vật nào, **không có dấu phẩy**. Khi mệnh đề nằm giữa dấu phẩy (*My cat Molly, **which** I recently bought, …*) thì không dùng that. Bài 02d sẽ học kỹ hai loại mệnh đề này.","formula":"N (vật) + which/that + …\nN (người) + who/that + …","examples":[{"en":"It's a book **which** will interest children of all ages.","vi":"Đây là loại sách sẽ thu hút trẻ em mọi lứa tuổi."},{"en":"This is the key **which/that** opens the garage.","vi":"Đây là chìa khóa mở ga-ra."},{"en":"The people **who/that** own that house are away on holiday.","vi":"Chủ nhân của ngôi nhà đó đang đi nghỉ."},{"en":"The film **which/that** we saw last night was great.","vi":"Bộ phim chúng tôi xem tối qua rất hay."},{"en":"My cat Molly, that I recently bought, is a tri-colored cat.","ok":false,"note":"có dấu phẩy → which, không dùng that"}],"mistake":{"wrong":"Where is the cake who I made?","right":"Where is the cake which/that I made?","why":"cake là vật → which hoặc that; **who** chỉ dùng cho người."},"tip":"**Which**: vật (cái nào?). **That**: ai cũng được, nhưng **sợ dấu phẩy**.","src":"tr. 323–324","check":{"type":"fill","q":"An elephant is an animal ___ lives in hot countries.","answer":["which","that"],"explain":"animal là con vật, chỗ trống làm chủ ngữ của lives → **which** hoặc **that**.","src":"tr. 324"}},{"title":"whose: của người/vật đó","icon":"🔑","rule":"**whose + danh từ** chỉ sự **sở hữu**, thay cho **his, her, its, their**; dùng cho cả người lẫn vật.","explain":"Gộp *I saw a girl. **Her** hair came down to her waist.* → her hair thành **whose hair**: *I saw a girl **whose hair** came down to her waist.* whose luôn có **một danh từ đi ngay sau** (whose door, whose name, whose dog). Cụm *whose + N* có thể làm chủ ngữ (*whose door is painted red*), tân ngữ (*whose opinion I respect*) hay tân ngữ của giới từ (*whose dog I'm looking after*).\nVới **vật**, sách cho thêm cách viết thay whose: **of which** hoặc **that … of**: *a book **of which** I've forgotten **the name*** = *a book **that** I've forgotten the name **of***. Nhưng với **người** thì **k
